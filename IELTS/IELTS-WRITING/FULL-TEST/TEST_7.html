<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IELTS Academic Writing Practice Test 7</title>
<style>
:root{
  --navy:#123d6a; --blue:#1f5f9e; --blue2:#eaf3fb; --ink:#172033; --muted:#5f6b7a;
  --line:#d8e0e8; --paper:#fff; --bg:#f2f5f8; --warn:#a14a00; --danger:#a32626;
  --success:#237a45; --shadow:0 14px 35px rgba(15,45,75,.13); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #f2b544;outline-offset:2px}
.hidden{display:none!important}
.screen{min-height:100vh}
.app-shell{max-width:1240px;margin:0 auto;padding:24px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.brand-mark{width:48px;height:48px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:var(--shadow)}
.brand h1{font-size:clamp(24px,3vw,36px);line-height:1.08;margin:0;color:var(--navy)}
.brand p{margin:5px 0 0;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.start-card{padding:clamp(20px,4vw,38px)}
.section-title{font-size:20px;margin:0 0 14px;color:var(--navy)}
.test-grid{display:grid;grid-template-columns:minmax(260px,520px);justify-content:center;gap:14px;margin:14px 0 26px}
.test-option{border:2px solid var(--line);border-radius:14px;background:#fff;padding:18px;text-align:left;min-height:132px;transition:.15s transform,.15s border-color,.15s background}
.test-option:hover{transform:translateY(-2px);border-color:#8bb4da}
.test-option.selected{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 3px rgba(31,95,158,.12)}
.test-option .test-no{display:block;font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px}
.test-option .test-date{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:#fff;border:1px solid #bcd2e6;border-radius:999px;padding:3px 9px;margin-bottom:10px}
.test-option .test-short{display:block;color:var(--muted);font-size:14px;line-height:1.4}
.form-row{display:grid;grid-template-columns:1fr;gap:8px;margin:20px 0}
label{font-weight:700;color:var(--navy)}
.text-input{width:100%;padding:14px 15px;border:1px solid #abb8c5;border-radius:10px;background:#fff}
.confirm-row{display:flex;align-items:flex-start;gap:10px;margin:16px 0 22px;line-height:1.45}
.confirm-row input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.instructions{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}
.instructions ul{margin:8px 0 0;padding-left:21px;line-height:1.65}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#0c3157}
.btn-secondary{background:#e9f1f8;color:var(--navy);border:1px solid #b9cfe2}
.btn-secondary:hover{background:#dceaf5}
.btn-danger{background:#f9e7e7;color:#8b2020;border:1px solid #e8bcbc}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.form-error{color:var(--danger);font-weight:700;margin-top:10px;min-height:22px}
.storage-warning{background:#fff2df;border:1px solid #e8c38d;color:#74420b;border-radius:10px;padding:12px;margin-top:12px}

/* Exam */
.exam-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 15px rgba(15,45,75,.08)}
.exam-header-inner{max-width:1500px;margin:auto;padding:10px 18px;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center}
.candidate{min-width:0}.candidate strong{color:var(--navy)}.candidate span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-box{font-variant-numeric:tabular-nums;font-size:26px;font-weight:900;color:var(--navy);background:#eef4f9;border:1px solid #c8d8e6;border-radius:10px;padding:8px 15px;min-width:118px;text-align:center}
.timer-box.warning{color:var(--warn);background:#fff4e4;border-color:#e8bd78}.timer-box.critical{color:#fff;background:var(--danger);border-color:var(--danger)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.header-actions .btn{min-height:42px;padding:9px 13px}
.exam-wrap{max-width:1500px;margin:auto;padding:16px 18px 30px}
.task-tabs{display:flex;gap:10px;margin-bottom:14px}
.task-tab{flex:0 0 auto;border:1px solid #aec1d2;background:#fff;color:var(--navy);font-weight:800;border-radius:10px;padding:12px 22px}
.task-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;min-height:calc(100vh - 160px)}
.question-pane,.writing-pane{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(15,45,75,.08);padding:22px;min-width:0}
.question-pane{overflow:auto;max-height:calc(100vh - 172px)}
.task-kicker{font-size:14px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.05em}
.question-pane h2{margin:8px 0 16px;color:var(--navy)}
.question-text{font-size:18px;line-height:1.65;font-weight:600;white-space:pre-wrap}
.word-instruction{font-weight:800;margin:18px 0;color:var(--navy)}
.visual-frame{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-top:15px}
.task-image{display:block;width:100%;height:auto;max-width:100%;object-fit:contain;object-position:center;margin:auto}
.image-actions{display:flex;justify-content:center;margin-top:10px}
.writing-pane{display:flex;flex-direction:column;min-height:600px}
.writing-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.writing-top h2{margin:0;color:var(--navy)}
.word-counter{font-weight:900;color:var(--danger);font-variant-numeric:tabular-nums}
.word-counter.ok{color:var(--success)}
.essay-box{width:100%;flex:1;min-height:520px;resize:vertical;border:1px solid #9faebc;border-radius:10px;padding:17px;font-size:18px;line-height:1.62;background:#fff;color:#111}
.save-status{font-size:13px;color:var(--muted);text-align:right;margin-top:8px;min-height:18px}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(6,20,34,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-dialog{width:min(1000px,96vw);max-height:94vh;background:#fff;border-radius:16px;box-shadow:0 25px 65px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.modal-dialog.small{width:min(620px,96vw)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#f7f9fb}
.modal-head h2{margin:0;color:var(--navy);font-size:22px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:25px;line-height:1}
.modal-body{padding:20px;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fafbfc}
.outline-tabs{display:flex;gap:8px;margin-bottom:16px;position:sticky;top:-20px;background:#fff;padding:5px 0 12px;z-index:2}
.outline-tab{border:1px solid #b8c8d7;background:#fff;color:var(--navy);border-radius:9px;padding:10px 16px;font-weight:800}
.outline-tab.active{background:var(--navy);color:#fff}
.outline-content{line-height:1.58}
.outline-content h2{color:var(--navy);border-bottom:2px solid #d9e5ef;padding-bottom:8px}
.outline-content h3{color:#164f83;margin:22px 0 9px}
.outline-content ul{margin:8px 0 12px;padding-left:24px}
.outline-content li{margin:6px 0}
.outline-callout{border-left:4px solid var(--blue);background:#eef5fb;border-radius:8px;padding:13px 15px;margin:10px 0 17px}
.outline-callout-label{font-weight:900;color:var(--navy);margin-bottom:6px}
.outline-table-wrap{overflow:auto}.outline-table{border-collapse:collapse;width:100%}.outline-table td{border:1px solid var(--line);padding:9px}
.submit-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.stat{background:#f3f6f9;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.stat strong{display:block;font-size:20px;color:var(--navy)}
.warning-list{background:#fff2e6;border:1px solid #ebc08e;border-radius:10px;padding:13px 15px;color:#7a430b;line-height:1.55}

/* Image viewer */
.image-modal{background:#101820}
.image-viewer-dialog{position:relative;width:97vw;height:96vh;background:#111b24;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.image-toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#182635;border-bottom:1px solid #385068}
.image-toolbar .btn{min-height:40px;padding:8px 13px;background:#fff;color:#17324c}
.image-stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#0c141c;display:flex;align-items:center;justify-content:center}
.image-stage.dragging{cursor:grabbing}
.zoom-image{max-width:90%;max-height:88%;width:auto;height:auto;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-drag:none;will-change:transform}

/* Results */
.result-wrap{max-width:1050px;margin:0 auto;padding:24px}
.result-card{padding:clamp(20px,4vw,38px)}
.result-title{text-align:center;color:var(--navy);margin-top:0}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.meta-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8fafc}.meta-item span{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.meta-item strong{word-break:break-word}
.response-section{margin:26px 0;border-top:2px solid #d8e4ee;padding-top:20px}
.response-section h2{color:var(--navy)}
.result-question{background:#eef4f9;border-radius:10px;padding:14px;line-height:1.55;font-weight:700}
.result-answer{white-space:pre-wrap;line-height:1.7;border:1px solid var(--line);border-radius:10px;padding:16px;min-height:100px;background:#fff}
.notice{background:#fff8df;border:1px solid #e8cf78;border-radius:10px;padding:14px;line-height:1.55;margin:20px 0}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;background:#17283a;color:#fff;border-radius:10px;padding:12px 18px;box-shadow:var(--shadow);font-weight:700;max-width:min(90vw,650px);text-align:center}

@media(max-width:980px){
  .test-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .exam-header-inner{grid-template-columns:1fr auto}.header-actions{grid-column:1/-1;justify-content:flex-start}
  .exam-grid{grid-template-columns:1fr;min-height:auto}.question-pane{max-height:none}.essay-box{min-height:470px}.writing-pane{min-height:560px}
  .meta-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .app-shell,.result-wrap{padding:12px}.start-card,.result-card{padding:18px}.test-grid{grid-template-columns:1fr}
  .actions .btn{width:100%}.exam-header-inner{padding:8px 10px;gap:8px}.candidate{font-size:13px}.timer-box{font-size:21px;min-width:98px;padding:7px 9px}
  .header-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.header-actions .btn{width:100%}
  .exam-wrap{padding:10px}.task-tabs{display:grid;grid-template-columns:1fr 1fr}.task-tab{width:100%;padding:11px}
  .question-pane,.writing-pane{padding:16px}.question-text{font-size:16px}.essay-box{font-size:16px;min-height:430px}
  .submit-summary{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-body{padding:15px}.modal-foot .btn{width:100%}
}
@media print{
  body{background:#fff}.result-wrap{max-width:none;padding:0}.result-card{border:0;box-shadow:none;padding:0}.result-actions,.toast,.brand-mark{display:none!important}.brand{margin-bottom:8px}.notice{font-size:12px}.response-section{break-inside:avoid}
}
</style>
</head>

</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

iếp tục tăng lên 150 nghìn vào 2007.</li>\n  <li><strong>Detail 3:</strong> Science Museums tăng từ 70 lên 100 rồi 130 nghìn, thu hẹp khoảng cách với Art Museums từ 30 xuống 20 nghìn.</li>\n  <li><strong>Direct comparison:</strong> cả hai tăng đúng 30 nghìn trong giai đoạn 1998–2007.</li>\n</ul>\n<div class=\"outline-callout\">\n  <div class=\"outline-callout-label\">Useful sentence</div>\n  <div>Science-museum attendance rose by 60,000 overall, reaching 130,000 in 2007 and narrowing the gap with art museums to only 20,000.</div>\n</div>\n\n<h3>Body Paragraph 2 — Natural History, Culture and History Museums</h3>\n<ul>\n  <li><strong>Controlling idea:</strong> Hai nhóm giảm, trong khi History Museums tăng nhẹ.</li>\n  <li><strong>Detail 1:</strong> Natural History Museums giảm từ 80 xuống 70 rồi khoảng 65 nghìn.</li>\n  <li><strong>Detail 2:</strong> Culture Museums giảm từ 60 xuống 55 rồi 45 nghìn.</li>\n  <li><strong>Detail 3:</strong> History Museums tăng từ 50 lên 55 rồi 60 nghìn, vượt Culture Museums và gần bắt kịp Natural History Museums.</li>\n  <li><strong>Final ranking:</strong> 2007 — Natural History khoảng 65 nghìn, History 60 nghìn, Culture 45 nghìn.</li>\n</ul>\n<div class=\"outline-callout\">\n  <div class=\"outline-callout-label\">Useful sentence</div>\n  <div>By 2007, history museums had overtaken culture museums and were only about 5,000 visitors behind natural history museums.</div>\n</div>","task2Outline":"<h2>TASK 2 – OUTLINE THAM KHẢO</h2>\n<h3>Introduction</h3>\n<ul>\n  <li><strong>Paraphrase bank:</strong> achieve an aim → attain a goal / reach an objective; mostly a question of luck → determined primarily by chance; luck → favourable circumstances / random events.</li>\n  <li><strong>Opening sentence:</strong> Success is influenced by both circumstances beyond an individual’s control and choices made over time.</li>\n  <li><strong>Thesis:</strong> Luck can affect access and timing, but I largely disagree that it is the main determinant; preparation, persistence and adaptability are more decisive.</li>\n</ul>\n<div class=\"outline-callout\">\n  <div class=\"outline-callout-label\">Introduction hoàn chỉnh</div>\n  <div>Although chance can influence the opportunities people encounter and the timing of events, I largely disagree that achieving a goal is mainly a matter of luck. In most cases, preparation, effective decision-making and persistence have a more decisive and repeatable influence on success.</div>\n</div>\n\n<h3>Body Paragraph 1 — Concession: why luck matters</h3>\n<ul>\n  <li><strong>Point:</strong> people begin with unequal circumstances and do not control every opportunity.</li>\n  <li><strong>Explanation:</strong> family resources, health, timing, networks and external shocks shape access and risk.</li>\n  <li><strong>Further development:</strong> random events can speed up or interrupt progress even when effort is similar.</li>\n  <li><strong>Example:</strong> an applicant may learn about a vacancy through an unexpected contact.</li>\n  <li><strong>Link:</strong> luck affects the route and pace, so it should not be dismissed completely.</li>\n</ul>\n\n<h3>Body Paragraph 2 — Rebuttal: controllable factors are more important</h3>\n<ul>\n  <li><strong>Point:</strong> opportunity produces achievement only when a person is ready to use it.</li>\n  <li><strong>Explanation:</strong> knowledge and skill turn chance into measurable performance.</li>\n  <li><strong>Further development:</strong> persistence creates repeated attempts; adaptability corrects ineffective strategies.</li>\n  <li><strong>Example:</strong> a learner can improve after an unsuccessful exam by analysing weaknesses and changing practice.</li>\n  <li><strong>Weighing judgement:</strong> these factors are repeatable and explain sustained success better than unpredictable luck.</li>\n</ul>\n\n<h3>Conclusion</h3>\n<div class=\"outline-callout\">\n  <div class=\"outline-callout-label\">Conclusion draft</div>\n  <div>In conclusion, favourable circumstances can open doors or accelerate progress, but they do not usually provide the competence and resilience required to reach and maintain a goal. Achievement is therefore influenced by luck but determined mainly by preparation, persistence and the ability to adapt.</div>\n</div>"}};

function defaultState(){
  return {selectedTest:null, studentName:'', confirmed:false, started:false, submitted:false,
    startTime:null, endTime:null, submitTime:null, task1:'', task2:'', activeTask:1,
    lastSaved:null, autoSubmitted:false, warned:{}};
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {warned: parsed.warned || {}});
  }catch(err){
    storageAvailable = false;
    return defaultState();
  }
}
function saveState(showStatus=true){
  state.lastSaved = Date.now();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(err){
    storageAvailable = false;
  }
  if(showStatus) updateSaveStatus();
}
function queueSave(){
  clearTimeout(saveHandle);
  saveHandle = setTimeout(()=>saveState(true), 350);
}
function clearSavedState(){
  try{localStorage.removeItem(STORAGE_KEY)}catch(err){storageAvailable=false}
}
function testData(){ return state.selectedTest ? TESTS[String(state.selectedTest)] : null; }
function escapeHTML(value){
  return String(value ?? '').replace(/[&<>'"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function countWords(text){
  const matches = String(text||'').trim().match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu);
  return matches ? matches.length : 0;
}
function pad(n){return String(n).padStart(2,'0')}
function formatClock(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  return `${pad(Math.floor(total/60))}:${pad(total%60)}`;
}
function formatDateTime(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleString('vi-VN',{hour12:false});
}
function formatDuration(ms){
  const sec=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function sanitizeFilename(name){
  return String(name||'hoc-sinh').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60) || 'hoc-sinh';
}
function showToast(message, duration=2600){
  const el=document.getElementById('toast');
  el.textContent=message; el.classList.remove('hidden');
  clearTimeout(el._hideTimer); el._hideTimer=setTimeout(()=>el.classList.add('hidden'),duration);
}
function updateSaveStatus(){
  const el=document.getElementById('saveStatus');
  if(!el) return;
  if(!storageAvailable){el.textContent='Không thể lưu vào trình duyệt; hãy giữ trang đang mở.';el.style.color='#a32626';return;}
  el.textContent=state.lastSaved ? `Đã lưu lúc ${new Date(state.lastSaved).toLocaleTimeString('vi-VN',{hour12:false})}` : 'Chưa lưu';
}

function render(){
  stopTimer();
  if(state.submitted){renderResults();return;}
  if(state.started){renderExam();startTimer();return;}
  renderStart();
}

function renderStart(){
  const cards=Object.values(TESTS).map(t=>`<button type="button" class="test-option ${Number(state.selectedTest)===t.id?'selected':''}" data-test="${t.id}" aria-pressed="${Number(state.selectedTest)===t.id}"><span class="test-no">${escapeHTML(t.label)}</span><span class="test-date">${escapeHTML(t.date)}</span><span class="test-short">${escapeHTML(t.short)}</span></button>`).join('');
  document.getElementById('app').innerHTML=`
  <main class="screen"><div class="app-shell">
    <div class="brand"><div class="brand-mark">W</div><div><h1>${APP_TITLE}</h1><p>Practice Test 7 • Xem outline trước khi bắt đầu và viết trực tiếp.</p></div></div>
    <section class="card start-card">
      <h2 class="section-title">1. CHỌN ĐỀ LUYỆN TẬP</h2><div class="test-grid">${cards}</div>
      <h2 class="section-title">2. THÔNG TIN HỌC SINH</h2>
      <div class="form-row"><label for="studentName">HỌ VÀ TÊN HỌC SINH</label><input id="studentName" class="text-input" type="text" value="${escapeHTML(state.studentName)}" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"></div>
      <label class="confirm-row"><input id="confirmReady" type="checkbox" ${state.confirmed?'checked':''}><span>Tôi đã đọc hướng dẫn và sẵn sàng bắt đầu bài thi.</span></label>
      <div class="instructions"><strong>Hướng dẫn:</strong><ul><li>Tổng thời gian làm bài: 60 phút.</li><li>Task 1: viết ít nhất khoảng 150 từ; thời gian gợi ý khoảng 20 phút.</li><li>Task 2: viết ít nhất khoảng 250 từ; thời gian gợi ý khoảng 40 phút và có trọng số gấp đôi Task 1.</li><li>Bài viết được tự động lưu và tự động nộp khi hết giờ.</li><li>Kiểm tra chính tả và ngữ pháp đã được tắt.</li><li>Outline chỉ được xem trước khi bắt đầu tính giờ.</li></ul></div>
      ${storageAvailable?'':'<div class="storage-warning">Trình duyệt đang chặn localStorage. Bạn vẫn có thể làm bài, nhưng không nên tải lại trang.</div>'}
      <div class="actions"><button class="btn btn-secondary" id="viewOutline">XEM OUTLINE THAM KHẢO</button><button class="btn btn-primary" id="startExam">BẮT ĐẦU LÀM BÀI</button></div>
      <div id="startError" class="form-error" role="alert"></div>
    </section>
  </div></main>`;
  document.querySelectorAll('.test-option').forEach(btn=>btn.addEventListener('click',()=>{
    state.selectedTest=Number(btn.dataset.test); saveState(false); renderStart();
  }));
  document.getElementById('studentName').addEventListener('input',e=>{state.studentName=e.target.value;queueSave()});
  document.getElementById('confirmReady').addEventListener('change',e=>{state.confirmed=e.target.checked;saveState(false)});
  document.getElementById('viewOutline').addEventListener('click',()=>{
    syncStartFields();
    if(!state.selectedTest){document.getElementById('startError').textContent='Vui lòng chọn một đề trước khi xem outline.';return;}
    openOutline();
  });
  document.getElementById('startExam').addEventListener('click',startExam);
}
function syncStartFields(){
  const name=document.getElementById('studentName'), confirm=document.getElementById('confirmReady');
  if(name) state.studentName=name.value.trim(); if(confirm) state.confirmed=confirm.checked;
  saveState(false);
}
function startExam(){
  syncStartFields();
  const error=document.getElementById('startError');
  if(!state.selectedTest){error.textContent='Vui lòng chọn đề luyện tập.';return;}
  if(!state.studentName){error.textContent='Vui lòng nhập họ và tên học sinh.';return;}
  if(!state.confirmed){error.textContent='Vui lòng tích ô xác nhận trước khi bắt đầu.';return;}
  const now=Date.now(); state.started=true; state.submitted=false; state.startTime=now; state.endTime=now+TEST_DURATION_MS; state.submitTime=null; state.task1=''; state.task2=''; state.activeTask=1; state.lastSaved=now; state.autoSubmitted=false; state.warned={};
  closeAllModals(); saveState(false); render();
}

function renderExam(){
  const t=testData(); if(!t){state=defaultState();saveState(false);renderStart();return;}
  document.getElementById('app').innerHTML=`
  <main class="screen">
    <header class="exam-header"><div class="exam-header-inner">
      <div class="candidate"><strong>${escapeHTML(t.label)}</strong><span>${escapeHTML(state.studentName)} • <span id="currentTaskLabel">Task ${state.activeTask}</span></span></div>
      <div id="timer" class="timer-box" aria-label="Thời gian còn lại">60:00</div>
      <div class="header-actions"><button class="btn btn-secondary" id="saveNow">LƯU BÀI</button><button class="btn btn-primary" id="submitExam">NỘP BÀI</button></div>
    </div></header>
    <div class="exam-wrap">
      <nav class="task-tabs" aria-label="Chuyển phần"><button id="taskTab1" class="task-tab ${state.activeTask===1?'active':''}">TASK 1</button><button id="taskTab2" class="task-tab ${state.activeTask===2?'active':''}">TASK 2</button></nav>
      <div class="exam-grid">
        <section class="question-pane">
          <div class="task-kicker" id="taskTiming"></div><h2 id="taskHeading"></h2><div id="questionText" class="question-text"></div>
          <div id="visualFrame" class="visual-frame"><img id="taskImage" class="task-image" alt="Hình minh họa Task 1"><div class="image-actions"><button class="btn btn-secondary" id="openImage">PHÓNG TO HÌNH</button></div></div>
          <div id="wordInstruction" class="word-instruction"></div>
        </section>
        <section class="writing-pane">
          <div class="writing-top"><h2 id="writingHeading"></h2><div id="wordCounter" class="word-counter"></div></div>
          <textarea id="essayBox" class="essay-box" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" aria-label="Vùng viết bài"></textarea>
          <div id="saveStatus" class="save-status"></div>
        </section>
      </div>
    </div>
  </main>`;
  document.getElementById('taskTab1').addEventListener('click',()=>setActiveTask(1));
  document.getElementById('taskTab2').addEventListener('click',()=>setActiveTask(2));
  document.getElementById('saveNow').addEventListener('click',()=>{syncEssay();saveState(true);showToast('Đã lưu bài.')});
  document.getElementById('submitExam').addEventListener('click',()=>{syncEssay();saveState(false);openSubmitModal()});
  document.getElementById('essayBox').addEventListener('input',e=>{
    if(state.activeTask===1) state.task1=e.target.value; else state.task2=e.target.value;
    updateWordCounter(); queueSave();
  });
  document.getElementById('openImage').addEventListener('click',openImageViewer);
  setActiveTask(state.activeTask,false);
  updateSaveStatus();
}
function syncEssay(){
  const box=document.getElementById('essayBox'); if(!box) return;
  if(state.activeTask===1) state.task1=box.value; else state.task2=box.value;
}
function setActiveTask(task, shouldSave=true){
  if(shouldSave) syncEssay();
  state.activeTask=task;
  if(shouldSave) saveState(false);
  const t=testData(); const is1=task===1;
  document.getElementById('taskTab1').classList.toggle('active',is1); document.getElementById('taskTab2').classList.toggle('active',!is1);
  document.getElementById('currentTaskLabel').textContent=`Task ${task}`;
  document.getElementById('taskTiming').textContent=is1?'You should spend about 20 minutes on this task.':'You should spend about 40 minutes on this task.';
  document.getElementById('taskHeading').textContent=`WRITING TASK ${task}`;
  document.getElementById('writingHeading').textContent=`Bài làm Task ${task}`;
  document.getElementById('questionText').textContent=is1?t.task1Question:t.task2Question;
  document.getElementById('wordInstruction').textContent=is1?'Write at least 150 words.':'Write at least 250 words.';
  document.getElementById('visualFrame').classList.toggle('hidden',!is1);
  document.getElementById('taskImage').src=t.task1Image;
  const box=document.getElementById('essayBox'); box.value=is1?state.task1:state.task2; box.setAttribute('aria-label',`Vùng viết Task ${task}`);
  updateWordCounter(); updateSaveStatus();
}
function updateWordCounter(){
  const is1=state.activeTask===1; const count=countWords(is1?state.task1:state.task2); const minimum=is1?150:250; const el=document.getElementById('wordCounter'); if(!el)return;
  el.textContent=`Task ${state.activeTask}: ${count} từ${count<minimum?' — dưới mức khuyến nghị':''}`; el.classList.toggle('ok',count>=minimum);
}
function startTimer(){
  updateTimer(); timerHandle=setInterval(updateTimer,500);
}
function stopTimer(){ if(timerHandle){clearInterval(timerHandle);timerHandle=null} }
function updateTimer(){
  if(!state.started||state.submitted||!state.endTime)return;
  const remaining=state.endTime-Date.now(); const el=document.getElementById('timer');
  if(el){el.textContent=formatClock(remaining);el.classList.toggle('warning',remaining<=10*60*1000&&remaining>60*1000);el.classList.toggle('critical',remaining<=60*1000)}
  [[10,'10 phút'],[5,'5 phút'],[1,'1 phút']].forEach(([m,label])=>{
    if(remaining<=m*60*1000&&remaining>0&&!state.warned[m]){state.warned[m]=true;saveState(false);showToast(`Còn ${label}.`,4500)}
  });
  if(remaining<=0){syncEssay();finalizeSubmission(true)}
}

function openOutline(){
  if(state.started||state.submitted)return;
  outlineTask=1; updateOutline(); openModal('outlineModal','outlineTab1');
}
function updateOutline(){
  const t=testData(); if(!t)return;
  document.getElementById('outlineContent').innerHTML=outlineTask===1?t.task1Outline:t.task2Outline;
  document.getElementById('outlineTab1').classList.toggle('active',outlineTask===1);document.getElementById('outlineTab2').classList.toggle('active',outlineTask===2);
  document.getElementById('outlineTab1').setAttribute('aria-selected',outlineTask===1);document.getElementById('outlineTab2').setAttribute('aria-selected',outlineTask===2);
}
function openSubmitModal(){
  const remaining=Math.max(0,state.endTime-Date.now()), c1=countWords(state.task1), c2=countWords(state.task2), warnings=[];
  if(!state.task1.trim())warnings.push('Task 1 đang trống.'); else if(c1<150)warnings.push(`Task 1 mới có ${c1} từ, dưới mức 150 từ.`);
  if(!state.task2.trim())warnings.push('Task 2 đang trống.'); else if(c2<250)warnings.push(`Task 2 mới có ${c2} từ, dưới mức 250 từ.`);
  document.getElementById('submitModalBody').innerHTML=`<div class="submit-summary"><div class="stat"><span>Thời gian còn lại</span><strong>${formatClock(remaining)}</strong></div><div class="stat"><span>Task 1</span><strong>${c1} từ</strong></div><div class="stat"><span>Task 2</span><strong>${c2} từ</strong></div></div>${warnings.length?`<div class="warning-list"><strong>Lưu ý:</strong><ul>${warnings.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div>`:''}<p>Sau khi xác nhận, bài làm sẽ bị khóa và không thể chỉnh sửa tiếp.</p>`;
  openModal('submitModal','continueExam');
}
function finalizeSubmission(auto){
  if(state.submitted)return;
  syncEssay(); const now=Date.now(); state.submitted=true;state.started=true;state.submitTime=now;state.autoSubmitted=Boolean(auto);saveState(false);stopTimer();closeAllModals();render();
}

function renderResults(){
  const t=testData(); if(!t){state=defaultState();saveState(false);renderStart();return;}
  const used=(state.submitTime||Date.now())-state.startTime, c1=countWords(state.task1), c2=countWords(state.task2);
  document.getElementById('app').innerHTML=`<main class="screen"><div class="result-wrap"><div class="brand"><div class="brand-mark">W</div><div><h1>${APP_TITLE}</h1><p>${escapeHTML(t.label)}</p></div></div><section class="card result-card">
  <h1 class="result-title">BÀI LÀM ĐÃ ĐƯỢC NỘP${state.autoSubmitted?' TỰ ĐỘNG':''}</h1>
  <div class="meta-grid">
    <div class="meta-item"><span>Họ và tên</span><strong>${escapeHTML(state.studentName)}</strong></div><div class="meta-item"><span>Đề</span><strong>${escapeHTML(t.label)}</strong></div><div class="meta-item"><span>Ngày làm bài</span><strong>${escapeHTML(new Date(state.submitTime).toLocaleDateString('vi-VN'))}</strong></div>
    <div class="meta-item"><span>Thời gian bắt đầu</span><strong>${escapeHTML(formatDateTime(state.startTime))}</strong></div><div class="meta-item"><span>Thời gian nộp</span><strong>${escapeHTML(formatDateTime(state.submitTime))}</strong></div><div class="meta-item"><span>Thời lượng đã sử dụng</span><strong>${escapeHTML(formatDuration(used))}</strong></div>
    <div class="meta-item"><span>Số từ Task 1</span><strong>${c1}</strong></div><div class="meta-item"><span>Số từ Task 2</span><strong>${c2}</strong></div><div class="meta-item"><span>Trạng thái</span><strong>${state.autoSubmitted?'Hết giờ – tự động nộp':'Đã xác nhận nộp'}</strong></div>
  </div>
  <section class="response-section"><h2>WRITING TASK 1</h2><div class="result-question">${escapeHTML(t.task1Question)}</div><h3>Bài làm (${c1} từ)</h3><div class="result-answer">${escapeHTML(state.task1)||'<em>Không có bài làm.</em>'}</div></section>
  <section class="response-section"><h2>WRITING TASK 2</h2><div class="result-question">${escapeHTML(t.task2Question)}</div><h3>Bài làm (${c2} từ)</h3><div class="result-answer">${escapeHTML(state.task2)||'<em>Không có bài làm.</em>'}</div></section>
  <div class="notice">Phiên bản một file HTML này dùng để xem outline trước bài thi, làm bài trực tiếp và lưu bài. Việc chấm điểm IELTS cần được thực hiện riêng bởi giáo viên hoặc hệ thống chấm AI có máy chủ bảo mật.</div>
  <div class="result-actions"><button class="btn btn-secondary" id="copyAll">SAO CHÉP TOÀN BỘ BÀI LÀM</button><button class="btn btn-secondary" id="downloadTxt">LƯU FILE TXT</button><button class="btn btn-secondary" id="downloadWord">XUẤT FILE WORD (.DOC)</button><button class="btn btn-secondary" id="printResult">IN BÀI LÀM</button><button class="btn btn-danger" id="resetExam">LÀM LẠI / CHỌN ĐỀ KHÁC</button></div>
  </section></div></main>`;
  document.getElementById('copyAll').addEventListener('click',copyAll);
  document.getElementById('downloadTxt').addEventListener('click',downloadTxt);
  document.getElementById('downloadWord').addEventListener('click',downloadWord);
  document.getElementById('printResult').addEventListener('click',()=>window.print());
  document.getElementById('resetExam').addEventListener('click',resetExam);
}
function resultText(){
  const t=testData(), used=(state.submitTime||Date.now())-state.startTime;
  return `${APP_TITLE}\n${t.label}\n\nHọ và tên: ${state.studentName}\nThời gian bắt đầu: ${formatDateTime(state.startTime)}\nThời gian nộp: ${formatDateTime(state.submitTime)}\nThời lượng: ${formatDuration(used)}\nSố từ Task 1: ${countWords(state.task1)}\nSố từ Task 2: ${countWords(state.task2)}\n\nTASK 1 QUESTION\n${t.task1Question}\n\nTASK 1 RESPONSE\n${state.task1}\n\nTASK 2 QUESTION\n${t.task2Question}\n\nTASK 2 RESPONSE\n${state.task2}`;
}
async function copyAll(){
  const text=resultText();
  try{await navigator.clipboard.writeText(text);showToast('Đã sao chép toàn bộ bài làm.');return}catch(err){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('Đã sao chép toàn bộ bài làm.')}catch(err){showToast('Không thể tự động sao chép. Hãy chọn nội dung và sao chép thủ công.',4500)}finally{ta.remove()}
}
function downloadBlob(content,filename,type){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function baseFilename(){const t=testData();return `${sanitizeFilename(state.studentName)}_${t.label.replace(/\s+/g,'_')}_${new Date(state.submitTime).toISOString().slice(0,10)}`}
function downloadTxt(){downloadBlob('\ufeff'+resultText(),baseFilename()+'.txt','text/plain;charset=utf-8');showToast('Đã tạo file TXT.')}
function downloadWord(){
  const t=testData(), used=(state.submitTime||Date.now())-state.startTime;
  const para=s=>escapeHTML(s).replace(/\n/g,'<br>');
  const doc=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHTML(t.label)}</title><style>body{font-family:Arial,sans-serif;line-height:1.55;margin:36px;color:#111}h1{text-align:center;color:#173f68}h2{color:#173f68;border-bottom:1px solid #999;padding-bottom:5px}.meta{border-collapse:collapse;width:100%;margin:18px 0}.meta td{border:1px solid #aaa;padding:7px}.q{background:#eef3f7;padding:12px;font-weight:bold}.a{white-space:normal;padding:10px 0}</style></head><body><h1>${APP_TITLE}</h1><h2>${escapeHTML(t.label)}</h2><table class="meta"><tr><td><b>Họ và tên</b></td><td>${escapeHTML(state.studentName)}</td></tr><tr><td><b>Thời gian bắt đầu</b></td><td>${escapeHTML(formatDateTime(state.startTime))}</td></tr><tr><td><b>Thời gian nộp</b></td><td>${escapeHTML(formatDateTime(state.submitTime))}</td></tr><tr><td><b>Thời lượng</b></td><td>${escapeHTML(formatDuration(used))}</td></tr><tr><td><b>Số từ</b></td><td>Task 1: ${countWords(state.task1)}; Task 2: ${countWords(state.task2)}</td></tr></table><h2>WRITING TASK 1</h2><div class="q">${escapeHTML(t.task1Question)}</div><div class="a">${para(state.task1)||'<i>Không có bài làm.</i>'}</div><h2>WRITING TASK 2</h2><div class="q">${escapeHTML(t.task2Question)}</div><div class="a">${para(state.task2)||'<i>Không có bài làm.</i>'}</div></body></html>`;
  downloadBlob('\ufeff'+doc,baseFilename()+'.doc','application/msword;charset=utf-8');showToast('Đã tạo file Word (.doc).');
}
function resetExam(){
  if(!confirm('Bạn có chắc muốn xóa bài đã lưu, đặt lại đồng hồ và quay về màn hình chọn đề không?'))return;
  stopTimer();clearSavedState();state=defaultState();render();
}

function openModal(id,focusId){
  const modal=document.getElementById(id);previousFocus=document.activeElement;modal.classList.remove('hidden');activeModal=modal;document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById(focusId)?.focus(),0);
}
function closeModal(id){
  const modal=document.getElementById(id);modal.classList.add('hidden');if(activeModal===modal)activeModal=null;document.body.style.overflow='';previousFocus?.focus?.();
}
function closeAllModals(){['outlineModal','submitModal','imageModal'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));activeModal=null;document.body.style.overflow=''}
function trapFocus(e){
  if(!activeModal||e.key!=='Tab')return;const focusables=[...activeModal.querySelectorAll('button,[href],input,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.offsetParent!==null);if(!focusables.length)return;
  const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}

function openImageViewer(){
  const t=testData();document.getElementById('zoomImage').src=t.task1Image;zoom={scale:1,x:0,y:0,dragging:false,startX:0,startY:0,originX:0,originY:0};applyZoom();openModal('imageModal','zoomFit');
}
function applyZoom(){document.getElementById('zoomImage').style.transform=`translate(${zoom.x}px,${zoom.y}px) scale(${zoom.scale})`}
function setZoom(next){zoom.scale=Math.min(5,Math.max(.3,next));applyZoom()}
function fitZoom(){zoom.scale=1;zoom.x=0;zoom.y=0;applyZoom()}

// Static modal controls
document.getElementById('outlineTab1').addEventListener('click',()=>{outlineTask=1;updateOutline()});
document.getElementById('outlineTab2').addEventListener('click',()=>{outlineTask=2;updateOutline()});
document.getElementById('closeOutline').addEventListener('click',()=>closeModal('outlineModal'));
document.getElementById('backFromOutline').addEventListener('click',()=>closeModal('outlineModal'));
document.getElementById('closeSubmit').addEventListener('click',()=>closeModal('submitModal'));
document.getElementById('continueExam').addEventListener('click',()=>closeModal('submitModal'));
document.getElementById('confirmSubmit').addEventListener('click',()=>finalizeSubmission(false));
document.getElementById('zoomIn').addEventListener('click',()=>setZoom(zoom.scale+.25));
document.getElementById('zoomOut').addEventListener('click',()=>setZoom(zoom.scale-.25));
document.getElementById('zoomReset').addEventListener('click',()=>{zoom.scale=1;zoom.x=0;zoom.y=0;applyZoom()});
document.getElementById('zoomFit').addEventListener('click',fitZoom);
document.getElementById('closeImage').addEventListener('click',()=>closeModal('imageModal'));
const stage=document.getElementById('imageStage');
stage.addEventListener('pointerdown',e=>{zoom.dragging=true;zoom.startX=e.clientX;zoom.startY=e.clientY;zoom.originX=zoom.x;zoom.originY=zoom.y;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!zoom.dragging)return;zoom.x=zoom.originX+(e.clientX-zoom.startX);zoom.y=zoom.originY+(e.clientY-zoom.startY);applyZoom()});
stage.addEventListener('pointerup',e=>{zoom.dragging=false;stage.classList.remove('dragging');try{stage.releasePointerCapture(e.pointerId)}catch(err){}});
stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom.scale+(e.deltaY<0?.15:-.15))},{passive:false});

document.addEventListener('keydown',e=>{
  trapFocus(e);
  if(e.key==='Escape'&&activeModal){if(activeModal.id==='outlineModal')closeModal('outlineModal');else if(activeModal.id==='submitModal')closeModal('submitModal');else if(activeModal.id==='imageModal')closeModal('imageModal')}
});
window.addEventListener('beforeunload',()=>{if(state.started&&!state.submitted){syncEssay();saveState(false)}});

// If the browser was closed after the deadline, submit immediately on reopening.
if(state.started&&!state.submitted&&state.endTime&&Date.now()>=state.endTime){state.submitted=true;state.submitTime=state.endTime;state.autoSubmitted=true;saveState(false)}
render();
</script>
</body>
</html>
