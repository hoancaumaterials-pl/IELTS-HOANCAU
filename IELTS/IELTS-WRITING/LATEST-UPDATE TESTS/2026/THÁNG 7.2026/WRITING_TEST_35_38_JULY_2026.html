và 2012.","task1":{"label":"Task 1","title":"New Zealand population by age group","type":"dynamic table with population totals and percentage change","question":"The table below shows information about the population of New Zealand from 2011 to 2012 by age group. Summarise the information by selecting and reporting the main features and make comparisons where relevant.","minutes":20,"minimumWords":150,"analysis":"<h1 class=\"analysis-section-heading\" id=\"a1.-phân-tích-sơ-lược-biểu-đồ-hình\">A1. Phân tích sơ lược biểu đồ / hình</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: dynamic table with population totals and percentage change.</p>\n<p>• Đối tượng: New Zealand population by age group in 2011 and 2012.</p>\n<p>• Nhóm: all ages, under 15, 15–39, 40–64 and 65+.</p>\n<p>• Đơn vị: people and percentage change.</p>\n<p>• Thời gian: 2011–2012.</p>\n<p>• Thì chính: past simple; rise from/to, fall by, record growth.</p>\n<p>• Điểm chính: total population rose slightly; younger groups contracted marginally, while older groups grew, especially those aged 65+.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu mẫu đúng với đề</strong></p>\n<p>The population aged 65 and over increased from 573,946 to 596,903, a rise of 4%, far exceeding the national growth rate of 0.6%.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"bảng-dữ-liệu-chi-tiết-đọc-từ-hình\">Bảng dữ liệu / chi tiết đọc từ hình</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Group</strong></th>\n<th><strong>2011</strong></th>\n<th><strong>2012</strong></th>\n<th><strong>Change</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>All ages</td>\n<td>4,381,269</td>\n<td>4,410,284</td>\n<td>+0.6%</td>\n</tr>\n<tr class=\"even\">\n<td>Under 15</td>\n<td>898,160</td>\n<td>896,364</td>\n<td>-0.2%</td>\n</tr>\n<tr class=\"odd\">\n<td>15–39</td>\n<td>1,577,256</td>\n<td>1,574,102</td>\n<td>-0.2%</td>\n</tr>\n<tr class=\"even\">\n<td>40–64</td>\n<td>1,331,907</td>\n<td>1,339,898</td>\n<td>+0.6%</td>\n</tr>\n<tr class=\"odd\">\n<td>65+</td>\n<td>573,946</td>\n<td>596,903</td>\n<td>+4.0%</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a2.-đặc-điểm-tổng-quan-overview\">A2. Đặc điểm tổng quan (Overview)</h1><h2 id=\"xu-hướng-chính-bức-tranh-chung\">1. Xu hướng chính / Bức tranh chung</h2><p><strong>Câu hỏi dẫn dắt:</strong> Tổng dân số thay đổi mạnh hay nhẹ?</p><p><strong>Câu hỏi dẫn dắt:</strong> Nhóm trẻ và nhóm lớn tuổi đi theo hướng nào?</p><p><strong>Câu hỏi dẫn dắt:</strong> Nhóm nào có tỷ lệ tăng cao nhất?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Nhìn chung, dân số New Zealand tăng nhẹ 0,6%. Hai nhóm dưới 40 tuổi đều giảm rất nhỏ, trong khi các nhóm từ 40 tuổi trở lên tăng; đặc biệt nhóm 65+ tăng 4%, nhanh nhất trong bảng.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview draft bằng tiếng Anh</strong></p>\n<p>Overall, New Zealand’s population grew modestly by 0.6%. Both groups below the age of 40 declined slightly, whereas the two older groups expanded, with the 65-plus population recording by far the fastest growth.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"sự-khác-biệt-chính-điểm-nổi-bật-nhất\">2. Sự khác biệt chính / Điểm nổi bật nhất</h2><p><strong>Câu hỏi dẫn dắt:</strong> Nhóm nào lớn nhất về số người?</p><p><strong>Câu hỏi dẫn dắt:</strong> Tăng tuyệt đối của 65+ so với 40–64 thế nào?</p><p><strong>Câu hỏi dẫn dắt:</strong> Hai nhóm giảm có cùng tỷ lệ không?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Nhóm 15–39 vẫn đông nhất, khoảng 1,57 triệu, dù giảm 0,2%. Nhóm 65+ tăng gần 23 nghìn người, lớn hơn nhiều so với mức tăng khoảng 8 nghìn của nhóm 40–64. Under 15 và 15–39 đều giảm 0,2%.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a3.-explore-key-features-các-hướng-phân-tích\">A3. Explore — Key Features + các hướng phân tích</h1><h2 id=\"các-đặc-điểm-đáng-viết\">Các đặc điểm đáng viết</h2><blockquote class=\"source-note\">\n<p>• Total population rose by about 29,000, from 4.381 to 4.410 million.</p>\n<p>• Under-15 population fell by roughly 1,800, or 0.2%.</p>\n<p>• The 15–39 group, the largest cohort, declined by just over 3,000, also 0.2%.</p>\n<p>• The 40–64 group increased by almost 8,000, matching the total growth rate of 0.6%.</p>\n<p>• People aged 65+ rose by nearly 23,000, or 4%.</p>\n<p>• The age structure therefore shifted modestly towards older residents.</p>\n</blockquote><h2 id=\"hướng-1---by-direction-of-change\">Hướng 1 - By Direction of Change</h2><blockquote class=\"source-note\">\n<p>• Body 1: declining younger groups.</p>\n<p>• Body 2: growing older groups and total.</p>\n<p>• Ưu điểm: overview phát triển trực tiếp.</p>\n<p>• Rủi ro: cần nhắc absolute size/ranking.</p>\n<p>• Cụm nối: declined marginally; by contrast; recorded the fastest increase.</p>\n</blockquote><h2 id=\"hướng-2---by-age-range\">Hướng 2 - By Age Range</h2><blockquote class=\"source-note\">\n<p>• Body 1: under 40.</p>\n<p>• Body 2: 40+ and total.</p>\n<p>• Ưu điểm: phản ánh ageing pattern.</p>\n<p>• Rủi ro: gần giống hướng 1 nhưng thiên về demographic grouping.</p>\n<p>• Cụm nối: younger cohorts; older population; age structure shifted.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"a4.-so-sánh-hướng-tiếp-cận-recommended-approach\">A4. So sánh hướng tiếp cận + Recommended approach</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Tiêu chí</strong></th>\n<th><strong>Hướng 1: Theo hướng thay đổi</strong></th>\n<th><strong>Hướng 2: Theo độ tuổi</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Trọng tâm</td>\n<td>Tăng so với giảm</td>\n<td>Younger versus older</td>\n</tr>\n<tr class=\"even\">\n<td>Cấu trúc body</td>\n<td>Decline / Growth</td>\n<td>Under 40 / 40+</td>\n</tr>\n<tr class=\"odd\">\n<td>Ưu điểm</td>\n<td>Rõ xu hướng</td>\n<td>Rõ câu chuyện già hoá</td>\n</tr>\n<tr class=\"even\">\n<td>Rủi ro</td>\n<td>Ranking cần chèn</td>\n<td>Total phải tích hợp</td>\n</tr>\n<tr class=\"odd\">\n<td>Khi nên dùng</td>\n<td>Dynamic table</td>\n<td>Muốn giải thích pattern</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Recommended approach</strong></p>\n<p>Chọn Hướng 2 - By Age Range vì hai nhóm trẻ cùng giảm và hai nhóm lớn tuổi cùng tăng, tạo một câu chuyện nhân khẩu học thống nhất và dễ so sánh.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a5.-apply-dàn-ý-chi-tiết\">A5. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: population by age group -&gt; age distribution of New Zealand’s population; from 2011 to 2012 -&gt; in the two years.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction sentence</strong></p>\n<p>The table compares the population of New Zealand in 2011 and 2012 across four age groups and shows the percentage change.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"overview\">Overview</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview hoàn chỉnh</strong></p>\n<p>Overall, the national population rose slightly, but growth was concentrated among older residents. Both under-40 groups contracted marginally, while the 65-plus cohort expanded far more rapidly than any other category.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---under-40\">Body Paragraph 1 - Under 40</h2><blockquote class=\"source-note\">\n<p>• Under 15: 898,160 -&gt; 896,364, -0.2%.</p>\n<p>• 15–39: 1,577,256 -&gt; 1,574,102, -0.2%.</p>\n<p>• 15–39 remained largest group.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>Although the 15–39 cohort remained the largest, it followed the same slight downward trend as the under-15 population.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---40-and-total\">Body Paragraph 2 - 40+ and total</h2><blockquote class=\"source-note\">\n<p>• 40–64: 1,331,907 -&gt; 1,339,898, +0.6%.</p>\n<p>• 65+: 573,946 -&gt; 596,903, +4.0%.</p>\n<p>• All ages: +0.6%, around 29,000 people.</p>\n<p>• 65+ drove most absolute growth.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>The oldest group increased by almost 23,000 people, accounting for most of the country’s overall population gain.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a6.-model-report-band-7.5\">A6. Model Report — Band 7.5+</h1><p>The table compares New Zealand’s population in 2011 and 2012 across four age groups and gives the percentage change for each category.</p><p>Overall, the country’s population grew only modestly, by 0.6%. However, this increase was concentrated among older residents: both groups under 40 declined slightly, whereas the population aged 65 and over recorded by far the fastest growth.</p><p>Among younger people, the under-15 population fell from 898,160 to 896,364, a decrease of 0.2%. The 15–39 group followed the same proportional trend, dropping from 1,577,256 to 1,574,102. Despite this small reduction, it remained the largest age category, containing substantially more people than the 40–64 group.</p><p>By contrast, the number of 40–64-year-olds rose from 1,331,907 to 1,339,898, matching the overall national growth rate of 0.6%. The most notable change occurred among those aged 65 or above. Their population increased by almost 23,000, from 573,946 to 596,903, equivalent to 4%. As the total population expanded by approximately 29,000 to 4,410,284, the oldest cohort accounted for most of the net increase, indicating a modest shift towards an older population structure.</p><p><em>Word count: approximately 185 words</em></p><h1 class=\"analysis-section-heading\" id=\"a7.-analyse-phân-tích-ngữ-pháp-nổi-bật\">A7. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>As the total population expanded by approximately 29,000, the oldest cohort accounted for most of the net increase, indicating a modest shift towards an older population structure.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Vai trò / cấu trúc</strong></th>\n<th><strong>Nghĩa nhanh</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>As the total population expanded</td>\n<td>As-clause chỉ bối cảnh/quan hệ</td>\n<td>Khi tổng dân số tăng</td>\n</tr>\n<tr class=\"even\">\n<td>by approximately 29,000</td>\n<td>Increase by chỉ mức thay đổi</td>\n<td>khoảng 29.000 người</td>\n</tr>\n<tr class=\"odd\">\n<td>the oldest cohort accounted for</td>\n<td>Mệnh đề chính; account for</td>\n<td>nhóm già nhất chiếm</td>\n</tr>\n<tr class=\"even\">\n<td>most of the net increase</td>\n<td>Cụm số lượng</td>\n<td>phần lớn mức tăng ròng</td>\n</tr>\n<tr class=\"odd\">\n<td>indicating</td>\n<td>Participle phrase chỉ suy luận từ dữ liệu</td>\n<td>cho thấy</td>\n</tr>\n<tr class=\"even\">\n<td>a modest shift towards</td>\n<td>Noun phrase chỉ thay đổi cơ cấu</td>\n<td>sự dịch chuyển nhẹ về phía</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>As + total + changed by + amount, subgroup + accounted for + proportion of the net change, indicating + structural trend.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a8.-task-1-language-bank\">A8. Task 1 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Expression / Collocation</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Cách dùng / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>age cohort</td>\n<td>noun phrase</td>\n<td>nhóm tuổi</td>\n<td>the oldest age cohort</td>\n</tr>\n<tr class=\"even\">\n<td>national population</td>\n<td>noun phrase</td>\n<td>dân số quốc gia</td>\n<td>the national population grew</td>\n</tr>\n<tr class=\"odd\">\n<td>decline marginally</td>\n<td>verb phrase</td>\n<td>giảm nhẹ</td>\n<td>both groups declined marginally</td>\n</tr>\n<tr class=\"even\">\n<td>record modest growth</td>\n<td>verb phrase</td>\n<td>ghi nhận tăng nhẹ</td>\n<td>recorded modest growth</td>\n</tr>\n<tr class=\"odd\">\n<td>by far the fastest increase</td>\n<td>superlative phrase</td>\n<td>mức tăng nhanh nhất vượt trội</td>\n<td>by far the fastest increase</td>\n</tr>\n<tr class=\"even\">\n<td>remain the largest group</td>\n<td>verb phrase</td>\n<td>vẫn là nhóm lớn nhất</td>\n<td>remained the largest group</td>\n</tr>\n<tr class=\"odd\">\n<td>net increase</td>\n<td>noun phrase</td>\n<td>mức tăng ròng</td>\n<td>most of the net increase</td>\n</tr>\n<tr class=\"even\">\n<td>account for most of</td>\n<td>verb phrase</td>\n<td>chiếm phần lớn</td>\n<td>accounted for most of growth</td>\n</tr>\n<tr class=\"odd\">\n<td>population structure</td>\n<td>noun phrase</td>\n<td>cơ cấu dân số</td>\n<td>an older population structure</td>\n</tr>\n<tr class=\"even\">\n<td>shift towards</td>\n<td>verb phrase</td>\n<td>dịch chuyển về phía</td>\n<td>shift towards older residents</td>\n</tr>\n<tr class=\"odd\">\n<td>equivalent to</td>\n<td>prepositional phrase</td>\n<td>tương đương</td>\n<td>equivalent to 4%</td>\n</tr>\n<tr class=\"even\">\n<td>absolute growth</td>\n<td>noun phrase</td>\n<td>mức tăng tuyệt đối</td>\n<td>the greatest absolute growth</td>\n</tr>\n</tbody>\n</table>"},"task2":{"label":"Task 2","title":"Mobile-phone use in public places","type":"Opinion / Agree-Disagree","question":"Some people think that the use of mobile phones should be banned in public places like libraries, shops, and on public transport. To what extent do you agree or disagree with this statement?","minutes":40,"minimumWords":250,"analysis":"<h1 class=\"analysis-section-heading\" id=\"b1.-think-phân-tích-câu-hỏi\">B1. Think — Phân tích câu hỏi</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: Opinion / Agree-Disagree.</p>\n<p>• Topic: banning mobile-phone use in public places such as libraries, shops and public transport.</p>\n<p>• Position khuyến nghị: disagree with a blanket ban; support context-specific restrictions on disruptive calls, noise and unsafe use.</p>\n<p>• Yêu cầu: distinguish phone ownership/use from particular behaviours.</p>\n<p>• Plain-English meaning: Có nên cấm hoàn toàn dùng điện thoại ở các không gian công cộng không?</p>\n<p>• Main trap: chỉ tranh luận phones are useful/harmful mà không đánh giá từng setting và enforcement.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"b2.-explore-câu-hỏi-dẫn-dắt-lập-luận-ví-dụ-tóm-tắt\">B2. Explore — Câu hỏi dẫn dắt → Lập luận → Ví dụ → Tóm tắt</h1><h2 id=\"why-restrictions-are-justified\">WHY RESTRICTIONS ARE JUSTIFIED</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Điện thoại gây hại gì trong không gian yên tĩnh hoặc đông người?</p>\n<p><strong>Lập luận:</strong> Cuộc gọi lớn tiếng, âm thanh video và thông báo làm phiền người đọc, hành khách và nhân viên. Trong thư viện hoặc khu chờ, một người có thể gây ảnh hưởng cho nhiều người.</p>\n<p><strong>Ví dụ:</strong> Một cuộc gọi bật loa ngoài trên tàu làm giảm sự thoải mái của cả toa.</p>\n<p><strong>Tóm tắt:</strong> Noise and intrusion justify behavioural rules.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Có vấn đề an toàn và riêng tư nào?</p>\n<p><strong>Lập luận:</strong> Dùng điện thoại khi đi bộ, lái xe hoặc lên xuống phương tiện có thể gây mất tập trung. Quay phim người khác mà không xin phép cũng xâm phạm riêng tư.</p>\n<p><strong>Ví dụ:</strong> Nhắn tin khi bước qua sân ga đông người có thể gây va chạm.</p>\n<p><strong>Tóm tắt:</strong> Specific risky uses may require strict prohibition.</p>\n</blockquote><h2 id=\"why-a-blanket-ban-is-excessive\">WHY A BLANKET BAN IS EXCESSIVE</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Điện thoại có chức năng thiết yếu nào ở nơi công cộng?</p>\n<p><strong>Lập luận:</strong> Người dân dùng bản đồ, vé điện tử, thanh toán, dịch thuật, hỗ trợ tiếp cận và liên lạc khẩn cấp. Cấm hoàn toàn sẽ gây bất tiện, đặc biệt cho người khuyết tật hoặc người chăm sóc.</p>\n<p><strong>Ví dụ:</strong> Hành khách có thể cần hiển thị vé hoặc nhận thông báo thay đổi chuyến.</p>\n<p><strong>Tóm tắt:</strong> Quiet, purposeful use often creates no external harm.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Quy tắc thay thế nên được thiết kế thế nào?</p>\n<p><strong>Lập luận:</strong> Không gian có thể quy định chế độ im lặng, cấm loa ngoài, tạo khu gọi điện và phạt hành vi nguy hiểm. Biển báo rõ giúp thực thi dựa trên tác động thay vì cấm thiết bị.</p>\n<p><strong>Ví dụ:</strong> Thư viện có thể cho phép nhắn tin nhưng yêu cầu cuộc gọi diễn ra ở sảnh.</p>\n<p><strong>Tóm tắt:</strong> Targeted restrictions are more proportionate and enforceable.</p>\n</blockquote><h2 id=\"tổng-kết-logic-explore\">Tổng kết logic Explore</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Problematic behaviour</strong></th>\n<th><strong>Legitimate use</strong></th>\n<th><strong>Policy response</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Loud calls and media</td>\n<td>Tickets, maps, payments</td>\n<td>Silent mode and no-speaker rules</td>\n</tr>\n<tr class=\"even\">\n<td>Distracted unsafe use</td>\n<td>Emergency contact</td>\n<td>Ban use in hazardous situations</td>\n</tr>\n<tr class=\"odd\">\n<td>Unconsented filming</td>\n<td>Accessibility tools</td>\n<td>Privacy rules and designated zones</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b3.-apply-dàn-ý-chi-tiết\">B3. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction-1\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: use of mobile phones -&gt; mobile-phone activity; banned in public places -&gt; prohibited across shared spaces.</p>\n<p>• Thesis: reject blanket ban, support targeted rules.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction hoàn chỉnh</strong></p>\n<p>Mobile phones can cause noise, distraction and privacy problems in shared spaces, but a complete ban would be disproportionate because many uses are quiet and essential. I therefore favour targeted restrictions on disruptive or unsafe behaviour.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---case-for-restrictions\">Body Paragraph 1 - Case for restrictions</h2><blockquote class=\"source-note\">\n<p>• Noise externality in libraries and transport.</p>\n<p>• Distraction in crowded or hazardous spaces.</p>\n<p>• Privacy concerns from recording.</p>\n<p>• Clear standards protect shared environment.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Link</strong></p>\n<p>Public rules are justified when one person’s phone use imposes a direct cost on others.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---why-blanket-ban-is-wrong\">Body Paragraph 2 - Why blanket ban is wrong</h2><blockquote class=\"source-note\">\n<p>• Tickets, navigation, payments, accessibility and emergencies.</p>\n<p>• Many interactions are silent.</p>\n<p>• Different spaces require different rules.</p>\n<p>• Silent mode, designated areas and behaviour-based penalties.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Weighing judgement</strong></p>\n<p>Regulation should target harm rather than the device itself.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"conclusion\">Conclusion</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Conclusion draft</strong></p>\n<p>In conclusion, disruptive calls and unsafe phone use should be restricted in particular public settings, but a universal prohibition would remove valuable services without corresponding benefit. Context-specific, behaviour-based rules are the fairer solution.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b4.-model-essay-band-7.5\">B4. Model Essay — Band 7.5+</h1><p>Some people believe mobile phones should be banned in public places including libraries, shops and public transport. Although phone use can disturb others and create safety or privacy problems, I disagree with a blanket prohibition. Rules should target disruptive and dangerous behaviour rather than the device itself.</p><p>Restrictions are reasonable in settings where noise and concentration matter. Loud calls, speakerphone conversations and videos without headphones can interfere with reading, work or travel. In crowded stations, looking continuously at a screen may also create collisions or prevent users from noticing hazards. Recording strangers without consent raises a further concern. Libraries and transport operators are therefore entitled to require silent mode, prohibit amplified sound and restrict phone use in clearly unsafe locations.</p><p>A complete ban, however, would be both inconvenient and difficult to justify. Phones now provide tickets, maps, payment systems, translation, accessibility tools and emergency communication. A passenger who quietly checks a platform change imposes no meaningful cost on others, while a person with a disability may depend on a phone for navigation or communication. Shops also increasingly use digital receipts and loyalty systems. Preventing every use would remove these benefits even when no disturbance occurs.</p><p>A more proportionate policy would distinguish among behaviours and locations. Libraries could permit silent messaging but direct calls to a lobby; public transport could ban speaker audio while allowing headphones; and authorities could prohibit device use only in hazardous zones. Clear signs and focused enforcement would be easier to understand than a universal ban.</p><p>In conclusion, some public restrictions are necessary, but they should address noise, distraction and privacy. Quiet and legitimate mobile-phone use should remain permitted.</p><p><em>Word count: approximately 300 words</em></p><h1 class=\"analysis-section-heading\" id=\"b5.-analyse-phân-tích-ngữ-pháp-nổi-bật\">B5. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>Public rules are justified when one person’s phone use imposes a direct cost on others, but regulation should target the harmful behaviour rather than the device itself.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Từ loại / cấu trúc / chức năng</strong></th>\n<th><strong>Nghĩa và tác dụng</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Public rules are justified</td>\n<td>Passive evaluative clause</td>\n<td>quy định công là hợp lý</td>\n</tr>\n<tr class=\"even\">\n<td>when</td>\n<td>Subordinator chỉ điều kiện/tình huống</td>\n<td>khi</td>\n</tr>\n<tr class=\"odd\">\n<td>one person’s phone use</td>\n<td>Possessive noun phrase</td>\n<td>việc dùng điện thoại của một người</td>\n</tr>\n<tr class=\"even\">\n<td>imposes a direct cost on others</td>\n<td>Impose A on B</td>\n<td>gây chi phí/tác động trực tiếp lên người khác</td>\n</tr>\n<tr class=\"odd\">\n<td>but regulation should target</td>\n<td>Contrast + modal recommendation</td>\n<td>nhưng quy định nên nhắm tới</td>\n</tr>\n<tr class=\"even\">\n<td>A rather than B</td>\n<td>Cấu trúc ưu tiên đối tượng</td>\n<td>A thay vì B</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>Rules are justified when + behaviour + imposes a direct cost on others, but regulation should target + harmful action + rather than + neutral object/activity.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Ví dụ mới</strong></p>\n<p>Noise controls are justified when late-night entertainment disturbs residents, but regulation should target excessive sound rather than restaurants themselves.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b6.-task-2-language-bank\">B6. Task 2 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Collocation / Expression</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Suggested use / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>blanket ban</td>\n<td>noun phrase</td>\n<td>lệnh cấm toàn diện</td>\n<td>oppose a blanket ban</td>\n</tr>\n<tr class=\"even\">\n<td>shared public space</td>\n<td>noun phrase</td>\n<td>không gian công cộng chung</td>\n<td>behaviour in shared spaces</td>\n</tr>\n<tr class=\"odd\">\n<td>cause a disturbance</td>\n<td>verb phrase</td>\n<td>gây phiền nhiễu</td>\n<td>calls cause a disturbance</td>\n</tr>\n<tr class=\"even\">\n<td>speakerphone conversation</td>\n<td>noun phrase</td>\n<td>cuộc gọi loa ngoài</td>\n<td>ban speakerphone conversations</td>\n</tr>\n<tr class=\"odd\">\n<td>privacy concern</td>\n<td>noun phrase</td>\n<td>lo ngại riêng tư</td>\n<td>raise privacy concerns</td>\n</tr>\n<tr class=\"even\">\n<td>impose a cost on others</td>\n<td>verb phrase</td>\n<td>gây tác động lên người khác</td>\n<td>impose a direct cost</td>\n</tr>\n<tr class=\"odd\">\n<td>legitimate use</td>\n<td>noun phrase</td>\n<td>mục đích dùng chính đáng</td>\n<td>permit legitimate use</td>\n</tr>\n<tr class=\"even\">\n<td>accessibility tool</td>\n<td>noun phrase</td>\n<td>công cụ hỗ trợ tiếp cận</td>\n<td>phones as accessibility tools</td>\n</tr>\n<tr class=\"odd\">\n<td>proportionate policy</td>\n<td>noun phrase</td>\n<td>chính sách tương xứng</td>\n<td>adopt a proportionate policy</td>\n</tr>\n<tr class=\"even\">\n<td>behaviour-based rule</td>\n<td>noun phrase</td>\n<td>quy định dựa trên hành vi</td>\n<td>behaviour-based rules</td>\n</tr>\n<tr class=\"odd\">\n<td>designated calling area</td>\n<td>noun phrase</td>\n<td>khu gọi điện riêng</td>\n<td>create designated areas</td>\n</tr>\n<tr class=\"even\">\n<td>silent mode</td>\n<td>noun phrase</td>\n<td>chế độ im lặng</td>\n<td>require silent mode</td>\n</tr>\n<tr class=\"odd\">\n<td>focused enforcement</td>\n<td>noun phrase</td>\n<td>thực thi có trọng tâm</td>\n<td>use focused enforcement</td>\n</tr>\n<tr class=\"even\">\n<td>hazardous zone</td>\n<td>noun phrase</td>\n<td>khu vực nguy hiểm</td>\n<td>prohibit use in hazardous zones</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b7.-consolidate-ứng-dụng-và-mở-rộng\">B7. Consolidate — Ứng dụng và mở rộng</h1><blockquote class=\"source-note\">\n<p>• Smoking in public: external harm and proportional restrictions.</p>\n<p>• Photography in public: convenience versus privacy.</p>\n<p>• Laptops in classrooms: useful tool versus distracting behaviour.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Hướng mở rộ HFnqlcjA7Ed2a/koAeYYmh6jlG01/tD5BChB5G5APQ1mf8AbOojsb6vzY5owjaappgkyfOrQkmSBop20xjS7qXGbBPobVysMGxuZyGIkgya81xaD7ws6KgMIKjrDZgWBqADQHBWVVxUGDWd0MhaQuZl803jLCM1weCoqRgRDy4s5rBHKJfxZXxlBE4j+rFjBGLixY6djNixYxYLCwuKBYz2Kd5/gCPMhuJMoDI5ePsKK6zWuv8Aya6666666yKSSSSSSSSSSCCCCCPuiiiiiiPsiyyyDf8AlTTTTTTTXWT2aSP+CVVVQRRRQX3V9919tn+1LJhhs/3cNEMt10vtYbTTSD/sijinmhlnlllhjjbD7TDFFFD7NNNNN6KMzAy02vl//mFQz5MACkAAmf0owlZlciAGFZGZ1PJFNpaFASSHlhx/9s3pEOTrOCyMIOnpQxlzR5hSpNZ0Vjf+1SeZCd+3WX/7XH0RER9mjAiQAwHSntShAPY//iz/2Q==","sourceNote":"Task 1 là quy trình công nghiệp tuyến tính gồm năm giai đoạn, từ xử lý nước thô đến phân phối sản phẩm.","task1":{"label":"Task 1","title":"Production of carbonated drinks","type":"linear industrial process","question":"The diagram gives information about the process of making carbonated drinks. Summarise the information by selecting and reporting the main features and make comparisons where relevant.","minutes":20,"minimumWords":150,"analysis":"<h1 class=\"analysis-section-heading\" id=\"a1.-phân-tích-sơ-lược-biểu-đồ-hình\">A1. Phân tích sơ lược biểu đồ / hình</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: linear industrial process.</p>\n<p>• Đối tượng: production of carbonated drinks from raw water to delivery.</p>\n<p>• Giai đoạn chính: water cleaning, heating/cooling/carbonation, mixing, filtering/filling, packaging.</p>\n<p>• Đơn vị/thời gian: not applicable.</p>\n<p>• Đầu vào: raw water, chemicals, carbon dioxide, colouring, syrup and flavouring.</p>\n<p>• Đầu ra: bottled and canned carbonated drinks delivered to supermarkets.</p>\n<p>• Thì/cấu trúc: present simple passive; is filtered, is heated, is mixed, are packaged.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu mẫu đúng với đề</strong></p>\n<p>After being filtered and softened, the water is heated, cooled and injected with carbon dioxide before flavouring ingredients are added.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a2.-đặc-điểm-tổng-quan-overview\">A2. Đặc điểm tổng quan (Overview)</h1><h2 id=\"xu-hướng-chính-bức-tranh-chung\">1. Xu hướng chính / Bức tranh chung</h2><p><strong>Câu hỏi dẫn dắt:</strong> Quy trình có bao nhiêu giai đoạn lớn?</p><p><strong>Câu hỏi dẫn dắt:</strong> Nước trải qua những biến đổi chính nào?</p><p><strong>Câu hỏi dẫn dắt:</strong> Sản phẩm được đóng vào những loại vật chứa nào?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Nhìn chung, đây là quy trình tuyến tính gồm năm giai đoạn, bắt đầu bằng làm sạch nước thô và kết thúc bằng đóng gói, vận chuyển. Nước được lọc, gia nhiệt, làm lạnh và carbon hoá trước khi pha màu, si-rô và hương liệu, sau đó được đóng chai hoặc lon.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview draft bằng tiếng Anh</strong></p>\n<p>Overall, this is a five-stage linear process beginning with the purification of raw water and ending with packaging and delivery. The water is filtered, heated, cooled and carbonated before colouring, syrup and flavouring are mixed in, after which the drink is filled into bottles and cans.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"sự-khác-biệt-chính-điểm-nổi-bật-nhất\">2. Sự khác biệt chính / Điểm nổi bật nhất</h2><p><strong>Câu hỏi dẫn dắt:</strong> Giai đoạn nào chỉ xử lý nước và giai đoạn nào thêm nguyên liệu?</p><p><strong>Câu hỏi dẫn dắt:</strong> Lọc xuất hiện bao nhiêu lần?</p><p><strong>Câu hỏi dẫn dắt:</strong> Sau khi đóng chai/lon, sản phẩm đi đâu?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Ba giai đoạn đầu biến nước thô thành chất lỏng có ga và có hương vị; nguyên liệu tạo màu và vị chỉ được thêm ở bồn trộn. Lọc diễn ra lúc đầu và lần nữa trước khi rót. Cuối cùng chai và lon được đóng thùng rồi chở đến siêu thị.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a3.-explore-key-features-các-hướng-phân-tích\">A3. Explore — Key Features + các hướng phân tích</h1><h2 id=\"các-đặc-điểm-đáng-viết\">Các đặc điểm đáng viết</h2><blockquote class=\"source-note\">\n<p>• Raw water passes through a filter, water softener and chemical treatment before pumping.</p>\n<p>• It is heated electrically, then cooled through a pipe.</p>\n<p>• Carbon dioxide is added in a carbonation tank.</p>\n<p>• Colouring, syrup and flavouring are introduced in a mixing tank.</p>\n<p>• The drink is filtered again and filled into both bottles and cans.</p>\n<p>• Containers are packed into boxes, loaded onto trucks and delivered to supermarkets.</p>\n</blockquote><h2 id=\"hướng-1---first-half-second-half\">Hướng 1 - First Half / Second Half</h2><blockquote class=\"source-note\">\n<p>• Body 1: stages 1–2, cleaning and carbonation.</p>\n<p>• Body 2: stages 3–5, mixing, filling and distribution.</p>\n<p>• Ưu điểm: hai đoạn cân đối, logic tuyến tính.</p>\n<p>• Rủi ro: cần nêu rõ stage 3 là turning point.</p>\n<p>• Cụm nối: initially; once purified; subsequently; in the final stages.</p>\n</blockquote><h2 id=\"hướng-2---input-to-transformation-to-output\">Hướng 2 - Input to Transformation to Output</h2><blockquote class=\"source-note\">\n<p>• Body 1: water preparation and physical treatment.</p>\n<p>• Body 2: additives, finished product and logistics.</p>\n<p>• Ưu điểm: nhấn mạnh bản chất chuyển đổi.</p>\n<p>• Rủi ro: ba nhóm nhưng chỉ hai body nên cần gộp output.</p>\n<p>• Cụm nối: the resulting liquid; additives are introduced; the finished drink.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"a4.-so-sánh-hướng-tiếp-cận-recommended-approach\">A4. So sánh hướng tiếp cận + Recommended approach</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Tiêu chí</strong></th>\n<th><strong>Hướng 1: Theo nửa quy trình</strong></th>\n<th><strong>Hướng 2: Input–Transformation–Output</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Trọng tâm</td>\n<td>Trình tự stage</td>\n<td>Bản chất biến đổi</td>\n</tr>\n<tr class=\"even\">\n<td>Cấu trúc body</td>\n<td>Stages 1–2 / 3–5</td>\n<td>Preparation / Product completion</td>\n</tr>\n<tr class=\"odd\">\n<td>Ưu điểm</td>\n<td>Dễ theo sơ đồ</td>\n<td>Rõ input-output</td>\n</tr>\n<tr class=\"even\">\n<td>Rủi ro</td>\n<td>Có thể kể máy móc</td>\n<td>Cần giữ đúng thứ tự</td>\n</tr>\n<tr class=\"odd\">\n<td>Khi nên dùng</td>\n<td>Process tuyến tính</td>\n<td>Muốn dùng transformation language</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Recommended approach</strong></p>\n<p>Chọn Hướng 1 - First Half / Second Half vì sơ đồ đánh số năm giai đoạn rõ ràng; chia sau carbonation tạo hai đoạn tự nhiên và giữ đúng thứ tự.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a5.-apply-dàn-ý-chi-tiết\">A5. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: process of making carbonated drinks -&gt; industrial production of fizzy beverages.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction sentence</strong></p>\n<p>The diagram illustrates the five-stage industrial process used to manufacture carbonated drinks.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"overview\">Overview</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview hoàn chỉnh</strong></p>\n<p>Overall, raw water is purified and carbonated before flavouring ingredients are added. The finished liquid is then filtered, filled into bottles and cans, packaged and transported to retailers.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---stages-1-and-2\">Body Paragraph 1 - Stages 1 and 2</h2><blockquote class=\"source-note\">\n<p>• Raw water -&gt; filter -&gt; softener/chemicals -&gt; pump.</p>\n<p>• Electric heating.</p>\n<p>• Cooling pipe.</p>\n<p>• Carbonation tank with carbon dioxide.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>Once the raw water has been filtered, softened and chemically treated, it is pumped through heaters and a cooling pipe before entering the carbonation tank.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---stages-3-to-5\">Body Paragraph 2 - Stages 3 to 5</h2><blockquote class=\"source-note\">\n<p>• Mixing tank: colouring, syrup, flavour.</p>\n<p>• Second filtration.</p>\n<p>• Filling into bottles/cans.</p>\n<p>• Boxing, trucking, supermarket delivery.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>The carbonated liquid is subsequently blended with additives, filtered once more and divided between bottles and cans prior to distribution.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a6.-model-report-band-7.5\">A6. Model Report — Band 7.5+</h1><p>The diagram illustrates the five-stage industrial process used to manufacture carbonated drinks.</p><p>Overall, production begins with the purification of raw water and ends with the packaging and delivery of the finished beverage. Between these points, the water is heated, cooled and carbonated before colouring, syrup and flavouring are added, and the product is filled into both bottles and cans.</p><p>At the first stage, raw water passes through a filter and then enters a water softener, where chemicals are added. A pump transfers the treated water to electric heaters. It is then sent through a cooling pipe before flowing into a carbonation tank, where carbon dioxide is injected to create fizzy water.</p><p>Next, the carbonated liquid enters a mixing tank. Colouring, syrup and flavouring are added, and the ingredients are blended mechanically. The resulting drink is filtered for a second time and directed to filling machines, which place it into either bottles or cans. In the final stage, both types of container are packed into boxes. These boxes are loaded onto delivery trucks and transported to supermarkets, completing the production and distribution process.</p><p><em>Word count: approximately 177 words</em></p><h1 class=\"analysis-section-heading\" id=\"a7.-analyse-phân-tích-ngữ-pháp-nổi-bật\">A7. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>Once the raw water has been filtered, softened and chemically treated, it is pumped through heaters and a cooling pipe before entering the carbonation tank.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Vai trò / cấu trúc</strong></th>\n<th><strong>Nghĩa nhanh</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Once</td>\n<td>Subordinator chỉ hoàn tất bước trước</td>\n<td>sau khi</td>\n</tr>\n<tr class=\"even\">\n<td>the raw water has been filtered, softened and treated</td>\n<td>Present perfect passive + three parallel participles</td>\n<td>nước đã được lọc, làm mềm và xử lý</td>\n</tr>\n<tr class=\"odd\">\n<td>it is pumped</td>\n<td>Present simple passive cho bước tiếp</td>\n<td>nó được bơm</td>\n</tr>\n<tr class=\"even\">\n<td>through heaters and a cooling pipe</td>\n<td>Cụm giới từ chỉ tuyến thiết bị</td>\n<td>qua bộ gia nhiệt và ống làm lạnh</td>\n</tr>\n<tr class=\"odd\">\n<td>before entering</td>\n<td>Before + V-ing</td>\n<td>trước khi đi vào</td>\n</tr>\n<tr class=\"even\">\n<td>the carbonation tank</td>\n<td>Destination noun phrase</td>\n<td>bồn carbon hoá</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>Once + material + has been + V3, V3 and V3, it is + V3 + through/to + equipment + before + V-ing + next stage.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a8.-task-1-language-bank\">A8. Task 1 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Expression / Collocation</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Cách dùng / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>raw water</td>\n<td>noun phrase</td>\n<td>nước thô</td>\n<td>raw water enters a filter</td>\n</tr>\n<tr class=\"even\">\n<td>water softener</td>\n<td>noun phrase</td>\n<td>thiết bị làm mềm nước</td>\n<td>pass through a softener</td>\n</tr>\n<tr class=\"odd\">\n<td>chemical treatment</td>\n<td>noun phrase</td>\n<td>xử lý hoá chất</td>\n<td>undergo chemical treatment</td>\n</tr>\n<tr class=\"even\">\n<td>electric heater</td>\n<td>noun phrase</td>\n<td>bộ gia nhiệt điện</td>\n<td>heated by electric heaters</td>\n</tr>\n<tr class=\"odd\">\n<td>cooling pipe</td>\n<td>noun phrase</td>\n<td>ống làm lạnh</td>\n<td>flow through a cooling pipe</td>\n</tr>\n<tr class=\"even\">\n<td>inject carbon dioxide</td>\n<td>verb phrase</td>\n<td>bơm CO2</td>\n<td>carbon dioxide is injected</td>\n</tr>\n<tr class=\"odd\">\n<td>carbonation tank</td>\n<td>noun phrase</td>\n<td>bồn carbon hoá</td>\n<td>enter the carbonation tank</td>\n</tr>\n<tr class=\"even\">\n<td>mixing tank</td>\n<td>noun phrase</td>\n<td>bồn trộn</td>\n<td>ingredients are added to a mixing tank</td>\n</tr>\n<tr class=\"odd\">\n<td>flavouring ingredient</td>\n<td>noun phrase</td>\n<td>nguyên liệu tạo hương</td>\n<td>add flavouring ingredients</td>\n</tr>\n<tr class=\"even\">\n<td>filter for a second time</td>\n<td>verb phrase</td>\n<td>lọc lần hai</td>\n<td>filtered for a second time</td>\n</tr>\n<tr class=\"odd\">\n<td>fill into bottles and cans</td>\n<td>verb phrase</td>\n<td>rót vào chai và lon</td>\n<td>filled into bottles and cans</td>\n</tr>\n<tr class=\"even\">\n<td>package and distribute</td>\n<td>verb phrase</td>\n<td>đóng gói và phân phối</td>\n<td>packaged and distributed</td>\n</tr>\n</tbody>\n</table>"},"task2":{"label":"Task 2","title":"Peer pressure among young people","type":"Outweigh — disadvantages versus advantages","question":"Young people are often influenced in their behaviours and situations by others of the same age. This is called “peer pressure”. Do the disadvantages of peer pressure outweigh the advantages?","minutes":40,"minimumWords":250,"analysis":"<h1 class=\"analysis-section-heading\" id=\"b1.-think-phân-tích-câu-hỏi\">B1. Think — Phân tích câu hỏi</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: Outweigh — disadvantages versus advantages.</p>\n<p>• Topic: effects of peer pressure on young people’s behaviour and situations.</p>\n<p>• Position khuyến nghị: disadvantages generally outweigh advantages because harmful pressure can affect safety, identity and long-term choices, although positive peer norms can motivate achievement and belonging.</p>\n<p>• Tiêu chí đánh giá: severity, likelihood, duration and reversibility.</p>\n<p>• Plain-English meaning: Ảnh hưởng của bạn cùng tuổi có lợi nhiều hơn hay hại nhiều hơn?</p>\n<p>• Main trap: coi mọi influence là coercion hoặc chỉ liệt kê good/bad without weighing.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"b2.-explore-câu-hỏi-dẫn-dắt-lập-luận-ví-dụ-tóm-tắt\">B2. Explore — Câu hỏi dẫn dắt → Lập luận → Ví dụ → Tóm tắt</h1><h2 id=\"advantages\">ADVANTAGES</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Bạn bè cùng tuổi thúc đẩy hành vi tốt bằng cách nào?</p>\n<p><strong>Lập luận:</strong> Người trẻ coi nhóm bạn là chuẩn mực gần gũi. Nếu nhóm coi trọng học tập, thể thao hoặc hoạt động cộng đồng, thành viên có động lực duy trì nỗ lực để được công nhận.</p>\n<p><strong>Ví dụ:</strong> Một nhóm bạn cùng ôn thi có thể tạo lịch học và trách nhiệm lẫn nhau.</p>\n<p><strong>Tóm tắt:</strong> Positive norms can convert belonging into motivation.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Peer groups hỗ trợ phát triển xã hội ra sao?</p>\n<p><strong>Lập luận:</strong> Bạn bè cung cấp phản hồi, cơ hội hợp tác và cảm giác thuộc về ngoài gia đình. Điều này giúp người trẻ thử vai trò, giao tiếp và xây dựng tự tin.</p>\n<p><strong>Ví dụ:</strong> Tham gia đội thể thao với bạn cùng tuổi có thể dạy kỷ luật và làm việc nhóm.</p>\n<p><strong>Tóm tắt:</strong> Supportive peers can strengthen confidence and social skills.</p>\n</blockquote><h2 id=\"disadvantages-and-weighing\">DISADVANTAGES AND WEIGHING</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Tại sao pressure tiêu cực có thể gây hậu quả nghiêm trọng?</p>\n<p><strong>Lập luận:</strong> Nhu cầu được chấp nhận khiến người trẻ đánh giá thấp rủi ro và làm điều họ không tự chọn, như bắt nạt, sử dụng chất kích thích hoặc lái xe nguy hiểm. Một quyết định ngắn có thể gây hậu quả sức khoẻ, pháp lý hoặc học tập lâu dài.</p>\n<p><strong>Ví dụ:</strong> Một thiếu niên có thể tham gia hành vi nguy hiểm để tránh bị chế giễu là nhút nhát.</p>\n<p><strong>Tóm tắt:</strong> High-severity harms can arise from temporary social pressure.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Peer pressure ảnh hưởng bản sắc và quyết định dài hạn thế nào?</p>\n<p><strong>Lập luận:</strong> Nếu sự chấp nhận phụ thuộc vào việc tuân thủ, người trẻ có thể che giấu sở thích, ngoại hình hoặc mục tiêu của mình. Áp lực lặp lại làm suy yếu tự chủ và có thể dẫn tới lo âu hoặc lựa chọn học tập không phù hợp.</p>\n<p><strong>Ví dụ:</strong> Học sinh có thể bỏ môn mình yêu thích vì nhóm bạn coi nó không “cool”.</p>\n<p><strong>Tóm tắt:</strong> Repeated conformity can damage autonomy beyond the immediate event.</p>\n</blockquote><h2 id=\"tổng-kết-logic-explore\">Tổng kết logic Explore</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Advantages</strong></th>\n<th><strong>Disadvantages</strong></th>\n<th><strong>Why disadvantages outweigh</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Motivation through good norms</td>\n<td>Risk-taking and bullying</td>\n<td>Harms may be severe and irreversible</td>\n</tr>\n<tr class=\"even\">\n<td>Belonging and teamwork</td>\n<td>Loss of autonomy and anxiety</td>\n<td>Negative pressure exploits developmental vulnerability</td>\n</tr>\n<tr class=\"odd\">\n<td>Mutual accountability</td>\n<td>Long-term educational/social choices</td>\n<td>Benefits can be gained through supportive groups without coercion</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b3.-apply-dàn-ý-chi-tiết\">B3. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction-1\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: influenced by others of the same age -&gt; shaped by peers; peer pressure -&gt; pressure to conform.</p>\n<p>• Thesis: disadvantages outweigh despite real benefits.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction hoàn chỉnh</strong></p>\n<p>Peers can encourage young people to work hard, cooperate and feel accepted, but pressure to conform can also promote dangerous behaviour and weaken independent judgement. In my view, the disadvantages outweigh the advantages because the potential harm is more severe and longer-lasting.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---advantages\">Body Paragraph 1 - Advantages</h2><blockquote class=\"source-note\">\n<p>• Positive academic, sporting and civic norms.</p>\n<p>• Belonging, social learning and accountability.</p>\n<p>• Peer advice feels credible and immediate.</p>\n<p>• Benefits depend on voluntary supportive norms.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Link</strong></p>\n<p>Healthy peer influence is valuable when it expands rather than restricts individual choice.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---disadvantages-weighing\">Body Paragraph 2 - Disadvantages + weighing</h2><blockquote class=\"source-note\">\n<p>• Risk-taking, substances, bullying, unsafe acts.</p>\n<p>• Conformity in identity, appearance and study choices.</p>\n<p>• Adolescents particularly sensitive to exclusion.</p>\n<p>• Severity and irreversibility exceed ordinary motivational benefit.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Weighing judgement</strong></p>\n<p>The same social mechanism that creates belonging can become coercive, and its worst outcomes are difficult to reverse.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"conclusion\">Conclusion</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Conclusion draft</strong></p>\n<p>In conclusion, positive peers can motivate effort and teach cooperation, but harmful pressure can threaten safety and autonomy. Because these negative outcomes may be severe and persistent, they outweigh the more replaceable advantages of peer approval.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b4.-model-essay-band-7.5\">B4. Model Essay — Band 7.5+</h1><p>Young people are strongly influenced by others of a similar age, a process commonly described as peer pressure. This influence can encourage achievement and social development, but it may also produce risk-taking and conformity. In my view, the disadvantages outweigh the advantages because the most harmful consequences are more serious and longer-lasting.</p><p>Peer influence can be beneficial when a group promotes constructive norms. Friends who study consistently, participate in sport or volunteer may motivate one another through shared expectations and mutual accountability. Peer groups also offer belonging and opportunities to practise communication, cooperation and conflict resolution. Advice from someone facing similar experiences may feel more relevant than instructions from an adult. These advantages are particularly valuable when participation is voluntary and differences are respected.</p><p>However, pressure becomes dangerous when acceptance depends on obedience. Young people may join in bullying, substance use, unsafe driving or other risky behaviour because they fear ridicule or exclusion. A brief attempt to impress friends can lead to injury, disciplinary action or legal consequences. Repeated pressure can also weaken autonomy. Individuals may hide their interests, change their appearance or abandon educational goals to match the group, increasing anxiety and preventing them from developing a stable identity.</p><p>These harms carry greater weight than the benefits. Motivation, teamwork and friendship can be obtained through supportive groups that do not demand conformity, whereas serious injury, addiction or damaged self-confidence may be difficult to reverse. The severity and duration of negative outcomes therefore exceed the ordinary gains from approval.</p><p>In conclusion, positive peer relationships should be encouraged, but peer pressure itself often exploits young people’s need to belong. Its disadvantages outweigh its advantages when conformity threatens safety and independent judgement.</p><p><em>Word count: approximately 302 words</em></p><h1 class=\"analysis-section-heading\" id=\"b5.-analyse-phân-tích-ngữ-pháp-nổi-bật\">B5. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>Motivation, teamwork and friendship can be obtained through supportive groups that do not demand conformity, whereas serious injury or damaged self-confidence may be difficult to reverse.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Từ loại / cấu trúc / chức năng</strong></th>\n<th><strong>Nghĩa và tác dụng</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Motivation, teamwork and friendship</td>\n<td>Three-part parallel subject</td>\n<td>động lực, làm việc nhóm và tình bạn</td>\n</tr>\n<tr class=\"even\">\n<td>can be obtained</td>\n<td>Modal passive chỉ khả năng thay thế</td>\n<td>có thể đạt được</td>\n</tr>\n<tr class=\"odd\">\n<td>through supportive groups</td>\n<td>Cụm giới từ chỉ phương tiện</td>\n<td>thông qua nhóm hỗ trợ</td>\n</tr>\n<tr class=\"even\">\n<td>that do not demand conformity</td>\n<td>Relative clause giới hạn loại nhóm</td>\n<td>không đòi hỏi sự tuân theo</td>\n</tr>\n<tr class=\"odd\">\n<td>whereas</td>\n<td>Liên từ đối chiếu khi weighing</td>\n<td>trong khi</td>\n</tr>\n<tr class=\"even\">\n<td>may be difficult to reverse</td>\n<td>Modal + adjective + infinitive</td>\n<td>có thể khó đảo ngược</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>Benefit A, B and C + can be obtained through + safer alternative, whereas + serious harm + may be difficult to reverse.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Ví dụ mới</strong></p>\n<p>Convenience and social contact can be obtained through moderate technology use, whereas addiction and lost privacy may be difficult to reverse.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b6.-task-2-language-bank\">B6. Task 2 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Collocation / Expression</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Suggested use / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>peer pressure</td>\n<td>noun phrase</td>\n<td>áp lực đồng trang lứa</td>\n<td>experience peer pressure</td>\n</tr>\n<tr class=\"even\">\n<td>pressure to conform</td>\n<td>noun phrase</td>\n<td>áp lực phải tuân theo</td>\n<td>pressure to conform to a group</td>\n</tr>\n<tr class=\"odd\">\n<td>constructive norm</td>\n<td>noun phrase</td>\n<td>chuẩn mực tích cực</td>\n<td>promote constructive norms</td>\n</tr>\n<tr class=\"even\">\n<td>mutual accountability</td>\n<td>noun phrase</td>\n<td>trách nhiệm lẫn nhau</td>\n<td>create mutual accountability</td>\n</tr>\n<tr class=\"odd\">\n<td>sense of belonging</td>\n<td>noun phrase</td>\n<td>cảm giác thuộc về</td>\n<td>develop a sense of belonging</td>\n</tr>\n<tr class=\"even\">\n<td>independent judgement</td>\n<td>noun phrase</td>\n<td>phán đoán độc lập</td>\n<td>weaken independent judgement</td>\n</tr>\n<tr class=\"odd\">\n<td>risk-taking behaviour</td>\n<td>noun phrase</td>\n<td>hành vi chấp nhận rủi ro</td>\n<td>encourage risk-taking behaviour</td>\n</tr>\n<tr class=\"even\">\n<td>fear of exclusion</td>\n<td>noun phrase</td>\n<td>sợ bị loại trừ</td>\n<td>act from fear of exclusion</td>\n</tr>\n<tr class=\"odd\">\n<td>social coercion</td>\n<td>noun phrase</td>\n<td>sự cưỡng ép xã hội</td>\n<td>avoid social coercion</td>\n</tr>\n<tr class=\"even\">\n<td>weaken autonomy</td>\n<td>verb phrase</td>\n<td>làm suy yếu tự chủ</td>\n<td>pressure weakens autonomy</td>\n</tr>\n<tr class=\"odd\">\n<td>long-lasting consequence</td>\n<td>noun phrase</td>\n<td>hậu quả lâu dài</td>\n<td>a long-lasting consequence</td>\n</tr>\n<tr class=\"even\">\n<td>difficult to reverse</td>\n<td>adjective phrase</td>\n<td>khó đảo ngược</td>\n<td>damage is difficult to reverse</td>\n</tr>\n<tr class=\"odd\">\n<td>supportive peer group</td>\n<td>noun phrase</td>\n<td>nhóm bạn hỗ trợ</td>\n<td>join a supportive peer group</td>\n</tr>\n<tr class=\"even\">\n<td>outweigh the benefit</td>\n<td>verb phrase</td>\n<td>lớn hơn lợi ích</td>\n<td>harms outweigh the benefits</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b7.-consolidate-ứng-dụng-và-mở-rộng\">B7. Consolidate — Ứng dụng và mở rộng</h1><blockquote class=\"source-note\">\n<p>• Social media trends: belonging, conformity and risky challenges.</p>\n<p>• School competition: motivation versus anxiety and identity.</p>\n<p>• Workplace culture: team norms versus unethical group behaviour.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Hướng mở rộng</strong></th>\n<th><strong>Trọng tâm tái sử dụng</strong></th>\n<th><strong>Cụm từ học thuật nổi bật</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Social media</td>\n<td>Viral conformity</td>\n<td>peer approval; risky challenge; fear of exclusion</td>\n</tr>\n<tr class=\"even\">\n<td>School competition</td>\n<td>Motivation and stress</td>\n<td>mutual accountability; autonomy; long-lasting pressure</td>\n</tr>\n<tr class=\"odd\">\n<td>Workplace culture</td>\n<td>Group norms and ethics</td>\n<td>social coercion; independent judgement; supportive group</td>\n</tr>\n</tbody>\n</table>"}},{"id":"test37","number":37,"title":"Trips by gender & reasons for working hard","subtitle":"static horizontal bar chart comparing men and women + Opinion / Agree-Disagree","questionImage":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAVEA7kDAREAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAEDAgYFBAcI/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB9lAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPEjYmzNQZkVDWGTnl5lJjBYboyMwMz886NserHmRjxkJqzMTEzqKpjx6qa0xAyIxQ9NNsAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
