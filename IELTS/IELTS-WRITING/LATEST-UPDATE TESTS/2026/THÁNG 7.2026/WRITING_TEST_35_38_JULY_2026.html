function draftKey(id,mode){return `iw_draft_${id}_${mode}`}
function timerKey(id,mode){return `iw_timer_${id}_${mode}`}
function initialTimer(mode){return mode==='task1'?20*60:mode==='task2'?40*60:60*60}
function getTimer(id,mode){ const d=initialTimer(mode), s=getJSON(timerKey(id,mode),null); if(!s) return {duration:d,remaining:d,running:false,endAt:null,startedAt:null,expired:false}; if(s.running&&s.endAt){s.remaining=Math.max(0,Math.ceil((s.endAt-Date.now())/1000)); if(s.remaining<=0){s.running=false;s.expired=true;}} return s; }
function saveTimer(id,mode,s){setJSON(timerKey(id,mode),s)}
function displayTimer(){ if(!currentPractice)return; const {id,mode,timer}=currentPractice; if(timer.running&&timer.endAt){timer.remaining=Math.max(0,Math.ceil((timer.endAt-Date.now())/1000)); if(timer.remaining<=0){timer.remaining=0;timer.running=false;timer.expired=true;saveTimer(id,mode,timer);showToast('Đã hết thời gian. Bài viết vẫn được giữ nguyên.');}} const el=document.getElementById('timer'); if(el){el.textContent=`${String(Math.floor(timer.remaining/60)).padStart(2,'0')}:${String(timer.remaining%60).padStart(2,'0')}`;el.classList.toggle('expired',timer.expired);document.getElementById('timerLabel').textContent=timer.running?'Đang tính giờ':timer.expired?'Đã hết giờ':'Chưa chạy / đã tạm dừng';} }
function startTimer(){const p=currentPractice;if(!p)return;if(p.timer.remaining<=0){showToast('Hãy đặt lại đồng hồ trước khi bắt đầu.');return;} if(!p.timer.startedAt)p.timer.startedAt=Date.now();p.timer.running=true;p.timer.endAt=Date.now()+p.timer.remaining*1000;p.timer.expired=false;saveTimer(p.id,p.mode,p.timer);displayTimer();}
function pauseTimer(){const p=currentPractice;if(!p)return;if(p.timer.running){p.timer.remaining=Math.max(0,Math.ceil((p.timer.endAt-Date.now())/1000));p.timer.running=false;p.timer.endAt=null;saveTimer(p.id,p.mode,p.timer);displayTimer();}}
function resetTimer(){const p=currentPractice;if(!p)return;if(!confirm('Đặt lại đồng hồ về thời gian ban đầu? Nội dung bài viết không bị xóa.'))return;p.timer={duration:initialTimer(p.mode),remaining:initialTimer(p.mode),running:false,endAt:null,startedAt:null,expired:false};saveTimer(p.id,p.mode,p.timer);displayTimer();}
function loadDraft(id,mode){return getJSON(draftKey(id,mode),{task1:'',task2:'',savedAt:null})}
function saveDraftNow(){if(!currentPractice)return;const d={task1:document.getElementById('essay-task1')?.value||'',task2:document.getElementById('essay-task2')?.value||'',savedAt:Date.now()};setJSON(draftKey(currentPractice.id,currentPractice.mode),d);const s=document.getElementById('saveStatus');if(s)s.textContent=`Đã lưu tự động lúc ${new Date().toLocaleTimeString('vi-VN')}`;}
function updateCounts(){ if(!currentPractice)return; ['task1','task2'].forEach(mode=>{const ta=document.getElementById(`essay-${mode}`);if(!ta)return;const n=wordCount(ta.value),min=findTest(currentPractice.id)[mode].minimumWords;const el=document.getElementById(`count-${mode}`);el.textContent=`${n} từ • ${ta.value.length} ký tự • ${n>=min?'Đã đạt':'Chưa đủ'} ${min} từ`;el.className=`count ${n>=min?'good':'low'}`;}); }
function updateProfile(){const p={name:document.getElementById('studentName')?.value||'',studentId:document.getElementById('studentId')?.value||'',className:document.getElementById('className')?.value||''};setJSON(LS.profile,p);}
function practicePage(id,mode){
  const t=findTest(id); if(!['task1','task2','full'].includes(mode))mode='task1'; markProgress('started',`${id}-${mode}`); const d=loadDraft(id,mode), pr=profile(), timer=getTimer(id,mode); currentPractice={id,mode,timer};
  const modes=mode==='full'?['task1','task2']:[mode];
  app.innerHTML=`<div class="page ${mode==='full'?'full-mode':''}">${breadcrumb([{label:'Trang chủ',href:'home'},{label:'Phòng luyện viết',href:'practice'},{label:`Test ${t.number} — ${taskName(mode)}`}])}<div class="section-heading"><div><h1>Practice Test ${t.number} — ${taskName(mode)}</h1><p>Không hiển thị outline hoặc sample trong khi làm bài.</p></div></div><div class="practice-shell"><aside class="prompt-panel"><div class="timer-card"><div><div id="timer" class="timer">00:00</div><small id="timerLabel">Chưa chạy</small></div><div class="timer-controls"><button class="btn btn-ghost" id="startTimer">Bắt đầu / Tiếp tục</button><button class="btn btn-ghost" id="pauseTimer">Tạm dừng</button><button class="btn btn-ghost" id="resetTimer">Đặt lại</button></div></div><img src="${t.questionImage}" alt="Đề gốc Practice Test ${t.number}">${modes.map(m=>`<div class="question-box"><span class="chip">${t[m].label} • tối thiểu ${t[m].minimumWords} từ</span><h3>${esc(t[m].title)}</h3><p>${esc(t[m].question)}</p></div>`).join('')}</aside><section class="writing-panel"><div class="profile-grid"><div class="field"><label for="studentName">Họ và tên</label><input id="studentName" value="${esc(pr.name)}"></div><div class="field"><label for="studentId">Mã học sinh</label><input id="studentId" value="${esc(pr.studentId)}"></div><div class="field"><label for="className">Lớp</label><input id="className" value="${esc(pr.className)}"></div></div>${modes.map(m=>`<div class="editor-block"><div class="editor-head"><h3>${t[m].label} — ${esc(t[m].title)}</h3><span id="count-${m}" class="count low">0 từ</span></div><textarea class="essay" id="essay-${m}" aria-label="Bài viết ${t[m].label}" placeholder="Viết bài của bạn tại đây...">${esc(d[m]||'')}</textarea></div>`).join('')}<div class="editor-toolbar"><div><button class="btn btn-ghost" id="fontDown">A−</button><button class="btn btn-ghost" id="fontUp">A+</button><button class="btn btn-ghost" id="fullscreen">Toàn màn hình</button></div><span id="saveStatus" class="save-status">${d.savedAt?`Khôi phục bản lưu lúc ${fmtDate(d.savedAt)}`:'Chưa có bản lưu'}</span></div><div class="button-row"><button class="btn btn-secondary" id="saveDraft">Lưu bài</button><button class="btn btn-danger" id="clearDraft">Xóa nội dung</button><button class="btn btn-primary" id="submitEssay">Nộp bài</button></div></section></div></div>`;
  ['studentName','studentId','className'].forEach(x=>document.getElementById(x).addEventListener('input',updateProfile));
  modes.forEach(m=>document.getElementById(`essay-${m}`).addEventListener('input',()=>{updateCounts();const s=document.getElementById('saveStatus');s.textContent='Đang nhập…';clearTimeout(window._saveDebounce);window._saveDebounce=setTimeout(saveDraftNow,700);}));
  document.getElementById('startTimer').onclick=startTimer;document.getElementById('pauseTimer').onclick=pauseTimer;document.getElementById('resetTimer').onclick=resetTimer;document.getElementById('saveDraft').onclick=()=>{saveDraftNow();showToast('Đã lưu bài.');};
  document.getElementById('clearDraft').onclick=()=>{if(confirm('Xóa toàn bộ nội dung đang viết?')){modes.forEach(m=>document.getElementById(`essay-${m}`).value='');updateCounts();saveDraftNow();}};
  document.getElementById('fontDown').onclick=()=>modes.forEach(m=>{const ta=document.getElementById(`essay-${m}`);ta.style.fontSize=Math.max(14,parseFloat(getComputedStyle(ta).fontSize)-1)+'px'});
  document.getElementById('fontUp').onclick=()=>modes.forEach(m=>{const ta=document.getElementById(`essay-${m}`);ta.style.fontSize=Math.min(24,parseFloat(getComputedStyle(ta).fontSize)+1)+'px'});
  document.getElementById('fullscreen').onclick=()=>document.querySelector('.writing-panel').requestFullscreen?.();
  document.getElementById('submitEssay').onclick=submitEssay;
  updateCounts();displayTimer();clearInterval(timerInterval);timerInterval=setInterval(displayTimer,500);
}

function submitEssay(){const cp=currentPractice,t=findTest(cp.id), modes=cp.mode==='full'?['task1','task2']:[cp.mode];pauseTimer();const responses={task1:document.getElementById('essay-task1')?.value||'',task2:document.getElementById('essay-task2')?.value||''};const counts={task1:wordCount(responses.task1),task2:wordCount(responses.task2)};const used=cp.timer.duration-cp.timer.remaining;const body=`<p><strong>Đề:</strong> Practice Test ${t.number} — ${taskName(cp.mode)}</p><p><strong>Số từ:</strong> ${modes.map(m=>`${t[m].label}: ${counts[m]}`).join(' • ')}</p><p><strong>Thời gian đã dùng:</strong> ${fmtDuration(used)}</p><p><strong>Thời gian còn lại:</strong> ${fmtDuration(cp.timer.remaining)}</p><p>Bạn vẫn có thể quay lại chỉnh sửa trước khi xác nhận.</p>`;const m=modal('Xác nhận nộp bài',body,`<button class="btn btn-ghost" data-action="cancel">Quay lại chỉnh sửa</button><button class="btn btn-primary" data-action="confirm">Xác nhận nộp</button>`);m.querySelector('[data-action=cancel]').onclick=()=>closeModal(m);m.querySelector('[data-action=confirm]').onclick=()=>{const pr=profile();const rec={id:String(Date.now()),testId:t.id,testNumber:t.number,mode:cp.mode,profile:pr,responses,counts,startedAt:cp.timer.startedAt||Date.now(),submittedAt:Date.now(),duration:cp.timer.duration,remaining:cp.timer.remaining,elapsed:used};const h=histories();h.unshift(rec);saveHistories(h);const p=progress();p.completed[`${t.id}-${cp.mode}`]=true;p.totalWords+=(counts.task1+counts.task2);p.totalSeconds+=used;saveProgress(p);storageRemove(draftKey(cp.id,cp.mode));storageRemove(timerKey(cp.id,cp.mode));closeModal(m);go(`result/${rec.id}`);};}

function resultPage(id){const rec=histories().find(x=>x.id===id);if(!rec){app.innerHTML=`<div class="page"><div class="empty-state"><h2>Không tìm thấy bài làm</h2><a class="btn btn-primary" href="#history">Về lịch sử</a></div></div>`;return;}const t=findTest(rec.testId),modes=rec.mode==='full'?['task1','task2']:[rec.mode];app.innerHTML=`<div class="page">${breadcrumb([{label:'Trang chủ',href:'home'},{label:'Lịch sử',href:'history'},{label:`Kết quả Test ${t.number}`}])}<div class="section-heading"><div><h1>Kết quả bài làm</h1><p>${esc(rec.profile.name||'Học sinh')} • Practice Test ${t.number} • ${taskName(rec.mode)}</p></div></div><article class="result-paper"><div class="grid grid-3"><div class="stat"><strong>${modes.reduce((s,m)=>s+rec.counts[m],0)}</strong><span>Tổng số từ</span></div><div class="stat"><strong>${fmtDuration(rec.elapsed)}</strong><span>Thời gian thực hiện</span></div><div class="stat"><strong>${fmtDate(rec.submittedAt)}</strong><span>Thời gian nộp</span></div></div>${modes.map(m=>`<section><div class="question-box"><h3>${t[m].label} — Đề bài</h3><p>${esc(t[m].question)}</p></div><h3>${t[m].label} — Bài làm (${rec.counts[m]} từ)</h3><div class="essay-output">${esc(rec.responses[m])}</div></section>`).join('')}<div class="button-row"><button class="btn btn-primary" id="exportWord">Xuất file Word (.docx)</button><a class="btn btn-secondary" href="#analysis/${t.id}/${rec.mode==='full'?'task1':rec.mode}/outline">Đọc outline & sample</a><a class="btn btn-ghost" href="#practice/${t.id}/${rec.mode}">Làm lại</a></div></article></div>`;document.getElementById('exportWord').onclick=()=>exportDocx(rec,t);}

function historyPage(){const h=histories();app.innerHTML=`<div class="page">${breadcrumb([{label:'Trang chủ',href:'home'},{label:'Lịch sử bài làm'}])}<div class="section-heading"><div><h1>Lịch sử bài làm</h1><p>Dữ liệu được lưu trên trình duyệt này và có thể mất nếu bạn xóa dữ liệu trình duyệt.</p></div></div>${h.length?`<table class="history-table"><thead><tr><th>Học sinh</th><th>Bài</th><th>Ngày nộp</th><th>Số từ</th><th>Thời lượng</th><th>Thao tác</th></tr></thead><tbody>${h.map(r=>`<tr><td>${esc(r.profile.name||'Chưa nhập tên')}<br><small>${esc(r.profile.className||'')}</small></td><td>Test ${r.testNumber}<br>${taskName(r.mode)}</td><td>${fmtDate(r.submittedAt)}</td><td>${(r.counts.task1||0)+(r.counts.task2||0)}</td><td>${fmtDuration(r.elapsed)}</td><td><div class="button-row"><a class="btn btn-secondary" href="#result/${r.id}">Xem</a><button class="btn btn-ghost" data-export="${r.id}">Word</button><button class="btn btn-danger" data-delete="${r.id}">Xóa</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty-state"><h2>Chưa có bài đã nộp</h2><p>Hãy chọn một đề và bắt đầu luyện viết.</p><a class="btn btn-primary" href="#practice">Vào phòng luyện viết</a></div>`}</div>`;document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Xóa bài làm này khỏi lịch sử?')){saveHistories(histories().filter(x=>x.id!==b.dataset.delete));historyPage();}});document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const r=histories().find(x=>x.id===b.dataset.export);if(r)exportDocx(r,findTest(r.testId));});}

function guidePage(){app.innerHTML=`<div class="page">${breadcrumb([{label:'Trang chủ',href:'home'},{label:'Hướng dẫn sử dụng'}])}<div class="section-heading"><div><h1>Hướng dẫn sử dụng</h1><p>Sách có thể mở trực tiếp bằng Chrome hoặc Microsoft Edge; bản ZIP chỉ cần giải nén trước khi sử dụng.</p></div></div><div class="guide-list"><article class="card"><h3>1. Mở sách</h3><p>Giải nén file ZIP, sau đó mở <strong>START_HERE.html</strong> hoặc <strong>index.html</strong>. Không cần cài máy chủ hoặc đăng nhập.</p></article><article class="card"><h3>2. Học outline và sample</h3><p>Từ trang đề, chọn “Phân tích đầy đủ”, “Đến Outline” hoặc “Đọc Sample 7.5+”. Thanh mục lục bên trái giúp chuyển nhanh giữa các mục.</p></article><article class="card"><h3>3. Làm bài có tính giờ</h3><p>Chọn Task 1 (20 phút), Task 2 (40 phút) hoặc Full Test (60 phút). Đồng hồ và bản nháp tiếp tục được lưu nếu tải lại trang.</p></article><article class="card"><h3>4. Xuất Microsoft Word</h3><p>Sau khi nộp bài, chọn “Xuất file Word (.docx)”. File gồm thông tin học sinh, đề bài, bài viết và bảng trống để giáo viên chấm theo bốn tiêu chí IELTS.</p></article><article class="card"><h3>5. Bảo vệ dữ liệu</h3><p>Bài viết và lịch sử được lưu bằng localStorage trên máy đang dùng. Hãy xuất Word trước khi xóa dữ liệu trình duyệt hoặc chuyển sang máy khác.</p></article><article class="card"><h3>6. Phiên bản bổ sung đề 35–38</h3><p>Phiên bản này tích hợp đầy đủ Practice Tests 35, 36, 37 và 38, tương ứng 8 Writing Tasks, từ bộ đề và bốn tài liệu phân tích được cung cấp.</p></article></div></div>`;}

// ---------- Minimal valid DOCX generator (offline, no third-party library) ----------
const te=new TextEncoder();
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255]);}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);}
function concat(arrs){let n=arrs.reduce((s,a)=>s+a.length,0),o=new Uint8Array(n),p=0;arrs.forEach(a=>{o.set(a,p);p+=a.length});return o;}
function dosDateTime(d=new Date()){let year=Math.max(1980,d.getFullYear());return {time:(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2),date:((year-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()};}
function zipStore(files){const locals=[],centrals=[];let offset=0;const dt=dosDateTime();for(const f of files){const name=te.encode(f.name),data=typeof f.data==='string'?te.encode(f.data):f.data,crc=crc32(data);const local=concat([u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(dt.time),u16(dt.date),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);const central=concat([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(dt.time),u16(dt.date),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);centrals.push(central);offset+=local.length;}const centralBlob=concat(centrals);const end=concat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralBlob.length),u32(offset),u16(0)]);return concat([...locals,centralBlob,end]);}
function x(s){return esc(s).replace(/&#39;/g,'&apos;');}
function wp(text,bold=false,style=''){const lines=String(text||'').split(/\n/);return lines.map(line=>`<w:p>${style?`<w:pPr><w:pStyle w:val="${style}"/></w:pPr>`:''}<w:r>${bold?'<w:rPr><w:b/></w:rPr>':''}<w:t xml:space="preserve">${x(line||' ')}</w:t></w:r></w:p>`).join('');}
function cell(text,bold=false){return `<w:tc><w:tcPr><w:tcW w:w="2400" w:type="dxa"/></w:tcPr>${wp(text,bold)}</w:tc>`;}
function scoreTable(){const rows=[['Tiêu chí','Điểm','Nhận xét'],['Task Response / Task Achievement','',''],['Coherence and Cohesion','',''],['Lexical Resource','',''],['Grammatical Range and Accuracy','',''],['Overall Band','','']];return `<w:tbl><w:tblPr><w:tblBorders><w:top w:val="single" w:sz="6" w:color="7F8FA6"/><w:left w:val="single" w:sz="6" w:color="7F8FA6"/><w:bottom w:val="single" w:sz="6" w:color="7F8FA6"/><w:right w:val="single" w:sz="6" w:color="7F8FA6"/><w:insideH w:val="single" w:sz="4" w:color="B7C5D8"/><w:insideV w:val="single" w:sz="4" w:color="B7C5D8"/></w:tblBorders></w:tblPr>${rows.map((r,i)=>`<w:tr>${r.map(v=>cell(v,i===0)).join('')}</w:tr>`).join('')}</w:tbl>`;}
function exportDocx(rec,t){const modes=rec.mode==='full'?['task1','task2']:[rec.mode];let body=wp('IELTS WRITING PRACTICE',true,'Title')+wp(`Họ và tên: ${rec.profile.name||'........................................'}`)+wp(`Mã học sinh: ${rec.profile.studentId||'........................................'}    Lớp: ${rec.profile.className||'........................................'}`)+wp(`Ngày làm bài: ${fmtDate(rec.submittedAt)}`)+wp(`Mã đề: Practice Test ${t.number}    Phần thi: ${taskName(rec.mode)}`)+wp(`Thời gian bắt đầu: ${fmtDate(rec.startedAt)}    Thời gian nộp: ${fmtDate(rec.submittedAt)}`)+wp(`Thời lượng: ${fmtDuration(rec.elapsed)}    Tổng số từ: ${(rec.counts.task1||0)+(rec.counts.task2||0)}`);modes.forEach(m=>{body+=wp(`${t[m].label} — QUESTION`,true,'Heading1')+wp(t[m].question)+wp(`${t[m].label} — RESPONSE (${rec.counts[m]} words)`,true,'Heading1')+wp(rec.responses[m]||' ');});body+=wp('PHẦN DÀNH CHO GIÁO VIÊN',true,'Heading1')+scoreTable()+wp('Lỗi cần sửa:')+wp(' ')+wp('Điểm mạnh:')+wp(' ')+wp('Mục tiêu cải thiện:')+wp(' ')+wp('Chữ ký giáo viên: ........................................................');
const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos"/><w:sz w:val="22"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/></w:pPr><w:rPr><w:b/><w:color w:val="153B6F"/><w:sz w:val="34"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="260" w:after="120"/></w:pPr><w:rPr><w:b/><w:color w:val="153B6F"/><w:sz w:val="27"/></w:rPr></w:style></w:styles>`;
const files=[{name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`},{name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`},{name:'word/document.xml',data:documentXml},{name:'word/styles.xml',data:styles},{name:'word/_rels/document.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`},{name:'docProps/core.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>IELTS Writing Practice</dc:title><dc:creator>IELTS Writing Interactive E-book</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString()}</dcterms:created></cp:coreProperties>`},{name:'docProps/app.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>IELTS Writing Interactive E-book</Application></Properties>`}];const bytes=zipStore(files);const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});const date=new Date(rec.submittedAt).toISOString().slice(0,10),name=`${sanitizeFilename(rec.profile.name)}_De_${t.number}_${date}_IELTS_Writing.docx`;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);showToast('Đã tạo file Word .docx');}

function router(){clearInterval(timerInterval);currentPractice=null;document.getElementById('mainNav').classList.remove('open');const [a,b,c,d]=routeParts();if(a==='home')home();else if(a==='bank')bank();else if(a==='test')testDetail(b);else if(a==='analysis'&&b&&c)analysisPage(b,c,d);else if(a==='analysis')analysisIndex();else if(a==='practice'&&b&&c)practicePage(b,c);else if(a==='practice')practiceIndex();else if(a==='history')historyPage();else if(a==='result')resultPage(b);else if(a==='guide')guidePage();else home();window.scrollTo(0,0);setTimeout(()=>app.focus(),0);}
document.getElementById('menuButton').addEventListener('click',e=>{const n=document.getElementById('mainNav');n.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',n.classList.contains('open'));});window.addEventListener('hashchange',router);window.addEventListener('beforeunload',()=>{if(currentPractice)saveDraftNow();});router();
})();

</script>
