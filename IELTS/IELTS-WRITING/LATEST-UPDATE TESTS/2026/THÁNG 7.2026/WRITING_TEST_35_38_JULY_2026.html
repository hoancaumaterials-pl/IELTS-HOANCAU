 European country. Summarise the information by selecting and reporting the main features and make comparisons where relevant.","minutes":20,"minimumWords":150,"analysis":"<table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Lưu ý khi đọc hình</strong></p>\n<p>The horizontal bars are read approximately from the chart. Estimated figures for women/men are: day trips 30/45, sport or entertainment 135/145, visiting friends 210/195, shopping 280/195, and travelling to work 210/325.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a1.-phân-tích-sơ-lược-biểu-đồ-hình\">A1. Phân tích sơ lược biểu đồ / hình</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: static horizontal bar chart comparing men and women.</p>\n<p>• Đối tượng: number of trips for five purposes in one year.</p>\n<p>• Hạng mục: day trips, sport/entertainment, visiting friends, shopping and travelling to work.</p>\n<p>• Đơn vị: number of trips; exact scale is approximate from the low-resolution image.</p>\n<p>• Thời gian: one year, no named date.</p>\n<p>• Thì/cấu trúc: past simple or present simple reporting chart; make trips, outnumber, exceed, respectively.</p>\n<p>• Điểm chính: men made far more commuting trips, women made more shopping and visiting trips, while differences were small for leisure categories.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu mẫu đúng với đề</strong></p>\n<p>Men made approximately 325 journeys to work, over 100 more than women, whereas women undertook about 280 shopping trips compared with roughly 195 for men.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"bảng-dữ-liệu-chi-tiết-đọc-từ-hình\">Bảng dữ liệu / chi tiết đọc từ hình</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Purpose</strong></th>\n<th><strong>Women (approx.)</strong></th>\n<th><strong>Men (approx.)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Day trip</td>\n<td>30</td>\n<td>45</td>\n</tr>\n<tr class=\"even\">\n<td>Sport/Entertainment</td>\n<td>135</td>\n<td>145</td>\n</tr>\n<tr class=\"odd\">\n<td>Visiting friends</td>\n<td>210</td>\n<td>195</td>\n</tr>\n<tr class=\"even\">\n<td>Shopping</td>\n<td>280</td>\n<td>195</td>\n</tr>\n<tr class=\"odd\">\n<td>Travelling to work</td>\n<td>210</td>\n<td>325</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a2.-đặc-điểm-tổng-quan-overview\">A2. Đặc điểm tổng quan (Overview)</h1><h2 id=\"xu-hướng-chính-bức-tranh-chung\">1. Xu hướng chính / Bức tranh chung</h2><p><strong>Câu hỏi dẫn dắt:</strong> Mục đích nào phổ biến nhất với nam và với nữ?</p><p><strong>Câu hỏi dẫn dắt:</strong> Nhóm nào có chênh lệch giới lớn nhất?</p><p><strong>Câu hỏi dẫn dắt:</strong> Hai loại leisure có khác biệt lớn không?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Nhìn chung, đi làm là mục đích phổ biến nhất ở nam giới, còn mua sắm đứng đầu ở nữ. Nam đi làm nhiều hơn nữ rõ rệt, trong khi nữ đi mua sắm và thăm bạn nhiều hơn. Chênh lệch ở day trips và sport/entertainment tương đối nhỏ.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview draft bằng tiếng Anh</strong></p>\n<p>Overall, travelling to work was the leading purpose among men, whereas shopping generated the most trips by women. Men made substantially more commuting journeys, while women travelled more for shopping and visiting friends. Gender differences were comparatively small for day trips and sport or entertainment.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"sự-khác-biệt-chính-điểm-nổi-bật-nhất\">2. Sự khác biệt chính / Điểm nổi bật nhất</h2><p><strong>Câu hỏi dẫn dắt:</strong> Khoảng cách lớn nhất nghiêng về giới nào?</p><p><strong>Câu hỏi dẫn dắt:</strong> Women’s shopping so với men’s commuting như thế nào?</p><p><strong>Câu hỏi dẫn dắt:</strong> Visiting friends có gần cân bằng không?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Khoảng cách lớn nhất là đi làm, với nam cao hơn nữ khoảng 115 chuyến. Mua sắm là khoảng cách lớn tiếp theo nhưng nghiêng về nữ, khoảng 85 chuyến. Thăm bạn tương đối cân bằng, nữ chỉ cao hơn khoảng 15 chuyến.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a3.-explore-key-features-các-hướng-phân-tích\">A3. Explore — Key Features + các hướng phân tích</h1><h2 id=\"các-đặc-điểm-đáng-viết\">Các đặc điểm đáng viết</h2><blockquote class=\"source-note\">\n<p>• Men recorded about 325 commuting trips, the highest single figure.</p>\n<p>• Women made roughly 280 shopping trips, their leading category.</p>\n<p>• Female commuting and visiting-friends trips were both around 210.</p>\n<p>• Men made about 195 trips for both shopping and visiting friends.</p>\n<p>• Sport/entertainment figures were close, at approximately 135 for women and 145 for men.</p>\n<p>• Day trips were least common for both genders, at around 30 and 45.</p>\n</blockquote><h2 id=\"hướng-1---by-gender-difference\">Hướng 1 - By Gender Difference</h2><blockquote class=\"source-note\">\n<p>• Body 1: categories dominated by men - commuting and slightly leisure/day trips.</p>\n<p>• Body 2: categories dominated by women - shopping and visiting friends.</p>\n<p>• Ưu điểm: so sánh trực tiếp là trung tâm.</p>\n<p>• Rủi ro: cần nhắc ranking within each gender.</p>\n<p>• Cụm nối: by a wide margin; slightly outnumbered; the reverse was true.</p>\n</blockquote><h2 id=\"hướng-2---by-purpose-type\">Hướng 2 - By Purpose Type</h2><blockquote class=\"source-note\">\n<p>• Body 1: obligatory/practical trips - work and shopping.</p>\n<p>• Body 2: social/leisure trips - friends, sport and day trips.</p>\n<p>• Ưu điểm: nhóm ý nghĩa hoạt động.</p>\n<p>• Rủi ro: shopping/work khác giới chi phối nên câu cần rõ.</p>\n<p>• Cụm nối: for practical purposes; social journeys; in both cases.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"a4.-so-sánh-hướng-tiếp-cận-recommended-approach\">A4. So sánh hướng tiếp cận + Recommended approach</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Tiêu chí</strong></th>\n<th><strong>Hướng 1: Theo chênh lệch giới</strong></th>\n<th><strong>Hướng 2: Theo mục đích</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Trọng tâm</td>\n<td>Giới nào cao hơn</td>\n<td>Practical versus leisure</td>\n</tr>\n<tr class=\"even\">\n<td>Cấu trúc body</td>\n<td>Male-leading / Female-leading</td>\n<td>Work-shopping / Social-leisure</td>\n</tr>\n<tr class=\"odd\">\n<td>Ưu điểm</td>\n<td>Direct comparisons rõ</td>\n<td>Nhóm activity tự nhiên</td>\n</tr>\n<tr class=\"even\">\n<td>Rủi ro</td>\n<td>Ranking cần tích hợp</td>\n<td>Gender contrast phân tán</td>\n</tr>\n<tr class=\"odd\">\n<td>Khi nên dùng</td>\n<td>Chart so sánh 2 giới</td>\n<td>Muốn thematic grouping</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Recommended approach</strong></p>\n<p>Chọn Hướng 2 - By Purpose Type vì work và shopping là hai hạng mục lớn với xu hướng đối lập, còn ba mục đích social/leisure có thể so sánh trong một đoạn cân đối.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a5.-apply-dàn-ý-chi-tiết\">A5. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: number and purposes of trips -&gt; frequency of journeys made for five reasons; men and women -&gt; male and female residents.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction sentence</strong></p>\n<p>The bar chart compares the approximate numbers of trips made by men and women for five purposes in a European country during one year.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"overview\">Overview</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview hoàn chỉnh</strong></p>\n<p>Overall, men travelled most frequently for work, whereas shopping was women’s leading purpose. The largest gender gaps occurred in these two practical categories, while social and leisure journeys were more similar.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---work-and-shopping\">Body Paragraph 1 - Work and shopping</h2><blockquote class=\"source-note\">\n<p>• Work: men 325 versus women 210.</p>\n<p>• Shopping: women 280 versus men 195.</p>\n<p>• Opposite gender patterns.</p>\n<p>• These are each gender’s maximum.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>Men exceeded women in commuting by roughly 115 trips, while women made approximately 85 more shopping journeys than men.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---social-and-leisure\">Body Paragraph 2 - Social and leisure</h2><blockquote class=\"source-note\">\n<p>• Visiting friends: women 210, men 195.</p>\n<p>• Sport/entertainment: women 135, men 145.</p>\n<p>• Day trips: women 30, men 45.</p>\n<p>• Differences modest, day trips lowest.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>For the remaining purposes, the figures were much closer, with neither gender holding a lead of more than about 15 trips.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a6.-model-report-band-7.5\">A6. Model Report — Band 7.5+</h1><p>The horizontal bar chart compares the approximate numbers of trips made by men and women for five purposes in a European country over one year.</p><p>Overall, travelling to work was the most common purpose for men, while women made the greatest number of shopping trips. These two categories also showed the widest gender differences. By contrast, figures for visiting friends, sport or entertainment, and day trips were relatively similar.</p><p>Men made about 325 journeys to work, which was the highest figure on the chart and roughly 115 more than the female total of 210. The pattern was reversed for shopping. Women undertook approximately 280 such trips, compared with around 195 among men, a gap of about 85. Thus, each gender clearly dominated one major practical purpose.</p><p>The remaining categories were more balanced. Women made roughly 210 trips to visit friends, only around 15 more than men. For sport or entertainment, men recorded approximately 145 journeys, compared with about 135 for women. Day trips were by far the least frequent purpose for both groups, at around 45 for men and 30 for women. Overall, male travel was particularly concentrated on employment, whereas women’s journeys were more strongly associated with shopping and social visits.</p><p><em>Word count: approximately 189 words</em></p><h1 class=\"analysis-section-heading\" id=\"a7.-analyse-phân-tích-ngữ-pháp-nổi-bật\">A7. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>Men exceeded women in commuting by roughly 115 trips, while women made approximately 85 more shopping journeys than men.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Vai trò / cấu trúc</strong></th>\n<th><strong>Nghĩa nhanh</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Men exceeded women</td>\n<td>Exceed + object để so sánh trực tiếp</td>\n<td>nam cao hơn nữ</td>\n</tr>\n<tr class=\"even\">\n<td>in commuting</td>\n<td>Cụm giới từ xác định category</td>\n<td>về đi làm</td>\n</tr>\n<tr class=\"odd\">\n<td>by roughly 115 trips</td>\n<td>By + difference</td>\n<td>khoảng 115 chuyến</td>\n</tr>\n<tr class=\"even\">\n<td>while</td>\n<td>Liên từ đối chiếu đảo chiều</td>\n<td>trong khi</td>\n</tr>\n<tr class=\"odd\">\n<td>women made approximately 85 more shopping journeys</td>\n<td>More + plural noun</td>\n<td>nữ đi mua sắm nhiều hơn khoảng 85 chuyến</td>\n</tr>\n<tr class=\"even\">\n<td>than men</td>\n<td>Than phrase hoàn tất so sánh</td>\n<td>so với nam</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>Group A + exceeded group B in + category + by + difference, while group B + recorded + number more + category + than group A.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a8.-task-1-language-bank\">A8. Task 1 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Expression / Collocation</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Cách dùng / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>make a journey</td>\n<td>verb phrase</td>\n<td>thực hiện chuyến đi</td>\n<td>make commuting journeys</td>\n</tr>\n<tr class=\"even\">\n<td>purpose of travel</td>\n<td>noun phrase</td>\n<td>mục đích đi lại</td>\n<td>five purposes of travel</td>\n</tr>\n<tr class=\"odd\">\n<td>commuting trip</td>\n<td>noun phrase</td>\n<td>chuyến đi làm</td>\n<td>commuting trips dominated</td>\n</tr>\n<tr class=\"even\">\n<td>shopping journey</td>\n<td>noun phrase</td>\n<td>chuyến đi mua sắm</td>\n<td>shopping journeys</td>\n</tr>\n<tr class=\"odd\">\n<td>social visit</td>\n<td>noun phrase</td>\n<td>chuyến thăm xã hội</td>\n<td>trips for social visits</td>\n</tr>\n<tr class=\"even\">\n<td>exceed by</td>\n<td>verb phrase</td>\n<td>cao hơn một lượng</td>\n<td>exceeded by 115 trips</td>\n</tr>\n<tr class=\"odd\">\n<td>the pattern was reversed</td>\n<td>structure</td>\n<td>xu hướng đảo ngược</td>\n<td>the pattern was reversed for shopping</td>\n</tr>\n<tr class=\"even\">\n<td>hold a lead</td>\n<td>verb phrase</td>\n<td>dẫn trước</td>\n<td>held a small lead</td>\n</tr>\n<tr class=\"odd\">\n<td>by a wide margin</td>\n<td>adverbial phrase</td>\n<td>với cách biệt lớn</td>\n<td>led by a wide margin</td>\n</tr>\n<tr class=\"even\">\n<td>comparatively similar</td>\n<td>adjective phrase</td>\n<td>tương đối giống</td>\n<td>figures were comparatively similar</td>\n</tr>\n<tr class=\"odd\">\n<td>be concentrated on</td>\n<td>verb phrase</td>\n<td>tập trung vào</td>\n<td>travel was concentrated on work</td>\n</tr>\n<tr class=\"even\">\n<td>the least frequent purpose</td>\n<td>noun phrase</td>\n<td>mục đích ít thường xuyên nhất</td>\n<td>the least frequent purpose</td>\n</tr>\n</tbody>\n</table>"},"task2":{"label":"Task 2","title":"Reasons people work hard","type":"Opinion / Agree-Disagree","question":"The only reason why people work hard is to earn money, and there is no other reason for doing so. To what extent do you agree or disagree?","minutes":40,"minimumWords":250,"analysis":"<h1 class=\"analysis-section-heading\" id=\"b1.-think-phân-tích-câu-hỏi\">B1. Think — Phân tích câu hỏi</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: Opinion / Agree-Disagree.</p>\n<p>• Topic: whether money is the only reason people work hard.</p>\n<p>• Position khuyến nghị: strongly disagree; pay is fundamental, but mastery, purpose, recognition, identity, autonomy and social contribution also drive sustained effort.</p>\n<p>• Yêu cầu: distinguish why people work from why they work hard.</p>\n<p>• Plain-English meaning: Người ta nỗ lực chỉ vì tiền hay còn động lực nào khác?</p>\n<p>• Main trap: phủ nhận vai trò tiền hoặc dùng examples quá lý tưởng mà không giải thích motivational mechanism.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"b2.-explore-câu-hỏi-dẫn-dắt-lập-luận-ví-dụ-tóm-tắt\">B2. Explore — Câu hỏi dẫn dắt → Lập luận → Ví dụ → Tóm tắt</h1><h2 id=\"why-money-matters\">WHY MONEY MATTERS</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Tiền tạo động lực theo cơ chế nào?</p>\n<p><strong>Lập luận:</strong> Thu nhập bảo đảm nhu cầu, giảm bất an và cho phép người lao động hỗ trợ gia đình. Thưởng theo kết quả còn kết nối nỗ lực với lợi ích cụ thể, đặc biệt trong công việc lặp lại hoặc áp lực cao.</p>\n<p><strong>Ví dụ:</strong> Một nhân viên có thể làm thêm để đạt mục tiêu tiết kiệm hoặc nhận bonus.</p>\n<p><strong>Tóm tắt:</strong> Financial security and incentives are powerful, especially when needs are unmet.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Vì sao pay không thể bị xem nhẹ?</p>\n<p><strong>Lập luận:</strong> Nếu lương bị coi là không công bằng, động lực nội tại thường suy giảm vì người lao động cảm thấy bị khai thác. Do đó các động lực khác hoạt động tốt nhất trên nền tảng đãi ngộ hợp lý.</p>\n<p><strong>Ví dụ:</strong> Một giáo viên yêu nghề vẫn có thể rời đi nếu thu nhập không đủ sống.</p>\n<p><strong>Tóm tắt:</strong> Fair pay is a foundation, not necessarily the sole driver.</p>\n</blockquote><h2 id=\"other-reasons-for-hard-work\">OTHER REASONS FOR HARD WORK</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Mastery và achievement thúc đẩy nỗ lực thế nào?</p>\n<p><strong>Lập luận:</strong> Con người thường muốn trở nên giỏi, giải quyết vấn đề khó và thấy tiến bộ. Công việc có feedback và autonomy tạo cảm giác năng lực mà phần thưởng tiền không thay thế hoàn toàn.</p>\n<p><strong>Ví dụ:</strong> Một lập trình viên có thể dành thêm thời gian sửa lỗi vì muốn sản phẩm hoạt động tốt.</p>\n<p><strong>Tóm tắt:</strong> Professional pride can sustain effort beyond immediate pay.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Purpose, identity và social connection có vai trò gì?</p>\n<p><strong>Lập luận:</strong> Nghề nghiệp có thể gắn với giá trị cá nhân, phục vụ người khác và danh tiếng trong cộng đồng. Đồng nghiệp cũng tạo trách nhiệm và mong muốn không làm nhóm thất vọng.</p>\n<p><strong>Ví dụ:</strong> Nhân viên y tế nỗ lực trong tình huống khẩn cấp vì trách nhiệm với bệnh nhân và đồng đội.</p>\n<p><strong>Tóm tắt:</strong> Meaning and belonging can motivate effort even without an extra payment.</p>\n</blockquote><h2 id=\"tổng-kết-logic-explore\">Tổng kết logic Explore</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Financial motives</strong></th>\n<th><strong>Non-financial motives</strong></th>\n<th><strong>Judgement</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Security and family needs</td>\n<td>Mastery and pride</td>\n<td>Money is necessary but insufficient</td>\n</tr>\n<tr class=\"even\">\n<td>Bonuses and promotion</td>\n<td>Purpose and contribution</td>\n<td>Long-term effort needs intrinsic motivation</td>\n</tr>\n<tr class=\"odd\">\n<td>Fairness signal</td>\n<td>Recognition and teamwork</td>\n<td>Motives interact rather than exclude each other</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b3.-apply-dàn-ý-chi-tiết\">B3. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction-1\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: work hard -&gt; exert sustained effort; only reason -&gt; sole motivation.</p>\n<p>• Thesis: strongly disagree, while acknowledging pay as foundational.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction hoàn chỉnh</strong></p>\n<p>Income is a major reason people exert effort because it provides security and rewards performance, but it is not the only one. I strongly disagree with the statement, since mastery, purpose, recognition and responsibility to others also sustain hard work.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---financial-motivation\">Body Paragraph 1 - Financial motivation</h2><blockquote class=\"source-note\">\n<p>• Basic needs and family obligations.</p>\n<p>• Bonuses, promotion and measurable incentive.</p>\n<p>• Fair pay signals respect.</p>\n<p>• Low/unfair pay can undermine all other motives.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Link</strong></p>\n<p>Money creates the conditions for commitment, but it does not fully explain why effort persists once reasonable security is achieved.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---intrinsic-and-social-motivation\">Body Paragraph 2 - Intrinsic and social motivation</h2><blockquote class=\"source-note\">\n<p>• Mastery, challenge and professional pride.</p>\n<p>• Meaningful contribution and identity.</p>\n<p>• Recognition, autonomy and responsibility to team.</p>\n<p>• These motives often sustain discretionary effort and quality.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Weighing judgement</strong></p>\n<p>The strongest workplaces align fair compensation with meaningful, autonomous and socially valued work.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"conclusion\">Conclusion</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Conclusion draft</strong></p>\n<p>In conclusion, money is an essential incentive and a prerequisite for fairness, but people also work hard to improve, contribute and earn respect. Sustained high-quality effort is usually produced by a combination of financial and non-financial motives.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b4.-model-essay-band-7.5\">B4. Model Essay — Band 7.5+</h1><p>It is sometimes claimed that earning money is the only reason people work hard. Income is undoubtedly a major motivation because it provides security and rewards performance, but I strongly disagree that it is the sole explanation. Mastery, purpose, recognition and responsibility to others also sustain effort.</p><p>Financial motives are particularly powerful when basic needs are not secure. Employees work to pay for housing, food, education and family obligations, while bonuses and promotion can link additional effort to a visible reward. Fair compensation also communicates that an organisation values its staff. If pay is inadequate or unequal, even highly committed workers may feel exploited and reduce their effort. Money is therefore a necessary foundation in most employment relationships.</p><p>However, people frequently work beyond the minimum required even when no immediate payment is available. Many seek mastery: they want to solve difficult problems, improve a skill and take pride in a high-quality result. Autonomy and recognition can make this progress personally satisfying. Work may also express identity or contribute to a social purpose. A healthcare worker responding to an emergency, for example, may be motivated by duty to patients and colleagues as much as by salary. Team membership creates mutual responsibility, and individuals often exert effort because they do not want to disappoint others.</p><p>These motives interact rather than compete. Financial security allows workers to focus, while purpose and professional pride determine whether they contribute creativity, care and persistence. Organisations that rely only on pay may purchase compliance but fail to inspire commitment.</p><p>In conclusion, money is indispensable for security and fairness, but it is not the only reason for hard work. Sustained and high-quality effort usually arises from a combination of adequate reward, meaningful goals, mastery and social responsibility.</p><p><em>Word count: approximately 304 words</em></p><h1 class=\"analysis-section-heading\" id=\"b5.-analyse-phân-tích-ngữ-pháp-nổi-bật\">B5. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>Financial security allows workers to focus, while purpose and professional pride determine whether they contribute creativity, care and persistence.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Từ loại / cấu trúc / chức năng</strong></th>\n<th><strong>Nghĩa và tác dụng</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Financial security</td>\n<td>Abstract noun phrase làm subject</td>\n<td>an toàn tài chính</td>\n</tr>\n<tr class=\"even\">\n<td>allows workers to focus</td>\n<td>Allow + object + to-infinitive</td>\n<td>cho phép người lao động tập trung</td>\n</tr>\n<tr class=\"odd\">\n<td>while</td>\n<td>Contrast/parallel connector</td>\n<td>trong khi</td>\n</tr>\n<tr class=\"even\">\n<td>purpose and professional pride</td>\n<td>Compound subject</td>\n<td>mục đích và niềm tự hào nghề nghiệp</td>\n</tr>\n<tr class=\"odd\">\n<td>determine whether</td>\n<td>Determine + whether-clause</td>\n<td>quyết định liệu</td>\n</tr>\n<tr class=\"even\">\n<td>they contribute creativity, care and persistence</td>\n<td>Three-part parallel object list</td>\n<td>họ đóng góp sáng tạo, sự tận tâm và kiên trì</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>Factor A + allows people to + basic action, while factors B and C + determine whether they + higher-quality contributions.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Ví dụ mới</strong></p>\n<p>Reliable infrastructure allows businesses to operate, while leadership and trust determine whether employees contribute innovation and initiative.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b6.-task-2-language-bank\">B6. Task 2 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Collocation / Expression</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Suggested use / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>financial incentive</td>\n<td>noun phrase</td>\n<td>động lực tài chính</td>\n<td>offer a financial incentive</td>\n</tr>\n<tr class=\"even\">\n<td>financial security</td>\n<td>noun phrase</td>\n<td>an toàn tài chính</td>\n<td>provide financial security</td>\n</tr>\n<tr class=\"odd\">\n<td>family obligation</td>\n<td>noun phrase</td>\n<td>nghĩa vụ gia đình</td>\n<td>meet family obligations</td>\n</tr>\n<tr class=\"even\">\n<td>performance-related reward</td>\n<td>noun phrase</td>\n<td>thưởng theo hiệu suất</td>\n<td>a performance-related reward</td>\n</tr>\n<tr class=\"odd\">\n<td>fair compensation</td>\n<td>noun phrase</td>\n<td>đãi ngộ công bằng</td>\n<td>receive fair compensation</td>\n</tr>\n<tr class=\"even\">\n<td>feel exploited</td>\n<td>verb phrase</td>\n<td>cảm thấy bị khai thác</td>\n<td>workers may feel exploited</td>\n</tr>\n<tr class=\"odd\">\n<td>intrinsic motivation</td>\n<td>noun phrase</td>\n<td>động lực nội tại</td>\n<td>develop intrinsic motivation</td>\n</tr>\n<tr class=\"even\">\n<td>professional mastery</td>\n<td>noun phrase</td>\n<td>sự thành thạo nghề nghiệp</td>\n<td>seek professional mastery</td>\n</tr>\n<tr class=\"odd\">\n<td>take pride in</td>\n<td>verb phrase</td>\n<td>tự hào về</td>\n<td>take pride in quality</td>\n</tr>\n<tr class=\"even\">\n<td>sense of purpose</td>\n<td>noun phrase</td>\n<td>ý thức mục đích</td>\n<td>gain a sense of purpose</td>\n</tr>\n<tr class=\"odd\">\n<td>social contribution</td>\n<td>noun phrase</td>\n<td>đóng góp xã hội</td>\n<td>make a social contribution</td>\n</tr>\n<tr class=\"even\">\n<td>mutual responsibility</td>\n<td>noun phrase</td>\n<td>trách nhiệm lẫn nhau</td>\n<td>create mutual responsibility</td>\n</tr>\n<tr class=\"odd\">\n<td>discretionary effort</td>\n<td>noun phrase</td>\n<td>nỗ lực vượt yêu cầu</td>\n<td>encourage discretionary effort</td>\n</tr>\n<tr class=\"even\">\n<td>sustain commitment</td>\n<td>verb phrase</td>\n<td>duy trì cam kết</td>\n<td>sustain long-term commitment</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b7.-consolidate-ứng-dụng-và-mở-rộng\">B7. Consolidate — Ứng dụng và mở rộng</h1><blockquote class=\"source-note\">\n<p>• Employee retention: pay, autonomy, recognition and culture.</p>\n<p>• Volunteering: contribution without direct financial reward.</p>\n<p>• Student motivation: grades versus mastery and purpose.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Hướng mở rộng</strong></th>\n<th><strong>Trọng tâm tái sử dụng</strong></th>\n<th><strong>Cụm từ học thuật nổi bật</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Retention</td>\n<td>Financial and intrinsic motives</td>\n<td>fair compensation; autonomy; sustain commitment</td>\n</tr>\n<tr class=\"even\">\n<td>Volunteering</td>\n<td>Purpose and identity</td>\n<td>social contribution; duty; recognition</td>\n</tr>\n<tr class=\"odd\">\n<td>Education</td>\n<td>Extrinsic versus intrinsic motivation</td>\n<td>performance reward; mastery; professional pride</td>\n</tr>\n</tbody>\n</table>"}},{"id":"test38","number":38,"title":"Household expenditure & limits on working hours","subtitle":"static/dynamic grouped horizontal bar chart comparing two years + Causes + Positive/Negative development","questionImage":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAVEA7kDAREAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEDAgYEBQcI/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/aAAwD utes":20,"minimumWords":150,"analysis":"<table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Lưu ý khi đọc hình</strong></p>\n<p>Approximate percentages read from the bars are: food and drinks 32% in 1995 and 24% in 2005; housing 28% and 34%; transport 15% and 19%; other goods and services 25% and 23%.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a1.-phân-tích-sơ-lược-biểu-đồ-hình\">A1. Phân tích sơ lược biểu đồ / hình</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: static/dynamic grouped horizontal bar chart comparing two years.</p>\n<p>• Đối tượng: percentage distribution of household expenditure across four categories.</p>\n<p>• Hạng mục: food and drinks, housing, transport, other goods and services.</p>\n<p>• Đơn vị: percentage of household expenditure.</p>\n<p>• Thời gian: 1995 and 2005.</p>\n<p>• Thì chính: past simple; rise from/to, fall by, overtake, account for.</p>\n<p>• Điểm chính: housing and transport gained share, while food and other goods/services declined; housing replaced food as the largest expense.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu mẫu đúng với đề</strong></p>\n<p>Housing expenditure increased from approximately 28% in 1995 to 34% in 2005, overtaking food and drinks, whose share fell from about 32% to 24%.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"bảng-dữ-liệu-chi-tiết-đọc-từ-hình\">Bảng dữ liệu / chi tiết đọc từ hình</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Category</strong></th>\n<th><strong>1995 (approx.)</strong></th>\n<th><strong>2005 (approx.)</strong></th>\n<th><strong>Change</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Food and drinks</td>\n<td>32%</td>\n<td>24%</td>\n<td>-8 points</td>\n</tr>\n<tr class=\"even\">\n<td>Housing</td>\n<td>28%</td>\n<td>34%</td>\n<td>+6 points</td>\n</tr>\n<tr class=\"odd\">\n<td>Transport</td>\n<td>15%</td>\n<td>19%</td>\n<td>+4 points</td>\n</tr>\n<tr class=\"even\">\n<td>Other goods and services</td>\n<td>25%</td>\n<td>23%</td>\n<td>-2 points</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a2.-đặc-điểm-tổng-quan-overview\">A2. Đặc điểm tổng quan (Overview)</h1><h2 id=\"xu-hướng-chính-bức-tranh-chung\">1. Xu hướng chính / Bức tranh chung</h2><p><strong>Câu hỏi dẫn dắt:</strong> Hạng mục lớn nhất đổi từ gì sang gì?</p><p><strong>Câu hỏi dẫn dắt:</strong> Những nhóm nào tăng và nhóm nào giảm?</p><p><strong>Câu hỏi dẫn dắt:</strong> Transport có còn thấp nhất không?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Nhìn chung, cơ cấu chi tiêu chuyển từ thực phẩm sang nhà ở. Housing tăng và trở thành khoản lớn nhất vào năm 2005, trong khi food and drinks giảm mạnh nhất. Transport cũng tăng nhưng vẫn là hạng mục nhỏ nhất; other goods and services giảm nhẹ.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview draft bằng tiếng Anh</strong></p>\n<p>Overall, household spending shifted away from food and towards housing. Housing rose to become the largest category in 2005, while food and drinks recorded the most substantial decline. Transport also increased but remained the smallest item, and other goods and services fell slightly.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"sự-khác-biệt-chính-điểm-nổi-bật-nhất\">2. Sự khác biệt chính / Điểm nổi bật nhất</h2><p><strong>Câu hỏi dẫn dắt:</strong> Khoảng cách housing–food thay đổi thế nào?</p><p><strong>Câu hỏi dẫn dắt:</strong> Category nào thay đổi ít nhất?</p><p><strong>Câu hỏi dẫn dắt:</strong> Tổng share của housing và transport tăng bao nhiêu điểm?</p><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu trả lời mẫu bằng tiếng Việt</strong></p>\n<p>Năm 1995 food cao hơn housing khoảng 4 điểm, nhưng đến 2005 housing cao hơn food khoảng 10 điểm. Other goods and services giảm ít nhất, khoảng 2 điểm. Housing và transport cộng lại tăng từ khoảng 43% lên 53%.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a3.-explore-key-features-các-hướng-phân-tích\">A3. Explore — Key Features + các hướng phân tích</h1><h2 id=\"các-đặc-điểm-đáng-viết\">Các đặc điểm đáng viết</h2><blockquote class=\"source-note\">\n<p>• Food and drinks fell by roughly 8 percentage points, from 32% to 24%.</p>\n<p>• Housing rose by about 6 points, from 28% to 34%, becoming the largest item.</p>\n<p>• Transport increased from approximately 15% to 19%.</p>\n<p>• Other goods and services edged down from around 25% to 23%.</p>\n<p>• The ranking changed: food led in 1995, housing in 2005.</p>\n<p>• Housing plus transport took a majority of spending by 2005.</p>\n</blockquote><h2 id=\"hướng-1---by-direction-of-change\">Hướng 1 - By Direction of Change</h2><blockquote class=\"source-note\">\n<p>• Body 1: rising categories - housing and transport.</p>\n<p>• Body 2: declining categories - food and other goods/services.</p>\n<p>• Ưu điểm: xu hướng rõ.</p>\n<p>• Rủi ro: cần nhấn ranking change.</p>\n<p>• Cụm nối: increased its share; by contrast; edged down.</p>\n</blockquote><h2 id=\"hướng-2---by-importance\">Hướng 2 - By Importance</h2><blockquote class=\"source-note\">\n<p>• Body 1: major categories - food and housing.</p>\n<p>• Body 2: smaller categories - transport and other.</p>\n<p>• Ưu điểm: làm nổi bật crossover food/housing.</p>\n<p>• Rủi ro: other goods/services không luôn nhỏ.</p>\n<p>• Cụm nối: the two largest items; overtook; remained the smallest.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"a4.-so-sánh-hướng-tiếp-cận-recommended-approach\">A4. So sánh hướng tiếp cận + Recommended approach</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Tiêu chí</strong></th>\n<th><strong>Hướng 1: Theo tăng/giảm</strong></th>\n<th><strong>Hướng 2: Theo mức chi tiêu</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Trọng tâm</td>\n<td>Hướng thay đổi</td>\n<td>Ranking và crossover</td>\n</tr>\n<tr class=\"even\">\n<td>Cấu trúc body</td>\n<td>Increase / Decrease</td>\n<td>Major / Remaining</td>\n</tr>\n<tr class=\"odd\">\n<td>Ưu điểm</td>\n<td>Dễ mô tả change</td>\n<td>Overview được chứng minh mạnh</td>\n</tr>\n<tr class=\"even\">\n<td>Rủi ro</td>\n<td>Crossover cần chèn</td>\n<td>Nhóm size chưa hoàn hảo</td>\n</tr>\n<tr class=\"odd\">\n<td>Khi nên dùng</td>\n<td>Hai năm, xu hướng đối lập</td>\n<td>Muốn nhấn top category</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Recommended approach</strong></p>\n<p>Chọn Hướng 2 - By Importance vì thay đổi nổi bật nhất là housing vượt food; hai hạng mục còn lại có thể được xử lý ngắn gọn trong đoạn thứ hai.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a5.-apply-dàn-ý-chi-tiết\">A5. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: percentage of household expenditure -&gt; proportions of household spending; goods and services -&gt; four categories.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction sentence</strong></p>\n<p>The bar chart compares the proportions of household expenditure allocated to four categories in a country in 1995 and 2005.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"overview\">Overview</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Overview hoàn chỉnh</strong></p>\n<p>Overall, housing replaced food and drinks as the largest expense. Spending shares for housing and transport increased, whereas the proportions for food and other goods and services declined.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---food-and-housing\">Body Paragraph 1 - Food and housing</h2><blockquote class=\"source-note\">\n<p>• Food: 32% -&gt; 24%, -8 points.</p>\n<p>• Housing: 28% -&gt; 34%, +6 points.</p>\n<p>• Four-point food lead became ten-point housing lead.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>A four-point advantage for food in 1995 was transformed into a ten-point lead for housing by 2005.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---transport-and-other\">Body Paragraph 2 - Transport and other</h2><blockquote class=\"source-note\">\n<p>• Transport: 15% -&gt; 19%, still lowest.</p>\n<p>• Other goods/services: 25% -&gt; 23%, slight decline.</p>\n<p>• Combined housing + transport: 43% -&gt; 53%.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Useful sentence</strong></p>\n<p>Transport gained four percentage points but remained the smallest category, while other goods and services changed only marginally.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a6.-model-report-band-7.5\">A6. Model Report — Band 7.5+</h1><p>The bar chart compares the percentages of household spending devoted to four categories in a country in 1995 and 2005.</p><p>Overall, expenditure shifted away from food and drinks towards housing. Housing became the largest item by 2005, while food recorded the biggest fall. Transport also gained a greater share but remained the smallest category, whereas other goods and services declined only slightly.</p><p>In 1995, food and drinks accounted for approximately 32% of household expenditure, around four percentage points more than housing at 28%. Over the following decade, these positions were reversed. The food share fell by roughly eight points to 24%, while housing rose by about six points to 34%. Consequently, a small initial lead for food became a ten-point advantage for housing.</p><p>Changes in the other categories were less pronounced. Transport increased from about 15% to 19%, although it was still the lowest proportion in both years. Spending on other goods and services edged down from approximately 25% to 23%. Together, housing and transport represented around 43% of expenditure in 1995 but just over half in 2005, confirming the growing importance of accommodation and mobility in the household budget.</p><p><em>Word count: approximately 181 words</em></p><h1 class=\"analysis-section-heading\" id=\"a7.-analyse-phân-tích-ngữ-pháp-nổi-bật\">A7. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>A four-point advantage for food in 1995 was transformed into a ten-point lead for housing by 2005.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Vai trò / cấu trúc</strong></th>\n<th><strong>Nghĩa nhanh</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>A four-point advantage</td>\n<td>Compound numerical adjective + noun</td>\n<td>lợi thế bốn điểm</td>\n</tr>\n<tr class=\"even\">\n<td>for food</td>\n<td>Cụm giới từ gắn advantage với category</td>\n<td>của thực phẩm</td>\n</tr>\n<tr class=\"odd\">\n<td>in 1995</td>\n<td>Mốc đầu</td>\n<td>năm 1995</td>\n</tr>\n<tr class=\"even\">\n<td>was transformed into</td>\n<td>Passive structure chỉ đảo chiều</td>\n<td>đã chuyển thành</td>\n</tr>\n<tr class=\"odd\">\n<td>a ten-point lead for housing</td>\n<td>Cụm kết quả với lead</td>\n<td>lợi thế mười điểm của nhà ở</td>\n</tr>\n<tr class=\"even\">\n<td>by 2005</td>\n<td>By + final time</td>\n<td>đến năm 2005</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>An initial + numerical advantage for A + was transformed into + numerical lead for B + by + final year.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"a8.-task-1-language-bank\">A8. Task 1 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Expression / Collocation</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Cách dùng / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>household expenditure</td>\n<td>noun phrase</td>\n<td>chi tiêu hộ gia đình</td>\n<td>household expenditure on housing</td>\n</tr>\n<tr class=\"even\">\n<td>allocate spending to</td>\n<td>verb phrase</td>\n<td>phân bổ chi tiêu cho</td>\n<td>allocate spending to transport</td>\n</tr>\n<tr class=\"odd\">\n<td>account for a share</td>\n<td>verb phrase</td>\n<td>chiếm tỷ trọng</td>\n<td>accounted for 32%</td>\n</tr>\n<tr class=\"even\">\n<td>percentage-point decline</td>\n<td>noun phrase</td>\n<td>mức giảm điểm phần trăm</td>\n<td>an eight-point decline</td>\n</tr>\n<tr class=\"odd\">\n<td>overtake</td>\n<td>verb</td>\n<td>vượt qua</td>\n<td>housing overtook food</td>\n</tr>\n<tr class=\"even\">\n<td>positions were reversed</td>\n<td>structure</td>\n<td>vị trí bị đảo ngược</td>\n<td>their positions were reversed</td>\n</tr>\n<tr class=\"odd\">\n<td>gain a greater share</td>\n<td>verb phrase</td>\n<td>tăng tỷ trọng</td>\n<td>transport gained a greater share</td>\n</tr>\n<tr class=\"even\">\n<td>edge down</td>\n<td>verb phrase</td>\n<td>giảm nhẹ</td>\n<td>the figure edged down</td>\n</tr>\n<tr class=\"odd\">\n<td>remain the smallest category</td>\n<td>verb phrase</td>\n<td>vẫn là hạng mục nhỏ nhất</td>\n<td>remained the smallest category</td>\n</tr>\n<tr class=\"even\">\n<td>combined proportion</td>\n<td>noun phrase</td>\n<td>tỷ trọng kết hợp</td>\n<td>the combined proportion</td>\n</tr>\n<tr class=\"odd\">\n<td>household budget</td>\n<td>noun phrase</td>\n<td>ngân sách hộ gia đình</td>\n<td>within the household budget</td>\n</tr>\n<tr class=\"even\">\n<td>shift away from A towards B</td>\n<td>structure</td>\n<td>dịch từ A sang B</td>\n<td>shifted away from food towards housing</td>\n</tr>\n</tbody>\n</table>"},"task2":{"label":"Task 2","title":"Laws limiting working hours","type":"Causes + Positive/Negative development","question":"Some countries have introduced laws to limit working hours for employees. Why are these laws introduced? Do you think they are a positive or negative development?","minutes":40,"minimumWords":250,"analysis":"<h1 class=\"analysis-section-heading\" id=\"b1.-think-phân-tích-câu-hỏi\">B1. Think — Phân tích câu hỏi</h1><blockquote class=\"source-note\">\n<p>• Dạng bài: Causes + Positive/Negative development.</p>\n<p>• Topic: laws limiting employees’ working hours.</p>\n<p>• Yêu cầu: explain why such laws are introduced and make a clear overall judgement.</p>\n<p>• Position khuyến nghị: positive development if flexible exemptions and enforcement are well designed.</p>\n<p>• Plain-English meaning: Vì sao nhà nước giới hạn giờ làm và điều đó tốt hay xấu?</p>\n<p>• Main trap: chỉ nói work-life balance without explaining market failure, or ignore costs/flexibility.</p>\n</blockquote><h1 class=\"analysis-section-heading\" id=\"b2.-explore-câu-hỏi-dẫn-dắt-lập-luận-ví-dụ-tóm-tắt\">B2. Explore — Câu hỏi dẫn dắt → Lập luận → Ví dụ → Tóm tắt</h1><h2 id=\"why-these-laws-are-introduced\">WHY THESE LAWS ARE INTRODUCED</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Tại sao hợp đồng tự nguyện vẫn có thể dẫn tới giờ làm quá dài?</p>\n<p><strong>Lập luận:</strong> Quyền thương lượng không cân bằng khiến người lao động sợ mất việc hoặc thăng tiến nếu từ chối làm thêm. Doanh nghiệp cạnh tranh có thể chuyển chi phí mệt mỏi và sức khoẻ sang nhân viên và xã hội.</p>\n<p><strong>Ví dụ:</strong> Một nhân viên phụ thuộc vào lương có thể chấp nhận overtime thường xuyên dù không thực sự tự nguyện.</p>\n<p><strong>Tóm tắt:</strong> Working-time law corrects unequal bargaining power and external costs.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Giờ làm dài gây hậu quả gì cho cá nhân và tổ chức?</p>\n<p><strong>Lập luận:</strong> Mệt mỏi làm tăng lỗi, tai nạn và bệnh tật, đồng thời giảm thời gian gia đình và phục hồi. Sau một mức nhất định, thêm giờ không đồng nghĩa thêm productivity và có thể làm chất lượng giảm.</p>\n<p><strong>Ví dụ:</strong> Trong công việc vận hành máy móc, fatigue có thể gây nguy hiểm cho cả đồng nghiệp và công chúng.</p>\n<p><strong>Tóm tắt:</strong> Limits protect health, safety and sustainable productivity.</p>\n</blockquote><h2 id=\"positive-or-negative-development\">POSITIVE OR NEGATIVE DEVELOPMENT</h2><blockquote class=\"source-note\">\n<p><strong>Câu hỏi dẫn dắt:</strong> Lợi ích xã hội và kinh tế của giới hạn giờ làm là gì?</p>\n<p><strong>Lập luận:</strong> Quy định tạo chuẩn tối thiểu, giúp cạnh tranh không dựa vào bóc sức lao động và khuyến khích doanh nghiệp tổ chức công việc hiệu quả hơn. Thời gian nghỉ còn hỗ trợ chăm sóc gia đình và tham gia xã hội.</p>\n<p><strong>Ví dụ:</strong> Lịch làm hợp lý có thể giảm nghỉ bệnh và turnover.</p>\n<p><strong>Tóm tắt:</strong> Well-designed limits improve wellbeing and organisational resilience.</p>\n<p><strong>Câu hỏi dẫn dắt:</strong> Nhược điểm và điều kiện thiết kế là gì?</p>\n<p><strong>Lập luận:</strong> Giới hạn cứng có thể gây khó cho ngành thời vụ, dịch vụ khẩn cấp hoặc người muốn tự nguyện làm thêm. Luật cần tính overtime, quyền ngắt kết nối, ngoại lệ minh bạch và chống ép ký từ bỏ quyền.</p>\n<p><strong>Ví dụ:</strong> Bệnh viện có thể cần ngoại lệ ca trực nhưng phải bảo đảm thời gian nghỉ bù.</p>\n<p><strong>Tóm tắt:</strong> Flexibility should be regulated, not used to defeat the protective purpose.</p>\n</blockquote><h2 id=\"tổng-kết-logic-explore\">Tổng kết logic Explore</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Reason for law</strong></th>\n<th><strong>Benefit</strong></th>\n<th><strong>Design safeguard</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Unequal bargaining power</td>\n<td>Protect worker choice</td>\n<td>No coerced opt-outs</td>\n</tr>\n<tr class=\"even\">\n<td>Fatigue and accidents</td>\n<td>Health and public safety</td>\n<td>Rest periods and overtime rules</td>\n</tr>\n<tr class=\"odd\">\n<td>Productivity decline</td>\n<td>Better work organisation</td>\n<td>Sector-specific flexibility</td>\n</tr>\n<tr class=\"even\">\n<td>Family and social costs</td>\n<td>Work-life balance</td>\n<td>Transparent exemptions</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b3.-apply-dàn-ý-chi-tiết\">B3. Apply — Dàn ý chi tiết</h1><h2 id=\"introduction-1\">Introduction</h2><blockquote class=\"source-note\">\n<p>• Paraphrase: laws to limit working hours -&gt; statutory caps on working time; employees -&gt; workers.</p>\n<p>• Thesis: introduced for health, safety and bargaining reasons; overall positive with flexibility.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Introduction hoàn chỉnh</strong></p>\n<p>Governments introduce limits on working hours because individual employees often lack the bargaining power to refuse excessive schedules and because fatigue creates health, safety and social costs. I regard these laws as a positive development, provided that they allow transparent flexibility for exceptional sectors.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-1---reasons\">Body Paragraph 1 - Reasons</h2><blockquote class=\"source-note\">\n<p>• Power imbalance and fear of dismissal.</p>\n<p>• Fatigue, accidents and health costs.</p>\n<p>• Long hours reduce marginal productivity.</p>\n<p>• Family and care responsibilities affected.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Link</strong></p>\n<p>The law establishes a minimum standard where individual negotiation cannot reliably protect workers or the public.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"body-paragraph-2---evaluation\">Body Paragraph 2 - Evaluation</h2><blockquote class=\"source-note\">\n<p>• Health, safety, retention and work-life balance.</p>\n<p>• Fair competition and organisational efficiency.</p>\n<p>• Risks: rigidity, seasonal demand, emergency services, income preferences.</p>\n<p>• Safeguards: overtime pay, rest, limited exemptions, enforcement.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Weighing judgement</strong></p>\n<p>The benefits are population-wide and preventative, while disadvantages can largely be addressed through careful design.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h2 id=\"conclusion\">Conclusion</h2><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Conclusion draft</strong></p>\n<p>In conclusion, working-time limits respond to unequal bargaining power and the substantial costs of fatigue. They are a positive development when they guarantee rest and prevent coercion while retaining narrowly defined flexibility for genuine operational needs.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b4.-model-essay-band-7.5\">B4. Model Essay — Band 7.5+</h1><p>A number of countries have introduced statutory limits on employees’ working hours. These laws are intended to correct unequal bargaining power and reduce the health, safety and social costs of excessive work. I consider them a positive development, provided that they include carefully controlled flexibility for exceptional circumstances.</p><p>Employment contracts are not always negotiated between equal parties. Workers who depend on a salary may accept long schedules because they fear dismissal, lost promotion or reduced hours in the future. Employers, meanwhile, may not bear the full cost of fatigue-related illness, accidents or family breakdown. Long working hours can also become counterproductive: concentration declines, errors increase and additional time produces less useful output. Legal limits establish a minimum standard where individual negotiation may fail to protect either workers or the public.</p><p>The main benefits are improved health, safer workplaces and more sustainable productivity. Adequate rest can reduce mistakes and absence, while predictable time away from work enables childcare, relationships and community participation. Common rules also prevent firms from competing simply by demanding longer hours. Nevertheless, excessively rigid limits could disrupt seasonal industries, emergency services or workers who voluntarily seek extra income. The solution is not to abandon protection but to design it well. Overtime should be recorded and compensated, minimum rest periods enforced, and exemptions restricted to genuine operational needs rather than routine pressure.</p><p>Overall, the advantages are broad and preventative, whereas the disadvantages are largely manageable through transparent exceptions and effective enforcement.</p><p>In conclusion, working-hour laws address market and power imbalances that individuals cannot always solve alone. With appropriate flexibility, they improve safety, wellbeing and the long-term quality of employment, making them a positive development.</p><p><em>Word count: approximately 305 words</em></p><h1 class=\"analysis-section-heading\" id=\"b5.-analyse-phân-tích-ngữ-pháp-nổi-bật\">B5. Analyse — Phân tích ngữ pháp nổi bật</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Câu được chọn</strong></p>\n<p>The solution is not to abandon protection but to design it well: overtime should be recorded and compensated, while exemptions should be restricted to genuine operational needs.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Khối câu</strong></th>\n<th><strong>Từ loại / cấu trúc / chức năng</strong></th>\n<th><strong>Nghĩa và tác dụng</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>The solution is not to abandon protection</td>\n<td>Not to A xác định lựa chọn bị bác bỏ</td>\n<td>giải pháp không phải bỏ bảo vệ</td>\n</tr>\n<tr class=\"even\">\n<td>but to design it well</td>\n<td>But to B cấu trúc song song</td>\n<td>mà là thiết kế tốt</td>\n</tr>\n<tr class=\"odd\">\n<td>:</td>\n<td>Colon giới thiệu biện pháp cụ thể</td>\n<td>cụ thể</td>\n</tr>\n<tr class=\"even\">\n<td>overtime should be recorded and compensated</td>\n<td>Modal passive + parallel verbs</td>\n<td>làm thêm phải được ghi nhận và trả công</td>\n</tr>\n<tr class=\"odd\">\n<td>while exemptions should be restricted</td>\n<td>While-clause cân bằng linh hoạt</td>\n<td>trong khi ngoại lệ phải bị giới hạn</td>\n</tr>\n<tr class=\"even\">\n<td>to genuine operational needs</td>\n<td>Restrict to + phạm vi hợp lệ</td>\n<td>ở nhu cầu vận hành thực sự</td>\n</tr>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>CẤU TRÚC GIẢN LƯỢC</strong></p>\n<p>The solution is not to + remove policy + but to + design/regulate it well: A should be + V3, while exceptions should be restricted to + legitimate cases.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 100%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Ví dụ mới</strong></p>\n<p>The solution is not to prohibit online work but to regulate it well: availability expectations should be clear, while after-hours contact should be restricted to genuine emergencies.</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b6.-task-2-language-bank\">B6. Task 2 Language Bank</h1><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Collocation / Expression</strong></th>\n<th><strong>Form</strong></th>\n<th><strong>Nghĩa tiếng Việt</strong></th>\n<th><strong>Suggested use / Mini-example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>statutory limit</td>\n<td>noun phrase</td>\n<td>giới hạn theo luật</td>\n<td>introduce a statutory limit</td>\n</tr>\n<tr class=\"even\">\n<td>working-time cap</td>\n<td>noun phrase</td>\n<td>trần giờ làm</td>\n<td>a weekly working-time cap</td>\n</tr>\n<tr class=\"odd\">\n<td>unequal bargaining power</td>\n<td>noun phrase</td>\n<td>quyền thương lượng bất cân xứng</td>\n<td>correct unequal bargaining power</td>\n</tr>\n<tr class=\"even\">\n<td>excessive schedule</td>\n<td>noun phrase</td>\n<td>lịch làm quá mức</td>\n<td>refuse an excessive schedule</td>\n</tr>\n<tr class=\"odd\">\n<td>fatigue-related risk</td>\n<td>noun phrase</td>\n<td>rủi ro do mệt mỏi</td>\n<td>reduce fatigue-related risks</td>\n</tr>\n<tr class=\"even\">\n<td>minimum rest period</td>\n<td>noun phrase</td>\n<td>thời gian nghỉ tối thiểu</td>\n<td>enforce rest periods</td>\n</tr>\n<tr class=\"odd\">\n<td>diminishing productivity</td>\n<td>noun phrase</td>\n<td>năng suất giảm dần</td>\n<td>face diminishing productivity</td>\n</tr>\n<tr class=\"even\">\n<td>work-life balance</td>\n<td>noun phrase</td>\n<td>cân bằng công việc-cuộc sống</td>\n<td>improve work-life balance</td>\n</tr>\n<tr class=\"odd\">\n<td>overtime compensation</td>\n<td>noun phrase</td>\n<td>thù lao làm thêm</td>\n<td>require overtime compensation</td>\n</tr>\n<tr class=\"even\">\n<td>coerced opt-out</td>\n<td>noun phrase</td>\n<td>từ bỏ quyền do bị ép</td>\n<td>prevent coerced opt-outs</td>\n</tr>\n<tr class=\"odd\">\n<td>operational need</td>\n<td>noun phrase</td>\n<td>nhu cầu vận hành</td>\n<td>genuine operational needs</td>\n</tr>\n<tr class=\"even\">\n<td>transparent exemption</td>\n<td>noun phrase</td>\n<td>ngoại lệ minh bạch</td>\n<td>allow transparent exemptions</td>\n</tr>\n<tr class=\"odd\">\n<td>effective enforcement</td>\n<td>noun phrase</td>\n<td>thực thi hiệu quả</td>\n<td>ensure effective enforcement</td>\n</tr>\n<tr class=\"even\">\n<td>sustainable employment</td>\n<td>noun phrase</td>\n<td>việc làm bền vững</td>\n<td>support sustainable employment</td>\n</tr>\n</tbody>\n</table><h1 class=\"analysis-section-heading\" id=\"b7.-consolidate-ứng-dụng-và-mở-rộng\">B7. Consolidate — Ứng dụng và mở rộng</h1><blockquote class=\"source-note\">\n<p>• Right to disconnect: boundaries in digital work.</p>\n<p>• Minimum wage: bargaining power and labour standards.</p>\n<p>• Health-and-safety regulation: private contracts versus public risk.</p>\n</blockquote><table class=\"analysis-table\">\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Hướng mở rộng</strong></th>\n<th><strong>Trọng tâm tái sử dụng</strong></th>\n<th><strong>Cụm từ học thuật nổi bật</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Right to disconnect</td>\n<td>After-hours pressure</td>\n<td>working-time boundary; emergency exception; enforcement</td>\n</tr>\n<tr class=\"even\">\n<td>Minimum wage</td>\n<td>Power imbalance</td>\n<td>statutory floor; fair competition; coercion</td>\n</tr>\n<tr class=\"odd\">\n<td>Safety law</td>\n<td>External risk</td>\n<td>fatigue-related risk; minimum standard; compliance</td>\n</tr>\n</tbody>\n</table>"}}]};
