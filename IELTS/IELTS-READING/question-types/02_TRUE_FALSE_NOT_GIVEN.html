ưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “It seemed to Einstein that nothing could be pushing the needle of the compass around except the wind.”\n- Passage: “He wanted to understand why the needle always pointed north whichever way he turned the compass.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":4,"text":"Einstein enjoyed the teaching methods in Switzerland.","answer":"FALSE","source":"Đoạn 3 (PDF trang 33)","evidence":"…But Einstein did not like the teaching there either. He often missed classes and used the time to study physics on his own or to play the violin instead. However, he was able to pass his examinations by studying the notes of a classmate.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…But Einstein did not like the teaching there either.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Einstein enjoyed the teaching methods in Switzerland.”\n- Passage: “…But Einstein did not like the teaching there either.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":5,"text":"Einstein taught himself how to play the violin.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 33)","evidence":"…used the time to study physics on his own or to play the violin instead. However, he was able to pass his examinations by studying the notes of a classmate. His teachers did not have a good opinion of him and refused to recommend him for a university position.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…used the time to study physics on his own or to play the violin instead.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Einstein taught himself how to play the violin” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Einstein taught himself how to play the violin.”\n- Passage: “…used the time to study physics on his own or to play the violin instead.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":6,"text":"His daughter died of schizophrenia when she was two.","answer":"FALSE","source":"Đoạn 4 (PDF trang 33)","evidence":"…It is generally believed that she died from scarlet fever but there are those who believe that she may have suffered from a disorder known as Down Syndrome. But there is not enough evidence to know for sure.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…It is generally believed that she died from scarlet fever but there are those who believe that she may have suffered from a disorder known as Down Syndrome.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “His daughter died of schizophrenia when she was two.”\n- Passage: “…It is generally believed that she died from scarlet fever but there are those who believe that she may have suffered from a disorder known as Down Syndrome.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":7,"text":"The existence of a daughter only became known to the world between 1897 and 1903.","answer":"FALSE","source":"Đoạn 5 (PDF trang 34)","evidence":"…no one even knew that she had existed until Einstein’s granddaughter found 54 love letters that Einstein and Mileva had written to each other between 1897 and 1903. She found these letters inside a shoe box in their attic in California.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…no one even knew that she had existed until Einstein’s granddaughter found 54 love letters that Einstein and Mileva had written to each other between 1897 and 1903.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The existence of a daughter only became known to the world between 1897 and 1903.”\n- Passage: “…no one even knew that she had existed until Einstein’s granddaughter found 54 love letters that Einstein and Mileva had written to each other between 1897 and 1903.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":8,"text":"In 1933 Einstein moved to the United States where he became an American citizen.","answer":"NOT GIVEN","source":"Đoạn 5 (PDF trang 34)","evidence":"Just before the start of World War I, Einstein moved back to Germany and became director of a school there. But in 1933, following death threats from the Nazis, he moved to the United States, where he died on 18th April 1955.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Just before the start of World War I, Einstein moved back to Germany and became director of a school there.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “In 1933 Einstein moved to the United States where he became an American citizen” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “In 1933 Einstein moved to the United States where he became an American citizen.”\n- Passage: “Just before the start of World War I, Einstein moved back to Germany and became director of a school there.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":7,"title":"Drinking Filtered Water","passage":["Drinking Filtered Water A. The body is made up mainly of water. This means that the quality of water that we drink every day has an important effect on our health. Filtered water is healthier than tap water and some bottled water. This is because it is free of contaminants, that is, of substances that make it dirty or harmful. Substances that settle on the bottom of a glass of tap water and microorganisms that carry diseases (known as bacteria or germs) are examples of contaminants. Filtered water is also free of poisonous metals and chemicals that are common in tap water and even in some bottled water brands.","B. The authorities know that normal tap water is full of contaminants and they use chemicals, such as chlorine and bromine in order to disinfect it. But such chemicals are hardly safe. Indeed, their use in water is associated with many different conditions and they are particularly dangerous for children and pregnant women. For example, consuming bromine for a long time may result in low blood pressure, which may then bring about poisoning of the brain, heart, kidneys and liver. Filtered water is typically free of such water disinfectant chemicals.","C. Filtered water is also free of metals, such as mercury and lead. Mercury has ended up in our drinking water mainly because the dental mixtures used by dentists have not been disposed of safely for a long time. Scientists believe there is a connection between mercury in the water and many allergies and cancers as well as disorders, such as ADD, OCD, autism and depression.","D. Lead, on the other hand, typically finds its way to our drinking water due to pipe leaks. Of course, modern pipes are not made of lead but pipes in old houses usually are. Lead is a well-known carcinogen and is associated with pregnancy problems and birth defects. This is another reason why children and pregnant women must drink filtered water.","E. The benefits of water are well known. We all know, for example, that it helps to detoxify the body, So, the purer the water we drink, the easier it is for the body to rid itself of toxins. The result of drinking filtered water is that the body does not have to use as much of its energy on detoxification as it would when drinking unfiltered water. This means that drinking filtered water is good for our health in general. That is because the body can perform all of its functions much more easily and this results in improved metabolism, better weight management, improved joint lubrication as well as efficient skin hydration. F. There are many different ways to filter water and each type of filter targets different contaminants. For example, activated carbon water filters are very good at taking chlorine out. Ozone water filters, on the other hand, are particularly effective at removing germs. G. For this reason, it is very important to know exactly what is in the water that we drink so that we can decide what type of water filter to use.","A Consumer Confidence Report (CCR) should be useful for this purpose. This is a certificate that is issued by public water suppliers every year, listing the contaminants present in the water. If you know what these contaminants are, then it is easier to decide which type of water filter to get."],"questions":[{"n":21,"text":"The type of water you consume on a regular basis has a great impact on your overall health and wellness.","answer":"TRUE","source":"Đoạn A (PDF trang 37)","evidence":"…the quality of water that we drink every day has an important effect on our health. Filtered water is healthier than tap water and some bottled water. This is because it is free of contaminants, that is, of substances that make it dirty or harmful.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…the quality of water that we drink every day has an important effect on our health.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The type of water you consume on a regular basis has a great impact on your overall health and wellness.”\n- Passage: “…the quality of water that we drink every day has an important effect on our health.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":22,"text":"Filtered water typically contains water disinfectant chemicals.","answer":"FALSE","source":"Đoạn C (PDF trang 38)","evidence":"…Filtered water is typically free of such water disinfectant chemicals. C. Filtered water is also free of metals, such as mercury and lead. Mercury has ended up in our drinking water mainly because the dental mixtures used by dentists have not been disposed of safely for a long time.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…Filtered water is typically free of such water disinfectant chemicals.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Filtered water typically contains water disinfectant chemicals.”\n- Passage: “…Filtered water is typically free of such water disinfectant chemicals.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":23,"text":"Exposure to disinfectant chemicals is linked with poisoning of the vital organs.","answer":"TRUE","source":"Đoạn B (PDF trang 37)","evidence":"…consuming bromine for a long time may result in low blood pressure, which may then bring about poisoning of the brain, heart, kidneys and liver. Filtered water is typically free of such water disinfectant chemicals.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…consuming bromine for a long time may result in low blood pressure, which may then bring about poisoning of the brain, heart, kidneys and liver.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Exposure to disinfectant chemicals is linked with poisoning of the vital organs.”\n- Passage: “…consuming bromine for a long time may result in low blood pressure, which may then bring about poisoning of the brain, heart, kidneys and liver.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":24,"text":"Drinking tap water helps minimise your exposure to harmful elements.","answer":"FALSE","source":"Đoạn A (PDF trang 37)","evidence":"…Filtered water is healthier than tap water and some bottled water. This is because it is free of contaminants, that is, of substances that make it dirty or harmful. Substances that settle on the bottom of a glass of tap water and microorganisms that carry diseases (known as bacteria or germs) are examples of contaminants.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…Filtered water is healthier than tap water and some bottled water.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Drinking tap water helps minimise your exposure to harmful elements.”\n- Passage: “…Filtered water is healthier than tap water and some bottled water.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":25,"text":"People wearing artificial teeth are more likely to be contaminated.","answer":"NOT GIVEN","source":"Đoạn G (PDF trang 39)","evidence":"This is a certificate that is issued by public water suppliers every year, listing the contaminants present in the water. If you know what these contaminants are, then it is easier to decide which type of water filter to get.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “This is a certificate that is issued by public water suppliers every year, listing the contaminants present in the water.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “more likely to be contaminated” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “People wearing artificial teeth are more likely to be contaminated.”\n- Passage: “This is a certificate that is issued by public water suppliers every year, listing the contaminants present in the water.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":26,"text":"People who are depressed often suffer from dehydration.","answer":"NOT GIVEN","source":"Đoạn E (PDF trang 38)","evidence":"That is because the body can perform all of its functions much more easily and this results in improved metabolism, better weight management, improved joint lubrication as well as efficient skin hydration. There are many different ways to filter water and each type of filter targets different contaminants.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “That is because the body can perform all of its functions much more easily and this results in improved metabolism, better weight management, improved joint lubrication as well as efficient skin hydration.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “People who are depressed often suffer from dehydration” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “People who are depressed often suffer from dehydration.”\n- Passage: “That is because the body can perform all of its functions much more easily and this results in improved metabolism, better weight management, improved joint lubrication as well as efficient skin hydration.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":8,"title":"Speech Dysfluency and Popular Fillers","passage":["Speech Dysfluency and Popular Fillers A speech dysfluency is any of various breaks, irregularities or sound-filled pauses that we make when we are speaking, which are commonly known as fillers. These include words and sentences that are not finished, repeated phrases or syllables, instances of speakers correcting their own mistakes as they speak and “words” such as ‘huh’, ‘uh’, ‘erm’, ‘urn’, ‘hmm’, ‘err’, ‘like’, ‘you know’ and ‘well’.","Fillers are parts of speech which are not generally recognised as meaningful and they include speech problems, such as stuttering (repeating the first consonant of some words). Fillers are normally avoided on television and films, but they occur quite regularly in everyday conversation, sometimes making up more than 20% of “words” in speech. But they can also be used as a pause for thought. Research in linguistics has shown that fillers change across cultures and that even the different English speaking nations use different fillers. For example, Americans use pauses such as ‘um’ or ’em’ whereas the British say ‘uh’ or ‘eh’.","Spanish speakers say ‘ehhh’ and in Latin America (where they also speak Spanish) but not Spain, ‘este’ is used (normally meaning ‘this’). Recent linguistic research has suggested that the use of ‘uh’ and ‘um’ in English is connected to the speaker’s mental and emotional state. For example, while pausing to say ‘uh’ or ‘um’ the brain may be planning the use of future words.","According to the University of Pennsylvania linguist Mark Liberman, ‘um’ generally comes before a longer or more important pause than ‘uh’. At least that’s what he used to think. Liberman has discovered that as Americans get older, they use ‘uh’ more than ‘um’ and that men use ‘uh’ more than women no matter their age. But the opposite is true of ‘um’. The young say ‘um’ more often than the old. And women say ‘um’ more often than men at every age. This was an unexpected result because scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is.","Liberman mentioned his finding to fellow linguists in the Netherlands and this encouraged the group to look for a pattern outside American English. They studied British and Scottish English, German, Danish, Dutch and Norwegian and found that women and younger people said ‘um’ more than ‘uh’ in those languages as well.","Their conclusion is that it is simply a case of language change in progress and that women and younger people are leading the change. And there is nothing strange about this. Women and young people normally are the typical pioneers of most language change. What is strange, however, is that ‘um’ is replacing ‘uh’ across at least two continents and five Germanic languages. Now this really is a mystery.","The University of Edinburgh sociolinguist Josef Fruehwald may have an answer. In his view, ‘um’ and ‘uh’ are pretty much equivalent. The fact that young people and women prefer it is not significant. This often happens in language when there are two options. People start using one more often until the other is no longer an option. It’s just one of those things.As to how such a trend might have gone from one language to another, there is a simple explanation, according to Fruehwald. English is probably influencing the other languages. We all know that in many countries languages are constantly borrowing words and expressions of English into their own language so why not borrow fillers, too? Of course, we don’t know for a fact whether that’s actually what’s happening with ‘um’ but it is a likely story."],"questions":[{"n":27,"text":"Fillers are usually expressed as pauses and probably have no linguistic meaning although they may have a purpose.","answer":"TRUE","source":"Đoạn 2 (PDF trang 41)","evidence":"…Fillers are parts of speech which are not generally recognised as meaningful and they include speech problems, such as stuttering (repeating the first consonant of some words). Fillers are normally avoided on television and films, but they occur quite regularly in everyday conversation, sometimes making up more than 20% of “words” in speech.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Fillers are parts of speech which are not generally recognised as meaningful and they include speech problems, such as stuttering (repeating the first consonant of some words).”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Fillers are usually expressed as pauses and probably have no linguistic meaning although they may have a purpose.”\n- Passage: “…Fillers are parts of speech which are not generally recognised as meaningful and they include speech problems, such as stuttering (repeating the first consonant of some words).”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":28,"text":"In general, fillers vary across cultures.","answer":"TRUE","source":"Đoạn 2 (PDF trang 41)","evidence":"…Research in linguistics has shown that fillers change across cultures and that even the different English speaking nations use different fillers. For example, Americans use pauses such as ‘um’ or ’em’ whereas the British say ‘uh’ or ‘eh’.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Research in linguistics has shown that fillers change across cultures and that even the different English speaking nations use different fillers.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In general, fillers vary across cultures.”\n- Passage: “…Research in linguistics has shown that fillers change across cultures and that even the different English speaking nations use different fillers.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":29,"text":"Fillers are uncommon in everyday language.","answer":"FALSE","source":"Đoạn 2 (PDF trang 41)","evidence":"…they occur quite regularly in everyday conversation, sometimes making up more than 20% of “words” in speech. But they can also be used as a pause for thought. Research in linguistics has shown that fillers change across cultures and that even the different English speaking nations use different fillers.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…they occur quite regularly in everyday conversation, sometimes making up more than 20% of “words” in speech.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Fillers are uncommon in everyday language.”\n- Passage: “…they occur quite regularly in everyday conversation, sometimes making up more than 20% of “words” in speech.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":30,"text":"American men use ‘uh’ more than American women do.","answer":"TRUE","source":"Đoạn 4 (PDF trang 42)","evidence":"…men use ‘uh’ more than women no matter their age. But the opposite is true of ‘um’. The young say ‘um’ more often than the old. And women say ‘um’ more often than men at every age.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…men use ‘uh’ more than women no matter their age.”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “American men use ‘uh’ more than American women do.”\n- Passage: “…men use ‘uh’ more than women no matter their age.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":31,"text":"Younger Spaniards say ‘ehhh’ more often than older Spaniards.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 42)","evidence":"Spanish speakers say ‘ehhh’ and in Latin America (where they also speak Spanish) but not Spain, ‘este’ is used (normally meaning ‘this’).","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Spanish speakers say ‘ehhh’ and in Latin America (where they also speak Spanish) but not Spain, ‘este’ is used (normally meaning ‘this’).”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “more often than older Spaniards” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Younger Spaniards say ‘ehhh’ more often than older Spaniards.”\n- Passage: “Spanish speakers say ‘ehhh’ and in Latin America (where they also speak Spanish) but not Spain, ‘este’ is used (normally meaning ‘this’).”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":32,"text":"In the past linguists did not think that fillers are about the amount of time a speaker hesitates.","answer":"FALSE","source":"Đoạn 4 (PDF trang 42)","evidence":"…scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is. Liberman mentioned his finding to fellow linguists in the Netherlands and this encouraged the group to look for a pattern outside American English.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “In the past linguists did not think that fillers are about the amount of time a speaker hesitates.”\n- Passage: “…scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":33,"text":"During a coffee break Liberman was chatting with a small group of researchers.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 42)","evidence":"This was an unexpected result because scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is. Liberman mentioned his finding to fellow linguists in the Netherlands and this encouraged the group to look for a pattern outside American English.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “This was an unexpected result because scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “During a coffee break Liberman was chatting with a small group of researchers” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “During a coffee break Liberman was chatting with a small group of researchers.”\n- Passage: “This was an unexpected result because scientists used to think that fillers had to do more with the amount of time a speaker pauses for, rather than with who the speaker is.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":34,"text":"Fruehwald does not believe that there are age and gender differences related to ‘um’ and ‘uh’.","answer":"FALSE","source":"Đoạn 7 (PDF trang 43)","evidence":"The University of Edinburgh sociolinguist Josef Fruehwald may have an answer. In his view, ‘um’ and ‘uh’ are pretty much equivalent.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “The University of Edinburgh sociolinguist Josef Fruehwald may have an answer.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Fruehwald does not believe that there are age and gender differences related to ‘um’ and ‘uh’.”\n- Passage: “The University of Edinburgh sociolinguist Josef Fruehwald may have an answer.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."}]},{"id":9,"title":"Why We Need to Protect Polar Bears","passage":["Why We Need to Protect Polar Bears Polar bears are being increasingly threatened by the effects of climate change, but their disappearance could have far-reaching consequences. They are uniquely adapted to the extreme conditions of the Arctic Circle, where temperatures can reach -40°C. One reason for this is that they have up to centimetres of fat underneath their skin. Humans with comparative levels of adipose tissue would be considered obese and would be likely to suffer from diabetes and heart disease. Yet the polar bear experiences no such consequences.","A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery. They compared the genetic structure of polar bears with that of their closest relatives from a warmer climate, the brown bears. This allowed them to determine the genes that have allowed polar bears to survive in one of the toughest environments on Earth. Liu and his colleagues found the polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) – a form of ‘bad’ cholesterol.","In humans, mutations of this gene are associated with increased risk of heart disease. Polar bears may therefore be an important study model to understand heart disease in humans. The genome of the polar bear may also provide the solution for another condition, one that particularly affects our older generation: osteoporosis. This is a disease where bones show reduced density, usually caused by insufficient exercise, reduced calcium intake or food starvation.","Bone tissue is constantly being remodelled, meaning that bone is added or removed, depending on nutrient availability and the stress that the bone is under. Female polar bears, however, undergo extreme conditions during every pregnancy. Once autumn comes around, these females will dig maternity dens in the snow and will remain there throughout the winter, both before and after the birth of their cubs. This process results in about six months of fasting, where the female bears have to keep themselves and their cubs alive, depleting their own calcium and calorie reserves. Despite this, their bones remain strong and dense.","Physiologists Alanda Lennox and Allen Goodship found an explanation for this paradox in 2008. They discovered that pregnant bears were able to increase the density of their bones before they started to build their dens. In addition, six months later, when they finally emerged from the den with their cubs, there","was no evidence of significant loss of bone density. Hibernating brown bears do not have this capacity and must therefore resort to major bone reformation in the following spring. If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit.","The medical benefits of the polar bear for humanity certainly have their importance in our conservation efforts, but these should not be the only factors taken into consideration. We tend to want to protect animals we think are intelligent and possess emotions, such as elephants and primates. Bears, on the other hand, seem to be perceived as stupid and in many cases violent. And yet anecdotal evidence from the field challenges those assumptions, suggesting for example that polar bears have good problem-solving abilities. A male bear called GoGo in Tennoji Zoo, Osaka, has even been observed making use of a tool to manipulate his environment. The bear used a tree branch on multiple occasions to dislodge a piece of meat hung out of his reach. Problem-solving ability has also been witnessed in wild polar bears, although not as obviously as with GoGo. A calculated move by a male bear involved running and jumping onto barrels in an attempt to get to a photographer standing on a platform four metres high. In other studies, such as one by Alison Ames in 2008, polar bears showed deliberate and focussed manipulation.","For example, Ames observed bears putting objects in piles and then knocking them over in what appeared to be a game. The study demonstrates that bears are capable of agile and thought-out behaviours. These examples suggest bears have greater creativity and problem-solving abilities than previously thought.","As for emotions, while the evidence is once again anecdotal, many bears have been seen to hit out at ice and snow – seemingly out of frustration – when they have just missed out on a kill. Moreover, polar bears can form unusual relationships with other species, including playing with the dogs used to pull sleds in the Arctic. Remarkably, one hand-raised polar bear called Agee has formed a close relationship with her owner Mark Dumas to the point where they even swim together. This is even more astonishing since polar bears are known to actively hunt humans in the wild. If climate change were to lead to their extinction, this would mean not only the loss of potential breakthroughs in human medicine, but more importantly, the disappearance of an intelligent, majestic animal."],"questions":[{"n":1,"text":"Polar bears suffer from various health problems due to the build-up of fat under their skin.","answer":"FALSE","source":"Đoạn 1 (PDF trang 45)","evidence":"One reason for this is that they have up to 11 centimetres of fat underneath their skin. Humans with comparative levels of adipose tissue would be considered obese and would be likely to suffer from diabetes and heart disease. Yet the polar bear experiences no such consequences.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là quan hệ nguyên nhân - kết quả. Passage thực tế viết: “One reason for this is that they have up to 11 centimetres of fat underneath their skin.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Polar bears suffer from various health problems due to the build-up of fat under their skin.”\n- Passage: “One reason for this is that they have up to 11 centimetres of fat underneath their skin.”\n- Quan hệ nghĩa: đối lập ở quan hệ nguyên nhân - kết quả."},{"n":2,"text":"The study done by Liu and his colleagues compared different groups of polar bears.","answer":"FALSE","source":"Đoạn 2 (PDF trang 45)","evidence":"A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery. They compared the genetic structure of polar bears with that of their closest relatives from a warmer climate, the brown bears.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The study done by Liu and his colleagues compared different groups of polar bears.”\n- Passage: “A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":3,"text":"Liu and colleagues were the first researchers to compare polar bears and brown bears genetically.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 45)","evidence":"A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery. They compared the genetic structure of polar bears with that of their closest relatives from a warmer climate, the brown bears.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “first researchers to compare polar bears and brown bears genetically” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Liu and colleagues were the first researchers to compare polar bears and brown bears genetically.”\n- Passage: “A 2014 study by Shi Ping Liu and colleagues sheds light on this mystery.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":4,"text":"Polar bears are able to control their levels of ‘bad’ cholesterol by genetic means.","answer":"TRUE","source":"Đoạn 2 (PDF trang 45)","evidence":"Liu and his colleagues found the polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) – a form of ‘bad’ cholesterol.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Liu and his colleagues found the polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) – a form of ‘bad’ cholesterol.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Polar bears are able to control their levels of ‘bad’ cholesterol by genetic means.”\n- Passage: “Liu and his colleagues found the polar bears had a gene known as APoB, which reduces levels of low-density lipoproteins (LDLs) – a form of ‘bad’ cholesterol.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":5,"text":"Female polar bears are able to survive for about six months without food.","answer":"TRUE","source":"Đoạn 4 (PDF trang 46)","evidence":"Female polar bears, however, undergo extreme conditions during every pregnancy. Once autumn comes around, these females will dig maternity dens in the snow and will remain there throughout the winter, both before and after the birth of their cubs. This process results in about six months of fasting, where the female bears have to keep themselves and their cubs alive, depleting their own calcium and calorie reserves.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Female polar bears, however, undergo extreme conditions during every pregnancy.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Female polar bears are able to survive for about six months without food.”\n- Passage: “Female polar bears, however, undergo extreme conditions during every pregnancy.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":6,"text":"It was found that the bones of female polar bears were very weak when they came out of their dens in spring.","answer":"FALSE","source":"Đoạn 5 (PDF trang 46)","evidence":"They discovered that pregnant bears were able to increase the density of their bones before they started to build their dens. In addition, six months later, when they finally emerged from the den with their cubs, there was no evidence of significant loss of bone density. Hibernating brown bears do not have this capacity and must therefore resort to major bone reformation in the following spring.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “They discovered that pregnant bears were able to increase the density of their bones before they started to build their dens.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “It was found that the bones of female polar bears were very weak when they came out of their dens in spring.”\n- Passage: “They discovered that pregnant bears were able to increase the density of their bones before they started to build their dens.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":7,"text":"The polar bear’s mechanism for increasing bone density could also be used by people one day.","answer":"TRUE","source":"Đoạn 7 (PDF trang 47)","evidence":"…If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit. The medical benefits of the polar bear for humanity certainly have their importance in our conservation efforts, but these should not be the only factors taken into consideration.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The polar bear’s mechanism for increasing bone density could also be used by people one day.”\n- Passage: “…If the mechanism of bone remodelling in polar bears can be understood, many bedridden humans, and even astronauts, could potentially benefit.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":10,"title":"The White Horse of Uffington","passage":["The White Horse of Uffington The cutting of huge figures or ‘geoglyphs’ into the earth of English hillsides has taken place for more than 3,000 years. There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties. The figures include giants, horses, crosses and regimental badges. Although the majority of these geoglyphs date within the last 300 years or so, there are one or two that are much older.","The most famous of these figures is perhaps also the most mysterious – the Uffington White Horse in Oxfordshire. The White Horse has recently been re-dated and shown to be even older than its previously assigned ancient pre-Roman Iron Age date. More controversial is the date of the enigmatic Long Man of Wilmington in Sussex. While many historians are convinced the figure is prehistoric, others believe that it was the work of an artistic monk from a nearby priory and was created between the 11th and 15th centuries. The method of cutting these huge figures was simply to remove the overlying grass to reveal the gleaming white chalk below. However, the grass would soon grow","over the geoglyph again unless it was regularly cleaned or scoured by a fairly large team of people. One reason that the vast majority of hill figures have disappeared is that when the traditions associated with the figures faded, people no longer bothered or remembered to clear away the grass to expose the chalk outline. Furthermore, over hundreds of years the outlines would sometimes change due to people not always cutting in exactly the same place, thus creating a different shape to the original geoglyph.","The fact that any ancient hill figures survive at all in England today is testament to the strength and continuity of local customs and beliefs which, in one case at least, must stretch back over millennia. The Uffington White Horse is a unique, stylised representation of a horse consisting of a long, sleek back, thin disjointed legs, a streaming tail, and a bird-like beaked head. The elegant creature almost melts into the landscape. The horse is situated 2.5 km from Uffington village on a steep slope close to the Late Bronze Age* (c. 7th century BCE) hillfort of Uffington Castle and below the Ridgeway, a long-distance Neolithic** track.","The Uffington Horse is also surrounded by Bronze Age burial mounds. It is not far from the Bronze Age cemetery of Lambourn Seven Barrows, which consists of more than 30 well-preserved burial mounds. The carving has been placed in such a way as to make it extremely difficult to see from close quarters, and like","many geoglyphs is best appreciated from the air. Nevertheless, there are certain areas of the Vale of the White Horse, the valley containing and named after the enigmatic creature, from which an adequate impression may be gained. Indeed on a clear day the carving can be seen from up to 30 km away.","The earliest evidence of a horse at Uffington is from the 1070s CE when ‘White Horse Hill’ is mentioned in documents from the nearby Abbey of Abingdon, and the first reference to the horse itself is soon after, in 1190 CE. However, the carving is believed to date back much further than that. Due to the similarity of the Uffington White Horse to the stylised depictions of horses on 1st century BCE coins, it had been thought that the creature must also date to that period. However, in 1995 Optically Stimulated Luminescence (OSL) testing was carried out by the Oxford Archaeological Unit on soil from two of the lower layers of the horse’s body, and from another cut near the base.","The result was a date for the horse’s construction somewhere between 1400 and 600 BCE – in other words, it had a Late Bronze Age or Early Iron Age origin. The latter end of this date range would tie the carving of the horse in with occupation of the nearby Uffington hillfort, indicating that it may represent a tribal emblem marking the land of the inhabitants of the hillfort.","Alternatively, the carving may have been carried out during a Bronze or Iron Age ritual. Some researchers see the horse as representing the Celtic*** horse goddess Epona, who was worshipped as a protector of horses, and for her associations with fertility. However, the cult of Epona was not imported from Gaul (France) until around the first century CE. This date is at least six centuries after the Uffington Horse was probably carved. Nevertheless, the horse had great ritual and economic significance during the Bronze and Iron Ages, as attested by its depictions on jewellery and other metal objects.","It is possible that the carving represents a goddess in native mythology, such as Rhiannon, described in later Welsh mythology as a beautiful woman dressed in gold and riding a white horse.The fact that geoglyphs can disappear easily, along with their associated rituals and meaning, indicates that they were never intended to be anything more than temporary gestures. But this does not lessen their importance. These giant carvings are a fascinating glimpse into the minds of their creators and how they viewed the landscape in which they lived."],"questions":[{"n":1,"text":"Most geoglyphs in England are located in a particular area of the country.","answer":"TRUE","source":"Đoạn 1 (PDF trang 50)","evidence":"There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties. The figures include giants, horses, crosses and regimental badges. Although the majority of these geoglyphs date within the last 300 years or so, there are one or two that are much older.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Most geoglyphs in England are located in a particular area of the country.”\n- Passage: “There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"There are more geoglyphs in the shape of a horse than any other creature.","answer":"NOT GIVEN","source":"Đoạn 6 (PDF trang 52)","evidence":"The carving has been placed in such a way as to make it extremely difficult to see from close quarters, and like many geoglyphs is best appreciated from the air. Nevertheless, there are certain areas of the Vale of the White Horse, the valley containing and named after the enigmatic creature, from which an adequate impression may be gained.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The carving has been placed in such a way as to make it extremely difficult to see from close quarters, and like many geoglyphs is best appreciated from the air.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “more geoglyphs in the shape of a horse than any other creature” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “There are more geoglyphs in the shape of a horse than any other creature.”\n- Passage: “The carving has been placed in such a way as to make it extremely difficult to see from close quarters, and like many geoglyphs is best appreciated from the air.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":3,"text":"A recent dating of the Uffington White Horse indicates that people were mistaken about its age.","answer":"TRUE","source":"Đoạn 2 (PDF trang 50)","evidence":"…The White Horse has recently been re-dated and shown to be even older than its previously assigned ancient pre-Roman Iron Age date. More controversial is the date of the enigmatic Long Man of Wilmington in Sussex.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…The White Horse has recently been re-dated and shown to be even older than its previously assigned ancient pre-Roman Iron Age date.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “A recent dating of the Uffington White Horse indicates that people were mistaken about its age.”\n- Passage: “…The White Horse has recently been re-dated and shown to be even older than its previously assigned ancient pre-Roman Iron Age date.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":4,"text":"Historians have come to an agreement about the origins of the Long Man of Wilmington.","answer":"FALSE","source":"Đoạn 2 (PDF trang 50)","evidence":"More controversial is the date of the enigmatic Long Man of Wilmington in Sussex.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “More controversial is the date of the enigmatic Long Man of Wilmington in Sussex.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Historians have come to an agreement about the origins of the Long Man of Wilmington.”\n- Passage: “More controversial is the date of the enigmatic Long Man of Wilmington in Sussex.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":5,"text":"Geoglyphs were created by people placing white chalk on the hillside.","answer":"FALSE","source":"Đoạn 3 (PDF trang 51)","evidence":"…remove the overlying grass to reveal the gleaming white chalk below. However, the grass would soon grow over the geoglyph again unless it was regularly cleaned or scoured by a fairly large team of people.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…remove the overlying grass to reveal the gleaming white chalk below.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Geoglyphs were created by people placing white chalk on the hillside.”\n- Passage: “…remove the overlying grass to reveal the gleaming white chalk below.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":6,"text":"Many geoglyphs in England are no longer visible.","answer":"TRUE","source":"Đoạn 1 (PDF trang 50)","evidence":"There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties. The figures include giants, horses, crosses and regimental badges. Although the majority of these geoglyphs date within the last 300 years or so, there are one or two that are much older.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Many geoglyphs in England are no longer visible.”\n- Passage: “There are 56 hill figures scattered around England, with the vast majority on the chalk downlands of the country’s southern counties.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":7,"text":"The shape of some geoglyphs has been altered over time.","answer":"TRUE","source":"Đoạn 3 (PDF trang 51)","evidence":"Furthermore, over hundreds of years the outlines would sometimes change due to people not always cutting in exactly the same place, thus creating a different shape to the original geoglyph.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Furthermore, over hundreds of years the outlines would sometimes change due to people not always cutting in exactly the same place, thus creating a different shape to the original geoglyph.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The shape of some geoglyphs has been altered over time.”\n- Passage: “Furthermore, over hundreds of years the outlines would sometimes change due to people not always cutting in exactly the same place, thus creating a different shape to the original geoglyph.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":8,"text":"The fame of the Uffington White Horse is due to its size.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 50)","evidence":"The most famous of these figures is perhaps also the most mysterious – the Uffington White Horse in Oxfordshire.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The most famous of these figures is perhaps also the most mysterious – the Uffington White Horse in Oxfordshire.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “due to its size” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The fame of the Uffington White Horse is due to its size.”\n- Passage: “The most famous of these figures is perhaps also the most mysterious – the Uffington White Horse in Oxfordshire.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":11,"title":"How to Make Wise Decisions","passage":["How to Make Wise Decisions Across cultures, wisdom has been considered one of the most revered human qualities. Although the truly wise may seem few and far between, empirical research examining wisdom suggests that it isn’t an exceptional trait possessed by a small handful of bearded philosophers after all – in fact, the latest studies suggest that most of us have the ability to make wise decisions, given the right context.","‘It appears that experiential, situational, and cultural factors are even more powerful in shaping wisdom than previously imagined,’ says Associate Professor Igor Grossmann of the University of Waterloo in Ontario, Canada. ‘Recent empirical findings from cognitive, developmental, social, and personality psychology cumulatively suggest that people’s ability to reason wisely varies dramatically across experiential and situational contexts. Understanding the role of such contextual factors offers unique insights into understanding wisdom in daily life, as well as how it can be enhanced and taught.","’It seems that it’s not so much that some people simply possess wisdom and others lack it, but that our ability to reason wisely depends on a variety of external factors. ‘It is impossible to characterise thought processes attributed to wisdom without considering the role of contextual factors,’ explains Grossmann. ‘In other words, wisdom is not solely an “inner quality” but rather unfolds as a function of situations people happen to be in. Some situations are more likely to promote wisdom than others.’","Coming up with a definition of wisdom is challenging, but Grossmann and his colleagues have identified four key characteristics as part of a framework of wise reasoning. One is intellectual humility or recognition of the limits of our own knowledge, and another is appreciation of perspectives wider than the issue at hand. Sensitivity to the possibility of change in social relations is also key, along with compromise or integration of different attitudes and beliefs.","Grossmann and his colleagues have also found that one of the most reliable ways to support wisdom in our own day-to-day decisions is to look at scenarios from a third-party perspective, as though giving advice to a friend. Research suggests that when adopting a first-person viewpoint we focus on ‘the focal features of the environment’ and when we adopt a third-person, ‘observer’ viewpoint we reason more broadly and focus more on interpersonal and moral ideals such as justice and impartiality.","Looking at problems from this more expansive viewpoint appears to foster cognitive processes related to wise decisions. What are we to do, then, when confronted with situations like a disagreement with a spouse or negotiating a contract at work, that require us to take a personal stake? Grossmann argues that even when we aren’t able to change the situation, we can still evaluate these experiences from different perspectives. For example, in one experiment that took place during the peak of a recent economic recession, graduating college seniors were asked to reflect on their job prospects.","The students were instructed to imagine their career either ‘as if you were a distant observer’ or ‘before your own eyes as if you were right there’. Participants in the group assigned to the ‘distant observer’ role displayed more wisdom-related reasoning (intellectual humility and recognition of change) than did participants in the control group. In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective. Participants then discussed the incident with their partner for minutes, after which they wrote down their thoughts about it. Couples in the ‘other’s eyes’ condition were significantly more likely to rely on wise reasoning – recognizing others’ perspectives and searching for a compromise – compared to the couples in the egocentric condition. ‘Ego-decentering promotes greater focus on others and enables a bigger picture, conceptual view of the experience, affording recognition of intellectual humility and change,’ says Grossmann. We might associate wisdom with intelligence or particular personality traits, but research shows only a small positive relationship between wise thinking and crystallized intelligence and the personality traits of openness and agreeableness. ‘It is remarkable how much people can vary in their wisdom from one situation to the next, and how much stronger such contextual effects are for understanding the relationship between wise judgement and its social and affective outcomes as compared to the generalized “traits”,’ Grossmann explains. ‘That is, knowing how wisely a person behaves in a given situation is more informative for understanding their emotions or likelihood to forgive [or] retaliate as compared to knowing whether the person may be wise “in general”.’"],"questions":[{"n":36,"text":"Students participating in the job prospects experiment could choose one of two perspectives to take.","answer":"FALSE","source":"Đoạn 2 (PDF trang 55)","evidence":"…most of us have the ability to make wise decisions, given the right context. ‘It appears that experiential, situational, and cultural factors are even more powerful in shaping wisdom than previously imagined,’ says Associate Professor Igor Grossmann of the University of Waterloo in Ontario, Canada.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…most of us have the ability to make wise decisions, given the right context.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Students participating in the job prospects experiment could choose one of two perspectives to take.”\n- Passage: “…most of us have the ability to make wise decisions, given the right context.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":37,"text":"Participants in the couples experiment were aware that they were taking part in a study about wise reasoning.","answer":"NOT GIVEN","source":"Đoạn 7 (PDF trang 57)","evidence":"In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective. Participants then discussed the incident with their partner for 10 minutes, after which they wrote down their thoughts about it. Couples in the ‘other’s eyes’ condition were significantly more likely to rely on wise reasoning – recognizing others’ perspectives and searching for a compromise – compared to the couples in the egocentric condition.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “taking part in a study about wise reasoning” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Participants in the couples experiment were aware that they were taking part in a study about wise reasoning.”\n- Passage: “In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":38,"text":"In the couples experiments, the length of the couples’ relationships had an impact on the results.","answer":"NOT GIVEN","source":"Đoạn 7 (PDF trang 57)","evidence":"In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective. Participants then discussed the incident with their partner for 10 minutes, after which they wrote down their thoughts about it. Couples in the ‘other’s eyes’ condition were significantly more likely to rely on wise reasoning – recognizing others’ perspectives and searching for a compromise – compared to the couples in the egocentric condition.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “couples’ relationships had an impact on the results” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “In the couples experiments, the length of the couples’ relationships had an impact on the results.”\n- Passage: “In another study, couples in long-term romantic relationships were instructed to visualize an unresolved relationship conflict either through the eyes of an outsider or from their own perspective.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":39,"text":"In both experiments, the participants who looked at the situation from a more detached viewpoint tended to make wiser decisions.","answer":"TRUE","source":"Đoạn 6 (PDF trang 57)","evidence":"Looking at problems from this more expansive viewpoint appears to foster cognitive processes related to wise decisions.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Looking at problems from this more expansive viewpoint appears to foster cognitive processes related to wise decisions.”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In both experiments, the participants who looked at the situation from a more detached viewpoint tended to make wiser decisions.”\n- Passage: “Looking at problems from this more expansive viewpoint appears to foster cognitive processes related to wise decisions.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":40,"text":"Grossmann believes that a person’s wisdom is determined by their intelligence to only a very limited extent.","answer":"TRUE","source":"Đoạn 10 (PDF trang 58)","evidence":"We might associate wisdom with intelligence or particular personality traits, but research shows only a small positive relationship between wise thinking and crystallized intelligence and the personality traits of openness and agreeableness. ‘It is remarkable how much people can vary in their wisdom from one situation to the next, and how much stronger such contextual effects are for understanding the relationship between wise judgement and its social and affective outcomes as compared to the generalized “traits”,’ Grossmann explains.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “We might associate wisdom with intelligence or particular personality traits, but research shows only a small positive relationship between wise thinking and crystallized intelligence and the personality traits of openness and agreeablen…”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Grossmann believes that a person’s wisdom is determined by their intelligence to only a very limited extent.”\n- Passage: “We might associate wisdom with intelligence or particular personality traits, but research shows only a small positive relationship between wise thinking and crystallized intelligence and the personality traits of openness and agreeablen…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":12,"title":"Roman Shipbuilding and Navigation","passage":["Roman Shipbuilding and Navigation Shipbuilding today is based on science and ships are built using computers and sophisticated tools. Shipbuilding in ancient Rome, however, was more of an art relying on estimation, inherited techniques and personal experience. The Romans were not traditionally sailors but mostly land- based people, who learned to build ships from the people that they conquered, namely the Greeks and the Egyptians.","There are a few surviving written documents that give descriptions and representations of ancient Roman ships, including the sails and rigging. Excavated vessels also provide some clues about ancient shipbuilding techniques. Studies of these have taught us that ancient Roman shipbuilders built the outer hull first, then proceeded with the frame and the rest of the ship. Planks used to build the outer hull were initially sewn together. Starting from the 6th century BCE, they were fixed using a method called mortise and tenon, whereby one plank locked into another without the need for stitching. Then in the first centuries of the current era, Mediterranean shipbuilders shifted to","another shipbuilding method, still in use today, which consisted of building the frame first and then proceeding with the hull and the other components of the ship. This method was more systematic and dramatically shortened ship construction times. The ancient Romans built large merchant ships and warships whose size and technology were unequalled until the 16th century CE.","Warships were built to be lightweight and very speedy. They had to be able to sail near the coast, which is why they had no ballast or excess load and were built with a long, narrow hull. They did not sink when damaged and often would lie crippled on the sea’s surface following naval battles. They had a bronze battering ram, which was used to pierce the timber hulls or break the oars of enemy vessels. Warships used both wind (sails) and human power (oarsmen) and were therefore very fast. Eventually, Rome’s navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called Mare Nostrum meaning ‘our sea’.","There were many kinds of warships. The ‘trireme’ was the dominant warship from the 7th to 4th century BCE. It had rowers in the top, middle and lower levels, and approximately 50 rowers in each bank. The rowers at the bottom had the most uncomfortable position as they were under the other rowers and were exposed to the water entering through the oar-holes. It is worth noting that contrary to popular perception, rowers were not slaves but mostly Roman","citizens enrolled in the military. The trireme was superseded by larger ships with even more rowers. Merchant ships were built to transport lots of cargo over long distances and at a reasonable cost. They had a wider hull, double planking and a solid interior for added stability. Unlike warships, their V-shaped hull was deep underwater, meaning that they could not sail too close to the coast. They usually had two huge side rudders located off the stern and controlled by a small tiller bar connected to a system of cables. They had from one to three masts with large square sails and a small triangular sail at the bow. Just like warships, merchant ships used oarsmen, but coordinating the hundreds of rowers in both types of ship was not an easy task. In order to assist them, music would be played on an instrument, and oars would then keep time with this. The cargo on merchant ships included raw materials (e.g. iron bars, copper, marble and granite), and agricultural products (e.g. grain from Egypt’s Nile valley). During the Empire,","Rome was a huge city by ancient standards of about one million inhabitants. Goods from all over the world would come to the city through the port of Pozzuoli situated west of the bay of Naples in Italy and through the gigantic port of Ostia situated at the mouth of the Tiber River. Large merchant ships would approach the destination port and, just like today, be intercepted by a number of towboats that would drag them to the quay. The time of travel along the many sailing routes could vary widely. Navigation in ancient Rome did not rely on sophisticated instruments such as compasses but on experience, local knowledge and observation of natural phenomena. In conditions of good visibility, seamen in the Mediterranean often had the mainland or islands in sight, which greatly facilitated navigation. They sailed by noting their position relative to a succession of recognisable landmarks. When weather conditions were not good or where land was no longer visible, Roman mariners estimated directions from the pole star or, with less accuracy, fro
