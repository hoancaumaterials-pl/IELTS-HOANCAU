<style id="ielts-dual-pane-layout-patch">
/* =========================================================
   IELTS READING – DUAL PANE / INDEPENDENT SCROLL PATCH
   Desktop: 60/40
   Mobile portrait (<768px): top/bottom, BOTH visible
   Mobile landscape + tablet: 60/40
   Body locked only while an exam/practice screen is active
   ========================================================= */

html.ielts-exam-active,
body.ielts-exam-active{
  height:100% !important;
  max-height:100% !important;
  overflow:hidden !important;
  overscroll-behavior:none !important;
}

body.ielts-exam-active{
  position:relative !important;
}

/* Prevent the exam/practice shell itself from becoming the scrolling surface. */
body.ielts-exam-active .exam,
body.ielts-exam-active .practice,
body.ielts-exam-active #exam-screen{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Common split containers */
body.ielts-exam-active .workspace,
body.ielts-exam-active .work{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Every reading/question pane scrolls on its own. */
body.ielts-exam-active .workspace > .pane,
body.ielts-exam-active .workspace > .reading-pane,
body.ielts-exam-active .workspace > .question-pane,
body.ielts-exam-active .workspace > .passage-pane,
body.ielts-exam-active .workspace > .passage,
body.ielts-exam-active .workspace > .questions,
body.ielts-exam-active .work > .pane,
body.ielts-exam-active .work > .reading-pane,
body.ielts-exam-active .work > .question-pane,
body.ielts-exam-active .work > .passage-pane,
body.ielts-exam-active .work > .passage,
body.ielts-exam-active .work > .questions,
body.ielts-exam-active #passage-pane,
body.ielts-exam-active #question-pane{
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain !important;
  -webkit-overflow-scrolling:touch !important;
}

/* The old "show only one pane" mobile controls are no longer needed. */
body.ielts-exam-active .mobile-switch,
body.ielts-exam-active .mobile-toggle,
body.ielts-exam-active #show-reading,
body.ielts-exam-active #show-questions{
  display:none !important;
}

/* Never allow old mobile-state classes to hide one side. */
body.ielts-exam-active .workspace.show-questions > .reading-pane,
body.ielts-exam-active .workspace.show-questions > .passage-pane,
body.ielts-exam-active .workspace.show-questions > .passage,
body.ielts-exam-active .workspace:not(.show-questions) > .question-pane,
body.ielts-exam-active .practice.show-passage .question-pane,
body.ielts-exam-active .practice:not(.show-passage) .passage-pane,
body.ielts-exam-active #passage-pane.mobile-hidden,
body.ielts-exam-active #question-pane.mobile-hidden{
  display:block !important;
}

/* Keep fixed-height practice shells inside the viewport. */
body.ielts-exam-active .practice{
  height:100vh !important;
  height:100dvh !important;
  max-height:100vh !important;
  max-height:100dvh !important;
}

/* Matching Information-style shell: 44px global brand + exam below it. */
body.ielts-exam-active .top-brand + .exam,
body.ielts-exam-active .top-brand ~ .exam{
  height:calc(100vh - 44px) !important;
  height:calc(100dvh - 44px) !important;
  min-height:0 !important;
}

/* ---------- DESKTOP + TABLET + MOBILE LANDSCAPE ---------- */
@media (min-width:768px), (orientation:landscape){
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,3fr) minmax(0,2fr) !important; /* 60 / 40 */
    grid-template-rows:minmax(0,1fr) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based exam templates */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* YES/NO/NOT GIVEN-style fixed header = 46 + 42 = 88px */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
  }

  /* Restore divider between 60% passage and 40% questions */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:1px solid var(--line, #d7dde4) !important;
    border-bottom:0 !important;
  }
}

/* ---------- MOBILE PORTRAIT ONLY ---------- */
@media (max-width:767px) and (orientation:portrait){
  /* Matching Information had height:auto + sticky header on mobile:
     force the shell back into the viewport. */
  body.ielts-exam-active .exam{
    min-height:0 !important;
    overflow:hidden !important;
  }

  body.ielts-exam-active .exam-head{
    position:relative !important;
    top:auto !important;
    flex:0 0 auto !important;
  }

  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    grid-template-rows:minmax(0,48%) minmax(0,52%) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based templates: workspace occupies exactly the remaining height. */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* Fixed 88px header templates */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }

  /* Clear old "one pane at a time" rules with high specificity. */
  body.ielts-exam-active .workspace.show-questions .reading-pane,
  body.ielts-exam-active .workspace.show-questions .passage-pane,
  body.ielts-exam-active .workspace.show-questions .passage,
  body.ielts-exam-active .workspace.show-questions .question-pane,
  body.ielts-exam-active .practice.show-passage .passage-pane,
  body.ielts-exam-active .practice.show-passage .question-pane,
  body.ielts-exam-active .practice .passage-pane,
  body.ielts-exam-active .practice .question-pane{
    display:block !important;
  }

  /* Horizontal divider between Passage (top) and Questions (bottom). */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:0 !important;
    border-bottom:2px solid var(--line, #d7dde4) !important;
  }

  /* Compact padding so both regions remain practical on small screens. */
  body.ielts-exam-active .reading-pane,
  body.ielts-exam-active .passage-pane,
  body.ielts-exam-active .work > .passage{
    padding-top:10px !important;
    padding-bottom:18px !important;
  }

  body.ielts-exam-active .question-pane,
  body.ielts-exam-active .work > .questions{
    padding-top:9px !important;
    padding-bottom:24px !important;
  }
}

/* Print should remain normal and fully expandable. */
@media print{
  html.ielts-exam-active,
  body.ielts-exam-active{
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
  }
}
</style>

const BANK=[{"id":1,"title":"Mrs. Carlill and the Carbolic Smoke Ball","passage":["Mrs. Carlill and the Carbolic Smoke Ball On 14 January 1892, Queen Victoria’s grandson Prince Albert Victor, second in line to the British throne, died from flu. He had succumbed to the third and most lethal wave of the Russian flu pandemic sweeping the world. The nation was shocked. The people mourned. Albert was relegated to a footnote in history. Three days later, London housewife Louisa Carlill went down with flu. She was shocked. For two months, she had inhaled thrice daily from a carbolic smoke ball, a preventive measure guaranteed to fend off flu – if you believed the advert. Which she did.","And why shouldn’t she when the Carbolic Smoke Ball Company had promised to cough up £100 for any customer who fell ill? Unlike Albert, Louisa recovered, claimed her £100 and set in train events that would win her lasting fame. It started in the spring of 1889. The first reports of a flu epidemic came from Russia. By the end of the year, the world was in the grip of the first truly global flu pandemic. The disease came in waves, once a year for the next four years, and each worse than the last. Whole cities came to a standstill.","London was especially hard-hit. As the flu reached each annual peak, normal life stopped. The postal service ground to a halt, trains stopped running, banks closed. Even courts stopped sitting for lack of judges. At the height of the third wave in 1892, 200 people were buried every day at just one London cemetery. This flu was far more lethal than previous epidemics, and those who recovered were left weak, depressed, and often unfit for work. It was a picture repeated across the continent.","Accurate figures for the number of the sick and dead were few and far between but Paris, Berlin and Vienna all reported a huge upsurge in deaths. The newspapers took an intense interest in the disease, not just because of the scale of it but because of who it attacked. Most epidemics carried off the poor and weak, the old and frail. This flu was cutting as great a swathe through the upper classes, dealing death to the rich and famous, and the young and fit. The newspaper-reading public was fed a daily diet of celebrity victims. The flu had worked its way through the Russian imperial family and invaded the royal palaces of Europe. It carried off the Dowager Empress of Germany and the second son of the king of Italy, as well as England’s future king. Aristocrats and politicians, poets and opera singers, bishops and cardinals – none escaped the attentions of the Russian flu. The public grew increasingly fearful. The press might have been overdoing the doom and gloom, but their hysterical coverage had exposed one terrible fact.","The medical profession had no answer to the disease. This flu, which might ft not even have begun in Russia, was a mystery. What caused it and how did it spread? No one could agree on anything. By now, the theory that micro-organisms caused disease was gaining ground, g but no one had identified an organism responsible for flu (and wouldn’t until 1933).","In the absence of a germ, many clung to the old idea of bad airs, or miasmas, possibly stirred by some great physical force – earthquakes, perhaps, or electrical phenomena in the upper atmosphere, even a passing comet. Doctors advised people to eat well avoiding “unnecessary assemblies”, and if they were really worried, to stuff cotton wool up their nostrils. If they fell ill, they should rest, keep warm and eat a nourishing diet of “milk, eggs and farinaceous puddings”.","Alcohol figured prominently among the prescriptions: one eminent English doctor suggested champagne, although he conceded “brandy M in considerable quantities has sometimes been given with manifest advantages”. French doctors prescribed warm alcoholic drinks, arguing that they never saw an alcoholic with flu. Their prescription had immediate results: over a three-day period, 1,200 of the 1,500 drunks picked up on the streets of Paris claimed they were following doctor’s orders.","Some doctors gave drugs to ease symptoms – quinine for fever, salicin for headache, heroin for an “incessant cough”. But nothing in the pharmacy remotely resembled a cure. Not surprisingly, people looked elsewhere for help. Hoping to cash in while the pandemic lasted, purveyors of patent medicines competed for the public’s custom with ever more outrageous advertisements. One of the most successful was the Carbolic Smoke Ball Company. The carbolic smoke ball was a hollow rubber ball, 5 centimetres across, with a nozzle covered by gauze. Inside was a powder treated with carbolic acid, or phenol.","The idea was to clutch it close to the nose and squeeze gently, inhaling deeply from the emerging cloud of pungent powder. This, the company claimed, would disinfect the mucous membranes, curing any condition related to “taking cold”. In the summer of 1890, sales were steady at 300 smoke balls a month. In January 1891, the figure skyrocketed to 1,500. Eager to exploit the public’s mounting panic, the Carbolic Smoke Ball Company made increasingly extravagant claims. Oh 13 November 1892, its latest advert in the Pall Mall Gazette caught the eye of south London housewife Louisa Carlill. “Carbolic Smoke Ball,” it declared, “will positively cure colds, coughs, asthma, bronchitis, hoarseness, influenza, croup, whooping cough …”. And the list went on. But it was the next part Mrs. Carlill found compelling.","“A £100 reward will be paid by the Carbolic Smoke Ball Company to any person who contracts the increasing epidemic influenza, colds or any disease caused by taking cold, after having used the carbolic smoke ball according to the printed directions supplied with each ball. £1,000 is deposited with the Alliance bank, Regent Street, showing our sincerity in the matter.” Mrs. Carlill hurried off to buy a smoke ball, price 10 shillings. After carefully reading the instructions, she diligently dosed herself thrice daily until 17 January – when she fell ill.","On 20 January, Louisa’s husband wrote to the Carbolic Smoke Ball Company. Unfortunately for them, Mr. Carlill happened to be a solicitor. His wife, he wrote, had seen their advert and bought a smoke ball on the strength of it. She had followed the instructions to the letter, and yet now – as their doctor could confirm – she had flu. There was no reply. But £100 was not a sum to be sneezed at. Mr. Carlill persisted. The company resisted. Louisa recovered and sued. In June, Mr. Justice Hawkins found in Mrs. Carlill’s favour. The company’s main defence was that adverts were mere “puffery” and only an idiot would believe such extravagant claims.","Judge Hawkins pointed out that adverts were not aimed at the wise and thoughtful, but at the credulous and weak. A vendor who made a promise “must not be surprised if occasionally he is held to his promise”. Carbolic appealed. In December, three lord justices considered the case.","Carbolic’s lawyers tried several lines of defence. But in the end, the case came down to a single matter: not whether the remedy was useless, or whether Carbolic had committed fraud, but whether its advert constituted a contract – which the company had broken. A contract required agreement between two parties, argued Carbolic’s lawyers. What agreement had Mrs. Carlill made with them? There were times, the judges decided, when a contract could be one-sided. The advert had made a very specific offer to purchasers: protection from flu or £100. By using the smoke ball as instructed, Mrs. Carlill had accepted that offer. The company might just have wriggled out of it if it hadn’t added the bit about the £1,000 deposit. That, said the judges, gave buyers reason to believe Carbolic meant what it said.","“It seems to me that if a person chooses to make extravagant promises of this kind, he probably does so because it pays him to make them, and, if he has made them, the extravagance of the promises is no reason in law why he should not be bound by them,” pronounced Lord Justice Bowen. Louisa got her £100. The case established the principle of the unilateral contract and is frequently cited today."],"questions":[{"n":14,"text":"Cities rather than rural areas were badly affected by the pandemic flu.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 1)","evidence":"By the end of the year, the world was in the grip of the first truly global flu pandemic. The disease came in waves, once a year for the next four years, and each worse than the last. Whole cities came to a standstill.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “By the end of the year, the world was in the grip of the first truly global flu pandemic.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “areas were badly affected by the pandemic flu” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Cities rather than rural areas were badly affected by the pandemic flu.”\n- Passage: “By the end of the year, the world was in the grip of the first truly global flu pandemic.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":15,"text":"At the time of the flu pandemic, people didn’t know the link between micro-organisms and illnesses.","answer":"FALSE","source":"Đoạn 6 (PDF trang 3)","evidence":"…the theory that micro-organisms caused disease was gaining ground, g but no one had identified an organism responsible for flu (and wouldn’t until 1933). In the absence of a germ, many clung to the old idea of bad airs, or miasmas, possibly stirred by some great physical force – earthquakes, perhaps, or electrical phenomena in the upper atmosphere, even a passing comet.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…the theory that micro-organisms caused disease was gaining ground, g but no one had identified an organism responsible for flu (and wouldn’t until 1933).”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “At the time of the flu pandemic, people didn’t know the link between micro-organisms and illnesses.”\n- Passage: “…the theory that micro-organisms caused disease was gaining ground, g but no one had identified an organism responsible for flu (and wouldn’t until 1933).”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":16,"text":"People used to believe flu was caused by miasmas.","answer":"TRUE","source":"Đoạn 6 (PDF trang 3)","evidence":"…many clung to the old idea of bad airs, or miasmas, possibly stirred by some great physical force – earthquakes, perhaps, or electrical phenomena in the upper atmosphere, even a passing comet.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…many clung to the old idea of bad airs, or miasmas, possibly stirred by some great physical force – earthquakes, perhaps, or electrical phenomena in the upper atmosphere, even a passing comet.”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “People used to believe flu was caused by miasmas.”\n- Passage: “…many clung to the old idea of bad airs, or miasmas, possibly stirred by some great physical force – earthquakes, perhaps, or electrical phenomena in the upper atmosphere, even a passing comet.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":17,"text":"Flu prescriptions often contained harmful ingredients.","answer":"NOT GIVEN","source":"Đoạn 7 (PDF trang 3)","evidence":"Alcohol figured prominently among the prescriptions: one eminent English doctor suggested champagne, although he conceded “brandy M in considerable quantities has sometimes been given with manifest advantages”. French doctors prescribed warm alcoholic drinks, arguing that they never saw an alcoholic with flu. Their prescription had immediate results: over a three-day period, 1,200 of the 1,500 drunks picked up on the streets of Paris claimed they were following doctor’s orders.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Alcohol figured prominently among the prescriptions: one eminent English doctor suggested champagne, although he conceded “brandy M in considerable quantities has sometimes been given with manifest advantages”.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Flu prescriptions often contained harmful ingredients” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Flu prescriptions often contained harmful ingredients.”\n- Passage: “Alcohol figured prominently among the prescriptions: one eminent English doctor suggested champagne, although he conceded “brandy M in considerable quantities has sometimes been given with manifest advantages”.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":2,"title":"The Dover Bronze-Age Boat","passage":["The Dover Bronze-Age Boat A beautifully preserved boat, made around 3,000 years ago and discovered by chance in a muddy hole, has had a profound impact on archaeological research. It was 1992. In England, workmen were building a new road through the heart of Dover, to connect the ancient port and the Channel Tunnel, which, when it opened just two years later, was to be the first land link between Britain and Europe for over 10,000 years. A small team from the Canterbury Archaeological Trust (CAT) worked alongside the workmen, recording new discoveries bought to light by the machines.","At the base of the deep shaft six meters below the modern streets, a wooden structure was revealed. Cleaning away the waterlogged site overlying the timbers, archaeologists realized its true nature. They had found a prehistoric boat, preserved by the type of sediment in which it was buried. It was then named by Dover Bronze- Age Boat. About nine meters of the boat’s length was recovered; one end lay beyond the excavation and had to be left.","What survived consisted essentially of four intricately carved oak planks: two on the bottom, joined along a central seam by a complicated system of wedges and stitched to the others. The seams had been made watertight by pads of moss, fixed by wedges and yew stitches. The timbers that closed the recovered end of the boat had been removed in antiquity when it was abandoned, but much about its original shape could be deduced.","There was also evidence for missing upper side planks. The boat was not a wreck, but had been deliberately discarded, dismantled and broken. Perhaps it had been “ritually killed” at the end of its life, like other Bronze-Age objects. With hindsight, it was significant that the boat was found and studied by mainstream archaeologists who naturally focused on its cultural context. At the time, ancient boats were often considered only from a narrower technological perspective, but news about the Dover boat reached a broad audience. In 2002, on the tenth anniversary of the discovery, the Dover Bronze-Age Boat Trust hosted a conference, where this meeting of different traditions became apparent. Alongside technical papers about the boat, other speakers explored its social and economic contexts, and the religious perceptions of boats in Bronze- Age societies. Many speakers came from overseas, and debate about cultural connections was renewed.","Within seven years of excavation, the Dover boat had been conserved and displayed, but it was apparent that there were issues that could not be resolved simply by studying the old wood. Experimental archaeology seemed to be the solution: a boat reconstruction, half-scale or full-sized, would permit assessment of the different hypotheses regarding its build and the missing end. The possibility of returning to Dover to search for a boat’s unexcavated northern end was explored, but practical and financial difficulties were insurmountable- and there was no guarantee that the timbers had survived the previous decade in the changed environment.","Detailed proposals to reconstruct the boat were drawn up in 2004. Archaeological evidence was beginning to suggest a Bronze- Age community straddling the Channel, brought together by the sea, rather than separated by it. In a region today divided by languages and borders, archaeologists had a duty to inform the general public about their common cultural heritage.","The boat project began in England but it was conceived from the start as a European collaboration. Reconstruction was only part of a scheme that would include a major exhibition and an extensive educational and outreach programme. Discussions began early in 2005 with archaeological bodies, universities and heritage organizations on either side of the Channel.","There was much enthusiasm and support, and an official launch of the project was held at an international seminar in France in 2007. Financial support was confirmed in 2008 and the project then named BOAT 1550BC got under way in June 2011. A small team began to make the boat at the start of 2012 on the Roman Lawn outside Dover museum.","A full- scale reconstruction of a mid-section had been made in 1996, primarily to see how Bronze- Age replica tools performed. In 2012, however, the hull shape was at the center of the work, so modern power tools were used to carve the oak planks, before turning to prehistoric tools for finishing. It was decided to make the replica half-scale for reasons of cost and time; any synthetic materials were used for the stitching, owing to doubts about the scaling and tight timetable.","Meanwhile, the exhibition was being prepared ready for opening in July 2012 at the Castle Museum in Boulogne-sur-Mer. Entitled ‘Beyond the Horizon: Societies of the Channel & North Sea 3,500 years ago’ it brought together for the first time a remarkable collection of Bronze- Age objects, including many new discoveries for commercial archaeology and some of the great treasures of the past. The reconstructed boat, as a symbol of the maritime connections that bound together the communities either side of the Channel, was the centrepiece."],"questions":[{"n":6,"text":"Archaeologists realized that the boat had been damaged on purpose.","answer":"TRUE","source":"Đoạn 4 (PDF trang 9)","evidence":"…The boat was not a wreck, but had been deliberately discarded, dismantled and broken. Perhaps it had been “ritually killed” at the end of its life, like other Bronze-Age objects. With hindsight, it was significant that the boat was found and studied by mainstream archaeologists who naturally focused on its cultural context.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…The boat was not a wreck, but had been deliberately discarded, dismantled and broken.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Archaeologists realized that the boat had been damaged on purpose.”\n- Passage: “…The boat was not a wreck, but had been deliberately discarded, dismantled and broken.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":7,"text":"Initially, only the technological aspects of the boat were examined.","answer":"FALSE","source":"Đoạn 4 (PDF trang 9)","evidence":"…With hindsight, it was significant that the boat was found and studied by mainstream archaeologists who naturally focused on its cultural context. At the time, ancient boats were often considered only from a narrower technological perspective, but news about the Dover boat reached a broad audience.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…With hindsight, it was significant that the boat was found and studied by mainstream archaeologists who naturally focused on its cultural context.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Initially, only the technological aspects of the boat were examined.”\n- Passage: “…With hindsight, it was significant that the boat was found and studied by mainstream archaeologists who naturally focused on its cultural context.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":8,"text":"Archaeologists went back to the site to try and find the missing northern.","answer":"FALSE","source":"Đoạn 5 (PDF trang 10)","evidence":"…The possibility of returning to Dover to search for a boat’s unexcavated northern end was explored, but practical and financial difficulties were insurmountable- and there was no guarantee that the timbers had survived the previous decade in the changed environment.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…The possibility of returning to Dover to search for a boat’s unexcavated northern end was explored, but practical and financial difficulties were insurmountable- and there was no guarantee that the timbers had survived the previous deca…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Archaeologists went back to the site to try and find the missing northern.”\n- Passage: “…The possibility of returning to Dover to search for a boat’s unexcavated northern end was explored, but practical and financial difficulties were insurmountable- and there was no guarantee that the timbers had survived the previous deca…”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":9,"text":"Evidence found in 2004 suggested that the Bronze-Age Boat had been used for trade.","answer":"NOT GIVEN","source":"Đoạn 6 (PDF trang 10)","evidence":"Detailed proposals to reconstruct the boat were drawn up in 2004. Archaeological evidence was beginning to suggest a Bronze- Age community straddling the Channel, brought together by the sea, rather than separated by it.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Detailed proposals to reconstruct the boat were drawn up in 2004.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “in 2004 suggested that the Bronze-Age Boat had been used for trade” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Evidence found in 2004 suggested that the Bronze-Age Boat had been used for trade.”\n- Passage: “Detailed proposals to reconstruct the boat were drawn up in 2004.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":3,"title":"Walking With the Dinosaurs","passage":["Walking With the Dinosaurs Peter L. Falkingham and his colleagues at Manchester University are developing techniques which look set to revolutionize our understanding of how dinosaurs and other extinct animals behaved. The media image of palaeontologists who study prehistoric life is often of field workers camped in the desert in the hot sun, carefully picking away at the rock surrounding a large dinosaur bone. But Peter Falkingham has done little of that for a while now. Instead, he devotes himself to his computer. Not because he has become inundated with paperwork, but because he is a new kind of palaeontologist: a computational palaeontologist.","What few people may consider is that uncovering a skeleton, or discovering a new species, is where the research begins, not where it ends. What we really want to understand is how the extinct animals and plants behaved in their natural habitats. Drs Bill Sellers and Phil Manning from the University of Manchester use a ‘genetic algorithm’ – a kind of computer code that can change itself and ‘evolve’ – to explore how extinct animals like dinosaurs, and our own early ancestors, walked and stalked.","The fossilized bones of a complete dinosaur skeleton can tell scientists a lot about the animal, but they do not make up the complete picture and the computer can try to fill the gap. The computer model is given a digitized skeleton, and the locations of known muscles. The model then randomly activates the muscles. This, perhaps unsurprisingly, results almost without fail in the animal falling on its face. So the computer alters the activation pattern and tries again … usually to similar effect.","The modeled dinosaurs quickly ‘evolve’. If there is any improvement, the computer discards the old pattern and adopts the new one as the base for alteration. Eventually, the muscle activation pattern evolves a stable way of moving, the best possible solution is reached, and the dinosaur can walk, run, chase or graze. Assuming natural selection evolves the best possible solution too, the modeled animal should be moving in a manner similar to its now-extinct counterpart. And indeed, using the same method for living animals (humans, emu and ostriches) similar top speeds were achieved on the computer as in reality. By comparing their cyberspace results with real measurements of living species, the Manchester team of palaeontologists can be confident in the results computed showing how extinct prehistoric animals such as dinosaurs moved. The Manchester University team have used the computer simulations to produce a model of a giant meat-eating dinosaur.","lt is called an acrocanthosaurus which literally means ‘high spined lizard’ because of the spines which run along its backbone. It is not really known why they are there but scientists have speculated they could have supported a hump that stored fat and water reserves. There are also those who believe that the spines acted as a support for a sail. Of these, one half think it was used as a display and could be flushed with blood and the other half think it was used as a temperature-regulating device. It may have been a mixture of the two. The skull seems out of proportion with its thick, heavy body because it is so narrow and the jaws are delicate and fine. The feet are also worthy of note as they look surprisingly small in contrast to the animal as a whole. It has a deep broad tail and powerful leg muscles to aid locomotion. It walked on its back legs and its front legs were much shorter with powerful claws.","Falkingham himself is investigating fossilized tracks, or footprints, using computer simulations to help analyze how extinct animals moved. Modern-day trackers who study the habitats of wild animals can tell you what animal made a track, whether that animal was walking or running, sometimes even the sex of the animal. But a fossil track poses a more considerable challenge to interpret in the same way.","A crucial consideration is knowing what the environment including the mud, or sediment, upon which the animal walked was like millions of years ago when","the track was made. Experiments can answer these questions but the number of variables is staggering. To physically recreate each scenario with a box of mud is extremely time-consuming and difficult to repeat accurately. This is where computer simulation comes in.","Falkingham uses computational techniques to model a volume of mud and control the moisture content, consistency, and other conditions to simulate the mud of prehistoric times. A footprint is then made in the digital mud by a virtual foot. This footprint can be chopped up and viewed from any angle and stress values can be extracted and calculated from inside it. By running hundreds of these simulations simultaneously on supercomputers, Falkingham can start to understand what types of footprint would be expected if an animal moved in a certain way over a given kind of ground.","Looking at the variation in the virtual tracks, researchers can make sense of fossil tracks with greater confidence. The application of computational techniques in palaeontology is becoming more prevalent every year. As computer power continues to increase, the range of problems that can be tackled and questions that can be answered will only expand."],"questions":[{"n":1,"text":"In his study of prehistoric life, Peter Falkingham rarely spends time on outdoor research.","answer":"TRUE","source":"Đoạn 1 (PDF trang 13)","evidence":"The media image of palaeontologists who study prehistoric life is often of field workers camped in the desert in the hot sun, carefully picking away at the rock surrounding a large dinosaur bone. But Peter Falkingham has done little of that for a while now.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The media image of palaeontologists who study prehistoric life is often of field workers camped in the desert in the hot sun, carefully picking away at the rock surrounding a large dinosaur bone.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In his study of prehistoric life, Peter Falkingham rarely spends time on outdoor research.”\n- Passage: “The media image of palaeontologists who study prehistoric life is often of field workers camped in the desert in the hot sun, carefully picking away at the rock surrounding a large dinosaur bone.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"Several attempts are usually needed before the computer model of a dinosaur used by Sellers and Manning manages to stay upright.","answer":"TRUE","source":"Đoạn 3 (PDF trang 14)","evidence":"…results almost without fail in the animal falling on its face. So the computer alters the activation pattern and tries again … usually to similar effect. The modeled dinosaurs quickly ‘evolve’.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…results almost without fail in the animal falling on its face.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Several attempts are usually needed before the computer model of a dinosaur used by Sellers and Manning manages to stay upright.”\n- Passage: “…results almost without fail in the animal falling on its face.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":3,"text":"When the Sellers and Manning computer model was used for people, it showed them moving faster than they are physically able to.","answer":"FALSE","source":"Đoạn 4 (PDF trang 14)","evidence":"…similar top speeds were achieved on the computer as in reality. By comparing their cyberspace results with real measurements of living species, the Manchester team of palaeontologists can be confident in the results computed showing how extinct prehistoric animals such as dinosaurs moved.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…similar top speeds were achieved on the computer as in reality.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “When the Sellers and Manning computer model was used for people, it showed them moving faster than they are physically able to.”\n- Passage: “…similar top speeds were achieved on the computer as in reality.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":4,"text":"Some palaeontologists have expressed reservations about the conclusions reached by the Manchester team concerning the movement of dinosaurs.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 14)","evidence":"By comparing their cyberspace results with real measurements of living species, the Manchester team of palaeontologists can be confident in the results computed showing how extinct prehistoric animals such as dinosaurs moved.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “By comparing their cyberspace results with real measurements of living species, the Manchester team of palaeontologists can be confident in the results computed showing how extinct prehistoric animals such as dinosaurs moved.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “the Manchester team concerning the movement of dinosaurs” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Some palaeontologists have expressed reservations about the conclusions reached by the Manchester team concerning the movement of dinosaurs.”\n- Passage: “By comparing their cyberspace results with real measurements of living species, the Manchester team of palaeontologists can be confident in the results computed showing how extinct prehistoric animals such as dinosaurs moved.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":5,"text":"An experienced tracker can analyse fossil footprints as easily as those made by live animals.","answer":"FALSE","source":"Đoạn 7 (PDF trang 15)","evidence":"…But a fossil track poses a more considerable challenge to interpret in the same way. A crucial consideration is knowing what the environment including the mud, or sediment, upon which the animal walked was like millions of years ago when the track was made.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…But a fossil track poses a more considerable challenge to interpret in the same way.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “An experienced tracker can analyse fossil footprints as easily as those made by live animals.”\n- Passage: “…But a fossil track poses a more considerable challenge to interpret in the same way.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":6,"text":"Research carried out into the composition of prehistoric mud has been found to be inaccurate.","answer":"NOT GIVEN","source":"Đoạn 9 (PDF trang 16)","evidence":"Falkingham uses computational techniques to model a volume of mud and control the moisture content, consistency, and other conditions to simulate the mud of prehistoric times. A footprint is then made in the digital mud by a virtual foot.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Falkingham uses computational techniques to model a volume of mud and control the moisture content, consistency, and other conditions to simulate the mud of prehistoric times.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “prehistoric mud has been found to be inaccurate” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Research carried out into the composition of prehistoric mud has been found to be inaccurate.”\n- Passage: “Falkingham uses computational techniques to model a volume of mud and control the moisture content, consistency, and other conditions to simulate the mud of prehistoric times.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":4,"title":"Endangered Languages","passage":["Endangered Languages ‘Nevermind whales, save the languages’, says Peter Monaghan, graduate of the Australian National University. Worried about the loss of rain forests and the ozone At linguistics meetings in the US, where the layer? Well, neither of those is doing any worse than endangered-language issue has of late been a large majority of the 6,000 to 7,000 languages that something of a flavour of the month, there is remain in use on Earth.","One half of the survivors will growing evidence that not all approaches to the almost certainly be gone by 2050, while 40% more preservation of languages will be particularly will probably be well on their way out. In their place, helpful. Some linguists are boasting, for example, almost all humans will speak one of a handful of of more and more sophisticated means of capturing mega languages – Mandarin, English, Spanish. Linguists know what causes languages to disappear, but less often remarked is what happens on the way to disappearance: languages’ vocabularies,","grammars and expressive potential all diminish as one language is replaced by another. ‘Say a community goes over from speaking a traditional Aboriginal language to speaking a creole*,’ says Australian Nick Evans, a leading authority on Aboriginal languages, ‘you leave behind a language where there’s very fine vocabulary for the landscape. All that is gone in a creole. You’ve just got a few words like ‘gum tree’ or whatever. As speakers become less able to express the wealth of knowledge that has filled ancestors’ lives with meaning over millennia, it’s no wonder that communities tend to become demoralised.’","If the losses are so huge, why are relatively few linguists combating the situation? Australian linguists, at least, have achieved a great deal in terms of preserving traditional languages. Australian governments began in the 1970s to support an initiative that has resulted in good documentation of most of the 130 remaining Aboriginal languages. In England, another Australian, Peter Austin, has directed one of the world’s most active efforts to limit language loss, at the University of London. Austin heads a programme that has trained many documentary linguists in England as well as in language-loss hotspots such as West Africa and South America. At linguistics meetings in the US, where the endangered-language issue has of late been something of a flavour of the month, there is growing evidence that not all approaches to the preservation of languages will be particularly helpful.","Some linguists are boasting, for example, of more and more sophisticated means of capturing languages: digital recording and storage, and internet and mobile phone technologies. But these are encouraging the ‘quick dash’ style of recording trip: fly in, switch on digital recorder, fly home, download to hard drive, and store gathered material for future research. That’s not quite what some endangered-language specialists have been seeking for more than years. Most loud and untiring has been Michael Krauss, of the University of Alaska. He has often complained that linguists are playing with non-essentials while most of their raw data is disappearing.","Who is to blame? That prominent linguist Noam Chomsky, say Krauss and many others. Or, more precisely, they blame those linguists who have been obsessed with his approaches. Linguists who go out into communities to study, document and describe languages, argue that theoretical linguists, who draw conclusions about how languages work, have had so much influence that linguistics has largely ignored the continuing disappearance of languages. Chomsky, from his post at the Massachusetts Institute of Technology, has been the great man of theoretical linguistics for far longer than he has been known as a political commentator.","His landmark work of 1957 argues that all languages exhibit certain universal grammatical features, encoded in the human mind. American linguists, in particular, have focused largely on theoretical concerns ever since, even while doubts have mounted about Chomsky’s universals. Austin and Co. are in no doubt that because languages are unique, even if they do tend to have common underlying features, creating dictionaries and grammars requires prolonged and dedicated work. This requires that documentary linguists observe not only languages’ structural subtleties, but also related social, historical and political factors. Such work calls for persistent funding of field scientists who may sometimes have to venture into harsh and even hazardous places. Once there, they may face difficulties such as community suspicion.","As Nick Evans says, a community who speak an endangered language may have reasons to doubt or even oppose efforts to preserve it. They may have seen support and funding for such work come and go. They may have given up using the language with their children, believing they will benefit from speaking a more widely understood one. Plenty of students continue to be drawn to the intellectual thrill of linguistics field work. That’s all the more reason to clear away barriers, contend Evans, Austin and others. The highest barrier, they agree, is that the linguistics profession’s emphasis on theory gradually wears down the enthusiasm of linguists who work in communities. Chomsky disagrees. Chomsky has recently begun to speak in support of language preservation. But his linguistic, as opposed to humanitarian, argument is, let’s say, unsentimental: the loss of a language, he states, ‘is much more of a tragedy for linguists whose interests are mostly theoretical, like me, than for linguists who focus on describing specific languages, since it means the permanent loss of the most relevant data for general theoretical work’. At the moment, few institutions award doctorates for such work, and that’s the way it should be, he reasons. In linguistics, as in every other discipline, he believes that good descriptive work requires thorough theoretical understanding and should also contribute to building new theory. But that’s precisely what documentation does, objects Evans. The process of immersion in a language, to extract, analyse and sum it up, deserves a PhD because it is ‘the most demanding intellectual task a linguist can engage in’."],"questions":[{"n":27,"text":"By 2050 only a small number of languages will be flourishing.","answer":"TRUE","source":"Đoạn 2 (PDF trang 18)","evidence":"One half of the survivors will growing evidence that not all approaches to the almost certainly be gone by 2050, while 40% more preservation of languages will be particularly will probably be well on their way out.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “One half of the survivors will growing evidence that not all approaches to the almost certainly be gone by 2050, while 40% more preservation of languages will be particularly will probably be well on their way out.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “By 2050 only a small number of languages will be flourishing.”\n- Passage: “One half of the survivors will growing evidence that not all approaches to the almost certainly be gone by 2050, while 40% more preservation of languages will be particularly will probably be well on their way out.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":28,"text":"Australian academics’ efforts to record existing Aboriginal languages have been too limited.","answer":"FALSE","source":"Đoạn 5 (PDF trang 19)","evidence":"Australian linguists, at least, have achieved a great deal in terms of preserving traditional languages. Australian governments began in the 1970s to support an initiative that has resulted in good documentation of most of the 130 remaining Aboriginal languages. In England, another Australian, Peter Austin, has directed one of the world’s most active efforts to limit language loss, at the University of London.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “Australian linguists, at least, have achieved a great deal in terms of preserving traditional languages.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Australian academics’ efforts to record existing Aboriginal languages have been too limited.”\n- Passage: “Australian linguists, at least, have achieved a great deal in terms of preserving traditional languages.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":29,"text":"The use of technology in language research is proving unsatisfactory in some respects.","answer":"TRUE","source":"Đoạn 7 (PDF trang 20)","evidence":"At linguistics meetings in the US His landmark work of 1957 argues that all languages exhibit certain universal grammatical features, encoded in the human mind. American linguists, in particular, have focused largely on theoretical concerns ever since, even while doubts have mounted about Chomsky’s universals.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “Chomsky, from his post at the Massachusetts Institute of Technology, has been the great man of theoretical linguistics for far longer than he has been known as a political commentator.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Chomsky’s political views have overshadowed his academic work.”\n- Passage: “Chomsky, from his post at the Massachusetts Institute of Technology, has been the great man of theoretical linguistics for far longer than he has been known as a political commentator.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":31,"text":"Documentary linguistics studies require long-term financial support.","answer":"TRUE","source":"Đoạn 9 (PDF trang 21)","evidence":"…Such work calls for persistent funding of field scientists who may sometimes have to venture into harsh and even hazardous places. Once there, they may face difficulties such as community suspicion.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Such work calls for persistent funding of field scientists who may sometimes have to venture into harsh and even hazardous places.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Documentary linguistics studies require long-term financial support.”\n- Passage: “…Such work calls for persistent funding of field scientists who may sometimes have to venture into harsh and even hazardous places.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":32,"text":"Chomsky’s attitude to disappearing languages is too emotional.","answer":"FALSE","source":"Đoạn 11 (PDF trang 22)","evidence":"…his linguistic, as opposed to humanitarian, argument is, let’s say, unsentimental: the loss of a language, he states, ‘is much more of a tragedy for linguists whose interests are mostly theoretical, like me, than for linguists who focus on describing specific languages, since it means the permanent loss of the most relevant data for general theoretical work’.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…his linguistic, as opposed to humanitarian, argument is, let’s say, unsentimental: the loss of a language, he states, ‘is much more of a tragedy for linguists whose interests are mostly theoretical, like me, than for linguists who focus…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Chomsky’s attitude to disappearing languages is too emotional.”\n- Passage: “…his linguistic, as opposed to humanitarian, argument is, let’s say, unsentimental: the loss of a language, he states, ‘is much more of a tragedy for linguists whose interests are mostly theoretical, like me, than for linguists who focus…”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."}]},{"id":5,"title":"The Future of the World’s Language","passage":["The Future of the World’s Language Of the world’s 6,500 living languages, around half are expected to the out by the end of this century, according to UNESCO. Just 11 are spoken by more than half of the earth’s population, so it is little wonder that those used by only a few are being left behind as we become a more homogenous, global society. In short, 95 percent of the world’s languages are spoken by only five percent of its population—a remarkable level of linguistic diversity stored in tiny pockets of speakers around the world. Mark Turin, a university professor, has launched WOLP (World Oral Language Project) to prevent the language from the brink of extinction.","He is trying to encourage indigenous communities to collaborate with anthropologists around the world to record what he calls “oral literature” through video cameras, voice recorders and other multimedia tools by awarding grants from a £30,000 pot that the project has secured this year. The idea is to collate this literature in a digital archive that can be accessed on demand and will make the nuts and bolts of lost cultures readily available.For","many of these communities, the oral tradition is at the heart of their culture. The stories they tell are creative as well as communicative. Unlike the languages with celebrated written traditions, such as Sanskrit, Hebrew and Ancient Greek, few indigenous communities have recorded their own languages or ever had them recorded until now. The project suggested itself when Turin was teaching in Nepal. He wanted to study for a PhD in endangered languages and, while discussing it with his professor at Leiden University in the Netherlands, was drawn to a map on his tutor’s wall.","The map was full of pins of a variety of colours which represented all the world’s languages that were completely undocumented. At random, Turin chose a “pin” to document. It happened to belong to the Thangmi tribe, an indigenous community in the hills east of Kathmandu, the capital of Nepal. “Many of the choices anthropologists and linguists who work on these traditional field-work projects are quite random,” he admits.","Continuing his work with the Thangmi community in the 1990s, Turin began to record the language he was hearing, realising that not only was this language and its culture entirely undocumented, it was known to few outside the tiny community. He set about trying to record their language and myth of origins. “I wrote 1,000 pages of grammar in English that nobody could use—but I realised that wasn’t enough. It wasn’t enough for me, it wasn’t enough for them. It","simply wasn’t going to work as something for the community. So then I produced this trilingual word list in Thangmi, Nepali and English.” In short, it was the first ever publication of that language. That small dictionary is still sold in local schools for a modest 20 rupees, and used as part of a wider cultural regeneration process to educate children about their heritage and language. The task is no small undertaking: Nepal itself is a country of massive ethnic and linguistic diversity, home to 100 languages from four different language families. What’s more, even fewer ethnic Thangmi speak the Thangmi language.","Many of the community members have taken to speaking Nepali, the national language taught in schools and spread through the media, and community elders are dying without passing on their knowledge. Despite Turin’s enthusiasm for his subject, he is baffled by many linguists’ refusal to engage in the issue he is working on. “Of the 6,500 languages spoken on Earth, many do not have written traditions and many of these spoken forms are endangered,” he says. “There are more linguists in universities around the world than there are spoken languages—but most of them aren’t working on this issue.","To me it’s amazing that in this day and age, we still have an entirely incomplete image of the world’s linguistic diversity. People do PhDs on the apostrophe in French, yet we still don’t know how many languages are spoken.” “When a language becomes endangered, so too does a cultural worldview. We want to engage with indigenous people to document their myths and folklore, which can be harder to find funding for if you are based outside Western universities.” Yet, despite the struggles facing initiatives such as the World Oral Literature Project, there are historical examples that point to the possibility that language restoration is no mere academic pipe dream. The revival of a modern form of Hebrew in the 19th century is often cited as one of the best proofs that languages long dead, belonging to small communities, can be resurrected and embraced by a large number of people. By the 20th century, Hebrew was well on its way to becoming the main language of the Jewish population of both Ottoman and British Palestine. It is now spoken by more than seven million people in Israel.","Yet, despite the difficulties these communities face in saving their languages, Dr Turin believes that the fate of the world’s endangered languages is not sealed, and globalisation is not necessarily the nefarious perpetrator of evil it is often presented to be. “I call it the globalisation paradox: on the one hand globalisation and rapid socio-economic change are the things that are eroding and challenging diversity But on the other, globalisation is providing us with new and very exciting tools and facilities to get to places to document those things that globalisation is eroding. Also, the communities at the coal-face of change are excited by what globalisation has to offer.” In the meantime, the race is on to collect and protect as many of the languages as possible, so that the Rai Shaman in eastern Nepal and those in the generations that follow him can continue their traditions and have a sense of identity. And it certainly is a race: Turin knows his project’s limits and believes it inevitable that a large number of those languages will disappear. “We have to be wholly realistic.","A project like ours is in no position, and was not designed, to keep languages alive. The only people who can help languages survive are the people in those communities themselves. They need to be reminded that it’s good to speak their own language and I think we can help them do that—becoming modem doesn’t mean you have to lose your language.”"],"questions":[{"n":32,"text":"Turin argued that anthropologists and linguists usually think carefully before selecting an area to research.","answer":"FALSE","source":"Đoạn 5 (PDF trang 26)","evidence":"…Many of the choices anthropologists and linguists who work on these traditional field-work projects are quite random,” he admits. Continuing his work with the Thangmi community in the 1990s, Turin began to record the language he was hearing, realising that not only was this language and its culture entirely undocumented, it was known to few outside the tiny community.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…Many of the choices anthropologists and linguists who work on these traditional field-work projects are quite random,” he admits.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Turin argued that anthropologists and linguists usually think carefully before selecting an area to research.”\n- Passage: “…Many of the choices anthropologists and linguists who work on these traditional field-work projects are quite random,” he admits.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":33,"text":"Turin concluded that the Thangmi language had few similarities with other languages.","answer":"NOT GIVEN","source":"Đoạn 6 (PDF trang 27)","evidence":"What’s more, even fewer ethnic Thangmi speak the Thangmi language.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “What’s more, even fewer ethnic Thangmi speak the Thangmi language.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Thangmi language had few similarities with other languages” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Turin concluded that the Thangmi language had few similarities with other languages.”\n- Passage: “What’s more, even fewer ethnic Thangmi speak the Thangmi language.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":34,"text":"Turin has written that 1000-page document was inappropriate for Thangmi community;","answer":"TRUE","source":"Đoạn 5 (PDF trang 26)","evidence":"…I wrote 1,000 pages of grammar in English that nobody could use—but I realised that wasn’t enough. It wasn’t enough for me, it wasn’t enough for them. It simply wasn’t going to work as something for the community.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…I wrote 1,000 pages of grammar in English that nobody could use—but I realised that wasn’t enough.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Turin has written that 1000-page document was inappropriate for Thangmi community;”\n- Passage: “…I wrote 1,000 pages of grammar in English that nobody could use—but I realised that wasn’t enough.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":35,"text":"Some Nepalese schools lack resources to devote to language teaching.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 26)","evidence":"The project suggested itself when Turin was teaching in Nepal.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The project suggested itself when Turin was teaching in Nepal.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “schools lack resources to devote to language teaching” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Some Nepalese schools lack resources to devote to language teaching.”\n- Passage: “The project suggested itself when Turin was teaching in Nepal.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":6,"title":"Albert Einstein","passage":["Albert Einstein Albert Einstein is perhaps the best-known scientist of the 20th century. He received the Nobel Prize in Physics in 1921 and his theories of special and general relativity are of great importance to many branches of physics and astronomy. He is well known for his theories about light, matter, gravity, space and time. His most famous idea is that energy and mass are different forms of the same thing. Einstein was born in Wurttemberg, Germany on 14th March 1879. His family was Jewish but he had not been very religious in his youth although he became very interested in Judaism in later life. It is well documented that Einstein did not begin speaking until after the age of three. In fact, he found speaking so difficult that his family were worried that he would never start to speak.","When Einstein was four years old, his father gave him a magnetic compass. It was this compass that inspired him to explore the world of science. He wanted to understand why the needle always pointed north whichever way he turned the compass. It looked as if the needle was moving itself. But the needle was","inside a closed case, so no other force (such as the wind) could have been moving it. And this is how Einstein became interested in studying science and mathematics. In fact, he was so clever that at the age of 12 he taught himself Euclidean geometry. At fifteen, he went to school in Munich which he found very boring. He finished secondary school in Aarau, Switzerland and entered the Swiss Federal Institute of Technology in Zurich from which he graduated in 1900. But Einstein did not like the teaching there either. He often missed classes and used the time to study physics on his own or to play the violin instead.","However, he was able to pass his examinations by studying the notes of a classmate. His teachers did not have a good opinion of him and refused to recommend him for a university position. So, he got a job in a patent office in Switzerland. While he was working there, he wrote the papers that first made him famous as a great scientist. Einstein had two severely disabled children with his first wife, Mileva. His daughter (whose name we do not know) was born about a year before their marriage in January 1902. She was looked after by her Serbian grandparents until she died at the age of two. It is generally believed that she died from scarlet fever but there are those who believe that she may have suffered from a disorder known as Down Syndrome. But there is not enough evidence to know for sure. In fact, no one even knew that she had existed until Einstein’s granddaughter found 54 love letters that Einstein and Mileva had written to each other between 1897 and 1903. She found these letters inside a shoe box in their attic in California. Einstein and Mileva’s son, Eduard, was diagnosed with schizophrenia. He spent decades in hospitals and died in Zurich in 1965. Just before the start of World War I, Einstein moved back to Germany and became director of a school there. But in 1933, following death threats from the Nazis, he moved to the United States, where he died on 18th April 1955."],"questions":[{"n":1,"text":"The general theory of relativity is a very important theory in modern physics.","answer":"TRUE","source":"Đoạn 1 (PDF trang 32)","evidence":"He received the Nobel Prize in Physics in 1921 and his theories of special and general relativity are of great importance to many branches of physics and astronomy.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “He received the Nobel Prize in Physics in 1921 and his theories of special and general relativity are of great importance to many branches of physics and astronomy.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The general theory of relativity is a very important theory in modern physics.”\n- Passage: “He received the Nobel Prize in Physics in 1921 and his theories of special and general relativity are of great importance to many branches of physics and astronomy.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"Einstein had such difficulty with language that those around him thought he would never learn how to speak.","answer":"TRUE","source":"Đoạn 1 (PDF trang 32)","evidence":"In fact, he found speaking so difficult that his family were worried that he would never start to speak.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “In fact, he found speaking so difficult that his family were worried that he would never start to speak.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Einstein had such difficulty with language that those around him thought he would never learn how to speak.”\n- Passage: “In fact, he found speaking so difficult that his family were worried that he would never start to speak.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":3,"text":"It seemed to Einstein that nothing could be pushing the needle of the compass around except the wind.","answer":"FALSE","source":"Đoạn 2 (PDF trang 32)","evidence":"He wanted to understand why the needle always pointed north whichever way he turned the compass. It looked as if the needle was moving itself. But the needle was inside a closed case, so no other force (such as the wind) could have been moving it.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “He wanted to understand why the needle always pointed north whichever way he turned the compass.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nh
