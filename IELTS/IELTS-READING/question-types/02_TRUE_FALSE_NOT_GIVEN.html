that is widely seen as the end of an era.","B The code has, however, had a good history. Appropriately for a technology commonly associated with radio operators on sinking ships, the idea of Morse code is said to have occurred to Samuel Morse while he was on board a ship crossing the Atlantic. At the time Morse was a painter and occasional inventor, but when another of the ship’s passengers informed him of recent advances in electrical theory, Morse was suddenly taken with the idea of building an electric telegraph to send message in codes. Other inventors had been trying to do just that for the best part of a century. Morse succeeded and is now remembered as” the father of the telegraph” partly thanks to his single mindedness--it was years, for example, before he secured money from Congress to build his first telegraph line—but also for technical reasons.","C Compared with rival electric telegraph designs, such as the needle telegraph developed by William Cooke and Charles Wheatstone in Britain, Morse’s design was very simple: it required little more than a \"key” (essentially, a spring-loaded switch) to send messages, a clicking “sounder” to receive them, and a wire to link the two. But although Morse’s hardware was simple, there was a catch: in order to use his equipment, operators had to learn the special code of dots and still dashes that still bears his name. Originally, Morse had not intended to use combinations of dots and dashes to represent individual letters. His first code, sketched in his notebook during that transatlantic voyage ,used dots and dashes to represent the digits 0 to 9. Morse’s idea was that messages would consist of strings of numbers corresponding to words and phrases in a special numbered dictionary.But Morse later abandoned this scheme and, with the help of an associate, Alfred Vail, devised the Morse alphabet, which could be used to spell out messages a letter at a time in dots and dashes.","At first ,the need to learn this complicated-looking code made Morse’s telegraph seem impossibly tricky compared with other, more user-friendly designs. Cooke’s and Wheatstone’s telegraph, For example, used five needles to pick out letters on a diamond-shaped grid. But although this meant that anyone could use it, it also required five wires between telegraph stations. Morse’s telegraph needed only one .And some people, it soon transpired, had a natural facility for Morse code.","As electric telegraphy took off in the early 1850s, the Morse telegraph quickly became dominant, It was adopted as the European standard in 1851, allowing direct connections between the telegraph networks of different countries. (Britain chose not to participate., sticking with needle telegraphs for a few more years. By this time Morse code had been revised to allow for accents and other foreign characters, resulting in a split between American and International Morse that continues to this day.","On international submarine cables, left and right swings of a light-beam reflected from a tiny rotating mirror were used to represent dots and dashes. Meanwhile a distinct telegraphic subculture was emerging, with its own customs and vocabulary, and a hierarchy based on the speed at which operators could send and receive Morse code. First-class operators, who could send and receive at speeds of up to 45 words a minute, handled press traffic, securing the best--paid jobs in big cities. At the bottom of the pile were slow, inexperienced rural operators many of whom worked the wires as part-timers. As their Morse code improved, however, rural operators found that their new-found skill was a passport to better pay in a city job. Telegraphers soon swelled the ranks of the emerging middle classes. Telegraphy was also deemed suitable work for women. By 1870, a third of the operators in the Western Union office in New York, the largest telegraph office in America, were female.","In a dramatic ceremony in 1871, Morse himself said goodbye to the global community of telegraphers he had brought into being. After a lavish banquet and many adulatory speeches, Morse sat down behind an operator’s table and, placing his finger on a key connected to every telegraph wire in America, tapped out his final farewell to a standing ovation. By the time of his death in 1872, the world was well and truly wired: more than 650,000 miles of telegraph line and 30000 miles of submarine cable were throbbing with Morse code; and 20,000 towns and villages were connected to the global network. Just as the Internet is today often called an” information superhighway “,the telegraph was described in its day as an “ instantaneous highway of thought.”","H But by the 1890s the Morse telegraph’s heyday as a cutting-edge technology was","coming to an end, with the invention of the telephone and the rise of automatic telegraphs, precursors of the teleprinter,neither of which required specialist skills to operate. Morse code, however, was about to be given a new lease of life thanks to another new technology: wireless. Following the invention of radiotelegraphy by Guglielmo Marconi in 1896 ,its potential for use at sea quickly became apparent. For the first time, ships could communicate with each other, and with the shore,whatever the weather and even when out of visual range. In 1897 Marconi successfully sent Morse code messages between a shore station and an Italian warship 19 km (12miles) aways.By1910, Morse radio equipment was commonplace on ships."],"questions":[{"n":36,"text":"Morse had already been famous as an inventor before his invention of Morse code.","answer":"NOT GIVEN","source":"Đoạn A (PDF trang 99)","evidence":"Morse Code Morse code is being replaced by a new satellite-based system for sending distress calls at sea. Its dots and dashes have had a good run for their money. A “Calling all.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Morse Code Morse code is being replaced by a new satellite-based system for sending distress calls at sea.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “before his invention of Morse code” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Morse had already been famous as an inventor before his invention of Morse code.”\n- Passage: “Morse Code Morse code is being replaced by a new satellite-based system for sending distress calls at sea.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":37,"text":"Morse waited a long time before receiving support from Congress.","answer":"TRUE","source":"Đoạn B (PDF trang 99)","evidence":"At the time Morse was a painter and occasional inventor, but when another of the ship’s passengers informed him of recent advances in electrical theory, Morse was suddenly taken with the idea of building an electric telegraph to send message in codes. Other inventors had been trying to do just that for the best part of a century. Morse succeeded and is now remembered as” the father of the telegraph” partly thanks to his single mindedness--it was 12 years, for example, before he secured money from Congress to build his first telegraph line—but also for technical reasons.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “At the time Morse was a painter and occasional inventor, but when another of the ship’s passengers informed him of recent advances in electrical theory, Morse was suddenly taken with the idea of building an electric telegraph to send mes…”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy a passport to better pay in a city job. Telegraphers soon swelled the ranks of the emerging middle classes. Telegraphy was also deemed suitable work for women.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “As their Morse code improved, however, rural operators found that their new-found skill was a passport to better pay in a city job.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “prefer to employ telegraphy operators from rural areas” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Companies and firms prefer to employ telegraphy operators from rural areas.”\n- Passage: “As their Morse code improved, however, rural operators found that their new-found skill was a passport to better pay in a city job.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":40,"text":"Morse died from overwork.","answer":"NOT GIVEN","source":"Đoạn A (PDF trang 100)","evidence":"By the time of his death in 1872, the world was well and truly wired: more than 650,000 miles of telegraph line and 30000 miles of submarine cable were throbbing with Morse code; and 20,000 towns and villages were connected to the global network.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “By the time of his death in 1872, the world was well and truly wired: more than 650,000 miles of telegraph line and 30000 miles of submarine cable were throbbing with Morse code; and 20,000 towns and villages were connected to the global…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Morse died from overwork” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Morse died from overwork.”\n- Passage: “By the time of his death in 1872, the world was well and truly wired: more than 650,000 miles of telegraph line and 30000 miles of submarine cable were throbbing with Morse code; and 20,000 towns and villages were connected to the global…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":20,"title":"Pollution! in the Bay","passage":["A POURING water into the sea sounds harmless enough. But in Florida Bay, a large and shallow section of the Gulf of Mexico that lies Ee 4 vy. between the southern end of the Everglades and the aU is because researchers are divided over whether it will help or hinder the plants and animals that live in the bay.","What is at risk is the future of the bay's extensive beds of sea grasses. These grow on the bay's muddy floor and act as nurseries for the larvae of shrimps, lobsters and fish—many of them important sport and commercial- fishing species. Also in danger is an impressive range of coral reefs that run the length of the Florida Keys and form the third-largest barrier reef in the world. Since the 1980s, coral cover has dropped by 40%, and a third of the coral species have gone. This has had a damaging effect on the animals that depend on the reef, such as crabs, turtles and nearly 600 species of fish.","What is causing such ecological change is a matter of much debate. And the answer is of no small consequence. This is because the American government is planning to devote $8 billion over the next 30 years to revitalising the Everglades. Seasonal freshwater flows into the Everglades are to be restored in order to improve the region's health. But they will then run off into the bay.","Joseph Zieman, a marine ecologist at the University of Virginia, thinks this is a good idea. He believes that a lack of freshwater in the bay is its main problem. The blame, he says, lies with a century of drainage in the Everglades aimed at turning the marshes into farmland and areas for development. This has caused the","flow of freshwater into Florida Bay to dwindle, making the water in the bay, overall, more saline. This, he argues, kills the sea grasses, and as these rot, nutrients are released that feed the microscopic plants and animals that live in the water. This, he says, is why the bay's once crystal-clear waters often resemble a pea soup. And in a vicious circle, these turbid blooms block out sunlight, causing more sea grasses to die and yet more turbidity.","Brian Lapointe, a marine scientist at the Harbour Branch Oceanographic Institution at Fort Pierce in Florida, disagrees. He thinks sea grasses can tolerate much higher levels of salinity than the bay actually displays. Furthermore, he notes that, when freshwater flows through the Everglades were increased experimentally in the 1990s, it led to massive plankton blooms. Freshwater running off from well-fertilised farmlands, he says, caused a fivefold rise in nitrogen levels in the bay. This was like pouring fuel on a fire. The result was mass mortality of sea grasses because of increased turbidity from the plankton. Dr Lapointe adds that, because corals thrive only in waters where nutrient levels are low, restoring freshwater rich in nitrogen will do more damage to the reef.","It is a plausible theory. The water flowing off crops that are grown on the 750,000 acres of heavily fertilised farmland on the northern edge of the Everglades is rich in nitrogen, half of which ends up in the bay. But Bill Kruczynski, of America's Environmental Protection Agency, is convinced that nitrogen from farmlands is not the chief problem. Some coral reefs well away from any nitrogen pollution are dying and, curiously, a few are thriving. Dr Kruczynski thinks that increased nutrients arriving from local sewage discharges aiemenia from the thousands of cesspits along the Florida Keys are part of the problem.","Such claims and counterclaims make the impact of the restoration plan difficult to predict. If increased salinity is the main problem, the bay's ecology will benefit from the Everglades restoration project. If, however, nitrogen is the problem, increasing the flow of freshwater could make matters much worse.","H If this second hypothesis proves correct, the cure is to remove nitrogen from","farmland or sewage discharges, or perhaps both. Neither will be easy. Man-made wetlands, at present being built to reduce phosphate run off into the bay—also from fertilisers—would need an algal culture (a sort of contained algal bloom) added to them to deal with discharges from farmlands. That would be costly. So too would be the replacement of cesspits with proper sewerage—one estimate puts the cost at $650m. Either way, it is clear that when, on December Ist, 3,000 square miles of sea around the reef are designated as a “protective zone” by the deputy secretary of commerce, Sam Bodman, this will do nothing to protect the reef from pollution. Some argue, though, that there is a more fundamental flaw in the plans for the bay: the very idea of returning it to a utopian ideal before man wrought his m damage. Nobody knows what Florida Bay was like Fi siuny 45.5 + before the 1950s, when engineers cut the largest water away. Dr Kruczynski suspects it was more like an estuary. The bay that many people wish to re-create could have been nothing more than a changing phase in the bay's history.","These arguments do not merely threaten to create ecological problems but economic ones as well. The economy of the Florida Keys depends on tourism—the local tourist industry has an annual turnover of $2.5 billion. People come for fishing-boat trips, for manatee watching, or for scuba diving and snorkeling to view the exotically coloured corals. If the plan to restore the Everglades makes problems in the bay and the reef worse, it could prove a very expensive mistake. -PtPS DEO EDeD Ebene heneen eben EbeDeheDEheDEDeDEbeDEheDEDEDEOEDEbEDEheDEHODEHEDEbeDEheDEheDEoeDebes sar acarecerecerecarererererecerecaracararereceracaracarecgrecerecarecare”","B TLRS apse fl"],"questions":[{"n":9,"text":"Everyone agree with “pouring water into sea is harmless enough” even in Florida Bay area.","answer":"FALSE","source":"Đoạn 1 (PDF trang 104)","evidence":"Pollution! iw the Bay A POURING water into the sea sounds harmless enough. But in Florida Bay, a large and shallow section of the Gulf of Mexico that lies Ee 4 vy. between the southern end of the Everglades and the aU | 55 Florida Keys, it is proving highly controversial.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “Pollution!”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Everyone agree with “pouring water into sea is harmless enough” even in Florida Bay area.”\n- Passage: “Pollution!”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":10,"text":"Nitrogen was poured in from different types of crops as water flows through.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 105)","evidence":"The water flowing off crops that are grown on the 750,000 acres of heavily fertilised farmland on the northern edge of the Everglades is rich in nitrogen, half of which ends up in the bay. But Bill Kruczynski, of America's Environmental Protection Agency, is convinced that nitrogen from farmlands is not the chief problem. Some coral reefs well away from any nitrogen pollution are dying and, curiously, a few are thriving.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The water flowing off crops that are grown on the 750,000 acres of heavily fertilised farmland on the northern edge of the Everglades is rich in nitrogen, half of which ends up in the bay.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “different types of crops as water flows through” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Nitrogen was poured in from different types of crops as water flows through.”\n- Passage: “The water flowing off crops that are grown on the 750,000 acres of heavily fertilised farmland on the northern edge of the Everglades is rich in nitrogen, half of which ends up in the bay.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":11,"text":"Everglade restoration project can be effective regardless the cause of the pollution.","answer":"FALSE","source":"Đoạn 2 (PDF trang 105)","evidence":"If increased salinity is the main problem, the bay's ecology will benefit from the Everglades restoration project.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là quan hệ nguyên nhân - kết quả. Passage thực tế viết: “If increased salinity is the main problem, the bay's ecology will benefit from the Everglades restoration project.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Everglade restoration project can be effective regardless the cause of the pollution.”\n- Passage: “If increased salinity is the main problem, the bay's ecology will benefit from the Everglades restoration project.”\n- Quan hệ nghĩa: đối lập ở quan hệ nguyên nhân - kết quả."},{"n":12,"text":"Human has changed Florida Bay where old image before 1950s is unrecalled.","answer":"TRUE","source":"Đoạn 3 (PDF trang 106)","evidence":"Nobody knows what Florida Bay was like Fi siuny 45.5 + before the 1950s, when engineers cut the largest predicting canals in the Everglades and took most of the water away.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Nobody knows what Florida Bay was like Fi siuny 45.5 + before the 1950s, when engineers cut the largest predicting canals in the Everglades and took most of the water away.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Human has changed Florida Bay where old image before 1950s is unrecalled.”\n- Passage: “Nobody knows what Florida Bay was like Fi siuny 45.5 + before the 1950s, when engineers cut the largest predicting canals in the Everglades and took most of the water away.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":13,"text":"Tourism contributes fundamentally to economy of the Florida Bay area.","answer":"TRUE","source":"Đoạn 3 (PDF trang 106)","evidence":"The economy of the Florida Keys depends on tourism—the local tourist industry has an annual turnover of $2.5 billion.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The economy of the Florida Keys depends on tourism—the local tourist industry has an annual turnover of $2.5 billion.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Tourism contributes fundamentally to economy of the Florida Bay area.”\n- Passage: “The economy of the Florida Keys depends on tourism—the local tourist industry has an annual turnover of $2.5 billion.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":21,"title":"Design the mat and Foot health","passage":["A Indoor types will appreciate the cobblestone walkway, a knobbly textured plastic mat that they can wobble along in the comfort of their own homes. And for the more adventurous, there are shoes designed to throw you off balance.","B The technology may be cutting edge, but its origins are deep and exotic. Research into the idea that flat floors could be detrimental to our health was pioneered back in the late 1960s. While others in Long Beach, Be “ey","California, contemplated peace and love, podiatrist Charles Brantingham and _ physiologist Bruce j Beekman were concerned with more pedestrian matters. They reckoned that the growing epidemic of high blood pressure, varicose veins and deep-vein thromboses might be linked to the uniformity of the surfaces that we tend to stand and walk on. The trouble, as they saw it, was that walking continuously on flat floors, sidewalks and streets concentrates forces on just a few areas of the foot. As a result, these surfaces are likely to be far more conducive to chronic stress syndromes than natural ones, where the foot meets the ground in a wide variety of","orientations. The anatomy of the foot parallels that of the human hand - each having 26 bones, 33 joints and more than 100 muscles, tendons and ligaments. Modern lifestyles waste all this flexibility in your socks. Brantingham and Beekman became convinced that damage was being done simply by people standing on even surfaces and that this could be rectified by introducing a wobble.","“In Beijing and Shanghai city dwellers take daily walks on cobbled paths to improve their health” To test their ideas, they got 65 clerks and factory workers to try standing on a variable terrain floor - spongy mats with different amounts of give across the surface. This modest irregularity allowed the soles of the volunteers' feet to deviate slightly from the horizontal each time they shifted position. As the researchers hoped, this simple intervention turned out to make a huge difference over just a few weeks. Just a slight wobble from the floor activated a host of muscles in people's legs, which in turn helped to pump blood back to their hearts. The muscle action prevented the pooling of blood in their feet and legs, reducing the stress on the entire cardiovascular system. And two-thirds of the volunteers reported feeling much less tired. Yet decades later, the flooring of the world's workplaces remains relentlessly smooth.","Earlier this year, however, the idea was given a new lease of life when researchers in Oregon announced findings from a similar experiment with people over 60. John Fisher and colleagues at the Oregon Research Institute in Eugene designed a mat intended to replicate the effect of walking on cobblestones. In tests funded by the National Institute of Aging, they got some 50 adults to walk on the mats in their stockinged feet for less than an hour three times a week. After 16 weeks, these people showed marked improvements in balance and mobility, and even a significant reduction in blood pressure. People in a control group who walked on ordinary floors also improved but not as dramatically.","The mats are now on sale at $35. \"Our first 1000 cobblestone mats sold in three weeks,\" Fisher says. Production is now being scaled up. Even so, demand could exceed supply if this foot-stimulating activity really is a \"useful non-pharmacological approach for preventing or controlling hypertension of older adults\", as the researchers believe. They are not alone in extolling the revitalising powers of cobblestones. Reflexologists have long advocated walking on textured surfaces to stimulate so-called \"acupoints\" on the soles of the feet. Practitioners of this unorthodox therapy believe that pressure applied to particular spots on the foot connects directly to corresponding organs and somehow enhances their function. In China, spas, hotels, apartment blocks and even factories promote their cobblestone paths as healthful amenities. Fisher admits he got the idea from regular visits to the country. In Beijing and Shanghai city dwellers take daily walks along cobbled paths to improve their health. \"In the big cities, people take off their shoes and walk on these paths for 5 or 10 minutes, perhaps several times a day,” Fisher says. The idea is now taking off in Europe too. People in Germany, Austria and Switzerland can visit \"barefoot parks\" and walk along \"paths of the senses\" - with mud, logs, stone and moss underfoot - to receive what's known there as","reflexzon-massage. And it is not difficult to construct your own “health pathway\". American reflexologists Barbara and Kevin Kunz, based in Albuquerque, New Mexico, advise that you cobble together a walkway using broom handles, bamboo poles, hosepipes, gravel, pebbles, dried peas, driftwood, fallen logs, sand, door mats and strips of turf.","If your enthusiasm for DIY doesn't stretch to this, and Fisher's cobblestone mats are all sold out, there is another option. A new shoe on the market claims to transform flat, hard, artificial surfaces into something like natural uneven ground. \"These shoes have an unbelievable effect,\" says Benno Nigg, an exercise scientist at the human performance laboratory of Calgary University in Canada, which has done contract research for the shoe's manufacturers. \"They are one of the best things to have happened to humankind for years.\" Known as Masai Barefoot Technology, or MBTs, the shoes have rounded soles that cause you to rock slightly when you stand still, exercising the small muscles around the ankle that are responsible for fore-aft stability. Forces in the joint are reduced, putting less strain on the system, Nigg claims."],"questions":[{"n":28,"text":"Charles Brantingham and Bruce Beekman are the pioneers to research the connection between hyper illness and conditions of road.","answer":"TRUE","source":"Đoạn 1 (PDF trang 109)","evidence":"…mat and Foot health A Indoor types will appreciate the cobblestone walkway, a knobbly textured plastic mat that they can wobble along in the comfort of their own homes. And for the more adventurous, there are shoes designed to throw you off balance.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…mat and Foot health A Indoor types will appreciate the cobblestone walkway, a knobbly textured plastic mat that they can wobble along in the comfort of their own homes.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Charles Brantingham and Bruce Beekman are the pioneers to research the connection between hyper illness and conditions of road.”\n- Passage: “…mat and Foot health A Indoor types will appreciate the cobblestone walkway, a knobbly textured plastic mat that they can wobble along in the comfort of their own homes.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":29,"text":"John Fisher and his colleagues found that those who walked on cobble-stones suffered a worsening physical condition.","answer":"FALSE","source":"Đoạn 2 (PDF trang 110)","evidence":"John Fisher and colleagues at the Oregon Research Institute in Eugene designed a mat intended to replicate the effect of walking on cobblestones.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “John Fisher and colleagues at the Oregon Research Institute in Eugene designed a mat intended to replicate the effect of walking on cobblestones.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “John Fisher and his colleagues found that those who walked on cobble-stones suffered a worsening physical condition.”\n- Passage: “John Fisher and colleagues at the Oregon Research Institute in Eugene designed a mat intended to replicate the effect of walking on cobblestones.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":30,"text":"Manufacture of Fisher’s cobblestone mats booms due to high demand of this product.","answer":"TRUE","source":"Đoạn 2 (PDF trang 110)","evidence":"Our first 1000 cobblestone mats sold in three weeks,\" Fisher says. Production is now being scaled up.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “\"Our first 1000 cobblestone mats sold in three weeks,\" Fisher says.”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Manufacture of Fisher’s cobblestone mats booms due to high demand of this product.”\n- Passage: “\"Our first 1000 cobblestone mats sold in three weeks,\" Fisher says.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":31,"text":"The research works such as customized pathway from Barbara and Kevin Kunz were inspired from an oversea trip.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 111)","evidence":"And it is not difficult to construct your own “health pathway\". American reflexologists Barbara and Kevin Kunz, based in Albuquerque, New Mexico, advise that you cobble together a walkway using broom handles, bamboo poles, hosepipes, gravel, pebbles, dried peas, driftwood, fallen logs, sand, door mats and strips of turf. ipredicting HF REAMIMIKS TAB RBS Bt If your enthusiasm for DIY doesn't stretch to this, and Fisher's cobblestone mats are all sold out, there is another option.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “And it is not difficult to construct your own “health pathway\".”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Kevin Kunz were inspired from an oversea trip” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The research works such as customized pathway from Barbara and Kevin Kunz were inspired from an oversea trip.”\n- Passage: “And it is not difficult to construct your own “health pathway\".”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":32,"text":"Benno Nigg suggests that shoes of Masai Barefoot Technology have specific age limitation.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 111)","evidence":"These shoes have an unbelievable effect,\" says Benno Nigg, an exercise scientist at the human performance laboratory of Calgary University in Canada, which has done contract research for the shoe's manufacturers. \"They are one of the best things to have happened to humankind for years.\" Known as Masai Barefoot Technology, or MBTs, the shoes have rounded soles that cause you to rock slightly when you stand still, exercising the small muscles around the ankle that are responsible for fore-aft stability. Forces in the joint are reduced, putting less strain on the system, Nigg claims.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “\"These shoes have an unbelievable effect,\" says Benno Nigg, an exercise scientist at the human performance laboratory of Calgary University in Canada, which has done contract research for the shoe's manufacturers.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “of Masai Barefoot Technology have specific age limitation” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Benno Nigg suggests that shoes of Masai Barefoot Technology have specific age limitation.”\n- Passage: “\"These shoes have an unbelievable effect,\" says Benno Nigg, an exercise scientist at the human performance laboratory of Calgary University in Canada, which has done contract research for the shoe's manufacturers.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":22,"title":"Decision making and Happiness","passage":["A Americans today choose among more options in more parts of life than has ever been possible before. To an extent, the opportunity to choose enhances our lives. It is only logical to Q 8 G think that if some choice is good, more is better; SP FZ people who care about having infinite options will ;: 7 ? benefit from them, and those who do not can always just ignore the 273 versions of cereal they | have never tried. Yet recent research strongly suggests that, psychologically, this assumption is wrong. Although some choice is undoubtedly better than none, more is not always better than less.","Recent research offers insight into why many people end up unhappy rather than pleased when their options expand. We began by making a distinction between \"maximizers\" (those who always aim to make the best possible choice) and \"satisficers\" (those who aim for \"good enough,\" whether or not better selections might be out there).","In particular, we composed a set of statements—the Maximization Scale—to diagnose people's propensity to maximize. Then we had several thousand people rate themselves from 1 to 7 (from “completely disagree\" to \"completely agree\") on such statements as \"I never settle for second best.\" We also evaluated their sense, of satisfaction with their decisions. We did not define a sharp cutoff to separate maximizers from satisficers, but in general, we think of individuals whose average scores are higher than 4 (the scale's midpoint) as maximizers and those whose scores are lower than the midpoint as satisficers. People who score highest on the test—the greatest maximisers—engage in more product comparisons than the lowest scorers, both before and after they make purchasing decisions, and they take longer to decide what to buy. When satisficers find an item that meets their standards, they stop looking. But","D We found that the greatest maximizers are the least happy with maximizers exert enormous effort reading labels, checking out consumer magazines and trying new products. They also spend more time comparing their purchasing decisions with those of others.","the fruits of their efforts. When they compare themselves with others, they get little pleasure from finding out that they did better and substantial dissatisfaction from finding out that they did worse. They are more prone to experiencing regret after a purchase, and if their acquisition disappoints them, their sense of well-being takes longer to recover. They also tend to brood or ruminate more than satisficers do.","E Does it follow that maximizers are less happy in general than satisficers? We tested this by having people fill out a variety of questionnaires known to be reliable indicators of well-being. As might be expected, individuals with high","A . 4 . . maximization scores experienced less satisfaction iam 45a : sas! — Ne with life and were less happy, less optimistic and scores. Indeed, those with extreme maximization ratings had depression scores that placed them in the borderline clinical range.","F Several factors explain why more choice is not always better than less, especially","for maximizers. High among these are \"opportunity costs.\" The quality of any given option cannot be assessed in isolation from its alternatives. One of the \"costs\" of making a selection is losing the opportunities that a different option would have afforded. Thus an opportunity cost of vacationing on the beach in Cape Cod might be missing the fabulous restaurants in the Napa Valley. EARLY DECISION-MAKING RESEARCH by Daniel Kahneman and Amos Tversky showed that people respond much more strongly to losses than gains. If we assume that opportunity costs reduce the overall desirability of the most preferred choice, then the more alternatives there are, the deeper our sense of loss will be and the less satisfaction we will derive from our ultimate decision.","G The problem of opportunity costs will be worse for a maximizer than for a","satisficer. The latter's \"good enough\" philosophy can survive thoughts about opportunity costs. In addition, the \"good enough\" standard leads to much less searching and inspection of alternatives than the maximizer's \"best\" standard. With fewer choices under consideration, a person will have fewer opportunity costs to subtract.","Just as people feel sorrow about the opportunities they have forgone, they may also suffer regret about the option they settle on. My colleagues and I devised a scale to measure proneness to feeling regret, and we found that people with high sensitivity to regret are less happy, less satisfied with life, less optimistic and more depressed than those with low sensitivity. Not surprisingly, we also found that people with high regret sensitivity tend to be maximizers. Indeed, we think that worry over future regret is a major reason that individuals become maximizers. The only way to be sure you will not regret a decision is by making the best possible one. Unfortunately, the more options you have and the more opportunity costs you incur, the more likely you are to experience regret. Regret In a classic demonstration of the power of sunk costs, people were offered season subscriptions to a local theater company. Some were offered the tickets at full price and others at a discount. Then the researchers simply kept track of how Lento often the ticket purchasers actually attended the plays over the course of the season. Full-price payers were more e likely to show up at performances than discount payers. The reason for this, the investigators argued, was that the full-price payers would experience more regret if they did not use the Poche comeleton tickets because not using the more costly tickets would constitute a bigger loss. To increase sense of happiness, We can decide to restrict our options when the decision is not crucial. For example, make a rule to visit no more than two stores when shopping for clothing."],"questions":[{"n":32,"text":"With the society’s advancement, more chances make our lives better and happier.","answer":"FALSE","source":"Đoạn 1 (PDF trang 114)","evidence":"…maximizers\" (those who always aim to make the best possible choice) and \"satisficers\" (those who aim for \"good enough,\" whether or not better selections might be out there). In particular, we composed a set of statements—the Maximization Scale—to diagnose people's propensity to maximize.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “…maximizers\" (those who always aim to make the best possible choice) and \"satisficers\" (those who aim for \"good enough,\" whether or not better selections might be out there).”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “With the society’s advancement, more chances make our lives better and happier.”\n- Passage: “…maximizers\" (those who always aim to make the best possible choice) and \"satisficers\" (those who aim for \"good enough,\" whether or not better selections might be out there).”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":33,"text":"There is difference of findings by different gender classification.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 115)","evidence":"One of the \"costs\" of making a selection is losing the opportunities that a different option would have afforded.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “One of the \"costs\" of making a selection is losing the opportunities that a different option would have afforded.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “different gender classification” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “There is difference of findings by different gender classification.”\n- Passage: “One of the \"costs\" of making a selection is losing the opportunities that a different option would have afforded.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":34,"text":"The feeling of loss is greater than that of acquisition.","answer":"TRUE","source":"Đoạn 2 (PDF trang 115)","evidence":"They are more prone to experiencing regret after a purchase, and if their acquisition disappoints them, their sense of well-being takes longer to recover.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “They are more prone to experiencing regret after a purchase, and if their acquisition disappoints them, their sense of well-being takes longer to recover.”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The feeling of loss is greater than that of acquisition.”\n- Passage: “They are more prone to experiencing regret after a purchase, and if their acquisition disappoints them, their sense of well-being takes longer to recover.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":35,"text":"“Good enough” plays a more significant role in pursuing “best” standards of maximizer.","answer":"FALSE","source":"Đoạn 3 (PDF trang 116)","evidence":"In addition, the \"good enough\" standard leads to much less searching and inspection of alternatives than the maximizer's \"best\" standard.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “In addition, the \"good enough\" standard leads to much less searching and inspection of alternatives than the maximizer's \"best\" standard.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: ““Good enough” plays a more significant role in pursuing “best” standards of maximizer.”\n- Passage: “In addition, the \"good enough\" standard leads to much less searching and inspection of alternatives than the maximizer's \"best\" standard.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":36,"text":"There are certain correlations between the “regret” people and the maximisers.","answer":"TRUE","source":"Đoạn 3 (PDF trang 116)","evidence":"Just as people feel sorrow about the opportunities they have forgone, they may also suffer regret about the option they settle on. My colleagues and I devised a scale to measure proneness to feeling regret, and we found that people with high sensitivity to regret are less happy, less satisfied with life, less optimistic and more depressed than those with low sensitivity. Not surprisingly, we also found that people with high regret sensitivity tend to be maximizers.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Just as people feel sorrow about the opportunities they have forgone, they may also suffer regret about the option they settle on.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “There are certain correlations between the “regret” people and the maximisers.”\n- Passage: “Just as people feel sorrow about the opportunities they have forgone, they may also suffer regret about the option they settle on.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":23,"title":"Renewable Energy","passage":["A The race is on for the ultimate goal of renewable energy: electricity production at prices that are competitive with coal-fired power stations, but without coal's pollution. Some new technologies are aiming to be the first to push coal from its position as Australia's chief source of electricity.","At the moment the front-runner in renewable energy is wind technology. According to Peter Bergin of Australian Hydro, one of Australia's leading wind energy companies, there have been no dramatic changes in windmill design for many years, but the cumulative effects of numerous small improvements have had a major impact on cost. ‘We're reaping the benefits of 30 years of research in Europe, without having to make the same mistakes that they did,’ Mr. Bergin says.","Electricity can be produced from coal at around 4 cents per kilowatt-hour, but only if the environmental costs are ignored. 'Australia has the second cheapest electricity in the world, and this makes it difficult for renewable to compete,\" says Richard Hunter of the Australian Ecogeneration Association (AEA). Nevertheless, the AEA reports: 'The production cost of a kilowatt-hour of wind power is one fifth of what it was 20 years ago,' or around 7 cents per kilowatt-hour.","Australian Hydro has dozens of wind monitoring stations across Australia as part of its aim to become Australia's pre-eminent renewable energy company. Despite all these developments, wind power remains one of the few forms of alternative energy where Australia is nowhere near the global cutting edge, mostly just replicating European designs.","While wind may currently lead the way, some consider a number of technologies under development have more potential. In several cases, Australia is at the forefront of global research in the area. Some of them are very site-specific, ensuring that they may never become dominant market players. On the other hand, these newer developments are capable of providing more reliable power, avoiding the major criticism of windmills - the need for back-up on a calm day. One such development uses hot, dry rocks. Deep beneath South Australia,","radiation from elements contained in granite heats the rocks. Layers of insulating sedimentation raise the temperatures in some location to 250° centigrade. An Australian firm, Geoenergy, is proposing to pump water 3.5 kilometres into the earth, where it will travel through tiny fissures in the granite, heating up as it goes, until it escapes as steam through another drilled hole.","G No greenhouse gases are produced, but the system needs some additional features","if it is to be environmentally friendly. Dr Prue Chopra, a geophysicist at the Australian National University and one of the founders of Geoenergy, note that the steam will bring with it radon gas, along through a heat exchanger and then sent back underground for another cycle. Technically speaking, hot dry rocks are not a renewable source of energy. However, the Australian source is so large it could supply the entire country's needs for thousands of years at current rates of consumption.","Two other proposals for very different ways to harness sun and wind energy have surfaced recently. Progress continues with Australian company EnviroPower's plans for Australia's first solar chimney near Mildura, in Victoria. Under this scheme, a tall tower will draw hot air from a greenhouse built to cover the surrounding 5 km?. As the air rises, it will drive a turbine* to produce electricity. The solar tower combines three very old technologies - the chimney, the turbine and the greenhouse - to produce something quite new. It is this reliance on proven engineering principles that led Enviropower's CEO, Richard Davies, to state: There is no doubt this technology will work, none at all.’","This year, Enviropower recognized that the quality of sunlight in the Mildura district will require a substantially larger collecting area than was previously thought. However, spokesperson kay Firth says that a new location closer to Mildura will enable Enviropower to balance the increased costs with extra revenue. Besides saving in transmission costs, the new site ‘will mean increased revenue from tourism and use of power for telecommunications. We'll also be able to use the outer 500 metres for agribusiness.’ Wind speeds closer to the tower will be too high for farming.","Another Australian company, Wavetech, is achieving success with ways of harvesting the energy in waves. Wavetech's invention uses a curved surface to push waves into a chamber, where the flowing water column pushes air back and forth through a turbine. Wavetech was created when Dr. Tim Devine offered the idea to the world leader in wave generator manufacturers, who rather surprisingly rejected it. Dr. Devine responded by establishing Wavetech, and making a number of other improvements to generator design. Wavetech claims that, at appropriate sites, ‘the cost of electricity produced with our technology should be below cents per kilowatt-hour.","Kk The diversity of forms of greenhouse -friendly energy under development in Australia is remarkable. However, support on a national level is disappointing. According to Richard Hunter of the AEA, ‘Australia has huge potential for wind, sun and wave technology. We should really be at the forefront, but the reality is we are a long way behind.’ whee le le ele ie ele ele |) ala) aloe) wo} E/S/Slo/alalalalalmle|sS"],"questions":[{"n":14,"text":"In Australia, alternative energies are less expensive than conventional electricity.","answer":"FALSE","source":"Đoạn 2 (PDF trang 120)","evidence":"…Renewable Energy An insight into the progress in renewable energy research A The race is on for the ultimate goal of renewable energy: electricity production at prices that are competitive with coal-fired power stations, but without coal's pollution.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “…Renewable Energy An insight into the progress in renewable energy research A The race is on for the ultimate goal of renewable energy: electricity production at prices that are competitive with coal-fired power stations, but without coa…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “In Australia, alternative energies are less expensive than conventional electricity.”\n- Passage: “…Renewable Energy An insight into the progress in renewable energy research A The race is on for the ultimate goal of renewable energy: electricity production at prices that are competitive with coal-fired power stations, but without coa…”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":15,"text":"Geoenergy needs to adapt its system to make it less harmful to the environment.","answer":"TRUE","source":"Đoạn 3 (PDF trang 121)","evidence":"An Australian firm, Geoenergy, is proposing to pump water 3.5 kilometres into the earth, where it will travel through tiny fissures in the granite, heating up as it goes, until it escapes as steam through another drilled hole. G No greenhouse gases are produced, but the system needs some additional features if it is to be environmentally friendly.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “An Australian firm, Geoenergy, is proposing to pump water 3.5 kilometres into the earth, where it will travel through tiny fissures in the granite, heating up as it goes, until it escapes as steam through another drilled hole.”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Geoenergy needs to adapt its system to make it less harmful to the environment.”\n- Passage: “An Australian firm, Geoenergy, is proposing to pump water 3.5 kilometres into the earth, where it will travel through tiny fissures in the granite, heating up as it goes, until it escapes as steam through another drilled hole.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":16,"text":"Dr. Prue Chopra has studied the effects of radon gas on the environment.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 121)","evidence":"Dr Prue Chopra, a geophysicist at the Australian National University and one of the founders of Geoenergy, note that the steam will bring with it radon gas, along through a heat exchanger and then sent back underground for another cycle.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Dr Prue Chopra, a geophysicist at the Australian National University and one of the founders of Geoenergy, note that the steam will bring with it radon gas, along through a heat exchanger and then sent back underground for another cycle.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “the effects of radon gas on the environment” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Dr. Prue Chopra has studied the effects of radon gas on the environment.”\n- Passage: “Dr Prue Chopra, a geophysicist at the Australian National University and one of the founders of Geoenergy, note that the steam will bring with it radon gas, along through a heat exchanger and then sent back underground for another cycle.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":17,"text":"Hot, dry rocks could provide enough power for the whole of Australia.","answer":"TRUE","source":"Đoạn 3 (PDF trang 121)","evidence":"Technically speaking, hot dry rocks are not a renewable source of energy.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Technically speaking, hot dry rocks are not a renewable source of energy.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Hot, dry rocks could provide enough power for the whole of Australia.”\n- Passage: “Technically speaking, hot dry rocks are not a renewable source of energy.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":18,"text":"The new Enviropower facility will keep tourists away.","answer":"FALSE","source":"Đoạn 3 (PDF trang 121)","evidence":"It is this reliance on proven engineering principles that led Enviropower's CEO, Richard Davies, to state: There is no doubt this technology will work, none at all.’ This year, Enviropower recognized that the quality of sunlight in the Mildura district will require a substantially larger collecting area than was previously thought. However, spokesperson kay Firth says that a new location closer to Mildura will enable Enviropower to balance the increased costs with extra revenue. Besides saving in transmission costs, the new site ‘will mean increased revenue from tourism and use of power for telecommunications.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “It is this reliance on proven engineering principles that led Enviropower's CEO, Richard Davies, to state: There is no doubt this technology will work, none at all.’ This year, Enviropower recognized that the quality of sunlight in the M…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The new Enviropower facility will keep tourists away.”\n- Passage: “It is this reliance on proven engineering principles that led Enviropower's CEO, Richard Davies, to state: There is no doubt this technology will work, none at all.’ This year, Enviropower recognized that the quality of sunlight in the M…”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":19,"text":"Wavetech was established when its founders were turned down by another company.","answer":"TRUE","source":"Đoạn 3 (PDF trang 121)","evidence":"Another Australian company, Wavetech, is achieving success with ways of harvesting the energy in waves. Wavetech's invention uses a curved surface to push waves into a chamber, where the flowing water column pushes air back and forth through a turbine. Wavetech was created when Dr.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Another Australian company, Wavetech, is achieving success with ways of harvesting the energy in waves.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Wavetech was established when its founders were turned down by another company.”\n- Passage: “Another Australian company, Wavetech, is achieving success with ways of harvesting the energy in waves.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":20,"text":"According to the AEA, Australia is a world leader in developing renewable energy.","answer":"FALSE","source":"Đoạn 4 (PDF trang 122)","evidence":"According to Richard Hunter of the AEA, ‘Australia has huge potential for wind, sun and wave technology.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “According to Richard Hunter of the AEA, ‘Australia has huge potential for wind, sun and wave technology.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “According to the AEA, Australia is a world leader in developing renewable energy.”\n- Passage: “According to Richard Hunter of the AEA, ‘Australia has huge potential for wind, sun and wave technology.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."}]},{"id":24,"title":"Putting the brakes on climate change","passage":["A It is tempting to think that the conservation of coral reefs and rainforests is a separate issue from traffic and air pollution. But it is not. Scientists are now confident that rapid changes in the Earth's climate are already disrupting and altering many wildlife habitats. Pollution from vehicles is a big part of the problem.","B The United Nation's Climate Change Panel has estimated that the global average temperature rise expected by the year 2100 could be as much as 6°C, causing forest fires and dieback on land and coral bleaching in the ocean. Few species, if any, will be immune from the changes in temperature, rainfall and sea levels. The panel believes that if such catastrophic temperature rises are to be avoided, the quantity of greenhouse gases, especially carbon dioxide, being released into the atmosphere must be reduced. That will depend on slowing the rate of deforestation and, more crucially, finding alternatives to coal, oil and gas as our principal energy sources.","Cc Technologies do exist to reduce or eliminate carbon dioxide as a waste product of our energy consumption. Wind power and solar power are both spreading fast, but what are we doing about traffic? Electric cars are one possible option, but their range and the time it takes to charge their batteries pose serious limitations. However, the technology that shows the most potential to make cars climate-friendly is fuel-cell technology. This was actually invented in the late nineteenth century, but because the world's motor industry put its effort into developing the combustion engine, it was never refined for mass production. One of the first prototype fuel-cell-powered vehicles has been built by the Ford Motor Company. It is like a conventional car, only with better acceleration and a smoother ride. Ford engineers expect to be able to produce a virtually silent vehicle in the future. tank, producing electricity. The only emission from the exhaust pipe is water. The fuel-cell is, in some ways, similar to a battery, but unlike a battery it does not run down. As long as hydrogen and oxygen are supplied to the cell, it will keep on generating electricity. Some cells","work off methane and a few use liquid fuels such as methanol, but fuel-cells using hydrogen probably have the most potential. Furthermore, they need not be limited to transport. Fuel-cells can be made in a huge range of size, small enough for portable computers or large enough for power stations. They have no moving parts and therefore need no oil. They just need a supply of hydrogen. The big question, then, is where to get it from.","E One source of hydrogen is water. But to exploit the abundant resource, electricity is needed, and if the electricity is produced by a coal-fired power station or other fossil fuel, then the overall carbon reduction benefit of the fuel-cell disappears. Renewable sources, such as wind and solar power, do not produce enough energy for-it to be economically viable to use them in the 'manufacture' of hydrogen as a transport fuel. Another source of iPhone hydrogen is, however, available and could provide a supply pending the SFALAPP development of more efficient and cheaper renewable energy BBG technologies. By splitting natural gas (methane) into its constituent parts, }UGE hydrogen and carbon dioxide are produced. One way round the problem . of what to do with the carbon dioxide could be to store it back below ground-so called geological sequestration. Oil companies, such as Norway's Statoil, are experimenting with storing carbon dioxide below ground in oil and gas wells.","F With freak weather conditions, arguably caused by global warming, frequently in the headlines, the urgent need to get fuel-cell vehicles will be available in most showrooms. Even now, fuel-cell buses are operating in the US, while in Germany a courier company is planning to take delivery of fuel-cell-powered vans in the near future. The fact that centrally-run fleets of buses and vans are the first fuel-cell vehicles identifies another challenge-fuel distribution. The refueling facilities necessary to top up hydrogen-powered vehicles are available only in a very few places at present. Public transport and delivery firms are logical places to start, since their vehicles are operated from central depots. Emergency? Choose.","G Fuel-cell technology is being developed right across the automotive industry. This technology could have a major impact in slowing down climate change, but further investment is needed if the industry - and the world's wildlife - is to have a long-term future. Riz, RAB-BREFZRUMPRAIWER, T REF, appRORN EA BRERMAA, RE, RE i aeRaO=en EAM ALAAM, MIRRITS, KAKMETS, mI ETS? MHSERS, CHANT, HSA ERATH se wenansnn Fo Ss? HWE, AAA"],"questions":[{"n":37,"text":"Using electricity produced by burning fossil fuels to access sources of hydrogen may increase the positive effect of the fuel-cell.","answer":"FALSE","source":"Đoạn 1 (PDF trang 124)","evidence":"…hydrogen cars the answer? A It is tempting to think that the conservation of coral reefs and rainforests is a separate issue from traffic and air pollution. But it is not. Scientists are now confident that rapid changes in the Earth's climate are already disrupting and altering many wildlife habitats.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…hydrogen cars the answer?”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Using electricity produced by burning fossil fuels to access sources of hydrogen may increase the positive effect of the fuel-cell.”\n- Passage: “…hydrogen cars the answer?”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":38,"text":"The oil company Statoil in Norway owns gas wells in other parts of the world.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 125)","evidence":"Oil companies, such as Norway's Statoil, are experimenting with storing carbon dioxide below ground in oil and gas wells.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Oil companies, such as Norway's Statoil, are experimenting with storing carbon dioxide below ground in oil and gas wells.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “gas wells in other parts of the world” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The oil company Statoil in Norway owns gas wells in other parts of the world.”\n- Passage: “Oil companies, such as Norway's Statoil, are experimenting with storing carbon dioxide below ground in oil and gas wells.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":39,"text":"Public transport is leading the way in the application of fuel-cell technology.","answer":"TRUE","source":"Đoạn 4 (PDF trang 125)","evidence":"Public transport and delivery firms are logical places to start, since their vehicles are operated from central depots. predicting| Emergency? G Fuel-cell technology is being developed right across the automotive industry.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Public transport and delivery firms are logical places to start, since their vehicles are operated from central depots.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Public transport is leading the way in the application of fuel-cell technology.”\n- Passage: “Public transport and delivery firms are logical places to start, since their vehicles are operated from central depots.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":40,"text":"More funding is necessary to ensure the success of the fuel-cell vehicle industry.","answer":"TRUE","source":"Đoạn 4 (PDF trang 125)","evidence":"The refueling facilities necessary to top up hydrogen-powered vehicles are available only in a very few places at present. Public transport and delivery firms are logical places to start, since their vehicles are operated from central depots. predicting| Emergency? G Fuel-cell technology is being developed right across the automotive industry.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The refueling facilities necessary to top up hydrogen-powered vehicles are available only in a very few places at present.”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “More funding is necessary to ensure the success of the fuel-cell vehicle industry.”\n- Passage: “The refueling facilities necessary to top up hydrogen-powered vehicles are available only in a very few places at present.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":25,"title":"Making Copies","passage":["A Copying is the engine of civilization: culture is behavior duplicated. The oldest copier invented by [é ‘hoe becomes an idea of mine. The second great copying Emergency? machine was writing. When the Sumerians ose transposed spoken words into stylus marks on clay me SMARTER tablets more than 5,000 years ago, they hugely extended the human network that language had created. Writing freed copying from the chain of living contact. It made ideas permanent, portable and endlessly reproducible.","Until Johann Gutenberg invented the printing press in the mid-1400s, producing a book in an edition of more than one generally meant writing it out again. Printing with moveable type was not copying, however. Gutenberg couldn’t take a document that already existed, feed it into his printing press and run off facsimiles. The first true mechanical copier was manufactured in 1780, when James Watt, who is better known as the inventor of the modern steam engine, created the copying press. Few people today know what a copying press was, but you may have seen one in an antiques store, where it was perhaps called a book press. A user took a document freshly written in special ink, placed a moistened sheet of translucent paper against the inked surface and squeezed the two sheets together in the press, causing some of the ink from the original to penetrate the second sheet, which could then be read by turning it over and looking through its back. The high cost prohibits the widespread use of this copier. Among the first modern copying machines, introduced in 1950 by 3M, was the Thermo-Fax, and it made a copy by shining infrared light through an original","document and a sheet of paper that had been coated with heat-sensitive chemicals. Competing manufacturers soon introduced other copying technologies and marketed machines called Dupliton, Dial- A-Matic Autostat, Verifax, Copease and Copymation. These machines and their successors were welcomed by secretaries, who had no other means of reproducing documents in hand, but each had serious drawbacks. All required expensive chemically treated papers. And all made copies that smelled bad, were hard to read, didn’t last long and tended to curl up into tubes. The machines were displaced, beginning in the late 1800s, by a combination of two 19th century inventions: the typewriter and carbon paper. For those reasons, copying presses were standard equipment in offices for nearly a century and a half.","None of those machines are still manufactured today. They were all made obsolete by a radically different machine, which had been developed by an obscure photographic-supply company. That company had been founded in 1906 as the Haloid Company and is known today as the Xerox Corporation. In 1959, it introduced an office copier called the Haloid Xerox 914, a machine that, unlike its numerous competitors, made sharp, permanent copies on ordinary paper—a huge breakthrough. The process, which Haloid called xerography (based on Greek words meaning “dry” and “writing”), was so unusual and nonnutritive that physicists who visited the drafty warehouses where the first machines were built sometimes expressed doubt that it was even theoretically feasible.","Remarkably, xerography was conceived by one person— Chester Carlson, a shy, soft-spoken patent attorney, who grew up in almost unspeakable poverty and worked his way through junior college and the California Institute of Technology. Chester Carlson was born in Seattle in 1906. His parents—Olof Adolph Carlson and Ellen Josephine Hawkins—had grown up on neighboring farms in Grove City, Minnesota, a tiny Swedish farming community about 75 miles west of Minneapolis. Compare — with competitors, Carlson was not a normal inventor in 20-century. He made his discovery in solitude in 1937 and offered it to more than 20 major corporations, among them IBM, General Electric, Eastman Kodak and RCA. All of them turned him down, expressing what he later called “an enthusiastic lack of interest” and thereby passing up the opportunity to manufacture what Fortune magazine would describe as “the most successful product ever marketed in America.”","Carlson’s invention was indeed a commercial triumph. Essentially overnight, people began making copies at a rate that was orders of magnitude higher than anyone had believed possible. And the rate is still growing. In fact, most documents handled by a typical American office worker today are produced xerographically, Bi sian) 4, he competitors or on laser printers, which employ the same process (and were invented, in the 1970s, by a Xerox researcher). This year, the world will produce more than three trillion xerographic copies and laser-printed pages — about 500 for every human on earth.","Xerography eventually made Carlson a very wealthy man. (His royalties amounted to something like a 16th of a cent for every Xerox copy made, worldwide, through 1965.) Nevertheless, he lived simply. He never owned a second home or a second car, and his wife had to urge him not to buy thirdclass train tickets when he traveled in Europe. People who knew him casually seldom suspected that he was rich or even well-to-do; when Carlson told an acquaintance he worked at Xerox, the man assumed he was a factory worker and asked if he belonged to a union. “His possessions seemed to be composed of the . number of things he could easily do without,” his Finny ies iM quietly giving most of his fortune to charities. When he died in 1968, among the eulogizers was the secretary-general of the United Nations."],"questions":[{"n":1,"text":"The earliest languages were recorded on papyrus.","answer":"FALSE","source":"Đoạn 2 (PDF trang 129)","evidence":"…copies that smelled bad, were hard to read, didn’t last long and tended to curl up into tubes. The machines were displaced, beginning in the late 1800s, by a combination of two 19th century inventions: the typewriter and carbon paper.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với th
