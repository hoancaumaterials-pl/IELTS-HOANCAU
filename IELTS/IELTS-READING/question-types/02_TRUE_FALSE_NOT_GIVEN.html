 so sánh. Passage thực tế viết: “…knowing how to catch deceit can be just as important a survival skill as knowing how to tell a lie and get away with it.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The fact of lying is more important than detecting one.”\n- Passage: “…knowing how to catch deceit can be just as important a survival skill as knowing how to tell a lie and get away with it.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":4,"text":"Researchers are using equipment to study which part of the brain is responsible for telling lies.","answer":"NOT GIVEN","source":"Đoạn B (PDF trang 151)","evidence":"…Researchers are even programming computers--like those used on Lie Detector--to get at the truth by analyzing the same physical cues available to the naked eye and ear. \"With the proper training, many people can learn to reliably detect lies,\" says Paul Ekman, professor of psychology at the University of California, San Francisco, who has spent the past 15 years studying the secret art of deception (n.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…Researchers are even programming computers--like those used on Lie Detector--to get at the truth by analyzing the same physical cues available to the naked eye and ear.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “of the brain is responsible for telling lies” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Researchers are using equipment to study which part of the brain is responsible for telling lies.”\n- Passage: “…Researchers are even programming computers--like those used on Lie Detector--to get at the truth by analyzing the same physical cues available to the naked eye and ear.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":5,"text":"To be a good liar, one has to understand other people’s emotions.","answer":"TRUE","source":"Đoạn C (PDF trang 151)","evidence":"C In order to know what kind of lies work best, successful liars need to accurately assess (v.i#(#) other people's emotional states.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “C In order to know what kind of lies work best, successful liars need to accurately assess (v.i#(#) other people's emotional states.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “To be a good liar, one has to understand other people’s emotions.”\n- Passage: “C In order to know what kind of lies work best, successful liars need to accurately assess (v.i#(#) other people's emotional states.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":31,"title":"Health in the Wild","passage":[". . 7 Health in the Wild ‘3 Many animals seem able to treat their illnesses themselves. Humans may have a thing or For the past decade Dr Engel, a lecturer in environmental sciences at Britain’s Open University, has been collating examples of self-medicating behavior in wild animals. She recently published a book on the subject. In a talk at the Edinburgh Science Festival earlier this month, she explained that the idea that animals can treat Ts themselves has been regarded with some skepticism by her colleagues in the past. But a growing number of animal behaviourists now think that wild animals can and do deal with their own medical needs. One example of self-medication was discovered in 1987. Michael Huffman and Mohamedi Seifu, working in the Mahale Mountains National Park in Tanzania, noticed that local chimpanzees suffering from intestinal worms would dose themselves with the pith of a plant called Veronia. This plant produces poisonous chemicals called terpenes. Its pith contains a strong enough concentration to kill gut parasites, but not so strong as to kill chimps (nor people, for that matter; locals use the pith for the same purpose). Given that the plant is known locally as “goat-killer”, however, it seems that not all animals / a 23 are as smart as chimps and humans. Some consume it indiscriminately, and succumb. : . . . . Canscsaui PRES IRATE RAR I OVIKGIEG, My SAEE","C Since the Veronia-eating chimps were discovered, more evidence has emerged suggesting that animals often eat things for medical rather than nutritional reasons. Many species, for example, consume dirt—a behaviour known as geophagy. Historically, the preferred explanation was that soil supplies minerals such as salt. But geophagy occurs in areas where the earth is not a useful source of minerals, and also in places where minerals can be more easily obtained from certain plants that are known to be rich in them. Clearly, the animals must be getting something else out of","D The current belief is that soil—and particularly the clay in it—helps to detoxify the defensive poisons that some plants produce in an attempt to prevent themselves from being eaten. Evidence for the detoxifying nature of clay came in 1999, from an experiment carried out on macaws by James Gilardi and his colleagues at the University of California, Davis. Macaws eat seeds containing alkaloids, a group of chemicals that has some notoriously toxic members, such as strychnine. In the wild,","the birds are frequently seen perched on eroding riverbanks eating clay. Dr Gilardi fed one group of macaws a mixture of a harmless alkaloid and clay, and a second group just the alkaloid. Several hours later, the macaws that had eaten the clay had 60% less alkaloid in their bloodstreams than those that had not, suggesting that the hypothesis is correct.","Other observations also support the idea that clay is detoxifying. Towards the tropics the amount of toxic compounds in plants increases—and so does the amount of earth eaten by herbivores. Elephants lick clay from mud holes all year round, except in September when they are bingeing on fruit which, because it has evolved to be eaten, is not toxic. And the addition of clay to the diets of domestic cattle increases the amount of nutrients that they can absorb from their food by 10-20%.","A third instance of animal self-medication is the use of mechanical scours to get rid of gut parasites. In 1972 Richard Wrangham, a researcher at the Gombe Stream Reserve in Tanzania, noticed that chimpanzees were eating the leaves of a tree called. Aspilia. The chimps chose the leaves carefully by testing them in their mouths. Having chosen a leaf, a chimp would fold it into a fan and swallow it. Some of the chimps were noticed wrinkling their noses as they swallowed these leaves, suggesting the experience was unpleasant. Later, undigested leaves were found on the forest floor.","Dr Wrangham rightly guessed that the leaves had a medicinal purpose—this was, indeed, one of the earliest interpretations of a behaviour pattern as self-medication. However, he guessed wrong about what the mechanism was. His (and everybody else's) assumption was that Aspilia contained a drug, and this sparked more than two decades of phytochemical research to try to find out what chemical the chimps were after. But by the 1990s, chimps across Africa had been seen swallowing the leaves of 19 different species that seemed to have few suitable chemicals in common. The drug hypothesis was looking more and more dubious.","Ht was Dr Huffman who got to the bottom of the problem. He did so by watching what came out of the chimps, rather than concentrating on what went in. He found that the egested leaves were full of intestinal worms. The factor common to all 19 species of leaves swallowed by the chimps was that they were covered with microscopic hooks. These caught the worms and dragged them from their lodgings.","Following that observation, Dr Engel is now particularly excited about how knowledge of the way that animals look after themselves could be used to improve the health of livestock. People might also be able to learn a thing or two—and may, indeed, already have done so. Geophagy, for example, is a common behaviour in many parts of the world. The medical stalls in African markets frequently sell tablets made of different sorts of clays, appropriate to different medical conditions.","Africans brought to the Americas as slaves continued this tradition, which gave their owners one more excuse to affect to despise them. Yet, as Dr Engel points out, Rwandan mountain gorillas eat a type of clay rather similar to kaolinite—the main ingredient of many patent medicines sold over the counter in the West for digestive complaints. Dirt can sometimes be good for you, and to be “as sick as a parrot” may, after all, be a state to be desired. FHL app FURIAC LIA ASHES ER HR BE BH. PORAT GS? HAMMETT? HSEWG? CHB), PSEA T eA 13? MUFHL, A— CER SE/E: ielts9.taobao.com)"],"questions":[{"n":1,"text":"It is for 10 years that Dr Engel has been working on animal self-medication.","answer":"TRUE","source":"Đoạn 1 (PDF trang 155)","evidence":"…For the past decade Dr Engel, a lecturer in environmental sciences at Britain’s Open 12 University, has been collating examples of self-medicating behavior in wild animals. 13 She recently published a book on the subject.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…For the past decade Dr Engel, a lecturer in environmental sciences at Britain’s Open 12 University, has been collating examples of self-medicating behavior in wild animals.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “It is for 10 years that Dr Engel has been working on animal self-medication.”\n- Passage: “…For the past decade Dr Engel, a lecturer in environmental sciences at Britain’s Open 12 University, has been collating examples of self-medicating behavior in wild animals.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"In order to find plants for medication, animals usually need to walk a long distance.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 155)","evidence":"19 Michael Huffman and Mohamedi Seifu, working in the Mahale 20 Mountains National Park in Tanzania, noticed that local 21 chimpanzees suffering from intestinal worms would dose | 22 | themselves with the pith of a plant called Veronia.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “19 Michael Huffman and Mohamedi Seifu, working in the Mahale 20 Mountains National Park in Tanzania, noticed that local 21 chimpanzees suffering from intestinal worms would dose | 22 | themselves with the pith of a plant called Veronia.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “animals usually need to walk a long distance” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “In order to find plants for medication, animals usually need to walk a long distance.”\n- Passage: “19 Michael Huffman and Mohamedi Seifu, working in the Mahale 20 Mountains National Park in Tanzania, noticed that local 21 chimpanzees suffering from intestinal worms would dose | 22 | themselves with the pith of a plant called Veronia.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":3,"text":"Birds such as Macaw, are seen eating clay because it is a part of their natural diet.","answer":"FALSE","source":"Đoạn 1 (PDF trang 155)","evidence":"…consume dirt—a behaviour known as geophagy. 34 Historically, the preferred explanation was that soil supplies minerals such as salt. But 35 geophagy occurs in areas where the earth is not a useful source of minerals, and also 36 in places where minerals can be more easily obtained from certain plants that are [37 known to be rich in them.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là quan hệ nguyên nhân - kết quả. Passage thực tế viết: “…consume dirt—a behaviour known as geophagy.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Birds such as Macaw, are seen eating clay because it is a part of their natural diet.”\n- Passage: “…consume dirt—a behaviour known as geophagy.”\n- Quan hệ nghĩa: đối lập ở quan hệ nguyên nhân - kết quả."},{"n":4,"text":"According to Dr Engel, it is exciting that research into animal self-medication can be helpful in the invention of new painkillers.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 156)","evidence":"…Dr Engel is now particularly excited about how knowledge of the way that animals look after themselves could be used to improve the health of livestock. People might also be able to learn a thing or two—and may, indeed, already have done so.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…Dr Engel is now particularly excited about how knowledge of the way that animals look after themselves could be used to improve the health of livestock.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “be helpful in the invention of new painkillers” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “According to Dr Engel, it is exciting that research into animal self-medication can be helpful in the invention of new painkillers.”\n- Passage: “…Dr Engel is now particularly excited about how knowledge of the way that animals look after themselves could be used to improve the health of livestock.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":32,"title":"The secret of the Yawn","passage":["A When a scientist began to study yawning in the 1980s, it was difficult to convince some of his research students of the merits of \"yawning science.\" Although it may appear quirky(i#i5?), his decision to study yawning was a logical extension to human beings of my research in developmental neuroscience, reported in such papers as \"Wing-flapping during Development and Evolution.\" As a neurobehavioral problem, there is not much difference between the wing-flapping of birds and the face- and body-flapping of human yawners.","B Yawning is an ancient, primitive act. Humans do it even before they are born, opening wide in the womb (f8) . Some snakes unhinge their jaws to do it, One species of penguins yawns as part of mating. Only now are researchers beginning to understand why we yawn, when we yawn and why we yawn back. A professor of cognitive neuroscience at Drexel University in Philadelphia, Steven Platek, studies the act of contagious yawning, something done only by people and other primates,","In his first experiment, he used a psychological test to rank people on their empathic (St##A 0%) feelings. He found that participants who did not score high on compassion did not yawn back. \"We literally had people saying, 'Why am I looking at people yawning?\" Professor Platek said. \"It just had no effect.\"","For his second experiment, he put 10 students in an magnetic resonance imaging machine as they watched video tapes of people yawning, When the students watched the videos, the part of the brain which reacted was the part scientists believe controls empathy - the posterior cingulate (4/2) ,in the brain's middle rear.\" I don't know if it's necessarily that nice people yawn more, but I think it's a good indicator of a state of mind,\" said Professor Platek. \"It's also a good indicator if you're empathizing with me and paying attention.\"","E His third experiment is studying yawning in those with brain disorders, such as autism and schizophrenia, in which victims have difficulty connecting emotionally with others. A psychology professor at the University of Maryland, Robert Provine, is one of the few other researchers into yawning. He found the basic yawn lasts about six seconds and they come in bouts with an interval of about 68 seconds. Men and women yawn or half-yawn equally often, but men are significantly less likely to cover their mouths which may indicate complex distinction in genders.\" A watched yawner never yawns,\" Professor Provine said. However, the physical root of yawning remains a mystery. Some researchers say it's coordinated within the hypothalamus( F fell) of the brain, the area that also controls breathing.","; Yawning and stretching also share properties and may be performed together as parts of a global motor complex, But they do not always co-occur— people usually yawn when we stretch, but we don't always stretch when we yawn, especially before bedtime. Studies by J. LP, G. H. A. Visser and H. F, Prechtl in the early 1980s, charting movement in the developing fetus using ultrasound, observed not just yawning but a link between yawning and stretching as early as the end of the first prenatal trimester (fii\"™) .","G The most extraordinary demonstration of the yawn-stretch linkage occurs in many people paralyzed on one side of their body because of brain damage caused by a stroke. The prominent British neurologist Sir Francis Walshe noted in 1923 that when these hemiplegics yawn, they are startled and mystified to observe that their otherwise paralyzed arm rises and flexes automatically in what neurologists term an “associated response.\" Yawning apparently activates","undamaged, unconsciously controlled connections between the brain and the cord motor system innervating the paralyzed (4# {> limb, It is not known whether the associated response is a positive prognosis for recovery, nor whether yawning is therapeutic for reinnervation (#345) or prevention of muscular atrophy.","H Clinical neurology offers other surprises. Some patients with \"locked-in\" syndrome, who are almost totally deprived of the ability to move voluntarily, can yawn normally. The neural circuits for spontaneous yawning must exist in the brain stem near other respiratory and vasomotor centers, because yawning, is performed by anencephalic (MiMi#2) who possess only the medulla oblongata (ff iit). The multiplicity of stimuli of contagious yawning, by contrast, implicates many Bian) 43.5 higher brain regions. redicting"],"questions":[{"n":38,"text":"Several students in Platek’s experiment did not comprehend why their tutor ask them to yawn back.","answer":"NOT GIVEN","source":"Đoạn B (PDF trang 159)","evidence":"A professor of cognitive neuroscience at Drexel University in Philadelphia, Steven Platek, studies the act of contagious yawning, something done only by people and other primates, In his first experiment, he used a psychological test to rank people on their empathic (St##A 0%) feelings.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “A professor of cognitive neuroscience at Drexel University in Philadelphia, Steven Platek, studies the act of contagious yawning, something done only by people and other primates, In his first experiment, he used a psychological test to…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “why their tutor ask them to yawn back” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Several students in Platek’s experiment did not comprehend why their tutor ask them to yawn back.”\n- Passage: “A professor of cognitive neuroscience at Drexel University in Philadelphia, Steven Platek, studies the act of contagious yawning, something done only by people and other primates, In his first experiment, he used a psychological test to…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":39,"text":"Some results from certain experiment indicate the link between yawning and compassion.","answer":"TRUE","source":"Đoạn D (PDF trang 160)","evidence":"…the part of the brain which reacted was the part scientists believe controls empathy - the posterior cingulate (4/2) ,in the brain's middle rear.\" I don't know if it's necessarily that nice people yawn more, but I think it's a good indicator of a state of mind,\" said Professor Platek.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…the part of the brain which reacted was the part scientists believe controls empathy - the posterior cingulate (4/2) ,in the brain's middle rear.\" I don't know if it's necessarily that nice people yawn more, but I think it's a good indi…”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Some results from certain experiment indicate the link between yawning and compassion.”\n- Passage: “…the part of the brain which reacted was the part scientists believe controls empathy - the posterior cingulate (4/2) ,in the brain's middle rear.\" I don't know if it's necessarily that nice people yawn more, but I think it's a good indi…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":40,"text":"Yawning can show an affirmative impact on the recovery from brain damage brought by a stroke.","answer":"FALSE","source":"Đoạn G (PDF trang 160)","evidence":"G The most extraordinary demonstration of the yawn-stretch linkage occurs in many people paralyzed on one side of their body because of brain damage caused by a stroke.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “G The most extraordinary demonstration of the yawn-stretch linkage occurs in many people paralyzed on one side of their body because of brain damage caused by a stroke.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Yawning can show an affirmative impact on the recovery from brain damage brought by a stroke.”\n- Passage: “G The most extraordinary demonstration of the yawn-stretch linkage occurs in many people paralyzed on one side of their body because of brain damage caused by a stroke.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."}]},{"id":33,"title":"Mungo Man","passage":["A Fifty thousand years ago, a lush landscape greeted the first Australians making their way towards the south-east of the continent, Temperatures were cooler than now, Megafauna — giant prehistoric animals such as marsupial lions, goannas and the rhinoceros-sized diprotodon — were abundant. The Lake Mungo remains are three prominent sets of fossils which tell the archeologists the story: Mungo Man lived around the shores of Lake Mungo with his family. When he was young Mungo Man lost his two lower canine teeth, possibly knocked out in a ritual. He grew into a man nearly 1.7m in height. Over the years his molar teeth became worn and scratched, possibly from eating a gritty diet or stripping the long leaves of water reeds with his teeth to make twine. As Mungo Man grew older his bones ached with arthritis, especially his right elbow, which was so damaged that bits of bone were completely worn out or broken away. Such wear and tear is typical of people who have used a woomera to throw spears over many years. Mungo Man reached a good age for the hard life of a hunter-gatherer, and died when he was about 50. His family mourned for him, and carefully buried him in the lunette, on his back with his hands crossed in his lap, and sprinkled with red ochre. Mungo Man is the oldest known example i in the world of such a ritual.","B This treasure-trove of history was found by the University of Melbourne geologist Professor Jim Bowler in 1969, He was searching for ancient lakes and came across the charred remains of Mungo Lady, who had been cremated (/k2*/'J). And in 1974, he found a second complete skeleton, Mungo Man, buried 300 metres away. Using carbon-dating, a technique only reliable to around 40,000 years old, the skeleton was first estimated at 28,000 to 32,000 years old. The comprehensive study of 25 different sediment layers at Mungo concludes that both graves are 40,000 years old.","F Ss SS tS","This is much younger than the 62,000 years Mungo Man was attributed with in 1999 by a team led by Professor Alan Thorne, of the Australian National University, The modern day story of the science of Mungo also has its fair share of rivalry. Because Thorne is the country’s leading opponent of the Out of Africa theory —that Homo sapiens had a single place of origin. “Dr Alan Thorne supports the multi-regional explanation (that modern humans arose simultaneously in Africa, Europe and Asia from one of our predecessors, Homo erectus, who left Africa more than 1.5 million years ago.) if Mungo Man was descended from a person who had left Africa in the past 200,000 years, Thorne argues, then his mitochondrial DNA should have looked like that of the other samples.”","However, Out of Africa supporters are not about to let go of their beliefs because of the Australian research, Professor Chris Stringer, from the Natural History Museum in London, UK, said that the research community would want to see the work repeated in other labs before major conclusions were drawn from the Australian research, But even assuming the DNA sequences were correct, Professor Stringer said it could just mean that there was much more genetic diversity in the past than was previously realised. There is no evidence here that the ancestry of these Australian fossils goes back a million or two million years. It's much more likely that modern humans came out of Africa.\" For Bowler, these debates are irritating speculative distractions from the study’s main findings. At 40,000 years old, Mungo Man and Mungo Lady remain Australia’s oldest human burials and the earliest evidence on Earth of cultural sophistication, he says. Modern humans had not even reached North America by this time. In 1997, Pddbo's research group recovered a mtDNA fingerprint from the Feldholer Neanderthal skeleton uncovered in Germany in 1865 - the first Neanderthal remains ever found.","In its 1999 study, Thorne’s team used three techniques to date Mungo Man at 62,000 years old, and it stands by its figures. It dated bone, teeth enamel and some sand. Bowler has strongly challenged the results ever since. Dating human bones is “notoriously unreliable”, he says. As well, the sand sample Thorne’s group dated was taken hundreds of metres from the burial site. “You don’t have to be a gravedigger ... to realize the age of the sand is not the same as the age of the grave,” says Bowler.","F Thorne counters that Bowler’s team used one dating technique, while his used three. Best practice is to have at least two methods produce the same ion tule result.","A Thorne team member, Professor Rainer Griin, says —— the fact that the latest results were consistent between iPhone laboratories doesn’t mean they are absolutely correct. We \"¢ pa now have two data sets that are contradictory. I do not have","a plausible explanation.” Now, however, Thorne says the age of Mungo Man is irrelevant to this origins debate. Recent fossils finds show modern humans were in China 110,000 years ago. “So he has got a long time to turn up in Australia. It doesn’t matter if he is 40,000 or 60,000 years old.","G Dr Tim Flannery, a proponent of the controversial theory that Australia’s megafauna was wiped out 46,000 years ago in a “blitzkrieg” of hunting by the arriving people, also claims the new Mungo dates support this view. In 2001 a member of Bowler’s team, Dr Richard Roberts of Wollongong University, along with Flannery, director of the South Australian Museum, published research on their blitzkrieg theory. They dated sites across the continent, arguing their analysis showed the megafauna died out suddenly 46,000 years ago. Flannery praises the Bowler team’s research on Mungo Man as “the most thorough and rigorous dating” of ancient human remains. He says the finding that humans arrived at Lake Mungo between 46,000 and 50,000 years ago was a critical time in Australia’s history. There is no evidence of a dramatic climatic change then, he says. “It's my view that humans arrived and extinction took place in almost the same geological instant.”","G GL","H Bowler, however, is skeptical of Flannery’s theory and says the Mungo study provides no definitive new evidence to support it. He argues that climate change at 40,000 years ago was more intense than had been previously realized and could have played a role in the megafauna’s demise. “To blame the earliest Australians for their complete extinction is along bow.” rid at TK x a ri id By x Ne ‘mt & Ss pr & Pal"],"questions":[{"n":9,"text":"The Lake Mungo remains offer the archeologists the evidence of graphic illustration of human activities around.","answer":"TRUE","source":"Đoạn 1 (PDF trang 163)","evidence":"…Mungo Man A Fifty thousand years ago, a lush landscape greeted the first Australians making their way towards the south-east of the continent, Temperatures were cooler than now, Megafauna — giant prehistoric animals such as marsupial lions, goannas and the rhinoceros-sized diprotodon — were abundant.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Mungo Man A Fifty thousand years ago, a lush landscape greeted the first Australians making their way towards the south-east of the continent, Temperatures were cooler than now, Megafauna — giant prehistoric animals such as marsupial li…”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The Lake Mungo remains offer the archeologists the evidence of graphic illustration of human activities around.”\n- Passage: “…Mungo Man A Fifty thousand years ago, a lush landscape greeted the first Australians making their way towards the south-east of the continent, Temperatures were cooler than now, Megafauna — giant prehistoric animals such as marsupial li…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":10,"text":"In Lake Mungo remains, weapons were found used by the Mungo.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 163)","evidence":"The Lake Mungo remains are three prominent sets of fossils which tell the archeologists the story: Mungo Man lived around the shores of Lake Mungo with his family.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The Lake Mungo remains are three prominent sets of fossils which tell the archeologists the story: Mungo Man lived around the shores of Lake Mungo with his family.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “remains, weapons were found used by the Mungo” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “In Lake Mungo remains, weapons were found used by the Mungo.”\n- Passage: “The Lake Mungo remains are three prominent sets of fossils which tell the archeologists the story: Mungo Man lived around the shores of Lake Mungo with his family.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":11,"text":"Mungo Man is one of the oldest known archaeological evidence in the world of cultural sophistication such as a burying ritual.","answer":"TRUE","source":"Đoạn 2 (PDF trang 164)","evidence":"At 40,000 years old, Mungo Man and Mungo Lady remain Australia’s oldest human burials and the earliest evidence on Earth of cultural sophistication, he says.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “At 40,000 years old, Mungo Man and Mungo Lady remain Australia’s oldest human burials and the earliest evidence on Earth of cultural sophistication, he says.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Mungo Man is one of the oldest known archaeological evidence in the world of cultural sophistication such as a burying ritual.”\n- Passage: “At 40,000 years old, Mungo Man and Mungo Lady remain Australia’s oldest human burials and the earliest evidence on Earth of cultural sophistication, he says.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":12,"text":"Mungo man and woman’s skeletons were uncovered in the same year.","answer":"FALSE","source":"Đoạn 2 (PDF trang 164)","evidence":"In 1997, Pddbo's research group recovered a mtDNA fingerprint from the Feldholer Neanderthal skeleton uncovered in Germany in 1865 - the first Neanderthal remains ever found. In its 1999 study, Thorne’s team used three techniques to date Mungo Man at 62,000 years old, and it stands by its figures.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “In 1997, Pddbo's research group recovered a mtDNA fingerprint from the Feldholer Neanderthal skeleton uncovered in Germany in 1865 - the first Neanderthal remains ever found.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Mungo man and woman’s skeletons were uncovered in the same year.”\n- Passage: “In 1997, Pddbo's research group recovered a mtDNA fingerprint from the Feldholer Neanderthal skeleton uncovered in Germany in 1865 - the first Neanderthal remains ever found.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":13,"text":"There is controversy among Scientists about the origin of the oldest Homo sapiens.","answer":"TRUE","source":"Đoạn 2 (PDF trang 164)","evidence":"Because Thorne is the country’s leading opponent of the Out of Africa theory —that Homo sapiens had a single place of origin.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Because Thorne is the country’s leading opponent of the Out of Africa theory —that Homo sapiens had a single place of origin.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “There is controversy among Scientists about the origin of the oldest Homo sapiens.”\n- Passage: “Because Thorne is the country’s leading opponent of the Out of Africa theory —that Homo sapiens had a single place of origin.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":14,"text":"Out of Africa supporters have criticised Australian professors for using outmoded research method.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 164)","evidence":"Dr Alan Thorne supports the multi-regional explanation (that modern humans arose simultaneously in Africa, Europe and Asia from one of our predecessors, Homo erectus, who left Africa more than 1.5 million years ago.) if Mungo Man was descended from a person who had left Africa in the past 200,000 years, Thorne argues, then his mitochondrial DNA should have looked like that of the other samples.” However, Out of Africa supporters are not about to let go of their beliefs because of the Australian research, Professor Chris Stringer, from the Natural History Museum in London, UK, said that the research community would want to see the work repeated in other labs before major conclusions were draw…","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: ““Dr Alan Thorne supports the multi-regional explanation (that modern humans arose simultaneously in Africa, Europe and Asia from one of our predecessors, Homo erectus, who left Africa more than 1.5 million years ago.) if Mungo Man was de…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “criticised Australian professors for using outmoded research method” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Out of Africa supporters have criticised Australian professors for using outmoded research method.”\n- Passage: ““Dr Alan Thorne supports the multi-regional explanation (that modern humans arose simultaneously in Africa, Europe and Asia from one of our predecessors, Homo erectus, who left Africa more than 1.5 million years ago.) if Mungo Man was de…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":34,"title":"Alfred Nobel – The man behind the Nobel Prize","passage":["A Since 1901, the Nobel Prize has been honoring men and women from all corners of the globe for outstanding achievements in physics, chemistry, medicine, literature, and for work in peace. The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize.","B Alfred Nobel was born in Stockholm on October 21, 1833. His father Immanuel Nobel was an engineer and inventor who built bridges and buildings in Stockholm, In connection with his construction work Immanuel Nobel also experimented with different techniques for blasting rocks. Successful in his industrial and business AR inxs 43.5 ce ventures, Immanuel Nobel was able, in 1842, to bring his class education by private teachers, The training included","natural sciences, languages and literature. By the age of 17 Alfred Nobel was fluent in Swedish, Russian, French, English and German. His primary interests were in English literature and poetry as well as in chemistry and physics. Alfred's father. who wanted his sons to join his enterprise as engineers, disliked Alfred's interest in poetry and found his son rather introverted,","ee In order to widen Alfred’s horizons his father sent him abroad for further training in chemical engineering. During a two year period Alfred Nobel visited Sweden, Germany, France and the United States. In Paris, the city he came to like best, he worked in the private laboratory of Professor T, J. Pelouze, a famous chemist. There he met the young Italian chemist Ascanio Sebrero who, three years earlier, had invented nitroglycerine, a highly explosive liquid. But it was considered too dangerous to be of Elk bi any practical use. Although its explosive power greatly exceeded that * : = of gunpowder, the liquid would explode in a very unpredictable : manner if subjected to heat and pressure, Alfred Nobel became very interested in nitroglycerine and how it could be put to practical use in construction work. He also realized that the safety problems had to be solved and a method had to be developed for the controlled detonation of nitroglycerine.","D After his return to Sweden in 1863, Alfred Nobel concentrated on developing nitroglycerine as an explosive. Several explosions, including one (1864) in which his brother Kmil and several other persons were killed, convinced the authorities that nitroglycerine production was exceedingly dangerous. They Bay Sor forbade further experimentation with nitroglycerine within the redicting Stockholm city limits and Alfred Nobel had to move his Emergency? experimentation to a barge anchored on Lake Malaren. Alfred oe oes was not discouraged and in 1864 he was able to start mass SMARTER production of nitroglycerine. To make the handling of nitroglycerine safer Alfred Nobel experimented with different additives. He soon found that mixing nitroglycerine with kieselguhr would tum the liquid into a paste which could be shaped into rods of a size and form suitable for insertion into drilling holes. In 1867 he patented this material under the name of dynamite. To be able to detonate the dynamite rods he also invented a detonator (blasting cap) which could be ignited by lighting a fuse. These inventions were made at the same time as the pneumatic dill came into gencral use. Together these inventions drastically reduced the cost of blasting rock, drilling tunnels, building canals and | many other forms of construction work, Fx ccessestcniesisasemasmansieoniaes posi sovoniebesaloninelmresshesisnlaieiaincianneaeeanerbitmapesinerate a","E The market for dynamite and detonating caps grew very rapidly and Alfred Nobel also","proved himself to be a very skillful entrepreneur and businessman. Over the years he founded factories and laboratories in some 90 different places in more than 20 countries. Although he lived in Paris much of his life he was constantly traveling. When he was not traveling or engaging in business activities Nobel himself worked intensively in his various laboratories, first in Stockholm and later in other places. He focused on the development of explosives technology as well as other chemical inventions, including such materials as synthetic rubber and leather, artificial silk, ete. By the time of his death in 18% he had 355 patents,","F Intensive work and travel did not leave much time for a private life. At the age of 43 he was feeling like an old man. At this time he advertised in a newspaper “Wealthy, highly-educated elder gentleman seeks lady of mature age, versed in languages, as secretary and supervisor of houschold.” The 4 most qualified applicant tumed out to be an Austrian woman, Countess Bertha Kinsky. Afier working a very short time for Nobel she decided to retum to Austria to marry Count Arthur von Suttner. In spite of this Alfred Nobel and Bertha von Suttner remained friends and kept","writing letters to each other for decades, Over the years Bertha von Suttner became increasingly critical of the arms race. She wrote a famous book, Lay Down Your Arms and became a prominent figure in the peace movement. No doubt this influenced Alfred Nobel when he wrote his final will which was to include a Prize for persons or organizations who promoted peace. Several years after the death of Alfred Nobel, the Norwegian Storting (Parliament) decided to award the 1905 Nobel Peace Prize to Bertha von Suttner. £4: HPA app, ba) FRAMRMA RF AM hep://wwwiyucecom (RMA)","Alfred Nobel died in San Remo, Italy, on December 10, 1896. When his will was opened it came as a surprise that his fortune was to be used for Prizes in Physics, Chemistry, Physiology or Medicine, Literature and Peace. The executors of his will were two young engineers, Ragnar Sohlman and Rudolf Lilljequist. They set about forming the Nobel Foundation as an organization to take care of the financial assets left by Nobel for this purpose and to coordinate the work of the Prize-Awarding Institutions, This was not without its difficulties since the will was contested by relatives and questioned by authorities in various countries. Alfred Nobel's greatness lay in his ability to combine the penetrating mind of the scientist and inventor with the forward-looking dynamism of the industrialist. Nobel was very interested in social and peace-related issues and held what were considered radical views in his cra. He had a great KR ux) 45. ‘ay interest in literature and wrote his own poetry and dramatic works. The Nobel Prizes became an extension d a fulfillment of his lifetime interests,"],"questions":[{"n":1,"text":"The first Nobel Prize was awarded in 1895.","answer":"FALSE","source":"Đoạn 1 (PDF trang 167)","evidence":"The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The first Nobel Prize was awarded in 1895.”\n- Passage: “The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":2,"text":"Nobel’s father wanted his son to have better education than what he had had.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF tran ssage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…Successful in his industrial and business A ix) 4¥.5 4° ventures, Immanuel Nobel was able, in 1842, to bring his predicting family to St.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Nobel was an unsuccessful businessman.”\n- Passage: “…Successful in his industrial and business A ix) 4¥.5 4° ventures, Immanuel Nobel was able, in 1842, to bring his predicting family to St.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":4,"text":"Bertha von Suttner was selected by Nobel himself for the first peace prize.","answer":"FALSE","source":"Đoạn 1 (PDF trang 167)","evidence":"…peace. The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize. Alfred Nobel was born in Stockholm on October 21, 1833.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…peace.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Bertha von Suttner was selected by Nobel himself for the first peace prize.”\n- Passage: “…peace.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":5,"text":"The Nobel Foundation was established after the death of Nobel.","answer":"TRUE","source":"Đoạn 1 (PDF trang 167)","evidence":"The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize. Alfred Nobel was born in Stockholm on October 21, 1833.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The Nobel Foundation was established after the death of Nobel.”\n- Passage: “The foundations for the prize were laid in 1895 when Alfred Nobel wrote his last will, leaving much of his wealth to the establishment of the Nobel Prize.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":6,"text":"Nobel’s social involvement was uncommon in the 1800’s.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 167)","evidence":"FEBWXAM Version 36300 Alfred Nobel The maw behind the Nobel Prize Since 1901, the Nobel Prize has been honoring men and women from all corners of the globe for outstanding achievements in physics, chemistry, medicine, literature, and for work in peace.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “FEBWXAM Version 36300 Alfred Nobel The maw behind the Nobel Prize Since 1901, the Nobel Prize has been honoring men and women from all corners of the globe for outstanding achievements in physics, chemistry, medicine, literature, and for…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Nobel’s social involvement was uncommon in the 1800’s” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Nobel’s social involvement was uncommon in the 1800’s.”\n- Passage: “FEBWXAM Version 36300 Alfred Nobel The maw behind the Nobel Prize Since 1901, the Nobel Prize has been honoring men and women from all corners of the globe for outstanding achievements in physics, chemistry, medicine, literature, and for…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":35,"title":"Thomas Young – The Last True Know-It-All","passage":["A Thomas Young (1773-1829) contributed “articles to the Encyclopedia Britannica, KR including 46 biographical entries (mostly on ifUGRy 4.5 + on “Bridge,” \"Chromatics,\" “Egypt,”","“Languages” and \"Tides\". Was someone who could write authoritatively about so many subjects a polymath, a genius or a dilettante? In an ambitious new biography, Andrew Robinson argues that Young is a good contender for the epitaph “the last man who knew everything.” Young has competition, however: The phrase, which Robinson takes for his title, also serves as the subtitle of two other recent biographies: Leonard Warren's 1998 life of paleontologist Joseph Leidy (1823-1891) and Paula Findlen’s 2004 book on Athanasius Kircher (1602-1680), another polymath.","B Young, of course, did more than write Accommodation of the Human Eye encyclopedia entries. He presented his first eet paper to the Royal Society of London at the age ewes of 20 and was elected a Fellow a week after his y+ Comes 21st birthday. In the paper, Young explained the process of accommodation in the human eye -- @“*** on how the eye focuses properly on objects at b] varying distances, Young hypothesized that this Sets was achieved by changes in the shape of the e","lens, Young also theorized that light traveled in Figure waves and he believed that, to account for the ability to see in color, there must be three receptors in the eye corresponding to the three \"principal colors\" to which the retina could respond: red, green, violet. All these hypothesis were subsequently proved to be correct. ECE Later in his life, when he was in his forties, Young was instrumental in cracking “the code that unlocked the unknown script on the Rosetta Stone, a tablet that was","\"found\" in Egypt by the Napoleonic army in 1799. The stone contains text in three alphabets: Greek, something unrecognizable and Egyptian hieroglyphs. The unrecognizable script is now known as demotic and, as Young deduced, is related directly to hieroglyphic, His initial work on this appeared in his Britannica entry on Egypt. In another entry, he coined the term Indo-European to describe the family of languages spoken throughout most of Europe and northern India. These are the landmark achievements of a man who was a child prodigy and who, unlike many remarkable children, did not disappear into oblivion as an adult, (test","Bom in 1773 in Somerset in England, Young lived from an early age with his maternal grandfather, eventually leaving to attend boarding school, He had devoured books from the age of two, and through his own initiative he excelled at Latin, Greek, mathematics and natural philosophy. After leaving school, he was greatly encouraged by his mother's uncle, Richard Brocklesby, a physician and Fellow of the Royal Society, Following Brocklesby's lead, Young decided to pursue a career in medicine. He studied in London, following the medical circuit, and then moved on to more formal education in Edinburgh, Gottingen and Cambridge. After completing his medical training at the University of Cambridge in 1808, Young set up practice as a physician in London. He soon became a Fellow of the Royal College of Physicians and a few years later was appointed physician at St. George's Hospital.","Young's skill as a physician, however, did not equal his skill Ge | as a scholar of natural philosophy or linguistics. Earlier, in t 1801, he had been appointed to a professorship of natural philosophy at the Royal Institution, where he delivered as many as 60 lectures in a year. These were published in two volumes in 1807. In 1804 Young had become secretary to the Royal Society, a post he would hold until his death. His opinions were sought on civic and national matters, such as the introduction of gas lighting to London and methods of ship construction. From 1819 he was superintendent of the Nautical Almanac and sceretary to the Board of Longitude. From 1824 to 1829 he was physician to and inspector of calculations for the Palladian Insurance Company. Between 1816 and 1825 he contributed his many and various entries to the Encyclopedia Britannica, and throughout his career he authored numerous books, essays and papers. Young is a perfect subject for a biography — perfect, but daunting. Few men contributed so much to so many technical fields. Robinson’s aim is to introduce non-scientists to Young's work and life. He succeeds, providing clear expositions","of the technical material (especially that on optics and Egyptian hieroglyphs). Some readers of this book will, like Robinson, find Young’s accomplishments impressive; others will see him as some historians have — as a dilettante. Yet despite the rich material presented in this book, readers will not end up knowing Young personally. We catch glimpses of a playful Young, doodling Greek and Latin phrases in his notes on medical lectures and translating the verses that a young lady had written on the walls of a summerhouse into Greek clegiacs, Young was introduced into elite society, attended the theatre and learned to dance and play the flute, In addition, he was an accomplished horseman. However, his personal life looks pale next to his vibrant career and studies.","Young married Eliza Maxwell in 1804, and according to Robinson, “their marriage was a happy one and she appreciated his work.\" Almost all we know about her is that she sustained her husband through some rancorous disputes about optics and that she worried about money when his medical career was slow to take off. Very little evidence survives about the complexities of Young's relationships with his mother and father. Robinson docs not credit them, or anyone else, with shaping Young’s extraordinary mind. Despite the lack of details concerning Young’s relationships, however, anyone interested in what it means to be a genius should read this book."],"questions":[{"n":1,"text":"“The last man who knew everything” has also been claimed to other people.","answer":"TRUE","source":"Đoạn 1 (PDF trang 171)","evidence":"…Young has competition, however: The phrase, which Robinson takes for his title, also serves as the subtitle of two other recent biographies: Leonard Warren's 1998 life of paleontologist Joseph Leidy (1823-1891) and Paula Findlen’s 2004 book on Athanasius Kircher (1602-1680), another polymath.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Young has competition, however: The phrase, which Robinson takes for his title, also serves as the subtitle of two other recent biographies: Leonard Warren's 1998 life of paleontologist Joseph Leidy (1823-1891) and Paula Findlen’s 2004…”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: ““The last man who knew everything” has also been claimed to other people.”\n- Passage: “…Young has competition, however: The phrase, which Robinson takes for his title, also serves as the subtitle of two other recent biographies: Leonard Warren's 1998 life of paleontologist Joseph Leidy (1823-1891) and Paula Findlen’s 2004…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"All Young’s articles were published in Encyclopedia Britannica.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 171)","evidence":"BALA Version 36301 Thomas Young The Last True Know-It+-AW A Thomas Young (1773-1829) contributed 63 “articles to the Encyclopedia Britannica, KR including 46 biographical entries (mostly on ifUGRy 4.5 + scientists and classicists) and substantial essays predicting on “Bridge,” \"Chromatics,\" “Egypt,” “Languages” and \"Tides\".","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “BALA Version 36301 Thomas Young The Last True Know-It+-AW A Thomas Young (1773-1829) contributed 63 “articles to the Encyclopedia Britannica, KR including 46 biographical entries (mostly on ifUGRy 4.5 + scientists and classicists) and su…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “All Young’s articles were published in Encyclopedia Britannica” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “All Young’s articles were published in Encyclopedia Britannica.”\n- Passage: “BALA Version 36301 Thomas Young The Last True Know-It+-AW A Thomas Young (1773-1829) contributed 63 “articles to the Encyclopedia Britannica, KR including 46 biographical entries (mostly on ifUGRy 4.5 + scientists and classicists) and su…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":3,"text":"Like others, Young wasn’t so brilliant when grew up.","answer":"FALSE","source":"Đoạn 3 (PDF trang 173)","evidence":"Some readers of this book will, l  định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Young’s talents as a doctor surpassed his other skills.”\n- Passage: “…Young's skill as a physician, however, did not equal his skill Ge | as a scholar of natural philosophy or linguistics.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":5,"text":"Young’s advice was sought by people responsible for local and national issues.","answer":"TRUE","source":"Đoạn 2 (PDF trang 172)","evidence":"…His opinions were sought on civic and national matters, such as the introduction of gas lighting to London and methods of ship construction. From 1819 he was superintendent of the Nautical Almanac and sceretary to the Board of Longitude.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…His opinions were sought on civic and national matters, such as the introduction of gas lighting to London and methods of ship construction.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Young’s advice was sought by people responsible for local and national issues.”\n- Passage: “…His opinions were sought on civic and national matters, such as the introduction of gas lighting to London and methods of ship construction.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":6,"text":"Young was interested in various social pastimes.","answer":"TRUE","source":"Đoạn 3 (PDF trang 173)","evidence":"Despite the lack of details concerning Young’s relationships, however, anyone interested in what it means to be a genius should read this book.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Despite the lack of details concerning Young’s relationships, however, anyone interested in what it means to be a genius should read this book.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Young was interested in various social pastimes.”\n- Passage: “Despite the lack of details concerning Young’s relationships, however, anyone interested in what it means to be a genius should read this book.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":7,"text":"Young suffered from a disease in his later years.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 172)","evidence":"He soon became a Fellow of the Royal College of Physicians and a few years later was appointed physician at St.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “He soon became a Fellow of the Royal College of Physicians and a few years later was appointed physician at St.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “suffered from a disease in his later years” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Young suffered from a disease in his later years.”\n- Passage: “He soon became a Fellow of the Royal College of Physicians and a few years later was appointed physician at St.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":36,"title":"Coral reefs","passage":["Coral reefs are underwater structures made from calcium carbonate secreted by corals, Coral reefs are colonies of tiny living animals found in marine waters that contain few nutrients. Most coral reefs are built from stony corals, which in turn consist of polyps that cluster in groups.","A Coral reefs are estimated to cover 284,300 km2 just under 0.1% of the oceans' surface area, about half the area of France. The Indo-Pacific region accounts for 91.9% of this total area. Southeast Asia accounts for 32.3% of that figure, while the Pacific including Australia accounts for 40.8%. Atlantic and Caribbean coral reefs account for 7.6%. Yet often called “rainforests of the sea”, coral reefs form some of the most diverse ecosystems on Earth. They provide a home for 25% of all marine species, including fish, mollusks (31%), worms, crustaceans (7¢2s)%), echinoderms (#454 $y), sponges, tunicates and other cnidarians. Paradoxically, coral reefs flourish even though they are surrounded by ocean waters that provide few nutrients. They are most commonly found at shallow depths in tropical waters, but deep water and cold water corals also exist on smaller scales in other areas, Although corals exist both in temperate and tropical waters, shallow-water reefs form only in a zone extending from 30° N to 30° S of the equator.","Deep water coral can exist at greater depths and colder temperatures at much higher latitudes, as far north as Norway. Coral reefs are rare along the American and African west coasts. This is due primarily to upwelling and strong cold coastal currents that reduce water temperatures in these areas (respectively the Peru, Benguela and Canary streams). Corals are seldom found along the coastline of South Asia from the eastern tip of India (Madras) to the Bangladesh (ild/\") and Myanmar borders. They are also rare along the coast around northeastern South America and Bangladesh due to the freshwater release from the Amazon and Ganges Rivers (tfi#J) , respectively. FBIM Sah fie TERR eee Io AAR ASR oC RE RR","Coral reefs deliver ecosystem services to tourism, fisheries and coastline protection. The global economic value of coral reefs has been estimated at as much as $US375 billion per year. Coral reefs protect shorelines by absorbing wave energy (i###fE) , and many small islands would not exist without their reef to protect them.","The value of reefs in biodiverse (‘£4)##*H) regions can be even higher. In parts of Indonesia and the Caribbean where tourism is the main use, reefs are estimated to be worth US$1 million per square kilometer, based on the cost of maintaining sandy beaches and the value of attracting snorkelers (i7i## and scuba divers (ki#i# 7). Meanwhile, a recent study of the Great Barrier Reef in Australia found that the reef is worth more to the country as an intact ecosystem than an extractive reserve for fishing. Each year more than 1.8 million tourists visit the reef, spending an estimated AU$4.3 billion (Australian dollars) on reef-related industries from diving to boat rental to posh island resort stays. In the Caribbean, says UNEP, the net annual benefits from diver tourism was US$2 billion in 2000 with US$625 million spent directly on diving on reefs. Further, reef tourism is important source of employment, especially for some of the world's poorest people.","UNEP says that of the estimated 30 million small-scale fishers in the developing world, most are dependent to a greater or lesser extent on coral reefs. In the Philippines, for example, more than one million small-scale fishers depend directly on coral reefs for their livelihoods. The report estimates that reef fisheries (#4) were worth between $15,000 and $150,000 per square kilometer a year, while fish caught for aquariums (Ki) were worth $500 a kilogram against $6 for fish caught as food. The aquarium fish export industry supports around 50,000 people and generates some US$5.5 million a year in Sri Lanka along.","Unfortunately, coral reefs are dying around the world. In particular, coral mining, agricultural and urban runoff (fk) , pollution (organic and inorganic), disease, and the digging of canals and access into islands and bays are localized threats to coral ecosystems (‘E25 #4) . Broader threats are sea temperature rise, sea level rise and pH _ changes from ocean acidification (A&{L) , all associated with greenhouse gas emissions. Some current fishing practices are destructive and unsustainable. These include cyanide fishing, overfishing and _ blast fishing. Although cyanide ((f\\{¢47#8) fishing supplies live reef fish for the tropical aquarium market, most fish caught using this method are sold in","restaurants, primarily in Asia, where live fish are prized for their freshness. To catch fish with cyanide, fishers dive down to the reef and squirt cyanide in coral crevices and on the fast-moving fish, to stun the fish making them easy to catch. Overfishing is another leading cause for coral reef degradation. Often, too many fish are taken from one reef to sustain a population in that area. Poor fishing practices, such as banging on the reef with sticks (muro-ami), destroy coral formations that normally function as fish habitat. In some instances, people fish with explosives (# %©%) (blast fishing), which blast apart the surrounding coral.","Tourist resorts that empty their sewage directly into the water surrounding coral reefs contribute to coral reef degradation. Wastes kept in poorly maintained septic tanks can also leak into surrounding ground water, eventually seeping out to the reefs. Careless boating, diving, snorkeling and fishing can also damage coral reefs, Whenever people grab, kick, and walk on, or stir up sediment ( ) in the reefs, they contribute to coral reef destruction. Corals are also harmed or killed when people drop anchors on them or when people collect coral.","To find answers for these problems, scientists and researchers study the various factors that impact reefs. The list includes the ocean's role as a carbon dioxide sink, atmospheric changes, ultraviolet light (M8896) , ocean acidification, viruses, impacts of dust storms carrying agents to far flung reefs, pollutants, algal blooms and others. Reefs are threatened well beyond coastal areas. General estimates show approximately 10% of the worlds coral reefs are dead. About 60% of the world’s reefs are at risk due to destructive, human-related activities. The threat to the health of reefs is particularly strong in Southeast Asia, where 80% of reefs are endangered.","In Australia, the Great Barrier Reef (X##®) is protected by the Great Barrier Reef Marine Park Authority, and is the subject of much legislation, including a biodiversity action plan. Inhabitants of Ahus Island, Manus Province, Papua New Guinea, have followed a generations-old practice of restricting fishing in six areas of their reef lagoon (itil) . Their cultural traditions allow line fishing, but not net or spear fishing. The result is both the biomass and individual fish sizes are significantly larger than in places where fishing is unrestricted."],"questions":[{"n":20,"text":"Coral reefs provide habitat to variety of marine life.","answer":"TRUE","source":"Đoạn 2 (PDF trang 175)","evidence":"…They provide a home for 25% of all marine species, including fish, mollusks (31%), worms, crustaceans (7¢2s)%), echinoderms (#454 $y), sponges, tunicates and other cnidarians. Paradoxically, coral reefs flourish even though they are surrounded by ocean waters that provide few nutrients.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…They provide a home for 25% of all marine species, including fish, mollusks (31%), worms, crustaceans (7¢2s)%), echinoderms (#454 $y), sponges, tunicates and other cnidarians.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Coral reefs provide habitat to variety of marine life.”\n- Passage: “…They provide a home for 25% of all marine species, including fish, mollusks (31%), worms, crustaceans (7¢2s)%), echinoderms (#454 $y), sponges, tunicates and other cnidarians.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":21,"text":"Coral reef distribute around the ocean disproportionally.","answer":"TRUE","source":"Đoạn 1 (PDF trang 175)","evidence":"HEBMIEAG Version 36302 Coral reefs are underwater structures made from calcium carbonate secreted by corals, Coral reefs are colonies of tiny living animals found in marine waters that contain few nutrients. Most coral reefs are built from stony corals, which in turn consist of polyps that cluster in groups. & Coral reefs A Coral reefs are estimated to cover 284,300 km2 just under 0.1% of the oceans' surface area, about half the area of France.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “HEBMIEAG Version 36302 Coral reefs are underwater structures made from calcium carbonate secreted by corals, Coral reefs are colonies of tiny living animals found in marine waters that contain few nutrients.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Coral reef distribute around the ocean disproportionally.”\n- Passage: “HEBMIEAG Version 36302 Coral reefs are underwater structures made from calcium carbonate secreted by corals, Coral reefs are colonies of tiny living animals found in marine waters that contain few nutrients.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":22,"text":"Coral reef is increasingly important for scientific purpose.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 177)","evidence":"…scientists and researchers study the various factors that impact reefs. The list includes the ocean's role as a carbon dioxide sink, atmospheric changes, ultraviolet light (M8896) , ocean acidification, viruses, impacts of dust storms carrying agents to far flung reefs, pollutants, algal blooms and others.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…scientists and researchers study the various factors that impact reefs.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Coral reef is increasingly important for scientific purpose” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Coral reef is increasingly important for scientific purpose.”\n- Passage: “…scientists and researchers study the various factors that impact reefs.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":23,"text":"Coral reefs are greatly exchanged among and exported to other countries.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 176)","evidence":"…aquarium fish export industry supports around 50,000 people and generates some US$5.5 million a year in Sri Lanka along. Unfortunately, coral reefs are dying around the world. In particular, coral mining, agricultural and urban runoff (fk) , pollution (organic and inorganic), disease, and the digging of canals and access into islands and bays are localized threats to coral ecosystems (‘E25 #4) .","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…aquarium fish export industry supports around 50,000 people and generates some US$5.5 million a year in Sri Lanka along.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “greatly exchanged among and exported to other countries” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Coral reefs are greatly exchanged among and exported to other countries.”\n- Passage: “…aquarium fish export industry supports around 50,000 people and generates some US$5.5 million a year in Sri Lanka along.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":24,"text":"Reef tourism is of economic essence generally for some poor people.","answer":"TRUE","source":"Đoạn 3 (PDF trang 176)","evidence":"Further, reef tourism is important source of employment, especially for some of the world's poorest people.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Further, reef tourism is important source of employment, especially for some of the world's poorest people.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Reef tourism is of economic essence generally for some poor people.”\n- Passage: “Further, reef tourism is important source of employment, especially for some of the world's poorest people.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":25,"text":"As with other fishing business
