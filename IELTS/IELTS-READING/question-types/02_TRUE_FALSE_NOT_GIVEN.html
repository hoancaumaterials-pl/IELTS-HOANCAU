, coral fishery is not suitable to women and children.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 176)","evidence":"These include cyanide fishing, overfishing and _ blast fishing. Although cyanide ((f\\{¢47#8) fishing supplies live reef fish for the tropical aquarium market, most fish caught using this method are sold in me: es: restaurants, primarily in Asia, where live fish are prized for their freshness. To catch fish with cyanide, fishers dive down to the reef and squirt cyanide in coral crevices and on the fast-moving fish, to stun the fish making them easy to catch.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “These include cyanide fishing, overfishing and _ blast fishing.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “fishery is not suitable to women and children” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “As with other fishing business, coral fishery is not suitable to women and children.”\n- Passage: “These include cyanide fishing, overfishing and _ blast fishing.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":37,"title":"Novice and Expert – Becoming an Expert","passage":["Expertise is commitment coupled with creativity. Specifically, it is the commitment of time, energy, and resources to a relatively narrow field —_ of study and the creative energy necessary to generate new knowledge in that ficld. It takes a considerable amount of time and regular exposure to a large number of cases to become an expert.","A An individual enters a field of study as a novice. The novice needs to learn the guiding principles and rules of a given task in order to perform that task, Concurrently, the novice needs to be exposed to specific cases, or instances, that test the boundaries of such heuristic (ERK). Generally, a novice will find a mentor to guide her through the process. A fairly simple example would be someone learning to play chess, The novice chess player secks a mentor to teach her the object of the game, the number of spaces, the names of the pieces, the function of each piece, how each piece is moved, and the necessary conditions for winning or losing the game.","B In time, and with much practice, the novice begins to recognize pattems of behavior within cases and, thus, becomes a journeyman. With more practice and exposure to increasingly complex cases, the journeyman finds patterns not only within cases but also between cases. More importantly, the journeyman learns that these patterns often repeat themselves over time, The journeyman still maintains regular contact with a mentor to solve specific problems and Icam more complex strategics. Returning to the example of the chess player, the individual begins to leam pattems of opening moves, offensive and defensive game-playing strategies, and patterns of victory and defeat. Cc When a journeyman starts to make and test |\\ypotheses (nM. {Fi5E) about future behavior “based on past experiences, she begins the next transition. Once she creatively generates knowledge, rather than simply matching superficial patterns, she becomes an expert. Bik) 4%. + At this point, she is confident in her redicting knowledge and no longer needs a mentor as a guide—she becomes responsible for her own knowledge. In the chess example, once a journeyman begins competing against experts, makes predictions based on patterns, and tests those predictions against actual behavior, she is generating new knowledge and a deeper understanding of the game. She is creating her own cases rather than relying on the cases of others.","D An expert (v.32 4%. VK) meaningful pattems in her domain better than non-experts. Where a novice perceives random or disconnected data point an expert connects regular patterns within and between c:","ses, This ability to identify patterns is not an innate perceptual skill; rather it reflects the organization of knowledge afier exposure to and experience with thousands of cases, Experts have a deeper understanding of their domains than novices do, and utilize higher-order principles to solve problems. A novice, for example, might group objects together by color or size, whereas an expert would group the same — objects according to their function or utility. Experts weigh variables with different criteria within their domains better than novices. Experts recognize variables that have the largest influence on a particular problem and focus their attention on those variables.","E Experts have better domain-specific short-term and long-term memory than novices do. ~ Moreover, experts perform tasks in their domains faster than novices and commit fewer errors while problem solving. Interestingly, experts go about solving problems differently than novices. Experts spend more time thinking about a problem to fully understand it at the beginning of a task than do novices, who immediately seek to find a solution. Experts use their knowledge of previous cases as context for creating mental models to solve given problems, Better at self-monitoring than novices, experts are more aware of instances whe:","committed errors or failed to understand a problem. Experts check their solutions more often than novices and recognize when they are missing information necessary for solving a problem. Experts are aware of the limits of their domain knowledge and apply their domain's heuristics to solve problems that fall outside of their experience base. The Paradox of Expertise GF The strengths of expertise can also be weakness Although one would expect experts to be (n. Hi %), they are not particularly good at making predictions about the future. ACADEMY Since the 1930s, researchers have been testing the ability of experts to make forecasts. The performance of experts has been tested against actuarial tables to determine if they are better at making predictions than simple statistical models. Seventy","years later, with more than two hundred experiments in different domains, it is clear that the answer is no. If supplied with an equal amount of data about a particular case, an actuanal table is as good, or better, than an expert at making calls about the future. Even if an expert is given more specific case information than is available to the statistical model, the expert does not tend to outperform the actuarial table.","Theorists and researchers differ when trying to explain why experts are less accurate forecasters than statistical models, Some have argued that experts, like all humans, are inconsistent when using mental models to make predictions, A number of researchers point to human biases to explain unreliable expert predictions, During the last 30 years, researchers have categorized, experimented, and theorized about the cognitive aspects of forecasting. Despite such efforts, the literature shows little consensus regarding the causes or manifestations of human bias. Expert performs task independently without the help of a mentor |"],"questions":[{"n":19,"text":"Novices and experts use the same system to classify objects.","answer":"FALSE","source":"Đoạn D (PDF trang 180)","evidence":"A novice, for example, might group objects together by color or size, whereas an expert would group the same — objects according to their function or utility.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “A novice, for example, might group objects together by color or size, whereas an expert would group the same — objects according to their function or utility.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Novices and experts use the same system to classify objects.”\n- Passage: “A novice, for example, might group objects together by color or size, whereas an expert would group the same — objects according to their function or utility.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":20,"text":"A novice’s training is focused on memory skills.","answer":"NOT GIVEN","source":"Đoạn A (PDF trang 179)","evidence":"…The novice needs to learn the guiding principles and rules of a given task in order to perform that task, Concurrently, the novice needs to be exposed to specific cases, or instances, that test the boundaries of such heuristic (ERK).","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…The novice needs to learn the guiding principles and rules of a given task in order to perform that task, Concurrently, the novice needs to be exposed to specific cases, or instances, that test the boundaries of such heuristic (ERK).”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “A novice’s training is focused on memory skills” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “A novice’s training is focused on memory skills.”\n- Passage: “…The novice needs to learn the guiding principles and rules of a given task in order to perform that task, Concurrently, the novice needs to be exposed to specific cases, or instances, that test the boundaries of such heuristic (ERK).”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":21,"text":"Experts have higher efficiency than novices when solving problems in their own field.","answer":"TRUE","source":"Đoạn E (PDF trang 180)","evidence":"…experts perform tasks in their domains faster than novices and commit fewer errors while problem solving. Interestingly, experts go about solving problems differently than novices.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…experts perform tasks in their domains faster than novices and commit fewer errors while problem solving.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Experts have higher efficiency than novices when solving problems in their own field.”\n- Passage: “…experts perform tasks in their domains faster than novices and commit fewer errors while problem solving.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":22,"text":"When facing a problem, a novice always tries to solve it straight away.","answer":"TRUE","source":"Đoạn E (PDF trang 180)","evidence":"…novices, who immediately seek to find a solution. Experts use their knowledge of previous cases as context for creating mental models to solve given problems, Better at self-monitoring than novices, experts are more aware of instances whe: they have committed errors or failed to understand a problem.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…novices, who immediately seek to find a solution.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “When facing a problem, a novice always tries to solve it straight away.”\n- Passage: “…novices, who immediately seek to find a solution.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":23,"text":"Experts are better at recognizing their own mistakes and limits.","answer":"TRUE","source":"Đoạn E (PDF trang 180)","evidence":"Experts use their knowledge of previous cases as context for creating mental models to solve given problems, Better at self-monitoring than novices, experts are more aware of instances whe: they have committed errors or failed to understand a problem.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Experts use their knowledge of previous cases as context for creating mental models to solve given problems, Better at self-monitoring than novices, experts are more aware of instances whe: they have committed errors or failed to underst…”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Experts are better at recognizing their own mistakes and limits.”\n- Passage: “Experts use their knowledge of previous cases as context for creating mental models to solve given problems, Better at self-monitoring than novices, experts are more aware of instances whe: they have committed errors or failed to underst…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":38,"title":"The Adolescents","passage":["The American Academy of Pediatrics recognizes three stages of adolescence. These are early, middle and late adolescence, and each has its own developmental tasks. Teenagers move through these tasks at their own speed depending on their physical development and hormone levels. Although these stages are common to all teenagers, each child will go through them in her own highly individual ways.","During the carly years young people make the first attempts to leave the dependent, secure role of a child and to establish themselves as unique individuals, independent of their parents. Early adolescence is marked by rapid physical growth and maturation. The focus of adolescents’ self-concepts are thus often on their physical self and their evaluation (n. VE (4) of their","physical acceptability. Early adolescence is also a period of intense conformity to peers. ‘Getting along,’ not being different, and being accepted seem somehow pressing to the carly adolescent, The worst possibility, from the view of the carly adolescent, is to be seen by peers as “different.” Middle adolescence is marked by the emergence of new thinking skills. The intellectual world of the young person is suddenly greatly expanded. Their concerns about peers are A more directed toward their opposite sexed peers. It is also during this period that the move to establish (v. #25) psychological independence from one's parents accelerates. Delinquency behavior may","emerge since parental views are no longer seen as absolutely correct by adolescents. Despite some delinquent behavior, middle adolescence is a period during which young people are oriented toward what is right and proper. They are developing a sense of behavioral maturity and learning to control their","Late adolescence is marked be the final preparations for adult roles. The developmental demands of late adolescence often extend into the period that we think of as young adulthood. Late adolescents attempt to crystallize their vocational goals and to establish sense of personal identity, Their needs for peer approval are diminished and they are largely psychologically independent from their parents. The shift to adulthood is nearly complete.","Some years ago, Professor Robert Havighurst of the University of Chicago proposed that stages in human development can best be thought of in terms of the developmental tasks that are part of the normal | tion (nit HE), He identified eleven developmental tasks associated with the adolescent transition. One developmental task an adolescent needs to achieve is to adjust to a new physical (adj. 47 (KAS, 4220) sense of self. At no other time since birth does an individual undergo such rapid and profound physical changes as during early adolescence. Puberty is marked by sudden rapid growth in height and weight. Also, the young person experiences the emergence (n.{L2) and accentuation of those physical traits (n.#7 iE) that make him or her a boy or girl. The effect of this rapid change is that the young adolescent often becomes focused on his or her body.","Before adolescence, children's thinking is dominated by a need to have a concrete example for any problem that they solve. Their thinking is constrained to what is real and physical. During adolescence, young people begin to recognize and understand abstractions, The adolescent must adjust to increased cognitive (adj.iA ‘af)) demands at school. Adults see high school in part as a place where adolescents prepare for adult roles and responsibilities and in part as preparatory for further education. School curricula are frequently dominated by inclusion of more abstract, demanding material, regardless of whether the adolescents have achieved formal thought. Since not all adolescents make the intellectual transition at the same rate, demands for abstract thinking prior to achievement of that ability may be frustrating. During adolescence, as teens develop increasingly complex knowledge systems and a sense of self, they also adopt an integrated set of values and morals (nti ft). During the early stages of moral development, parents provide their child with a structured set of rules of what is right and wrong, what is acceptable and unacceptable. Eventually the adolescent must assess the parents' values as they come into conflict (n.#'%) with values expressed by peers and other segments of society. To reconcile Buin 43.5 YW differences, the adolescent restructures those beliefs redicting into a personal ideology.","The adolescent must develop expanded verbal skills. As adolescents mature intellectually, as they face increased school demands, and as they prepare for adult roles, they must develop new verbal skills to accommodate more complex (adj. 32 4k0/)) concepts and tasks. Their limited language of childhood is no longer adequate (adj. ¥6t')). Adolescents may appear less competent because of their inability to express themselves meaningfully,","The adolescent must establish emotional (adj. fi 8809) and psychological independence from his or her parents, Childhood is marked by strong dependence on one's parents. Adolescents may yearn to keep that safe, secure, supportive, dependent relationship. Yet, to be an adult implies a sense of independence, of autonomy, of being one's own person. Adolescents may vacillate between their desire for dependence and their need to be independent. In an attempt to assert their need for independence and individuality, adolescents may respond with what appears to be hostility and lack (n,/t 2) of cooperation.","Adolescents do not progress through these multiple developmental tasks separately, At any given time, adolescents may be dealing with several. Further, the centrality of specific developmental tasks varies with early, middle, and late periods of the transition."],"questions":[{"n":11,"text":"The adolescent lacks the ability of thinking abstractly.","answer":"FALSE","source":"Đoạn 1 (PDF trang 184)","evidence":"…Adolescents The American Academy of Pediatrics recognizes three stages of adolescence. These are early, middle and late adolescence, and each has its own developmental tasks. Teenagers move through these tasks at their own speed depending on their physical development and hormone levels.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “…Adolescents The American Academy of Pediatrics recognizes three stages of adolescence.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The adolescent lacks the ability of thinking abstractly.”\n- Passage: “…Adolescents The American Academy of Pediatrics recognizes three stages of adolescence.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":12,"text":"Adolescents may have deficit in their language ability.","answer":"TRUE","source":"Đoạn 3 (PDF trang 186)","evidence":"Their limited language of childhood is no longer adequate (adj. ¥6t')).","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Their limited language of childhood is no longer adequate (adj.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Adolescents may have deficit in their language ability.”\n- Passage: “Their limited language of childhood is no longer adequate (adj.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":13,"text":"The adolescent experiences a transition from reliance on his parents to independence.","answer":"TRUE","source":"Đoạn 3 (PDF trang 186)","evidence":"Adolescents may appear less competent because of their inability to express themselves meaningfully, The adolescent must establish emotional (adj. fi 8809) and psychological independence from his or her parents, Childhood is marked by strong dependence on one's parents. Adolescents may yearn to keep that safe, secure, supportive, dependent relationship. Yet, to be an adult implies a sense of independence, of autonomy, of being one's own person.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Adolescents may appear less competent because of their inability to express themselves meaningfully, The adolescent must establish emotional (adj.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The adolescent experiences a transition from reliance on his parents to independence.”\n- Passage: “Adolescents may appear less competent because of their inability to express themselves meaningfully, The adolescent must establish emotional (adj.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":39,"title":"Finches on Islands","passage":["Today, the quest continues. On Daphne Major—one of the most desolate of the Galapagos Islands, an uninhabited volcanic cone where cacti (fli AG) and shrubs seldom grow higher than a researcher’s knee—Peter and Rosemary Grant have spent more than three decades watching Darwin's finches (n,#€) respond to the challenges of storms, drought and competition for food. Biologists at Princeton University, the Grants know and recognize many of the individual birds on the island and can trace the birds’ lineages back through time. They have witnessed Darwin’s principle in action again and again, over many generations of finches. The Grants’ most dramatic insights have come from watching the evolving (adj. HELA) bill (n. SS; YK) of the medium ground finch. The plumage of this sparrow-sized bird ranges from dull brown to jet black.","A At first glance, it may not seem particularly striking,","but among scientists who study evolutionary biology, the medium ground finch is a superstar. Its bill is a middling example in the array of shapes and sizes found among Galapagos finches: heftier than that of the small ground finch, which specializes in eating small, soft seeds, but petite compared to that of the large ground finch, an expert at cracking and devouring big, hard seeds. When the Grants began their study in the 1970s, only two species of finch lived on eel “Soeatenn Daphne Major, the medium ground finch and the cactus finch. The island is so small that the researchers were able to count and catalogue every bird. When a severe drought hit in 1977, the birds soon devoured (v.# ft. 922K) the last of the small, easily eaten seeds. Smaller members of the medium ground finch population, lacking the bill strength to crack large seeds, died out.","Bill and body size are inherited traits, and the next generation had a high proportion of big-billed individuals. The Grants had documented natural selection at work—the same process that, over many millennia, directed the evolution of the Galipagos’ 14 unique finch species, all descended from a common ancestor that reached the islands a few million years ago.","Eight years later, heavy rains brought by an El Nino transformed the normally meager vegetation on Daphne Major. Vines and other plants that in most years struggle for survival suddenly flourished (v.1€.4% %), choking out the plants that provide large seeds to the finches. Small seeds came to dominate the food supply, and big birds with big bills died out at a higher rate than smaller ones. “Natural selection is observable,” Rosemary Grant says. ‘It happens when the environment changes, When local conditions reverse themselves, so does the direction of adaptation.”","Recently, the Grants witnessed (n. ij, NLiiE) another form of natural selection acting on the medium ground finch: competition from bigger, stronger cousins. In 1982, a third finch, the large ground finch, came to live on Daphne Major, The stout bills of these birds resemble the business end of a crescent wrench. Their arrival was the first such colonization recorded on the Galdpagos in nearly a century of scientific observation. ‘We realized,” Peter Grant says, ‘we had a very unusual and potentially important event to follow.’ For 20 years, the large ground finch coexisted with the medium ground finch, which shared the supply of large seeds with its bigger-billed relative. Then, in 2002 and 2003, another drought struck. None of the birds nested that year, and many died out. Medium ground finches with large bills, crowded out of feeding areas by the more powerful large ground finches, were hit particularly hard.","When wetter weather returned in 2004, and the finches nested again, the new generation of the medium ground finch was dominated by smaller birds with smaller bills, able to survive on smaller seeds. This situation, says Peter Grant, marked the first time that biologists have been able to follow the complete process of an evolutionary change due to competition between species and the strongest response to natural selection that he had seen in 33 years of tracking Galapagos finches.","On the inhabited island of Santa Cruz, just south of Daphne Major, Andrew Hendry of McGill University and Jeffrey Podos of the University of Massachusetts at Amherst have discovered a new, man-made twist in finch evolution. Their study focused on birds living near the Academy Bay research station, on the fringe of the town of Puerto Ayora. The human population of the area has been growing fast—from 900 people in 1974 to 9,582 in 2001. ‘Today Puerto Ayora is full of hotels and mai tai bars,’ Hendry says. “People have taken this extremely arid place and tried to turn it into a Caribbean resort (n.fERRE Hh.”","Academy Bay records dating back to the early 1960s show that medium ground finches captured there had either small or large bills. Very few of the birds had mid-size bills. The finches appeared to be in the early stages of a new adaptive radiation; If the trend continued, the medium ground finch on Santa Cruz could split into two distinct subspecies, specializing in different types of seeds. But in the late 1960s and early 70s, medium ground finches with medium-sized bills began to thrive at Academy Bay along with small and large-billed birds. The booming human population had introduced new food sources, including exotic plants and bird feeding stations stocked with rice. Billsize, once critical to the finches’ survival, no longer made any difference. ‘Now an intermediate bill can do fine,” Hendry says.","Ata control site distant from Puerto Ayora, and relatively untouched by humans, the medium ground finch population remains split between large- and small-billed birds, On undisturbed parts of Santa Cruz, there is no ecological niche for a middling medium ground finch, and the birds continue to diversify, In town, though there are still many finches, once-distinct populations are merging.","The finches of Santa Cruz demonstrate a subtle process in which human meddling can stop evolution in its tracks, ending the formation of new species. In a time when global biodiversity continues its downhill slide, Darwin's finches have yet another unexpected lesson to teach. “If we hope to regain some of the diversity that’s already been lost,’ Hendry says, “we need to protect not just existing creatures, but also the processes that drive the origin of new species.”"],"questions":[{"n":9,"text":"Grant’s discovery has questioned Darwin’s theory.","answer":"FALSE","source":"Đoạn 1 (PDF trang 188)","evidence":"Finches on Islands Today, the quest continues. On Daphne Major—one of the most desolate of the Galapagos Islands, an uninhabited volcanic cone where cacti (fli AG) and shrubs seldom grow higher than a researcher’s knee—Peter and Rosemary Grant have spent more than three decades watching Darwin's finches (n,#€) respond to the challenges of storms, drought and competition for food.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “Finches on Islands Today, the quest continues.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Grant’s discovery has questioned Darwin’s theory.”\n- Passage: “Finches on Islands Today, the quest continues.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":10,"text":"The cactus finches are less affected by food than the medium ground finch.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 188)","evidence":"When the Grants began their study in the 1970s, only two species of finch lived on eel “Soeatenn Daphne Major, the medium ground finch and the cactus finch.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “When the Grants began their study in the 1970s, only two species of finch lived on eel “Soeatenn Daphne Major, the medium ground finch and the cactus finch.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “less affected by food than the medium ground finch” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The cactus finches are less affected by food than the medium ground finch.”\n- Passage: “When the Grants began their study in the 1970s, only two species of finch lived on eel “Soeatenn Daphne Major, the medium ground finch and the cactus finch.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":11,"text":"In 2002 and 2003, all the birds were affected by the drought.","answer":"TRUE","source":"Đoạn 3 (PDF trang 189)","evidence":"Then, in 2002 and 2003, another drought struck.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Then, in 2002 and 2003, another drought struck.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In 2002 and 2003, all the birds were affected by the drought.”\n- Passage: “Then, in 2002 and 2003, another drought struck.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":12,"text":"The discovery of Andrew Hendry and Jeffrey Podos was the same as that of the previous studies.","answer":"FALSE","source":"Đoạn 3 (PDF trang 189)","evidence":"On the inhabited island of Santa Cruz, just south of Daphne Major, Andrew Hendry of McGill University and Jeffrey Podos of the University of Massachusetts at Amherst have discovered a new, man-made twist in finch evolution.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “On the inhabited island of Santa Cruz, just south of Daphne Major, Andrew Hendry of McGill University and Jeffrey Podos of the University of Massachusetts at Amherst have discovered a new, man-made twist in finch evolution.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The discovery of Andrew Hendry and Jeffrey Podos was the same as that of the previous studies.”\n- Passage: “On the inhabited island of Santa Cruz, just south of Daphne Major, Andrew Hendry of McGill University and Jeffrey Podos of the University of Massachusetts at Amherst have discovered a new, man-made twist in finch evolution.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":13,"text":"It is shown that the evolution in finches on Santa Cruz is likely a response to human intervention.","answer":"TRUE","source":"Đoạn 4 (PDF trang 190)","evidence":"The finches of Santa Cruz demonstrate a subtle process in which human meddling can stop evolution in its tracks, ending the formation of new species.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The finches of Santa Cruz demonstrate a subtle process in which human meddling can stop evolution in its tracks, ending the formation of new species.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “It is shown that the evolution in finches on Santa Cruz is likely a response to human intervention.”\n- Passage: “The finches of Santa Cruz demonstrate a subtle process in which human meddling can stop evolution in its tracks, ending the formation of new species.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":40,"title":"The Impact of the Potato","passage":["A The potato was first cultivated in South America between three and seven thousand years ago, though scientists believe they may have grown wild in the region as long as 13,000 years ago. The genetic patterns of potato distribution indicate that the potato probably originated in the mountainous west-central region of the continent.","B Early Spanish chroniclers who misused the Indian word batata (sweet ser\" potato) as the name for the potato noted the importance of the tuber to the Incan Empire. The Incas had leamed to preserve the potato for storage by dehydrating and mashing potatoes into a substance called Chuchu could be stored in a room for up to 10 years, providing excellent insurance against possible crop failures. As well as using the food as a staple crop, the Incas thought potatoes made childbirth easier and used it to treat injuries.","Cc The Spanish conquistadors first encountered the potato when they arrived in Peru in 1532 in search of gold, and noted Inca miners eating chuchu, At the time the Spaniards failed to realize that the potato represented a far more important treasure than either silver or gold, but they did gradually begin to use potatoes as basic rations aboard their ships. After the arrival of the potato in Spain in 1570, a few Spanish farmers began to cultivate them on a small scale, mostly as food for livestock.","D Throughout Europe, potatoes were regarded with suspicion, distaste and fear. Generally considered to be unfit for human consumption, they were used only as animal fodder and sustenance for the starving. In northern Europe, potatoes were primarily grown in botanical gardens as an exotic novelty. Even peasants refused to eat from a plant that produced ugly, misshapen tubers and that had come from a heathen civilization. Some felt that the potato plant's resemblance to plants in the nightshade family hinted that it was the creation of witches or devils,","E In meat-loving England, farmers and urban workers regarded potatoes with extreme distaste. In 1662, the Royal Society recommended the cultivation of the tuber to the English government and the nation, but this recommendation had little impact. Potatoes did not become a staple until, during the food shortages associated with the sic Bise: BeBe Beckles Be ses Sse: acs: 8-8-8: 8-8-a-8-8-2","Revolutionary Wars, the English government began to officially encourage potato cultivation, In 1795, the Board of Agriculture issued a pamphlet entitled \"Hints Respecting the Culture and Use of Potatoes\"; this was followed shortly by pro-potato editorials and potato recipes in The Times. Gradually, the lower classes began to follow the lead of the upper classes.","F A similar pattern emerged across the English Channel in the Netherlands, Belgium and France. While the potato slowly gained ground in eastern France (where it was often the only crop remaining after marauding soldiers plundered wheat fields and vineyards), it did not achieve widespread acceptance until the late 1700s. The peasants remained suspicious, in spite of a 1771 paper from the Facult de Paris testifying that the potato was not harmful but beneficial. The people began to overcome their distaste when the plant received the royal seal of approval: Louis XVI began to sport a potato flower in his buttonhole, and Marie-Antoinette wore the purple potato blossom in her hair.","G Frederick the Great of Prussia saw the potato's potential to help feed his nation and lower the price of bread, but faced the challenge of overcoming the people's prejudice against the plant. When he issued a 1774 order for his subjects to grow potatoes as protection against famine, the town of Kolberg replied; \"The things have neither smell nor taste, not even the dogs will eat them, so what use are they to us?\" Trying a less direct approach to encourage his subjects to begin planting potatoes, Frederick used a bit of reverse psychology: he planted a royal field of potato plants and stationed a heavy guard to protect this field from thieves. Nearby peasants naturally assumed that anything worth guarding was worth stealing, and so snuck into the field and snatched the plants for their home gardens, Of course, this was entirely in line with Frederick's wishes.","H Historians debate whether the potato was primarily a cause or an effect of the huge population boom in industrial-era England and Wales, Prior to 1800, the English diet had consisted primarily of meat, supplemented by bread, butter and cheese. Few vegetables were consumed, most vegetables being regarded as nutritionally worthless and potentially harmful. This view began to change gradually in the late 1700s. The Industrial Revolution was drawing an ever increasing percentage of the populace into crowded cities, where only the richest could afford homes with ovens or coal storage rooms, and people were working 12-16 hour days which left them with little time or energy to prepare food. High yielding, easily prepared potato crops were the obvious solution to England's food problems,","I Whereas most of their neighbors regarded the potato with suspicion and had to be persuaded to use it by the upper classes, the Irish peasantry embraced the tuber more passionately than anyone since the Incas. The potato was well suited to the Irish the soil and climate, and its high yield suited the most important concern of most Irish farmers: to feed their families,","J The most dramatic example of the potato's potential to alter population patterns occurred in Ireland, where the potato had become a staple by 1800, The Irish population doubled to eight million between 1780 and 1841, this without any significant expansion of industry or reform of agricultural techniques beyond the widespread cultivation of the potato. Though Irish landholding practices were primitive in comparison with those of England, the potato’s high yields allowed even the poorest farmers to produce more healthy food than they needed with scarcely any investment or hard labor. Even children could easily plant, harvest and cook potatoes, which of course required no threshing, curing or grinding. The abundance provided by potatoes greatly decreased infant mortality and encouraged early marriage."],"questions":[{"n":1,"text":"The early Spanish called potato as the Incan name “Chuchu”.","answer":"FALSE","source":"Đoạn 1 (PDF trang 192)","evidence":"…Potato Jeff Chapman relates the story of history the most important vegetable A The potato was first cultivated in South America between three and seven thousand years ago, though scientists believe they may have grown wild in the region as long as 13,000 years ago.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…Potato Jeff Chapman relates the story of history the most important vegetable A The potato was first cultivated in South America between three and seven thousand years ago, though scientists believe they may have grown wild in the regio…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The early Spanish called potato as the Incan name “Chuchu”.”\n- Passage: “…Potato Jeff Chapman relates the story of history the most important vegetable A The potato was first cultivated in South America between three and seven thousand years ago, though scientists believe they may have grown wild in the regio…”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":2,"text":"The purposes of Spanish coming to Peru were to find out potatoes.","answer":"FALSE","source":"Đoạn 1 (PDF trang 192)","evidence":"Cc The Spanish conquistadors first encountered the potato when they arrived in Peru in 1532 in search of gold, and noted Inca miners eating chuchu, At the time the Spaniards failed to realize that the potato represented a far more important treasure than either silver or gold, but they did gradually begin to use potatoes as basic rations aboard their ships. After the arrival of the potato in Spain in 1570, a few Spanish farmers began to cultivate them on a small scale, mostly as food for livestock. D Throughout Europe, potatoes were regarded with suspicion, distaste and fear.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mục đích. Passage thực tế viết: “Cc The Spanish conquistadors first encountered the potato when they arrived in Peru in 1532 in search of gold, and noted Inca miners eating chuchu, At the time the Spaniards failed to realize that the potato represented a far more import…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The purposes of Spanish coming to Peru were to find out potatoes.”\n- Passage: “Cc The Spanish conquistadors first encountered the potato when they arrived in Peru in 1532 in search of gold, and noted Inca miners eating chuchu, At the time the Spaniards failed to realize that the potato represented a far more import…”\n- Quan hệ nghĩa: đối lập ở mục đích."},{"n":3,"text":"The Spanish believed that the potato has the same nutrients as other vegetables.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 193)","evidence":"Few vegetables were consumed, most vegetables being regarded as nutritionally worthless and potentially harmful.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Few vegetables were consumed, most vegetables being regarded as nutritionally worthless and potentially harmful.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “same nutrients as other vegetables” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The Spanish believed that the potato has the same nutrients as other vegetables.”\n- Passage: “Few vegetables were consumed, most vegetables being regarded as nutritionally worthless and potentially harmful.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":4,"text":"Peasants at that time did not like to eat potatoes because they were ugly.","answer":"TRUE","source":"Đoạn 1 (PDF trang 192)","evidence":"In northern Europe, potatoes were primarily grown in botanical gardens as an exotic novelty. Even peasants refused to eat from a plant that produced ugly, misshapen tubers and that had come from a heathen civilization.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “In northern Europe, potatoes were primarily grown in botanical gardens as an exotic novelty.”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Peasants at that time did not like to eat potatoes because they were ugly.”\n- Passage: “In northern Europe, potatoes were primarily grown in botanical gardens as an exotic novelty.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":5,"text":"The popularity of potatoes in the UK was due to food shortages during the war.","answer":"TRUE","source":"Đoạn 2 (PDF trang 193)","evidence":"Potatoes did not become a staple until, during the food shortages associated with the A Ec Ea: Ec Ea: i sic Bise: BeBe Beckles Be ses Sse: acs: 8-8-8: 8-8-a-8-8-2 Revolutionary Wars, the English government began to officially encourage potato cultivation, In 1795, the Board of Agriculture issued a pamphlet entitled \"Hints Respecting the Culture and Use of Potatoes\"; this was followed shortly by pro-potato editorials and potato recipes in The Times.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Potatoes did not become a staple until, during the food shortages associated with the A Ec Ea: Ec Ea: i sic Bise: BeBe Beckles Be ses Sse: acs: 8-8-8: 8-8-a-8-8-2 Revolutionary Wars, the English government began to officially encourage p…”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The popularity of potatoes in the UK was due to food shortages during the war.”\n- Passage: “Potatoes did not become a staple until, during the food shortages associated with the A Ec Ea: Ec Ea: i sic Bise: BeBe Beckles Be ses Sse: acs: 8-8-8: 8-8-a-8-8-2 Revolutionary Wars, the English government began to officially encourage p…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":41,"title":"How should reading be taught?","passage":["Learning to speak is automatic for almost all children, but learning to read requires claborate instruction and conscious effort, Well aware of the difficulties, educators have given a great deal of thought to how they can best help children learn to read. No single method has triumphed, Indeed, heated arguments about the most appropriate form of reading instruction continue to polarise the teaching community.","Three general approaches have been tried. In one, called whole-word instruction, children learn by rote how to recognise at a glance a vocabulary of 50 to 100 words, Then they gradually acquire other words, often through seeing them used over and over again in the context of a story.","Speakers of most languages learn the relationship between letters and the sounds associated with them (phonemes). That is, children are taught how to use their knowledge of the alphabet to sound out words. This procedure constitutes a second approach to teaching reading - phonics.","Many schools have adopted a different approach: the whole-language method, The strategy here relies on the child’s experience with language. For example, students are offered engaging books and are encouraged to guess the words that they do not know by considering the context of the sentence or by looking for clues in the storyline and illustrations, rather than trying to sound them out. Many teachers adopted the whole-language approach because of its intuitive appeal, Making reading fun promises to keep children motivated, and learning to read depends more on what the student does than on what the teacher does, The presumed benefits of whole-language instruction — and the contrast to the perceived dullness of phonics - led to its growing acceptance across America during the 1990s, and a movement away from phonics.","However, many linguists and psychologists objected strongly to the abandonment of phonics in American schools, Why was this so? In short, because research had clearly demonstrated that understanding how letters related to the component sounds in words is critically important in reading. This conclusion rests, in part, on knowledge of how experienced readers make sense of words on a page. Advocates of whole-language instruction have argued forcefully that people often","derive meanings directly from print without ever determining the sound of the word, Some psychologists today accept this view, but most believe that reading is typically a process of rapidly sounding out words mentally. Compelling evidence for this comes from experiments which show that subjects often confuse homophones (words that sound the same, such as Jrose] and ‘rows5). This supports the idea that readers convert strings of letters to sounds.","In order to evaluate different approaches to teaching reading, a number of experiments have been carried out, firstly with college students, then with school pupils. Investigators trained English-speaking college students to read using unfamiliar symbols such as Arabic letters (the phonics approach), while another group learned entire words associated with certain strings of Arabic letters (whole-word). Then both groups were required to read a new set of words constructed from the original characters. In general, readers who were taught the tules of phonics could read many more new words than those trained with a whole-word procedure,","Classroom studies comparing phonics with either whole-word or whole-language instruction are also quite illuminating. One particularly persuasive study compared two programmes used in 20 first-grade classrooms. Half the students were offered traditional reading instruction, which included the use of phonics drills and applications. The other half were taught using an individualised method that drew from their experiences with language; these children produced their own booklets of stories and developed sets of words to be recognised (common components of the whole-language approach), This study found that the first group scored higher at year’s end on tests of reading and comprehension,","If researchers are so convinced about the need for phonics instruction, why does the debate continue? Because the controversy is enmeshed in the philosophical differences between traditional and progressive (or new) approaches, differences that have divided educators for years. The progressives challenge the results of laboratory tests and classroom studies on the basis of a broad philosophical scepticism about the values of such research. They champion student-centred learning and teacher empowerment. Sadly, they fail to realise that these very admirable educational values are equally consistent with the teaching of phonics.","If schools of education insisted that would-be reading teachers learned something about the vast research in linguistics and psychology that bears on reading, their graduates would be more cager to use phonics and would be prepared to do so effectively, They could allow their pupils to apply the principles of phonics while reading for pleasure. Using whole-language activities to supplement phonics instruction certainly helps to make reading fun and meaningful for children, so no one would want to see such tools discarded. Indeed, recent work has indicated that the combination of literature-based instruction and phonics is more powerful than either method used alone. Teachers need to strike a balance. But in doing so, we urge them to remember that reading must be grounded in a firm understanding of the connections between letters and sounds, Educators who deny this reality are neglecting decades of research. They are also neglecting the needs of their students. leet eat at atl ath el el tl eee : BA, ORHELA. HF MoppemMyCRAAMMEFRK t Cer aca cay Scala “eg ean Ge ee QT YG Ge eee ec ee"],"questions":[{"n":32,"text":"The whole-language approach relates letters to sounds.","answer":"FALSE","source":"Đoạn 1 (PDF trang 196)","evidence":"…Reading Passage 3 on pages 12 and 13. How should reading be taught? By Keith Rayner an Barbara R Foorman Learning to speak is automatic for almost all children, but learning to read requires claborate instruction and conscious effort, Well aware of the difficulties, educators have given a great deal of thought to how they can best help children learn to read.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…Reading Passage 3 on pages 12 and 13.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The whole-language approach relates letters to sounds.”\n- Passage: “…Reading Passage 3 on pages 12 and 13.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":33,"text":"Many educators believe the whole-language approach to be the most interesting way to teach children to read.","answer":"TRUE","source":"Đoạn 1 (PDF trang 196)","evidence":"Many schools have adopted a different approach: the whole-language method, The strategy here relies on the child’s experience with language. For example, students are offered engaging books and are encouraged to guess the words that they do not know by considering the context of the sentence or by looking for clues in the storyline and illustrations, rather than trying to sound them out.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Many schools have adopted a different approach: the whole-language method, The strategy here relies on the child’s experience with language.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Many educators believe the whole-language approach to be the most interesting way to teach children to read.”\n- Passage: “Many schools have adopted a different approach: the whole-language method, The strategy here relies on the child’s experience with language.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":34,"text":"Research supports the theory that we read without linking words to sounds.","answer":"FALSE","source":"Đoạn 2 (PDF trang 197)","evidence":"This supports the idea that readers convert strings of letters to sounds.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “This supports the idea that readers convert strings of letters to sounds.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Research supports the theory that we read without linking words to sounds.”\n- Passage: “This supports the idea that readers convert strings of letters to sounds.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":35,"text":"Research has shown that the whole-word approach is less effective than the whole-language approach.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 196)","evidence":"This procedure constitutes a second approach to teaching reading - phonics. Many schools have adopted a different approach: the whole-language method, The strategy here relies on the child’s experience with language.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “This procedure constitutes a second approach to teaching reading - phonics.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “less effective than the whole-language approach” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Research has shown that the whole-word approach is less effective than the whole-language approach.”\n- Passage: “This procedure constitutes a second approach to teaching reading - phonics.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":36,"text":"Research has shown that phonics is more successful than both the whole-word and whole-language approaches.","answer":"TRUE","source":"Đoạn 2 (PDF trang 197)","evidence":"In general, readers who were taught the tules of phonics could read many more new words than those trained with a whole-word procedure, Classroom studies comparing phonics with either whole-word or whole-language instruction are also quite illuminating.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “In general, readers who were taught the tules of phonics could read many more new words than those trained with a whole-word procedure, Classroom studies comparing phonics with either whole-word or whole-language instruction are also qui…”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Research has shown that phonics is more successful than both the whole-word and whole-language approaches.”\n- Passage: “In general, readers who were taught the tules of phonics could read many more new words than those trained with a whole-word procedure, Classroom studies comparing phonics with either whole-word or whole-language instruction are also qui…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":42,"title":"T-Rex Hunter","passage":["Jack Horner is an unlikely academic: his dyslexia is so bad that he has trouble reading a book. But he can read the imprint of life in sandstone or muddy shale across a distance of 100m years, and it is this gift that has made him curator of palaeontology at Montana State University's Museum of the Rockies, the leader of a multi-million dollar scientific project to expose a complete slice of life 68m years ago, and a consultant to Steven Spielberg and other Hollywood figures.","His father had a sand and gravel quarry in Montana, and the young Homer was a collector of stones and bones, complete with notes about when and where he found them, \"My father had owned a ranch when he was younger, in Montana,\" he says. “He was enough of a geologist, being a sand and gravel man, to have a pretty good notion that they were dinosaur bones. So when I was cight years old he took me back to the area that had been his ranch, to where he had seen these big old bones. I picked up one. I am pretty sure it was the upper arm bone of a : duckbilled dinosaur: it probably wasn't a maiaosaur but closely] 4%) fie related to that. I catalogued it, and took good care of it, and then +,Fedicting later when I was in high school, excavated my first dinosaur oo skeleton. It obviously started earlier than eight and I literally have been driven ever since. I feel like I was born this way.\" Horner spent seven years at university, but never graduated. \"I have a leaming","disability, I would call it a learning difference - dyslexia, they call it - and I just had a terrible time with English and foreign languages and things like that. For a degree in geology or biology they required two years of a forcign language. There was no way in the world | could do that. In fact, I didn't really pass English. (/ELTS test papers of it. But I took all of the courses required and I wrote a thesis and I did all sorts of things. So I have the education, I just don't have the piece of paper,” he says.","In Montana, in those days, everybody had the right to a college education, His grades at high school had been terrible, at university, his advisers recognised that he was having a hard time, and went on helping. The dean who kept readmitting him, was to give Horner an honorary doctorate years later. As a young non-graduate, Homer wrote to every museum in the English-speaking world, asking for a job. Los Angeles County Museum and the Royal Ontario Museum in Toronto made offers, but he accepted a post as technician at Princeton University because Princeton, New","E \"We definitely know we are working on a very broad coastal plain with the streams and rivers bordered by conifers and hardwood plants, and the areas in between these rivers were probably fern-covered. There were no grasses at all: just ferns and bushes - an unusual landscape, kind of taking the south-eastern United States ~ Georgia, Florida - and mixing it with the moors of","England and flattening it out,” he says. \"Triceratops is very common: they are the cows of the Cretaceous, they are everywhere. Duckbilled dinosaurs are relatively common but not as common as triceratops and T rex, for a meat-eating dinosaur, is very common. What we would consider the predator-prey ratio seems really off the scale. What is interesting is the little dromacosaurs, the ones we know for sure were good predators, we haven't found any of them.\"","Which is why he sees T rex not as the lion of the Cretaceous savannah but its vulture. \"Look at the wildebcest that migrate in the Serengeti of Africa, a million individuals lose about 200,000 individuals in that annual migration, There is a tremendous carrion base there. And so you have hyenas, you have tremendous numbers of vultures that are scavenging, you don't have all that many animals that are good predators. If T rex was a top predator, especially considering how big it is, you'd expect it to be extremely rare, much rarer than the little dromaeosaurs, and yet they are everywhere, they are a dime a dozen,” he says. A 12-tonne T rex is a lot of vulture, but he doesn't see the monster as clumsy. He insisted his theory and finding, dedicated to further research upon it, of course, he would like to reevaluate if there is any case that additional evidence found or explanation raised by others in the future,","G He examined the leg bones of the T-rex, and compared the length of the thigh bone (upper leg), to the shin bone (lower leg). He found that the thigh bone was equal in length or slightly longer than the shin bone, and much thicker and heavier, which proves that the animal was built to be a slow walker rather than fast running. On the other hand, the fossils of fast hunting dinosaurs ALWAYS showed that the shin bone was longer than the thigh bone. This same truth can be observed in many animals of today which are designed to run fast: The ostrich, cheetah, etc.","H He also studied the fossil teeth of the T-rex, and compared them with the teeth of the Velociraptor, and put the nail in the coffin of the \"hunter T-rex theory\", The Velociraptor's tecth where like stake knifes: sharp, razor-edged, and capable of tearing through flesh with case. The T-Rex's teeth were huge, sharp at their tip, but blunt , propelled by enormous jaw muscles, which enabled them to only crush bones.","I With the evidence presented in his documentary, Horner was able to prove that the idea of the T-rex as being a hunting and ruthless killing machine is probably just a myth. In light of the scientific clues he was able to unearth, the T-rex was a slow , sluggish animal which had poor vision, an extraordinary sense of smell, that often reached its \"prey\" after the real hunters were done feeding, and sometimes it had to scare the hunters away from a corpse. In order to do that, the T-rex had to have been ugly, nasty-looking, and stinky This is actually true of nearly all scavenger animal. They are usually vile and nasty looking. pretenenenanenanenanenenenenenanenanenanenenenenenanenapenapenenenenenanen en, Mia] TG? OT AO tH TS? ETERS? EAST, aT ah T SS? WPL, AF... “UPA dDEedDEedDeeaD EOE ERED EEE ECAP"],"questions":[{"n":1,"text":"Jack Horner knew exactly the bone belonged to a certain dinosaur when he was in father’s ranch at the age of 8.","answer":"TRUE","source":"Đoạn 1 (PDF trang 201)","evidence":"…T-Rex Hunter Jack Horner is an unlikely academic: his dyslexia is so bad that he has trouble reading a book. But he can read the imprint of life in sandstone or muddy shale across a distance of 100m years, and it is this gift that has made him curator of palaeontology at Montana State University's Museum of the Rockies, the leader of a multi-million dollar scientific project to expose a complete slice of life 68m years ago, and a consultant to Steven Spielberg and other Hollywood figures.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…T-Rex Hunter Jack Horner is an unlikely academic: his dyslexia is so bad that he has trouble reading a book.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Jack Horner knew exactly the bone belonged to a certain dinosaur when he was in father’s ranch at the age of 8.”\n- Passage: “…T-Rex Hunter Jack Horner is an unlikely academic: his dyslexia is so bad that he has trouble reading a book.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"Jack Horner achieved distinctive degree in university when he graduated.","answer":"FALSE","source":"Đoạn 1 (PDF trang 201)","evidence":"I feel like I was born this way.\" (a HLRAE ks. ipredicting. com JUOMHNTOIM AMMAR 1 fF ipod, HP HL ) Horner spent seven years at university, but never graduated.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “I feel like I was born this way.\" (a HLRAE ks.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Jack Horner achieved distinctive degree in university when he graduated.”\n- Passage: “I feel like I was born this way.\" (a HLRAE ks.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":3,"text":"Jack Horner is the first man that discovered T-Rex’s bone in the world.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 201)","evidence":"BARA Version 33301 ’ T-Rex Hunter Jack Horner is an unlikely academic: his dyslexia is so bad that he has trouble reading a book.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “BARA Version 33301 ’ T-Rex Hunter Jack Horner is an unlikely academic: his dyslexia is so bad that he has trouble reading a book.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “first man that dis
