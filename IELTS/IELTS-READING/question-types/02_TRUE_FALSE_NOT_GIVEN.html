he ones we know for sure were good predators, we haven't found any of them.\" Which is why he sees T rex not as the lion of the Cretaceous savannah but its vulture. \"Look at the wildebcest that migrate in the Serengeti of Africa, a million individuals lose about 200,000 individuals in that annual migration, There is a tremendous carrion base there. And so you have hyenas, you have tremendous numbers of vultures that are scavenging, you don't have all that many animals that are good predators.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “What is interesting is the little dromacosaurs, the ones we know for sure were good predators, we haven't found any of them.\" Which is why he sees T rex not as the lion of the Cretaceous savannah but its vulture.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “to the number of vulture in the Serengeti” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “T-rex’s number is equivalent to the number of vulture in the Serengeti.”\n- Passage: “What is interesting is the little dromacosaurs, the ones we know for sure were good predators, we haven't found any of them.\" Which is why he sees T rex not as the lion of the Cretaceous savannah but its vulture.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":6,"text":"The hypothesis that T-rex is top predator conflicts with the fact of predator-prey ratio which Jack found.","answer":"TRUE","source":"Đoạn 2 (PDF trang 202)","evidence":"What we would consider the predator-prey ratio seems really off the scale.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “What we would consider the predator-prey ratio seems really off the scale.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The hypothesis that T-rex is top predator conflicts with the fact of predator-prey ratio which Jack found.”\n- Passage: “What we would consider the predator-prey ratio seems really off the scale.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":7,"text":"He refused to accept any other viewpoints about T rex’s category.","answer":"FALSE","source":"Đoạn 3 (PDF trang 203)","evidence":"He insisted his theory and finding, dedicated to further research upon it, of course, he would like to reevaluate if there is any case that additional evidence found or explanation raised by others in the future, c DE |F 1G H iI | G He examined the leg bones of the T-rex, and compared the length of the thigh bone (upper leg), to the shin bone (lower leg). He found that the thigh bone was equal in length or slightly longer than the shin bone, and much thicker and heavier, which proves that the animal was built to be a slow walker rather than fast running. On the other hand, the fossils of fast hunting dinosaurs ALWAYS showed that the shin bone was longer than the thigh bone.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “He insisted his theory and finding, dedicated to further research upon it, of course, he would like to reevaluate if there is any case that additional evidence found or explanation raised by others in the future, c DE |F 1G H iI | G He e…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “He refused to accept any other viewpoints about T rex’s category.”\n- Passage: “He insisted his theory and finding, dedicated to further research upon it, of course, he would like to reevaluate if there is any case that additional evidence found or explanation raised by others in the future, c DE |F 1G H iI | G He e…”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."}]},{"id":43,"title":"Plain English Campaign","passage":["A We launched Plain English Campaign in 1979 with a ritual shredding of appalling government and municipal council forms in Parliament Square, London. We had become so fed up of people visiting our advice centre in Salford, Greater Manchester, to complain about incomprchensible forms that we thought we ought to take action, At the time the shredding seemed like merely throwing sand in the eyes of the charging lion, but it Plain English Campaign briefly caught the — public imagination and = left an","impression on government and business, Although we're pleased with the new plain English awareness in government departments, many local councils and businesses maintain a stout resistance to change. one council began a letter to its tenants about a rent increase with two sentences averaging 95 words, full of bizarre housing finance jargon and waffle about Acts of Parliament. The London Borough of Ealing sent such an incomprehensible letter to [SO residents that 40 of them wrote or telephoned to complain and ask for clarification, Many were upset and frightened that the council was planning to imprison them if they didn't fill in the accompanying form. In fact the letter meant nothing of the sort, and the council had to send another letter to explain","B Plain legal English can be used as a marketing tactic. Provincial Insurance issued their plain English Home Cover policy in 1983 and sold it heavily as such. In the first 18 months its sales rocketed, drawing in about an extra £1.5 million of business. Recently, the Eagle Star Group launched a plain English policy to a chorus of congratulatory letters from policyholders, People, it seems, prefer to buy a policy they can understand,","C Two kinds of instructions give us a lot of concern - medical labels and do-it-yourself products, With medical labels there is a serious gap between what the professionals think is clear and what is really clear to patients. A survey by pharmacists Raynor and Sillito found that 31% of patients misunderstood the instruction on eye drops 'To be instilled’, while 33% misunderstood ‘Use sparingly’. The instruction ‘Take two tablets 4 hourly’ is so prone to","misunderstanding (for example, as & tablets an hour) that we think it should be banned. Unclear instructions on do-it-yourself products cause expense and frustration to customers. Writing the necessary instructions for these products is usually entrusted to someone who knows the product inside out, yet the best qualification for writing instructions is ignorance. The writer is then like a first-time user, discovering how to use the product in a step-by-step way. Instructions never seem to be tested with first-time users before being issued. So vital steps are missed out or components are mislabeled or not labelled at all. For example, the instructions for assembling a sliding door gear say; 'The pendant bolt centres are fixed and should be at an equal distance from the centre of the door.’ This neglects to explain who should do the fixing and how the bolt centres will get into the correct position. By using an imperative and an active verb the instruction becomes much clearer: 'Make sure you fix the centres of the pendant bolts at an equal distance from the centre of the door.’","Effectively, the Plain English movement in the US began with President Jimmy Carter's Executive Order 12044 of 23 March 1978, that required regulations to be written in plain language. There were earlier government efforts to inform consumers about their rights and obligations, such as the Truth in Lending Act (1969) and the Fair Credit Billing Act (1975), which emphasized a body of information that consumers need in simple language. But President Carter's executive order gave the prestige and force of a president to the movement, All over the country isolated revolts or efforts against legalistic gobbledygook at the federal, state and corporate levels seemed to grow into a small revolution. These efforts and advances between the years 1978 and 1985 are described in the panel ‘The Plain English Scorecard’.","The Bastille (E24:4& 54) has not fallen yet. The forces of resistance are strong, as one can sec from the case of Pennsylvania as cited in the Scorecard, In addition, President Ronald Reagan's executive order of 19 February 1981, revoking President Carter's earlier executive order, has definitely slowed the pace of plain English legislation in the United States. There are three main objections to the idea of plain English. They are given below, with the campaign's answers to them:","The statute would cause unending litigation and clog the courts. Simply not true in all the ten states with plain English laws for consumer contracts and the 34 states with laws or regulations for insurance policies. Since 1978 when plain English law went into effect in New York there have been only four litigations and only two decisions. Massachusetts had zero cases. The cost of compliance would be","enormous. Translation of legal contracts into non-legal everyday language would be a waste of time and money. The experience of several corporations has proved that the cost of compliance is often outweighed by solid benefits and litigation savings. Citibank of New York made history in 1975 by introducing a simplified promissory note and afterwards simplified all their forms. Citibank counsel Carl Falsenfield says: ‘We have lost no money and there has been no litigation as a result of simplification.’ The cost effectiveness of clarity is demonstrable. A satisfied customer more readily signs on the bottom line and thus contributes to the corporation's bottom line. Some documents simply can't be simplified. Only legal language that has been tested for centuries in the courts is precise enough to deal with a mortgage, a deed, a lease, or an insurance policy. Here, too, the experience of several corporations and insurance companies has proved that contracts and policies can be made more understandable without sacrificing legal effectiveness. What does the future hold for the Plain English movement? Today, American consumers are buffeted by an assortment of pressures. Never before have consumers had as many choices in areas like financial services, travel, telephone services, and supermarket products, There are about 300 long-distance phone companies in the US. Not long ago, the average supermarket carried 9,000 items: today, it carries 22,000. More important, this Bim) 1 fu.o% expansion of options - according to a recent oF bnttn:/fwellbe.eoun/telis® Americans lacking the reading skills to handle the on . minimal demands of daily living. The consumer's need, therefore, for information expressed in plain English is more critical than ever.","What is needed today is not a brake on the movement's momentum but another push toward plain English contracts from consumers. | still hear plain English on the TV and in the streets, and read plain English in popular magazines and best-sellers, but not yet in many functional documents. Despite some victories, the war against gobbledygook is not over yet. We do well to remember, the warning of Chrissie Maher, organizer of Plain English Campaign in the UK: ‘People are not just injured when medical labels are written in gobbledygook- they die. Drivers are not just hurt when their medicines don't tell them they could fall asleep at the wheel - they are killed.\""],"questions":[{"n":1,"text":"In marketing area, spread of Plain English can generate economic benefit.","answer":"TRUE","source":"Đoạn B (PDF trang 205)","evidence":"…Plain legal English can be used as a marketing tactic. Provincial Insurance issued their plain English Home Cover policy in 1983 and sold it heavily as such. In the first 18 months its sales rocketed, drawing in about an extra £1.5 million of business.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Plain legal English can be used as a marketing tactic.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In marketing area, spread of Plain English can generate economic benefit.”\n- Passage: “…Plain legal English can be used as a marketing tactic.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"Because doctors tend to use jargon when they talk with patients, thereafter many patients usually gets confused with medicine dose.","answer":"NOT GIVEN","source":"Đoạn C (PDF trang 205)","evidence":"…With medical labels there is a serious on gap between what the professionals think is clear and what is really clear to patients. A survey by pharmacists Raynor and Sillito found that 31% of patients misunderstood the instruction on eye drops 'To be instilled’, while 33% misunderstood 'Use sparingly.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…With medical labels there is a serious on gap between what the professionals think is clear and what is really clear to patients.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Because doctors tend to use jargon when they talk with patients, thereafter many patients usually gets confused with medicine dose” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Because doctors tend to use jargon when they talk with patients, thereafter many patients usually gets confused with medicine dose.”\n- Passage: “…With medical labels there is a serious on gap between what the professionals think is clear and what is really clear to patients.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":3,"text":"After successive election over U.S president Jimmy Carter, effect of Plain English Campaign is less distinctive than that of previous one.","answer":"TRUE","source":"Đoạn E (PDF trang 206)","evidence":"The forces of resistance are strong, as one can sce from the c s cited in the Scorecard, In addition, President Ronald Reagan's executive order of 19 February 1981, revoking President Carter's carlier executive order, has definitely slowed the pace of plain English legislation in the United States.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The forces of resistance are strong, as one can sce from the c s cited in the Scorecard, In addition, President Ronald Reagan's executive order of 19 February 1981, revoking President Carter's carlier executive order, has definitely slow…”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “After successive election over U.S president Jimmy Carter, effect of Plain English Campaign is less distinctive than that of previous one.”\n- Passage: “The forces of resistance are strong, as one can sce from the c s cited in the Scorecard, In addition, President Ronald Reagan's executive order of 19 February 1981, revoking President Carter's carlier executive order, has definitely slow…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":4,"text":"The Plain English campaigner has a problem of talking with the officials.","answer":"NOT GIVEN","source":"Đoạn A (PDF trang 205)","evidence":"…many local councils and businesses maintain a stout resistance to change. one council began a letter to its tenants about a rent increase with two sentences averaging 95 words, full of bizarre housing finance jargon and waffle about Acts of Parliament.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…many local councils and businesses maintain a stout resistance to change.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “has a problem of talking with the officials” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The Plain English campaigner has a problem of talking with the officials.”\n- Passage: “…many local councils and businesses maintain a stout resistance to change.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":5,"text":"Word check is made regularly by judge in the court scenario.","answer":"NOT GIVEN","source":"Đoạn F (PDF trang 207)","evidence":"Some documents simply can't be simplified. Only legal language that has been tested for centuries in the courts is precise enough to deal with a mortgage, a deed, a lease, or an insurance policy. Here, too, the experience of several corporations and insurance companies has proved that contracts and policies can be made more understandable without sacrificing legal effectiveness.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Some documents simply can't be simplified.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “made regularly by judge in the court scenario” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Word check is made regularly by judge in the court scenario.”\n- Passage: “Some documents simply can't be simplified.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":6,"text":"Compared with situation of the past, consumers are now facing less intensity of label reading pressure in supermarket in America.","answer":"FALSE","source":"Đoạn G (PDF trang 207)","evidence":"Today, American consumers are buffeted by an assortment of pressures. Never before have consumers had as many choices in areas like financial services, travel, telephone services, and supermarket products. Not long ago, the average supermarket carried 9,000 items; today, it carries 22,000. The consumer's need, therefore, for information expressed in plain English is more critical than ever.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “Today, American consumers are buffeted by an assortment of pressures.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Compared with situation of the past, consumers are now facing less intensity of label reading pressure in supermarket in America.”\n- Passage: “Today, American consumers are buffeted by an assortment of pressures.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."}]}];
const STORE_KEY='IELTS_TFNG_43_BANK_V1';
let state={studentName:'',progress:{}};
let currentEx=null;
let homeFilter='pending';
let searchText='';
let saveTimer=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalize(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]+/g,' ').replace(/\s+/g,' ').trim();}
function nowTime(){return new Date().toLocaleTimeString('vi-VN',{hour12:false});}
function load(){try{const x=localStorage.getItem(STORE_KEY);if(x){const parsed=JSON.parse(x);if(parsed&&typeof parsed==='object') state={studentName:parsed.studentName||'',progress:parsed.progress||{}};}}catch(e){showToast('Không thể đọc dữ liệu đã lưu. Bạn vẫn có thể làm bài trong phiên này.');}}
function save(immediate=false){const doSave=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(state));const el=document.getElementById('saveState');if(el)el.textContent='Đã lưu lúc '+nowTime();}catch(e){showToast('Trình duyệt không cho phép lưu tiến độ. Đừng đóng trang trong khi đang làm bài.');}};if(immediate){clearTimeout(saveTimer);doSave()}else{clearTimeout(saveTimer);saveTimer=setTimeout(doSave,220)}}
function getP(exId){if(!state.progress[exId]) state.progress[exId]={answers:{},submitted:false,score:0,startedAt:null,submittedAt:null,highlights:[]};const p=state.progress[exId];p.answers=p.answers||{};p.highlights=p.highlights||[];return p;}
function exerciseById(id){return BANK.find(x=>x.id===Number(id));}
function completedCount(){return Object.values(state.progress).filter(p=>p&&p.submitted).length}
function attemptedCount(){return Object.values(state.progress).filter(p=>p&&p.startedAt&&!p.submitted).length}
function totalCorrect(){return Object.values(state.progress).filter(p=>p&&p.submitted).reduce((a,p)=>a+(p.score||0),0)}
function totalDoneQuestions(){return Object.entries(state.progress).filter(([,p])=>p&&p.submitted).reduce((a,[id,p])=>a+exerciseById(id).questions.length,0)}
function showToast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}

function renderHome(){currentEx=null;document.body.className='';const done=completedCount(), inprog=attemptedCount(), tc=totalCorrect(), tq=totalDoneQuestions();const acc=tq?Math.round(tc*100/tq):0;
  const list=BANK.filter(ex=>{const p=state.progress[ex.id];const isDone=!!p?.submitted;const isProg=!!p?.startedAt&&!isDone;if(homeFilter==='pending'&&isDone)return false;if(homeFilter==='done'&&!isDone)return false;if(searchText&&!(('exercise '+ex.id+' '+ex.title).toLowerCase().includes(searchText.toLowerCase())))return false;return true;});
  document.getElementById('app').innerHTML=`<div class="top-brand">IELTS READING PRACTICE · TRUE / FALSE / NOT GIVEN</div><main class="home"><section class="hero"><div><h1>Kho luyện tập TRUE / FALSE / NOT GIVEN</h1><p>43 Exercises · 233 câu · Không giới hạn thời gian · Tự lưu tiến độ trên trình duyệt này</p></div><div class="namebox"><input id="studentName" aria-label="Họ và tên học sinh" placeholder="Họ và tên học sinh" value="${esc(state.studentName)}"><button class="secondary" id="saveName">LƯU TÊN</button></div></section>
  <section class="stats"><div class="stat"><b>${done}/43</b><span>Exercise đã hoàn thành</span></div><div class="stat"><b>${43-done}</b><span>Exercise chưa làm</span></div><div class="stat"><b>${inprog}</b><span>Đang làm dở</span></div><div class="stat"><b>${acc}%</b><span>Độ chính xác đã làm</span></div></section>
  <section class="toolbar"><button class="filter ${homeFilter==='pending'?'active':''}" data-filter="pending">CHƯA LÀM</button><button class="filter ${homeFilter==='all'?'active':''}" data-filter="all">TẤT CẢ</button><button class="filter ${homeFilter==='done'?'active':''}" data-filter="done">ĐÃ LÀM</button><input id="search" class="search" placeholder="Tìm Exercise hoặc tiêu đề..." value="${esc(searchText)}"></section>
  <section class="exercise-list">${list.length?list.map(ex=>exerciseCard(ex)).join(''):'<div class="empty">Không có Exercise phù hợp với bộ lọc hiện tại.</div>'}</section></main>`;
  document.getElementById('saveName').onclick=()=>{state.studentName=document.getElementById('studentName').value.trim();save(true);showToast('Đã lưu tên học sinh.');renderHome()};
  document.getElementById('studentName').onchange=e=>{state.studentName=e.target.value.trim();save(true)};
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{homeFilter=b.dataset.filter;renderHome()});
  document.getElementById('search').oninput=e=>{searchText=e.target.value;renderHome()};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openExercise(Number(b.dataset.open)));
}
function exerciseCard(ex){const p=state.progress[ex.id];const done=!!p?.submitted;const prog=!!p?.startedAt&&!done;const status=done?`<span class="status done">✓ ĐÃ HOÀN THÀNH · ${p.score}/${ex.questions.length}</span>`:prog?'<span class="status progress">● ĐANG LÀM DỞ</span>':'<span class="status new">CHƯA LÀM</span>';const btn=done?'XEM LẠI':prog?'TIẾP TỤC':'BẮT ĐẦU';return `<article class="ex-card"><div class="ex-num">${ex.id}</div><div><h3>Exercise ${ex.id}: ${esc(ex.title)}</h3><div class="meta">${ex.questions.length} câu TRUE / FALSE / NOT GIVEN</div>${status}</div><div><button class="${done?'ghost':'primary'}" data-open="${ex.id}">${btn}</button></div></article>`}

function openExercise(id){if(!state.studentName.trim()){showToast('Vui lòng nhập và lưu họ tên học sinh trước khi bắt đầu.');document.getElementById('studentName')?.focus();return}currentEx=id;const p=getP(id);if(!p.startedAt){p.startedAt=new Date().toISOString();save(true)}renderPractice()}
function renderPractice(){const ex=exerciseById(currentEx),p=getP(currentEx);document.body.className='';const answered=ex.questions.filter(q=>p.answers[q.n]).length;const submitted=!!p.submitted;const mobilePassage=document.getElementById('app').querySelector?.('.practice.show-passage')?true:false;
  document.getElementById('app').innerHTML=`<div class="practice ${submitted?'submitted':''}" id="practice"><header class="exam-top"><button class="backbtn" id="backHome">← DANH SÁCH</button><div class="exam-title"><strong>Exercise ${ex.id}: ${esc(ex.title)}</strong><small>${esc(state.studentName)} · ${ex.questions.length} câu</small></div><span class="save-state" id="saveState">Tự động lưu</span><span class="top-info">Đã trả lời: <b id="topAnswered">${answered}/${ex.questions.length}</b></span><button class="mobile-toggle" id="mobileToggle">BÀI ĐỌC</button>${submitted?'':'<button class="primary" id="submitTop">NỘP BÀI</button>'}</header>
  <div class="exam-sub"><b style="font-size:12px;color:#58636e">CÂU HỎI</b><div class="qnav">${ex.questions.map(q=>qChip(q,p)).join('')}</div></div>
  <main class="workspace"><section class="pane passage-pane" id="passagePane"><div class="passage-heading"><div class="eyebrow">READING PASSAGE · EXERCISE ${ex.id}</div><h2>${esc(ex.title)}</h2></div><div class="passage-body" id="passageBody">${renderPassage(ex,p)}</div></section><section class="pane question-pane" id="questionPane">${submitted?renderResults(ex,p):renderQuestions(ex,p)}</section></main></div>`;
  bindPractice(ex,p,submitted);
}
function renderPassage(ex,p){return ex.passage.map((txt,i)=>{let t=txt;const m=t.match(/^([A-H])\s+(.+)/);let prefix='';if(m){prefix=`<span class="section-letter">${m[1]}</span>`;t=m[2]}let body=applyHighlights(t,p.highlights||[]);return `<p id="p-${i}" data-pidx="${i}">${prefix}${body}</p>`}).join('')}
function applyHighlights(text,highlights){let ranges=[];const lower=text.toLowerCase();(highlights||[]).forEach(h=>{const s=String(h).trim();if(s.length<3)return;const idx=lower.indexOf(s.toLowerCase());if(idx>=0)ranges.push([idx,idx+s.length,s])});ranges.sort((a,b)=>a[0]-b[0]);let merged=[],last=-1;for(const r of ranges){if(r[0]>=last){merged.push(r);last=r[1]}}let out='',pos=0;for(const [a,b,s] of merged){out+=esc(text.slice(pos,a))+`<mark data-hl="${esc(s)}" title="Nhấp để bỏ tô">${esc(text.slice(a,b))}</mark>`;pos=b}out+=esc(text.slice(pos));return out}
function qChip(q,p){let cls='';if(p.submitted){const ans=p.answers[q.n]||'';cls=!ans?'blank':ans===q.answer?'correct':'wrong'}else if(p.answers[q.n])cls='answered';return `<button class="qchip ${cls}" data-jump="${q.n}">${q.n}</button>`}
function renderQuestions(ex,p){return `<div class="instructions"><b>Do the following statements agree with the information given in the Reading Passage?</b><br>Chọn <b>TRUE</b> nếu statement đúng với bài; <b>FALSE</b> nếu mâu thuẫn; <b>NOT GIVEN</b> nếu bài không cung cấp đủ thông tin.</div>${ex.questions.map(q=>questionCard(q,p)).join('')}<div class="submitbar"><span class="answered-count" id="answerCount">Đã trả lời ${ex.questions.filter(q=>p.answers[q.n]).length}/${ex.questions.length}</span><button class="primary" id="submitBottom">NỘP BÀI</button></div>`}
function questionCard(q,p){const a=p.answers[q.n]||'';return `<article class="question-card" id="q-${q.n}"><div class="qhead"><div class="qnumber">${q.n}</div><div class="qtext">${esc(q.text)}</div></div><div class="choices" role="radiogroup" aria-label="Câu ${q.n}">${['TRUE','FALSE','NOT GIVEN'].map(v=>`<label class="choice"><input type="radio" name="q${q.n}" value="${v}" ${a===v?'checked':''}><span>${v}</span></label>`).join('')}</div></article>`}
function renderResults(ex,p){const score=p.score||0;const pct=Math.round(score*100/ex.questions.length);return `<section class="result-summary"><h2>KẾT QUẢ · EXERCISE ${ex.id}</h2><div class="scoreline"><span class="scorebig">${score}/${ex.questions.length}</span><span><b>${pct}%</b> chính xác · ${ex.questions.length-score} câu cần xem lại</span></div><div class="result-actions"><button class="secondary" id="copyResult">SAO CHÉP KẾT QUẢ</button><button class="ghost" id="backHome2">VỀ DANH SÁCH</button><button class="danger" id="resetEx">XÓA KẾT QUẢ & LÀM LẠI</button></div></section>${ex.questions.map(q=>reviewCard(ex,q,p)).join('')}`}
function reviewCard(ex,q,p){const stu=p.answers[q.n]||'';const blank=!stu;const ok=stu===q.answer;const cls=blank?'blank':ok?'good':'bad';const status=blank?'BỎ TRỐNG':ok?'ĐÚNG':'SAI';return `<article class="review-card ${cls}" id="q-${q.n}"><div class="qhead"><div class="qnumber">${q.n}</div><div><div class="qtext">${esc(q.text)}</div><div class="result-label ${ok?'good':'bad'}">${status}</div></div></div><div class="review-grid"><div class="mini"><b>TRẢ LỜI CỦA HỌC SINH</b>${esc(stu||'—')}</div><div class="mini"><b>ĐÁP ÁN ĐÚNG</b>${esc(q.answer)}</div></div><div class="source">${esc(q.source||'Vị trí bằng chứng trong passage')}</div><div class="evidence">“${esc(q.evidence)}”</div><div class="explain">${esc(q.explanation)}</div>${q.paraphrase?`<div class="paraphrase"><b>Paraphrase</b>\n${esc(q.paraphrase)}</div>`:''}<button class="locate" data-locate="${q.n}">XEM VỊ TRÍ TRONG BÀI ĐỌC</button></article>`}

function bindPractice(ex,p,submitted){document.getElementById('backHome').onclick=()=>{save(true);renderHome()};document.getElementById('backHome2')?.addEventListener('click',renderHome);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const q=document.getElementById('q-'+b.dataset.jump);q?.scrollIntoView({behavior:'smooth',block:'center'})});
  if(!submitted){document.querySelectorAll('.choice input').forEach(inp=>inp.onchange=e=>{const n=Number(e.target.name.slice(1));p.answers[n]=e.target.value;save();updateAnswered(ex,p)});document.getElementById('submitTop').onclick=()=>confirmSubmit(ex,p);document.getElementById('submitBottom').onclick=()=>confirmSubmit(ex,p)}
  document.querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>locateEvidence(ex,ex.questions.find(q=>q.n===Number(b.dataset.locate))));document.getElementById('copyResult')?.addEventListener('click',()=>copyResult(ex,p));document.getElementById('resetEx')?.addEventListener('click',()=>confirmReset(ex));
  const toggle=document.getElementById('mobileToggle');if(toggle)toggle.onclick=()=>{const pr=document.getElementById('practice');pr.classList.toggle('show-passage');toggle.textContent=pr.classList.contains('show-passage')?'CÂU HỎI':'BÀI ĐỌC'};
  bindHighlight(ex,p);
}
function updateAnswered(ex,p){const c=ex.questions.filter(q=>p.answers[q.n]).length;document.getElementById('topAnswered').textContent=`${c}/${ex.questions.length}`;document.getElementById('answerCount').textContent=`Đã trả lời ${c}/${ex.questions.length}`;ex.questions.forEach(q=>{const ch=document.querySelector(`[data-jump="${q.n}"]`);ch?.classList.toggle('answered',!!p.answers[q.n])})}
function confirmSubmit(ex,p){const unanswered=ex.questions.filter(q=>!p.answers[q.n]).map(q=>q.n);showModal('Xác nhận nộp bài',`Bạn đã trả lời <b>${ex.questions.length-unanswered.length}/${ex.questions.length}</b> câu.${unanswered.length?`<br>Câu chưa trả lời: <b>${unanswered.join(', ')}</b>.`:''}<br><br>Sau khi nộp, bài sẽ bị khóa và hiển thị giải thích chi tiết.`,[{text:'TIẾP TỤC LÀM BÀI',cls:'ghost'},{text:'XÁC NHẬN NỘP BÀI',cls:'primary',action:()=>submitExercise(ex,p)}])}
function submitExercise(ex,p){if(p.submitted)return;let score=0;ex.questions.forEach(q=>{if((p.answers[q.n]||'')===q.answer)score++});p.submitted=true;p.score=score;p.submittedAt=new Date().toISOString();save(true);renderPractice();setTimeout(()=>document.getElementById('questionPane')?.scrollTo({top:0,behavior:'smooth'}),50)}
function confirmReset(ex){showModal('Xóa kết quả Exercise '+ex.id,'Bạn có chắc muốn xóa toàn bộ câu trả lời, kết quả và phần tô vàng của Exercise này để làm lại từ đầu không?',[{text:'HỦY',cls:'ghost'},{text:'XÓA & LÀM LẠI',cls:'danger',action:()=>{delete state.progress[ex.id];save(true);openExercise(ex.id)}}])}
function showModal(title,body,buttons){const back=document.createElement('div');back.className='modal-back';back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${body}</p><div class="modal-actions"></div></div>`;const act=back.querySelector('.modal-actions');buttons.forEach((b,i)=>{const btn=document.createElement('button');btn.className=b.cls||'ghost';btn.textContent=b.text;btn.onclick=()=>{back.remove();b.action?.()};act.appendChild(btn)});back.onclick=e=>{if(e.target===back)back.remove()};document.body.appendChild(back);const first=act.querySelector('button');first?.focus();const escFn=e=>{if(e.key==='Escape'){back.remove();document.removeEventListener('keydown',escFn)}};document.addEventListener('keydown',escFn)}
function locateEvidence(ex,q){const pane=document.getElementById('passagePane');const ps=[...document.querySelectorAll('#passageBody p')];if(!ps.length)return;const toks=[...new Set(normalize(q.evidence).split(' ').filter(w=>w.length>3))];let best=null,bestScore=-1;ps.forEach(p=>{const n=normalize(p.textContent);let s=0;toks.forEach(w=>{if(n.includes(w))s++});if(s>bestScore){bestScore=s;best=p}});if(best){best.classList.add('flash');best.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>best.classList.remove('flash'),2600);if(window.innerWidth<=900){document.getElementById('practice').classList.add('show-passage');document.getElementById('mobileToggle').textContent='CÂU HỎI'}}}
function copyResult(ex,p){let lines=[];lines.push('IELTS READING – TRUE/FALSE/NOT GIVEN');lines.push(`Exercise ${ex.id}: ${ex.title}`);lines.push(`Họ tên: ${state.studentName}`);lines.push(`Kết quả: ${p.score}/${ex.questions.length} (${Math.round(p.score*100/ex.questions.length)}%)`);lines.push(`Thời điểm nộp: ${p.submittedAt?new Date(p.submittedAt).toLocaleString('vi-VN'):''}`);lines.push('');ex.questions.forEach(q=>{const stu=p.answers[q.n]||'BỎ TRỐNG';lines.push(`${q.n}. ${q.text}`);lines.push(`Học sinh: ${stu}`);lines.push(`Đáp án: ${q.answer}`);lines.push(`Kết quả: ${stu===q.answer?'ĐÚNG':stu==='BỎ TRỐNG'?'BỎ TRỐNG':'SAI'}`);lines.push(`${q.source}`);lines.push(`Bằng chứng: ${q.evidence}`);lines.push(`Giải thích: ${q.explanation}`);if(q.paraphrase)lines.push(`Paraphrase: ${q.paraphrase}`);lines.push('')});const text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('Đã sao chép toàn bộ kết quả.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Đã sao chép toàn bộ kết quả.')}catch(e){showToast('Không thể tự động sao chép. Vui lòng sao chép thủ công.')}ta.remove()}
function bindHighlight(ex,p){const body=document.getElementById('passageBody'),tip=document.getElementById('hlTip'),btn=document.getElementById('hlBtn');if(!body)return;body.onmouseup=e=>{setTimeout(()=>{const sel=window.getSelection();const txt=sel?.toString().trim();if(!txt||txt.length<3||txt.length>220){tip.classList.add('hidden');return}const range=sel.getRangeAt(0);if(!body.contains(range.commonAncestorContainer)){tip.classList.add('hidden');return}tip.style.left=Math.min(window.innerWidth-100,e.clientX+8)+'px';tip.style.top=Math.max(60,e.clientY-35)+'px';tip.classList.remove('hidden');btn.onclick=()=>{if(!(p.highlights||[]).some(x=>x.toLowerCase()===txt.toLowerCase()))p.highlights.push(txt);save(true);tip.classList.add('hidden');window.getSelection()?.removeAllRanges();renderPractice()}} ,0)};body.onclick=e=>{if(e.target.tagName==='MARK'){const h=e.target.dataset.hl;p.highlights=(p.highlights||[]).filter(x=>x!==h);save(true);renderPractice()}};document.addEventListener('mousedown',e=>{if(!tip.contains(e.target)&&e.target!==body)tip.classList.add('hidden')},{once:true})}

load();renderHome();
</script>

<script id="ielts-dual-pane-layout-runtime">
(function(){
  function visible(el){
    if(!el) return false;
    if(el.classList && el.classList.contains('hidden')) return false;
    const s = window.getComputedStyle(el);
    if(s.display === 'none' || s.visibility === 'hidden') return false;
    return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  }

  function syncExamLock(){
    const candidates = Array.from(document.querySelectorAll('.exam,.practice,#exam-screen'));
    const active = candidates.some(visible);
    document.documentElement.classList.toggle('ielts-exam-active', active);
    if(document.body) document.body.classList.toggle('ielts-exam-active', active);
  }

  function start(){
    syncExamLock();
    const obs = new MutationObserver(syncExamLock);
    obs.observe(document.documentElement,{
      subtree:true,
      childList:true,
      attributes:true,
      attributeFilter:['class','style','hidden']
    });
    window.addEventListener('resize', syncExamLock, {passive:true});
    window.addEventListener('orientationchange', syncExamLock, {passive:true});
    document.addEventListener('click', function(){ setTimeout(syncExamLock,0); }, {passive:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }else{
    start();
  }
})();
</script>
<!-- IELTS_DUAL_PANE_PATCH_SCRIPT_END -->
