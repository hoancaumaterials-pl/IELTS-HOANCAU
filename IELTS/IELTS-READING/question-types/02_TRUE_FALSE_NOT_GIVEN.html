ông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…copies that smelled bad, were hard to read, didn’t last long and tended to curl up into tubes.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The earliest languages were recorded on papyrus.”\n- Passage: “…copies that smelled bad, were hard to read, didn’t last long and tended to curl up into tubes.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":2,"text":"When applying Johann Gutenberg’s printing machine, it requires lots of training.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 128)","evidence":"Until Johann Gutenberg invented the printing press in the mid-1400s, producing a book in an edition of more than one generally meant writing it out again. Printing with moveable type was not copying, however. Gutenberg couldn’t take a document that already existed, feed it into his printing press and run off facsimiles.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Until Johann Gutenberg invented the printing press in the mid-1400s, producing a book in an edition of more than one generally meant writing it out again.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Gutenberg’s printing machine, it requires lots of training” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “When applying Johann Gutenberg’s printing machine, it requires lots of training.”\n- Passage: “Until Johann Gutenberg invented the printing press in the mid-1400s, producing a book in an edition of more than one generally meant writing it out again.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":3,"text":"James Watt invented modern steam engine before he made his first mechanical copier.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 128)","evidence":"The first true mechanical copier was manufactured in 1780, when James Watt, who is better known as the inventor of the modern steam engine, created the copying press.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The first true mechanical copier was manufactured in 1780, when James Watt, who is better known as the inventor of the modern steam engine, created the copying press.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “first mechanical copier” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “James Watt invented modern steam engine before he made his first mechanical copier.”\n- Passage: “The first true mechanical copier was manufactured in 1780, when James Watt, who is better known as the inventor of the modern steam engine, created the copying press.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":4,"text":"Using the Dupliton copiers and follower versions are very costly.","answer":"TRUE","source":"Đoạn 2 (PDF trang 129)","evidence":"Competing manufacturers soon introduced other copying technologies and marketed machines called Dupliton, Dial- A-Matic Autostat, Verifax, Copease and Copymation.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Competing manufacturers soon introduced other copying technologies and marketed machines called Dupliton, Dial- A-Matic Autostat, Verifax, Copease and Copymation.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Using the Dupliton copiers and follower versions are very costly.”\n- Passage: “Competing manufacturers soon introduced other copying technologies and marketed machines called Dupliton, Dial- A-Matic Autostat, Verifax, Copease and Copymation.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":5,"text":"The typewriters with carbon papers were taken place of very soon because they were not sold well.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 129)","evidence":"All required expensive chemically treated papers. And all made copies that smelled bad, were hard to read, didn’t last long and tended to curl up into tubes. The machines were displaced, beginning in the late 1800s, by a combination of two 19th century inventions: the typewriter and carbon paper.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “All required expensive chemically treated papers.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “because they were not sold well” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The typewriters with carbon papers were taken place of very soon because they were not sold well.”\n- Passage: “All required expensive chemically treated papers.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":6,"text":"The Haloid Xerox 914 model also required specially treated paper for making copies.","answer":"FALSE","source":"Đoạn 3 (PDF trang 129)","evidence":"That company had been founded in 1906 as the Haloid Company and is known today as the Xerox Corporation. In 1959, it introduced an office copier called the Haloid Xerox 914, a machine that, unlike its numerous competitors, made sharp, permanent copies on ordinary paper—a huge breakthrough.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “That company had been founded in 1906 as the Haloid Company and is known today as the Xerox Corporation.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The Haloid Xerox 914 model also required specially treated paper for making copies.”\n- Passage: “That company had been founded in 1906 as the Haloid Company and is known today as the Xerox Corporation.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."}]},{"id":26,"title":"The concept of childhood in the western countries","passage":["The history of childhood has been a topic of interest in social history since the highly influential 1960 book Centuries of Childhood, written by French historian Philippe Ariés. He argued that \"childhood\" is a concept created by modern society.","A One of the most hotly debated issues in the history of childhood has been whether childhood is itself a recent invention. The historian Philippe . Aries argued that in Western Europe during Finny 4s 4» the Middle Ages (up to about the end of the miniature adults, with all the intellect and personality that this implies. He scrutinized medieval pictures and diaries, and found no distinction between children and adults as they shared similar leisure activities and often the same type of work. Aries, however, pointed out that this is not to suggest that children were neglected, forsaken or despised. The idea of childhood is not to be confused with affection for children; it corresponds to an awareness of the particular nature of childhood, that particular nature which distinguishes the child from the adult, even the young adult.","B There is a long tradition of the children of the poor playing a functional role in contributing to the family income by working either inside or outside the home. In this sense children are seen as ‘useful. Back in the Middle Ages, children as young as 5 or 6 did important chores for their parents and, from the sixteenth century, were often encouraged (or forced) to leave the family by the age of 9 or 10 to work as servants for wealthier families or to be apprenticed to a trade. Cc With industrialization in the eighteenth and nineteenth centuries, a new","demand for child labour was created, and many children were forced to work for long hours, in mines, workshops and factories. Social reformers began to question whether labouring long hours from an early age would harm children’s growing bodies. They began to recognize the potential of carrying out systematic studies to monitor how far these early deprivations might be affecting children's development.","Gradually, the concerns of the reformers began to impact on the working conditions of children. In Britain, the Factory Act of 1833 (IELTS test papers protection of children from exploitation and was linked to the rise of schools for factory children. The worst forms of child exploitation were gradually eliminated, partly through factory reform but also through the influence of trade unions and economic changes during the nineteenth century which made some forms of child labour redundant. Childhood was increasingly seen as a time for play and education for all children, not just for a privileged minority. Initiating children into work as ‘useful’ children became less of a priority. As the age for starting full-time work was delayed, so childhood was increasingly understood as a more extended phase of dependency, Bi development and learning. Even so, work continued to play a significant, if less central role in children’s lives throughout the later nineteenth and twentieth century. And the ‘useful child’ has become a_ controversial image during the first decade of the twenty-first century especially in the context of global concern about large numbers of the world’s children engaged in child labour .","The Factory Act of 1833 established half-time schools which allowed children to work and attend school. But in the 1840s, a large proportion of children never went to school, and if they did, they left by the age of 10 or 11 .The situation was very different by the end of the nineteenth century in Britain. The school became central to images of ‘a normal’ childhood .","Attending school was no longer a privilege and all children were expected to spend a significant part of their day in a classroom. By going to school, children's lives were now separated from domestic life at home and from the adult world of work. School became an institution dedicated to shaping the minds, behaviour and morals of the young. Education dominated the management of children’s waking hours, not just through the hours spent in classrooms but through ‘home’ work, the growth of ‘after school’ activities and the importance attached to ‘parental involvement.","G Industrialization, urbanization and mass schooling also set new challenges for those responsible for protecting children’s welfare, and io promoting their learning. Increasingly, children were being treated as a group with distinctive needs and they were organized into groups according to eT their age. For example, teachers needed to know what to expect of children in their classrooms, what kinds of instruction were appropriate for different 1b age groups and how best to assess children's progress. They also wanted tools that could enable them to sort and select children according to their abilities and potential. ER, ORAALR, WF MappetMMSRKAAMMEFRE"],"questions":[{"n":28,"text":"Aries pointed out that children did different types of work as adults during the Middle Age.","answer":"FALSE","source":"Đoạn 1 (PDF trang 133)","evidence":"…found no distinction between children and adults as they shared similar leisure activities and often the same type of work. Aries, however, pointed out that this is not to suggest that children were neglected, forsaken or despised.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “…found no distinction between children and adults as they shared similar leisure activities and often the same type of work.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Aries pointed out that children did different types of work as adults during the Middle Age.”\n- Passage: “…found no distinction between children and adults as they shared similar leisure activities and often the same type of work.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":29,"text":"During the Middle Age, going to work necessarily means children were unloved indicated by Aries.","answer":"FALSE","source":"Đoạn 1 (PDF trang 133)","evidence":"…this is not to suggest that children were neglected, forsaken or despised. The idea of childhood is not to be confused with affection for children; it corresponds to an awareness of the particular nature of childhood, that particular nature which distinguishes the child from the adult, even the young adult.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “…this is not to suggest that children were neglected, forsaken or despised.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “During the Middle Age, going to work necessarily means children were unloved indicated by Aries.”\n- Passage: “…this is not to suggest that children were neglected, forsaken or despised.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":30,"text":"Scientists think that overworked labour damages the health of young children.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 134)","evidence":"…Social reformers began to question whether labouring long hours from an early age would harm children’s growing bodies. They began to recognize the potential of carrying out systematic studies to monitor how far these early deprivations might be affecting children's development.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “…Social reformers began to question whether labouring long hours from an early age would harm children’s growing bodies.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “overworked labour damages the health of young children” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp á inese Chariots","passage":["A The Shang Dynasty or Yin Dynasty, according to traditional historiography, ruled in the Yellow River valley in the second millennium Archaeological work at the Ruins A es i. rae of Yin (near modern-day Anyang), which has oT Si] 4 oe) uncovered eleven major Yin royal tombs and the foundations of palaces and ritual sites, containing weapons of war and remains from both animal and human sacrifices.","The Tomb of Fu Hao is an archaeological site at Yinxu, the ruins of the ancient Shang Dynasty capital Yin, within the modern city of Anyang in Henan Province, China. Discovered in 1976, it was identified as the final resting place of the queen and military general Fu Hao. The artifacts unearthed within the grave included jade objects, bone objects, bronze objects etc. These grave goods are confirmed by the oracle texts, which constitute almost all of the first hand written record we possess of the Shang Dynasty. Below the corpse was a small pit __ pss holding the remains of six sacrificial dogs and along the edge lay the skeletons of human slaves, evidence of human sacrifice.","C The Terracotta Army was discovered on 29 March 1974 to the east of Xi’an in","Shaanxi. The terracotta soldiers were accidentally discovered when a group of local farmers was digging a well during a drought around 1.6 km (I mile) east of the Qin Emperors tomb around at Mount Li (Lishan), a region riddled with underground springs and watercourses. Experts currently place the entire number of soldiers at 8,000 — with 130 chariots (130 cm long), 530 horses and 150 cavalry horses helping to ward of any dangers in the afterlife. In contrast, the burial of Tutank hamun yielded six complete but dismantled chariots of unparalleled richness and sophistication. Each was designed for two people cm long) and had its axle sawn through to enable it to be brought along the narrow corridor into the tomb.","D Excavation of ancient Chinese chariots has confirmed the descriptions of them in 2 the earliest texts. Wheels were constructed from a variety of woods: elm provided 3 the hub, rose-wood the spokes and oak the felloes. The hub was drilled through to 4 form an empty space into which the tampering axle was fitted, the whole being 5 covered with leather to retain lubricating oil. Though the number of spokes varied, 6 a wheel by the fourth century BC usually had eighteen to thirty-two of them. z Records show how elaborate was the testing of each completed wheel: flotation 9 and weighing were regarded as 10 the best measures of balance, i but even the empty spaces in 12 the assembly were checked ee axle 15 asset of the ancient Chinese ; »»» ud refers to the dishlike shape of 20 which looks rather like a flat 21 cone. On occasion they chose 22 to strengthen a dished wheel B2 SARSSER 23 with a pair of struts running 24 from rim to rim on each of the hub. As these extra supports were inserted 25 separately into the felloes, they would have added even greater strength to the z wheel. Leather wrapped up the edge of the wheel aimed to retain bronze. 30 3 ERAMMAA, RAB RARA MPAA AGB : 31 3 ES, RBALA, WF Mapp, CAM)SREAMMRPRE \"ocean eran ecdn eran acarecanecarecdrecarecdrecarecerecarecaree® 36 Within a millennium, however, Chinese chariot-makers had developed a vehicle 37 with shafts, the precursor of the true carriage or cart. This design did not make its 38 appearance in Europe until the end of the Roman Empire. Because the shafts 39 . .","40 curved upwards, and the harness pressed against a horse’s shoulders, not his neck, 41 the shaft chariot was incredibly efficient. The halberd was also part of a chariot 42 standard weaponry. This halberd usually measured well over 3 metres in length, 43 which meant that a chariot warrior wielding it sideways could strike down the 44 charioteer in a passing chariot. The speed of chariot which was tested on the sand 45 was quite fast. At speed these passes were very dangerous for the crews of both 46 chariots.","F The advantages offered by the new chariots were not entirely missed. They could","see how there were literally the warring states, whose conflicts lasted down the Qin unification of China. Qin Shi Huang was buried in the most opulent tomb complex ever constructed in China, a sprawling, city-size collection of underground caverns containing everything the emperor would need for the afterlife. Even a collection of terracotta armies called Terra- Cotta Warriors was buried in it. The ancient Chinese, along with many cultures including ancient Egyptians, believed that items and even people buried with a person could be taken with him to the afterlife. Rie OE — RA TAA El OSC), TARR TR AS AE tH IC HE Lk RSME MEF, appht beep e oR RAM, RB, Reet AHA IAM, I2RWID, HARVETS, MRietk? (rst SEA, CHT, SMART TRO BD? MAF, Bs."],"questions":[{"n":1,"text":"When discovered, the written records of the grave goods proved to be accurate.","answer":"TRUE","source":"Đoạn 2 (PDF trang 138)","evidence":"…Chariots A The Shang Dynasty or Yin Dynasty, according to traditional historiography, ruled in the Yellow River valley in the second millennium Archaeological work at the Ruins A es i.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Chariots A The Shang Dynasty or Yin Dynasty, according to traditional historiography, ruled in the Yellow River valley in the second millennium Archaeological work at the Ruins A es i.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “When discovered, the written records of the grave goods proved to be accurate.”\n- Passage: “…Chariots A The Shang Dynasty or Yin Dynasty, according to traditional historiography, ruled in the Yellow River valley in the second millennium Archaeological work at the Ruins A es i.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"Human skeletons in Anyang tomb were identified as soldiers who were killed in the war.","answer":"FALSE","source":"Đoạn 3 (PDF trang 138)","evidence":"Below the corpse was a small pit __ pss holding the remains of six sacrificial dogs and along the edge lay the skeletons of human slaves, evidence of human sacrifice. C The Terracotta Army was discovered on 29 March 1974 to the east of Xi’an in Shaanxi. The terracotta soldiers were accidentally discovered when a group of local farmers was digging a well during a drought around 1.6 km (I mile) east of the Qin Emperors tomb around at Mount Li (Lishan), a region riddled with underground springs and watercourses.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “Below the corpse was a small pit __ pss holding the remains of six sacrificial dogs and along the edge lay the skeletons of human slaves, evidence of human sacrifice.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Human skeletons in Anyang tomb were identified as soldiers who were killed in the war.”\n- Passage: “Below the corpse was a small pit __ pss holding the remains of six sacrificial dogs and along the edge lay the skeletons of human slaves, evidence of human sacrifice.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":3,"text":"The Terracotta Army was discovered by people lived nearby by chance.","answer":"TRUE","source":"Đoạn 3 (PDF trang 138)","evidence":"C The Terracotta Army was discovered on 29 March 1974 to the east of Xi’an in Shaanxi.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “C The Terracotta Army was discovered on 29 March 1974 to the east of Xi’an in Shaanxi.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The Terracotta Army was discovered by people lived nearby by chance.”\n- Passage: “C The Terracotta Army was discovered on 29 March 1974 to the east of Xi’an in Shaanxi.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":4,"text":"The size of the King Tutankhamen’s tomb is bigger than that of in Qin Emperor’s tomb.","answer":"NOT GIVEN","source":"Đoạn 3 (PDF trang 140)","evidence":"Qin Shi Huang was buried in the most opulent tomb complex ever constructed in China, a sprawling, city-size collection of underground caverns containing everything the emperor would need for the afterlife.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Qin Shi Huang was buried in the most opulent tomb complex ever constructed in China, a sprawling, city-size collection of underground caverns containing everything the emperor would need for the afterlife.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “bigger than that of in Qin Emperor’s tomb” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The size of the King Tutankhamen’s tomb is bigger than that of in Qin Emperor’s tomb.”\n- Passage: “Qin Shi Huang was buried in the most opulent tomb complex ever constructed in China, a sprawling, city-size collection of underground caverns containing everything the emperor would need for the afterlife.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":28,"title":"The History of building Telegraph lines","passage":["A The idea of electrical communication seems to have begun as long ago as 1746, when about 200 monks at monastery in Paris arranged themselves in a line over a mile long, each holding ends of 25 ft iron wires. The abbot, also a scientist, discharged a primitive electrical ge. battery into the wire, giving all the monks Brinn Teo ber sivingal them - . a simultaneous electrical shock. “This all important because, firstly, they all said","‘ow’ which showed that you were sending a signal right along the line; and, secondly, they all said ‘ow’ at the same time, and that meant that you were sending the signal very quickly, \"explains Tom Standage , author of the Victorian Internet and technology editor at the Economist. Given a more humane detection system, this could be a way of signaling over long distances.","With wars in Europe and colonies beyond, such a signalling system was urgently needed. All sorts of electrical possibilities were proposed, some of them quite ridiculous. Two Englishmen, William Cooke and Charles Wheatstone came up with a system in which dials were made to point at different letters, but that involved five wires and would have been expensive to construct.","Much simpler was that of an American, P Samuel Morse, whose system only required a single wire to send a code ‘of dots and dashes. At first, it was imagined that only a few highly skilled encoders would be able to use it but it soon became clear that many people could become proficient in Morse code. A system of lines strung on telegraph poles began to spread in Europe and America.","D The next problem was to cross the sea. Britain, as an island with an empire,","led the way. Any such cable had to be insulated and the first breakthrough came with the discovery that a rubber-like latex from a tropical tree on the Malay peninsula could do the trick. It was called gutta percha. The first attempt at a cross channel cable came in 1850. With thin wire and thick installation, it floated and had to be weighed down with lead pipe.","It never worked well as the effect of water on its electrical properties was not understood, and it is reputed that a French fishermen hooked out a section and took it home as a strange new form of seaweed. The cable was too big for a single boat so two had to start in the middle of the Atlantic, join their cables and sail in opposite directions. Amazingly, they succeeded in 1858, and this enabled Queen Victoria to send a telegraph message to President Buchanan. However, the 98-word message took more than 19 hours to send and a misguided attempt to increase the speed by increasing the voltage resulted in failure of the line a week later.","By 1870, a submarine cable was heading towards Australia. It seemed likely that it would come ashore at the northern port of Darwin from where it might connect around the coast to Queensland and New South Wakes. It was an undertaking more ambitious than spanning an ocean. Flocks of sheep had to be driven with the 400 workers to provide food They needed horses and bullock carts and, for the parched interior, camels. In the north, tropical rains left the teams flooded. In the centre, it seemed that they would die of thirst. One critical section in the red heart of Australia involved finding a route through the McDonnell mountain range and then finding water on the other side. The water was not only essential for the construction team. There had to be telegraph repeater stations every few hundred miles to boost the signal and the staff obviously had to have a supply of","water. Just as one mapping team was about to give up and resort to drinking brackish water, some aboriginals took pity on them. Altogether, 40,000 telegraph poles were used in the Australian overland wire. Some were cut from trees. Where there were no trees, or where termites ate the wood, steel poles were imported.","On Thursday, August 22, 1872, the overland line was compketed and the first messages could be sent across the continent; and within a few months, Australia was at last in direct contact with England via the submarine cable, too. The line remained in service to bring news of the Japanese attack on Darwin in 1942. it could cost several pounds to send a message and it might take several hours for it to reach its destination on the other side of the globe, but the world would never be same again. Governments could be in touch with their colonies. Traders could send cargoes based on demand and the latest prices. Newspapers could publish news that had just happened and was not many months old."],"questions":[{"n":1,"text":"In the research of French scientists, the metal lines were used to send message.","answer":"TRUE","source":"Đoạn 2 (PDF trang 142)","evidence":"…Telegraph lines A The idea of electrical communication seems to have begun as long ago as 1746, when about 200 monks at monastery in Paris arranged themselves in a line over a mile long, each holding ends of 25 ft iron wires.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…Telegraph lines A The idea of electrical communication seems to have begun as long ago as 1746, when about 200 monks at monastery in Paris arranged themselves in a line over a mile long, each holding ends of 25 ft iron wires.”. Khi đối chiếu theo mốc thời gian / trình tự, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng  1st overland line across the continent.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 144)","evidence":"On Thursday, August 22, 1872, the overland line was compketed and the first messages could be sent across the continent; and within a few months, Australia was at last in direct contact with England via the submarine cable, too.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “On Thursday, August 22, 1872, the overland line was compketed and the first messages could be sent across the continent; and within a few months, Australia was at last in direct contact with England via the submarine cable, too.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “to the 1st overland line across the continent” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “US Government offered fund to the 1st overland line across the continent.”\n- Passage: “On Thursday, August 22, 1872, the overland line was compketed and the first messages could be sent across the continent; and within a few months, Australia was at last in direct contact with England via the submarine cable, too.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":29,"title":"SOSUS: Listening to the Ocean","passage":["surface, yet, until quite recently, we knew less about their depths than we did about the surface of the Moon. Distant as it is, the Moon has been far more accessible to study because astronomers long have been able to look at its surface, first with the naked eye and then with the telescope-both instruments that focus light. And, with telescopes tuned to different wavelengths of light, modern astronomers can . not only analyze Earth’s atmosphere, but also Bian Ss + determine the temperature and composition of the Sun Until the twentieth century, however, no analogous of Earth’s oceans: Light, which can travel trillions of miles through the vast vacuum","Curious investigators long have been fascinated by sound and the way it travels in water. As early as 1490, Leonardo da Vinci observed: “If you cause your ship to stop and place the head of a long tube in the water and place the outer extremity to your ear, you will hear ships at a great distance from you.” In 1687, the first mathematical theory of sound propagation was published by Sir Isaac Newton in his Philosophiae Naturalis Principia Mathematica. Investigators were measuring the speed of sound in air beginning in the mid- seventeenth century, but it was not until 1826 that Daniel Colladon, a Swiss physicist, and Charles Sturm, a French mathematician, accurately measured its speed in water. Using a long tube to listen underwater (as da Vinci had suggested), they recorded how fast the sound of a submerged bell traveled across Lake Geneva. Their result-1,435 meters (1,569 yards) per second in water of 1.8 degrees Celsius (35 degrees Fahrenheit)- was only 3 meters per second off from the speed accepted today. What these investigators demonstrated was that water— whether fresh or salt- is an excellent medium for sound, transmitting it almost five times faster than its speed in air In 1877 and 1878, the British scientist John William Strutt, third Baron Rayleigh, published his two-volume seminal work, The Theory of Sound, often regarded as marking the beginning of the modern study of acoustics. The recipient of the Nobel","Prize for Physics in 1904 for his successful isolation of the element argon, Lord Rayleigh made key discoveries in the fields of acoustics and optics that are critical to the theory of wave propagation in fluids. Among other things, Lord Rayleigh was the first to describe a sound wave as a mathematical equation (the basis of all theoretical work on acoustics) and the first to describe how small particles in the atmosphere scatter certain wavelengths of sunlight, a principle that also applies to the behavior of sound waves in water.","A number of factors influence how far sound travels underwater and how long it lasts. For one, particles in seawater can reflect, scatter, and absorb certain frequencies of sound—just as certain wavelengths of light may be reflected, scattered, and absorbed by specific types of particles in the atmosphere. Seawater absorbs 30 times the amount of sound absorbed by distilled water, with specific chemicals (such as magnesium sulfate and boric acid) damping out certain frequencies of sound. Researchers also learned that low frequency sounds, whose long wavelengths generally pass over tiny particles, tend to travel farther without loss through absorption or scattering. Further work on the effects of salinity, temperature, and pressure on the speed of sound has yielded fascinating insights into the structure of the ocean. Speaking generally, the ocean is divided into horizontal layers in which sound speed is influenced more greatly by temperature in | j.4 the upper regions and by pressure in the lower depths. At , Arid the surface is a sun-warmed upper layer, the actual temperature and thickness of which varies with the season. At mid-latitudes, this layer tends to be isothermal, that is, een the temperature tends to be uniform throughout the layer rreagh = because the water is well mixed by the action of waves, winds, and convection currents; a sound signal moving down through this layer tends to travel at an almost constant speed. Next comes a transitional layer called the thermocline, in which temperature drops steadily with depth; as temperature falls, so does the speed of sound. as HR)","The U.S. Navy was quick to appreciate the usefulness of low-frequency sound and. the deep sound channel in extending the range at which it could detect submarines. In great secrecy during the 1950s, the U.S. Navy launched a project that went by the code name Jezebel; it would later come to be known as the Sound Surveillance System (SOSUS). The system involved arrays of underwater microphones, called hydrophones, that were placed on the ocean bottom and connected by cables to onshore processing centers. With SOSUS deployed in both deep and shallow waters along both coasts of North America and the British West Indies, the U.S. Navy not only could detect submarines in much of the northern hemisphere, it also could distinguish how many propellers a submarine had, whether it was conventional or nuclear, and sometimes even the class of sub. The realization that SOSUS could be used to listen to whales also was made by Christopher Clark, a biological acoustician at Cornell University, when he first visited a SOSUS station in 1992. When Clark looked at the graphic representations of","sound, scrolling 24 hours day, every day, he saw the voice patterns of blue, finback, minke, and humpback whales. He also could hear the sounds. Using a SOSUS receiver in the West Indies, he could hear whales that were 1,770 kilometers (1,100 miles) away. Whales are the biggest of Earth’s creatures. The blue whale, for example, can be 100 feet long and weigh as many tons. Yet these animals also are remarkably elusive. Scientists wish to observe blue time and position them on a map. Moreover, they can track not just one whale at a time, but many creatures simultaneously throughout the North Atlantic and the eastern North Pacific. They also can learn to distinguish whale calls. For example, Fox and colleagues have detected changes in the calls of finback whales during different seasons and have found that blue whales in different regions of the Pacific ocean have different calls. Whales firsthand must wait in their ships for the whales to surface.","A few whales have been tracked briefly in the wild this way but not for very great distances, and much about them remains unknown. Using the SOSUS stations, scientists can track the whales in real time and position them on a map. Moreover, they can track not just one whale at a time, but many creatures simultaneously throughout the North Atlantic and the eastern North Pacific. They also can learn to distinguish whale calls. For example, Fox and colleagues have detected changes in the calls of finback whales during different seasons and have found that blue whales in different regions of the Pacific Ocean have different calls.","SOSUS, with its vast reach, also has proved instrumental in obtaining information crucial to our understanding of Earth’s weather and climate. Specifically, the system has enabled researchers to begin making ocean temperature measurements on a global scale— measurements that are keys to puzzling out the workings of heat transfer between the ocean and the atmosphere. The ocean plays an enormous role in determining air temperature—the heat capacity in only the upper few meters of ocean is thought to be equal to all of the heat in the entire atmosphere. For sound waves traveling horizontally in the ocean, speed is largely a function of temperature. Thus, the travel time of a wave of sound between two points is a sensitive indicator of the average temperature along its path. Transmitting sound in numerous directions through the deep sound channel can give scientists measurements spanning vast areas of the globe. Thousands of sound paths in the ocean could be pieced together into a map of global ocean temperatures and, by repeating measurements along the same paths over times, scientists could track changes in temperature over months or years.","Researchers also are using other acoustic techniques to monitor climate. Oceanographer Jeff Nystuen at the University of Washington, for example, has explored the use of sound to measure rainfall over the ocean. Monitoring changing global rainfall patterns undoubtedly will contribute to understanding major climate change as well as the weather phenomenon known as El Nifio. Since 1985, Nystuen has used hydrophones to listen to rain over the ocean, acoustically measuring not only the rainfall rate but also the rainfall type, from drizzle to thunderstorms. By using the sound of rain underwater as a “natural” rain gauge, the measurement of rainfall over the oceans will become available to climatologists."],"questions":[{"n":1,"text":"In the past, difficulties of research carried out on Moon were much easier than that of ocean.","answer":"TRUE","source":"Đoạn 1 (PDF trang 147)","evidence":"…we knew less about their depths than we did about the surface of the Moon. Distant as it is, the Moon has been far more accessible to study because astronomers long have been able to look at its surface, first with the naked eye and then with the telescope-both instruments that focus light.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “…we knew less about their depths than we did about the surface of the Moon.”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In the past, difficulties of research carried out on Moon were much easier than that of ocean.”\n- Passage: “…we knew less about their depths than we did about the surface of the Moon.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"The same light technology used on investigation of moon can be employed in the field of ocean.","answer":"FALSE","source":"Đoạn 1 (PDF trang 147)","evidence":"Until the twentieth century, however, no analogous © (RAL instruments were available for the study of Earth’s oceans: Light, which can travel trillions of miles through the vast vacuum Curious investigators long have been fascinated by sound and the way it travels in water.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “Until the twentieth century, however, no analogous © (RAL instruments were available for the study of Earth’s oceans: Light, which can travel trillions of miles through the vast vacuum Curious investigators long have been fascinated by s…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The same light technology used on investigation of moon can be employed in the field of ocean.”\n- Passage: “Until the twentieth century, however, no analogous © (RAL instruments were available for the study of Earth’s oceans: Light, which can travel trillions of miles through the vast vacuum Curious investigators long have been fascinated by s…”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":3,"text":"Research on the depth of ocean by method of sound wave is more time-consuming.","answer":"NOT GIVEN","source":"Đoạn 5 (PDF trang 149)","evidence":"The ocean plays an enormous role in determining air temperature—the heat capacity in only the upper few meters of ocean is thought to be equal to all of the heat in the entire atmosphere. For sound waves traveling horizontally in the ocean, speed is largely a function of temperature. Thus, the travel time of a wave of sound between two points is a sensitive indicator of the average temperature along its path.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The ocean plays an enormous role in determining air temperature—the heat capacity in only the upper few meters of ocean is thought to xác nhận."}]},{"id":30,"title":"Lie Detector","passage":["A However much we may abhor it, deception wo . . “2 af data nk tna is Uetome comes naturally to all living things. Birds do it by a i say tye oti garente","feigning injury to lead hungry predators (nif?) away from nesting young. Spider crabs do it by disguise: adorning themselves with strips of kelp and other debris, they pretend to be something they are not--and so escape their enemies. Nature amply rewards successful deceivers by allowing them to survive long enough to mate and reproduce. So it may come as no surprise to learn that human beings--who, according to psychologist Gerald Jellison of the University of South California, are lied to about 200 times a day, roughly one untruth every five minutes--often deceive for exactly the same reasons: to save their own skins or to get something they can't get by other means.","B But knowing how to catch deceit can be just as important a survival skill as knowing how to tell a lie and get away with it. A person able to spot falsehood quickly is unlikely to be swindled by an unscrupulous business associate or hoodwinked by a devious spouse. Luckily, nature provides more than enough clues to trap dissemblers. in their own tangled webs--if you know where to look. By closely observing facial expressions, body language and tone of voice, practically anyone can recognize the telltale signs of lying. Researchers are even programming computers--like those used on Lie Detector--to get at the truth by analyzing the same physical cues available to the naked eye and ear. \"With the proper training, many people can learn to reliably detect lies,\" says Paul Ekman, professor of psychology at the University of California, San Francisco, who has spent the past 15 years studying the secret art of deception (n. Ska).","C In order to know what kind of lies work best, successful liars need to accurately assess (v.i#(#) other people's emotional states. Ekman's research shows that this same emotional intelligence is essential for good lie detectors, too. The emotional state to watch out for is stress, the conflict most liars feel between the truth and what they actually say and do.","Even high-tech lie detectors don't detect lies as such; they merely detect the physical cues of emotions, which may or may not correspond to what the person being tested is saying. Polygraphs, for instance, measure respiration, heart rate and skin conductivity, which tend to increase when people are nervous--as they usually are when lying. Nervous people typically perspire, and the salts contained in perspiration conduct electricity. That's why a sudden leap in skin conductivity indicates nervousness--about getting caught, perhaps?--which might, in turn, suggest that someone is being economical with the truth. On the other hand, it might also mean that the lights in the television studio are too hot--which is one reason polygraph tests are inadmissible in court. \"Good lie detectors don't rely on a single sign,\" Ekman says, \"but interpret clusters of verbal and nonverbal clues that suggest someone might be lying.\"","Those clues are written all over the face. Because the (n.WUAZRSD of the face is directly connected to the areas of the brain that process emotion, the countenance can be a window to the soul. Neurological studies even suggest that genuine emotions travel different pathways through the brain than insincere ones. If a patient paralyzed by stroke on one side of the face, for example, is asked to smile deliberately, only the mobile side of the mouth is raised. But tell that same person a funny joke, and the patient breaks into a full and spontaneous smile. Very few people--most notably, actors and politicians--are able to consciously control all of their facial expressions. Lies can often be caught when the liar's true feelings briefly leak through the mask of deception. \"We don't think before we feel,\" Ekman says. \"Expressions tend to show up on the face before we're even conscious of experiencing an emotion.\"","One of the most difficult facial expressions to fake--or conceal, if it is genuinely felt--is sadness. When someone is truly sad, the forehead wrinkles with grief and the inner corners of the eyebrows are pulled up. Fewer than 15% of the people Ekman tested were able to produce this eyebrow movement voluntarily. By contrast, the lowering of the eyebrows associated with an angry scowl can be replicated at will by almost everybody. \"If someone claims they are sad and the inner corners of their eyebrows don't go up,\" Ekman says, \"the sadness is probably false.\" The smile, on the other hand, is one of the easiest facial expressions to (v.fittil, tex) . It takes just two muscles--the zygomaticus major muscles that extend from the cheekbones to the corners of the lips--to produce a grin. But there's a catch. A genuine smile affects not only the corners of the lips but also the orbicularis oculi, the muscle around the eye that produces the distinctive \"crow's-feet\"","associated with people who laugh a lot. A counterfeit grin can be unmasked if the lip corners go up, the eyes crinkle but the inner corners of the eyebrows are not lowered, a movement controlled by the orbicularis oculi that is difficult to fake. The absence of lowered eyebrows is one reason why false smiles look so strained and stiff. A? PL, AA..."],"questions":[{"n":1,"text":"All living animals can lie.","answer":"TRUE","source":"Đoạn A (PDF trang 151)","evidence":"2 af data nk tna is Uetome comes naturally to all living things.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: ““2 af data nk tna is Uetome comes naturally to all living things.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phả
