m the Sun at noon. They also estimated directions relative to the wind and swell. Overall, shipping in ancient Roman times resembled shipping today with large vessels regularly crossing the seas and bringing supplies from their Empire."],"questions":[{"n":1,"text":"The Romans’ shipbuilding skills were passed on to the Greeks and the Egyptians.","answer":"FALSE","source":"Đoạn 4 (PDF trang 61)","evidence":"Warships were built to be lightweight and very speedy.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “Warships were built to be lightweight and very speedy.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The Romans’ shipbuilding skills were passed on to the Greeks and the Egyptians.”\n- Passage: “Warships were built to be lightweight and very speedy.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":2,"text":"Skilled craftsmen were needed for the mortise and tenon method of fixing planks.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 60)","evidence":"Planks used to build the outer hull were initially sewn together. Starting from the 6th century BCE, they were fixed using a method called mortise and tenon, whereby one plank locked into another without the need for stitching.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Planks used to build the outer hull were initially sewn together.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “the mortise and tenon method of fixing planks” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Skilled craftsmen were needed for the mortise and tenon method of fixing planks.”\n- Passage: “Planks used to build the outer hull were initially sewn together.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":3,"text":"The later practice used by Mediterranean shipbuilders involved building the hull before the frame.","answer":"FALSE","source":"Đoạn 3 (PDF trang 61)","evidence":"Then in the first centuries of the current era, Mediterranean shipbuilders shifted to another shipbuilding method, still in use today, which consisted of building the frame first and then proceeding with the hull and the other components of the ship.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “Then in the first centuries of the current era, Mediterranean shipbuilders shifted to another shipbuilding method, still in use today, which consisted of building the frame first and then proceeding with the hull and the other components…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The later practice used by Mediterranean shipbuilders involved building the hull before the frame.”\n- Passage: “Then in the first centuries of the current era, Mediterranean shipbuilders shifted to another shipbuilding method, still in use today, which consisted of building the frame first and then proceeding with the hull and the other components…”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":4,"text":"The Romans called the Mediterranean Sea Mare Nostrum because they dominated its use.","answer":"TRUE","source":"Đoạn 4 (PDF trang 61)","evidence":"Eventually, Rome’s navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called Mare Nostrum meaning ‘our sea’.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Eventually, Rome’s navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called Mare Nostrum meaning ‘our sea’.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The Romans called the Mediterranean Sea Mare Nostrum because they dominated its use.”\n- Passage: “Eventually, Rome’s navy became the largest and most powerful in the Mediterranean, and the Romans had control over what they therefore called Mare Nostrum meaning ‘our sea’.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":5,"text":"Most rowers on ships were people from the Roman army.","answer":"TRUE","source":"Đoạn 1 (PDF trang 60)","evidence":"The Romans were not traditionally sailors but mostly land- based people, who learned to build ships from the people that they conquered, namely the Greeks and the Egyptians.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The Romans were not traditionally sailors but mostly land- based people, who learned to build ships from the people that they conquered, namely the Greeks and the Egyptians.”. Khi đối chiếu theo phạm vi / từ tuyệt đối, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Most rowers on ships were people from the Roman army.”\n- Passage: “The Romans were not traditionally sailors but mostly land- based people, who learned to build ships from the people that they conquered, namely the Greeks and the Egyptians.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":13,"title":"Plant ‘Thermometer’ Triggers Springtime Growth","passage":["Plant ‘Thermometer’ Triggers Springtime Growth By Measuring Night-Time Heat A. An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes. Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night. The new findings, published in the journal Science, show that phytochromes control genetic switches in response to temperature as well as light to dictate plant development.","B. At night, these molecules change states, and the pace at which they change is ‘directly proportional to temperature’, say scientists, who compare phytochromes to mercury in a thermometer. The warmer it is, the faster the molecular change – stimulating plant growth.","C. Farmers and gardeners have known for hundreds of years how responsive plants are to temperature: warm winters cause many trees and flowers to bud early, something humans have long used to predict weather and harvest times for the coming year. The latest research pinpoints for the first time a molecular mechanism in plants that reacts to temperature – often triggering the buds of spring we long to see at the end of winter.","D. With weather and temperatures set to become ever more unpredictable due to climate change, researchers say the discovery that this light-sensing molecule also functions as the internal thermometer in plant cells could help us breed tougher crops. ‘It is estimated that agricultural yields will need to double by 2050, but climate change is a major threat to achieving this. Key crops such as wheat and rice are sensitive to high temperatures. Thermal stress reduces crop yields by around 10% for every one degree increase in temperature,’ says lead researcher Dr Philip Wigge from Cambridge’s Sainsbury Laboratory. ‘Discovering the molecules that allow plants to sense temperature has the potential to accelerate the breeding of crops resilient to thermal stress and climate change.’ E. In their active state, phytochrome molecules bind themselves to DNA to restrict plant growth. During the day, sunlight activates the molecules, slowing down growth. If a plant finds itself in shade, phytochromes are quickly","inactivated – enabling it to grow faster to find sunlight again. This is how plants compete to escape each other’s shade. ‘Light-driven changes to phytochrome activity occur very fast, in less than a second,’ says Wigge. At night, however, it’s a different story. Instead of a rapid deactivation following sundown, the molecules gradually change from their active to inactive state. This is called ‘dark reversion’. ‘Just as mercury rises in a thermometer, the rate at which phytochromes revert to their inactive state during the night is a direct measure of temperature,’ says Wigge.","F. ‘The lower the temperature, the slower the rate at which phytochromes revert to inactivity, so the molecules spend more time in their active, growth-suppressing state. This is why plants are slower to grow in winter. Warm temperatures accelerate dark reversion, so that phytochromes rapidly reach an inactive state and detach themselves from the plant’s DNA – allowing genes to be expressed and plant growth to resume.’ Wigge believes phytochrome thermo-sensing evolved at a later stage, and co-opted the biological network already used for light-based growth during the downtime of night. G. Some plants mainly use day length as an indicator of the season. Other species, such as daffodils, have considerable temperature sensitivity, and can flower months in advance during a warm winter. In fact, the discovery of the","dual role of phytochromes provides the science behind a well-known rhyme long used to predict the coming season: oak before ash we’ll have a splash, ash before oak we’re in for a soak. Wigge explains: ‘Oak trees rely much more on temperature, likely using phytochromes as thermometers to dictate development, whereas ash trees rely on measuring day length to determine their seasonal timing. A warmer spring, and consequently a higher likeliness of a hot summer, will result in oak leafing before ash. A cold spring will see the opposite. As the British know only too well, a colder summer is likely to be a rain-soaked one.’","H. The new findings are the culmination of twelve years of research involving scientists from Germany, Argentina and the US, as well as the Cambridge team. The work was done in a model system, using a mustard plant called Arabidopsis, but Wigge says the phytochrome genes necessary for temperature sensing are found in crop plants as well. ‘Recent advances in plant genetics now mean that scientists are able to rapidly identify the genes controlling these processes in crop plants, and even alter their activity using precise molecular “scalpels”,’ adds Wigge. ‘Cambridge is uniquely well-positioned to do this kind of research as we have outstanding collaborators nearby who work on more applied aspects of plant biology, and can help us transfer this new knowledge into the field.’"],"questions":[{"n":27,"text":"The Cambridge scientists’ discovery of the ‘thermometer molecule’ caused surprise among other scientists.","answer":"NOT GIVEN","source":"Đoạn A (PDF trang 66)","evidence":"An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “the ‘thermometer molecule’ caused surprise among other scientists” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “The Cambridge scientists’ discovery of the ‘thermometer molecule’ caused surprise among other scientists.”\n- Passage: “An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":28,"text":"The target for agricultural production by 2050 could be missed.","answer":"TRUE","source":"Đoạn A (PDF trang 66)","evidence":"Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night. The new findings, published in the journal Science, show that phytochromes control genetic switches in response to temperature as well as light to dictate plant development. At night, these molecules change states, and the pace at which they change is ‘directly proportional to temperature’, say scientists, who compare phytochromes to mercury in a thermometer.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The target for agricultural production by 2050 could be missed.”\n- Passage: “Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":29,"text":"Wheat and rice suffer from a rise in temperatures.","answer":"TRUE","source":"Đoạn D (PDF trang 67)","evidence":"Key crops such as wheat and rice are sensitive to high temperatures.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Key crops such as wheat and rice are sensitive to high temperatures.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Wheat and rice suffer from a rise in temperatures.”\n- Passage: “Key crops such as wheat and rice are sensitive to high temperatures.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":30,"text":"It may be possible to develop crops that require less water.","answer":"NOT GIVEN","source":"Đoạn A (PDF trang 66)","evidence":"An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “less water” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “It may be possible to develop crops that require less water.”\n- Passage: “An international team of scientists led by the University of Cambridge has discovered that the ‘thermometer’ molecule in plants enables them to develop according to seasonal temperature changes.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":31,"text":"Plants grow faster in sunlight than in shade.","answer":"FALSE","source":"Đoạn E (PDF trang 68)","evidence":"If a plant finds itself in shade, phytochromes are quickly inactivated – enabling it to grow faster to find sunlight again. This is how plants compete to escape each other’s shade.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “If a plant finds itself in shade, phytochromes are quickly inactivated – enabling it to grow faster to find sunlight again.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Plants grow faster in sunlight than in shade.”\n- Passage: “If a plant finds itself in shade, phytochromes are quickly inactivated – enabling it to grow faster to find sunlight again.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."},{"n":32,"text":"Phytochromes change their state at the same speed day and night.","answer":"FALSE","source":"Đoạn A (PDF trang 66)","evidence":"Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night. The new findings, published in the journal Science, show that phytochromes control genetic switches in response to temperature as well as light to dictate plant development. At night, these molecules change states, and the pace at which they change is ‘directly proportional to temperature’, say scientists, who compare phytochromes to mercury in a thermometer.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mức độ / so sánh. Passage thực tế viết: “Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Phytochromes change their state at the same speed day and night.”\n- Passage: “Researchers have revealed that molecules called phytochromes – used by plants to detect light during the day – actually change their function in darkness to become cellular temperature gauges that measure the heat of the night.”\n- Quan hệ nghĩa: đối lập ở mức độ / so sánh."}]},{"id":14,"title":"Roman Tunnels","passage":["Roman Tunnels The Persians, who lived in present-day Iran, were one of the first civilizations to build tunnels that provided a reliable supply of water to human settlements in dry areas. In the early first millennium BCE, they introduced the qanat method of tunnel construction, which consisted of placing posts over a hill in a straight line, to ensure that the tunnel kept to its route, and then digging vertical shafts down into the ground at regular intervals. Underground, workers removed the earth from between the ends of the shafts, creating a tunnel. The excavated soil was taken up to the surface using the shafts, which also provided ventilation during the work. Once the tunnel was completed, it allowed water to flow from the top of a hillside down towards a canal, which supplied water for human use. Remarkably, some qanats built by the Persians 2,700 years ago are still in use today. They later passed on their knowledge to the Romans, who also used the qanat method to construct water-supply tunnels for agriculture. Roman qanat tunnels were constructed with vertical shafts dug at intervals of between","and 60 meters. The shafts were equipped with handholds and footholds to help those climbing in and out of them and were covered with a wooden or stone lid. To ensure that the shafts were vertical, Romans hung a plumb line from a rod placed across the top of each shaft and made sure that the weight at the end of it hung in the center of the shaft. Plumb lines were also used to measure the depth of the shaft and to determine the slope of the tunnel. The 5.6-kilometer-long Claudius tunnel, built in 41 CE to drain the Fucine Lake in central Italy, had shafts that were up to 122 meters deep, took 11 years to build and involved approximately 30,000 workers.","By the 6th century BCE, a second method of tunnel construction appeared called the counter-excavation method, in which the tunnel was constructed from both ends. It was used to cut through high mountains when the qanat method was not a practical alternative. This method required greater planning and advanced knowledge of surveying, mathematics and geometry as both ends of a tunnel had to meet correctly at the center of the mountain.","Adjustments to the direction of the tunnel also had to be made whenever builders encountered geological problems or when it deviated from its set path. They constantly checked the tunnel’s advancing direction, for example, by looking back at the light that penetrated through the tunnel mouth, and","made corrections whenever necessary. Large deviations could happen, and they could result in one end of the tunnel not being usable. An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later construction of a lateral link between both corridors corrected the initial error.","The Romans dug tunnels for their roads using the counter-excavation method, whenever they encountered obstacles such as hills or mountains that were too high for roads to pass over. An example is the 37-meter-long, 6-meter-high, Furlo Pass Tunnel built in Italy in 69-79 CE. Remarkably, a modern road still uses this tunnel today. Tunnels were also built for mineral extraction. Miners would locate a mineral vein and then pursue it with shafts and tunnels underground. Traces of such tunnels used to mine gold can still be found at the Dolaucothi mines in Wales.","When the sole purpose of a tunnel was mineral extraction, construction required less planning, as the tunnel route was determined by the mineral vein. Roman tunnel projects were carefully planned and carried out. The length of time it took to construct a tunnel depended on the method being used and the type of rock being excavated. The qanat construction method was usually faster than the counter-excavation method as it was more straightforward.","This was because the mountain could be excavated not only from the tunnel mouths but also from shafts. The type of rock could also influence construction times. When the rock was hard, the Romans employed a technique called fire quenching which consisted of heating the rock with fire, and then suddenly cooling it with cold water so that it would crack.","Progress through hard rock could be very slow, and it was not uncommon for tunnels to take years, if not decades, to be built. Construction marks left on a Roman tunnel in Bologna show that the rate of advance through solid rock was 30 centimeters per day. In contrast, the rate of advance of the Claudius tunnel can be calculated at 1.4 meters per day.","Most tunnels had inscriptions showing the names of patrons who ordered construction and sometimes the name of the architect. For example, the 1.4-kilometer Cevlik tunnel in Turkey, built to divert the floodwater threatening the harbor of the ancient city of Seleuceia Pieria, had inscriptions on the entrance, still visible today, that also indicate that the tunnel was started in CE and was completed in 81 CE."],"questions":[{"n":7,"text":"The counter-excavation method completely replaced the qanat method in the 6th century BCE.","answer":"FALSE","source":"Đoạn 2 (PDF trang 71)","evidence":"They later passed on their knowledge to the Romans, who also used the qanat method to construct water-supply tunnels for agriculture.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “They later passed on their knowledge to the Romans, who also used the qanat method to construct water-supply tunnels for agriculture.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The counter-excavation method completely replaced the qanat method in the 6th century BCE.”\n- Passage: “They later passed on their knowledge to the Romans, who also used the qanat method to construct water-supply tunnels for agriculture.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":8,"text":"Only experienced builders were employed to construct a tunnel using the counter-excavation method.","answer":"NOT GIVEN","source":"Đoạn 8 (PDF trang 73)","evidence":"The length of time it took to construct a tunnel depended on the method being used and the type of rock being excavated. The qanat construction method was usually faster than the counter-excavation method as it was more straightforward.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The length of time it took to construct a tunnel depended on the method being used and the type of rock being excavated.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Only experienced builders were employed to construct a tunnel using the counter-excavation method” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Only experienced builders were employed to construct a tunnel using the counter-excavation method.”\n- Passage: “The length of time it took to construct a tunnel depended on the method being used and the type of rock being excavated.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":9,"text":"The information about a problem that occurred during the construction of the Saldae aqueduct system was found in an ancient book.","answer":"FALSE","source":"Đoạn 6 (PDF trang 73)","evidence":"An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later construction of a lateral link between both corridors corrected the initial error.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later constr…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The information about a problem that occurred during the construction of the Saldae aqueduct system was found in an ancient book.”\n- Passage: “An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later constr…”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":10,"text":"The mistake made by the two teams digging the Saldae aqueduct system was that they used different units of measurement.","answer":"TRUE","source":"Đoạn 6 (PDF trang 73)","evidence":"An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later construction of a lateral link between both corridors corrected the initial error.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later constr…”. Khi đối chiếu theo mức độ / so sánh, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The mistake made by the two teams digging the Saldae aqueduct system was that they used different units of measurement.”\n- Passage: “An inscription written on the side of a 428-meter tunnel, built by the Romans as part of the Saldae aqueduct system in modern-day Algeria, describes how the two teams of builders missed each other in the mountain and how the later constr…”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":15,"title":"Henry Moore (1898-1986)","passage":["Henry Moore (1898-1986) Henry Moore was born in Castleford, a small town near Leeds in the north of England. He was the seventh child of Raymond Moore and his wife Mary Baker. He studied at Castleford Grammar School from 1909 to 1915, where his early interest in art was encouraged by his teacher Alice Gostick. After leaving school, Moore hoped to become a sculptor, but instead he complied with his father’s wish that he train as a schoolteacher. He had to abandon his training in 1917 when he was sent to France to fight in the First World War.","After the war, Moore enrolled at the Leeds School of Art, where he studied for two years. In his first year, he spent most of his time drawing. Although he wanted to study sculpture, no teacher was appointed until his second year. At the end of that year, he passed the sculpture examination and was awarded a scholarship to the Royal College of Art in London. In September 1921, he moved to London and began three years of advanced study in sculpture. Alongside the instruction he received at the Royal College, Moore visited many of the","London museums, particularly the British Museum, which had a wide-ranging collection of ancient sculpture. During these visits, he discovered the power and beauty of ancient Egyptian and African sculpture. As he became increasingly interested in these ‘primitive’ forms of art, he turned away from European sculptural traditions. After graduating, Moore spent the first six months of 1925 travelling in France. When he visited the Trocadero Museum in Paris, he was impressed by a cast of a Mayan sculpture of the rain spirit. It was a male reclining figure with its knees drawn up together, and its head at a right angle to its body.","Moore became fascinated with this stone sculpture, which he thought had a power and originality that no other stone sculpture possessed. He himself started carving a variety of subjects in stone, including depictions of reclining women, mother-and-child groups, and masks. Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College. In 1933, he became a member of a group of young artists called Unit One. The aim of the group was to convince the English public of the merits of the emerging international movement in modern art and architecture. Around this time, Moore moved away from the human figure to experiment with abstract shapes. In 1931, he held an exhibition at the Leicester Galleries in London. His work was enthusiastically welcomed by fellow sculptors, but the","reviews in the press were extremely negative and turned Moore into a notorious figure. There were calls for his resignation from the Royal College, and the following year, when his contract expired, he left to start a sculpture department at the Chelsea School of Art in London. Throughout the 1930s, Moore did not show any inclination to please the British public. He became interested in the paintings of the Spanish artist Pablo Picasso, whose work inspired him to distort the human body in a radical way. At times, he seemed to abandon the human figure altogether. The pages of his sketchbooks from this period show his ideas for abstract sculptures that bore little resemblance to the human form.","In 1940, during the Second World War, Moore stopped teaching at the Chelsea School and moved to a farmhouse about 20 miles north of London. A shortage of materials forced him to focus on drawing. He did numerous small sketches of Londoners, later turning these ideas into large coloured drawings in his studio. In 1942, he returned to Castleford to make a series of sketches of the miners who worked there. In 1944, Harlow, a town near London, offered Moore a commission for a sculpture depicting a family. The resulting work signifies a dramatic change in Moore’s style, away from the experimentation of the 1930s towards a more natural and humanistic subject matter. He did dozens of studies in clay for the sculpture, and these were cast in bronze and issued in editions of seven to nine copies each. In this way, Moore’s work became available to collectors all over the world. The boost to his income enabled him to take on ambitious projects and start working on the scale he felt his sculpture demanded. Critics who had begun to think that Moore had become less revolutionary were proven wrong by the appearance, in 1950, of the first of Moore’s series of standing figures in bronze, with their harsh and angular pierced forms and distinct impression of menace. Moore also varied his subject matter in the 1950s with such works as Warrior with Shield and Falling Warrior. These were rare examples of Moore’s use of the male figure and owe something to his visit to Greece in 1951, when he had the opportunity to study ancient works of art. In his final years, Moore created the Henry Moore Foundation to promote art appreciation and to display his work. Moore was the first modern English sculptor to achieve international critical acclaim and he is still regarded as one of the most important sculptors of the 20th century."],"questions":[{"n":1,"text":"On leaving school, Moore did what his father wanted him to do.","answer":"TRUE","source":"Đoạn 1 (PDF trang 76)","evidence":"He was the seventh child of Raymond Moore and his wife Mary Baker.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “He was the seventh child of Raymond Moore and his wife Mary Baker.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “On leaving school, Moore did what his father wanted him to do.”\n- Passage: “He was the seventh child of Raymond Moore and his wife Mary Baker.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":2,"text":"Moore began studying sculpture in his first term at the Leeds School of Art.","answer":"FALSE","source":"Đoạn 2 (PDF trang 76)","evidence":"After the war, Moore enrolled at the Leeds School of Art, where he studied for two years.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “After the war, Moore enrolled at the Leeds School of Art, where he studied for two years.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Moore began studying sculpture in his first term at the Leeds School of Art.”\n- Passage: “After the war, Moore enrolled at the Leeds School of Art, where he studied for two years.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":3,"text":"When Moore started at the Royal College of Art, its reputation for teaching sculpture was excellent.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 77)","evidence":"Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Art, its reputation for teaching sculpture was excellent” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “When Moore started at the Royal College of Art, its reputation for teaching sculpture was excellent.”\n- Passage: “Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":4,"text":"Moore became aware of ancient sculpture as a result of visiting the British Museum.","answer":"TRUE","source":"Đoạn 3 (PDF trang 77)","evidence":"Alongside the instruction he received at the Royal College, Moore visited many of the London museums, particularly the British Museum, which had a wide-ranging collection of ancient sculpture. During these visits, he discovered the power and beauty of ancient Egyptian and African sculpture.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Alongside the instruction he received at the Royal College, Moore visited many of the London museums, particularly the British Museum, which had a wide-ranging collection of ancient sculpture.”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Moore became aware of ancient sculpture as a result of visiting the British Museum.”\n- Passage: “Alongside the instruction he received at the Royal College, Moore visited many of the London museums, particularly the British Museum, which had a wide-ranging collection of ancient sculpture.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":5,"text":"After leaving the Royal College of Art, Moore became an instructor there.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 77)","evidence":"Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “After leaving the Royal College of Art, Moore became an instructor there” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “After leaving the Royal College of Art, Moore became an instructor there.”\n- Passage: “Moore’s exceptional talent soon gained recognition, and in 1926 he started work as a sculpture instructor at the Royal College.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":6,"text":"Moore’s first solo exhibition was held at the Leicester Galleries.","answer":"FALSE","source":"Đoạn 5 (PDF trang 77)","evidence":"In 1931, he held an exhibition at the Leicester Galleries in London.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “In 1931, he held an exhibition at the Leicester Galleries in London.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Moore’s first solo exhibition was held at the Leicester Galleries.”\n- Passage: “In 1931, he held an exhibition at the Leicester Galleries in London.”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":7,"text":"Moore’s career benefited from one of his sculptures being shown in an outdoor exhibition.","answer":"TRUE","source":"Đoạn 5 (PDF trang 77)","evidence":"In 1931, he held an exhibition at the Leicester Galleries in London.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “In 1931, he held an exhibition at the Leicester Galleries in London.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Moore’s career benefited from one of his sculptures being shown in an outdoor exhibition.”\n- Passage: “In 1931, he held an exhibition at the Leicester Galleries in London.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":16,"title":"The Return Of The Huarango","passage":["The Return Of The Huarango The south coast of Peru is a narrow, 2,000-kilometre-long strip of desert squeezed between the Andes and the Pacific Ocean. It is also one of the most fragile ecosystems on Earth. It hardly ever rains there, and the only year-round source of water is located tens of metres below the surface. This is why the huarango tree is so suited to life there: it has the longest roots of any tree in the world. They stretch down 50-80 metres and, as well as sucking up water for the tree, they bring it into the higher subsoil, creating a water source for other plant life.","Dr David Beresford-Jones, archaeobotanist at Cambridge University, has been studying the role of the huarango tree in landscape change in the Lower lea Valley in southern Peru. He believes the huarango was key to the ancient people’s diet and, because it could reach deep water sources, it allowed local people to withstand years of drought when their other crops failed. But over the centuries huarango trees were gradually replaced with crops. Cutting down native woodland leads to erosion, as there is nothing to keep the soil in place.","So when the huarangos go, the land turns into a desert. Nothing grows at all in the Lower Lea Valley now. For centuries the huarango tree was vital to the people of the neighbouring Middle lea Valley too. They grew vegetables under it and ate products made from its seed pods. Its leaves and bark were used for herbal remedies, while its branches were used for charcoal for cooking and heating, and its trunk was used to build houses. But now it is disappearing rapidly.","The majority of the huarango forests in the valley have already been cleared for fuel and agriculture – initially, these were smallholdings, but now they’re huge farms producing crops for the international market. ‘Of the forests that were here 1,000 years ago, 99 percent have already gone,’ says botanist Oliver Whaley from Kew Gardens in London, who, together with ethnobotanist Dr William Milliken, is running a pioneering project to protect and restore the rapidly disappearing habitat. In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.","\"Increasingly aspirational communities think that if you plant food trees in your home or street, it shows you are poor, and still need to grow your own food,\" he says. In order to stop the Middle lea Valley going the same way as the Lower lea Valley, Whaley is encouraging locals to love the huarangos again. ‘It’s a process of cultural resuscitation,’ he says.","He has already set up a huarango festival to reinstate a sense of pride in their eco-heritage, and has helped local school children plant thousands of trees. ‘In order to get people interested in habitat restoration, you need to plant a tree that is useful to them,’ says Whaley. So, he has been working with local families to attempt to create a sustainable income from the Huarangos by turning their products into foodstuffs. ‘Boil up the beans and you get this thick brown syrup like molasses. You can also use it in drinks, soups or stews.’ The pods can be ground into flour to make cakes, and the seeds roasted into a sweet, chocolatey ‘coffee’.","‘It’s packed full of vitamins and minerals,’ Whaley says. And some farmers are already planting huarangos. Alberto Benevides, owner of Lea Valley’s only certified organic farm, which Whaley helped set up, has been planting the tree for 13 years. He produces syrup and flour, and sells these products at an organic farmers’ market in Lima. His farm is relatively small and doesn’t yet provide him with enough to live on, but he hopes this will change. ‘The organic market is growing rapidly in Peru,’ Benevides says. ‘I am investing in the future.’","But even if Whaley can convince the local people to fall in love with the huarango again, there is still the threat of the larger farms. Some of these cut across the forests and break up the corridors that allow the essential movement of mammals, birds and pollen up and down the narrow forest strip.","In the hope of counteracting this, he’s persuading farmers to let him plant forest corridors on their land. He believes the extra woodland will also benefit the farms by reducing their water usage through a lowering of evaporation and providing a refuge for biocontrol insects. ‘If we can record biodiversity and see how it all works, then we’re in a good position to move on from there. Desert habitats can reduce down to very little,’ Whaley explains.","‘It’s not like a rainforest that needs to have this huge expanse. Life has always been confined to corridors and islands here. If you just have a few trees left, the population can grow up quickly because it’s used to exploiting water when it arrives.’ He sees his project as a model that has the potential to be rolled out across other arid areas around the world. ‘If we can do it here, in the most fragile system on Earth, then that’s a real message of hope for lots of places, including Africa, where there is drought and they just can’t afford to wait for rain.’"],"questions":[{"n":9,"text":"Local families have told Whaley about some traditional uses of huarango products.","answer":"NOT GIVEN","source":"Đoạn 2 (PDF trang 82)","evidence":"Dr David Beresford-Jones, archaeobotanist at Cambridge University, has been studying the role of the huarango tree in landscape change in the Lower lea Valley in southern Peru. He believes the huarango was key to the ancient people’s diet and, because it could reach deep water sources, it allowed local people to withstand years of drought when their other crops failed.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Dr David Beresford-Jones, archaeobotanist at Cambridge University, has been studying the role of the huarango tree in landscape change in the Lower lea Valley in southern Peru.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Whaley about some traditional uses of huarango products” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Local families have told Whaley about some traditional uses of huarango products.”\n- Passage: “Dr David Beresford-Jones, archaeobotanist at Cambridge University, has been studying the role of the huarango tree in landscape change in the Lower lea Valley in southern Peru.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":10,"text":"Farmer Alberto Benevides is now making a good profit from growing huarangos.","answer":"FALSE","source":"Đoạn 7 (PDF trang 84)","evidence":"And some farmers are already planting huarangos. Alberto Benevides, owner of Lea Valley’s only certified organic farm, which Whaley helped set up, has been planting the tree for 13 years.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “And some farmers are already planting huarangos.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Farmer Alberto Benevides is now making a good profit from growing huarangos.”\n- Passage: “And some farmers are already planting huarangos.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":11,"text":"Whaley needs the cooperation of farmers to help preserve the area’s wildlife.","answer":"TRUE","source":"Đoạn 4 (PDF trang 83)","evidence":"In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “Whaley needs the cooperation of farmers to help preserve the area’s wildlife.”\n- Passage: “In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":12,"text":"For Whaley’s project to succeed, it needs to be extended over a very large area.","answer":"FALSE","source":"Đoạn 4 (PDF trang 83)","evidence":"In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “For Whaley’s project to succeed, it needs to be extended over a very large area.”\n- Passage: “In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":13,"text":"Whaley has plans to go to Africa to set up a similar project.","answer":"NOT GIVEN","source":"Đoạn 4 (PDF trang 83)","evidence":"‘Of the forests that were here 1,000 years ago, 99 percent have already gone,’ says botanist Oliver Whaley from Kew Gardens in London, who, together with ethnobotanist Dr William Milliken, is running a pioneering project to protect and restore the rapidly disappearing habitat. In order to succeed, Whaley needs to get the local people on board, and that has meant overcoming local prejudices.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “‘Of the forests that were here 1,000 years ago, 99 percent have already gone,’ says botanist Oliver Whaley from Kew Gardens in London, who, together with ethnobotanist Dr William Milliken, is running a pioneering project to protect and r…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “to Africa to set up a similar project” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Whaley has plans to go to Africa to set up a similar project.”\n- Passage: “‘Of the forests that were here 1,000 years ago, 99 percent have already gone,’ says botanist Oliver Whaley from Kew Gardens in London, who, together with ethnobotanist Dr William Milliken, is running a pioneering project to protect and r…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":17,"title":"Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands","passage":["Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa. This small volcanic island is mountainous, with steep rocky slopes and deep, wooded ravines, rising to 1,487 metres at its highest peak. It is also home to the best known of the world’s whistle languages’, a means of transmitting information over long distances which is perfectly adapted to the extreme terrain of the island.","This ‘language’, known as ‘Silbo’ or ‘Silbo Gomero’ – from the Spanish word for ‘whistle’ – is now shedding light on the language-processing abilities of the human brain, according to scientists. Researchers say that Silbo activates parts of the brain normally associated with spoken language, suggesting that the brain is remarkably flexible in its ability to interpret sounds as language.","‘Science has developed the idea of brain areas that are dedicated to language, and we are starting to understand the scope of signals that can be recognised as language,’ says David Corina, co-author of a recent study and associate professor of psychology at the University of Washington in Seattle.","Silbo is a substitute for Spanish, with individual words recorded into whistles which have high- and low-frequency tones. A whistler – or silbador – puts a finger in his or her mouth to increase the whistle’s pitch, while the other hand can be cupped to adjust the direction of the sound. ‘There is much more ambiguity in the whistled signal than in the spoken signal,’ explains lead researcher Manuel Carreiras, psychology professor at the University of La Laguna on the Canary island of Tenerife. Because whistled ‘words’ can be hard to distinguish, silbadores rely on repetition, as well as awareness of context, to make themselves understood.","The silbadores of Gomera are traditionally shepherds and other isolated mountain folk, and their novel means of staying in touch allows them to communicate over distances of up to 10 kilometres. Carreiras explains that silbadores are able to pass a surprising amount of information via their whistles. ‘In daily life they use whistles to communicate short commands, but any Spanish sentence could be whistled.’ Silbo has proved particularly useful when fires have occurred on the island and rapid communication across large areas has been vital.","The study team used neuroimaging equipment to contrast the brain activity of silbadores while listening to whistled and spoken Spanish. Results showed the left temporal lobe of the brain, which is usually associated with spoken language, was engaged during the processing of Silbo. The researchers found that other key regions in the brain’s frontal lobe also responded to the whistles, including those activated in response to sign language among deaf people.","When the experiments were repeated with non-whistlers, however, activation was observed in all areas of the brain. ‘Our results provide more evidence about the flexibility of human capacity for language in a variety of forms,’ Gorina says. ‘These data suggest that left-hemisphere language regions are uniquely adapted for communicative purposes, independent of the modality of signal. The non- Silbo speakers were not recognising Silbo as a language. They had nothing to grab onto, so multiple areas of their brains were activated.’","Carreiras says the origins of Silbo Gomero remain obscure, but that indigenous Canary Islanders, who were of North African origin, already had a whistled language when Spain conquered the volcanic islands in the 15th century Whistled languages survive-today in Papua New Guinea, Mexico, Vietnam, Guyana, China, Nepal, Senegal, and a few mountainous pockets in southern Europe. There are thought to be as many as 70 whistled languages still in use, though only 12 have been described and studied scientifically. This form of communication is an adaptation found among cultures where people are often isolated from each other, according to Julien Meyer, a researcher at the Institute of Human Sciences in Lyon, France. ‘They are mostly used in mountains or dense forests,’ he says. ‘Whistled languages are quite clearly defined and represent an original adaptation of the spoken language for the needs of isolated human groups.’ But with modern communication technology now widely available, researchers say whistled languages like Silbo are threatened with extinction. With dwindling numbers of Gomera islanders still fluent in the language, Canaries’ authorities are taking steps to try to ensure its survival. Since 1999, Silbo Gomero has been taught in all of the island’s elementary schools. In addition, locals are seeking assistance from the United Nations Educational, Scientific and Cultural Organization (UNESCO). ‘The local authorities are trying to get an award from the organisation to declare (Silbo Gomero) as something that should be preserved for humanity,’ Carreiras adds."],"questions":[{"n":14,"text":"La Gomera is the most mountainous of all the Canary Islands.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 88)","evidence":"Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa. This small volcanic island is mountainous, with steep rocky slopes and deep, wooded ravines, rising to 1,487 metres at its highest peak.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa.”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “most mountainous of all the Canary Islands” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “La Gomera is the most mountainous of all the Canary Islands.”\n- Passage: “Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa.”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."},{"n":15,"text":"Silbo is only appropriate for short and simple messages.","answer":"FALSE","source":"Đoạn 5 (PDF trang 89)","evidence":"‘In daily life they use whistles to communicate short commands, but any Spanish sentence could be whistled.’ Silbo has proved particularly useful when fires have occurred on the island and rapid communication across large areas has been vital.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “‘In daily life they use whistles to communicate short commands, but any Spanish sentence could be whistled.’ Silbo has proved particularly useful when fires have occurred on the island and rapid communication across large areas has been…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Silbo is only appropriate for short and simple messages.”\n- Passage: “‘In daily life they use whistles to communicate short commands, but any Spanish sentence could be whistled.’ Silbo has proved particularly useful when fires have occurred on the island and rapid communication across large areas has been…”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":16,"text":"In the brain-activity study, silbadores and non-whistlers produced different results.","answer":"TRUE","source":"Đoạn 6 (PDF trang 89)","evidence":"The study team used neuroimaging equipment to contrast the brain activity of silbadores while listening to whistled and spoken Spanish. Results showed the left temporal lobe of the brain, which is usually associated with spoken language, was engaged during the processing of Silbo.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “The study team used neuroimaging equipment to contrast the brain activity of silbadores while listening to whistled and spoken Spanish.”. Khi đối chiếu theo quan hệ nguyên nhân - kết quả, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “In the brain-activity study, silbadores and non-whistlers produced different results.”\n- Passage: “The study team used neuroimaging equipment to contrast the brain activity of silbadores while listening to whistled and spoken Spanish.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":17,"text":"The Spanish introduced Silbo to the islands in the 15th century.","answer":"FALSE","source":"Đoạn 9 (PDF trang 90)","evidence":"The non- Silbo speakers were not recognising Silbo as a language. They had nothing to grab onto, so multiple areas of their brains were activated.’ Carreiras says the origins of Silbo Gomero remain obscure, but that indigenous Canary Islanders, who were of North African origin, already had a whistled language when Spain conquered the volcanic islands in the 15th century Whistled languages survive-today in Papua New Guinea, Mexico, Vietnam, Guyana, China, Nepal, Senegal, and a few mountainous pockets in southern Europe.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là mốc thời gian / trình tự. Passage thực tế viết: “The non- Silbo speakers were not recognising Silbo as a language.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “The Spanish introduced Silbo to the islands in the 15th century.”\n- Passage: “The non- Silbo speakers were not recognising Silbo as a language.”\n- Quan hệ nghĩa: đối lập ở mốc thời gian / trình tự."},{"n":18,"text":"There is precise data available regarding all of the whistle languages in existence today.","answer":"FALSE","source":"Đoạn 10 (PDF trang 91)","evidence":"‘Whistled languages are quite clearly defined and represent an original adaptation of the spoken language for the needs of isolated human groups.’ But with modern communication technology now widely available, researchers say whistled languages like Silbo are threatened with extinction.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là phạm vi / từ tuyệt đối. Passage thực tế viết: “‘Whistled languages are quite clearly defined and represent an original adaptation of the spoken language for the needs of isolated human groups.’ But with modern communication technology now widely available, researchers say whistled la…”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “There is precise data available regarding all of the whistle languages in existence today.”\n- Passage: “‘Whistled languages are quite clearly defined and represent an original adaptation of the spoken language for the needs of isolated human groups.’ But with modern communication technology now widely available, researchers say whistled la…”\n- Quan hệ nghĩa: đối lập ở phạm vi / từ tuyệt đối."},{"n":19,"text":"The children of Gomera now learn Silbo.","answer":"TRUE","source":"Đoạn 1 (PDF trang 88)","evidence":"Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The children of Gomera now learn Silbo.”\n- Passage: “Silbo Gomero – The Whistle ‘Language’ Of The Canary Islands La Gomera is one of the Canary Islands situated in the Atlantic Ocean off the northwest coast of Africa.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."}]},{"id":18,"title":"Spider silk 2","passage":["A strong, light bio-material made by genes from spiders could transform Scientists have succeeded in copying the silk-producing genes of the Golden Orb","Weaver spider and are using them to create a synthetic material which they believe is the model for a new generation of advanced bio-materials. The new material, biosilk, which has been spun for the first time by researchers at DuPont, has an enormous range of potential uses in construction and manufacturing.","B The attraction of the silk spun by the spider is a combination of great strength and bulletproof vests and parachutes.","enormous elasticity, which man-made fibres have been unable to replicate. On an equal-weight basis, spider silk is far stronger than steel and it is estimated that if a single strand could be made about 10m in diameter, it would be strong enough to stop a jumbo jet in flight. A third important factor is that it is extremely light. Army scientists are already looking at the possibilities of using it for lightweight, SUEZ nM Cee aan, Kier ORO nacen EA | Cc For some time, biochemists have been trying to synthesise the drag-line silk of","the Golden Orb Weaver. The drag-line silk, which forms the radial arms of the web, is stronger than the other parts of the web and some biochemists believe a synthetic version could prove to be as important a material as nylon, which has been around for 50 years, since the discoveries of Wallace Carothers and his team ushered in the age of polymers.","To recreate the material, scientists, including Randolph Lewis at the University of Wyoming, first examined the silk-producing gland of the spider. ‘We took out the glands that produce the silk and looked at the coding for the protein material they make, which is spun into a web. We then went looking for clones with the right DNA,‘ he says. At DuPont, researchers have used both yeast and bacteria as hosts to grow the raw material, which they have spun into fibres. Robert Dorsch , DuPont’s","director of biochemical development, says the globules of protein, comparable with marbles in an egg, are harvested and processed. ‘We break open the bacteria, separate out the globules of protein and use them as the raw starting material. With yeast, the gene system can be designed so that the material excretes the protein outside the yeast for better access , “he says.","‘The bacteria and the yeast produce the same protein, equivalent to that which the spider uses in the drag lines of the web. The spider mixes the protein into a water- based solution and then spins it into a solid fibre in one go. Since we are not as clever as the spider and we are not using such sophisticated organisms, we substituted man- made approaches and dissolved the protein in chemical solvents, which are then spun to push the material through small holes to form the solid fibre.’","Researchers at DuPont say they envisage many possible uses for a new biosilk material. They say that earthquake-resistant suspension bridges hung from cables of synthetic spider silk fibres may become a reality. Stronger ropes, safer seat belts, shoe soles that do not wear out so quickly and tough new clothing are among the other applications. Biochemists such as Lewis see the potential range of uses of biosilk as almost limitless. ‘It is very strong and retains elasticitv: there are no man-made materials that can mimic both these properties. It is also a biological material with all the G advantages that has over petrochemicals, “he says. The miracles of science","H At DuPont’s laboratories, Dorsch is excited by the prospect of new super-strong materials but he warns they are many years away. ‘We are at an early stage but theoretical predictions are that we will wind up with a very strong, tough material, with an ability to absorb shock, which is stronger and tougher than the man-made materials that are conventionally available to us, “he says.","I The spider is not the only creature that has aroused the interest of material scientists. They have also become envious of the natural adhesive secreted by the sea mussel. It produces a protein adhesive to attach itself to rocks. It is tedious and expensive to extract the protein from the mussel, so researchers have already produced a synthetic gene for use in surrogate bacteria."],"questions":[{"n":11,"text":"Biosilk has already replaced nylon in parachute manufacture.","answer":"FALSE","source":"Đoạn 1 (PDF trang 94)","evidence":"On an equal-weight basis, spider silk is far stronger than steel and it is estimated that if a single strand could be made about 10m in diameter, it would be strong enough to stop a jumbo jet in flight.","explanation":"Statement có nhắc đúng chủ đề, nhưng mâu thuẫn với thông tin passage. Điểm cần kiểm tra là chủ thể và nội dung khẳng định chính. Passage thực tế viết: “On an equal-weight basis, spider silk is far stronger than steel and it is estimated that if a single strand could be made about 10m in diameter, it would be strong enough to stop a jumbo jet in flight.”. Nội dung này không chỉ thiếu thông tin mà cung cấp một dữ kiện theo hướng trái với mệnh đề trong câu hỏi, nên phải chọn FALSE. Bẫy IELTS: một statement thường giữ nhiều từ khóa của bài nhưng đổi một chi tiết quyết định (phủ định, phạm vi, thời gian, mức độ, đối tượng hoặc quan hệ nguyên nhân); chỉ một thay đổi như vậy cũng đủ làm cả statement sai.","paraphrase":"- Question: “Biosilk has already replaced nylon in parachute manufacture.”\n- Passage: “On an equal-weight basis, spider silk is far stronger than steel and it is estimated that if a single strand could be made about 10m in diameter, it would be strong enough to stop a jumbo jet in flight.”\n- Quan hệ nghĩa: đối lập ở chủ thể và nội dung khẳng định chính."},{"n":12,"text":"The spider produces silk of varying strengths.","answer":"TRUE","source":"Đoạn 2 (PDF trang 96)","evidence":"It produces a protein adhesive to attach itself to rocks.","explanation":"Câu statement giữ nguyên cùng chủ thể và ý chính với passage. Bằng chứng nêu: “It produces a protein adhesive to attach itself to rocks.”. Khi đối chiếu theo chủ thể và nội dung khẳng định chính, không có chi tiết nào trong statement làm thay đổi phạm vi, thời gian hay quan hệ logic của thông tin gốc. Vì vậy thông tin được passage xác nhận và đáp án là TRUE. Bẫy IELTS cần tránh: không đòi hỏi hai câu phải dùng cùng từ; cần nhận ra cách diễn đạt tương đương và kiểm tra toàn bộ điều kiện đi kèm.","paraphrase":"- Question: “The spider produces silk of varying strengths.”\n- Passage: “It produces a protein adhesive to attach itself to rocks.”\n- Quan hệ nghĩa: cùng ý / được passage xác nhận."},{"n":13,"text":"Lewis and Dorsch co-operated in the synthetic production of silk.","answer":"NOT GIVEN","source":"Đoạn 1 (PDF trang 95)","evidence":"The drag-line silk, which forms the radial arms of the web, is stronger than the other parts of the web and some biochemists believe a synthetic version could prove to be as important a material as nylon, which has been around for 50 years, since the discoveries of Wallace Carothers and his team ushered in the age of polymers. To recreate the material, scientists, including Randolph Lewis at the University of Wyoming, first examined the silk-producing gland of the spider. ‘We took out the glands that produce the silk and looked at the coding for the protein material they make, which is spun into a web.","explanation":"Passage có thông tin liên quan đến cùng chủ đề, ví dụ: “The drag-line silk, which forms the radial arms of the web, is stronger than the other parts of the web and some biochemists believe a synthetic version could prove to be as important a material as nylon, which has been around for 50 yea…”. Tuy nhiên, bài không cung cấp dữ kiện đủ để xác nhận hoặc phủ định chi tiết “Dorsch co-operated in the synthetic production of silk” trong statement. Vì vậy không được suy luận thêm từ kiến thức đời sống hoặc từ một chi tiết gần nghĩa; đáp án là NOT GIVEN. Bẫy IELTS: NOT GIVEN khác FALSE ở chỗ passage không đưa ra thông tin ngược lại; nó đơn giản không trả lời đúng phần thông tin quyết định của câu hỏi.","paraphrase":"- Question: “Lewis and Dorsch co-operated in the synthetic production of silk.”\n- Passage: “The drag-line silk, which forms the radial arms of the web, is stronger than the other parts of the web and some biochemists believe a synthetic version could prove to be as important a material as nylon, which has been around for 50 yea…”\n- Quan hệ nghĩa: passage không cung cấp chi tiết quyết định để kết luận."}]},{"id":19,"title":"Morse Code","passage":["A “Calling all. This is our last cry before our eternal silence.” Surprisingly this message, which flashed over the airwaves in the dots and dashes of Morse code on January 31st 1997, was not a desperate transmission by a radio operator on a sinking ship. Rather, it was a message signalling the end of the use of Morse code for distress calls in French waters. Since 1992 countries around the world have","been decommissioning their Morse equipment with similar (if less poetic) signoffs as the world’s shipping switches over to a new satellite-based arrangement, the Global Maritime Distress and Safety System. The final deadline for the switch-over to GMDSS is February 1“,a date
