efit all age groups by providing individuals with the means to freely and creatively express themselves. Self-expression, in turn, promotes individuality, bolsters self-confidence and improves motivation and attitudes towards academic performance. Both active and passive art experiences can provide the benefits of discovery, stimulation and relaxation (Oliphant 2000). Furthermore, people's participation in art enhances their development and expands their thoughts about culture. In short, art can make individuals more socially conscious.","explanation":"Đáp án B — Oliphant khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Art activities can both energize and calm people.\n• Passage: Researcher Howard Spector suggests that active art experiences benefit all age groups by providing individuals with the means to freely and creatively express themselves. Self-expr\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Art activities can both energize and calm people.\n• Passage: Researcher Howard Spector suggests that active art experiences benefit all age groups by providing individuals with the means to freely and creatively express themselves. Self-expr\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"B","correctText":"Oliphant","inputType":"select"}],"sourceNote":""},{"id":11,"title":"Dark Chocolate and Health: People / Organisations","instruction":"Match each statement with the correct person or organisation, A–D.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 11","passage":"A. Dark chocolate is gaining a reputation as a heart-healthy food, and research suggests that there might be some substance behind those claims. Ginger Hultin, owner of Champagne Nutrition in Seattle and a spokesperson for the Academy of Nutrition and Dietetics says ‘Cocoa contains antioxidants in addition to magnesium, potassium, zinc, and iron. Plus, studies have shown that there could be some benefit to consuming chocolate or cocoa for the cardiovascular system, including potentially lowering blood pressure.’\n\nB. Dark chocolate’s health benefits come from its cocoa – specifically its cocoa flavanols. Flavanols are a type of polyphenol, and polyphenols are one group of phytochemicals. Many fruits and vegetables contain flavanols, but they are especially rich in tea, wine, and cocoa. During digestion, cocoa is broken down into smaller chemical compounds. Some research suggests that these compounds have anti-inflammatory and antioxidant properties and may help protect against cardiovascular disease, which affects both the heart and brain. For example, research has found that even two weeks of eating dark chocolate or other flavanol-rich cocoa products is better than a placebo for lowering blood pressure in people who already have high blood pressure, although not to normal levels. In 2013, the European Food Safety Authority approved the claim that cocoa flavanols help maintain normal blood pressure, which means that the cost involved in future medical treatment may be less than scientists previously predicted.\n\nC. Researchers have also pointed out that people may digest cocoa differently. Variations in gut bacteria can influence how flavanols are processed and absorbed in the body. As a result, the health effects of cocoa may differ from person to person, depending on individual digestive systems and dietary habits.\n\nD. Data from the long-running Physicians’ Health Study suggests that chocolate intake is associated with a reduced risk of developing Type 2 diabetes in younger and normal-weight men. However, take those findings with a grain of salt, because they were based on a single question about average yearly intake of chocolate that didn’t ask what type of chocolate- white, milk, or dark-says Howard Sesso, an associate professor of preventive medicine at Brigham and Woman’s Hospital in Boston. ‘If we assume that any benefits from cocoa are attributable to its flavanol content, then dark chocolate should in theory confer greater benefits than milk chocolate.’ Sesso and other researchers are investigating whether taking daily supplements of 600 mg of cocoa flavanols-not chocolate itself-reduces the risk for developing heart disease and stroke, as well as cancer. However, they have yet to determine how much people need to consume to reap benefits\n\nE. What does that mean for the average person who enjoys chocolate and hopes they’re getting some health benefit from it? Sadly, results from the large European Prospective Investigation of Cancer, EPIC-Norfolk study suggest that the amount of flavanols that the average person in Europe or the United States consumes is unlikely to do much to reduce risk of cardiovascular disease compared with taking medicine. The research also suggested that certain groups, particularly overweight individuals, may not receive the same protective effects from chocolate consumption as younger and normal-weight men.\n\nF. Even though cocoa is a key ingredient in milk and dark chocolate, you can’t really be sure how many flavanols you’re getting. ‘Product packaging does not specify amounts of cocoa flavanols, only percent cacao,’ Sesso says. ‘Variable processing of the cocoa bean makes it difficult to equate percent cacao with cocoa flavanol content.’ White chocolate contains no cocoa solids, milk chocolate contains relatively small amounts of cocoa, while dark chocolate contains a much higher percentage of cocoa. Cocoa may also appear in the form of cocoa powder, cocoa butter, or concentrated cocoa extracts.\n\nG. In the meantime, remember that chocolate products are typically high in calories and fats; therefore, Sesso says it’s best not to think of dark chocolate as a health food. ‘Moderation is key; if someone enjoys eating chocolate, it should be done in moderation along with other foods.’ So for now, it’s best not to put all your flavanol eggs in a dark chocolate basket. ‘We get different phytochemicals and antioxidants from a wide variety of foods,’ Hultin says. ‘Including different colors of fruits, vegetables, whole grains and beans is the best way to gain access to fiber that could support health.’ That said, she does recommend enjoying a bit of chocolate or cocoa. ‘I put cocoa powder in my smoothies for an added boost of flavor, nutrients and antioxidants.’","options":[{"id":"A","text":"Ginger Hultin"},{"id":"B","text":"European Food Safety Authority"},{"id":"C","text":"Howard Sesso"},{"id":"D","text":"EPIC-Norfolk"}],"questions":[{"q":19,"context":"19. Eating cocoa together with dietary fiber may improve health.","answerDisplay":"A. Ginger Hultin","sourcePage":"Đoạn A","evidence":"Dark chocolate is gaining a reputation as a heart-healthy food, and research suggests that there might be some substance behind those claims. Ginger Hultin, owner of Champagne Nutrition in Seattle and a spokesperson for the Academy of Nutrition and Dietetics says ‘Cocoa contains antioxidants in addition to magnesium, potassium, zinc, and iron. Plus, studies have shown that there could be some benefit to consuming chocolate or cocoa for the cardiovascular system, including potentially lowering blood pressure.’","explanation":"Đáp án A — Ginger Hultin khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Eating cocoa together with dietary fiber may improve health.\n• Passage: Dark chocolate is gaining a reputation as a heart-healthy food, and research suggests that there might be some substance behind those claims. Ginger Hultin, owner of Champagne Nutr\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Eating cocoa together with dietary fiber may improve health.\n• Passage: Dark chocolate is gaining a reputation as a heart-healthy food, and research suggests that there might be some substance behind those claims. Ginger Hultin, owner of Champagne Nutr\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"A","correctText":"Ginger Hultin","inputType":"select"},{"q":20,"context":"20. Dark chocolate consumption could reduce medical spending in the future.","answerDisplay":"B. European Food Safety Authority","sourcePage":"Đoạn B","evidence":"Dark chocolate’s health benefits come from its cocoa – specifically its cocoa flavanols. Flavanols are a type of polyphenol, and polyphenols are one group of phytochemicals. Many fruits and vegetables contain flavanols, but they are especially rich in tea, wine, and cocoa. During digestion, cocoa is broken down into smaller chemical compounds. Some research suggests that these compounds have anti-inflammatory and antioxidant properties and may help protect against cardiovascular disease, which affects both the heart and brain. For example, research has found that even two weeks of eating dark chocolate or other flavanol-rich cocoa products is better than a placebo for lowering blood pressure in people who already have high blood pressure, although not to normal levels. In 2013, the European Food Safety Authority approved the claim that cocoa flavanols help maintain normal blood pressure, which means that the cost involved in future medical treatment may be less than scientists previously predicted.","explanation":"Đáp án B — European Food Safety Authority khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Dark chocolate consumption could reduce medical spending in the future.\n• Passage: Dark chocolate’s health benefits come from its cocoa – specifically its cocoa flavanols. Flavanols are a type of polyphenol, and polyphenols are one group of phytochemicals. Many f\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Dark chocolate consumption could reduce medical spending in the future.\n• Passage: Dark chocolate’s health benefits come from its cocoa – specifically its cocoa flavanols. Flavanols are a type of polyphenol, and polyphenols are one group of phytochemicals. Many f\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"B","correctText":"European Food Safety Authority","inputType":"select"},{"q":21,"context":"21. Dark chocolate should not be considered a replacement for medicine.","answerDisplay":"D. EPIC-Norfolk","sourcePage":"Đoạn E","evidence":"What does that mean for the average person who enjoys chocolate and hopes they’re getting some health benefit from it? Sadly, results from the large European Prospective Investigation of Cancer, EPIC-Norfolk study suggest that the amount of flavanols that the average person in Europe or the United States consumes is unlikely to do much to reduce risk of cardiovascular disease compared with taking medicine. The research also suggested that certain groups, particularly overweight individuals, may not receive the same protective effects from chocolate consumption as younger and normal-weight men.","explanation":"Đáp án D — EPIC-Norfolk khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Dark chocolate should not be considered a replacement for medicine.\n• Passage: What does that mean for the average person who enjoys chocolate and hopes they’re getting some health benefit from it? Sadly, results from the large European Prospective Investigat\n• Key answer: D\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Dark chocolate should not be considered a replacement for medicine.\n• Passage: What does that mean for the average person who enjoys chocolate and hopes they’re getting some health benefit from it? Sadly, results from the large European Prospective Investigat\n• Key answer: D\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"D","correctText":"EPIC-Norfolk","inputType":"select"},{"q":22,"context":"22. The amount of cocoa required for health benefits remains uncertain.","answerDisplay":"C. Howard Sesso","sourcePage":"Đoạn D","evidence":"Data from the long-running Physicians’ Health Study suggests that chocolate intake is associated with a reduced risk of developing Type 2 diabetes in younger and normal-weight men. However, take those findings with a grain of salt, because they were based on a single question about average yearly intake of chocolate that didn’t ask what type of chocolate- white, milk, or dark-says Howard Sesso, an associate professor of preventive medicine at Brigham and Woman’s Hospital in Boston. ‘If we assume that any benefits from cocoa are attributable to its flavanol content, then dark chocolate should in theory confer greater benefits than milk chocolate.’ Sesso and other researchers are investigating whether taking daily supplements of 600 mg of cocoa flavanols-not chocolate itself-reduces the risk for developing heart disease and stroke, as well as cancer. However, they have yet to determine how much people need to consume to reap benefits","explanation":"Đáp án C — Howard Sesso khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: The amount of cocoa required for health benefits remains uncertain.\n• Passage: Data from the long-running Physicians’ Health Study suggests that chocolate intake is associated with a reduced risk of developing Type 2 diabetes in younger and normal-weight men.\n• Key answer: C\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: The amount of cocoa required for health benefits remains uncertain.\n• Passage: Data from the long-running Physicians’ Health Study suggests that chocolate intake is associated with a reduced risk of developing Type 2 diabetes in younger and normal-weight men.\n• Key answer: C\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"C","correctText":"Howard Sesso","inputType":"select"}],"sourceNote":""},{"id":12,"title":"Multitasking: Scientists","instruction":"Match each statement with the correct scientist, A–E. Letters may be used more than once when the source permits.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 12","passage":"He designed an experiment where he presents visual stimulants to his subjects in a way that mimics multi-tasking.... What he found is that the brain neurons only lit up in singular areas one at a time, and never simultaneously.\n\nHe found that doing different jobs at the same time may actually save time. However, despite the fact that they are faster, it does not mean they are more efficient.\n\nThomas Lehman... believes people never really do multiple things simultaneously. Maybe a person is reading while listening to music, but in reality, the brain can only focus on one task.\n\nAccording to human nature, people feel more comfortable and efficient in environments with a variety of tasks. Edward Hallowell said that people are losing a lot of efficiency in the workplace due to multitasking, outside distractions and self-distractions.\n\nAs a matter of fact, the changes made to the workplace do not have to be dramatic.... certain common workplace tasks, such as group meetings, would be more efficient if we banned cell-phones, a common distraction.","options":[{"id":"A","text":"Thomas Lehman"},{"id":"B","text":"Earl Miller"},{"id":"C","text":"David Meyer"},{"id":"D","text":"Gloria Mark"},{"id":"E","text":"Edward Hallowell"}],"questions":[{"q":19,"context":"19. When faced multiple visual stimulants, one can only concentrate on one of them.","answerDisplay":"B. Earl Miller","sourcePage":"Đoạn C – Earl Miller","evidence":"He designed an experiment where he presents visual stimulants to his subjects in a way that mimics multi-tasking.... What he found is that the brain neurons only lit up in singular areas one at a time, and never simultaneously.","explanation":"Earl Miller trực tiếp dùng “visual stimulants” trong thí nghiệm và quan sát hoạt động thần kinh. Neurons chỉ sáng ở từng vùng riêng lẻ tại một thời điểm, không đồng thời. Điều đó tương ứng với ý người ta chỉ có thể tập trung xử lý một stimulus tại một thời điểm. Vì vậy chọn B.\nBẫy / điểm cần chú ý: Tên Earl Miller gắn với thí nghiệm prefrontal cortex và visual stimuli; đây là dấu hiệu phân biệt rất rõ.\nParaphrase:\n• multiple visual stimulants = visual stimulants ... mimics multi-tasking\n• only concentrate on one = singular areas one at a time\n• not at the same time = never simultaneously","paraphrase":"• multiple visual stimulants = visual stimulants ... mimics multi-tasking\n• only concentrate on one = singular areas one at a time\n• not at the same time = never simultaneously","warning":"","correct":"B","correctText":"Earl Miller","inputType":"select"},{"q":20,"context":"20. Doing two things together may be faster but not better.","answerDisplay":"D. Gloria Mark","sourcePage":"Đoạn E – Gloria Mark","evidence":"He found that doing different jobs at the same time may actually save time. However, despite the fact that they are faster, it does not mean they are more efficient.","explanation":"Gloria Mark quan sát nhân viên văn phòng và nhận thấy đa nhiệm có thể tiết kiệm thời gian, tức “faster”, nhưng tốc độ không đồng nghĩa hiệu quả cao hơn. “not better” trong statement được cụ thể hóa bằng “not ... more efficient”. Vì vậy đáp án là D.\nBẫy / điểm cần chú ý: Bẫy: David Meyer nói làm hai việc tốn nhiều thời gian hơn; Gloria Mark mới là người nói có thể nhanh hơn nhưng kém hiệu quả.\nParaphrase:\n• may be faster = may actually save time / they are faster\n• but not better = does not mean they are more efficient\n• doing two things together = doing different jobs at the same time","paraphrase":"• may be faster = may actually save time / they are faster\n• but not better = does not mean they are more efficient\n• doing two things together = doing different jobs at the same time","warning":"","correct":"D","correctText":"Gloria Mark","inputType":"select"},{"q":21,"context":"21. People never really do two things together even if you think you do.","answerDisplay":"A. Thomas Lehman","sourcePage":"Đoạn A – Thomas Lehman","evidence":"Thomas Lehman... believes people never really do multiple things simultaneously. Maybe a person is reading while listening to music, but in reality, the brain can only focus on one task.","explanation":"Statement gần như paraphrase trực tiếp quan điểm của Thomas Lehman. Ông cho rằng con người tưởng mình đang làm nhiều việc cùng lúc, nhưng thực chất bộ não chỉ tập trung vào một việc tại một thời điểm. Vì vậy đáp án A.\nBẫy / điểm cần chú ý: Không nhầm với Earl Miller: Miller cung cấp bằng chứng neuron; Lehman là người nêu quan điểm khái quát ở đoạn A.\nParaphrase:\n• never really do two things together = never really do multiple things simultaneously\n• even if you think you do = maybe ... reading while listening ... but in reality\n• one task = the brain can only focus on one task","paraphrase":"• never really do two things together = never really do multiple things simultaneously\n• even if you think you do = maybe ... reading while listening ... but in reality\n• one task = the brain can only focus on one task","warning":"","correct":"A","correctText":"Thomas Lehman","inputType":"select"},{"q":22,"context":"22. The causes of multitask lie in the environment.","answerDisplay":"E. Edward Hallowell","sourcePage":"Đoạn F – Edward Hallowell","evidence":"According to human nature, people feel more comfortable and efficient in environments with a variety of tasks. Edward Hallowell said that people are losing a lot of efficiency in the workplace due to multitasking, outside distractions and self-distractions.","explanation":"Câu hỏi nhấn mạnh nguyên nhân đa nhiệm/xao nhãng gắn với môi trường. Đoạn F đặt nhận định của Edward Hallowell trong bối cảnh “environments with a variety of tasks” và nêu “outside distractions” cùng self-distractions. Vì vậy người phù hợp là Edward Hallowell (E).\nBẫy / điểm cần chú ý: Gloria Mark cũng nghiên cứu sự gián đoạn ở văn phòng, nhưng statement này trong bộ câu hỏi được gắn với Hallowell qua cụm environment/outside distractions.\nParaphrase:\n• lie in the environment = environments with a variety of tasks / outside distractions\n• causes of multitask = due to multitasking, outside distractions and self-distractions\n• work environment = workplace","paraphrase":"• lie in the environment = environments with a variety of tasks / outside distractions\n• causes of multitask = due to multitasking, outside distractions and self-distractions\n• work environment = workplace","warning":"","correct":"E","correctText":"Edward Hallowell","inputType":"select"},{"q":23,"context":"23. Even minor changes in the workplace will improve work efficiency.","answerDisplay":"E. Edward Hallowell","sourcePage":"Đoạn F – Edward Hallowell","evidence":"As a matter of fact, the changes made to the workplace do not have to be dramatic.... certain common workplace tasks, such as group meetings, would be more efficient if we banned cell-phones, a common distraction.","explanation":"“Minor changes” được paraphrase bằng “do not have to be dramatic”. Đoạn F nói chỉ cần những điều chỉnh nhỏ như cấm điện thoại trong họp nhóm cũng có thể làm công việc hiệu quả hơn. Vì vậy quan điểm này thuộc Edward Hallowell, đáp án E.\nBẫy / điểm cần chú ý: Câu 22 và 23 có thể cùng dùng E vì hướng dẫn cho phép “You may use any letter more than once”.\nParaphrase:\n• minor changes = changes ... do not have to be dramatic\n• improve work efficiency = would be more efficient\n• workplace = workplace tasks / group meetings","paraphrase":"• minor changes = changes ... do not have to be dramatic\n• improve work efficiency = would be more efficient\n• workplace = workplace tasks / group meetings","warning":"","correct":"E","correctText":"Edward Hallowell","inputType":"select"}],"sourceNote":"Phần này của PDF gốc là scan/text-layer không ổn định. Cột bài đọc chỉ hiển thị các đoạn văn đã được xác minh trong file GIẢI THÍCH FULL; không bổ sung nội dung không đọc chắc chắn từ nguồn."},{"id":13,"title":"Interactive Television: People / Organisations","instruction":"Match each statement with the correct person/organisation, A–F. The source list contains A–F although one instruction line in the scan says A–E.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 13","passage":"Han Weegink of CMG, a firm that provides text-message infrastructure, noted that all this is subtly changing the nature of television.\n\nIn July, a British operator, mmO2, reported better-than-expected financial results, thanks to the flood of messages caused by “Big Brother\n\nThe availability of such common shortcodes was a breakthrough, says Lars Becker of Flytxt, a mobile-marketing firm, since shortcodes are far easier to remember when flashed up on the screen.\n\nEndemol, the Netherlands-based production company behind “Big Brother\n\nPeople tend to have their mobiles with them on the sofa, so “it’s a very natural form of interaction,","options":[{"id":"A","text":"Lars Becker Flytxt"},{"id":"B","text":"Katrina Bond of Analysys"},{"id":"C","text":"Endemol"},{"id":"D","text":"CMG"},{"id":"E","text":"mmO2"},{"id":"F","text":"Gartner"}],"questions":[{"q":36,"context":"36. offer mobile phone message technology","answerDisplay":"D. CMG","sourcePage":"Đoạn F","evidence":"Han Weegink of CMG, a firm that provides text-message infrastructure, noted that all this is subtly changing the nature of television.","explanation":"“offer mobile phone message technology” được paraphrase bằng “provides text-message infrastructure”. CMG là công ty cung cấp hạ tầng công nghệ nhắn tin, nên đáp án D.\nBẫy / điểm cần chú ý: Không chọn Flytxt: Flytxt được mô tả là mobile-marketing firm và Lars Becker nói về shortcodes, không phải nhà cung cấp infrastructure trong câu 36.\nParaphrase:\n• offer/provide = provides\n• mobile phone message technology = text-message infrastructure\n• CMG = a firm that provides text-message infrastructure","paraphrase":"• offer/provide = provides\n• mobile phone message technology = text-message infrastructure\n• CMG = a firm that provides text-message infrastructure","warning":"","correct":"D","correctText":"CMG","inputType":"select"},{"q":37,"context":"37. earned considerable amount of money through a famous program","answerDisplay":"E. mmO2","sourcePage":"Đoạn C","evidence":"In July, a British operator, mmO2, reported better-than-expected financial results, thanks to the flood of messages caused by “Big Brother","explanation":"“earned considerable amount of money” tương ứng với “better-than-expected financial results”; “a famous program” là Big Brother. Nhà mạng được nêu trực tiếp là mmO2, nên chọn E.\nBẫy / điểm cần chú ý: Endemol đứng sau Big Brother nhưng câu này hỏi đơn vị báo cáo kết quả tài chính tốt nhờ lượng tin nhắn, đó là mmO2.\nParaphrase:\n• earned considerable amount of money = better-than-expected financial results\n• through a famous program = thanks to ... messages caused by Big Brother\n• mmO2 = a British operator","paraphrase":"• earned considerable amount of money = better-than-expected financial results\n• through a famous program = thanks to ... messages caused by Big Brother\n• mmO2 = a British operator","warning":"","correct":"E","correctText":"mmO2","inputType":"select"},{"q":38,"context":"38. shortcodes are convenient to remember when turn up","answerDisplay":"A. Lars Becker Flytxt","sourcePage":"Đoạn D","evidence":"The availability of such common shortcodes was a breakthrough, says Lars Becker of Flytxt, a mobile-marketing firm, since shortcodes are far easier to remember when flashed up on the screen.","explanation":"Statement gần như lấy trực tiếp lời Lars Becker: shortcodes dễ nhớ hơn khi xuất hiện trên màn hình. Vì vậy đáp án A.\nBẫy / điểm cần chú ý: Đây là Matching Features có tên người được gắn trực tiếp với câu trích dẫn, nên không cần suy luận xa.\nParaphrase:\n• convenient to remember = far easier to remember\n• when turn up = when flashed up on the screen\n• Lars Becker Flytxt = người đưa nhận định","paraphrase":"• convenient to remember = far easier to remember\n• when turn up = when flashed up on the screen\n• Lars Becker Flytxt = người đưa nhận định","warning":"","correct":"A","correctText":"Lars Becker Flytxt","inputType":"select"},{"q":39,"context":"39. build their own mobile phone operating applications","answerDisplay":"C. Endemol","sourcePage":"Đoạn C","evidence":"Endemol, the Netherlands-based production company behind “Big Brother","explanation":"Trong các lựa chọn, Endemol là tổ chức được mô tả đang tự xây dựng tài sản/hệ thống liên quan trực tiếp đến người dùng di động: database riêng và sau đó là quan hệ thanh toán trực tiếp. Vì vậy đáp án intended là C. Tuy nhiên wording “mobile phone operating applications” trong câu hỏi không khớp chính xác với passage; passage nói “database of mobile-phone users”, không nói “applications”.\nBẫy / điểm cần chú ý: CÂU HỎI BIÊN SOẠN CHƯA CHẶT: từ “applications” không có bằng chứng trực tiếp. Endemol vẫn là lựa chọn phù hợp nhất và là đáp án intended.\nParaphrase:\n• build their own = has started building its own\n• mobile phone ... = database of mobile-phone users\n• operating/bypass operators = establish direct billing relationships ... bypass the operators","paraphrase":"• build their own = has started building its own\n• mobile phone ... = database of mobile-phone users\n• operating/bypass operators = establish direct billing relationships ... bypass the operators","warning":"","correct":"C","correctText":"Endemol","inputType":"select"},{"q":40,"context":"40. it is easy for people to send messages in an interactive TV","answerDisplay":"F. Gartner","sourcePage":"Đoạn B – Adam Daum of Gartner","evidence":"People tend to have their mobiles with them on the sofa, so “it’s a very natural form of interaction,","explanation":"Adam Daum của Gartner cho rằng khán giả thường cầm điện thoại khi ngồi xem TV, vì vậy nhắn tin là một hình thức tương tác rất tự nhiên/dễ dàng. Điều này khớp với statement “it is easy for people to send messages in an interactive TV”. Do đó chọn F, Gartner.\nBẫy / điểm cần chú ý: CMG nói về infrastructure và sự thay đổi bản chất TV; Gartner mới đưa nhận định về tính tự nhiên/dễ dùng của việc nhắn tin khi xem TV.\nParaphrase:\n• easy/natural = a very natural form of interaction\n• send messages in interactive TV = TV-texting / interacting with television\n• people = have their mobiles with them on the sofa\n• Gartner = Adam Daum of Gartner","paraphrase":"• easy/natural = a very natural form of interaction\n• send messages in interactive TV = TV-texting / interacting with television\n• people = have their mobiles with them on the sofa\n• Gartner = Adam Daum of Gartner","warning":"","correct":"F","correctText":"Gartner","inputType":"select"}],"sourceNote":"Phần này của PDF gốc là scan/text-layer không ổn định. Cột bài đọc chỉ hiển thị các đoạn văn đã được xác minh trong file GIẢI THÍCH FULL; không bổ sung nội dung không đọc chắc chắn từ nguồn."},{"id":14,"title":"What the Managers Really Do?: Categories","instruction":"Match each feature with the correct category of managerial role, A–C.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 14","passage":"Decisional roles require managers to plan strategy and utilise resources. There are four specific roles that are decisional. The entrepreneur role requires the manager to assign resources to develop innovative goods and services, or to expand a business.\n\nThe figurehead is typically a top or middle manager. This manager may communicate future organisational goals or ethical guidelines to employees at company meetings. They also attend ribbon-cutting ceremonies, host receptions, presentations and other activities associated with the figurehead role.\n\nDecisional roles require managers to plan strategy and utilise resources.... The third decisional role, that of resource allocator, involves determining which work units will get which resources. Top managers are likely to make larger, overall budget decisions, while middle managers may make more specific allocations.\n\nInformational roles are those in which managers obtain and transmit information. These roles have changed dramatically as technology has improved.\n\nThe role of disseminator requires that managers inform employees of changes that affect them and the organisation. They also communicate the company's vision and purpose.\n\nA leader acts as an example for other employees to follow, gives commands and directions to subordinates, makes decisions, and mobilises employee support. They are also responsible for the selection and training of employees.","options":[{"id":"A","text":"INTERPERSONAL ROLES"},{"id":"B","text":"INFORMATIONAL ROLES"},{"id":"C","text":"DECISIONAL ROLES"}],"questions":[{"q":1,"context":"1. the development of business scheme","answerDisplay":"C. DECISIONAL ROLES","sourcePage":"Đoạn 5 - DECISIONAL ROLES","evidence":"Decisional roles require managers to plan strategy and utilise resources. There are four specific roles that are decisional. The entrepreneur role requires the manager to assign resources to develop innovative goods and services, or to expand a business.","explanation":"Câu hỏi nói về việc phát triển một “business scheme” - tức xây dựng hướng đi/kế hoạch phát triển kinh doanh. Ở nhóm DECISIONAL ROLES, nhà quản lý phải lập chiến lược, sử dụng nguồn lực và trong vai trò entrepreneur có thể phân bổ nguồn lực để phát triển sản phẩm/dịch vụ mới hoặc mở rộng doanh nghiệp. Đây là hành vi ra quyết định chiến lược, không phải giao tiếp con người hay truyền đạt thông tin. Vì vậy chọn C.\nBẫy / điểm cần chú ý: A và B đều có thể liên quan đến hoạt động quản lý, nhưng không trực tiếp bao quát việc xây dựng/triển khai kế hoạch phát triển doanh nghiệp.\nParaphrase:\n• development of business scheme = plan strategy / expand a business\n• using resources for development = assign resources to develop innovative goods and services\n• DECISIONAL ROLES = vai trò liên quan lập chiến lược và phân bổ nguồn lực","paraphrase":"• development of business scheme = plan strategy / expand a business\n• using resources for development = assign resources to develop innovative goods and services\n• DECISIONAL ROLES = vai trò liên quan lập chiến lược và phân bổ nguồn lực","warning":"","correct":"C","correctText":"DECISIONAL ROLES","inputType":"select"},{"q":2,"context":"2. presiding at formal events","answerDisplay":"A. INTERPERSONAL ROLES","sourcePage":"Đoạn 3 - INTERPERSONAL ROLES","evidence":"The figurehead is typically a top or middle manager. This manager may communicate future organisational goals or ethical guidelines to employees at company meetings. They also attend ribbon-cutting ceremonies, host receptions, presentations and other activities associated with the figurehead role.","explanation":"“Presiding at formal events” thuộc vai trò figurehead - một vai trò mang tính đại diện, nghi thức và tương tác với con người. Passage nêu các hoạt động như dự lễ cắt băng, chủ trì tiếp đón, thuyết trình và các hoạt động nghi thức khác. Figurehead nằm trong INTERPERSONAL ROLES nên đáp án là A.\nBẫy / điểm cần chú ý: Không chọn INFORMATIONAL chỉ vì có “presentations”; câu hỏi hỏi chức năng đại diện/chủ trì sự kiện, không hỏi truyền tải nội dung thông tin.\nParaphrase:\n• presiding at formal events = attend ribbon-cutting ceremonies / host receptions / presentations\n• formal representative = figurehead\n• figurehead role = INTERPERSONAL ROLES","paraphrase":"• presiding at formal events = attend ribbon-cutting ceremonies / host receptions / presentations\n• formal representative = figurehead\n• figurehead role = INTERPERSONAL ROLES","warning":"","correct":"A","correctText":"INTERPERSONAL ROLES","inputType":"select"},{"q":3,"context":"3. using employees and funds","answerDisplay":"C. DECISIONAL ROLES","sourcePage":"Đoạn 5 - DECISIONAL ROLES","evidence":"Decisional roles require managers to plan strategy and utilise resources.... The third decisional role, that of resource allocator, involves determining which work units will get which resources. Top managers are likely to make larger, overall budget decisions, while middle managers may make more specific allocations.","explanation":"“Employees and funds” đều là nguồn lực của tổ chức. Passage mô tả resource allocator thuộc DECISIONAL ROLES: nhà quản lý quyết định đơn vị nào nhận nguồn lực nào và cấp quản lý cao hơn đưa ra các quyết định ngân sách. Vì vậy “using employees and funds” chính là việc sử dụng/phân bổ nguồn lực và thuộc C.\nBẫy / điểm cần chú ý: INTERPERSONAL có làm việc với nhân viên, nhưng câu hỏi nhấn mạnh việc sử dụng cả nhân sự lẫn tiền - tức phân bổ resources.\nParaphrase:\n• employees and funds = organisational resources\n• using = utilise / allocate\n• funds = budget decisions\n• resource allocator = DECISIONAL ROLES","paraphrase":"• employees and funds = organisational resources\n• using = utilise / allocate\n• funds = budget decisions\n• resource allocator = DECISIONAL ROLES","warning":"","correct":"C","correctText":"DECISIONAL ROLES","inputType":"select"},{"q":4,"context":"4. getting and passing message on to related persons","answerDisplay":"B. INFORMATIONAL ROLES","sourcePage":"Đoạn 4 - INFORMATIONAL ROLES","evidence":"Informational roles are those in which managers obtain and transmit information. These roles have changed dramatically as technology has improved.","explanation":"Câu hỏi gần như paraphrase trực tiếp định nghĩa của INFORMATIONAL ROLES. “Getting” tương ứng với “obtain”, còn “passing message on” tương ứng với “transmit information”. Do đó đáp án B.\nBẫy / điểm cần chú ý: Đây là câu định nghĩa; không cần suy luận từ ví dụ cụ thể.\nParaphrase:\n• getting = obtain\n• passing message on = transmit information\n• message = information\n• related persons = những người cần nhận thông tin","paraphrase":"• getting = obtain\n• passing message on = transmit information\n• message = information\n• related persons = những người cần nhận thông tin","warning":"","correct":"B","correctText":"INFORMATIONAL ROLES","inputType":"select"},{"q":5,"context":"5. relating the information to employees and organisation","answerDisplay":"B. INFORMATIONAL ROLES","sourcePage":"Đoạn 4 - INFORMATIONAL ROLES","evidence":"The role of disseminator requires that managers inform employees of changes that affect them and the organisation. They also communicate the company's vision and purpose.","explanation":"Vai trò disseminator thuộc nhóm INFORMATIONAL ROLES và nhiệm vụ của nó là truyền đạt thông tin cho nhân viên về những thay đổi ảnh hưởng đến họ và tổ chức, đồng thời truyền đạt tầm nhìn/mục đích công ty. Cụm “relating the information to employees and organisation” khớp trực tiếp với chức năng này.\nBẫy / điểm cần chú ý: Không chọn INTERPERSONAL chỉ vì có employees; điểm quyết định là hành động “inform/communicate”.\nParaphrase:\n• relating the information = inform / communicate\n• employees and organisation = employees ... and the organisation\n• disseminator = vai trò truyền bá thông tin","paraphrase":"• relating the information = inform / communicate\n• employees and organisation = employees ... and the organisation\n• disseminator = vai trò truyền bá thông tin","warning":"","correct":"B","correctText":"INFORMATIONAL ROLES","inputType":"select"},{"q":6,"context":"6. recruiting the staff","answerDisplay":"A. INTERPERSONAL ROLES","sourcePage":"Đoạn 3 - INTERPERSONAL ROLES","evidence":"A leader acts as an example for other employees to follow, gives commands and directions to subordinates, makes decisions, and mobilises employee support. They are also responsible for the selection and training of employees.","explanation":"“Recruiting the staff” tương ứng với quá trình selection of employees. Trong passage, selection và training là trách nhiệm của vai trò leader, và leader thuộc INTERPERSONAL ROLES. Vì vậy chọn A.\nBẫy / điểm cần chú ý: Từ “makes decisions” xuất hiện trong đoạn leader không biến câu này thành DECISIONAL; nhiệm vụ cụ thể được hỏi là tuyển chọn nhân viên.\nParaphrase:\n• recruiting the staff = selection of employees\n• leader = quản lý con người trực tiếp\n• leader role = INTERPERSONAL ROLES","paraphrase":"• recruiting the staff = selection of employees\n• leader = quản lý con người trực tiếp\n• leader role = INTERPERSONAL ROLES","warning":"","correct":"A","correctText":"INTERPERSONAL ROLES","inputType":"select"}],"sourceNote":"Phần này của PDF gốc là scan/text-layer không ổn định. Cột bài đọc chỉ hiển thị các đoạn văn đã được xác minh trong file GIẢI THÍCH FULL; không bổ sung nội dung không đọc chắc chắn từ nguồn."},{"id":15,"title":"Cultural Thought Patterns: Researchers","instruction":"Match each statement with the correct researcher/research team, A–C.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 15","passage":"However, when the groups were then presented with arguments opposing the initial position, the Korean subjects generally modified and decreased their support for that position, while the Americans actually increased their original support.\n\nIn one study, for example, by Dr. Nisbett and Takahiko Masuda... students from Japan and the United States were shown an animated underwater scene... Asked to describe what they saw, the Japanese... were much more likely to begin by setting the scene... Americans... tended to begin their descriptions with the largest fish.\n\nThe Americans were more likely to accept the validity of the series of statements. They assumed the conclusion must be true because of the logical structure of the arguments. The Korean subjects, by contrast, more frequently judged the argument as invalid based on their own understanding that it was not actually true.\n\nShown the same larger fish swimming against a different, novel background, Japanese participants had more difficulty recognizing it than Americans. This indicated that the perception of the Japanese was closely dependent upon what they saw in the background.","options":[{"id":"A","text":"Takahiko Masuda and Dr. Nisbett"},{"id":"B","text":"Incheol Choi and Dr. Nisbett"},{"id":"C","text":"Ara Norenzayan and Dr. Nisbett"}],"questions":[{"q":19,"context":"19. Westerners tend to adhere to their beliefs even when they are presented with contradictory evidence.","answerDisplay":"B. Incheol Choi and Dr. Nisbett","sourcePage":"Đoạn D - Dr. Nisbett & Dr. Incheol Choi","evidence":"However, when the groups were then presented with arguments opposing the initial position, the Korean subjects generally modified and decreased their support for that position, while the Americans actually increased their original support.","explanation":"Nhóm Americans/Westerners không giảm niềm tin khi gặp lập luận đối lập mà còn “increased their original support”. Điều này khớp với việc tiếp tục bám vào belief ngay cả trước contradictory evidence. Nghiên cứu này do Incheol Choi và Dr. Nisbett thực hiện, nên chọn B.\nBẫy / điểm cần chú ý: Không nhầm với nghiên cứu formal logic ở đoạn E; Q19 nói phản ứng trước lập luận đối lập của thí nghiệm đoạn D.\nParaphrase:\n• Westerners = Americans\n• adhere to their beliefs = increased their original support\n• contradictory evidence = arguments opposing the initial position","paraphrase":"• Westerners = Americans\n• adhere to their beliefs = increased their original support\n• contradictory evidence = arguments opposing the initial position","warning":"","correct":"B","correctText":"Incheol Choi and Dr. Nisbett","inputType":"select"},{"q":20,"context":"20. Visual images can be used to reveal differences in people’s thought processes.","answerDisplay":"A. Takahiko Masuda and Dr. Nisbett","sourcePage":"Đoạn C - Dr. Nisbett & Takahiko Masuda","evidence":"In one study, for example, by Dr. Nisbett and Takahiko Masuda... students from Japan and the United States were shown an animated underwater scene... Asked to describe what they saw, the Japanese... were much more likely to begin by setting the scene... Americans... tended to begin their descriptions with the largest fish.","explanation":"Nghiên cứu dùng một hình ảnh/cảnh hoạt hình để làm lộ sự khác biệt trong cách chú ý và xử lý thông tin giữa hai nhóm văn hóa. Vì vậy statement về visual images revealing thought-process differences thuộc Takahiko Masuda và Dr. Nisbett, đáp án A.\nBẫy / điểm cần chú ý: Chi tiết “animated underwater scene” là dấu hiệu nhận diện nghiên cứu A.\nParaphrase:\n• visual images = an animated underwater scene\n• reveal differences = Japanese focused context / Americans focused focal fish\n• thought processes = attention to context vs focal object","paraphrase":"• visual images = an animated underwater scene\n• reveal differences = Japanese focused context / Americans focused focal fish\n• thought processes = attention to context vs focal object","warning":"","correct":"A","correctText":"Takahiko Masuda and Dr. Nisbett","inputType":"select"},{"q":21,"context":"21. Easterners are likely to reject a well-reasoned argument that they know to be false.","answerDisplay":"C. Ara Norenzayan and Dr. Nisbett","sourcePage":"Đoạn E - Dr. Nisbett & Dr. Ara Norenzayan","evidence":"The Americans were more likely to accept the validity of the series of statements. They assumed the conclusion must be true because of the logical structure of the arguments. The Korean subjects, by contrast, more frequently judged the argument as invalid based on their own understanding that it was not actually true.","explanation":"Người Hàn/Easterners có thể bác bỏ một chuỗi lập luận có cấu trúc logic hợp lệ nếu kết luận trái với hiểu biết thực tế của họ. Điều này đúng với statement “reject a well-reasoned argument that they know to be false”. Nghiên cứu do Ara Norenzayan và Dr. Nisbett thực hiện, chọn C.\nBẫy / điểm cần chú ý: Đây là xung đột giữa formal logic và experiential knowledge, không phải thí nghiệm thay đổi quan điểm ở D.\nParaphrase:\n• well-reasoned argument = logical structure of the arguments\n• reject = judged the argument as invalid\n• know to be false = based on their own understanding that it was not actually true","paraphrase":"• well-reasoned argument = logical structure of the arguments\n• reject = judged the argument as invalid\n• know to be false = based on their own understanding that it was not actually true","warning":"","correct":"C","correctText":"Ara Norenzayan and Dr. Nisbett","inputType":"select"},{"q":22,"context":"22. Easterners may find it hard to identify a familiar object in new circumstances.","answerDisplay":"A. Takahiko Masuda and Dr. Nisbett","sourcePage":"Đoạn C - Dr. Nisbett & Takahiko Masuda","evidence":"Shown the same larger fish swimming against a different, novel background, Japanese participants had more difficulty recognizing it than Americans. This indicated that the perception of the Japanese was closely dependent upon what they saw in the background.","explanation":"“The same larger fish” là vật quen thuộc, còn “a different, novel background” là hoàn cảnh mới. Người Nhật khó nhận ra con cá hơn người Mỹ. Đây chính xác là “find it hard to identify a familiar object in new circumstances”, nên đáp án A.\nBẫy / điểm cần chú ý: Câu 20 và 22 cùng thuộc nghiên cứu A nhưng kiểm tra hai kết quả khác nhau.\nParaphrase:\n• familiar object = the same larger fish\n• new circumstances = a different, novel background\n• find it hard to identify = had more difficulty recognizing it","paraphrase":"• familiar object = the same larger fish\n• new circumstances = a different, novel background\n• find it hard to identify = had more difficulty recognizing it","warning":"","correct":"A","correctText":"Takahiko Masuda and Dr. Nisbett","inputType":"select"}],"sourceNote":"Phần này của PDF gốc là scan/text-layer không ổn định. Cột bài đọc chỉ hiển thị các đoạn văn đã được xác minh trong file GIẢI THÍCH FULL; không bổ sung nội dung không đọc chắc chắn từ nguồn."},{"id":16,"title":"Stages of Adolescence: Characteristics","instruction":"Match each characteristic with the correct stage of adolescence, A–C.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 16","passage":"The effect of this rapid change is that mid-adolescents are body-conscious, and their concerns are directed towards their opposite-sexed peers.\n\nMid-adolescents must identify, at least at a preliminary level, what their adult vocational goals are and how they intend to achieve them.\n\nEarly adolescence is also a period of intense conformity to peers. ‘Fitting in’, not being different, and being accepted seem somehow pressing to this age group.\n\nDuring the early adolescent years a young person begins to recognise their uniqueness and to establish themselves as separate individuals, independent of their parents.\n\nCertainly, by late adolescence or early adulthood the need for peer approval has diminished.\n\nRisky behaviours are sufficiently pervasive among adolescents to suggest that risk-taking may be a normal developmental process of middle adolescence.","options":[{"id":"A","text":"early adolescence"},{"id":"B","text":"middle adolescence"},{"id":"C","text":"late adolescence"}],"questions":[{"q":1,"context":"1. becoming interested in people of the other gender","answerDisplay":"B. middle adolescence","sourcePage":"Nguồn đã xác minh","evidence":"The effect of this rapid change is that mid-adolescents are body-conscious, and their concerns are directed towards their opposite-sexed peers.","explanation":"“People of the other gender” được diễn đạt lại bằng “opposite-sexed peers”. Chủ thể được nêu trực tiếp là “mid-adolescents”, nên function showStart(){activeEx=null;const last=storageOK?(localStorage.getItem(LAST_NAME_KEY)||''):'';app.innerHTML=`<div class="start-wrap"><div class="start-card"><div class="brandline"></div><div class="eyebrow">IELTS ACADEMIC READING</div><h1>Matching Features Practice</h1><p>16 Exercises • 71 câu Matching Features đã được xác minh. Không tính thời gian. Passage và câu hỏi được trình bày dạng text để làm trực tiếp trên máy tính.</p><label class="name-label" for="studentName">Họ và tên học sinh</label><input id="studentName" class="name-input" autocomplete="name" value="${esc(last)}" placeholder="Nhập họ và tên"><button id="enterBtn" class="primary">VÀO DANH SÁCH BÀI</button><div class="small-note"><b>Phạm vi:</b> HTML này bám đúng 16 nhóm / 71 câu đã được xác minh trong file GIẢI THÍCH FULL; không tự thêm các phần scan chưa đủ căn cứ từ PDF gốc.<br><br>Đáp án, evidence và giải thích chỉ xuất hiện sau khi nộp từng Exercise. ${storageOK?'Tiến độ được lưu bằng localStorage trên trình duyệt này.':'<b>Trình duyệt hiện không cho phép localStorage; tiến độ sẽ không được giữ sau khi đóng trang.</b>'}</div></div></div>`;$('#enterBtn').onclick=enter;$('#studentName').onkeydown=e=>{if(e.key==='Enter')enter()};setTimeout(()=>$('#studentName').focus(),30)}

function dashStats(){let done=0,inprog=0,correct=0,totalDone=0;for(const ex of EXERCISES){const st=profile.exercises[ex.id];if(st?.submitted){done++;const g=st.result||grade(ex,st);correct+=g.correct;totalDone+=g.total}else if(st&&answeredCount(ex,st)>0)inprog++}return{done,inprog,correct,totalDone}}
function showDashboard(){activeEx=null;const ds=dashStats();const avg=ds.totalDone?Math.round(ds.correct/ds.totalDone*100):0;app.innerHTML=`<div class="dash"><div class="dash-head"><div><div class="dash-title">IELTS Reading • Matching Features</div><div class="dash-user">Học sinh: ${esc(currentName)} • Không tính thời gian</div></div><div class="dash-actions"><button id="changeUser">ĐỔI HỌC SINH</button></div></div><main class="dash-main"><div class="summary-row"><div class="summary"><span>Đã hoàn thành</span><b>${ds.done}/${EXERCISES.length}</b></div><div class="summary"><span>Đang làm dở</span><b>${ds.inprog}</b></div><div class="summary"><span>Độ chính xác bài đã nộp</span><b>${avg}%</b></div></div><div class="picker"><label for="exPicker">CHỌN EXERCISE</label><select id="exPicker"><option value="">— Chọn bài —</option>${EXERCISES.map(ex=>{const st=profile.exercises[ex.id];const label=st?.submitted?'ĐÃ LÀM':st&&answeredCount(ex,st)?'ĐANG LÀM':'CHƯA LÀM';return `<option value="${ex.id}">Exercise ${ex.id} – ${esc(ex.title)} [${label}]</option>`}).join('')}</select><button id="openPicked" class="primary">MỞ BÀI</button></div><div class="exercise-grid">${EXERCISES.map(cardHTML).join('')}</div></main></div>`;$('#changeUser').onclick=showStart;$('#openPicked').onclick=()=>{const id=+$('#exPicker').value;if(id)openExercise(id);else toast('Hãy chọn một Exercise.')};$$('.open-ex').forEach(b=>b.onclick=()=>openExercise(+b.dataset.id))}

function renderExam(mode){const ex=activeEx,st=stateFor(ex.id);const g=st.submitted?(st.result||grade(ex,st)):null;app.innerHTML=`<div class="exam"><div class="topbar"><button id="backBtn" class="backbtn">← DANH SÁCH</button><div class="top-ident"><div class="top-title">Exercise ${ex.id} – ${esc(ex.title)}</div><div class="top-sub">${esc(currentName)} • Matching Features • Không tính thời gian</div></div><div class="top-stat">${st.submitted?`Điểm ${g.correct}/${g.total}`:`Đã trả lời ${answeredCount(ex,st)}/${ex.questions.length}`}</div><div id="saveState" class="save-state">Đã lưu</div>${st.submitted?'<button id="copyBtn" class="secondary">SAO CHÉP KẾT QUẢ</button>':'<button id="saveBtn" class="secondary">LƯU BÀI</button><button id="submitBtn" class="submit-btn">NỘP BÀI</button>'}</div><div class="mobile-switch"><button id="mobRead">BÀI ĐỌC</button><button id="mobQ">CÂU HỎI</button></div><div id="workspace" class="workspace"><section id="readingPane" class="pane reading-pane">${passageHTML(ex)}</section><section id="questionPane" class="pane question-pane">${st.submitted?reviewHTML(ex,st,g):questionsHTML(ex,st)}</section></div><div class="qnav">${ex.questions.map(q=>{let cl='';if(st.submitted)cl=g.per[q.q].status;else{if(st.answers?.[q.q])cl+=' answered';if(st.flags?.[q.q])cl+=' flagged'}return `<button class="qchip ${cl}" data-q="${q.q}">${q.q}</button>`}).join('')}</div></div>`;$('#backBtn').onclick=()=>{captureScroll();saveProfile(true);showDashboard()};if(st.submitted){$('#copyBtn').onclick=copyResults}else{$('#saveBtn').onclick=()=>{captureScroll();saveProfile(true);toast('Đã lưu bài.')} ;$('#submitBtn').onclick=submitPrompt;$$('.answer-input,.answer-select').forEach(el=>{el.addEventListener('input',onAnswer);el.addEventListener('change',onAnswer)});$$('.flag-btn').forEach(b=>b.onclick=()=>toggleFlag(+b.dataset.q))}$$('.qchip').forEach(b=>b.onclick=()=>jumpQuestion(+b.dataset.q));$$('.filterbtn').forEach(b=>b.onclick=()=>applyFilter(b.dataset.filter));setupMobi function limitFromInstruction(instr){const x=instr.toUpperCase();if(x.includes('ONE WORD ONLY'))return 1;let m=x.match(/NO MORE THAN (ONE|TWO|THREE|FOUR) WORDS/);if(m)return({ONE:1,TWO:2,THREE:3,FOUR:4})[m[1]];return null}
function questionHTML(ex,q,st){const val=st.answers?.[q.q]||'';const lim=limitFromInstruction(ex.instruction);const control=q.inputType==='select'?`<select class="answer-select" data-q="${q.q}" aria-label="Câu ${q.q}"><option value="">— Chọn đáp án —</option>${ex.options.map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${o.id}. ${esc(o.text)}</option>`).join('')}</select>`:`<input class="answer-input" data-q="${q.q}" value="${esc(val)}" autocomplete="off" spellcheck="false" placeholder="Nhập đáp án">`;const wc=lim&&val?wordCount(val):0;return `<div id="q-${q.q}" class="question-card"><div class="qhead"><span class="qbadge">${q.q}</span><span class="qtype">${q.inputType==='select'?'MATCHING FEATURES':'MATCHING FEATURES'}</span><button type="button" class="flag-btn ${st.flags?.[q.q]?'on':''}" data-q="${q.q}" title="Đánh dấu xem lại">⚑</button></div><div class="qcontext">${esc(q.context)}</div><div class="answer-row"><label>Đáp án</label>${control}</div><div class="answered-line">${val?`Đã trả lời${lim&&q.inputType==='text'?`: ${wc}/${lim} từ`:''}`:'Chưa trả lời'}${lim&&q.inputType==='text'&&wc>lim?' <span class="word-alert">• VƯỢT GIỚI HẠN TỪ</span>':''}</div></div>`}

function doSubmit(){const ex=activeEx,st=stateFor(ex.id);captureScroll();st.submitted=true;st.submittedAt=Date.now();st.result=grade(ex,st);saveProfile(true);closeModal();filter='all';renderExam('review');toast(`Đã nộp: ${st.result.correct}/${st.result.total} câu đúng.`)}
function optionLabel(ex,letter){const o=ex.options.find(x=>x.id===letter);return o?`${letter}. ${o.text}`:letter}
function reviewHTML(ex,st,g){return `<div class="result-summary"><div class="result-score"><strong>${g.correct}/${g.total}</strong><span>câu đúng • ${Math.round(g.correct/g.total*100)}%</span></div><div style="font-size:11px;color:var(--muted);margin-top:3px">Sai: ${g.wrong} • Bỏ trống: ${g.blank} • Exercise đã khóa sau khi nộp.</div><div class="result-actions"><button id="copyInside" class="secondary">SAO CHÉP KẾT QUẢ</button></div></div>${ex.sourceNote?`<div class="warning"><b>LƯU Ý NGUỒN:</b> ${esc(ex.sourceNote)}</div>`:''}<div class="filterbar"><button class="filterbtn active" data-filter="all">TẤT CẢ</button><button class="filterbtn" data-filter="wrong">CÂU SAI</button><button class="filterbtn" data-filter="correct">CÂU ĐÚNG</button><button class="filterbtn" data-filter="blank">BỎ TRỐNG</button><button class="filterbtn" data-filter="flagged">ĐÁNH DẤU</button></div>${wordBankHTML(ex)}<div id="resultsList">${ex.questions.map(q=>resultCard(ex,q,st,g)).join('')}</div>`}
function resultCard(ex,q,st,g){const r=g.per[q.q],student=r.student||'';const studDisplay=q.inputType==='select'&&student?optionLabel(ex,student):student;const rightDisplay=q.inputType==='select'?optionLabel(ex,q.correct):q.correct;const isOpen=r.status!=='correct';return `<details id="r-${q.q}" class="result-card ${r.status}" data-status="${r.status}" data-flagged="${st.flags?.[q.q]?'1':'0'}" ${isOpen?'open':''}><summary><span class="qbadge">${q.q}</span><b style="flex:1">Câu ${q.q}</b><span class="status-pill">${r.status==='correct'?'ĐÚNG':r.status==='wrong'?'SAI':'BỎ TRỐNG'}</span></summary><div class="result-body"><div class="result-context">${esc(q.context)}</div><div class="ans-grid"><div class="ans-box"><b>Câu trả lời của học sinh</b>${student?`<strong>${esc(studDisplay)}</strong>`:'<em>Không trả lời</em>'}</div><div class="ans-box"><b>Đáp án đúng</b><strong>${esc(rightDisplay)}</strong></div></div><div class="evidence"><b>Evidence • Vị trí: ${esc(q.sourcePage||'—')}</b><br>“${esc(q.evidence)}”</div><div class="explain"><h4>GIẢI THÍCH CHI TIẾT</h4><div>${esc(q.explanation)}</div><h4>PARAPHRASE</h4><div>${esc(q.paraphrase||'Đối chiếu ý của summary với cụm evidence trong passage.')}</div></div>${q.warning?`<div class="warning"><b>CẦN KIỂM TRA NGUỒN:</b> ${esc(q.warning)}</div>`:''}</div></details>`}
function jumpQuestion(q){const st=stateFor(activeEx.id);if(window.innerWidth<=920){activeView='questions';setMobileView('questions')}const el=st.submitted?document.getElementById('r-'+q):document.getElementById('q-'+q);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});$$('.qchip').forEach(c=>c.classList.toggle('active',+c.dataset.q===q))}
function applyFilter(f){filter=f;$$('.filterbtn').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));$$('.result-card').forEach(c=>{const show=f==='all'||c.dataset.status===f||(f==='flagged'&&c.dataset.flagged==='1');c.style.display=show?'':'none'})}
function copyResults(){const ex=activeEx,st=stateFor(ex.id),g=st.result||grade(ex,st);const lines=[`IELTS READING – MATCHING FEATURES`,`Học sinh: ${currentName}`,`Exercise ${ex.id}: ${ex.title}`,`Kết quả: ${g.correct}/${g.total} đúng`,``,];for(const q of ex.questions){const r=g.per[q.q];const student=r.student||'';lines.push(`Câu ${q.q}`,`Học sinh: ${student?(q.inputType==='select'?optionLabel(ex,student):student):'Bỏ trống'}`,`Đáp án: ${q.inputType==='select'?optionLabel(ex,q.correct):q.correct}`,`Kết quả: ${r.status==='correct'?'ĐÚNG':r.status==='wrong'?'SAI':'BỎ TRỐNG'}`,`Evidence: ${q.evidence}`,`Giải thích: ${q.explanation}`,`Paraphrase: ${q.paraphrase}`,``)}const text=lines.join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Đã sao chép kết quả.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép kết quả.')}catch(e){toast('Không thể tự động sao chép.')}ta.remove()}
function showModal(inner){const root=$('#modalRoot');root.innerHTML=`<div class="modal-wrap" role="dialog" aria-modal="true"><div class="modal">${inner}</div></div>`;document.addEventListener('keydown',escModal)}function closeModal(){const root=$('#modalRoot');root.innerHTML='';document.removeEventListener('keydown',escModal)}function escModal(e){if(e.key==='Escape')closeModal()}
function setupMobile(){const r=$('#mobRead'),q=$('#mobQ');if(!r||!q)return;r.onclick=()=>setMobileView('reading');q.onclick=()=>setMobileView('questions');setMobileView(activeView)}function setMobileView(v){activeView=v;const w=$('#workspace');if(!w)return;w.classList.toggle('show-questions',v==='questions');$('#mobRead')?.classList.toggle('active',v==='reading');$('#mobQ')?.classList.toggle('active',v==='questions')}
function captureScroll(){if(!activeEx)return;const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');if(rp)st.passageScroll=rp.scrollTop;if(qp)st.questionScroll=qp.scrollTop}
function restoreScroll(){const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');if(rp)rp.scrollTop=st.passageScroll||0;if(qp)qp.scrollTop=st.questionScroll||0}
function setupScrollSave(){const rp=$('#readingPane'),qp=$('#questionPane');const fn=debounce(()=>{captureScroll();saveProfile()},250);rp?.addEventListener('scroll',fn);qp?.addEventListener('scroll',fn)}function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
document.addEventListener('click',e=>{if(e.target?.id==='copyInside')copyResults()});showStart();
</script>

<script id="ielts-dual-pane-layout-runtime">
(function(){
  function visible(el){
    if(!el) return false;
    if(el.classList && el.classList.contains('hidden')) return false;
    const s = window.getComputedStyle(el);
    if(s.display === 'none' || s.visibility === 'hidden') return false;
    return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  }

  function syncExamLock(){
    const candidates = Array.from(document.querySelectorAll('.exam,.practice,#exam-screen'));
    const active = candidates.some(visible);
    document.documentElement.classList.toggle('ielts-exam-active', active);
    if(document.body) document.body.classList.toggle('ielts-exam-active', active);
  }

  function start(){
    syncExamLock();
    const obs = new MutationObserver(syncExamLock);
    obs.observe(document.documentElement,{
      subtree:true,
      childList:true,
      attributes:true,
      attributeFilter:['class','style','hidden']
    });
    window.addEventListener('resize', syncExamLock, {passive:true});
    window.addEventListener('orientationchange', syncExamLock, {passive:true});
    document.addEventListener('click', function(){ setTimeout(syncExamLock,0); }, {passive:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }else{
    start();
  }
})();
</script>
<!-- IELTS_DUAL_PANE_PATCH_SCRIPT_END -->
