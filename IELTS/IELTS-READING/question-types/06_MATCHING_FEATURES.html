<style id="ielts-dual-pane-layout-patch">
/* =========================================================
   IELTS READING – DUAL PANE / INDEPENDENT SCROLL PATCH
   Desktop: 60/40
   Mobile portrait (<768px): top/bottom, BOTH visible
   Mobile landscape + tablet: 60/40
   Body locked only while an exam/practice screen is active
   ========================================================= */

html.ielts-exam-active,
body.ielts-exam-active{
  height:100% !important;
  max-height:100% !important;
  overflow:hidden !important;
  overscroll-behavior:none !important;
}

body.ielts-exam-active{
  position:relative !important;
}

/* Prevent the exam/practice shell itself from becoming the scrolling surface. */
body.ielts-exam-active .exam,
body.ielts-exam-active .practice,
body.ielts-exam-active #exam-screen{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Common split containers */
body.ielts-exam-active .workspace,
body.ielts-exam-active .work{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Every reading/question pane scrolls on its own. */
body.ielts-exam-active .workspace > .pane,
body.ielts-exam-active .workspace > .reading-pane,
body.ielts-exam-active .workspace > .question-pane,
body.ielts-exam-active .workspace > .passage-pane,
body.ielts-exam-active .workspace > .passage,
body.ielts-exam-active .workspace > .questions,
body.ielts-exam-active .work > .pane,
body.ielts-exam-active .work > .reading-pane,
body.ielts-exam-active .work > .question-pane,
body.ielts-exam-active .work > .passage-pane,
body.ielts-exam-active .work > .passage,
body.ielts-exam-active .work > .questions,
body.ielts-exam-active #passage-pane,
body.ielts-exam-active #question-pane{
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain !important;
  -webkit-overflow-scrolling:touch !important;
}

/* The old "show only one pane" mobile controls are no longer needed. */
body.ielts-exam-active .mobile-switch,
body.ielts-exam-active .mobile-toggle,
body.ielts-exam-active #show-reading,
body.ielts-exam-active #show-questions{
  display:none !important;
}

/* Never allow old mobile-state classes to hide one side. */
body.ielts-exam-active .workspace.show-questions > .reading-pane,
body.ielts-exam-active .workspace.show-questions > .passage-pane,
body.ielts-exam-active .workspace.show-questions > .passage,
body.ielts-exam-active .workspace:not(.show-questions) > .question-pane,
body.ielts-exam-active .practice.show-passage .question-pane,
body.ielts-exam-active .practice:not(.show-passage) .passage-pane,
body.ielts-exam-active #passage-pane.mobile-hidden,
body.ielts-exam-active #question-pane.mobile-hidden{
  display:block !important;
}

/* Keep fixed-height practice shells inside the viewport. */
body.ielts-exam-active .practice{
  height:100vh !important;
  height:100dvh !important;
  max-height:100vh !important;
  max-height:100dvh !important;
}

/* Matching Information-style shell: 44px global brand + exam below it. */
body.ielts-exam-active .top-brand + .exam,
body.ielts-exam-active .top-brand ~ .exam{
  height:calc(100vh - 44px) !important;
  height:calc(100dvh - 44px) !important;
  min-height:0 !important;
}

/* ---------- DESKTOP + TABLET + MOBILE LANDSCAPE ---------- */
@media (min-width:768px), (orientation:landscape){
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,3fr) minmax(0,2fr) !important; /* 60 / 40 */
    grid-template-rows:minmax(0,1fr) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based exam templates */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* YES/NO/NOT GIVEN-style fixed header = 46 + 42 = 88px */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
  }

  /* Restore divider between 60% passage and 40% questions */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:1px solid var(--line, #d7dde4) !important;
    border-bottom:0 !important;
  }
}

/* ---------- MOBILE PORTRAIT ONLY ---------- */
@media (max-width:767px) and (orientation:portrait){
  /* Matching Information had height:auto + sticky header on mobile:
     force the shell back into the viewport. */
  body.ielts-exam-active .exam{
    min-height:0 !important;
    overflow:hidden !important;
  }

  body.ielts-exam-active .exam-head{
    position:relative !important;
    top:auto !important;
    flex:0 0 auto !important;
  }

  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    grid-template-rows:minmax(0,48%) minmax(0,52%) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based templates: workspace occupies exactly the remaining height. */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* Fixed 88px header templates */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }

  /* Clear old "one pane at a time" rules with high specificity. */
  body.ielts-exam-active .workspace.show-questions .reading-pane,
  body.ielts-exam-active .workspace.show-questions .passage-pane,
  body.ielts-exam-active .workspace.show-questions .passage,
  body.ielts-exam-active .workspace.show-questions .question-pane,
  body.ielts-exam-active .practice.show-passage .passage-pane,
  body.ielts-exam-active .practice.show-passage .question-pane,
  body.ielts-exam-active .practice .passage-pane,
  body.ielts-exam-active .practice .question-pane{
    display:block !important;
  }

  /* Horizontal divider between Passage (top) and Questions (bottom). */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:0 !important;
    border-bottom:2px solid var(--line, #d7dde4) !important;
  }

  /* Compact padding so both regions remain practical on small screens. */
  body.ielts-exam-active .reading-pane,
  body.ielts-exam-active .passage-pane,
  body.ielts-exam-active .work > .passage{
    padding-top:10px !important;
    padding-bottom:18px !important;
  }

  body.ielts-exam-active .question-pane,
  body.ielts-exam-active .work > .questions{
    padding-top:9px !important;
    padding-bottom:24px !important;
  }
}

/* Print should remain normal and fully expandable. */
@media print{
  html.ielts-exam-active,
  body.ielts-exam-active{
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
  }
}

<script>
const EXERCISES=[{"id":1,"title":"Mrs. Carlill and the Carbolic Smoke Ball","instruction":"Match each person with the correct statement, A–F. Choose the correct letter for each question.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 1","passage":"On 14 January 1892, Queen Victoria’s grandson Prince Albert Victor, second in line to the British throne, died from flu. He had succumbed to the third and most lethal wave of the Russian flu pandemic sweeping the world. The nation was shocked. The people mourned. Albert was relegated to a footnote in history. Three days later, London housewife Louisa Carlill went down with flu. She was shocked. For two months, she had inhaled thrice daily from a carbolic smoke ball, a preventive measure guaranteed to fend off flu – if you believed the advert. Which she did.\n\nAnd why shouldn’t she when the Carbolic Smoke Ball Company had promised to cough up £100 for any customer who fell ill? Unlike Albert, Louisa recovered, claimed her £100 and set in train events that would win her lasting fame. It started in the spring of 1889. The first reports of a flu epidemic came from Russia. By the end of the year, the world was in the grip of the first truly global flu pandemic. The disease came in waves, once a year for the next four years, and each worse than the last. Whole cities came to a standstill.\n\nLondon was especially hard-hit. As the flu reached each annual peak, normal life stopped. The postal service ground to a halt, trains stopped running, banks closed. Even courts stopped sitting for lack of judges. At the height of the third wave in 1892, 200 people were buried every day at just one London cemetery. This flu was far more lethal than previous epidemics, and those who recovered were left weak, depressed, and often unfit for work. It was a picture repeated across the continent.\n\nAccurate figures for the number of the sick and dead were few and far between but Paris, Berlin and Vienna all reported a huge upsurge in deaths. The newspapers took an intense interest in the disease, not just because of the scale of it but because of who it attacked. Most epidemics carried off the poor and weak, the old and frail. This flu was cutting as great a swathe through the upper classes, dealing death to the rich and famous, and the young and fit. The newspaper-reading public was fed a daily diet of celebrity victims. The flu had worked its way through the Russian imperial family and invaded the royal palaces of Europe. It carried off the Dowager Empress of Germany and the second son of the king of Italy, as well as England’s future king. Aristocrats and politicians, poets and opera singers, bishops and cardinals – none escaped the attentions of the Russian flu. The public grew increasingly fearful. The press might have been overdoing the doom and gloom, but their hysterical coverage had exposed one terrible fact.\n\nThe medical profession had no answer to the disease. This flu, which might not even have begun in Russia, was a mystery. What caused it and how did it spread? No one could agree on anything. By now, the theory that micro-organisms caused disease was gaining ground, but no one had identified an organism responsible for flu (and wouldn’t until 1933).\n\nIn the absence of a germ, many clung to the old idea of bad airs, or miasmas, possibly stirred by some great physical force – earthquakes, perhaps, or electrical phenomena in the upper atmosphere, even a passing comet. Doctors advised people to eat well avoiding “unnecessary assemblies”, and if they were really worried, to stuff cotton wool up their nostrils. If they fell ill, they should rest, keep warm and eat a nourishing diet of “milk, eggs and farinaceous puddings”.\n\nAlcohol figured prominently among the prescriptions: one eminent English doctor suggested champagne, although he conceded “brandy in considerable quantities has sometimes been given with manifest advantages”. French doctors prescribed warm alcoholic drinks, arguing that they never saw an alcoholic with flu. Their prescription had immediate results: over a three-day period, 1,200 of the 1,500 drunks picked up on the streets of Paris claimed they were following doctor’s orders.\n\nSome doctors gave drugs to ease symptoms – quinine for fever, salicin for headache, heroin for an “incessant cough”. But nothing in the pharmacy remotely resembled a cure. Not surprisingly, people looked elsewhere for help. Hoping to cash in while the pandemic lasted, purveyors of patent medicines competed for the public’s custom with ever more outrageous advertisements. One of the most successful was the Carbolic Smoke Ball Company. The carbolic smoke ball was a hollow rubber ball, 5 centimetres across, with a nozzle covered by gauze. Inside was a powder treated with carbolic acid, or phenol.\n\nThe idea was to clutch it close to the nose and squeeze gently, inhaling deeply from the emerging cloud of pungent powder. This, the company claimed, would disinfect the mucous membranes, curing any condition related to “taking cold”. In the summer of 1890, sales were steady at 300 smoke balls a month. In January 1891, the figure skyrocketed to 1,500. Eager to exploit the public’s mounting panic, the Carbolic Smoke Ball Company made increasingly extravagant claims. Oh 13 November 1892, its latest advert in the Pall Mall Gazette caught the eye of south London housewife Louisa Carlill. “Carbolic Smoke Ball,” it declared, “will positively cure colds, coughs, asthma, bronchitis, hoarseness, influenza, croup, whooping cough …”. And the list went on. But it was the next part Mrs. Carlill found compelling.\n\n“A £100 reward will be paid by the Carbolic Smoke Ball Company to any person who contracts the increasing epidemic influenza, colds or any disease caused by taking cold, after having used the carbolic smoke ball according to the printed directions supplied with each ball. £1,000 is deposited with the Alliance bank, Regent Street, showing our sincerity in the matter.” Mrs. Carlill hurried off to buy a smoke ball, price 10 shillings. After carefully reading the instructions, she diligently dosed herself thrice daily until 17 January – when she fell ill.\n\nOn 20 January, Louisa’s husband wrote to the Carbolic Smoke Ball Company. Unfortunately for them, Mr. Carlill happened to be a solicitor. His wife, he wrote, had seen their advert and bought a smoke ball on the strength of it. She had followed the instructions to the letter, and yet now – as their doctor could confirm – she had flu. There was no reply. But £100 was not a sum to be sneezed at. Mr. Carlill persisted. The company resisted. Louisa recovered and sued. In June, Mr. Justice Hawkins found in Mrs. Carlill’s favour. The company’s main defence was that adverts were mere “puffery” and only an idiot would believe such extravagant claims.\n\nJudge Hawkins pointed out that adverts were not aimed at the wise and thoughtful, but at the credulous and weak. A vendor who made a promise “must not be surprised if occasionally he is held to his promise”. Carbolic appealed. In December, three lord justices considered the case.\n\nCarbolic’s lawyers tried several lines of defence. But in the end, the case came down to a single matter: not whether the remedy was useless, or whether Carbolic had committed fraud, but whether its advert constituted a contract – which the company had broken. A contract required agreement between two parties, argued Carbolic’s lawyers. What agreement had Mrs. Carlill made with them? There were times, the judges decided, when a contract could be one-sided. The advert had made a very specific offer to purchasers: protection from flu or £100. By using the smoke ball as instructed, Mrs. Carlill had accepted that offer. The company might just have wriggled out of it if it hadn’t added the bit about the £1,000 deposit. That, said the judges, gave buyers reason to believe Carbolic meant what it said.\n\n“It seems to me that if a person chooses to make extravagant promises of this kind, he probably does so because it pays him to make them, and, if he has made them, the extravagance of the promises is no reason in law why he should not be bound by them,” pronounced Lord Justice Bowen. Louisa got her £100. The case established the principle of the unilateral contract and is frequently cited today.","options":[{"id":"A","text":"Filed a complaint which was never responded to"},{"id":"B","text":"Broke the contract made with Carbolic Smoke Ball Company"},{"id":"C","text":"Initiated a legal case"},{"id":"D","text":"Described the audience of advertisement"},{"id":"E","text":"Claimed that most advertisements are fraudulent"},{"id":"F","text":"Treated advertisement as a type of contract"}],"questions":[{"q":22,"context":"22. Mrs. Carlill","answerDisplay":"C. Initiated a legal case","sourcePage":"PDF p.5: “Louisa recovered and sued.”","evidence":"Louisa recovered and sued.","explanation":"Mrs. Carlill là người trực tiếp khởi kiện công ty sau khi yêu cầu trả £100 không được giải quyết. Động từ “sued” là bằng chứng quyết định: sue = initiate/start a legal case. Vì vậy C là đáp án chính xác.\nBẫy / phân biệt: A thuộc chồng của Mrs. Carlill vì ông là người viết thư khiếu nại; B mô tả phía công ty vi phạm hợp đồng; D thuộc Judge Hawkins; F gắn với lập luận pháp lý của tòa phúc thẩm/Lord Justice Bowen.\nParaphrase:\n• initiated a legal case = sued\n• legal case = action in court","paraphrase":"• initiated a legal case = sued\n• legal case = action in court","warning":"","correct":"C","correctText":"Initiated a legal case","inputType":"select"},{"q":23,"context":"23. Mrs. Carlill’s husband","answerDisplay":"A. Filed a complaint which was never responded to","sourcePage":"Nguồn đã xác minh","evidence":"On 20 January, Louisa’s husband wrote to the Carbolic Smoke Ball Company. … There was no reply.","explanation":"Chủ thể cần nối là chồng của Louisa. Passage nói ông viết thư cho công ty để yêu cầu thực hiện lời hứa, nhưng “There was no reply”. Đây chính xác là một complaint/claim không nhận được phản hồi.\nBẫy / phân biệt: C “Initiated a legal case” thuộc chính Louisa, vì passage viết “Louisa … sued”. Không chọn theo việc hai vợ chồng cùng tham gia vụ việc; phải bám đúng hành động của từng người.\nParaphrase:\n• filed a complaint = wrote to the company / made a claim\n• never responded to = there was no reply","paraphrase":"• filed a complaint = wrote to the company / made a claim\n• never responded to = there was no reply","warning":"","correct":"A","correctText":"Filed a complaint which was never responded to","inputType":"select"},{"q":24,"context":"24. Judge Hawkins","answerDisplay":"D. Described the audience of advertisement","sourcePage":"Nguồn đã xác minh","evidence":"Judge Hawkins pointed out that adverts were not aimed at the wise and thoughtful, but at the credulous and weak.","explanation":"Judge Hawkins trực tiếp mô tả nhóm đối tượng mà quảng cáo hướng đến: không phải “the wise and thoughtful” mà là “the credulous and weak”. Vì vậy D khớp hoàn toàn.\nBẫy / phân biệt: F liên quan đến việc xác lập quảng cáo như một lời đề nghị có tính ràng buộc pháp lý ở cấp phúc thẩm; câu 24 chỉ hỏi người mô tả đối tượng của quảng cáo.\nParaphrase:\n• audience of advertisement = people adverts were aimed at\n• described = pointed out that …","paraphrase":"• audience of advertisement = people adverts were aimed at\n• described = pointed out that …","warning":"","correct":"D","correctText":"Described the audience of advertisement","inputType":"select"},{"q":25,"context":"25. Lord Justice Bowen","answerDisplay":"F. Treated advertisement as a type of contract","sourcePage":"Nguồn đã xác minh","evidence":"The advert had made a very specific offer to purchasers: protection from flu or £100. By using the smoke ball as instructed, Mrs. Carlill had accepted that offer. …the extravagance of the promises is no reason in law why he should not be bound by them.","explanation":"Ở phần xét xử phúc thẩm, quảng cáo được phân tích như một offer có thể được chấp nhận bằng hành vi sử dụng smoke ball đúng hướng dẫn, tạo thành unilateral contract. Lời của Lord Justice Bowen nhấn mạnh người đưa ra lời hứa vẫn có thể bị ràng buộc về mặt pháp luật. Vì vậy F là đáp án phù hợp.\nBẫy / phân biệt: Không chọn E. Công ty mới lập luận rằng quảng cáo chỉ là “puffery”; Bowen không nói phần lớn quảng cáo đều gian lận.\nParaphrase:\n• advertisement as a contract = advert made a specific offer / accepted that offer\n• legally bound = should be bound by them","paraphrase":"• advertisement as a contract = advert made a specific offer / accepted that offer\n• legally bound = should be bound by them","warning":"","correct":"F","correctText":"Treated advertisement as a type of contract","inputType":"select"}],"sourceNote":""},{"id":2,"title":"The Goal of Translation: Types of Translation","instruction":"Match each feature of translating with the correct type of translation, A–F.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 2","passage":"A. The term 'translation' is used for all cases where the meaning of expressions in one language (the 'source' language) is turned into the meaning in another (the target language), whether the medium is spoken, written, or signed. In specific professional contexts, however, a distinction is drawn between work with the spoken or signed language (interpreting), and work with the written language (translating), although certain tasks blur this distinction.\n\nB. It is sometimes said that there is no task more complex than translation a claim that can be readily believed when all the variables involved are taken into account. Translators not only need to know their source language well; they must also have a thorough understanding in the field of knowledge covered by the source text, and of any social, cultural, or emotional connotations that need to be specified in the target language if the intended effect is to be conveyed. The same special awareness needs to be present for the target language, so that points of special phrasing, contemporary fashions in expression, local expectations, and so on, can all be taken into account. On the whole, translators work into their mother tongue (or language of habitual use), to ensure a result that sounds as natural as possible though some translators have argued that, for certain types of text (e.g., scientific material) where translation accuracy is more crucial than naturalness, it makes more sense for the translators to be more fluent in the source language.\n\nC. The aim of translation is to provide semantic equivalence between source and target language. This is what makes translation different from other linguistic activities, such as adapting, precise writing, and abstracting. However, there are many problems hidden within this apparently simple statement, all to do with what standards of 'equivalence' should be expected and accepted.\n\nD. Exact equivalence is of course impossible: no translator could provide a translation that was a perfect parallel to the source text, in such respects as rhythm, puns and cultural allusions. Such a parallel is not even possible when paraphrasing within a single language: there is always some loss of information.\n\nE. On the other hand, there are many kinds of inexact equivalence, any of which can be successful at a certain level of practical functioning. It therefore follows that there is no such thing as a best translation. The success of translation depends on the purpose for which it was made, which in turn reflects the needs of the people for whom it was made. A rough and-ready translation of a letter can suffice to inform a firm of the nature of an enquiry. A translation of a scientific article requires careful attention to meaning but little attention to stylistic features. The provision of a dubbed film script will warrant scrupulous care over the synchronisation of lip movements, often at the expense of content. Literary work requires a sensitive consideration of form as well as content, and may prompt several translations, each of which emphasises a different aspect of the original. It is easy to see what might be 'best' for one set of circumstances may be entirely unsuitable for another.\n\nF. Several different kinds of translation have been proposed to allow for this range of possibilities. A pragmatic translation emphasises accuracy and knowledge of the subject, required for instruction manuals and much scientific research. In an aesthetic translation, important for literary material, the focus is on preserving the emotional as well as the cognitive content of the work, and on maintaining some level of stylistic equivalence. Ethnographic or sociolinguistic translations aim to pay full attention to the cultural backgrounds of the authors and the recipients, and take into account differences between source and target language, and the ways of life in which they are embedded. And there are various kinds of linguistic translation, where the aim is to convey the structural flavour of the original text, often in quite a literal manner, emphasising such features as archaisms, dialecticisms, and levels of formality. Most translations, of course, are mixtures of these theoretical types, reflecting the complex reality of language in use.\n\nG. At another level, in a word-for-word translation each word in the source language is translated by a word in the target language. The result often makes no sense, especially when idiomatic constructions are used. In a literal translation the linguistic structure of the source text is followed, but is normalised according to the rules of the target language. In a free translation the linguistic structure of the source language is ignored, and an equivalent is found based on the meaning it conveys.\n\nH. Translators aim to produce a text that is as faithful to the original as circumstances require or permit, and yet that reads as if it were written originally in the target language. They aim to be \"invisible people\" - transferring content without drawing attention to the considerable artistic and technical skills involved in the process. The complexity of the task is apparent, but its importance is often underestimated, and its practitioners' social status and legal rights undervalued. Some countries view translation as a menial, clerical task, and pay their translators accordingly, while others regard it as a major intellectual discipline in its own right. The question of status is currently much debated, particularly in Europe, where demand for translators is rocketing, especially in relation to the European Union.","options":[{"id":"A","text":"aesthetic"},{"id":"B","text":"ethnographic"},{"id":"C","text":"free"},{"id":"D","text":"literal"},{"id":"E","text":"pragmatic"},{"id":"F","text":"word-for-word"}],"questions":[{"q":20,"context":"20. focuses on reproducing the content accurately.","answerDisplay":"E. pragmatic","sourcePage":"Đoạn F","evidence":"Several different kinds of translation have been proposed to allow for this range of possibilities. A pragmatic translation emphasises accuracy and knowledge of the subject, required for instruction manuals and much scientific research. In an aesthetic translation, important for literary material, the focus is on preserving the emotional as well as the cognitive content of the work, and on maintaining some level of stylistic equivalence. Ethnographic or sociolinguistic translations aim to pay full attention to the cultural backgrounds of the authors and the recipients, and take into account differences between source and target language, and the ways of life in which they are embedded. And there are various kinds of linguistic translation, where the aim is to convey the structural flavour of the original text, often in quite a literal manner, emphasising such features as archaisms, dialecticisms, and levels of formality. Most translations, of course, are mixtures of these theoretical types, reflecting the complex reality of language in use.","explanation":"Đáp án E — pragmatic khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: focuses on reproducing the content accurately.\n• Passage: Several different kinds of translation have been proposed to allow for this range of possibilities. A pragmatic translation emphasises accuracy and knowledge of the subject, requir\n• Key answer: E\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: focuses on reproducing the content accurately.\n• Passage: Several different kinds of translation have been proposed to allow for this range of possibilities. A pragmatic translation emphasises accuracy and knowledge of the subject, requir\n• Key answer: E\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"E","correctText":"pragmatic","inputType":"select"},{"q":21,"context":"21. looks at important cultural aspects of language use.","answerDisplay":"B. ethnographic","sourcePage":"Đoạn F","evidence":"Several different kinds of translation have been proposed to allow for this range of possibilities. A pragmatic translation emphasises accuracy and knowledge of the subject, required for instruction manuals and much scientific research. In an aesthetic translation, important for literary material, the focus is on preserving the emotional as well as the cognitive content of the work, and on maintaining some level of stylistic equivalence. Ethnographic or sociolinguis ct":"C","correctText":"free","inputType":"select"}],"sourceNote":""},{"id":3,"title":"Healthy Buildings / Workplace Research","instruction":"Match each statement with the correct researcher, A–D. A letter may be used more than once where permitted by the source.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 3","passage":"Have you felt tired at your desk lately? According to new research, some often overlooked environmental factors within buildings – the degree or type of ventilation, airborne contaminants, lighting and noise levels, for example – can play a surprisingly large role in how good or bad you feel, and even how well you think. It is estimated that we spend more than 90 percent of our time inside, but builders in general have paid little attention to the health aspects of indoor spaces, instead focusing on superficial design features and on meeting minimum environmental standards to keep costs down.\n\nResearchers at Harvard University in the US looked at the effects of indoor air quality on workers' cognitive performance – important both for health and for companies' bottom lines, says Joseph Allen, assistant professor of environmental health and principal investigator of the studies. ‘The true cost of running our buildings should take into account the health and productivity of people in those buildings,’ Allen says. In fact, an analysis by the team showed that the cost of making alterations that could boost cognitive performance significantly was minuscule compared with the related increase in productivity – about $40 per person, per year, compared with a $6,500 increase in employee productivity.\n\nThe team's first study, published in Environmental Health Perspectives, was conducted at the Syracuse Center of Excellence, a US research organization devoted to studying and developing sustainability. The center houses a laboratory that allows researchers to test a wide range of indoor air quality factors using sophisticated ventilation. Each day, the indoor environment was controlled with a ventilation system which included small amounts of carbon dioxide and volatile organic compounds, or VOCs – the toxic by-products of office supplies commonly found in the workplace. The office workers were blinded to the conditions. For six days over two weeks, 24 office workers with administrative, technical, professional or managerial jobs came to the lab and performed their regular work under minimal supervision, as well as participating in an hour and a half of cognitive testing at the end of the day. The cognitive tasks used in the study had participants respond to online scenarios that mimic real-life situations, such as running a city as a mayor. The findings are remarkable for showing in a well-controlled study, that indoor air quality can significantly lower cognitive performance in buildings that would otherwise meet current building standards, notes environmental psychologist Craig Zimring, director of Georgia Tech University's SimTigrate Design Lab in the US. ‘If these findings are replicated in other labs and in real-world work environments,’ he says, ‘they could lead to designs that provide much more outside air through mechanical ventilation or operable windows, for example’ – in turn, promoting better health and performance.\n\nIn a second study, reported in Building and Environment, the Harvard-Syracuse team moved from the lab to the real world. Using the same methodology, they compared test scores of 109 people working in 10 buildings – about 12 people per site – in two buildings in each of five cities. When the team examined the buildings for differences, they found that certified buildings had lower humidity levels and brighter light than the non-certified buildings. That said, the differences in humidity and lighting didn't entirely explain the differing cognitive function scores of people on the job. This has led researchers to believe that other factors, such as how someone feels about their working environment, may also play a part, notes Harvard research fellow Piers MacNaughton, who led the study.\n\nA. recently constructed building on the Washington University campus in St. Louis, US, is providing another opportunity to examine how green building design can affect health and behavior. Hillman Hall was designed with the highest environmental and energy standards available, as well as design elements intended to foster more collaboration and physical activity, says Amy Eyler, associate professor and assistant dean for public health at the Brown School at Washington University. The design includes easy access to stairways, plenty of natural light, generous spaces for collaboration, desks that allow people to sit or stand up, and inviting places to walk. Unlike traditional hallways designed as long corridors with private offices to either side, for example, these hallways include classrooms, offices and spaces to sit, so they are multi-use – ‘you have many reasons to walk them,’ says Eyler. To test how the building might affect people's behavior, Eyler conducted a pre-test before people moved in, and a post-test one year later. Her team collected data on the three main features the designers were attempting to foster: physical activity, collaboration and sustainable practices. Results showed that people were more likely to take part in spontaneous collaborations in the new space than in the older ones, and to be physically active.\n\nLike other researchers in this growing field, Eyler sees multidisciplinary collaboration as the key to success. Administrators, public health faculty and architects worked together to create a building that captured the university's vision for a space that fosters collegial work and health for faculty, staff and students – a shared goal evidenced by the fact that the architecture firm that designed the building also funded part of the research. ‘Complex projects like this one need teams of people with varied backgrounds and expertise in order to solve them,’ Eyler says.","options":[{"id":"A","text":"Joseph Allen"},{"id":"B","text":"Craig Zimring"},{"id":"C","text":"Piers MacNaughton"},{"id":"D","text":"Amy Eyler"}],"questions":[{"q":20,"context":"20. Further investigations will result in improved wellbeing and efficiency.","answerDisplay":"B. Craig Zimring","sourcePage":"Đoạn 3 (ô 16)","evidence":"The team's first study, published in Environmental Health Perspectives, was conducted at the Syracuse Center of Excellence, a US research organization devoted to studying and developing sustainability. The center houses a laboratory that allows researchers to test a wide range of indoor air quality factors using sophisticated ventilation. Each day, the indoor environment was controlled with a ventilation system which included small amounts of carbon dioxide and volatile organic compounds, or VOCs – the toxic by-products of office supplies commonly found in the workplace. The office workers were blinded to the conditions. For six days over two weeks, 24 office workers with administrative, technical, professional or managerial jobs came to the lab and performed their regular work under minimal supervision, as well as participating in an hour and a half of cognitive testing at the end of the day. The cognitive tasks used in the study had participants respond to online scenarios that mimic real-life situations, such as running a city as a mayor. The findings are remarkable for showing in a well-controlled study, that indoor air quality can significantly lower cognitive performance in buildings that would otherwise meet current building standards, notes environmental psychologist Craig Zimring, director of Georgia Tech University's SimTigrate Design Lab in the US. ‘If these findings are replicated in other labs and in real-world work environments,’ he says, ‘they could lead to designs that provide much more outside air through mechanical ventilation or operable windows, for example’ – in turn, promoting better health and performance.","explanation":"Đáp án B — Craig Zimring khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Further investigations will result in improved wellbeing and efficiency.\n• Passage: The team's first study, published in Environmental Health Perspectives, was conducted at the Syracuse Center of Excellence, a US research organization devoted to studying and devel\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Further investigations will result in improved wellbeing and efficiency.\n• Passage: The team's first study, published in Environmental Health Perspectives, was conducted at the Syracuse Center of Excellence, a US research organization devoted to studying and devel\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"B","correctText":"Craig Zimring","inputType":"select"},{"q":21,"context":"21. A person's opinion of their workspace may influence how well they perform at work.","answerDisplay":"C. Piers MacNaughton","sourcePage":"Đoạn 4 (ô 17)","evidence":"In a second study, reported in Building and Environment, the Harvard-Syracuse team moved from the lab to the real world. Using the same methodology, they compared test scores of 109 people working in 10 buildings – about 12 people per site – in two buildings in each of five cities. When the team examined the buildings for differences, they found that certified buildings had lower humidity lev ng nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: The design of a workplace can have an impact on how much staff work with their colleagues.\n• Passage: A recently constructed building on the Washington University campus in St. Louis, US, is providing another opportunity to examine how green building design can affect health and be\n• Key answer: D\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"D","correctText":"Amy Eyler","inputType":"select"},{"q":23,"context":"23. A worker's mental capacity may be considerably reduced due to their working environment.","answerDisplay":"A. Joseph Allen","sourcePage":"Đoạn 2 (ô 15)","evidence":"Researchers at Harvard University in the US looked at the effects of indoor air quality on workers' cognitive performance – important both for health and for companies' bottom lines, says Joseph Allen, assistant professor of environmental health and principal investigator of the studies. ‘The true cost of running our buildings should take into account the health and productivity of people in those buildings,’ Allen says. In fact, an analysis by the team showed that the cost of making alterations that could boost cognitive performance significantly was minuscule compared with the related increase in productivity – about $40 per person, per year, compared with a $6,500 increase in employee productivity.","explanation":"Đáp án A — Joseph Allen khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: A worker's mental capacity may be considerably reduced due to their working environment.\n• Passage: Researchers at Harvard University in the US looked at the effects of indoor air quality on workers' cognitive performance – important both for health and for companies' bottom line\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: A worker's mental capacity may be considerably reduced due to their working environment.\n• Passage: Researchers at Harvard University in the US looked at the effects of indoor air quality on workers' cognitive performance – important both for health and for companies' bottom line\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"A","correctText":"Joseph Allen","inputType":"select"}],"sourceNote":""},{"id":4,"title":"Children’s Play: Dates and Events","instruction":"Match each date with the correct event, A–J.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 4","passage":"A. ‘Play up! Play up! And play the game!’ The ringing chorus of Sir Henry Newbolt’s celebrated cricket poem Vitaï Lampada (1908) sums up views about play in 19th- and early 20th-century Britain. Children’s play was important, and adults should regulate and direct it. Games promoted endurance, self-discipline and team spirit – qualities needed for the health of society and government. Newbolt was one in a long line of people who thought in this way. The notion that children’s play should be used for educational and social purposes goes back at least to the ancient Greeks and the toys and games of medieval England tell us much about how adults then saw childhood. But they also reveal a good deal about children themselves, and cast light on what has recently become a controversial issue.\n\nB. Forty years ago, the French historian Philippe Ariès argued, in Centuries of Childhood, that childhood in the Middle Ages did not exist in its modern sense. Children were regarded by adults with relatively little affection and followed a way of life not very different from that of their elders. More recent historians have disputed this, pointing to plentiful signs of parental affection and arguing that childhood, by its very nature, must always have been much the same.\n\nC. In this debate play is crucial. Did adults encourage it? If so, did they see it as recreational (by providing toys, for example) or as educational (making children play in particular ways)? Did children play as their elders told them, or did they invent their own games, away from adults and even against their wishes? These questions can be answered from a rich body of evidence including actual toys of the period, pictures of children’s activities in contemporary manuscripts and literary sources such as religious works and dictionaries. We know not only how medieval English children played but what their elders thought on the subject.\n\nD. We know, for example, that adults gave children toys from infancy onwards. In 1398 the writer John Trevisa describes babies playing with ‘a child’s brooch’, an object similar in function to the bright plastic toys given to babies today to bite and handle. William Horman, 16th-century author of a Latin textbook, talks of buying a rattle to stop a baby crying. Indeed, by 1300 it appears there was a toy industry in England. Boys’ toys often took military forms, such as the two metal soldiers of that date, found in London, and made from a mould. Girls had dolls, known before the 17th century as ‘poppets’ or puppets, commercially manufactured, imported and, in 1582, taxed at a halfpenny each. Not that children were by any means dependent on things that were bought for them. Gerald of Wales recalls how he and his brothers built towns, palaces, churches and monasteries from sand at Manorbier Castle in about 1150 (perhaps on the nearby beach).\n\nE. Active games were universal. In his English-to-Latin dictionary of 1440, a mysterious recluse known as Geoffrey mentions children playing ‘tennis’ and swinging on what he calls a ‘totter’ or ‘merrytotter’. Children chased each other, swam and played ball games. Boys in the later Middle Ages shot arrows with bows and archery is an example of a sport encouraged by adults, who wanted boys to grow up to play their part in what was, for most men, a warrior society.\n\nF. However, by no means all children’s military activity was directed by adults. In 1400, six months after King Richard II had been overthrown by Henry IV, the children of London gathered together and chose themselves kings. Adam of Usk tells us they congregated ‘in thousands … and made war upon each other … whereby many died’. The new king had to order their parents and masters to stop them.\n\nG. This willingness of children to take the initiative in play, not just to wait for adults to direct them, is evident in the way they observed the calendar. Medieval life was regulated by light, weather, crops and the Church’s cycle of fasts and festivals. Children shared in the adult round of religious festivals, but had their own observances as well, semi-detached from their elders. In the 1200s, the priest Thomas Docking remarked that in spring a child ‘follows the ploughman; in autumn he accompanies the grape-gatherers’. In 1518, the poet Alexander Barclay records children playing with tops in March, looking for fruit in summer and making footballs by filling pigs’ bladders with dried peas in autumn.\n\nH. It is clear from this evidence that the relationship between adults and children in medieval society was, in major respects, a modern one. Parents took an indulgent interest in their children, providing them with toys and giving them time to play. Children played in a wide variety of ways – imaginatively, skilfully, athletically and violently – developing their minds, bodies and social skills. Adults tried at times to direct play – partly to keep children in order, partly to give them skills for adult life – but children gravitated to one another and formed a culture of their own. We can answer Ariès’s thesis, then, with a resounding ‘No!’. Childhood has always been much the same.","options":[{"id":"A","text":"invention of cricket"},{"id":"B","text":"children picking grapes"},{"id":"C","text":"poem about value of games"},{"id":"D","text":"early toy manufacturing in England"},{"id":"E","text":"puppets first imported into England"},{"id":"F","text":"dolls taxed in England"},{"id":"G","text":"death of Adam of Usk"},{"id":"H","text":"children playing tennis"},{"id":"I","text":"children’s gang warfare"},{"id":"J","text":"a description of seasonal activities"}],"questions":[{"q":32,"context":"32. 1400:_________","answerDisplay":"I. children’s gang warfare","sourcePage":"Đoạn F","evidence":"However, by no means all children’s military activity was directed by adults. In 1400, six months after King Richard II had been overthrown by Henry IV, the children of London gathered together and chose themselves kings. Adam of Usk tells us they congregated ‘in thousands … and made war upon each other … whereby many died’. The new king had to order their parents and masters to stop them.","explanation":"Đáp án I — children’s gang warfare khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: 1400:_________\n• Passage: However, by no means all children’s military activity was directed by adults. In 1400, six months after King Richard II had been overthrown by Henry IV, the children of London gath\n• Key answer: I\nKỹ thuật: xác định đúng “ai/loại n  children play in particul\n• Key answer: J\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: 1518:_________\n• Passage: In this debate play is crucial. Did adults encourage it? If so, did they see it as recreational (by providing toys, for example) or as educational (making children play in particul\n• Key answer: J\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"J","correctText":"a description of seasonal activities","inputType":"select"},{"q":34,"context":"34. 1582:_________","answerDisplay":"F. dolls taxed in England","sourcePage":"Đoạn D","evidence":"We know, for example, that adults gave children toys from infancy onwards. In 1398 the writer John Trevisa describes babies playing with ‘a child’s brooch’, an object similar in function to the bright plastic toys given to babies today to bite and handle. William Horman, 16th-century author of a Latin textbook, talks of buying a rattle to stop a baby crying. Indeed, by 1300 it appears there was a toy industry in England. Boys’ toys often took military forms, such as the two metal soldiers of that date, found in London, and made from a mould. Girls had dolls, known before the 17th century as ‘poppets’ or puppets, commercially manufactured, imported and, in 1582, taxed at a halfpenny each. Not that children were by any means dependent on things that were bought for them. Gerald of Wales recalls how he and his brothers built towns, palaces, churches and monasteries from sand at Manorbier Castle in about 1150 (perhaps on the nearby beach).","explanation":"Đáp án F — dolls taxed in England khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: 1582:_________\n• Passage: We know, for example, that adults gave children toys from infancy onwards. In 1398 the writer John Trevisa describes babies playing with ‘a child’s brooch’, an object similar in fu\n• Key answer: F\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: 1582:_________\n• Passage: We know, for example, that adults gave children toys from infancy onwards. In 1398 the writer John Trevisa describes babies playing with ‘a child’s brooch’, an object similar in fu\n• Key answer: F\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"F","correctText":"dolls taxed in England","inputType":"select"},{"q":35,"context":"35. 1908:_________","answerDisplay":"C. poem about value of games","sourcePage":"Đoạn A","evidence":"‘Play up! Play up! And play the game!’ The ringing chorus of Sir Henry Newbolt’s celebrated cricket poem Vitaï Lampada (1908) sums up views about play in 19th- and early 20th-century Britain. Children’s play was important, and adults should regulate and direct it. Games promoted endurance, self-discipline and team spirit – qualities needed for the health of society and government. Newbolt was one in a long line of people who thought in this way. The notion that children’s play should be used for educational and social purposes goes back at least to the ancient Greeks and the toys and games of medieval England tell us much about how adults then saw childhood. But they also reveal a good deal about children themselves, and cast light on what has recently become a controversial issue.","explanation":"Đáp án C — poem about value of games khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: 1908:_________\n• Passage: ‘Play up! Play up! And play the game!’ The ringing chorus of Sir Henry Newbolt’s celebrated cricket poem Vitaï Lampada (1908) sums up views about play in 19th- and early 20th-centu\n• Key answer: C\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: 1908:_________\n• Passage: ‘Play up! Play up! And play the game!’ The ringing chorus of Sir Henry Newbolt’s celebrated cricket poem Vitaï Lampada (1908) sums up views about play in 19th- and early 20th-centu\n• Key answer: C\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"C","correctText":"poem about value of games","inputType":"select"}],"sourceNote":""},{"id":5,"title":"Traditional Farming in Luapula Province: Animals","instruction":"Match each statement with the correct animal, A–C. You may use any letter more than once.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 5","passage":"By tradition, land in Luapula Province is not owned by individuals but, as in many other parts of Africa, is allocated by the headman or headwoman of a village to people of either sex according to need. Since land is generally prepared by hand, a single family group cannot take on a very large area, so land has not been a limiting resource over large parts of the province. However, that situation has already changed near the main towns, and there has long been a scarcity of land for cultivation in the river valley. In both these areas, registered ownership patterns are becoming prevalent.\n\nMost of the traditional cropping in Luapula Province is based on citemene, a system whereby crops are grown on the ashes of tree branches. As a rule, entire trees are pollarded (pollarding: removing the tops of tree branches) rather than felled, so that they can regenerate. Branches are cut over an area of land of varying size early in the dry season and then stacked to dry out. The wood is fired before the onset of the rains, and in the first year, the area is planted with the African cereal called finger millet. The grain of this crop is used to brew local drinks such as cipumu, which contributes several vitamins of the B complex to people's diets. Cipumu is also used in cementing reciprocal working relationships (Pottier 1985).\n\nDuring the second year, and possibly for a few years more, the area is planted with various combinations of annuals such as maize, pumpkins, sweet potatoes, groundnuts, beans, and various leafy vegetables, grown with a certain amount of rotation. The diverse sequence ends with the vegetable cassava, which is often planted next to the last but one crop before this is harvested.\n\nRichards (1969) observed that the practice of cilemene entails a definite division of labour; men and women perform different tasks. The men stake out plots in an unobtrusive manner, since it is considered provocative towards one's neighbours to mark boundaries in an explicit way. The dangerous work of felling branches is also the men's province: Branches are then stacked by women and fired by men. Women and men cooperate in the planting work, but the harvesting is always done by women.\n\nAt the beginning of the citemene cycle, little weeding is necessary, since the firing of the branches effectively destroys weeds, but as the cycle progresses, weeds increase, and nutrients eventually become depleted to a point where further effort with annual crops is not worthwhile. At this point, cassava is planted, since it can produce a crop on soil that is almost exhausted. Thereafter, the plot is abandoned, and a new area is pollarded for the next cycle.\n\nWhen forest is not available, a situation which is increasingly the case nowadays, a series of ridges is built, in which combinations of maize, beans, groundnuts, and sweet potatoes are then planted, usually followed by cassava. These plots are normally tended by women and provide subsistence.\n\nWhere their roots have year-round access to water, mango, guava, and oil-palm trees are often grown around houses, forming a traditional agro-forestry system, and some of the fruit from these is sold by the roadside or in local markets. In addition, local varieties of rice are sometimes planted in waterlogged ground during the rainy season.\n\nFishing has always been a far more remunerative activity in Luapula than crop husbandry. It provides a much-needed protein supplement to the diet, as well as being the one substantial source of cash. Mueh fish is dried for sale to areas away from the main waterways. The Mweru and Bangweulu Lake Basins are the main areas of Year-round fishing, but the Luapula River is also exploited during the latter part of the dry season. Several previously abundant and desirable species have all but disappeared from Lake Mweru, apparently due to overfishing (Huckaby 1979).\n\nRegarding animal husbandry, only small numbers of cattle or oxen are kept in the province owing to the prevalence of the tsetse fly. The resulting absence of animal power for pulling machinery greatly limits people's ability to plough and cultivate land: a married couple can rarely manage to prepare an area of more than half a hectare by hand-hoeing. However, most people keep freely roaming chickens and goats. These act as a reserve for bartering, but may also be occasionally slaughtered for ceremonies or for entertaining important visitors. These animals are not a standard part of most people's diet.\n\nUntil recently, citemene has been an ingenious system for providing seasonal, high-quality cereals and vegetables in regions of acidic, heavily leached soils. Nutritionally, the most serious deficiency has been that of protein. However, this could be alleviated when fish were available, provided that cultivators lived near the valley or could find a source of dried fish. The citemene/fishing system was well adapted to the ecology of the woodland regions and sustainable for long periods, but only as long as human population densities stayed at low levels.\n\nAlthough population densities are still much lower today than in many other parts of the world, neither the fisheries nor the woodlands of Luapula are capable, with unmodified traditional practices, of supporting the expanding population in a sustainable manner. For instance, even in a normal season, diets suffer from a lack of energy, protein, vitamins, and minerals. It will therefore be necessary in the future to intensify and diversify productive systems.","options":[{"id":"A","text":"fish"},{"id":"B","text":"goats"},{"id":"C","text":"oxen"}],"questions":[{"q":6,"context":"6. They yield the biggest profits for farmers.","answerDisplay":"A. fish","sourcePage":"Đoạn 10","evidence":"Until recently, citemene has been an ingenious system for providing seasonal, high-quality cereals and vegetables in regions of acidic, heavily leached soils. Nutritionally, the most serious deficiency has been that of protein. However, this could be alleviated when fish were available, provided that cultivators lived near the valley or could find a source of dried fish. The citemene/fishing system was well adapted to the ecology of the woodland regions and sustainable for long periods, but only as long as human population densities stayed at low levels.", egions and sustainable for long periods, but only as long as human population densities stayed at low levels.","explanation":"Đáp án A — fish khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: They are often preserved and sold outside the local area.\n• Passage: Until recently, citemene has been an ingenious system for providing seasonal, high-quality cereals and vegetables in regions of acidic, heavily leached soils. Nutritionally, the mo\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: They are often preserved and sold outside the local area.\n• Passage: Until recently, citemene has been an ingenious system for providing seasonal, high-quality cereals and vegetables in regions of acidic, heavily leached soils. Nutritionally, the mo\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"A","correctText":"fish","inputType":"select"}],"sourceNote":""},{"id":6,"title":"Babies Cry in Their Mother Tongue: Researchers","instruction":"Match each statement with the correct researcher/person, A–C.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 6","passage":"A. newborn baby's cry may sound the same to the ears of sleep-deprived parents the world over but, say scientists, comparisons of babies a few days old show that the cry of a newborn shares similarities with the language its parents speak. The reason for this is presumably the different intonation patterns in their native languages, which are already perceived in the uterus and are later reproduced\n\nA. It is already known that human foetuses become attentive listeners in the final trimester of pregnancy. 'The mother's voice in particular is sensed early on,' explains Professor Amelia Finlayson of the Institute for Human Cognitive and Brain Sciences in Leipzig. 'Human foetuses perceive information filtered at around 400 hertz, but they cannot hear the actual words. It is a bit like holding your head under water when someone is talking next to the bath.'\n\nB. Finlayson's research indicates that newborn babies probably cannot distinguish between the accents of Welsh and Northern Scottish people or between Low German and Upper Bavarian, but they can recognise major differences in the intonation patterns of their respective mother tongues. The Leipzig researchers showed that in an earlier experiment, by means of physiological studies of babies of three to four months of age. For that study, the babies had hoods with electrodes put on their heads, and had recordings of different intonation patterns played to them. The children's brainwaves reacted to the differences even when they were asleep.\n\nC. At the same time, Doctor Katya Williams of the University of Wurzburg first suggested in her PhD thesis that babies' crying might be a stage in their linguistic development. Said Williams: 'It used to be thought that a baby's cry was just a signal of alarm to call its mother. This assumption was corrected when we noticed that the cries are not the same from week to week. What biological purpose would that have? If a fire siren sounded different every day, we would not even recognise it!'\n\nD. The question thus presented itself as to whether babies' cries already showed the intonation patterns of their different mother tongues. To study this, the Leipzig brain researchers and the 'screaming researchers' of the University of Wurzburg worked in collaboration with their colleagues at the Laboratory of Cognitive Sciences and Linguistics, at the Ecole Normale Superieure in Paris, to devise a new experiment. German and French babies were selected for the comparison because the differences in the intonation shapes of these two mother tongues are particularly pronounced. For example, the German word Papa is Papa in French.\n\nE. These three research groups made a comparison of recordings of 60 healthy newborns aged between two and five days old: 30 infants born into French-speaking families and 30 born into German-speaking families. Whenever the babies were hungry or thirsty or simply wanted their mothers and announced the fact by crying, the researchers were at the ready with their microphones and recorded their complaints. More than 20 hours of recordings of babies' crying were then fed into a computer for the purpose of analysis.\n\nF. The amazing result, published in the journal Modern Biology, is that just a few days after birth, babies use the acoustic input they perceive in the uterus to adapt their linguistic production to their target mother tongue. The melody of the German babies' screams usually began loudly and at a high pitch and then followed a downward curve, while the French babies more often screamed with a rising melody contour. Thus, they reproduce precisely the intonation patterns that are characteristic of their respective mother tongues. This proves, says the team of researchers, that babies' cries are attempts to communicate specifically with their mothers. 'Newborns are probably highly motivated to imitate their mother's behaviour in order to attract her and foster bonding and therefore physical nourishment,' they wrote. 'Because melody contour may be the only aspect of their mother's speech that newborns are able to imitate, this might explain why we found melody contour imitation at that early age.' This finding is interesting because it suggests that babies are producing sounds they have heard in the womb, meaning that this is learning rather than an innate behaviour.\n\nG. Furthermore, the findings are consistent with the hypothesis that linguistic development does not just begin from the age of nine to ten months, with the first babbling resembling language such as 'mam- mam-mam' or 'ba-ba-ba', but with the very first sounds that babies produce. 'We are born to learn language. And that starts right away,' says Dr Katya Williams. Dr Williams' colleague, Mr Walter Meade, discovered that this initial sensitivity to the melodic features of language assists infants to subsequently learn their mother tongue. 'The melodic patterns practised in crying are building blocks for eventual sound production, such as gurgling and babbling, right up to the first words and sentences,' says Meade.\n\nH. The results also demonstrated once again how language distinguishes human infants from all other primates. According to Williams, among baby chimpanzees, the 'crying melody' is closely associated with the build-up and reduction of pressure in the lungs, and is not generated by a mental process. 'In comparison with the sounds of other primates, the cries of a newborn human baby display a fantastic repertoire of melodic and rhythmic variations,' she adds. 'Our babies are expert vocalists in comparison with all the other animals. Could that offer some small consolation for nerve-wracked parents?'","options":[{"id":"A","text":"Professor Amelia Finlayson"},{"id":"B","text":"Doctor Katya Williams"},{"id":"C","text":"Mr Walter Meade"}],"questions":[{"q":20,"context":"20. Important everyday sounds must remain consistent in order to be understood.","answerDisplay":"B. Doctor Katya Williams","sourcePage":"Đoạn C","evidence":"At the same time, Doctor Katya Williams of the University of Wurzburg first suggested in her PhD thesis that babies' crying might be a stage in their linguistic development. Said Williams: 'It used to be thought that a baby's cry was just a signal of alarm to call its mother. This assumption was corr
