swerDisplay":"B. Doctor Katya Williams","sourcePage":"Đoạn C","evidence":"At the same time, Doctor Katya Williams of the University of Wurzburg first suggested in her PhD thesis that babies' crying might be a stage in their linguistic development. Said Williams: 'It used to be thought that a baby's cry was just a signal of alarm to call its mother. This assumption was corrected when we noticed that the cries are not the same from week to week. What biological purpose would that have? If a fire siren sounded different every day, we would not even recognise it!'","explanation":"Đáp án B — Doctor Katya Williams khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: The tune of young primates’ cries is created by their breathing, not their brain.\n• Passage: At the same time, Doctor Katya Williams of the University of Wurzburg first suggested in her PhD thesis that babies' crying might be a stage in their linguistic development. Said W\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: The tune of young primates’ cries is created by their breathing, not their brain.\n• Passage: At the same time, Doctor Katya Williams of the University of Wurzburg first suggested in her PhD thesis that babies' crying might be a stage in their linguistic development. Said W\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"B","correctText":"Doctor Katya Williams","inputType":"select"},{"q":23,"context":"23. Unborn babies in the womb are focused on the voice of one specific person.","answerDisplay":"A. Professor Amelia Finlayson","sourcePage":"Đoạn A","evidence":"It is already known that human foetuses become attentive listeners in the final trimester of pregnancy. 'The mother's voice in particular is sensed early on,' explains Professor Amelia Finlayson of the Institute for Human Cognitive and Brain Sciences in Leipzig. 'Human foetuses perceive information filtered at around 400 hertz, but they cannot hear the actual words. It is a bit like holding your head under water when someone is talking next to the bath.'","explanation":"Đáp án A — Professor Amelia Finlayson khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Unborn babies in the womb are focused on the voice of one specific person.\n• Passage: It is already known that human foetuses become attentive listeners in the final trimester of pregnancy. 'The mother's voice in particular is sensed early on,' explains Professor Am\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Unborn babies in the womb are focused on the voice of one specific person.\n• Passage: It is already known that human foetuses become attentive listeners in the final trimester of pregnancy. 'The mother's voice in particular is sensed early on,' explains Professor Am\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"A","correctText":"Professor Amelia Finlayson","inputType":"select"}],"sourceNote":""},{"id":7,"title":"Early Electric Telegraph: Dates and Events","instruction":"Match each event with the correct date, A–H.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 7","passage":"A. Francis Ronalds was born in London in 1788, the second of eleven children. When he was nineteen his father died, and as the eldest son, the young Ronalds had to assume the responsibility of running the family's cheese business. He combined this occupation with his passions for chemical experiments and for meteorology, the study of the Earth's atmosphere and its changes. This brought him into contact with the elderly Swiss meteorologist Jean Andre de Luc, who was also an inspired inventor in the field of electricity. In 1814, de Luc encouraged Ronalds to start work on this new discipline.\n\nB. For the next few years, Ronalds experimented enthusiastically with various kinds of electrostatic clockwork devices. He was particularly interested in the idea of electric telegraphy: transmitting messages over distance, using electrical impulses carried along metal wires. In the best traditions of nineteenth- century scientists, these investigations were carried out at home. In early 1816, Ronalds gutted the family home in Hammersmith, West London, and covered its rooms, halls, and staircases with electric wire. This experiment involved the use of current to produce movement in small corks at the ends of circuits.\n\nC. Some months later, Ronalds built two large wooden frames accommodating 8 miles (12.9 km) ofelectrically charged iron wire in his back garden. At either end of the wire was a revolving disc, on which letters and numbers were engraved. These dials were kept revolving by means of a clockwork mechanism. When somebody wanted to send a message, he would wait until the dial at his end was showing the desired number or letter, and then interrupt the charge on the wire. This would cause two balls suspended on the wire to fall together. The person at the opposite end would then note down what was indicated by the dial at his end at the moment when the balls made contact. Ronalds soon developed a modified version of his invention in which the wire was encased in glass tubes and buried in the ground. The system was slow and depended on the two dials staying in step, but it worked.\n\nD. Ronalds immediately contacted the Admiralty, the department of the British government which had control over the nation's naval affairs. He was not the first to propose a system of this nature to them. Some ten years earlier, in 1806, the inventor Ralph Wedgwood had offered the Admiralty a similar type of telegraph based on frictional electricity, which it had rejected. The Admiralty had its home in London, whereas its naval fleets were based over 130 km away in Portsmouth. With communication between these two cities in mind, Ronalds wrote to Lord Melville, the then First Lord of the Admiralty, to offer him his telegraphic system.\n\nE. Ronalds believed that his invention was capable of carrying messages some 800 km, and in his letter to Lord Melville written on 11 July 1816 he spoke of the 'mode of conveying telegraphic intelligence with great rapidity, accuracy, and certainty, in all states of the atmosphere, either at night or in the day, and at small expense.' In 1816, the Admiralty had at its disposal only the late eighteenth-century telegraphic system of semaphore, whereby a mechanical device was used to control a mast with two arms. The disadvantage of this system was that it was only usable in daylight and in clear weather conditions. Nevertheless, John Barrow, Secretary to the Admiralty, wrote back to Ronalds on 5 August, saying that 'telegraphs of any kind are wholly unnecessary, and NO other than the one now in use will be adopted.'\n\nF. Ronalds did not pursue the matter further or attempt to patent his telegraph. However, in a smallpamphlet published in 1823, he described his invention and listed some of its potential uses: 'Why should not government govern at Portsmouth almost as promptly as in Downing Street? Why should our defaulters escape by default of our foggy climate? Let us have Electrical Conversazione offices communicating with each other all over the kingdom if we can.'\n\nAlthough Ronalds lived long enough to see his prophecies come to fruition, he made NO further contribution to the progress of telegraphic communication. In 1843, he was appointed the first Honorary Director and Superintendent of the Observatory at Kew, where he devised an accurate, automatic system for registering meteorological data using photography. A similar system was developed independently by Charles Brooke, but the British Association of Meteorologists confirmed Ronalds's priority. His system remained in use for many decades.\n\nG. Meanwhile, the people who benefited most directly from Ronalds's telegraphic work were the physicist Charles Wheatstone and his business partner William Cooke. They saw the potential of a rapid communication system for the growing number of private railway companies, and in 1837 they developed the Wheatstone-Cooke five-needle telegraph. The pair patented their design in the same year, the first of its kind to be officially registered, and reaped considerable financial gain as a result. Ronalds himself retired in 1852 and devoted his later years to collecting and cataloguing a vast library of published material on electricity and magnetism. In 1870, three years before he died, he was knighted by Queen Victoria, a belated honour in recognition of his 'early and remarkable labours in telegraphic investigations.'","options":[{"id":"A","text":"1806"},{"id":"B","text":"1814"},{"id":"C","text":"1816"},{"id":"D","text":"1823"},{"id":"E","text":"1837"},{"id":"F","text":"1843"},{"id":"G","text":"1852"},{"id":"H","text":"1870"}],"questions":[{"q":27,"context":"27. The first electric telegraph system was submitted to the Admiralty.","answerDi leven children. When he was nineteen his father died, and as the eldest son, the young Ronalds had to assume the responsi\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Ronalds began to experiment with electricity.\n• Passage: Francis Ronalds was born in London in 1788, the second of eleven children. When he was nineteen his father died, and as the eldest son, the young Ronalds had to assume the responsi\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"B","correctText":"1814","inputType":"select"},{"q":31,"context":"31. Ronalds informed the public about the possible uses of his telegraph.","answerDisplay":"D. 1823","sourcePage":"Đoạn F","evidence":"Ronalds did not pursue the matter further or attempt to patent his telegraph. However, in a smallpamphlet published in 1823, he described his invention and listed some of its potential uses: 'Why should not government govern at Portsmouth almost as promptly as in Downing Street? Why should our defaulters escape by default of our foggy climate? Let us have Electrical Conversazione offices communicating with each other all over the kingdom if we can.'","explanation":"Đáp án D — 1823 khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Ronalds informed the public about the possible uses of his telegraph.\n• Passage: Ronalds did not pursue the matter further or attempt to patent his telegraph. However, in a smallpamphlet published in 1823, he described his invention and listed some of its poten\n• Key answer: D\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Ronalds informed the public about the possible uses of his telegraph.\n• Passage: Ronalds did not pursue the matter further or attempt to patent his telegraph. However, in a smallpamphlet published in 1823, he described his invention and listed some of its poten\n• Key answer: D\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"D","correctText":"1823","inputType":"select"}],"sourceNote":""},{"id":8,"title":"Small Talk: Researchers / People","instruction":"Match each statement with the correct researcher/research team, A–E.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 8","passage":"Some workers are happier in their jobs than others, but it's not only to do with the work itself. For example, security guards, truck drivers and salespeople: year after year, these jobs appear on lists of the unhappiest careers. It's true that many factors can make a job cheerless, including unusual hours, low pay and a lack of chances for advancement. However, these three types of work stand out for another reason: they're characterised by a lack of conversation or by meaningless small talk, which unfortunately represents an obligatory part of the job. Examples of such small talk include comments about the weather, holiday destinations and food. Psychologists have long said that connecting with others through meaningful exchanges is central to well-being, but just how much conversation we require is under investigation.\n\nMatthias R. Mehl and Simine Vazire of the University of Arizona in the United States wanted to investigate the types of conversations people have. The team used a device to periodically record short verbal exchanges while participants went about their daily tasks. In the study, the researchers eavesdropped on undergraduates for four days, then catalogued each overheard conversation as either \"small talk\" (\"What do you have there? Popcorn? That looks good!\") or \"substantive\" (\"So did their proposal get funding?\" \"How did you feel?\"). They found that people who had more substantive conversations were more likely to say they were feeling happy and fulfilled overall. In fact, the happiest students had roughly twice as many substantive talks as the unhappiest ones. Small talk, meanwhile, made up only 10 per cent of their conversation, versus almost 30 per cent of conversation among the least content students.\n\nHowever, small talk still has a role to play. Rather than convey information, scientists believe that it can promote bonding. Ipek Kulahci and her team of researchers at University College Cork in Ireland tested the relationship between vocal exchanges and grooming in lemurs. The researchers reported that the animals reserve their call-and-response conversations, equivalent to human chitchat, for the animals they groom the most-suggesting that small talk maintains closeness with loved ones, and isn't merely for awkward exchanges with strangers. It appears that, even among animals, vocal exchanges indicate strong social bonds between the group members.\n\nConnecting with others seems to increase happiness, but strangers in close proximity routinely ignore each other. To examine the experience of connecting to strangers, psychologists Nicholas Epley and Juliana Schroeder from the University of Chicago in the United States gave volunteers varying directions about whether to talk with other commuters who usually took the same train to work every day - something they typically avoided. Those told to chat with others reported a more pleasant journey than those told to 'enjoy your solitude' or do whatever they normally would. All of the volunteers in the study who initiated conversations reported a positive reaction from the people they spoke to. Participants had predicted precisely the opposite outcome. They expected that the others on the train would have preferred to be left alone.\n\nWhen we buy a cup of coffee at a café, we sometimes chat with the service staff, but on other occasions we say as little as possible so as not to waste time. Every day we have opportunities to transform potentially impersonal exchanges into genuine social interactions; in other words, treating a service provider like we would an acquaintance might make us happier. In a study by Gillian Sandstrom and Elizabeth Dunn, people who had a social interaction with a server in a coffee shop felt better emotionally than people who were in a rush to get everything done. As well as feeling happier, the first group had a stronger sense of belonging. These results suggest that, although people are often reluctant to have a genuine social interaction with a stranger, they are happier when they do. In similar studies, when volunteers broke the silence at a gallery to chat with other visitors, the visitors felt happier and more connected to the paintings than those who were not approached. The pleasure of connection seems contagious; in a laboratory waiting room, participants who were talked to had equally positive experiences as those instructed to talk to them.\n\nOf course, some of us are better than others at small talk. In a study by Todd Kashdan and his team from George Mason University in the United States, people who were rated by the researchers as 'less curious about all aspects of life' had trouble getting a conversation going on their own. However, they had greater luck building closeness with others when they were supplied with topics that encouraged people to open up about themselves and their lives. But people who were deemed 'curious' needed no help transforming conversations about ordinary things like favourite holidays into other areas of conversation that allowed for intimate exchanges. The study showed that curious people expect to generate closeness during intimate conversations but not during small talk; less curious people anticipated poor outcomes in both situations. In an experiment by William Fleeson at Wake Forest University in the United States, participants were divided into two groups - those who were naturally outgoing, and those who were more reserved in social situations. They were then instructed to behave in the opposite manner to their usual nature. Participants reported more positive feelings when instructed to act extroverted than when instructed to act introverted. The overall conclusion, therefore, is that everyone can benefit from more conversation; the more meaningful, the better.","options":[{"id":"A","text":"Matthias R. Mehl and Simine Vazire"},{"id":"B","text":"Ipek Kulahci"},{"id":"C","text":"Nicholas Epley and Juliana Schroeder"},{"id":"D","text":"Gillian Sandstrom and Elizabeth Dunn"},{"id":"E","text":"Todd Kashdan"}],"questions":[{"q":20,"context":"20. Interacting socially is preferable to hurrying through a transaction.","answerDisplay":"D. Gillian Sandstrom and Elizabeth Dunn","sourcePage":"Đoạn 5 (ô 18)","evidence":"When we buy a cup of coffee at a café, we sometimes chat with the service staff, but on other occasions we say as little as possible so as not to waste time. Every day we have opportunities to transform potentially impersonal exchanges into genuine social interactions; in other words, treating a service provider like we would an acquaintance might make us happier. In a study by Gillian Sandstrom and Elizabeth Dunn, people who had a social interaction with a server in a coffee shop felt better emotionally than people who were in a rush to get everything done. As well as feeling happier i đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: There is more than one species whose members communicate for social reasons.\n• Passage: However, small talk still has a role to play. Rather than convey information, scientists believe that it can promote bonding. Ipek Kulahci and her team of researchers at University\n• Key answer: B\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"B","correctText":"Ipek Kulahci","inputType":"select"},{"q":23,"context":"23. Some people find it easier than others to change the subject of a conversation.","answerDisplay":"E. Todd Kashdan","sourcePage":"Đoạn 6 (ô 19)","evidence":"Of course, some of us are better than others at small talk. In a study by Todd Kashdan and his team from George Mason University in the United States, people who were rated by the researchers as 'less curious about all aspects of life' had trouble getting a conversation going on their own. However, they had greater luck building closeness with others when they were supplied with topics that encouraged people to open up about themselves and their lives. But people who were deemed 'curious' needed no help transforming conversations about ordinary things like favourite holidays into other areas of conversation that allowed for intimate exchanges. The study showed that curious people expect to generate closeness during intimate conversations but not during small talk; less curious people anticipated poor outcomes in both situations. In an experiment by William Fleeson at Wake Forest University in the United States, participants were divided into two groups - those who were naturally outgoing, and those who were more reserved in social situations. They were then instructed to behave in the opposite manner to their usual nature. Participants reported more positive feelings when instructed to act extroverted than when instructed to act introverted. The overall conclusion, therefore, is that everyone can benefit from more conversation; the more meaningful, the better.","explanation":"Đáp án E — Todd Kashdan khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: Some people find it easier than others to change the subject of a conversation.\n• Passage: Of course, some of us are better than others at small talk. In a study by Todd Kashdan and his team from George Mason University in the United States, people who were rated by the \n• Key answer: E\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: Some people find it easier than others to change the subject of a conversation.\n• Passage: Of course, some of us are better than others at small talk. In a study by Todd Kashdan and his team from George Mason University in the United States, people who were rated by the \n• Key answer: E\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"E","correctText":"Todd Kashdan","inputType":"select"}],"sourceNote":""},{"id":9,"title":"Language Evolution: Researchers","instruction":"Match each statement with the correct researcher/research team, A–D.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 9","passage":"A. In November 1897, in a field near the village of Coligny in eastern France, a local inhabitant unearthed two strange objects. One was an imposing statue of Mars, the Roman god of war. The other was an ancient bronze tablet, 1.5 metres wide and 1 metre high. It bore numerals in Roman but the words were in Gaulish, a version of the Celtic language spoken by the inhabitants of France before the Roman conquest in the first century BC. The tablet turned out to be one of the most important sources of words from this extinct language.\n\nB. Two researchers, geneticist Dr Peter Forster and linguist Dr Alfred Toth, have now used the calendar and other Celtic inscriptions to reconstruct the history of Celtic and its position in the Indo-European family of languages. They say that Celtic became a language in its own right and entered the British Isles much earlier than supposed. Then in the first century BC, the Romans defeated the Celts, both in France and in Britain, so decisively that their language, Latin, and its successor languages displaced Celtic over much of its former territory. In the British Isles, Celtic speakers survived in two main groups: the Goidelic branch of Celtic, which includes Irish and Scots Gaelic, and the Brythonic branch, formed mainly of Welsh and Breton, a Celtic tongue carried to Brittany in France by emigrants from Cornwall.\n\nC. Because languages change so fast, historical linguists have little faith in language trees that go back more than a few thousand years. Dr Forster has developed a new dating method for relating a group of languages, basing it on the tree-drawing techniques used to trace the evolutionary relationships among genes. The method will work on just a handful of words, a fortunate circumstance since only some 30 Gaulish words have known counterparts in all the other languages under study. Dr Forster and Dr Toth have used the method to draw up a tree relating the different branches of Celtic to one another and to other Indo-European languages like English, French, Spanish, Latin and Greek. In a published article, they say that soon after the ancestral Indo-European language arrived in Europe over 5,000 years ago, it split into different branches leading to Celtic, Latin, Greek and English. Within Celtic, their tree shows that Gaulish the mainland European version of the language separated from its Goidelic and Brythonic cousins, much as might be expected from the facts of geography\n\nD. The researchers' method even dates the points at which their language tree divides, although the dates have a wide range of possibility. They calculate that the Indo-European language initially fragmented in Europe around 8100 BC, plus or minus 1,900 years, and the divergence between the mainland European and British versions of Gaelic took place in 3200 BC, plus or minus 1,500 years. These dates are much earlier than previously estimated. ‘The traditional date of the Indo-European fragmentation has been 4000 BC for some time,’ said linguist Dr Merritt Ruhlen. He said the new method ‘seems pretty reasonable’ and should be useful in tracing back the earlier history of the Indo-European language.\n\nE. Specialists have long debated which country was the homeland of the Indo-Europeans and whether their language was spread by conquest or because its speakers were the first agriculturists whose methods and tongue were adopted by other populations. The second theory, that it was spread by agriculture, has been advocated by archaeologist Dr Colin Renfrew. Dr Forster, who works with Dr Renfrew, said in an interview that the suggested date 8100 BC for the arrival of Indo-European in Europe does seem to vindicate Renfrew's archaeological idea that the Indo-European languages were spread by farmers. Agriculture started to arrive in Europe from the Near East around 6000 BC, which is earlier than the traditional date proposed by linguists for the spread of Indo-European. This writing would fit with the lower end of Dr Forster's range of dates.\n\nF. Dr Forster said that his estimated date of 3200 BC for the arrival of Celtic speakers in the British Isles is also much earlier than the usual date, 600 BC, posited on the basis of archaeological evidence. Dr Forster and Dr Toth said their method of evaluating groups of languages against each other was similar to historical linguists, many of whom restrict their research to how words in only one single language have changed over time. Asked what linguists thought of his approach he said: ‘To be honest, they don't understand it, most of them. They don't even know what I'm talking about.’ The method used by Dr Forster and Dr Toth has two parts. One is to draw a tree on the basis of carefully chosen words; the second is to date the splits in the tree by calibrating them with known historical events. This is similar to the way geneticists date their evolutionary trees by tying one or more branch points to known dates from the fossil record.\n\nG. Dr April McMahon, a linguist at the University of Sheffield in England, said that Dr Forster's method ‘seems to me to be a good start’, and that it was reasonable to base a language family tree on just a handful of well-chosen words. She had less confidence in the dating method, she said, because language changes in an irregular way based on social factors like the size of the speaker's group and its degree of contact with others.","options":[{"id":"A","text":"Dr Peter Forster & Dr Alfred Toth"},{"id":"B","text":"Dr Merritt Ruhlen"},{"id":"C","text":"Dr Colin Renfrew"},{"id":"D","text":"Dr April McMahon"}],"questions":[{"q":19,"context":"19. An approach commonly used in language research has too narrow a focus.","answerDisplay":"A. Dr Peter Forster & Dr Alfred Toth","sourcePage":"Đoạn B","evidence":"Two researchers, geneticist Dr Peter Forster and linguist Dr Alfred Toth, have now used the calendar and other Celtic inscriptions to reconstruct the history of Celtic and its position in the Indo-European family of languages. They say that Celtic became a l longer than experts previously thought.\n• Passage: Two researchers, geneticist Dr Peter Forster and linguist Dr Alfred Toth, have now used the calendar and other Celtic inscriptions to reconstruct the history of Celtic and its posi\n• Key answer: A\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"A","correctText":"Dr Peter Forster & Dr Alfred Toth","inputType":"select"},{"q":22,"context":"22. The use of one family of languages may have become more extensive due to farming practices.","answerDisplay":"C. Dr Colin Renfrew","sourcePage":"Đoạn E","evidence":"Specialists have long debated which country was the homeland of the Indo-Europeans and whether their language was spread by conquest or because its speakers were the first agriculturists whose methods and tongue were adopted by other populations. The second theory, that it was spread by agriculture, has been advocated by archaeologist Dr Colin Renfrew. Dr Forster, who works with Dr Renfrew, said in an interview that the suggested date 8100 BC for the arrival of Indo-European in Europe does seem to vindicate Renfrew's archaeological idea that the Indo-European languages were spread by farmers. Agriculture started to arrive in Europe from the Near East around 6000 BC, which is earlier than the traditional date proposed by linguists for the spread of Indo-European. This writing would fit with the lower end of Dr Forster's range of dates.","explanation":"Đáp án C — Dr Colin Renfrew khớp với phát biểu vì passage gắn chính ý này với đối tượng đó.\nBẫy chính: nhiều tên/nhóm xuất hiện gần nhau; cần nối phát biểu với người/nhóm thực sự đưa ra ý đó, không chỉ với tên được nhắc gần nhất.\nParaphrase:\n• Question: The use of one family of languages may have become more extensive due to farming practices.\n• Passage: Specialists have long debated which country was the homeland of the Indo-Europeans and whether their language was spread by conquest or because its speakers were the first agricult\n• Key answer: C\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","paraphrase":"• Question: The use of one family of languages may have become more extensive due to farming practices.\n• Passage: Specialists have long debated which country was the homeland of the Indo-Europeans and whether their language was spread by conquest or because its speakers were the first agricult\n• Key answer: C\nKỹ thuật: xác định đúng “ai/loại nào” đang sở hữu thông tin quyết định; không nối đáp án chỉ vì tên xuất hiện gần từ khóa. Sau đó đối chiếu động từ, mức độ, nguyên nhân–kết quả và phạm vi nghĩa giữa statement và evidence.","warning":"","correct":"C","correctText":"Dr Colin Renfrew","inputType":"select"}],"sourceNote":""},{"id":10,"title":"Art Participation: Researchers","instruction":"Match each statement with the correct researcher, A–F.","sourcePages":"06_MATCHING_FEATURES.pdf • Exercise 10","passage":"Researchers agree that art participation is an important leisure pursuit, with benefits not only to the individual, but also to the community. Art participation can be active, where people create or perform the art, or passive, as is the case when an audience views a performance or a person visits a gallery.\n\nResearcher Howard Spector suggests that active art experiences benefit all age groups by providing individuals with the means to freely and creatively express themselves. Self-expression, in turn, promotes individuality, bolsters self-confidence and improves motivation and attitudes towards academic performance. Both active and passive art experiences can provide the benefits of discovery, stimulation and relaxation (Oliphant 2000). Furthermore, people's participation in art enhances their development and expands their thoughts about culture. In short, art can make individuals more socially conscious.\n\nCommunities committed to providing opportunities for experiencing art are considered more livable because they are attractive to businesses and industry and they offer a higher quality of life for residents (Riley 2002). Tourism is strongly linked to art; art is believed to stimulate tourism in a community, and vice versa. Art-related tourism generates tourists and revenue, attracts high-income consumers, extends the tourist season and is a \"green\" form of the industry (Hughes 2000). Revitalization efforts have increased in many cities because of the strong presence of art opportunities.\n\nArt programs can be highly effective in reducing community problems related to delinquent behavior and truancy in youth (Spector 2000). The Philadelphia Department of Recreation Mural Arts Program (MAP) is one such program. It began in the early 1980s when the city undertook to remove graffiti in the city while creating a positive, productive and creative outlet for adjudicated graffiti artists, as they used their talents to beautify public spaces through the creation of murals, instilling a sense of pride, excellence, diligence and civic responsibility.\n\nIn recognition of these and other benefits, communities are finding many ways to ensure that the public is provided with opportunities to experience art. Public art programs are one way. These programs are typically administered by government, which commissions or mandates works of art for display in public spaces. Public art works can include street furniture, decorations, paving and landmarks, and may take on many forms, including sculpture, decorative ironwork, mosaic flooring and murals. The primary purpose of public art is to bring art into everyday life, to energize public spaces and to arouse society's thinking and imagination.\n\nDespite the significant benefits that art participation can offer to individuals and communities, only 35 percent of the American adult population visit museums or galleries at least once during the year, and only about 25 percent attend a live performance (Bradshaw 1998). Even fewer (14 percent) participate directly in photography, painting, drawing, sculpting, dance (other than ballet), creative writing or classical music. If art experiences are so beneficial, why aren't more people participating?\n\nTo help researchers shed light on this question, the RAND Corporation, a nonprofit institution that helps improve policy and decision-making through objective research and analysis, developed \"A Behavior Model of the Participant Decision\", which can be used to investigate people's inclinations about participating in an art activity (Yoshitomi 2000). According to Yoshitomi, each person has a disposition related to his or her interest in engaging in an art activity; a person's disposition is based on sociodemographic characteristics, social or cultural identity, personality and previous experience. The RAND model clusters participants into three groups according to their disposition toward art participation: those disinclined to participate; those inclined to participate; and those currently participating.\n\nThe RAND findings reveal that the disinclined perceive themselves as being uncomfortable or unfamiliar with art. This disposition might occur among people who do not value art and who have not received art education, or who perceive themselves as unsophisticated or lacking skill to participate. The inclined are interested in participating, but may be constrained by particular barriers such as cost, time, and proper attire. Current participants are those who are involved, and influence or encourage others to participate. Researchers suggest that a strong relationship exists between childhood and adult art participation rates. Individuals with a greater number of childhood art experiences are more likely to have higher rates of participation as adults. Although 90 percent of Americans believe art instruction is important for children and should be offered in schools, almost 40 percent of schools either offer no art instruction or have art instructors with no formal art training.\n\nOne recreation organization working to make sure children get exposed to art is the Boys and Girls Clubs of America, which offer two innovative programs: The National Photography Program and the National Fine Arts Exhibit. Both are designed to get children excited about art. The photography program promotes new art that is technologically produced, including video and computer graphics, but primarily focuses on photography. The program provides club members with the opportunity to achieve personal growth and receive artistic recognition through instruction in photography. Participants also display their work at local, regional and national photography contests. The second program is the Fine Arts Exhibit. This encourages artistic expression, creativity, cultural appreciation and the development of artistic skills through classes, special events, exhibits and competitions. It allows participants to explore a variety of mediums, including drawing, painting, print making, collage and sculpture.\n\nBecause art experiences provide so many important benefits to individuals and communities, it is important for community programs to facilitate opportunities and provide encouragement to increase participation in a variety of programs.","options":[{"id":"A","text":"Spector"},{"id":"B","text":"Oliphant"},{"id":"C","text":"Riley"},{"id":"D","text":"Hughes"},{"id":"E","text":"Bradshaw"},{"id":"F","text":"Yoshitomi"}],"questions":[{"q":20,"context":"20. Art activities can contribute to lowering negative incidents associated with juvenile crime.","answerDisplay":"A. Spector","sourcePage":"Đoạn 3 (ô 15)","evidence":"Communities committed to providing opportunities for experiencing a
