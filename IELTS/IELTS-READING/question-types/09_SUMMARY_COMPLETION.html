":"text"}],"sourceNote":""},{"id":52,"title":"Twin Study: Two of a Kind","instruction":"NO MORE THAN TWO WORDS","sourcePages":"258–261","passage":"FEB RAUB Version\n\nTww Study: Two of a kind\n\nA, THE scientific study of twins goes back to the late 19th century, when Francis Galton, an early geneticist, realised that they came in two varieties: identical twins bor from one egg and non-identical twins that had come from two. That insight tumed out to be key, although it was not until 1924 that it was used to formulate hat is known as the twin rule of pathology, and twin studies really got going.\n\nBB The fin rule of pathology states that any heritable disease will be more\n\nconcordant (that is, more likely to be jointly present or absent) in identical twins than in non-identical\n\n‘ twins—and, in tum, will be more concordant in non-identical twins than in non-siblings. Early work,\n\nfor example, showed that the statistical correlation of\n\nskin-mole counts between identical twins was 0.4, while non-identical twins had a\n\ncorrelation of only 0.2. (A score of 1.0 implies perfect correlation, while a score of\n\nzero implies no correlation.) This result suggests that moles are heritable, but it\n\nalso implies that there is an environmental component to the development of moles, otherwise the correlation in identical twins would be close to 1.0.\n\nTwin research has shown that whether oF not someone takes up smoking is determined mainly by environmental factors, but once he does so, how much he smokes is largely down to his genes. And while @ person's religion is clearly a cultural attribute, there is a strong genetic Tk ete a component to religious fundamentalism, Twin studies are also unraveling the heritability of various aspects of human personality. Traits from neuroticism and anxiety to thrill- and novelty-seeking all have large genetic components. Parenting matters, but it does not determine personality in the way that some had thought.\n\npmb com\n\nJD) More importantly, perhaps, twin studies are helping the understanding of diseases such as cancer, asthma, osteoporosis, arthritis and immune disorders. And twins can be used, within ethical limits, for medical experiments, A study that administered vitamin C to one twin and a placebo to the other found that it had no\n\n| i: ac a: |\n\neffect on the common cold, The lesson from all today’s twin studies is that most human traits are at least partially influenced by genes. However, for the most part, the age-old dichotomy between nature and nurture is not very useful. Many genetic programs are open to input from the environment, and genes are frequently switched on or off by environmental signals. It is also possible that genes themselves influence their environment. Some humans have an innate preference for participation in sports. Others are drawn to novelty. Might people also be drawn to certain kinds of friends and types of experience? In this way, a person's genes might shape the environment they act in as much as the environment shapes the actions of the genes.\n\nIn the past, such research has been controversial. Josef Mengele, a Nazi doctor working at the Auschwitz extermination camp during the second world war, was fascinated by twins. He sought them out among arrivals at the camp and preserved them from the gas-chambers for a series of brutal experiments, After the war, Cyril Burt, a British psychologist who worked on the heredity of intelligence, tainted twin research with results that appear, in retrospect, to have been rather too good. Some of his data on identical twins who had been reared apart were probably faked. In any case, the prevailing ideology in the social sciences after the war was Marxist, and disliked suggestions that differences in human potential might have underlying genetic causes. Twin studies were thus viewed with suspicion.\n\n‘swung back; however, as the human genome project and its aftermath have turned genes fro abstract concepts to real pieces of DNA. The role of genes in sensitive areas such as intelligence is acknowledged by all but a few die-hards, The interesting questions now concem how nature and nurture interact to produce particular bits of biology, rather than which of the two is more important. Twin studies, which are a good way to ask these questions, are back in fashion, and many twins are enthusiastic participants in this research.\n\nResearch at the Twinsburg festival began in a small way, with a single stand in 1979, Gradually, news spread, and more scientists began tuming up. This year, half a dozen groups of researchers were lodged in a specially pitched research tent. In one comer of this tent, Paul Breslin, who works at the Monell Institute in Philadelphia, watched over several tables where twins sat sipping clear liquids from cups and making notes. It was the team’s third year at Twinsburg. Dr Breslin and his colleagues want to find out how genes influence human perception, particularly the senses of smell and taste and those (warmth, cold, pain, tingle, itch and so on) that result from stimulation of the skin. Perception is an example of something that is probably influenced by both genes and experience. Even before birth, people are exposed to flavours such as chocolate, garlic, mint and vanilla that pass intact into the bloodstream, and thus to the fetus. Though it is not yet clear whether such pre-natal exposure shapes taste-perception, there is evidence\n\nEc ae ac CT)\n\nthat it shapes preferences for foods encountered later in life.\n\nH However, there are clearly genetic influences at work, as well—for example in the ability to taste quinine. Some people experience this as intensely bitter, even when it is present at very low levels. Others, whose genetic endowment is different, are less bothered by it. Twin studies make this extremely clear. Within a pair of identical twins, either both, or neither, will find quinine hard to swallow. Non-identical twins will agree less frequently.\n\nInstitute on Deafhess and Other Communication Disorders, in\n\nMaryland, was studying hearing. He wants to know what\n\nhappens to sounds after they reach the ear. It is not clear, he\n\nsays, whether sound is processed into sensation mostly in the\n\near or in the brain. Dr Drayna has already been involved in a\n\ntwin study which revealed that the perception of musical pitch\n\nis highly heritable. At Twinsburg, he is playing different words, or parts of words,\n\ninto the left and right ears of his twinned volunteers. The composite of the two\n\nsounds that an individual reports hearing depends on how he processes this diverse\n\ninformation and that, Dr Drayna believes, may well be influenced by genetics.\n\nJ On the other side of the tent Dennis Drayna, from the National 4 a\n\n{J Elsewhere in the marquee, Peter Miraldi, of Kent State University in Ohio, was trying to find out whether genes affect an individual's motivation to communicate with others. A number of twin studies have shown that personality and sociability are heritable, so he thinks this is fertile ground. And next to Mr. Miraldi was a team of dermatologists from Case Wester Reserve University in Cleveland. They are looking at the development of skin diseases and male-pattem baldness, The goal of the latter piece of research is to find the genes responsible for making men's hair fall out.\n\nJK. The busiest part of the tent, however, was the queue for forensic-science research into fingerprints. The origins of this study are shrouded in mystery. For many months, the festival's organisers have been convinced that the Secret Service—the American government agency responsible for, among other things, the safety of the president—is behind it, When The Economist contacted the Secret Service for more information, we were referred to Steve Nash, who is chairman of the International Association for Identification (IAI), and is also a detective in the scientific investigations section function showDashboard(){activeEx=null;const ds=dashStats();const avg=ds.totalDone?Math.round(ds.correct/ds.totalDone*100):0;app.innerHTML=`<div class="dash"><div class="dash-head"><div><div class="dash-title">IELTS Reading • Summary Completion</div><div class="dash-user">Học sinh: ${esc(currentName)} • Không tính thời gian</div></div><div class="dash-actions"><button id="changeUser">ĐỔI HỌC SINH</button></div></div><main class="dash-main"><div class="summary-row"><div class="summary"><span>Đã hoàn thành</span><b>${ds.done}/52</b></div><div class="summary"><span>Đang làm dở</span><b>${ds.inprog}</b></div><div class="summary"><span>Độ chính xác bài đã nộp</span><b>${avg}%</b></div></div><div class="picker"><label for="exPicker">CHỌN EXERCISE</label><select id="exPicker"><option value="">— Chọn bài —</option>${EXERCISES.map(ex=>{const st=profile.exercises[ex.id];const label=st?.submitted?'ĐÃ LÀM':st&&answeredCount(ex,st)?'ĐANG LÀM':'CHƯA LÀM';return `<option value="${ex.id}">Exercise ${ex.id} – ${esc(ex.title)} [${label}]</option>`}).join('')}</select><button id="openPicked" class="primary">MỞ BÀI</button></div><div class="exercise-grid">${EXERCISES.map(cardHTML).join('')}</div></main></div>`;$('#changeUser').onclick=showStart;$('#openPicked').onclick=()=>{const id=+$('#exPicker').value;if(id)openExercise(id);else toast('Hãy chọn một Exercise.')};$$('.open-ex').forEach(b=>b.onclick=()=>openExercise(+b.dataset.id))}

function questionHTML(ex,q,st){const val=st.answers?.[q.q]||'';const lim=limitFromInstruction(ex.instruction);const control=q.inputType==='select'?`<select class="answer-select" data-q="${q.q}" aria-label="Câu ${q.q}"><option value="">— Chọn đáp án —</option>${ex.options.map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${o.id}. ${esc(o.text)}</option>`).join('')}</select>`:`<input class="answer-input" data-q="${q.q}" value="${esc(val)}" autocomplete="off" spellcheck="false" placeholder="Nhập đáp án">`;const wc=lim&&val?wordCount(val):0;return `<div id="q-${q.q}" class="question-card"><div class="qhead"><span class="qbadge">${q.q}</span><span class="qtype">${q.inputType==='select'?'CHỌN TỪ/CỤM TRONG DANH SÁCH':'ĐIỀN TỪ/CỤM TỪ'}</span><button type="button" class="flag-btn ${st.flags?.[q.q]?'on':''}" data-q="${q.q}" title="Đánh dấu xem lại">⚑</button></div><div class="qcontext">${esc(q.context)}</div><div class="answer-row"><label>Đáp án</label>${control}</div><div class="answered-line">${val?`Đã trả lời${lim&&q.inputType==='text'?`: ${wc}/${lim} từ`:''}`:'Chưa trả lời'}${lim&&q.inputType==='text'&&wc>lim?' <span class="word-alert">• VƯỢT GIỚI HẠN TỪ</span>':''}</div></div>`}
function onAnswer(e){const st=stateFor(activeEx.id);st.answers[e.target.dataset.q]=e.target.value;saveProfile();const card=e.target.closest('.question-card');const line=card.querySelector('.answered-line');const q=activeEx.questions.find(x=>x.q===+e.target.dataset.q),lim=limitFromInstruction(activeEx.instruction),val=e.target.value;const wc=lim&&q.inputType==='text'?wordCount(val):0;line.innerHTML=val?`Đã trả lời${lim&&q.inputType==='text'?`: ${wc}/${lim} từ`:''}${lim&&q.inputType==='text'&&wc>lim?' <span class="word-alert">• VƯỢT GIỚI HẠN TỪ</span>':''}`:'Chưa trả lời';updateTestChrome()}
function toggleFlag(q){const st=stateFor(activeEx.id);st.flags[q]=!st.flags[q];saveProfile();const btn=document.querySelector(`.flag-btn[data-q="${q}"]`);btn?.classList.toggle('on',!!st.flags[q]);updateTestChrome()}
function updateTestChrome(){if(!activeEx)return;const ex=activeEx,st=stateFor(ex.id),n=answeredCount(ex,st);const stat=$('.top-stat');if(stat&&!st.submitted)stat.textContent=`Đã trả lời ${n}/${ex.questions.length}`;for(const q of ex.questions){const c=document.querySelector(`.qchip[data-q="${q.q}"]`);if(c&&!st.submitted){c.classList.toggle('answered',!!String(st.answers?.[q.q]||'').trim());c.classList.toggle('flagged',!!st.flags?.[q.q])}}}
function submitPrompt(){const ex=activeEx,st=stateFor(ex.id),n=answeredCount(ex,st);const missing=ex.questions.filter(q=>!String(st.answers?.[q.q]||'').trim()).map(q=>q.q);const flagged=ex.questions.filter(q=>st.flags?.[q.q]).map(q=>q.q);showModal(`<h2>Xác nhận nộp Exercise ${ex.id}</h2><p>Bạn đã trả lời <b>${n}/${ex.questions.length}</b> câu.</p>${missing.length?`<p><b>Câu chưa trả lời:</b> ${missing.join(', ')}</p>`:'<p>Không còn câu bỏ trống.</p>'}${flagged.length?`<p><b>Đánh dấu xem lại:</b> ${flagged.join(', ')}</p>`:''}<p>Sau khi nộp, Exercise này sẽ được khóa. Lần sau học sinh chỉ xem lại kết quả và giải thích, không làm lại cùng hồ sơ.</p><div class="modal-actions"><button id="cancelModal" class="secondary">TIẾP TỤC LÀM BÀI</button><button id="confirmSubmit" class="primary">XÁC NHẬN NỘP</button></div>`);$('#cancelModal').onclick=closeModal;$('#confirmSubmit').onclick=doSubmit}
function doSubmit(){const ex=activeEx,st=stateFor(ex.id);captureScroll();st.submitted=true;st.submittedAt=Date.now();st.result=grade(ex,st);saveProfile(true);closeModal();filter='all';renderExam('review');toast(`Đã nộp: ${st.result.correct}/${st.result.total} câu đúng.`)}
function optionLabel(ex,letter){const o=ex.options.find(x=>x.id===letter);return o?`${letter}. ${o.text}`:letter}
function reviewHTML(ex,st,g){return `<div class="result-summary"><div class="result-score"><strong>${g.correct}/${g.total}</strong><span>câu đúng • ${Math.round(g.correct/g.total*100)}%</span></div><div style="font-size:11px;color:var(--muted);margin-top:3px">Sai: ${g.wrong} • Bỏ trống: ${g.blank} • Exercise đã khóa sau khi nộp.</div><div class="result-actions"><button id="copyInside" class="secondary">SAO CHÉP KẾT QUẢ</button></div></div>${ex.sourceNote?`<div class="warning"><b>LƯU Ý NGUỒN:</b> ${esc(ex.sourceNote)}</div>`:''}<div class="filterbar"><button class="filterbtn active" data-filter="all">TẤT CẢ</button><button class="filterbtn" data-filter="wrong">CÂU SAI</button><button class="filterbtn" data-filter="correct">CÂU ĐÚNG</button><button class="filterbtn" data-filter="blank">BỎ TRỐNG</button><button class="filterbtn" data-filter="flagged">ĐÁNH DẤU</button></div>${wordBankHTML(ex)}<div id="resultsList">${ex.questions.map(q=>resultCard(ex,q,st,g)).join('')}</div>`}
function resultCard(ex,q,st,g){const r=g.per[q.q],student=r.student||'';const studDisplay=q.inputType==='select'&&student?optionLabel(ex,student):student;const rightDisplay=q.inputType==='select'?optionLabel(ex,q.correct):q.correct;const isOpen=r.status!=='correct';return `<details id="r-${q.q}" class="result-card ${r.status}" data-status="${r.status}" data-flagged="${st.flags?.[q.q]?'1':'0'}" ${isOpen?'open':''}><summary><span class="qbadge">${q.q}</span><b style="flex:1">Câu ${q.q}</b><span class="status-pill">${r.status==='correct'?'ĐÚNG':r.status==='wrong'?'SAI':'BỎ TRỐNG'}</span></summary><div class="result-body"><div class="result-context">${esc(q.context)}</div><div class="ans-grid"><div class="ans-box"><b>Câu trả lời của học sinh</b>${student?`<strong>${esc(studDisplay)}</strong>`:'<em>Không trả lời</em>'}</div><div class="ans-box"><b>Đáp án đúng</b><strong>${esc(rightDisplay)}</strong></div></div><div class="evidence"><b>Evidence • PDF trang ${esc(q.sourcePage||'—')}</b><br>“${esc(q.evidence)}”</div><div class="explain"><h4>GIẢI THÍCH CHI TIẾT</h4><div>${esc(q.explanation)}</div><h4>PARAPHRASE</h4><div>${esc(q.paraphrase||'Đối chiếu ý của summary với cụm evidence trong passage.')}</div></div>${q.warning?`<div class="warning"><b>CẦN KIỂM TRA NGUỒN:</b> ${esc(q.warning)}</div>`:''}</div></details>`}
function jumpQuestion(q){const st=stateFor(activeEx.id);if(window.innerWidth<=920){activeView='questions';setMobileView('questions')}const el=st.submitted?document.getElementById('r-'+q):document.getElementById('q-'+q);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});$$('.qchip').forEach(c=>c.classList.toggle('active',+c.dataset.q===q))}
function applyFilter(f){filter=f;$$('.filterbtn').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));$$('.result-card').forEach(c=>{const show=f==='all'||c.dataset.status===f||(f==='flagged'&&c.dataset.flagged==='1');c.style.display=show?'':'none'})}
function copyResults(){const ex=activeEx,st=stateFor(ex.id),g=st.result||grade(ex,st);const lines=[`IELTS READING – SUMMARY COMPLETION`,`Học sinh: ${currentName}`,`Exercise ${ex.id}: ${ex.title}`,`Kết quả: ${g.correct}/${g.total} đúng`,``,];for(const q of ex.questions){const r=g.per[q.q];const student=r.student||'';lines.push(`Câu ${q.q}`,`Học sinh: ${student?(q.inputType==='select'?optionLabel(ex,student):student):'Bỏ trống'}`,`Đáp án: ${q.inputType==='select'?optionLabel(ex,q.correct):q.correct}`,`Kết quả: ${r.status==='correct'?'ĐÚNG':r.status==='wrong'?'SAI':'BỎ TRỐNG'}`,`Evidence: ${q.evidence}`,`Giải thích: ${q.explanation}`,`Paraphrase: ${q.paraphrase}`,``)}const text=lines.join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Đã sao chép kết quả.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép kết quả.')}catch(e){toast('Không thể tự động sao chép.')}ta.remove()}
function showModal(inner){const root=$('#modalRoot');root.innerHTML=`<div class="modal-wrap" role="dialog" aria-modal="true"><div class="modal">${inner}</div></div>`;document.addEventListener('keydown',escModal)}function closeModal(){const root=$('#modalRoot');root.innerHTML='';document.removeEventListener('keydown',escModal)}function escModal(e){if(e.key==='Escape')closeModal()}
function setupMobile(){const r=$('#mobRead'),q=$('#mobQ');if(!r||!q)return;r.onclick=()=>setMobileView('reading');q.onclick=()=>setMobileView('questions');setMobileView(activeView)}function setMobileView(v){activeView=v;const w=$('#workspace');if(!w)return;w.classList.toggle('show-questions',v==='questions');$('#mobRead')?.classList.toggle('active',v==='reading');$('#mobQ')?.classList.toggle('active',v==='questions')}
function captureScroll(){if(!activeEx)return;const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');if(rp)st.passageScroll=rp.scrollTop;if(qp)st.questionScroll=qp.scrollTop}
function restoreScroll(){const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');if(rp)rp.scrollTop=st.passageScroll||0;if(qp)qp.scrollTop=st.questionScroll||0}
function setupScrollSave(){const rp=$('#readingPane'),qp=$('#questionPane');const fn=debounce(()=>{captureScroll();saveProfile()},250);rp?.addEventListener('scroll',fn);qp?.addEventListener('scroll',fn)}function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
document.addEventListener('click',e=>{if(e.target?.id==='copyInside')copyResults()});showStart();
</script>

<script id="ielts-dual-pane-layout-runtime">
(function(){
  function visible(el){
    if(!el) return false;
    if(el.classList && el.classList.contains('hidden')) return false;
    const s = window.getComputedStyle(el);
    if(s.display === 'none' || s.visibility === 'hidden') return false;
    return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  }

  function syncExamLock(){
    const candidates = Array.from(document.querySelectorAll('.exam,.practice,#exam-screen'));
    const active = candidates.some(visible);
    document.documentElement.classList.toggle('ielts-exam-active', active);
    if(document.body) document.body.classList.toggle('ielts-exam-active', active);
  }

  function start(){
    syncExamLock();
    const obs = new MutationObserver(syncExamLock);
    obs.observe(document.documentElement,{
      subtree:true,
      childList:true,
      attributes:true,
      attributeFilter:['class','style','hidden']
    });
    window.addEventListener('resize', syncExamLock, {passive:true});
    window.addEventListener('orientationchange', syncExamLock, {passive:true});
    document.addEventListener('click', function(){ setTimeout(syncExamLock,0); }, {passive:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }else{
    start();
  }
})();
</script>
<!-- IELTS_DUAL_PANE_PATCH_SCRIPT_END -->
