s is a | 16 judgment that life is satisfying, and does not imply an emotional state. Esteemed [17 psychologist Martin Seligman has speatheaded an effort to 18\n\nstudy the science of happiness. The bad news is that we're WFR iaxy 4,54 19\n\nnot wired to be happy. The good news is that we can do |] predicting 2%\n\nsomething about it. Since its origins in a Leipzig a1 laboratory 130 years ago, psychology has had little to say about goodness and | 22 contentment. Mostly psychologists have concerned 23\n\nthemselves with weakness and misery. There are | 24\n\nee libraries full of theories about why we get sad, worried, [25 “YJ and angry. It hasn’t been respectable science to study 26 Rey what happens when lives go well. Positive experiences, | 27\n\nsuch as joy, kindness, altruism and heroism, have |28\n\nmainly been ignored. For every 100 psychology papers dealing with anxiety or |29 depression, only one concems a positive trait. = Ipredicitng*iEMG (copy right) 1B HLMUALERM ARM RTA RANE S 32 BB A few pioneers in experimental psychology bucked the trend. Professor Alice Isen of 2 Comell University and colleagues have demonstrated how positive emotions make 3 people think faster and more creatively. Showing how easy it is to give people an 3 intellectual boost, Isen divided doctors making a tricky diagnosis into three groups: 3g one received candy, one read humanistic statements about medicine, one was a | 3g\n\ncontrol group. The doctors who had candy displayed the most creative thinking and [3g\n\nworked more efficiently. Inspired by Isen and others, Seligman got stuck in. He raised [49\n\nmillions of dollars of research money and funded 50 research groups involving 150 [gy scientists across the world. Four positive psychology centres opened, decorated in [49 cheerful colours and furnished with sofas and baby-sitters. There were get-togethers [45 on Mexican beaches where psychologists would snorkel and eat fajitas, then form | 44 “pods” to discuss subjects such as wonder and awe. A thousand therapists were [45 coached in the new science. 46\n\n=|] 00] a] Jen] in [eo] vo [i]\n\nBut critics are demanding answers to big questions. What is the point of defining levels of happiness and classifying the virtues? Aren’t these concepts vague and impossible to pin down? Can you justify spending funds to research positive states when there are problems such as famine, flood and epidemic depression to be solved? Seligman knows his work can be belittled alongside trite notions such as “the power of positive thinking”. His plan to stop the new science floating “on the waves of self- improvement fashions” is to make sure it is anchored to positive philosophy above, and to positive biology below.\n\nAnd this takes us back to our evolutionary past. Homo sapiens evolved during the Pleistocene era (1.8 m to 10,000 years ago), a time of hardship and turmoil. It was the Ice Age, and our ancestors endured long freezes as glaciers formed, then ferocious floods as the ice masses melted. We shared the planet with terrifying creatures such as mammoths, elephant-sized ground sloths and sabre-toothed cats, But by the end of the Pleistocene, all these animals were extinct, Humans, on the other hand, had evolved large brains and used their intelligence to make fire and sophisticated tools, to develop talk and social rituals, Survival in a time of adversity forged our brains into a persistent mould. Professor Seligman says: “Because our brain evolved during a time of ice, flood and famine, we have a catastrophic brain. The way the brain works is looking for what's wrong. The problem is, that worked in the Pleistocene era. It favoured you, but it doesn’t work in the modern world.”\n\nAlthough most people rate themselves as happy, there is a wealth of evidence to show that negative thinking is deeply ingrained in the human psyche. Experiments show that we remember failures more vividly than\n\nsuccesses. We dwell on what went badly, not what Nig = ——— | went well. Of the six universal emotions, four Hatppiness is... anger, fear, disgust and sadness are negative and j At om only one, joy, is positive. (The sixth, surprise, is a neutral.) According to the psychologist Daniel P/ y Nettle, author of Happiness, and one of the Royal 4A) Sw\n\nInstitution lecturers, the negative emotions each tell us “something bad has happened” and suggest a different course of action\n\nWhat is it about the structure of the brain that underlies our bias towards negative thinking? And is there a biology of joy? At Iowa University, neuroscientists studied what happens when people are shown pleasant and unpleasant pictures. When\n\nsubjects see landscapes or dolphins playing, part of the frontal lobe of the brain becomes active. But when they are shown unpleasant images a bird covered in oil, or a dead soldier with part of his face missing the response comes from more primitive parts of the brain. The ability to feel negative emotions derives from an ancient danger-recognition system formed early in the brain’s evolution. The pre-frontal cortex, which registers happiness, is the part used for higher thinking, an area that evolved later in human history. Our difficulty, according to Daniel Nettle, is that the brain systems for liking and wanting are separate, Wanting involves two ancient regions the amygdala (jij HE(E) and the nucleus accumbens (Kiidi[X) that communicate using the chemical dopamine (£8) to form the brain’s reward system. They are involved in anticipating the pleasure of eating and in addiction to drugs. A rat will press a bar repeatedly, ignoring sexually available partners, to receive electrical stimulation of the “wanting” parts of the brain, But having received brain stimulation, the rat eats more but shows no sign of enjoying the food it craved. In humans, a drug like nicotine produces much craving but little pleasure.\n\nIn essence, what the biology lesson tells us is that negative emotions are fundamental to the human condit he workers walk in zombie-like geometric ranks,\n\nall dressed in the same dark overalls and all exhibiting the *\n\nsame bowed head and dead-eyed stare. An extraordinary fantasy sequence sees one machine transformed into a huge open-jawed statue which then literally swallows them up.\n\nfpiatenbtatatntant atta atatad alata atetatataaatatalatatatabatetatatay\n\n{ ipredicting H3FARACER RK 7 2 Ri SEB CMA PEALE SSRI\n\nDoe TTT TTA\n\nOn one level the machines and the exploited workers simply provide the wealth and services which allow the elite to live their lives of leisure, but on a more profound level the purpose of all this demented industry is to serve itself. Power, control and the continuance of the system from one 10-hour shift to the next is all that counts. The city consumes people and their labour and in the process\n\nbecomes a perverse parody of a living being.\n\nIt is enlightening, I think, to relate the film to the moder global economy in which multinational corporations now routinely close their factories in one continent so that they can take advantage of cheap labour in another. Like the\n\nindustry in Mettopolis S25 ME 2 ERSTE these corporations’\n\ngoals of increased efficiency and profits have little to do with the welfare _ of the majority of their employees or that of the population at large. Instead their aims are to sustain the momentum of their own growth and to increase the monetary rewards to a tiny elite — their executives and shareholders. Fredersen himself is the essence of the big company boss: Rupert Murdoch would probably feel perfectly at home in his huge skyscraper office with its panoramic view of the city below. And it is important that there is never any mention of government in Metropolis — the whole concept is by implication obsolete. The only people who have power are the supreme industrialist, Fredersen, and his magician/scientist cohort Rotwang.\n\nSo far so good: when the images are allowed to speak for themselves the film is impeccable both in its symbolism and in its cynicism. The problem with Metropolis is its sentimental story-line, which sees Freder, Fredersen’s son, instantly falling in love with the visionary Maria. Maria leads an underground pseudo-religious movement and preaches that the workers should not rebel but should await the arrival of a ‘Mediator’ between the ‘Head’ (capital) and the ‘Hands’ (labour). That mediator is the ‘Heart’ - love, as embodied, finally, by Freder’s love of Maria and his father’s love of him.\n\nG Lang wrote the screenplay in collaboration with his then wife Thea von Harbou. In 1933 he fled from the Nazis (and continued a very successful career in Hollywood). She stayed in Germany and continued to make films under the Hitler regime. There is a constant tension within the film between the too-tidy platitudes (nia) i) of von Harbou’s script and the uncompromisingly caustic vigour of Lang’s imagery\n\nH To my mind, both in Metropolis and in the real world, it’s not so much that the\n\n~~ ‘Head’ and ‘Hands’ require a ‘Heart’ to mediate between them but that the ‘Hands’ need to develop their own ‘Head’, their own political consciousness, and act accordingly — through the ballot box, through buying power and through a sceptical resistance to the materialistic fantasies of the Fredersens.\n\nJ] All the same, Metropolis is probably more accurate no representation of industrial and social relations than it has been at any time since its original release. And Fredersen is certainly still the most potent movie symbol of the handful of elusive corporate figureheads who increasingly treat the world as a Metropolis-like global village.\n\nTRA GIE BS TERR 2 RR BNA BE\n\nFUT AS TLR RRNSI SSE py\n\n[ RAT ) PBAMRAAS Ae MHL:.—— Questions 27-30","options":[],"questions":[{"q":31,"context":"Write your answers in boxes 31-36 on your answer sheet. The director depicts a world of inequality and Finny 4h In the future, the mindless masses of JDredicting workers living u \norientations. The anatomy of the foot parallels that of the human hand - each having 26 bones, 33 joints and more than 100 muscles, tendons and ligaments. Modern lifestyles waste all this flexibility in your socks. Brantingham and Beekman became convinced that damage was being done simply by people standing on even surfaces and that this could be rectified by introducing a wobble.\n\n2/35 )3)8|S\n\n“In Beijing and Shanghai city dwellers take daily walks on cobbled paths to improve their health” To test their ideas, they got 65 clerks and factory workers to try standing on a variable terrain floor - spongy mats with different amounts of give across the surface. This modest irregularity allowed the soles of the volunteers’ feet to deviate slightly from the horizontal each time they shifted position. As the researchers hoped, this simple intervention turned out to make a huge difference over just a few weeks. Just a slight wobble from the floor activated a host of muscles in people's legs, which in turn helped to pump blood back to their hearts. The muscle action prevented the pooling of blood in their feet and legs, reducing the stress on the entire cardiovascular system. And two-thirds of the volunteers reported feeling much less tired. Yet decades later, the flooring of the world's workplaces remains relentlessly smooth.\n\n| ipredicting EF /RACLIRIKS FBR BH PEAS ET Earlier this year, however, the idea was given a new lease of life when researchers in Oregon announced findings from a similar experiment with people over 60. John Fisher and colleagues at the Oregon Research Institute in Eugene designed a mat intended to replicate the effect of walking on cobblestones, In tests funded by the National Institute of Aging, they got some 50 adults to walk on the mats in their stockinged feet for less than an hour three times a week. After 16 weeks, these people showed marked improvements in balance and mobility, and even a significant reduction in blood pressure. People in a control group who walked on ordinary floors also improved but not as dramatically.\n\nThe mats are now on sale at $35. \"Our first 1000 cobblestone mats sold in three weeks,\" Fisher says. Production is now being scaled up. Even so, demand could exceed supply if this foot-stimulating activity really is a “useful non-pharmacological approach for preventing or controlling hypertension of older adults\", as the researchers believe. They are not alone in extolling the revitalising powers of cobblestones. Reflexologists have long advocated walking on textured surfaces to stimulate so-called \"acupoints\" on the soles of the feet. Practitioners of this unorthodox therapy believe that pressure applied to particular spots on the foot connects directly to corresponding organs and somehow enhances their function. In China, spas, hotels, apartment blocks and even factories promote their cobblestone paths as healthful amenities. Fisher admits he got the idea from regular visits to the country. In Beijing and Shanghai city dwellers take daily walks along cobbled paths to improve their health. \"In the big cities, people take off their shoes and walk on these paths for 5 or 10 minutes, perhaps several times a day,\" Fisher says.\n\nThe idea is now taking off in Europe too. People in Germany, Austria and\n\nSwitzerland can visit \"barefoot parks\" and walk along “paths of the senses\" - with mud, logs, stone and moss underfoot - to receive what's known there as\n\nreflexzon-massage. And it is not difficult to construct your own \"health pathway\". American reflexologists Barbara and Kevin Kunz, based in Albuquerque, New Mexico, advise that you cobble together a walkway using broom handles, bamboo poles, hosepipes, gravel, pebbles, dried peas, driftwood, fallen logs, sand, door mats and strips of turf.\n\nng FARE BIBI TE TH\n\nIf your enthusiasm for DIY doesn't stretch to this, and Fisher's cobblestone mats are all sold out, there is another option. A new shoe on the market claims to transform flat, hard, artificial surfaces into something like natural uneven ground. “These shoes have an unbelievable effect,\" says Benno Nigg, an exercise scientist at the human performance laboratory of Calgary University in Canada, which has done contract research for the shoe's manufacturers. \"They are one of the best things to have happened to humankind for years.\" Known as Masai Barefoot Technology, or MBTs, the shoes have rounded soles that cause you to rock slightly when you stand still, exercising the small muscles around the ankle that are responsible for fore-aft stability. Forces in the joint are reduced, putting less strain on the system, Nigg claims,\n\nFAC RENE aS fy [ RAT) RBAMRADS i MHL: “","options":[],"questions":[{"q":36,"context":"Write your answers in boxes 36-40 on your answer sheet. The anatomy of human's foot is complex, which 36 ........ human hand. The experiment, conducted on employees, showed that body movement on surface of different condition can lower the 37 on heart, Similarity was also found in another experiment conducted by researcher from Or","answerDisplay":"parallels","sourcePage":124,"evidence":"syndromes than natural ones, where the foot meets the ground in a wide variety of orientations. The anatomy of the foot parallels that of the human hand - each having 26 bones, 33 joints and more than 100 muscles, tendons and ligaments. Modern","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “Write your answers in boxes 36-40 on your answer sheet. The anatomy of human's foot is complex, which 36 ........ human hand. The experiment, conducted on employees, showed that body movement on surface of different condition can lower the 37 on heart,...”. Passage cung cấp bằng chứng “syndromes than natural ones, where the foot meets the ground in a wide variety of orientations. The anatomy of the foot parallels that of the human hand - each having 26 bones, 33 joints and more than 100 muscles, tendons and lig he height above water about 245ft. The technical challenges of this |28 | engineering project were immense, and Brunel dealt 2 with them with his usual thoroughness and z ingenuity, Two design competitions were held, and m7 the great bridge designer Thomas ‘Telford was the 7S committee's expert, Brunel presented four designs. 34 He went beyond technicalities to include arguments 35\n\nbased on, among other things, the grace of his tower design. Unfortunately, he | 36 only got so far as to put up the end piers in his lifetime. The Clifton Suspension | 37 Bridge was completed in his honour by his engineering friends in 1864, and is still | 38\n\nin use. a ‘The Great Western Railway eu\n\nC While Brunel was still in Bristol, and with the Avon Bridge project stopped or\n\ngoing slowly, he became aware that the civic authorities saw the need for a # railway link to London. Railway location was controversial since private 4s\n\nlandowners and towns had to be dealt with. Mainly, the landed gentry did not want 4g a messy,noisy railway anywhere near them. The Duke of Wellington (of Waterloo 4g fame) was certainly against it. Again Brunel showed great skill in presenting his [7 arguments to the various committees and individuals. Brunel built his railway with [4g\n\nA B |¢ [D E F G |H I [5\n\na broad gauge (7ft) instead of the standard 4ft 8Ysin, which had been used for lines already installed. There is no doubt that the broad gauge gave superior ride and stability, but it was fighting a standard.\n\nAtmospheric railway:\n\nJD Brunel's ready acceptance of new ideas overpowered good engineering judgment\n\n(at least in hindsight) when he advocated the installation of an ‘atmospheric\n\nrailway’ in South Devon. It had the great attraction of\n\ndoing away with the locomotive, and potentially could deal with steeper gradients. Since this connecting arm had to run along the slit, it had to be opened through a flap as the train progressed, but closed airtight behind it, Materials were not up to it, and this arrangement was troublesome and expensive to keep in repair, After a year of fiustration, the system was abandoned. Brunel admitted his failure and took responsibility. He also took no fee for his work, setting a good professional ‘example.\n\nBrunel's ships:\n\nE The idea of using steam to power ships to cross the ocean appealed to Brunel. When his GWR company directors complained about the great length of their railway (it was only about 100 miles) Isambard jokingly suggested that they could\n\neven make it longer - why not go all the way to New\n\nYork, and call the link the Great Western. The \"Great\n\nWestern\" was the first steamship to engage in transatlantic\n\na service. Brunel formed the Great Western Steamship\n\nCompany, and construction started on the ship in Bristol in 1836. Built of wood\n\nand 236ft long, the Great Westem was launched in 1837, and powered by sail and\n\npaddlewheels. The first trip to New York took just 15 days, and 14 days to return.\n\nThis was a great success; a one way trip under sail would take more than a month.\n\nThe Great Western was the first steamship to engage in transatlantic service and\n\nreserved)\n\nFP Having done so well with the Great Western, Brunel immediately got to work on an even bigger ship. The Great Britain was made of iron and also built in Bristol, 322ft in length. The initial design was for the ship to be driven by paddle wheels, but Brunel had seen one of the first propeller driven ships to arrive in Britain, and he abandoned his plans for paddle wheel propulsion. The ship was launched in 1843 and was the first screw-driven iron ship to cross the Atlantic. The Great Britain ran aground early in its career, but was repaired, sold, and sailed for years to Australia, and other parts of the world, setting the standard for ocean travel. In the early 1970s the old ship was rescued from the Falklands, and is now under\n\nrestoration in Bristol.\n\nG Conventional wisdom in Brunel's\n\nday was that steamships could not carry enough coal to make long ocean voyages. But he correctly figured out that this was a case where size mattered. He set out to design the biggest ship ever, five times larger than any ship built up to that time. Big enough to carry fuel to get to Australia without refuelling, in addition it would carry 4,000 passengers. The Great Eastern was 692ft long, with a displacement of about 32,000 tons. Construction began in 1854 on the Thames at Millwall. Brunel had chosen John Scott Russell to build the ship. He was a well established engineer and naval architect, but the contract did not go well. Among other things, Scott Russell was very low in his estimates and money was soon a problem. Construction came to a standstill in 1856 and Brunel himself had to take over the work. But Brunel was nothing if not determined, and by September, 1859, after a delayed and problem ridden launch, the Great Eastern was ready for the maiden voyage. Brunel was too sick to go, but it was just as well, because only a few hours out there was an explosion in the engine room which would have destroyed a lesser ship. Brunel died within a week or so of the accident. The great ship never carried 4,000 passengers (among other things, the Suez Canal came along) and although it made several transatlantic crossings, it was not a financial success. Shortly after the Great Eastern began working life, the American entrepreneur Cyrus Field and his backers were looking for a ship big enough to carry 5,000 tons of telegraphic cable, which was to be laid on the ocean floor from Ireland to Newfoundland. Although Brunel did not have it in mind, the Great Eastern was an excellent vessel for this work. On July 27, 1866 it successfully completed the connection and a hundred years of transatlantic communication by cable began. The ship continued this career for several years, used for laying cables in many parts of the world.\n\nSP_TL MAORMME TSE Bl (Bal) REMEBER. &\n\nSo Q olutional Mystery: Crocodile Survives","instruction":"NO MORE THAN TWO WORDS OR A NUMBER","sourcePages":"134–138","passage":"The evolutional mystery: Crocodile survives\n\nCrocodiles have been around for 200 million years, but they're certainly not primitive. The early forms of crocodiles are known as Crocodilia. Since they spent most of their life beneath water, accordingly their body adapted to aquatic lifestyle. Due to the changes formed within their body shape and tendency to adapt according to the climate they were able to survive when most of the reptiles of their period are just a part of history. In their tenure on Earth, they've endured the impacts of meteors, planetary refrigeration, extreme upheavals of the Earth’s tectonic surface and profound climate change. They\n\nwere around for the rise and fall of the dinosaurs, and sun) Yo 4 even 65 million years of supposed mammalian predicting dominance has failed to loosen their grip on the\n\nenvironments they inhabit. Today's crocodiles and alligators are little changed from their prehistoric ancestors, a telling clue that these reptiles were (and remain) extremely well adapted to their environment,\n\nThe first crocodile-like ancestors appeared about 230 million years ago, with many of the features that make crocs such successful stealth hunters already in place: streamlined body, long tail, protective armour and long jaws. They have long head and a long tail that helps them to change their direction in water while moving. They have four legs which are short and are webbed. Never underestimate their ability to move on ground. When they move they can move at such a speed that won't give you a second chance to make a mistake by going close to them especially when hungry. They can lift their whole body within seconds from ground. The fastest way by which most species can move is a sort of \"belly run\", where the body moves like a snake, members huddled to the side paddling away frenetically while the tail whips back and forth. When \"belly running\" Crocodiles can reach speeds up to 10 or 11 km/h (about 7 mph), and often faster if they are sliding down muddy banks, Other form of movement is their \"high walk\", where the body is elevated above the ground.\n\nlee UE HEC DLL A EEA AIT | |\n\nBic (D E |F Gq |h II I\n\nAT","options":[],"questions":[{"q":21,"context":"In many places inhabited by crocodilians, most types of the crocodile has evolved a successful scheme to survive in the drought brought by GB aswesl 21........ According to Kennett and Christian’s six-year study of Australian freshwater crocodiles’ aestivation, they found Aestivating crocodiles spent around a year without access tose: 23........ The absolute size of body water","answerDisplay":"hot season","sourcePage":136,"evidence":"BRL IY pac com cane raced aa In many places inhabited by crocodilians, the hot season brings drought that dries up their hunting grounds and takes away the means to regulate their body temperature. They allowed reptiles to dominate the terrestrial environment.","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “In many places inhabited by crocodilians, most types of the crocodile has evolved a successful scheme to survive in the drought brought by GB aswesl 21........ According to Kennett and Christian’s six-year study of Australian freshwater crocodiles’...”. Passage cung cấp bằng chứng “BRL IY pac com cane raced aa In many places inhabited by crocodilians, the hot season brings drought that dries up their hunting grounds and takes away the means to regulate their body temperature. They allowed reptiles to dominate the terrestrial environment.”. Điểm quyết định là thông tin trong passage dẫn đến “hot season”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “hot season” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN TWO WORDS OR A NUMBER. Đây  explanation for autism is that children suffering from this condition do not have a\n\ntheory of mind (TOM). Consequently, the development of children's TOM has attracted considerable attention.\n\n‘Wimmer and Pemer devised a ‘false belief task' to address this\n\nquestion. They used some toys to act out the following story.\n\nMaxi left some chocolate in a blue cupboard before he went out.\n\nWhen he was away his mother moved the chocolate to a green\n\ncupboard. Children were asked to predict where Maxi will look\n\nfor his chocolate when he returns. Most children under four years\n\ngave the incorrect answer, that Maxi will look in the green\n\ncupboard. Those over four years tended to give the correct\n\nanswer, that Maxi will look in the blue cupboard. The incorrect\n\nanswers indicated that the younger children did not understand\n\nthat Maxi's beliefs and representations no longer matched the actual state of the world, and they failed to appreciate that Maxi will act on the basis of his beliefs rather than the way that the world is actually organised.\n\n(C A simpler version of the Maxi task was devised by Baron-Cohen to take account of\n\ncriticisms that younger children may have been affected by the complexity and too much information of the story in the task described above, For example, the child is shown two dolls, Sally and Anne, who have a basket and a box, respectively. Sally also has a marble, which she places in her basket, and then leaves to take a walk. While she is out of the room, Anne takes the marble from the basket, eventually putting it in the box. Sally returns, and the child is then asked where Sally will look for the marble. The child passes\n\nele/a\n\nzi)\n\nRIS |SIN\n\nRESIS\n\nwo] m/alo orf |es|rofe\n\nAl\n\nthe task if she answers that Sally will look in the basket, where she put the marble; the child fails the task if she answers that Sally will look in the box, where the child knows the marble is hidden, even though Sally cannot know, since she did not see it hidden there. In order to pass the task, the child must be able to understand that another’s mental representation of the situation is different from their own, and the child must be able to predict behavior based on that understanding. The results of research using false-belief tasks have been fairly consistent: most normally-developing children are unable to pass the tasks until around age four.\n\nLeslie argues that, before 18 months, children treat the world in a literal way and rarely demonstrate pretence. He also argues that it is necessary for the cognitive system to distinguish between what is\n\n[ gr ls a | pretend and what is real. If — | children were not able to do this, | >, bE) jams) Ld they would not be able to lends aa | distinguish between imagination\n\nand reality. Leslie suggested that this pretend play becomes possible because of the presence of a de-coupler that copies primary representations to —_ secondary representations. For example, children, when pretending a banana is a telephone, would make a secondary representation of a banana, They would manipulate this representation and they would use their stored knowledge of ‘telephone’ to build on this pretence.\n\nThere is also evidence that social processes play a part in the development of TOM. Meins and her colleagues have found that what they term mindmindedness in maternal speech to six-monthold infants is related to both security of attachment eo zie and to TOM abilities. Mindmindedness involves speech that Fam thos discusses infants’ feelings and explains their behaviour in A DYECICtiNE terms of mental states (e.g. 'you're feeling hungry’).\n\nLewis investigated older children living in extended families in Crete and Cyprus. They found that children who socially interact with more adults, who have more friends, and who have more older siblings tend to pass TOM tasks at a slightly earlier age than other children. Furthermore, because young children are more likely to talk about their thoughts and feelings with peers than with their mothers, peer interaction may provide a special impetus to the development of a TOM. A similar point has been made by Dunn, who argues that peer interaction is more likely to contain pretend play and that it is likely to be more challenging because other children, unlike adults, do not make large adaptations to the communicative needs of other children.\n\nG_ Maiddition, there has been concern that some aspects of the TOM approach underestimate children’s understanding of other people. After all, infants will point to objects apparently in an effort to change a person's direction of gaze and interest; they can interact quite effectively with other people; they will express their ideas in opposition to the wishes of others; and they will show empathy for the feelings of others. All this suggests that they have some level of understanding that their own thoughts are different to those in another person's mind. Evidence to support this position comes from a variety of sources. When a card with a different picture on each side is shown to a child and an adult sitting opposite her, then three year olds understand that they see a different picture to that seen by the adult\n\n|] Schatz studied the spontaneous speech of three-year-olds and found that these children used mental terms, and used them in circumstances where there was a contrast between, for example, not being sure where an object was located and finding it, or between pretending and reality. Thus the social abilities of children indicate that they are aware of the difference between mental states and external reality at ages younger than four.\n\n[A different explanation has been put forward by Hanis, He proposed that children use ‘simulation’. This involves putting yourself in the other person's position, and then trying to predict what the other person would do. Thus success on false belief tasks can be explained by children trying to imagine what they would do if they were a character in the stories, rather than children being able to appreciate the beliefs of other people. Such thinking about situations that do not exist involves what is termed counterfactual reasoning\n\nPUSS RES HEE DL HN Ee AT\n\nFATES IESE Tle\n\n[ RAT ) HB MLAGAS Ra ML:\n\nEA Questions 14-20\n\nUse the information in the passage to match the people (listed A-G) with opinions or\n\ndeeds below. Write the appropriate letters A-G in boxes 14-20 on your answer sheet.\n\nTRC ONE ES Tee EM\n\nA Baron-Cohen\n\nB_ Meins * C Wimmer and Perner Funy hos Hs Lewis predicting\n\nSchatz Harris\n\nLanded at at at at ad att ate\n\n‘14 Giving an alternative explanation that children may not be understanding other’s + belief. { 15 found that children under certain age can tell difference between reality and | mentality ql\n\n16 designed an experiment and drew conclusion that young children under age of 4 | | were unable to comprehend the real state of the world:\n\n417 found that children who gets along with adults often comparatively got through | | test more easily Hl 118 revised an easier experiment rule out the possibility that children might be |! influenced by sophisticated reasoning.\n\n'19 Related social factor such as mother-child communication to capability act in |! TOM 1\n\nSX. Questio } Summary [ez thos","options":[],"questions":[{"q":21,"context":"of the paragraphs of DYedicting Reading Passage, using no more than three words from the Reading Passage for each answer. Write your answers in boxes 21-27 on your answer sheet. In 1980s, researches are designed to test the subject that if children have the ability to represent the reality. First experiment was carried out on this subject on a boy. And questions had been made o","answerDisplay":"theory of mind","sourcePage":139,"evidence":"A considerable amount of research since the mid 1980s has been concerned with what has been termed children’s theory of mind. This involves childr and, dune habitats provide niches for highly specialized plants and animals, including numerous rare and endangered species.\n\nSand is usually composed or hard minerals such as quartz that cannot be broken. down into silt or clay. Yellow, brown and reddish\n\nBi sany 45.54 shades of sand indicate there presence of iron\n\nDHE CACET IS 27 Reds composed of quar coated\n\nby a layer of iton oxide. White sands are neatly\n\npure gypsum, Sand with a high percentage of silicate can be used in glassmaking.\n\nSandstone is created by sand, mixed with lime, chalk or some other material that acts\n\nas a binding agent, that is deposited in layers at the bottom of a sea or other area and\n\npressed together into rock by the great pressure of sediments that are deposited on top if it over thousands of millions of years.\n\nThe most common dune form on Earth and on Mars is the crescentic. Crescent-shaped mounds are generally wider than they\n\nare long. The slipfaces are on the concave sides of the dunes. These dunes form under winds that blow\n\nconsistently from one direction, and they also are\n\nknown as barchans, or transverse dunes. Some types of I surfaces than any other type of dune. A group of dunes\n\nmoved more than 100 metres per year between 1954\n\nspeeds have been recorded in the Western Desert of Egypt. The largest crescentic dunes on Earth, with mean crest-to-crest widths of more than 3 kilometres, are in\n\ncrescentic dunes move more quickly over desert; and 1959 in the China's Ningxia Province, and similar. 4 China's Taklamakan Desert.\n\nBESS\n\nRadially symmetrical, star dunes are pyramidal sand mounds with slipfaces on three or more arms that radiate from the high center of the mound. They tend to accumulate in areas with multidirectional wind regimes. Star dunes grow upward rather than laterally. They dominate the Grand Erg Oriental of the Sahara. In other deserts, they occur around the margins of the sand seas, particularly near topographic barriers. In the southeast Badain Jaran Desert of China, the star dunes are up to 500 metres tall and may be the tallest dunes on Earth. Straight or slightly sinuous sand ridges typically much longer than they are wide are known as linear dunes. They may be more than 160 kilometres (99 mi) long. Some linear dunes merge to form Y-shaped compound dunes. Many form in bidirectional wind regimes. The long axes of these dunes extend in the resultant direction of sand movement. Linear loess hills known as pahas are superficially similar.\n\nOnce sand begins to pile up, ripples and dunes can form. Wind continues to move sand up to the top of the pile until the pile is so steep that it collapses under its own weight. The collapsing sand comes to rest when it reaches just the right steepness to keep the dune stable. This angle, usually about 30-34°, is called the angle of repose. Every pile of loose particles has a unique angle of repose, depending upon the properties of the material it's made of, such as the grain size and roundness, Ripples grow into dunes with increase of wind and sand input,\n\nThe repeating cycle of sand inching up the windward side to the dune crest, then slipping down the dune's slip face allows the dune to inch forward, migrating in the\n\n5 direction the wind blows. As you might guess, all of this climbing then slipping 26 leaves its mark on the internal structure of the dune. The image on the right shows 27 fossil sand dune structure preserved in the Merced Formation at Fort Funston, 28 Golden Gate National Recreation Area. The sloping lines or laminations you see are 29 the preserved slip faces of a migrating sand dune. This structure is called 30 | cross-bedding, and can be the result of either wind or water currents. The larger the a cross-bedded structure, however, the more likely it is to be formed by wind, rather than water.\n\n33; = = —s S PAAR RAMA TT\n\nSand dunes can “sing” at a level up to 115 decibels and generate sounds in different notes, The dunes at Sand Mountain n Nevada usually sing in a low C but can also sing in B and C sharp. The La Mar de Dunas in Chile hum in F while those at the Ghord Lahmar in Morocco howl in G sharp. The sounds are produced by avalanches of sand generated by blowing winds. For a while it was thought that the avalanches caused the entire dune to resonate like a flute or violin but if that were true then different size dunes would produce different notes. In the mid 2000s, American, French and Moroccan scientists visiting sand dunes in Morocco, Chile, China and Oman published a paper in the Physical Review Letters that determined the sounds were produced by collisions between grains of sand that caused the motions of the\n\ngrains to become synchronized, causing the outer layer of a dune to vibrate like the cone of a loudspeaker, producing sound. The tone of the sounds depended primarily on the size of the grains,\n\nScientists performed a computer simulation on patterns and dynamics of desert dunes in laboratory. Dune patterns observed in deserts were reproduced. From the initial random state, stars and linear dunes are produced, depending on the variability of the wind direction. The efficiency in sand transport is calculated through the course of development. Scientists found that the sand transport is the most efficient in the linear transverse dune. The efficiency in sand transport always increased through the evolution, and the way it increase was stepwise. They also found that the shadow zone, the region where the sand wastes the chance to move, shrinks through the course of evolution, which greatly helps them build a model to simulate sand move.\n\n(ace ARGH LEAMA LMA RG EM\n\nEL, WEAAGCA: HF pep, VM) SRARMM UF RR\n\nFATALE ESE pera [ RH) REM S RAM::\n\nYou should spend about 20 minutes on following question, which are based on reading passage 3 on the following pages.\n\n= ~ Questions 27-34 REBATE TE HE, RE — BL\n\nChoose the correct heading for paragraphs A-H from the list ficit earlier in the growing season and the deficits could last longer into autumn than at present. What we think of today as a medium-severity drought could be an almost annual occurrence by the end of the century. One direct consequence of warmer - and shorter — winters will be a reduction in snow cover. The permanent snow line in the mountains will rise, while snow cover below this will be shorter-lived. The amount of snow that falls may actually increase, however, even in some northern centres, owing to the intensification of precipitation. Ski-field base stations may eventually have to be moved upwards to\n\n|B |c |D E F G@ |H i [5\n\nbe within reach of the new snow line but there could still be plenty of the white stuff up there.\n\nThere will also be a marked impact on New Zealand’s glaciers. Over the last 100 years, the glaciers have been reduced by 35%, although since 1978 increase snowfall has offset the effect of warming. The latest studies conducted by the National Institute for Water and Atmospheric. Research (NIWA), however, suggest that by the end of the century, warming over the Southern Alps could be significantly greater than over the rest of country.\n\nSea levels around New Zealand have risen by 25cm since the middle of the 9th century and by 7 cm since1990, Predictions for the coming years cover a wide range, however, partly because of unknown rises resulting from the melting of the ice in the Arctic, Greenland and Antarctica, In addition, sea level at any given time is affected by many different factors, one of which is called storm surge. When a Coincides with a | high tide along low lying coastal areas, this bulge raise the tide higher than normal, creating. Surge not unlike a slow-motion tsunami. Not only does a raise in sea level increase the potential for his sort damage, it also has less immediate impacts, One potentially grave outcome is that ground water systems may become contaminated with salt water, spoiling them for the irrigation of farmland, which in turn could diminish crop harvests. Similarly, over time, estuaries may be enlarged by erosion as tidal influences reach further upstream, altering the contours of whole shorelines and initiating further unforeseen consequences.\n\nThe impacts these changes will have oN jppewperr — = New Zealand are difficult to generalize. Human systems are better able to adapt to change than natural ecosystems because humans can see a problem coming and plan a response. Farmers and horticulturalists have made considerable advances, replacing crops they grow to better suit the new conditions. However, plant breeders will need to show considerable ingenuity if they can overcome the acute water shortages that are forecast.\n\nFor natural ecosystems the rate of change is crucial. If it is low, the plants and animals and fish will be able to ‘keep up’; if it is high, only the most adaptable species-those that can survive in the widest range of ecological niches-are likely to survive. Species adapted to only a narrow range of conditions or food sources will find adaptation much more difficult. Take tuatara, for instance. Their sex is\n\ndetermined by the temperature at which the eggs are incubated in warm (currently above 22°C) condition become predominately male — and now males already outnumber females by nearly two to one in some island refuges. In the mountains,as the permanent snow line moves upwards, the tolerance zones of some alpine plants and animals may simply: disappear, It should also be remembered that global warming is just that — a global phenomenon. ‘New Zealand’s own greenhouse emissions are tiny — around 0.5% of the global total. Even if New Zealanders were to achieve the government’s target of carbon neutrality, this would have no discernable impact on global climate change.\n\nThe changes that global warming is going to bring to New Zealand during the 21% century are going to be significant, but where the country is likely to be most vulnerable is with respect to climate change elsewhere. New Zealand may warm more slowly than most places, but if its major export markets undergo damaging change, the economic impact will be severe.\n\n32 the writer refers to NIWA’s latest studies in the 3rd paragraph to show \n\nA. howa particular place could be affected by warming\n\nB that the warming trend has been intensifying since 1978\n\nC that freezing levels will rise throughout the century\n\nD__how the growth of glaciers is likely to cause damage\n\nCos Questions 3. 3-35","options":[{"id":"A","text":"agricultural production"},{"id":"B","text":"tropical waters"},{"id":"C","text":"tidal waves"},{"id":"D","text":"polar regions"},{"id":"E","text":"global warming"},{"id":"F","text":"coastal land"},{"id":"G","text":"high tides"}],"questions":[{"q":33,"context":"Rising sea levels The extent of future sea level rises around New Zealand is uncertain and may be determined in the 33. Another variable is sudden rises in sea level caused by bad weather. Higher sea levels can lead to reduced 34. . and result in changes to the shape of 35 A. agriculture production B tropical waters C_ tidal waves D__ polar reg","answerDisplay":"D – polar regions","sourcePage":149,"evidence":"A northern polar regions will be more than 6°C warmer, while the large continents — also the largest centres of population — will be 4°C or more warmer. In contrast, the Southern Ocean, which surrounds New Zealand, may warm by only 2°C. The","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “Rising sea levels The extent of future sea level rises around New Zealand is uncertain and may be determined in the 33. Another variable is sudden rises in sea level caused by bad weather. Higher sea levels can lead to reduced 34. . and result in changes to...”. Passage cung cấp bằng chứng “A northern polar regions will be more than 6°C warmer, while the large continents — also the largest centres of population — will be 4°C or more warmer. In contra  sensation ean cause | 16\n\nitching; however, most of the time it causes giggling. If a feather is gently moved across the | 17\n\nsurface of the skin, it can also cause tickling and giggling. Heavy laughter is caused by | 18 someone or something placing repeated pressure on a person and tickling a particular area, | 18 The spots ekled offen aie feet; toes, sides, andéraims, wud heck which Saude a great deal of a laughter. Yngve Zotterman from Karolinksk Institute has found that tickling sensations 22\n\ninvolve signals from nerve fibers. These nerve fibers are associated with pain and touch. Also, [-93\n\nZotterman has discovered tickling sensations to be associated not only with nerve fibers but [94\n\nalso with sense of touch because people who have lost pain sensations still laugh when [95\n\ntickled, But really, why do we laugh? Why are we not able to tickle ourselves? What part of | 26\n\nthe brain is responsible for laughter and humor? Why do we say some people have no sense | 27\n\nof humor? 28\n\n(C_ Research has shown that laugher is more than just a person's voice and movement and that = it requires the coordination of many muscles throughout the body. Laughter also increases [> blood pressure and heart rate, changes breathing, reduces levels of certain neurochemicals [35\n\n(catecholamines, hormones) and provides a boost to the immune system. Can laughter [34\n\nimprove health? It may be a good way for people to relax because muscle tension is reduced [35\n\nafter laughing. Human tests have found some evidence that humorous videos and tapes can [36\n\nreduce feelings of pain, prevent negative stress reactions and boost the brain’s biological | 37\n\nbattle against infection. 38\n\nJD Researchers betieve we process humor and laughter through a complex pathway of brain 40 activity that encompasses three main brain components. In one new study, researchers used a\n\nimaging equipment to photograph the brain activity of healthy\n\nvolunteers while they underwent a sidesplitting assignment of Big hoe\n\nreading written jokes, viewing cartoons from The New Yorker [i predicting 2 magazine as well as “The Far Side” and listening to digital Emergency? 46 recordings of laughter. Preliminary results indicate that the Choose.» ‘i 47 humor-processing pathway includes parts of the frontal lobe \"® SMARTER [48 brain area, important for cognitive processing; the m 49\n\n6) 50 {A |B c |D |E |F \\c H I [x\n\nsupplementary motor area, important for movement; and the nucleus accumbens, associated with pleasure. Investigations\n\nx Ah. predicting\n\nsupport the notion that parts of the frontal lobe are involved in “\n\nhumor. Subjects’ brains were imaged while they were listening to jokes. An area of the frontal lobe was activated only when they thought a joke was funny. In a study that compared healthy individuals with people who had damage to their frontal lobes, the subjects with damaged frontal lobes were more likely to choose wrong punch lines to\n\nwritten jokes and didn’t laugh or smile as much at funny cartoons or jokes.\n\nEven though we may know more about what parts of the brain are responsible for humor, it is\n\nstill hard to explain why we don’t laugh or giggle when we tickle ourselves. Darwin theorized within “The Expressions of the Emotions in Man and Animals\" that there was a link between tickling and laughter because of the anticipation of pleasure. Because we cannot tickle ourselves and have caused laughter, Darwin speculated surprise from another person touching a sensitive spot must have caused laughter, Some scientists believe that laughing caused by tickling is a built-in reflex even babies have. If we tickle ourselves in the same spot as our friend tickled us, we do not laugh as we did previously. The information sent to our spinal cord and brain should be exactly the same. Apparently for tickling to work, the brain needs tension and surprise. When we tickle ourself, we know exactly what will happen...there is no tension or surprise. How the brain uses this information about tension and surprise is still a mystery, but there is some evidence that the cerebellum may be involved, Because one part of the brain tells another: “It’s just you. Don’t get excited”, Investigations suggest that during self-tickling, the cerebellum tells an area called the somatosensory cortex what sensation to expect, and that dampens the tickling sensation. It looks as if the killjoy is found in the cerebellum. Further explorations to understand tickling and laughter were conducted by Christenfeld and Harris. Within “The Mystery of Ticklish Laughter and “Can a Machine Tickleyn they explained that people laughed equally whether tickled by a machine or by a person. The participants were not aware that who or what was tickling them, However, the laughter was equally resounded. It is suggested that tickling response is\n\na reflex, which, like Darwin suggested earlier, is dependent on the\n\nelement of surprise\n\nDamage to any one part of the brain may affect one’s overall ability to process humor. Peter Derks, a professor of psychology, conducted his research with a group of scientists at NASA-Langley in Hampton. Using a sophisticated electroencephalogram (EEG), they measured the brain activity of 10 people exposed to humorous stimuli. How quickly our brain recognizes the incongruity that deals with most humor and attaches an abstract meaning to it determines whether we laugh. However, different people find different jokes funny. That can be due to a number of factors, including differences in personality, intelligence, mental state and probably mood. But according to Derks, the majority of people recognize when a situation is meant to be humorous. In a series of experiments, he noticed that several patients recovering from brain injuries could not distinguish between something funny and something not.\n\nDr. Shibata of the University of Rochester School of Medicine said our neurons get tickled when we hear a joke. The brain’s “funny bone” is located at the right frontal lobe just above the right eye and appears critical to our ability to recognize a joke. Dr. Shibata gave his patients MRI scans to measure brain activity, trying to find out what part of the brain is particularly active while telling the punch line of a joke as opposed to the rest of the joke and fanny cartoons in comparison to parts of the cartoons that are not funny. The jokes “tickled” the frontal lobes. The scans also showed activity in the nucleus accumbens, which is likely related to our feeling of mirth after hearing a good joke and our “addiction” to humor. While his research was about humor, the results could help lead to answers and solutions to depression, Parts of the brain that are active during humor are actually abnormal in patients with depression. Eventually brain scans might be used to assess patients with depression and other mood disorders. The research may also explain why some stroke victims lose their sense of humor or suffer from other personality changes. The same part of the brain is also associated with social and emotional judgment and planning.\n\nig FF ARICA SY AS ey Ma Be aH CH A SST\n\nEMEA MIA, RRA LES MARIE HK EAR, WELALA: HF MEpp, VE) ERERAM UTRK\n\n-_ Questions 12-14","options":[],"questions":[{"q":12,"context":"suffered from frontal lobes damages had greater chances of picking 14, id not respond to funny cartoons or jokes. Results from one study using brain 12. v..+ movement and pleasure are involved through a sophisticated f jokes or","answerDisplay":"imaging equipment","sourcePage":153,"evidence":"activity that encompasses three main brain components. In one new study, researchers used a imaging equipment to photograph the brain activity of healthy 7 43 volunteers while they underwent a sidesplitting assignment of Big hoe","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “suffered from frontal lobes damages had greater chances of p heet, write the correct answer with one word chosen from the box below In his personal correspondence to and in his published memoirs by Sten Nadoiny, John Franklin was depicted as a man dedicated to the explor","answerDisplay":"F – guidebook","sourcePage":159,"evidence":"literature’s twenty ‘contemporary classics’, and [UR Wanye it has been a ced (v. #:R4A) as a manual and Bee (n.if) by European pressure groups _ and institutions representing causes as diverse","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “Summary paragraph described below. In boxes 33-36 on ‘your answer sheet, write the correct answer with one word chosen from the box below In his personal correspondence to and in his published memoirs by Sten Nadoiny, John Franklin was depicted as a man...”. Passage cung cấp bằng chứng “literature’s twenty ‘contemporary classics’, and [UR Wanye it has been a ced (v. #:R4A) as a manual and Bee (n.if) by European pressure groups _ and institutions representing causes as diverse”. Điểm quyết định là thông tin trong passage dẫn đến “guidebook”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “guidebook” phù hợp với cấu trúc câu và yêu cầu CHOOSE ONE WORD FROM THE BOX. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa của phương án phải khớp chính xác với evidence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'guidebook' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"F","correctText":"guidebook","inputType":"select"}],"sourceNote":""},{"id":29,"title":"Grimm’s Fairy Tales","instruction":"MATCH SUMMARY ENDINGS A–H","sourcePages":"162–165","passage":"‘You should spend about 20 minutes on Questions 27-40, which are based on Reading Passage 3 below\n\nThe Brothers Grimm, Jacob and Wilhelm, named their story collection Children's and Houschold Tales and published the first ofits seven editions in Germany in 1812. The table of contents reads like an A-list of fairy-tale celebrities: Cinderella, Sleeping Beauty, Snow White, Little Red Riding Hood, Rapunzel, Rumpelstltskin, Hansel and Gretel, the Frog King. Drawn mostly from oral narratives, the 210 stories in the Grimm's’ collection represent an anthology of fairy tales, animal fables, rustic farces, and religious allegories that remain unrivalled to this day.\n\nSuch lasting fame would have shocked the ‘humble Grimms. During their lifetimes the collection sold modestly in Germany, at first only a few hundred copies a year The early editions were not even aimed at children, The brothers initially refused to consider illustrations, and _ scholarly footnotes took up almost as much space as the tales themselves. Jacob and Wilhelm viewed themselves as patriotic folklorist, potas entertainers of children. They began their work at a time when Germany had been overrun by the French under Napoleon, who were intent on suppressing local culture. As young, workaholic scholars, single and sharing a cramped flat, the Brothers Grimm undertook the fairy-tale collection with the goal of serving the endangered oral tradition of Germany.\n\nFor much of the 19th century teachers, parents, and religious figures, particularly in the United States, deplored the Grimms' collection for its raw, uncivilized content Offended adults objected to the gruesome punishments inflicted on the stories’ villains. In the original “Snow White” the evil stepmother is forced to dance in red-hot iron shoes until she falls down dead. Even today some protective parents shy from the Grimms’ tales because of their reputation for violence.\n\nDespite its sometimes rocky reception, Children's and Household Tales gradually took\n\nroot with the public, The brothers had not foreseen that the appearance of their work ‘would coincide with a great flowering of children's literature in Europe. English publishers led the way, issuing high-quality picture books such as Jack and the Beanstalk and handsome fotktale collections, all to satisfy a newly literate audience seeking virtuous material for the nursery. Once the Brothers Grimm sighted this new public, they set about refining and softening thei tales, which had originated centuries earlier as earthy peasant fare. In the Grimms\" hands, eruel mothers became nasty stepmothers, unmarried lovers were made chaste and the incestuous father was recast as the devil\n\nIn the 20th century the Grimms’ fairy tales have come to rule the bookshelves of children’s bedrooms, The stories read like dreams come true: handsome lads and beautiful damsels, armed with magic, riumph over giants and witches and wild beasts ‘They outwit mean, selfish adults. Inevitably the boy and girl fall in love and live happily ever afler. And parents keep reading because they approve of the finger-wagging lessons inserted into the stories: keep your promises, don’t talk to strangers, work hard, obey your parents. According to the Grimms, the collection served as \"a manual of manners\".\n\nAltogether some 40 persons delivered tales to the Grimms. Many of the storytellers ‘came to the Grimms’ house in Kassel. The brothers particularly welcomed the visits ‘of Dorothea Vichmann, a widew who walked to town to sell produce from her garden. An innkeeper daughter, Viehmann had\n\ngrown up listening to. stories from\n\ntravellers on the road to Frankfurt\n\n‘Among her treasure was \"Aschenputtel”\n\nCinderella, Marie Hassenpflug was a\n\n20-year-old friend of their sister,\n\nCharlote, from a well-bred,\n\nFrench-speaking family. Marie's\n\nwonderful stories blended motifs from\n\nthe oral tradition and from Perraul's\n\ninfluential 1697 book, Tales of My\n\nMother Goose, which contained claborate versions of “Little Red Riding Hood”, “Snow White”, and “Sleeping Beauty”, among others, Many of these had been adapted from earlier Ialian tales\n\nGiven that the origins of many of the Grimm fairy tales reach throughout Europe and into the Middle East and Orient, the question must be asked: How German are the Grimm tales? Very, says scholar Heinz Rolleke. Love of the underdog, rustic simplicity, creative enerey—these are Teutonic traits. The coarse texture of life during ‘medieval times in Germany, when many of the tales entered the oral tradition, also coloured the narratives. Throughout Europe children were often neglected and abandoned, like Hansel and Gretel. Accused witches were burned at the stake, like the\n\nAB ie pe iF je fe rs\n\nevil mother-in-law in “The Six Swans”, “The cruelty in the stories was not the Grimm’s fantasy”, Rolleke points out.\"It reflected the law-and-order system ofthe old times”\n\n‘The editorial fingerprints left by the Grimms betray the specific values of 19th-century istian, bourgeois German society. But that has not stopped the tales from being embraced by almost every culture and nationality in the world. What accounts for this widespread, enduring popularity? Berahard Lauer points to the “universal style” of the writing. you have no concrete descriptions ofthe Land, or the clothes, or the forest, for the castes. It makes the stories timeless and placeless,” The tales allow us to express ‘our utopian longings’,” says Jack Zipes of the University of Minnesota, whose 1987 translation of the complete fairy tales captures the rustic vigour of the original text, They show a striving for happiness that none of us knows but that we sense is possible, We can identify with the heroes of the tales and become in our rind the masters and mistresses of our own destinies.”\n\nFairy tales provide a workout for the unconscious, psychoanalysts maintain. Bruno Bettelheim famously promoted the therapeutic of the Grimms\" stories, calling fairy tales the \"great comforters. By conftonting fears and phobias, symbolized by witches, heartless stepmotiers, and hungry wolves, children find they can master their anxicties. Bettelheim’s theory continues to be hotly debated. But most young readers aren’t interested in exercising their unconsciousness. The Grimm tales in fact please in an infinite number of ways, something about them seems to mirror whatever moods or interests we bring to our reading of them. The flexibility of interpretation suits them for almost any time and any culture","options":[{"id":"A","text":"reflect what life was like at that time"},{"id":"B","text":"help children deal with their problems"},{"id":"C","text":"demonstrate the outdated system"},{"id":"D","text":"tell of the simplicity of life in the German countryside"},{"id":"E","text":"encourage people to believe that they can do anything"},{"id":"F","text":"recognize the heroes in real life"},{"id":"G","text":"contribute to the belief in nature power"},{"id":"H","text":"avoid details about characters’ social settings"}],"questions":[{"q":36,"context":"summary of the paragraphs of Reading Passage, using no ‘more than two words from the Reading Passage for each answer. Write your answers in boxes 36-40 on your answer sheet. 36 Heinz rlleke said the Grimm’ tales are “German” beacause the tales 37 Heinz Rolleke said the abandoned children in tales 38 Bembard Lauer said the writing style of the Grimm brothers is universal bec","answerDisplay":"D – tell of the simplicity of life in the German countryside","sourcePage":163,"evidence":"root with the public, The brothers had not foreseen that the appearance of their work ‘would coincide with a great flowering of children's literature in Europe. English publishers led the way, issuing high-quality picture books such as Jack and the","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ng hough it may appear «juir}y (i.5?), his decision to study yawning was a logical extension to human beings of my research in developmental neuroscience, reported in such papers as \"Wing-flapping during Development } and Evolution.\" As a neurobehavioral problem, there is not much difference between the wing-flapping of birds and the face- and body-flapping of human yawners.\n\nBB Yawning is an ancient, primitive act, Humans do it even before they are born, opening wide in the womb (71%). Some snakes unhinge their jaws to do it. One species of penguins yawns as part of mating. Only now are researchers beginning to understand why we yawn, when we yawn and why we yawn back. A professor of cognitive neuroscience at Drexel University in Philadelphia, Steven Platek, studies the act of contagious yawning, something done only by\n\npeople and other primates,\n\n* In his first experiment, he used a psychological test to rank people on their empathic ($61H¥¢A9) feelings. He found that participants who did not score high on compassion did not yawn back. \"We literally had people saying, 'Why am I looking at people yawning?\" Professor Platek said. \"It just had no effect.\"\n\nD For his second experiment, he put 10 students in an magnetic resonance imaging machine as they watched video tapes of people yawning, When the students watched the videos, the part of the brain which reacted was the part scientists believe controls empathy - the posterior cingulate (HEI), in the brain's middle rear,\" I don't know if it's necessarily that nice people yawn more, but I think it's a good indicator of a state of mind,\" said Professor Patek. \"It's also a good indicator if you're empathizing with me and paying attention.”\n\nFF His third experiment is studying yawning in those with brain disorders, such as\n\nautism and schizophrenia, in which victims have difficulty connecting emotionally with others. A psychology professor at the University of Maryland, Robert Provine, is one of the few other researchers into yawning. He found the basic yawn lasts about six seconds and they come in bouts with an interval of about 68 seconds, Men and women yawn or half-yawn equally often, but men are significantly less likely to cover their mouths which may indicate complex distinction in genders.\" A watched yawner never yawns,” Professor Provine said. However, the physical root of yawning remains a mystery. Some researchers say it's coordinated _ within the hypothalamus(F Eli) of the brain, the area that also controls breathing.\n\nFF Yawning and stretching also share properties and may be performed together as parts of a global motor complex. But they do not always co-occur—people usually yawn when we stretch, but we don't always stretch when we yawn, especially before bedtime. Studies by J. 1. P, \n\nG. H, \n\nA. Visser and \n\nH. \n\nF. Prechtl in the early 1980s, charting movement in the developing fetus using ultrasound, observed not just yawning but a link between yawning and stretching as early as the end of the first prenatal trimester (HUI).\n\nG The most extraordinary demonstration of the yawn-stretch linkage occurs in many people paralyzed on one side of their body because of brain damage caused by a stroke. The prominent British neurologist Sir Francis Walshe noted in 1923 that when these hemiplegics yawn, they are startled and mystified to observe that their otherwise paralyzed arm rises and flexes automatically in what neurologists term an “associated response.\" Yawning apparently activates\n\nundamaged, unconsciously controlled connections between the brain and the cord motor system innervating the paralyzed (#69809) limb. It is not known whether the associated response is a positive prognosis for recovery, nor whether yawning is therapeutic for reinnervation C4) or prevention of muscular atrophy.\n\nFH] Giinical neurology offers other surprises. Some patients with locked-in\" syndrome, who are almost totally deprived of the ability to move voluntarily, can yawn normally, The neural circuits for spontaneous yawning must exist in the brain stem near other respiratory and vasomotor centers, because yawning, is performed by anencephalic (AGAR) who possess only the medulla\n\noblongate (f#88ict), The multiplicity of stimuli of contagious yawning, by contrast, implicates many ET) ther higher brain regions. I predicting § (4)\n\nmC\n\nSummary","options":[],"questions":[{"q":28,"context":"essor drew a conclusion after > 4 H Lina tee | observation that it takes about six seconds to complete 01 OMCs | an average yawning which needs ......28......before a following yawning comes. It is almost at the same frequency that male and female yawn or half, yet behavior accompanied with yawning showing BSR, ..in genders. Some parts within the brain may affect the | | moveme","answerDisplay":"68 seconds","sourcePage":192,"evidence":"seconds and they come in bouts with an interval of about 68 seconds, Men and women yawn or half-yawn equally often, but men are significantly less likely to cover their mouths which may indicate complex","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “essor drew a conclusion after > 4 H Lina tee | observation that it takes about six seconds to complete 01 OMCs | an average yawning which needs ......28......before a following yawning comes. It is almost at the same frequency that male and female yawn or...”. Passage cung cấp bằng chứng “seconds and they come in bouts with an interval of about 68 seconds, Men and women yawn or half-yawn equally often, but men are significantly less likely to cover their mouths which may indicate complex”. Điểm quyết định là thông tin trong passage dẫn đến “68 seconds”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần cụm số liệu/thời gian; “68 seconds” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN THREE WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định nguồn phù hợp nhất nhưng câu hỏi scan bị lỗi ngữ pháp.","warning":"CẦN KIỂM TRA LẠI ĐỀ GỐC: summary thiếu động từ trong cấu trúc 'people whose ___ damaged'. Passage ghi 'brain damage caused by a stroke'; đáp án 'brain' là từ nguồn phù hợp nhất nhưng câu hỏi scan bị lỗi ngữ pháp.","correct":"brain","correctText":"brain","inputType":"text"}],"sourceNote":""},{"id":37,"title":"Undersea Movement","instruction":"NO MORE THAN THREE WORDS","sourcePages":"195–198","passage":"A, The underwater world holds many challenges. The most basic of these is\n\n“™ movement. The density of water makes it difficult for animals to move. Forward movement is a complex ¥: interaction of underwater forces. Additionally, water Fy Shoe itself has movement. Strong currents carry incredible redicting power that can easily sweep creatures away. The challenges to aquatic movement result in a variety of swimming methods, used by a wide range of animals. The result is a dazzling underwater ballet.\n\nB Fish rely on their skeleton, fins, and muscles to move. The primary function of the\n\nskeleton is to aid movement of other parts. ‘Their skull acts as a fulcrum (34.4) and their vertebrae act as levers. The vertebral column consists of a series of vertebrae held together by ligaments, but not so tightly as to prevent slight sideways movement between each pair of vertebrae. The whole spine is, therefore, flexible. The skull is the only truly fixed part of a fish. It does not move in and off itself but acts as a point of stability for other bones. These other bones act as levers that cause movement of the fish’s body.\n\npo: 1 fc dye eee age C While the bones provide the movement, the muscles supply the power. A typical fish has hundreds of muscles running in all directions around its body. This is why a fish can turn and twist and change directions quickly. The muscles on each side of the spine contract in a series from head to tail and down each side altemately, causing a wave-like movement to pass down the body. Such a movement may be very pronounced in fish such as eels, but hardly perceptible in others, e.g. mackerel. The frequency of the waves varies from about $0/min in the dogfish to 170/min in the mackerel. The sideways and backward thrust of the head and body ‘against the water results in the resistance of the water pushing the fish sideways and forwards in a direction opposed to the thrust. When the corresponding set of muscles on the other side contracts, the fish experiences a similar force from the water on that side. The two sideways forces are equal and opposite, unless the fish\n\nis making a tum, so they cancel out, leaving the sum of the two forward forces\n\nJ) The muscles involved in swimming are of two main types. The bulk of a fish's body is composed of the so-called white muscle, while the much smaller areas at the roots of the fins and in a strip along the centre of each flank comprise red muscle, The red muscle receives a good supply of blood and contains ampler quantities of fat and glycogen, the storage form of glucose, [a] ei which is used for most day-to-day swimming movements. In SiR contrast, the white muscle has a poor blood supply and few energy stores, and it is used largely for short-term, fast swimming. It might seem odd that the body of an animal which adapts adapted so efficiently to its environment should be composed almost entirely of a type of muscle it rarely uses. However, this huge auxiliary power pack carried by a fish is of crucial significance if the life of the fish is threatened — by 4 predator, for instance — because it enables the fish to swim rapidly away from danger.\n\nFE, The fins are the most distinctive features of a fish, composed of bony spines protruding from the body with skin covering them and joining them together, either in a webbed fashion, as seen in most bony fish, or more similar to a flipper, as seen in sharks. These\n\nusually serve as a means for the fish to swim. But it must be emphasized that the\n\nswimming movements are produced by the whole of the muscular body, and in only a few fish do the fins contribute any propulsive force! Their main function is\n\nto control the stability and direction of the fish: as water passes over its body, a\n\nfish uses its fins to thrust in the direction it wishes to go.\n\nipredicting 43 APLAR FR SB] 2 He Bi LBP REA RT ¥\n\nFF Fins located in different places on a fish serve different purposes, such as moving forward, turning, and keeping an upright position 7 The tail fins in its final lash, may contribute as much WAR sxy $Y o> 2 40 per cent ofthe forward thrust. The median fas, I DFEMLCHNg\n\nthat is, the dorsal, anal and ventral fins, control the rolling and yawing movements of the fish by increasing the vertical surface area presented to the water. The paired fins, pectoral and pelvic, act as hydroplanes and control the pitch of the fish, causing it to swim downwards or upwards according to the angle to the water at which they are held by their muscles. The pectoral fins lie in front of the centre of gravity and, being readily mobile, are chiefly responsible for sending the fish up or down. The paired fins are also the means by which the fish slows down and stops.\n\n‘The swimming speed of fish is not so fast as one would expect from watching their rapid movements in aquaria or ponds. Tuna\n\nseem to be the fastest at 44 mph, trout are\n\nrecorded as doing 23 mph, pike 20 mph for\n\nshort bursts and roach about 10 mph, while the\n\nmajority of small fish probably do not exceed\n\n2 of 3 mph, Many people have attempted to\n\nmake accurate measurements of the speed at which various fish swim, either by timing them over known distances in their natural environment or by determining, their performance in man-made swimming channels. From these studies, we can broadly categorise fish into four groups: “sneakers”. such as ecls that are only capable of slow speeds but possess some staying power; “stayers\", that can swim quite fast over long periods; “sprinters” that can generate fast bursts of speed (e.g. pike); and “crawlers” that are sluggish swimmers, although they can accelerate slightly (bream, for example).\n\nOne type of sailfish is considered to be the fastest species of fish over short distances, achieving 68 mph over a three-second period, and anglers have recorded speeds in excess of 40 mph over longer periods for several species of tuna. One is likely to consider a fish's swimming capabilities in relation to its size. However, it is generally true that a small fish is a more able swimmer than a much larger one. On the other hand in terms of speed in miles per hour a big fish will, all other things being equal, be able to swim faster than a smaller fish.\n\niprodicinng@viE Me Copy right) LT RRCHRRUR SHE REE LR CAFES SANT\n\n[ee RETIRE NTE\n\nee es ee:\n\nQuestioi","options":[],"questions":[{"q":24,"context":"te your answers in boxes 24-26 on your answer sheet, ‘Two types of muscles are involved in fish swimming. The majority of a fish's body comprises the 24. and the red muscle is found only at the roots of the fins and in a strip along the centre of EmORn Say each flank. For most of its routine movements, the fish LDFedicting| uses lot of its 25... ..saved in body, and white muscl","answerDisplay":"white muscle","sourcePage":196,"evidence":"J) The muscles involved in swimming are of two main types. The bulk of a fish's body is composed of the so-called white muscle, while the much smaller areas at the roots of the fins and in a strip along the centre of each flank comprise red muscle, The red muscle receives a good supply of blood and contains ampler","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “te your answers in boxes 24-26 on your answer sheet, ‘Two types of muscles are involved in fish swimming. The majority of a fish's body comprises the 24. and the red muscle is found only at the roots of the fins and in a strip along the centre of E
