dence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'objectivity' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"F","correctText":"objectivity","inputType":"select"},{"q":35,"context":"By avoiding the first-person perspective, we focus more on (35) ........................ and on other moral ideals, which in turn leads to wiser decision-making. A. opinions B. confidence C. view D. modesty E. problems F. objectivity G. fairness H. experiences I. range J","answerDisplay":"G – fairness","sourcePage":51,"evidence":"‘observer’ viewpoint we reason more broadly and focus more on interpersonal and moral ideals such as justice and impartiality. 137","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “mann also believes that it is better to regard scenarios with (34) ....................... By avoiding the first-person perspective, we focus more on (35) ........................ and on other moral ideals, which in turn leads to wiser decision-making. A....”. Passage cung cấp bằng chứng “‘observer’ viewpoint we reason more broadly and focus more on interpersonal and moral ideals such as justice and impartiality. 137”. Điểm quyết định là thông tin trong passage dẫn đến “fairness”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “fairness” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–J. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa của phương án phải khớp chính xác với evidence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'fairness' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"G","correctText":"fairness","inputType":"select"}],"sourceNote":""},{"id":10,"title":"Roman Shipbuilding and Navigation","instruction":"ONE WORD ONLY","sourcePages":"56–61","passage":"Shipbuilding today is based on science and ships are built using computers\n\nand sophisticated tools. Shipbuilding in ancient Rome, however, was more of\n\nan art relying on estimation, inherited techniques and personal experience. The\n\nRomans were not traditionally sailors but mostly land- based people, who\n\nlearned to build ships from the people that they conquered, namely the Greeks\n\nand the Egyptians.\n\nThere are a few surviving written documents that give descriptions and\n\nrepresentations of ancient Roman ships, including the sails and rigging.\n\nExcavated vessels also provide some clues about ancient shipbuilding\n\ntechniques. Studies of these have taught us that ancient Roman shipbuilders\n\nbuilt the outer hull first, then proceeded with the frame and the rest of the ship.\n\nPlanks used to build the outer hull were initially sewn together. Starting from\n\nthe 6th century BCE, they were fixed using a method called mortise and tenon,\n\nwhereby one plank locked into another without the need for stitching. Then in\n\nthe first centuries of the current era, Mediterranean shipbuilders shifted to\n\nanother shipbuilding method, still in use today, which consisted of building the\n\nframe first and then proceeding with the hull and the other components of the\n\nship. This method was more systematic and dramatically shortened ship\n\nconstruction times. The ancient Romans built large merchant ships and\n\nwarships whose size and technology were unequalled until the 16th century CE.\n\nWarships were built to be lightweight and very speedy. They had to be able to\n\nsail near the coast, which is why they had no ballast or excess load and were\n\nbuilt with a long, narrow hull. They did not sink when damaged and often would\n\nlie crippled on the sea’s surface following naval battles. They had a bronze\n\nbattering ram, which was used to pierce the timber hulls or break the oars of\n\nenemy vessels. Warships used both wind (sails) and human power (oarsmen)\n\nand were therefore very fast. Eventually, Rome’s navy became the largest and\n\nmost powerful in the Mediterranean, and the Romans had control over what\n\nthey therefore called Mare Nostrum meaning ‘our sea’.\n\nThere were many kinds of warships. The ‘trireme’ was the dominant warship\n\nfrom the 7th to 4th century BCE. It had rowers in the top, middle and lower\n\nlevels, and approximately 50 rowers in each bank. The rowers at the bottom\n\nhad the most uncomfortable position as they were under the other rowers and\n\nwere exposed to the water entering through the oar-holes. It is worth noting\n\nthat contrary to popular perception, rowers were not slaves but mostly Roman\n\ncitizens enrolled in the military. The trireme was superseded by larger ships\n\nwith even more rowers. Merchant ships were built to transport lots of cargo\n\nover long distances and at a reasonable cost. They had a wider hull, double\n\nplanking and a solid interior for added stability. Unlike warships, their\n\nV-shaped hull was deep underwater, meaning that they could not sail too\n\nclose to the coast. They usually had two huge side rudders located off the stern\n\nand controlled by a small tiller bar connected to a system of cables. They had\n\nfrom one to three masts with large square sails and a small triangular sail at\n\nthe bow. Just like warships, merchant ships used oarsmen, but coordinating\n\nthe hundreds of rowers in both types of ship was not an easy task. In order to\n\nassist them, music would be played on an instrument, and oars would then\n\nkeep time with this. The cargo on merchant ships included raw materials (e.g.\n\niron bars, copper, marble and granite), and agricultural products (e.g. grain\n\nfrom Egypt’s Nile valley). During the Empire,\n\nRome was a huge city by ancient standards of about one million inhabitants.\n\nGoods from all over the world would come to the city through the port of\n\nPozzuoli situated west of the bay of Naples in Italy and through the gigantic\n\nport of Ostia situated at the mouth of the Tiber River. Large merchant ships\n\nwould approach the destination port and, just like today, be intercepted by a\n\nnumber of towboats that would drag them to the quay. The time of travel along\n\nthe many sailing routes could vary widely. Navigation in ancient Rome did not\n\nrely on sophisticated instruments such as compasses but on experience, local\n\nknowledge and observation of natural phenomena.\n\nIn conditions of good visibility, seamen in the Mediterranean often had the\n\nmainland or islands in sight, which greatly facilitated navigation. They sailed\n\nby noting their position relative to a succession of recognisable landmarks.\n\nWhen weather conditions were not good or where land was no longer visible,\n\nRoman mariners estimated directions from the pole star or, with less accuracy,\n\nfrom the Sun at noon. They also estimated directions relative to the wind and\n\nswell. Overall, shipping in ancient Roman times resembled shipping today with\n\nlarge vessels regularly crossing the seas and bringing supplies from their\n\nEmpire.","options":[],"questions":[{"q":6,"context":"5. Most rowers on ships were people from the Roman army. Warships and merchant ships Warships were designed so that they were (6) .................... and moved quickly. They often remained afloat after battles and were able to sail close to land as they lacked any additional weight. A battering ram made of (7) ....................... was included in the","answerDisplay":"lightweight","sourcePage":57,"evidence":"warships whose size and technology were unequalled until the 16th century CE. Warships were built to be lightweight and very speedy. They had to be able to sail near the coast, which is why they had no ballast or excess load and were built with a long, narrow hull. They did not sink when damaged and often would","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “5. Most rowers on ships were people from the Roman army. Warships and merchant ships Warships were designed so that they were (6) .................... and moved quickly. They often remained afloat after battles and were able to sail close to land as they...”. Passage cung cấp bằng chứng “warships whose size and technology were unequalled until the 16th century CE. Warships were built to be lightweight and very speedy. They had to be able to sail near the coast, which is why they had no ballast or excess load and were built with a long, narrow hull. They did not sink when damaged...”. Điểm quyết định là thông tin trong passage dẫn đến “lightweight”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần tính từ; “lightweight” phù hợp với cấu trúc câu và yêu cầu ONE WORD ONLY. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'lightweight' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"lightweight","correctText":"lightweight","inputType":"text"},{"q":7,"context":"They often remained afloat after battles and were able to sail close to land as they la was clear and they could see islands or land, sailors used landmarks that they knew to help them navigate their...”. Passage cung cấp bằng chứng “would approach the destination port and, just like today, be intercepted by a number of towboats that would drag them to the quay. The time of travel along the many sailing routes could vary widely. Navigation in ancient Rome did not 146”. Điểm quyết định là thông tin trong passage dẫn đến “towboats”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “towboats” phù hợp với cấu trúc câu và yêu cầu ONE WORD ONLY. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'towboats' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"towboats","correctText":"towboats","inputType":"text"}],"sourceNote":""},{"id":11,"title":"Climate Change Reveals Ancient Artefacts in Norway’s Glaciers","instruction":"NO MORE THAN TWO WORDS","sourcePages":"62–67","passage":"Climate Change Reveals Ancient Artefacts in\n\nNorway’s Glaciers\n\nA. Well above the treeline in Norway’s highest mountains, ancient fields of ice\n\nare shrinking as Earth’s climate warms. As the ice has vanished, it has been\n\ngiving up the treasures it has preserved in cold storage for the last 6,000 years\n\n– items such as ancient arrows and skis from Viking Age traders. And those\n\nartefacts have provided archaeologists with some surprising insights into how\n\nancient Norwegians made their livings.\n\nB. Organic materials like textiles and hides are relatively rare finds at\n\narchaeological sites. This is because unless they’re protected from the\n\nmicroorganisms that cause decay, they tend not to last long. Extreme cold is\n\none reliable way to keep artefacts relatively fresh for a few thousand years, but\n\nonce thawed out, these materials experience degradation relatively swiftly.\n\nWith climate change shrinking ice cover around the world, glacial\n\narchaeologists need to race the clock to find newly revealed artefacts,\n\npreserve them, and study them. If something fragile dries and is windblown it\n\nmight very soon be lost to science, or an arrow might be exposed and then\n\ncovered again by the next snow and remain well-preserved. The\n\nunpredictability means that glacial archaeologists have to be systematic in\n\ntheir approach to fieldwork.\n\nC. Over a nine-year period, a team of archaeologists, which included Lars Pilo\n\nof Oppland County Council, Norway, and James Barrett of the McDonald\n\nInstitute for Archaeological Research, surveyed patches of ice in Oppland, an\n\narea of south-central Norway that is home to some of the country’s highest\n\nmountains. Reindeer once congregated on these icy patches in the later\n\nsummer months to escape biting insects, and from the late Stone Age**,\n\nhunters followed. In addition, trade routes threaded through the mountain\n\npasses of Oppland, linking settlements in Norway to the rest of Europe. The slow\n\nbut steady movement of glaciers tends to destroy anything at their bases, so\n\nthe team focused on stationary patches of ice, mostly above 1,400 metres. That\n\nice is found amid fields of frost-weathered boulders, fallen rocks, and exposed\n\nbedrock that for nine months of the year is buried beneath snow. ‘Fieldwork is\n\nhard work – hiking with all our equipment, often camping on permafrost – but\n\nvery rewarding. You’re rescuing the archaeology, bringing the melting ice to\n\nwider attention, discovering a unique environmental history and really\n\nconnecting with the natural environment,’ says Barrett.\n\nD. At the edges of the contracting ice patches, archaeologists found more than\n\n2,000 artefacts, which formed a material record that ran from 4,000 BCE to the\n\nbeginnings of the Renaissance in the 14th century. Many of the artefacts are\n\nassociated with hunting. Hunters would have easily misplaced arrows and they\n\noften discarded broken bows rather than take them all the way home. Other\n\nitems could have been used by hunters traversing the high mountain passes of\n\nOppland: all-purpose items like tools, skis, and horse tack.\n\nE. Barrett’s team radiocarbon-dated 153 of the artefacts and compared those\n\ndates to the timing of major environmental changes in the region – such as\n\nperiods of cooling or warming – and major social and economic shifts – such\n\nas the growth of farming settlements and the spread of international trade\n\nnetworks leading up to the Viking Age. They found that some periods had\n\nproduced lots of artefacts, which indicates that people had been pretty active\n\nin the mountains during those times. But there were few or no signs of activity\n\nduring other periods.\n\nF. What was surprising, according to Barrett, was the timing of these periods.\n\nOppland’s mountains present daunting terrain and in periods of extreme cold,\n\nglaciers could block the higher mountain passes and make travel in the upper\n\nreaches of the mountains extremely difficult. Archaeologists assumed people\n\nwould stick to lower elevations during a time like the Late Antique Little Ice Age,\n\na short period of deeper-than-usual cold from about 536-600 CE. But it turned\n\nout that hunters kept regularly venturing into the mountains even when the\n\nclimate turned cold, based on the amount of stuff they had apparently\n\ndropped there. ‘Remarkably, though, the finds from the ice may have\n\ncontinued through this period, perhaps suggesting that the importance of\n\nmountain hunting increased to supplement failing agricultural harvests in\n\ntimes of low temperatures,’ says Barrett. A colder turn in the Scandinavian\n\nclimate would likely have meant widespread crop failures, so more people\n\nwould have depended on hunting to make up for those losses.\n\nG. Many of the artefacts Barrett’s team recovered date from the beginning of\n\nthe Viking Age, the 700s through to the 900s CE. Trade networks connecting\n\nScandinavia with Europe and the Middle East were expanding around this time.\n\nAlthough we usually think of ships when we think of Scandinavian expansion,\n\nthese recent discoveries show that plenty of goods travelled on overland\n\nroutes, like the mountain passes of Oppland. And growing Norwegian towns,\n\nalong with export markets, would have created a booming demand for hides to\n\nfight off the cold, as well as antlers to make useful things like combs. Business\n\nmust have been good for hunters.\n\nH. Norway’s mountains are probably still hiding a lot of history – and prehistory\n\n– in remote ice patches. When Barrett’s team looked at the dates for their\n\nsample of 153 artefacts, they noticed a gap with almost no artefacts from\n\nabout 3,800 to 2,200 BCE. In fact, archaeological finds from that period are rare\n\nall over Norway. The researchers say that could be because many of those\n\nartefacts have already disintegrated or are still frozen in the ice. That means\n\narchaeologists could be extracting some of those artefacts from retreating ice\n\nin years to come.","options":[],"questions":[{"q":20,"context":"l site Organic materials such as animal skins and textiles are not discovered very often at archaeological sites. They have little protection against (20)....................... , which means that they decay relatively quickly. But this is not always the case. If temperatures are low enough, fragile artefacts can be preserved for thousands of years. A team of archaeologists hav","answerDisplay":"microorganisms","sourcePage":62,"evidence":"archaeological sites. This is because unless they’re protected from the microorganisms that cause decay, they tend not to last long. Extreme cold is one reliable way to keep artefacts relatively fresh for a few thousand years, but once thawed out, these materials experience degradation relatively swiftly.","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “l site Organic materials such as animal skins and textiles are not discovered very often at archaeological sites. They have little protection against (20)....................... , which means that they decay relatively quickly. But this is not always the...”. Passage cung cấp bằng chứng “archaeological sites. This is because unless they’re protected from the microorganisms that cause decay, they tend not to last long. Extreme cold is one reliable way to keep artefacts relatively fresh for a few thousand years, but once thawed out, these materials experience degradation relatively...”. Điểm quyết định là thông tin trong passage dẫn đến “microorganisms”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “microorganisms” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN TWO WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'microorganisms' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"microorganisms","correctText":"microorganisms","inputType":"text"},{"q":21,"context":"In the past, there were trade routes through these mountains and (21) .................... gathered there in the summer months to avoid being attacked by (22) ................... on lower ground. The people who used these mountains left things behind and it is those objects that are of interest","answerDisplay":"reindeer","sourcePage":63,"evidence":"area of south-central Norway that is home to some of the country’s highest mountains. Reindeer once congregated on these icy patches in the later summer months to escape biting insects, and from the late Stone Age**, hunters followed. In addition, trade routes threaded through the mountain","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “mountains in Oppland in Norway to recover artefacts revealed by shrinking ice cover. In the past, there were trade routes through these mountains and (21) .................... gathered there in the summer months to avoid being attacked by (22)...”. Passage cung cấp bằng chứng “area of south-central Norway that is home to some of the country’s highest mountains. Reindeer once congregated on these icy patches in the later summer months to escape biting insects, and from the late Stone Age**, hunters followed. In addition, trade routes threaded through the mountain”. Điểm quyết định là thông tin trong passage dẫn đến “reindeer”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “reindeer” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN TWO WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'reindeer' hoặc thông tin tương đương được xác nhận bởi evidence đã câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'biting insects' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"biting insects","correctText":"biting insects","inputType":"text"}],"sourceNote":""},{"id":12,"title":"Changes in Reading Habits","instruction":"CHOOSE FROM LIST A–H","sourcePages":"68–74","passage":"Look around on your next plane trip. The iPad is the new pacifier for babies and\n\ntoddlers. Younger school-aged children read stories on smartphones; older\n\nkids don’t read at all, but hunch over video games. Parents and other\n\npassengers read on tablets or skim a flotilla of email and news feeds.\n\nUnbeknown to most of us, an invisible, game-changing transformation links\n\neveryone in this picture: the neuronal circuit that underlies the brain’s ability to\n\nread is subtly, rapidly changing and this has implications for everyone from the\n\npre-reading toddler to the expert adult.\n\nAs work in neurosciences indicates, the acquisition of literacy necessitated a\n\nnew circuit in our species’ brain more than 6,000 years ago. That circuit\n\nevolved from a very simple mechanism for decoding basic information, like the\n\nnumber of goats in one’s herd, to the present, highly elaborated reading brain.\n\nMy research depicts how the present reading brain enables the development\n\nof some of our most important intellectual and affective processes: internalized\n\nknowledge, analogical reasoning, and inference; perspective-taking and\n\nempathy; critical analysis and the generation of insight. Research surfacing in\n\nmany parts of the world now cautions that each of these essential ‘deep\n\nreading’ processes may be under threat as we move into digital- based\n\nmodes of reading. This is not a simple, binary issue of print versus digital\n\nreading and technological innovation.\n\nAs MIT scholar Sherry Turkle has written, we do not err as a society when we\n\ninnovate but when we ignore what we disrupt or diminish while innovating. In\n\nthis hinge moment between print and digital cultures, society needs to\n\nconfront what is diminishing in the expert reading circuit, what our children and\n\nolder students are not developing, and what we can do about it. We know from\n\nresearch that the reading circuit is not given to human beings through a\n\ngenetic blueprint like vision or language; it needs an environment to develop.\n\nFurther, it will adapt to that environment’s requirements – from different writing\n\nsystems to the characteristics of whatever medium is used. If the dominant\n\nmedium advantages processes that are fast, multi-task oriented and\n\nwell-suited for large volumes of information, like the current digital medium, so\n\nwill the reading circuit.\n\nAs UCLA psychologist Patricia Greenfield writes, the result is that less attention\n\nand time will be allocated to slower, time-demanding deep reading processes.\n\nIncreasing reports from educators and from researchers in psychology and the\n\nhumanities bear this out.\n\nEnglish literature scholar and teacher Mark Edmundson describes how many\n\ncollege students actively avoid the classic literature of the 19th and 20th\n\ncenturies in favour of something simpler as they no longer have the patience\n\nto read longer, denser, more difficult texts. We should be less concerned with\n\nstudents’ ‘cognitive impatience’, however, than by what may underlie it: the\n\npotential inability of large numbers of students to read with a level of critical\n\nanalysis sufficient to comprehend the complexity of thought and argument\n\nfound in more demanding texts.\n\nMultiple studies show that digital screen use may be causing a variety of\n\ntroubling downstream effects on reading comprehension in older high school\n\nand college students. In Stavanger, Norway, psychologist Anne Mangen and\n\nher colleagues studied how high school students comprehend the same\n\nmaterial in different mediums. Mangen’s group asked subjects questions\n\nabout a short story whose plot had universal student appeal;half of the\n\nstudents read the story on a tablet, the other half in paperback.\n\nResults indicated that students who read on print were superior in their\n\ncomprehension to screen-reading peers, particularly in their ability to\n\nsequence detail and reconstruct the plot in chronological order. Ziming Liu\n\nfrom San Jose State University has conducted a series of studies which\n\nindicate that the ‘new norm’ in reading is skimming, involving word-spotting\n\nand browsing through the text. Many readers now use a pattern when reading\n\nin which they sample the first line and then word- spot through the rest of the\n\ntext. When the reading brain skims like this, it reduces time allocated to deep\n\nreading processes. In other words, we don’t have time to grasp complexity, to\n\nunderstand another’s feelings, to perceive beauty, and to create thoughts of\n\nthe reader’s own.\n\nThe possibility that critical analysis, empathy and other deep reading\n\nprocesses could become the unintended ‘collateral damage’ of our digital\n\nculture is not a straightforward binary issue about print versus digital reading.\n\nIt is about how we all have begun to read on various mediums and how that\n\nchanges not only what we read, but also the purposes for which we read. Nor is\n\nit only about the young. The subtle atrophy of critical analysis and empathy\n\naffects us all equally. It affects our ability to navigate a constant bombardment\n\nof information. It incentivizes a retreat to the most familiar stores of unchecked\n\ninformation, which require and receive no analysis, leaving us susceptible to\n\nfalse information and irrational ideas.\n\nThere’s an old rule in neuroscience that does not alter with age: use it or lose it.\n\nIt is a very hopeful principle when applied to critical thought in the reading\n\nbrain because it implies choice. The story of the changing reading brain is\n\nhardly finished. We possess both the science and the technology to identify\n\nand redress the changes in how we read before they become entrenched. If we\n\nwork to understand exactly what we will lose, alongside the extraordinary new\n\ncapacities that the digital world has brought us, there is as much reason for\n\nexcitement as caution.","options":[{"id":"A","text":"fast"},{"id":"B","text":"isolated"},{"id":"C","text":"emotional"},{"id":"D","text":"worrying"},{"id":"E","text":"many"},{"id":"F","text":"hard"},{"id":"G","text":"combined"},{"id":"H","text":"thorough"}],"questions":[{"q":18,"context":"D. does not match the views of the general public Studies on digital screen use There have been many studies on digital screen use, showing some (18) ..................... trends. Psychologist Anne Mangen gave high-school students a short story to read, half using digital and half using print mediums. Her team then used a question-and-answer technique to find out how (19)","answerDisplay":"D – worrying","sourcePage":68,"evidence":"everyone in this picture: the neuronal circuit that underlies the brain’s ability to read is subtly, rapidly changing and this has implications for everyone from the pre-reading toddler to the expert adult. As work in neurosciences indicates, the acquisition of literacy necessitated a","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “D. does not match the views of the general public Studies on digital screen use There have been many studies on digital screen use, showing some (18) ..................... trends. Psychologist Anne Mangen gave high-school students a short story to read, half...”. Passage cung cấp bằng chứng “everyone in this picture: the neuronal circuit that underlies the brain’s ability to read is subtly, rapidly changing and this has implications for everyone from the pre-reading toddler to the expert adult. As work in neurosciences indicates, the acquisition of literacy necessitated a”. Điểm quyết định là thông tin trong passage dẫn đến “worrying”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “worrying” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–H. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa của phương án phải khớp chính xác với evidence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'worrying' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"D","correctText":"worrying","inputType":"select"},{"q":19,"context":"Her team then used a question-and-answer technique to find out how (19) ..................... each group’s understanding of the plot was. The findings showed a clear pattern in the responses, with those who read screens finding the order of information (20) ....................... to recall. Stud","answerDisplay":"H – thorough","sourcePage":73,"evidence":"then used a question-and-answer technique to find out how (19) ..................... each group’s understanding of the plot was. The findings showed a clear pattern in the responses, with those who read screens finding the order of information (20) ....................... to recall. Studies by Ziming Liu show that students","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “l students a short story to read, half using digital and half using print mediums. Her team then used a question-and-answer technique to find out how (19) ..................... each group’s understanding of the plot was. The findings showed a clear pattern in...”. Passage cung cấp bằng chứng “then “B. isolated C. emotional D. worrying E. many”. Điểm quyết định là thông tin trong passage dẫn đến “emotional”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “emotional” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–H. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa của phương án phải khớp chính xác với evidence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'emotional' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"C","correctText":"emotional","inputType":"select"}],"sourceNote":""},{"id":13,"title":"Could Urban Engineers Learn From Dance?","instruction":"ONE WORD ONLY","sourcePages":"75–81","passage":"A. The way we travel around cities has a major impact on whether they are\n\nsustainable. Transportation is estimated to account for 30% of energy\n\nconsumption in most of the world’s most developed nations, so lowering the\n\nneed for energy-using vehicles is essential for decreasing the environmental\n\nimpact of mobility. But as more and more people move to cities, it is important\n\nto think about other kinds of sustainable travel too. The ways we travel affect\n\nour physical and mental health, our social lives, our access to work and culture,\n\nand the air we breathe. Engineers are tasked with changing how we travel\n\nround cities through urban design, but the engineering industry still works on\n\nthe assumptions that led to the creation of the energy-consuming transport\n\nsystems we have now: the emphasis placed solely on efficiency, speed, and\n\nquantitative data. We need radical changes, to make it healthier, more\n\nenjoyable, and less environmentally damaging to travel around cities.\n\nB. Dance might hold some of the answers. That is not to suggest everyone\n\nshould dance their way to work, however healthy and happy it might make us,\n\nbut rather that the techniques used by choreographers to experiment with and\n\ndesign movement in dance could provide engineers with tools to stimulate\n\nnew ideas in city-making. Richard Sennett, an influential urbanist and\n\nsociologist who has transformed ideas about the way cities are made, argues\n\nthat urban design has suffered from a separation between mind and body\n\nsince the introduction of the architectural blueprint.\n\nC. Whereas medieval builders improvised and adapted construction through\n\ntheir intimate knowledge of materials and personal experience of the\n\nconditions on a site, building designs are now conceived and stored in media\n\ntechnologies that detach the designer from the physical and social realities\n\nthey are creating. While the design practices created by these new\n\ntechnologies are essential for managing the technical complexity of the\n\nmodern city, they have the drawback of simplifying reality in the process.\n\nD. To illustrate, Sennett discusses the Peachtree Center in Atlanta, USA, a\n\ndevelopment typical of the modernist approach to urban planning prevalent in\n\nthe 1970s. Peachtree created a grid of streets and towers intended as a new\n\npedestrian-friendly downtown for Atlanta. According to Sennett, this failed\n\nbecause its designers had invested too much faith in computer-aided design\n\nto tell them how it would operate. They failed to take into account that\n\npurpose-built street cafes could not operate in the hot sun without the\n\nprotective awnings common in older buildings, and would need\n\nenergy-consuming air conditioning instead, or that its giant car park would\n\nfeel so unwelcoming that it would put people off getting out of their cars. What\n\nseems entirely predictable and controllable on screen has unexpected results\n\nwhen translated into reality.\n\nE. The same is true in transport engineering, which uses models to predict and\n\nshape the way people move through the city. Again, these models are\n\nnecessary, but they are built on specific world views in which certain forms of\n\nefficiency and safety are considered and other experiences of the city ignored.\n\nDesigns that seem logical in models appear counterintuitive in the actual\n\nexperience of their users. The guard rails that will be familiar to anyone who\n\nhas attempted to cross a British road, for example, were an engineering\n\nsolution to pedestrian safety based on models that prioritise the smooth flow of\n\ntraffic. On wide major roads, they often guide pedestrians to specific crossing\n\npoints and slow down their progress across the road by using staggered\n\naccess points to divide the crossing into two – one for each carriageway. In\n\ndoing so they make crossings feel longer, introducing psychological barriers\n\ngreatly impacting those that are the least mobile, and encouraging others to\n\nmake dangerous crossings to get around the guard rails. These barriers don’t\n\njust make it harder to cross the road: they divide communities and decrease\n\nopportunities for healthy transport. As a result, many are now being removed,\n\ncausing disruption, cost, and waste.\n\nF. If their designers had had the tools to think with their bodies – like dancers –\n\nand imagine how these barriers would feel, there might have been a better\n\nsolution. In order to bring about fundamental changes to the ways we use our\n\ncities, engineering will need to develop a richer understanding of why people\n\nmove in certain ways, and how this movement affects them. Choreography\n\nmay not seem an obvious choice for tackling this problem. Yet it shares with\n\nengineering the aim of designing patterns of movement within limitations of\n\nspace. It is an art form developed almost entirely by trying out ideas with the\n\nbody, and gaining instant feedback on how the results feel. Choreographers\n\nhave deep understanding of the psychological, aesthetic, and physical\n\nimplications of different ways of moving.\n\nG. Observing the choreographer Wayne McGregor, cognitive scientist David\n\nKirsh described how he ‘thinks with the body’. Kirsh argues that by using the\n\nbody to simulate outcomes, McGregor is able to imagine solutions that would\n\nnot be possible using purely abstract thought. This land of physical knowledge\n\nis valued in many areas of expertise, but currently has no place in formal\n\nengineering design processes. A suggested method for transport engineers is\n\nto improvise design solutions and get instant feedback about how they would\n\nwork from their own experience of them, or model designs at full scale in the\n\nway choreographers experiment with groups of dancers. Above all, perhaps,\n\nthey might learn to design for emotional as well as functional effects.","options":[],"questions":[{"q":7,"context":"reference to how transport has an impact on human lives Guard rails Guard rails were introduced on British roads to improve the (7) ..................... of pedestrians, while ensuring that the movement of (8) ...................... Is not disrupted. Pedestrians are led to access points, and encouraged to cross one work from their own expe","answerDisplay":"safety","sourcePage":77,"evidence":"necessary, but they are built on specific world views in which certain forms of efficiency and safety are considered and other experiences of the city ignored. Designs that seem logical in models appear counterintuitive in the actual experience of their users. The guard rails that will be familiar to anyone who","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “reference to how transport has an impact on human lives Guard rails Guard rails were introduced on Briti ld some of the answers. That is not to suggest everyone should dance their way to work, however healthy and happy it might make us, 185”. Điểm quyết định là thông tin trong passage dẫn đến “healthy”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần tính từ; “healthy” phù hợp với cấu trúc câu và yêu cầu ONE WORD ONLY. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'healthy' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"healthy","correctText":"healthy","inputType":"text"}],"sourceNote":""},{"id":14,"title":"Should We Try to Bring Extinct Species Back to Life?","instruction":"NO MORE THAN TWO WORDS","sourcePages":"82–87","passage":"A. The passenger pigeon was a legendary species. Flying in vast numbers\n\nacross North America, with potentially many millions within a single flock, their\n\nmigration was once one of nature’s great spectacles. Sadly, the passenger\n\npigeon’s existence came to an end on 1 September 1914, when the last living\n\nspecimen died at Cincinnati Zoo. Geneticist Ben Novak is lead researcher on an\n\nambitious project which now aims to bring the bird back to life through a\n\nprocess known as ‘de-extinction’. The basic premise involves using cloning\n\ntechnology to turn the DNA of extinct animals into a fertilised embryo, which is\n\ncarried by the nearest relative still in existence – in this case, the abundant\n\nband-tailed pigeon – before being born as a living, breathing animal.\n\nPassenger pigeons are one of the pioneering species in this field, but they are\n\nfar from the only ones on which this cutting-edge technology is being trialled.\n\nB. In Australia, the thylacine, more commonly known as the Tasmanian tiger, is\n\nanother extinct creature which genetic scientists are striving to bring back to\n\nlife. There is no carnivore now in Tasmania that fills the niche which thylacines\n\nonce occupied,’ explains Michael Archer of the University of New South Wales.\n\nHe points out that in the decades since the thylacine went extinct, there has\n\nbeen a spread in a ‘dangerously debilitating’ facial tumour syndrome which\n\nthreatens the existence of the Tasmanian devils, the island’s other notorious\n\nresident. Thylacines would have prevented this spread because they would\n\nhave killed significant numbers of Tasmanian devils. ‘If that contagious cancer\n\nhad popped up previously, it would have burned out in whatever region it\n\nstarted. The return of thylacines to Tasmania could help to ensure that devils\n\nare never again subjected to risks of this kind.’\n\nC. If extinct species can be brought back to life, can humanity begin to correct\n\nthe damage it has caused to the natural world over the past few millennia? The\n\nidea of de-extinction is that we can reverse this process, bringing species that\n\nno longer exist back to life,’ says Beth Shapiro of University of California Santa\n\nCruz’s Genomics Institute. ‘I don’t think that we can do this. There is no way to\n\nbring back something that is 100 percent identical to a species that went\n\nextinct a long time ago.’ A more practical approach for long-extinct species is\n\nto take the DNA of existing species as a template, ready for the insertion of\n\nstrands of extinct animal DNA to create something new; a hybrid, based on the\n\nliving species, but which looks and/or acts like the animal which died out.\n\nD. This complicated process and questionable outcome begs the question:\n\nwhat is the actual point of this technology? ‘For us, the goal has always been\n\nreplacing the extinct species with a suitable replacement,’ explains Novak.\n\n‘When it comes to breeding, band-tailed pigeons scatter and make maybe\n\none or two nests per hectare, whereas passenger pigeons were very social and\n\nwould make 10,000 or more nests in one hectare.’ Since the disappearance of\n\nthis key species, ecosystems in the eastern US have suffered, as the lack of\n\ndisturbance caused by thousands of passenger pigeons wrecking trees and\n\nbranches means there has been minimal need for regrowth. This has left\n\nforests stagnant and therefore unwelcoming to the plants and animals which\n\nevolved to help regenerate the forest after a disturbance. According to Novak,\n\na hybridised band-tailed pigeon, with the added nesting habits of a passenger\n\npigeon, could, in theory, re-establish that forest disturbance, thereby creating\n\na habitat necessary for a great many other native species to thrive.\n\nE. Another popular candidate for this technology is the woolly mammoth.\n\nGeorge Church, professor at Harvard Medical School and leader of the Woolly\n\nMammoth Revival Project, has been focusing on cold resistance, the main way\n\nin which the extinct woolly mammoth and its nearest living relative, the Asian\n\nelephant, differ. By pinpointing which genetic traits made it possible for\n\nmammoths to survive the icy climate of the tundra, the project’s goal is to\n\nreturn mammoths, or a mammoth- like species, to the area.\n\n‘My highest priority would be preserving the endangered Asian elephant,’ says\n\nChurch, ‘expanding their range to the huge ecosystem of the tundra.\n\nNecessary adaptations would include smaller ears, thicker hair, and extra\n\ninsulating fat, all for the purpose of reducing heat loss in the tundra, and all\n\ntraits found in the now extinct woolly mammoth.’ This repopulation of the\n\ntundra and boreal forests of Eurasia and North America with large mammals\n\ncould also be a useful factor in reducing carbon emissions – elephants punch\n\nholes through snow and knock down trees, which encourages grass growth.\n\nThis grass growth would reduce temperatures, and mitigate emissions from\n\nmelting permafrost.\n\nF. While the prospect of bringing extinct animals back to life might capture\n\nimaginations, it is, of course, far easier to try to save an existing species which\n\nis merely threatened with extinction. ‘Many of the technologies that people\n\nhave in mind when they think about de-extinction can be used as a form of\n\n‘‘genetic rescue”,’ explains Shapiro. She prefers to focus the debate on how this\n\nemerging technology could be used to fully understand why various species\n\nwent extinct in the first place, and therefore how we could use it to make\n\ngenetic modifications which could prevent mass extinctions in the future. ‘I\n\nwould also say there’s an incredible moral hazard to not do anything at all,’ she\n\ncontinues. ‘We know that what we are doing today is not enough, and we have\n\nto be willing to take some calculated and measured risks.’","options":[],"questions":[{"q":18,"context":"point at which a particular species became extinct The woolly mammoth revival project Professor George Church and his team are trying to identify the (18) .......................which enabled mammoths to live in the tundra. The findings could help preserve the mammoth’s close relative, the endangered Asian elephant. According to the Church, introducing Asian elephants to the tu","answerDisplay":"genetic traits","sourcePage":84,"evidence":"in which the extinct woolly mammoth and its nearest living relative, the Asian elephant, differ. By pinpointing which genetic traits made it possible for mammoths to survive the icy climate of the tundra, the project’s goal is to return mammoths, or a mammoth- like species, to the area.","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “point at which a particular species became extinct The woolly mammoth reviv and mitigate emissions from","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “ra with mammoths or Asian elephant/mammoth hybrids would also have an impact on the environment, which could help to reduce temperatures and decrease (22) ................... 23. Reintroducing an extinct species to its original habitat could improve the...”. Passage cung cấp bằng chứng “tundra and boreal forests of Eurasia and North America with large mammals could also be a useful factor in reducing carbon emissions – elephants punch holes through snow and knock down trees, which encourages grass growth. This grass growth would reduce temperatures, and mitigate emissions from”. Điểm quyết định là thông tin trong passage dẫn đến “carbon emissions”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “carbon emissions” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN TWO WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'carbon emissions' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"carbon emissions","correctText":"carbon emissions","inputType":"text"}],"sourceNote":""},{"id":15,"title":"Having a Laugh","instruction":"CHOOSE FROM LIST A–H","sourcePages":"88–94","passage":"Humans start developing a sense of humour as early as six weeks old, when\n\nbabies begin to laugh and smile in response to stimuli. Laughter is universal\n\nacross all human cultures and even exists in some form in rats, chimps, and\n\nbonobos. Like other human emotions and expressions, laughter and humour\n\nprovide psychological scientists with rich resources for studying human\n\npsychology, ranging from the development of language to the neuroscience of\n\nsocial perception. Theories focusing on the evolution of laughter point to it as\n\nan important adaptation for social communication.\n\nTake, for example, the recorded laughter in TV comedy shows. Back in 1950, US\n\nsound engineer Charley Douglass hated dealing with the unpredictable\n\nlaughter of live audiences, so started recording his own ‘laugh tracks’. These\n\nwere intended to help people at home feel like they were in a social situation,\n\nsuch as a crowded theatre. Douglass even recorded various types of laughter,\n\nas well as mixtures of laughter from men, women, and children. In doing so, he\n\npicked up on a quality of laughter that is now interesting researchers: a simple\n\n‘haha’ communicates a remarkable amount of socially relevant information. In\n\none study conducted in 2016, samples of laughter from pairs of\n\nEnglish-speaking students were recorded at the University of California, Santa\n\nCruz. A team made up of more than 30 psychological scientists,\n\nanthropologists, and biologists then played these recordings to listeners from\n\n24 diverse societies, from indigenous tribes in New Guinea to city-dwellers in\n\nIndia and Europe.\n\nParticipants were asked whether they thought the people laughing were\n\nfriends or strangers. On average, the results were remarkably consistent:\n\nworldwide, people’s guesses were correct approximately 60% of the time.\n\nResearchers have also found that different types of laughter serve as codes to\n\ncomplex human social hierarchies. A team led by Christopher Oveis from the\n\nUniversity of California, San Diego, found that high-status individuals had\n\ndifferent laughs from low-status individuals, and that strangers’ judgements of\n\nan individual’s social status were influenced by the dominant or submissive\n\nquality of their laughter.\n\nIn their study, 48 male college students were randomly assigned to groups of\n\nfour, with each group composed of two low-status members, who had just\n\njoined their college fraternity group, and two high-status members, older\n\nstudents who had been active in the fraternity for at least two years.\n\nLaughter was recorded as each student took a turn at being teased by the\n\nothers, involving the use of mildly insulting nicknames. Analysis revealed that,\n\nas expected, high-status individuals produced more dominant laughs and\n\nfewer submissive laughs relative to the low-status individuals. Meanwhile,\n\nlow-status individuals were more likely to change their laughter based on their\n\nposition of power; that is, the newcomers produced more dominant laughs\n\nwhen they were in the ‘powerful’ role of teasers. Dominant laughter was higher\n\nin pitch, louder, and more variable in tone than submissive laughter.\n\nA random group of volunteers then listened to an equal number of dominant\n\nand submissive laughs from both the high- and low-status individuals, and\n\nwere asked to estimate the social status of the laughter. In line with predictions,\n\nlaughers producing dominant laughs were perceived to be significantly higher\n\nin status than laughers producing submissive laughs. ‘This was particularly\n\ntrue for low-status individuals, who were rated as significantly higher in status\n\nwhen displaying a dominant versus submissive laugh,’ Oveis and colleagues\n\nnote. ‘Thus, by strategically displaying more dominant laughter when the\n\ncontext allows, low-status individuals may achieve higher status in the eyes of\n\nothers.’ However, high-status individuals were rated as high-status whether\n\nthey produced their natural dominant laugh or tried to do a submissive one.\n\nAnother study, conducted by David Cheng and Lu Wang of Australian National\n\nUniversity, was based on the hypothesis that humour might provide a respite\n\nfrom tedious situations in the workplace. This ‘mental break’ might facilitate\n\nthe replenishment of mental resources. To test this theory, the researchers\n\nrecruited 74 business students, ostensibly for an experiment on perception.\n\nFirst, the students performed a tedious task in which they had to cross out\n\nevery instance of the letter ‘e’ over two pages of text. The students then were\n\nrandomly assigned to watch a video clip eliciting either humour, contentment,\n\nor neutral feelings. Some watched a clip of the BBC comedy Mr. Bean, others a\n\nrelaxing scene with dolphins swimming in the ocean, and others a factual\n\nvideo about the management profession.\n\nThe students then completed a task requiring persistence in which they were\n\nasked to guess the potential performance of employees based on provided\n\nprofiles, and were told that making 10 correct assessments in a row would lead\n\nto a win. However, the software was programmed such that it was nearly\n\nimpossible to achieve 10 consecutive correct answers. Participants were\n\nallowed to quit the task at any point. Students who had watched the Mr. Bean\n\nvideo ended up spending significantly more time working on the task, making\n\ntwice as many predictions as the other two groups.\n\nCheng and Wang then replicated these results in a second study, during which\n\nthey had participants complete long multiplication questions by hand. Again,\n\nparticipants who watched the humorous video spent significantly more time\n\nworking on this tedious task and completed more questions correctly than did\n\nthe students in either of the other groups.\n\n‘Although humour has been found to help relieve stress and facilitate social\n\nrelationships, the traditional view of task performance implies that individuals\n\nshould avoid things such as humour that may distract them from the\n\naccomplishment of task goals,’ Cheng and Wang conclude. ‘We suggest that\n\nhumour is not only enjoyable but more importantly, energising.’","options":[{"id":"A","text":"laughter"},{"id":"B","text":"relaxing"},{"id":"C","text":"boring"},{"id":"D","text":"anxiety"},{"id":"E","text":"stimulating"},{"id":"F","text":"emotion"},{"id":"G","text":"enjoyment"},{"id":"H","text":"amusing"}],"questions":[{"q":32,"context":"Australian National University, randomly chosen groups of participants were shown one of three videos, each designed to generate a different kind of (32) .................... When all participants were then given a deliberately frustrating task to do, it was found that those who had watched the (33) .....................video persisted with the task for longer and tried harder","answerDisplay":"F – emotion","sourcePage":88,"evidence":"across all human cultures and even exists in some form in rats, chimps, and bonobos. Like other human emotions and expressions, laughter and humour provide psychological scientists with rich resources for studying human psychology, ranging from the development of language to the neuroscience of","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “Australian National University, randomly chosen groups of participants were shown one of three videos, each designed to generate a different kind of (32) .................... When all participants were then given a deliberately frustrating task to do, it was...”. Passage cung cấp bằng chứng “across all human cultures and even exists in some form in rats, chimps, and bonobos. Like other human emotions and expressions, laughter and humour provide psychological scientists with rich resources for studying human psychology, ranging from the development of language to the neuroscience of”. Điểm quyết định là thông tin trong passage dẫn đến “emotion”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “emotion” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–H. Đây là dạn ction":"NO MORE THAN TWO WORDS","sourcePages":"95–100","passage":"A. Travelling around Thailand in the 1990s, William Janssen was impressed with\n\nthe basic rooftop solar heating systems that were on many homes, where\n\nenergy from the sun was absorbed by a plate and then used to heat water for\n\ndomestic use. Two decades later Janssen developed that basic idea he saw in\n\nSoutheast Asia into a portable device that uses the power from the sun to\n\npurify water.\n\nB. The Desolenator operates as a mobile desalination unit that can take water\n\nfrom different places, such as the sea, rivers, boreholes and rain, and purify it\n\nfor human consumption. It is particularly valuable in regions where natural\n\ngroundwater reserves have been polluted, or where seawater is the only water\n\nsource available. Janssen saw that there was a need for a sustainable way to\n\nclean water in both the developing and the developed countries when he\n\nmoved to the United Arab Emirates and saw large-scale water processing. ‘1\n\nwas confronted with the enormous carbon footprint that the Gulf nations have\n\nbecause of all of the desalination that they do,’ he says.\n\nC. The Desolenator can produce 15 litres of drinking water per day, enough to\n\nsustain a family for cooking and drinking. Its main selling point is that unlike\n\nstandard desalination techniques, it doesn’t require a generated power supply:\n\njust sunlight. It measures 120 cm by 90 cm, and is easy to transport, thanks to\n\nits two wheels. Water enters through a pipe, and flows as a thin film between a\n\nsheet of double glazing and the surface of a solar panel, where it is heated by\n\nthe sun. The warm water flows into a small boiler (heated by a solar-powered\n\nbattery) where it is converted to steam. When the steam cools, it becomes\n\ndistilled water. The device has a very simple filter to trap particles, and this can\n\neasily be shaken to remove them. There are two tubes for liquid coming out:\n\none for the waste – salt from seawater, fluoride, etc. – and another for the\n\ndistilled water. The performance of the unit is shown on an LCD screen and\n\ntransmitted to the company which provides servicing when necessary.\n\nD. A recent analysis found that at least two-thirds of the world’s population\n\nlives with severe water scarcity for at least a month every year. Janssen says\n\nthat by 2030 half of the world’s population will be living with water stress –\n\nwhere the demand exceeds the supply over a certain period of time. ‘It is really\n\nimportant that a sustainable solution is brought to the market that is able to\n\nhelp these people,’ he says. Many countries ‘don’t have the money for\n\ndesalination plants, which are very expensive to build.\n\nThey don’t have the money to operate them, they are very maintenance\n\nintensive, and they don’t have the money to buy the diesel to run the\n\ndesalination plants, so it is a really bad situation.’\n\nE. The device is aimed at a wide variety of users – from homeowners in the\n\ndeveloping world who do not have a constant supply of water to people living\n\noff the grid in rural parts of the US. The first commercial versions of the\n\nDesolenator are expected to be in operation in India early next year, after field\n\ntests are carried out. The market for the self-sufficient devices in developing\n\ncountries is twofold – those who cannot afford the money for the device\n\noutright and pay through microfinance, and middle- income homes that can\n\nlease their own equipment. ‘People in India don’t pay for a fridge outright; they\n\npay for it over six months. They would put the Desolenator on their roof and\n\nhook it up to their municipal supply and they would get very reliable drinking\n\nwater on a daily basis,’ Janssen says. In the developed world, it is aimed at\n\nniche markets where tap water is unavailable – for camping, on boats, or for\n\nthe military, for instance.\n\nF. Prices will vary according to where it is bought. In the developing world, the\n\nprice will depend on what deal aid organisations can negotiate. In developed\n\ncountries, it is likely to come in at $1,000 (£685) a unit, said Janssen. ‘We are a\n\nventure with a social mission. We are aware that the product we have\n\nenvisioned is mainly finding application in the developing world and\n\nhumanitarian sector and that this is the way we will proceed. We do realise,\n\nthough, that to be a viable company there is a bottom line to keep in mind,’ he\n\nsays.\n\nG. The company itself is based at Imperial College London, although Janssen,\n\nits chief executive, still lives in the UAE. It has raised £340,000 in funding so far.\n\nWithin two years, he says, the company aims to be selling 1,000 units a month,\n\nmainly in the humanitarian field. They are expected to be sold in areas such as\n\nAustralia, northern Chile, Peru, Texas and California.","options":[],"questions":[{"q":21,"context":"The device can be used in different locations, as it has (21) ...................... Water is fed into a pipe, and a (22) .................. of water flows over a solar panel. The water then enters a boiler, where it turns into steam. Any particles in the water are","answerDisplay":"two wheels","sourcePage":96,"evidence":"just sunlight. It measures 120 cm by 90 cm, and is easy to transport, thanks to its two wheels. Water enters through a pipe, and flows as a thin film between a sheet of double glazing and the surface of a solar panel, where it is heated by the sun. The warm water flows into a small boiler (heated by a solar-powered","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “ow the Desolenator works The energy required to operate the Desolenator comes from sunlight. The device can be used in different locations, as it has (21) ...................... Water is fed into a pipe, and a (22) .................. of water flows over a...”. Passage cung cấp bằng chứng “just sunlight. It measures owledge about\n\nthe history and prehistory of storytelling, despite the fact that we know this\n\ngenre is an incredibly ancient one,’ he says. That hasn’t stopped\n\nanthropologists, folklorists* and other academics devising theories to explain\n\nthe importance of fairy tales in human society. Now Tehrani has found a way to\n\ntest these ideas, borrowing a technique from evolutionary biologists.\n\nTo work out the evolutionary history, development and relationships among\n\ngroups of organisms, biologists compare the characteristics of living species in\n\na process called ‘phylogenetic analysis’. Tehrani has used the same approach\n\nto compare related versions of fairy tales to discover how they have evolved\n\nand which elements have survived longest.\n\nTehrani’s analysis focused on Little Red Riding Hood in its many forms, which\n\ninclude another Western fairy tale known as The Wolf and the Kids. Checking\n\nfor variants of these two tales and similar stories from Africa, East Asia and\n\nother regions, he ended up with 58 stories recorded from oral traditions.\n\nOnce his phylogenetic analysis had established that they were indeed related,\n\nhe used the same methods to explore how they have developed and altered\n\nover time. First he tested some assumptions about which aspects of the story\n\nalter least as it evolves, indicating their importance. Folklorists believe that\n\nwhat happens\n\nin a story is more central to the story than the characters in it – that visiting a\n\nrelative, only to be met by a scary animal in disguise, is ‘Folklorists: those who\n\nstudy traditional stories more fundamental than whether the visitor is a little\n\ngirl or three siblings, or the animal is a tiger instead of a wolf. However, Tehrani\n\nfound no significant difference in the rate of evolution of incidents compared\n\nwith that of characters. ‘Certain episodes are very stable because they are\n\ncrucial to the story, but there are lots of other details that can evolve quite\n\nfreely,’ he says. Neither did his analysis support the theory that the central\n\nsection of a story is the most conserved part. He found no significant difference\n\nin the flexibility of events there compared with the beginning or the end.\n\nBut the really big surprise came when he looked at the cautionary elements of\n\nthe story. ‘Studies on hunter-gatherer folk tales suggest that these narratives\n\ninclude really important information about the environment and the possible\n\ndangers that may be faced there – stuff that’s relevant to survival,’ he says. Yet\n\nin his analysis such elements were just as flexible as seemingly trivial details.\n\nWhat, then, is important enough to be reproduced from generation to\n\ngeneration? The answer, it would appear, is fear – blood-thirsty and gruesome\n\naspects of the story, such as the eating of the grandmother by the wolf, turned\n\nout to be the best preserved of all. Why are these details retained by\n\ngenerations of storytellers, when other features are not? Tehrani has an idea:\n\n‘In an oral context, a story won’t survive because of one great teller.\n\nIt also needs to be interesting when it’s told by someone who’s not necessarily\n\na great storyteller.’ Maybe being swallowed whole by a wolf, then cut out of its\n\nstomach alive is so gripping that it helps the story remain popular, no matter\n\nhow badly it’s told. Jack Zipes at the University of Minnesota, Minneapolis, is\n\nunconvinced by Tehrani’s views on fairy tales. ‘Even if they’re gruesome, they\n\nwon’t stick unless they matter,’ he says. He believes the perennial theme of\n\nwomen as victims in stories like Little Red Riding Hood explains why they\n\ncontinue to feel relevant. But Tehrani points out that although this is often the\n\ncase in Western versions, it is not always true elsewhere. In Chinese and\n\nJapanese versions, often known as The Tiger Grandmother, the villain is a\n\nwoman, and in both Iran and Nigeria, the victim is a boy. Mathias Clasen at\n\nAarhus University in Denmark isn’t surprised by Tehrani’s findings. ‘Habits and\n\nmorals change, but the things that scare us, and the fact that we seek out\n\nentertainment that’s designed to scare us – those are constant,’ he says.\n\nClasen believes that scary stories teach us what it feels like to be afraid without\n\nhaving to experience real danger, and so build up resistance to negative\n\nemotions.","options":[{"id":"A","text":"ending"},{"id":"B","text":"events"},{"id":"C","text":"warning"},{"id":"D","text":"links"},{"id":"E","text":"records"},{"id":"F","text":"variations"},{"id":"G","text":"horror"},{"id":"H","text":"people"},{"id":"I","text":"plot"}],"questions":[{"q":32,"context":"Phylogenetic Analysis of Little Red Riding Hood Tehrani used techniques from evolutionary biology to find out if (32) ................... existed among 58 stories from around the world. He also wanted to know which aspects of the stories had fewest (33) ...................., as he believed these aspects would be the most important ones. Cont","answerDisplay":"D – links","sourcePage":105,"evidence":"C. warning D. links E. records F. variations","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “PRACTICE TEST 11 Phylogenetic Analysis of Little Red Riding Hood Tehrani used techniques from evolutionary biology to find out if (32) ................... existed among 58 stories from around the world. He also wanted to know which aspects of the stories had...”. Passage cung cấp bằng chứng “C. warning D. links E. records F. variations”. Điểm quyết định là thông tin trong passage dẫn đến “links”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “links” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–I. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa g sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'warning' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"C","correctText":"warning","inputType":"select"},{"q":36,"context":"The aspect that he found most important in a story’s survival was (36) ................... A. ending B. events C. warning D. links E. records F. variations G. horror H. people I. plot 37. What method did Jamie Tehrani use to test his ideas about fairy tales? A. He compared oral","answerDisplay":"G – horror","sourcePage":105,"evidence":"F. variations G. horror 222","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “wunimportant. The aspect that he found most important in a story’s survival was (36) ................... A. ending B. events C. warning D. links E. records F. variations G. horror PRACTICE TEST 11 H. people I. plot 37. What method did Jamie Tehrani use to...”. Passage cung cấp bằng chứng “F. variations G. horror 222”. Điểm quyết định là thông tin trong passage dẫn đến “horror”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “horror” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–I. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa của phương án phải khớp chính xác với evidence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'horror' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"G","correctText":"horror","inputType":"select"}],"sourceNote":""},{"id":18,"title":"Environmental Practices Of Big Businesses","instruction":"CHOOSE FROM LIST A–I","sourcePages":"107–112","passage":"The environmental practices of big businesses are shaped by a fundamental\n\nfact that for many of us offends our sense of justice. Depending on the\n\ncircumstances, a business may maximize the amount of money it makes, at\n\nleast in the short term, by damaging the environment and hurting people. That\n\nis still the case today for fishermen in an unmanaged fishery without quotas,\n\nand for international logging companies with short-term leases on tropical\n\nrainforest land in places with corrupt officials and unsophisticated landowners.\n\nWhen government regulation is effective, and when the public is\n\nenvironmentally aware, environmentally clean big businesses may\n\nout-compete dirty ones, but the reverse is likely to be true if government\n\nregulation is ineffective and if the public doesn’t care. It is easy for the rest of us\n\nto blame a business for helping itself by hurting other people. But blaming\n\nalone is unlikely to produce change. It ignores the fact that businesses are not\n\ncharities but profit-making companies, and that publicly owned companies\n\nwith shareholders are under obligation to those shareholders to maximize\n\nprofits, provided that they do so by legal means.\n\nUS laws make a company’s directors legally liable for something termed\n\n‘breach of fiduciary responsibility’ if they knowingly manage a company in a\n\nway that reduces profits. The car manufacturer Henry Ford was in fact\n\nsuccessfully sued by shareholders in 1919 for raising the minimum wage of his\n\nworkers to $5 per day: the courts declared that, while Ford’s humanitarian\n\nsentiments about his employees were nice, his business existed to make profits\n\nfor its stockholders. Our blaming of businesses also ignores the ultimate\n\nresponsibility of the public for creating the conditions that let a business profit\n\nthrough destructive environmental policies.\n\nIn the long run, it is the public, either directly or through its politicians, that has\n\nthe power to make such destructive policies unprofitable and illegal, and to\n\nmake sustainable environmental policies profitable. The public can do that by\n\nsuing businesses for harming them, as happened after the Exxon Valdez\n\ndisaster, in which over 40,000 m3 of oil were spilled off the coast of Alaska.\n\nThe public may also make their opinion felt by preferring to buy sustainably\n\nharvested products; by making employees of companies with poor track\n\nrecords feel ashamed of their company and complain to their own\n\nmanagement; by preferring their governments to award valuable contracts to\n\nbusinesses with a good environmental track record; and by pressing their\n\ngovernments to pass and enforce laws and regulations requiring good\n\nenvironmental practices.\n\nIn turn, big businesses can exert powerful pressure on any suppliers that might\n\nignore public or government pressure. For instance, after the US public became\n\nconcerned about the spread of a disease known as BSE, which was transmitted\n\nto humans through infected meat, the US government’s Food and Drug\n\nAdministration introduced rules demanding that the meat industry abandon\n\npractices associated with the risk of the disease spreading. But for five years\n\nthe meat packers refused to follow these, claiming that they would be too\n\nexpensive to obey.\n\nHowever, when a major fast-food company then made the same demands\n\nafter customer purchases of its hamburgers plummeted, the meat industry\n\ncompiled within weeks. The public’s task is therefore to identify which links in\n\nthe supply chain are sensitive to public pressure: for instance, fast-food chains\n\nor jewellery stores, but not meat packers or gold miners.\n\nSome readers may be disappointed or outraged that I place the ultimate\n\nresponsibility for business practices harming the public on the public itself. I\n\nalso believe that the public must accept the necessity for higher prices for\n\nproducts to cover the added costs, if any, of sound environmental practices.\n\nMy views may seem to ignore the belief that businesses should act in\n\naccordance with moral principles even if this leads to a reduction in their\n\nprofits.\n\nBut I think we have to recognize that, throughout human history, in all politically\n\ncomplex human societies, government regulation has arisen precisely\n\nbecause it was found that not only did moral principles need to be made\n\nexplicit, they also needed to be enforced.\n\nTo me, the conclusion that the public has the ultimate responsibility for the\n\nbehaviour of even the biggest businesses is empowering and hopeful, rather\n\nthan disappointing. My conclusion is not a moralistic one about who is right or\n\nwrong, admirable or selfish, a good guy or a bad guy. In the past, businesses\n\nhave changed when the public came to expect and require different behaviour,\n\nto reward businesses for behaviour that the public wanted, and to make things\n\ndifficult for businesses practising behaviours that the public didn’t want. I\n\npredict that in the future, just as in the past, changes in public attitudes will be\n\nessential for changes in businesses’ environmental practices.\n\nBig businesses\n\nMany big businesses today are prepared to harm people and the environment\n\nin order to make money, and they appear to have no (27) …………………. Lack of\n\n(28) ………………. by governments and lack of public (29)……………….. can lead to\n\nenvironmental problems such as (30) …………….. or the destruction of\n\n(31)……………\n\nBut I think we have to recognize that, throughout human history, in all politically\n\ncomplex human societies, government regulation has arisen precisely\n\nbecause it was found that not only did moral principles need to be made\n\nexplicit, they also needed to be enforced.\n\nTo me, the conclusion that the public has the ultimate respon
