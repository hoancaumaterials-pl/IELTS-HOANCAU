important.” ‘An unusual comparison of the performance of teleworkers with a closely matched control group of non-teleworkers found that not only was product higher, but also that absenteeism and error rates were lower.\n\nTwo other areas where SUSTEL has added to the economic impact knowledge base is its effect on absenteeism and space utilisation. In the case of absenteeism, over 60 per cent of those surveyed stated that telework had enabled them to work when they were prevented from reaching a work location (usually through illness or transport problems). Around half the cases also identified substantial reductions in space requirements - to the point where one organisation had completely done away with a central office. Changes. in non-commuting trvel on weekends: home-bases If Ai jan) 4,,f.g.4¢ workers, which includes a substantial population of\n\nredicting people who are not telecommuters, spend more time shopping out of the home than traditional workers.\n\nJD Haletime telecommuting could reduce carbon emissions by over S1 million metric tons a year—the equivalent of taking all of New York's commuters off the road. Additional carbon footprint savings will come from reduced: office energy, roadway repairs, urban heating, office construction, business travel, paper usage\n\nA ac 6a a:\n\n(as electronic documents replace paper). Although energy utilization will continue to grow as we expand our industry and improve our standard of living, efficient use of energy will always be of prime importance. By telecommuting to work instead of using more conventional methods, there is a great potential to save energy. The three major areas where energy can be conserved are: Vehicle-related materials and resources; Highway-related materials and resources; and work-related materials and resources.\n\nA tremendous amount of energy is required to produce transportation equipment such as automobiles, buses, trains and jet aircraft. If telecommuting is promoted, there will be less use of this equipment and less energy will be required for production, maintenance and repair of this equipment. Fuel resources and gases needed to operate this equipment will be reduced, as well the building and repair of highways and maintenance requires a large consumption of ‘energy, not only in the operation of the highway construction and repair equipment, but also in the manufacture and transportation of the required materials. An increase in the percentage of people telecommuting to work will decrease the need for expanded highways and associated road maintenance. The first two areas related to getting to work.\n\nSocially, the SUSTEL research found that most survey respondents felt that teleworking gave them a better quality of life and work-life balance. Many also reported health benefits. A significant number also stated that they were using local services more and becoming more involved in their local communities. The loss of teamwork and team spirit within teleworking populations was tackled through ideas such as Oracle's 'FUNetional’ offices. Designed to increase ‘communication and interaction when people are at the office, they are bright, and focused around a central café to stimulate ideas and face-to-face\n\ncontact,\n\n(G The finding that many teleworkers report both longer working hours and better\n\nquality of life is paradoxical. More time working is usually associated with increased stress, domestic tension and other factors that reduce quality of life, ‘One possible explanation is that, for many individuals, their increased working hours will be less than the time they have saved in commuting. Hence, they still have more time available for family and other activities. For some, the stress\n\nassociated with commuting (especially for long distances) may be less than that arising from additional working time. Perhaps most significantly, teleworking can in effect create time through opportunities for multi-tasking or greater control of activities, As one survey respondent noted, \"Although the amount of time has not changed it has made the weekends freer, as domestic activities can be fitted in during lunchtimes or early morning.\"\n\nJH] When you work in an office or a cubicle and something goes wrong with any hardware or software you have the option of calling in the IT man. In fact, all of the equipment that you use at the office is supported by technical staff. That means regular updates and wu maintenance for various and sundry office tools like a=ae land-line phones, computers, internet connections, laptops, cell phones, printers, and other office equipment is all up to you. When you work from home, you'll surely encounter technical problems and when you do, where do you get the support and help you need? If your computer hard drive crashed today, would you have the funds to replace it?\n\nARS AGT LNT NRA\n\nFAL Siti MMS PSE [RAM] RBRRAMS RMA:\n\nwww.iyue\n\n<~ Questions 28:","options":[{"id":"A","text":"pollution"},{"id":"B","text":"internet energy"},{"id":"C","text":"paper usage"},{"id":"D","text":"construction and maintenance"},{"id":"E","text":"materials"},{"id":"F","text":"shopping"},{"id":"G","text":"productivity"},{"id":"H","text":"fuels and gases"},{"id":"I","text":"electronically"},{"id":"J","text":"IT"},{"id":"K","text":"equipment"},{"id":"L","text":"company"},{"id":"M","text":"work-related"},{"id":"N","text":"geography"}],"questions":[{"q":28,"context":"Survey identified that telecommuters spend more time OM. eeseee-28...s0ssethan those traditional workers on changes in non-commuting travel on weekends. It also is beneficial to environment as it reduces the.........29.........im the atmosphere from decreased street repairs, city heating, oF e","answerDisplay":"F – shopping","sourcePage":199,"evidence":"people who are not telecommuters, spend more time shopping out of the home than traditional workers. JD Haletime telecommuting could reduce carbon emissions by over S1 million metric tons d the creative energy necessary to ‘generate new knowledge in that field, It takes a considerable amount of time and regular exposure to a lange number of cases to become an expert,\n\nA, 40 individual enters a field of study as a novice. The novice needs to eam the guiding\n\n“principles and rules of a given task in order to perform that task, Concurrently, the novice needs to be exposed to specific cases, or instances, that test the boundaries of such hicurist (EVIE. Generally, a novice will find a mentor to guide her through the process. A\n\nly simple example would be someone\n\ncaring to play chess, The novice chess player\n\nsecks a mentor to teach her the object of the\n\ngame, the number of spaces, the names of the\n\npieces, the function of each piece, how each\n\npiece is moved, and the necessary conditions for winning or losing the gamie\n\nBB!2:ime, and with much practice, the novice begins to recognize patems of behavior within ccases and, thus, becomes a journeyman. With more practice and exposure to increasingly complex cases, the journeyman finds patterns not only within cases but also between cases. More importantly, the journeyman learns that these patterns often repeat themselves over time, The journeyman still maintains regular contact with a mentor to solve specifi problems and leam more complex strategies. Returning to the example of the chess player, the individual begins to learn patterns of opening moves, offensive and defensive game-playing strategies, and patterns of victory and defeat,\n\n‘When a jourmeyman starts to make and test hypotheses (m.882M. (87%) about future behavior based on past experiences, she begins the next transition. Once she creatively generates knowledge. rather than simply matching\n\n‘superficial patterns, she becomes an expert.\n\nSantis Soot [2 od Eo poe my alarreg cles redicting ‘as a guide—she becomes responsible for\n\nher own knowledge. In the chess example, once @ joumeyman begins competing against\n\nexperts lay a role. DFEMICLIMG Fer example, the timing of when the onset of puberty ‘occurs is largely the results of heredity, but environmental factors such as nutrition can also have an effect.\n\n(C__ The From the carliest moments of life, the interaction of heredity and the environment works to shape who children are and who they will become, While the genetic instructions a child inherits from his parents may set out a road map for development, the environment can impact how these directions are expressed, shaped or event silenced. The complex interaction of nature and nurture does not\n\njust occur at certain moments or at certain periods of time; itis persistent and lifelong.\n\nThe shared environment (also called common environment) refers to environmental influences that have the effect of making siblings more similar to one another. Shared environmental influences can include shared family experiences, shared peer groups, and sharing the same school and community. In general, there has not been strong evidence for shared environmental effects on many behaviors, particularly those measured in adults. Possible reasons for this are discussed. Shared environmental effects are evident in children and adolescents, but these effects generally decrease across the life span. New developments in behavior genetic methods have made it possible to specify shared environments of importance and to tease apart familial and nonfimilial sources of shared environmental influence. It may also refer to all of siblings of a family, but the rate of influence is less than 10 per cent.\n\nThe importance of non-shared environment lay hidden within quantitative genetic studies since they began nearly a century ago. Quantitative genetic methods, such as twin and adoption methods, were designed to tease apart nature and nurture in the Molecule of Life order to explain family resemblance. For nearly all complex phenotypes, it has emerged that the answer to the question of. L genetic reasons. However, the best available mE \\e\\\"\" YW evidence for the importance of environmental influence comes from this\n\nsame quantitative genetic research because genetic influence never explains all of the variance for complex phenotypes, and the remaining variance must be\n\nascribed to environmental influences. Non-shared [ diy xy Sone\n\nenvironment, it may refer to part of siblings of a family, the rate of influence to children is 40 % to 50%.\n\nredicting\n\nYet it took many decades for the full meaning of these findings to emerge. If genetics explains why siblings growing up in the same family are similar, but the environment is important, then it must be the case that the salient environmental effects do not make siblings similar, That is, they are not shared by children growing up in the same family—they must be ‘non-shared’. This implication about non-shared environmental import lay fallow in the field of quantitative genetics because the field’s attention was then firmly on the nature-nurture debate. ‘Nurture’ in the nature-nurture debate was implicitly taken to mean shared\n\nenvironment because from Freud onwards, theories of socialization had assumed that children’s environments are doled out on a family-by-family basis. In contrast, the point of non-shared environment is that environments are doled out on 2 child-by-child basis. Note that the phrase ‘non-shared environment’ is shorthand for component of phenotypic variance—it refers to ‘effects’ rather than ‘events’, as discussed later. Research in recent years suggested that the impact from parents will be easy to be interrupted by the influence from the children of the same age -That also showed that variations of knowledge that children get from other culture is increasing. A number of interests between, whatever, fathers and mothers or parents and their children are conflicting.\n\npredicting FARMER MUNK S 7 SR BHP ETE A\n\nBecause siblings living in the same home share some but not all of the poten reel for its diversity and complex interrelationships. And a great deal of that diversity lives up in the canopy~an estimated 70-90 per cent of life in the rainforest exists in the trees; one in ten of all vascular plants are canopy dwellers; and about 20-25 per cent of all invertebrates CE FEHE 3)9)) are thought to be unique to the canopy.\n\n(The first Briton to actually get into the canopy may have been Sir Francis Drake who, in 1573, gained his first glimpse of the Pacific Ocean from a tall tree in Darien, Panama. However, the first serious effort to reach and study the canopy didn't begin until 1929. The Oxford University Expedition to British Guiana, led by Major RWG Hingston, still ended up requiring the help of locals when it came to building an observation |!\n\nA Zc) mE a:\n\nplatform, It was a successful expedition all the same, despite the colony's acting governor getting stuck high up on a winched seat during a visit In terms of canopy access, the French have proved themselves to be excellent innovators, taking things further with the development of ‘lighter-than-air platforms'~balloons and related equipment, to you and me. Francis Halle; from the Laboratoire de Botanique Tropicale at Montpellier University took to a balloon in the mid-1980s in order to approach the canopy from above. His work in French Guiana was inspired by the use in Gabon of a tethered helium (VC) balloon by Marcel and Annette Hladick. Halle went one further by using a small, purpose-built airship~a cigar-shaped balloon with propellers to aid manoeuvrability ChLshtf). \"We suddenly had a mobile system that could move around the treetops; there was no other means of doing this,” says Mitchell.\n\nDD From this, two balloon-dependent features have developed: the radeau or raft, and the luge or sledge. The raft is a ‘floating’ platform, employed by French academics Dany Cleyet-Marrel and Laurent Pyot and is essentially an island in the treetops. Made of kevlar mesh netting and edged with inflated neoprene tubes, it rests on top of the canopy, allowing sampling (mostly of plants and insects) to take place at the edges of the platform, and can stay in position for several days.\n\nThe luge, on the other hand, is an\n\ninflated hexagon(#e*(AHE) similar to\n\na traditional balloon basket but with a\n\nhole in the bottom covered with Kevlar\n\nmesh (4824). Such techniques aren't\n\nwithout their problems, however. \"Balloons can cover larger areas, especially for collection purposes, but they are extremely expensive- Jibe raft alone cost 122,000 [euro] (86,000 [pounds sterling]) in 2001], nut very effective because you can only reach the tops of the trees, and are highly dependent on the weather, \" says Dr Wilfried Morawetz, director of systematic botany at the University of Leipzig. \"Balloons can usually only be used in the early morning for two to four hours, Last time, we could only fly three times during a whole week.\" Given these factors, it comes as no surprise that operations involving these balloons numbered just six between 1986 and 2001.\n\nipredicting FR REAL MCS A] BB AS SE SP CE A AT\n\nFE, The next major innovation came from Alan Smith, who worked at the Smithsonian Tropical Research Institute in Panama. Smith had the idea of\n\nA ce es i:\n\nusing a static crane to get into the treetops. Un-tethered balloons may allow widely distributed sites to be sampled, but cranes allow scientists to study an area of at least a hectare from soil to canopy throughout the year, year after year. \"Cranes beat any other access mode. They are cheap, reliable and fast. In two minutes I can reach any point in our forest, which is essential for comparative measurements across species,” says Professor Christian Korner of the University of Basel. Korner is using, a static crane in a unique carbon dioxide-enrichment experiment in Switzerland, in an attempt ] to discover how forests might respond to the global increase in atmospheric carbon dioxide (see Swiss canopy-crane carbon experiment, right). For reasons of convenience, cranes are__ generally situated close to cities or a research centre. Leipzig University has a crane not far from the town, the location allowing scientists to study the effect of city pollutants on forests. In order to increase the amount of canopy a crane can access, some have been mounted on short rail tracks. In 1995, Dr Wilfried Morawetz was the first to use this technique, installing a crane ‘on 150 metres of track in Venezuelan rainforest. \"In my opinion, cranes should be the core of canopy research in the future,\" he says.\n\nIt appears that the rest of the scientific community has now come around to Mitchell's way of thinking, \"I think most scientists thought him mad to consider such a complex field station at first,” says internationally respected ‘canopist’ Meg Lowman, the executive director of the Marie Selby Botanical Gardens. \"However, we've all come to realise that a combination of methods, a long-term approach to ecological studies and a collaborative approach are the absolute best ways to advance canopy science. A permanent canopy field station would allow that to happen.\" With a dedicated group of canopy scientists working together and a wide range of tools available for them to get into the treetops, we're now finally on our way towards a true understanding of the least-known terrestrial habitat.\n\nYe ate uiunaxe sunauUH Ht HOME, ——= =","options":[],"questions":[{"q":19,"context":"‘Though early attempt succeeded in building an observation platform yet the help from the 19 . Was imperative ; Further innovators made by the French who built a platform with equipments by using 20 Later, the ‘floating’ platform of 21. wis serving as an island in the treetops. Then finally, there came the next major b","answerDisplay":"locals","sourcePage":211,"evidence":"Expedition to British Guiana, led by Major RWG Hingston, still ended up requiring the help of locals when it came to building atic crane","inputType":"text"}],"sourceNote":""},{"id":42,"title":"Finches on Islands","instruction":"NO MORE THAN TWO WORDS","sourcePages":"215–219","passage":"A, Today, the quest continues. On Daphne Major—one of the most desolate of the\n\n“* Galipagos Islands, an uninhabited volcanic cone where cacti (fil AJ) and shrubs seldom grow higher than a researcher's knee—Peter and Rosemary Grant have spent more than three decades watching Darwin's finches (n.#) respond to the challenges of storms, drought and competition for food. Biologists at Princeton University, the Grants know and recognize many of the individual birds ‘on the island and can trace the birds’ lineages back through time. They have ‘witnessed Darwin's principle in action again and again, over many generations of finches,\n\nBB The Grants’ most dramatic insights have come from watching the evolving (adj. HLA) batt (n. SPH; MR) of the medium ground finch. The plumage of this sparrow-sized bird ranges from dull brown to jet black. At first glance, it may not seem particularly striking, - but among scientists who study evolutionary biology, the medium ground finch is a superstar. Its bill is a middling example in the array of shapes and sizes found among Galipagos finches: heftier than that of the small ground finch, which specializes in eating small, soft seeds, but petite compared to that of the large ‘ground finch, an expert at cracking and devouring big, hard seeds.\n\nWhen the Grants began their study in the\n\neases 1970s, only two species of finch lived on Daphne Major, the medium ground finch and the cactus finch. The island is so small ‘that the researchers were able to count and abet\n\ncatalogue every bird. When a severe drought\n\nhit in 1977, the birds soon devoured (v.?F\n\n‘ff, SVK) the last of the small, easily eaten aa omens,\n\nseeds. Smaller members of the medium\n\n‘ground finch population, lacking the bill strength to crack lange seeds, died out.\n\nD Bill and body size are inherited traits, and the next generation had a high proportion of big-billed individuals. The Grants had documented natural selection at work—the same process that, over many millennia, directed the evolution of the Gakipagos’ 14 unique finch species, all descended from a common ancestor\n\nao ooo\n\nthat reached the islands a few million years ago.\n\nEight years later, heavy rains brought by an El Nino transformed the normally meager vegetation on Daphne Major. Vines and other plants that in most years struggle for survival suddenly {lourisived (v.82 %), choking out the plants that provide large seeds to the finches. Small seeds came to dominate the food supply, and big birds with big bills died out at a higher rate than smaller ones. “Natural selection is observable,’ Rosemary Grant says. ‘It happens when the environment changes. When local conditions reverse themselves, so does the direction of\n\nadaptation,”\n\nRecently, the Grants yviinessed (n. Hifi, Sie) another form of natural selection acting on the medium ground finch; competition from bigger, stronger cousins. In 1982, a third finch, the large ground finch, came to live on Daphne Major. The stout bills of these birds resemble the business end of a crescent wrench. Their arrival was the first such colonization recorded on the Galipagos in nearly a century of scientific observation. “We realized,’ Peter Grant says, ‘we had a very ‘unusual and potentially important event to follow.’ For 20 years, the large ground finch coexisted with the medium ground finch, which shared the supply of large seeds with its bigger-billed relative. Then, in 2002 and 2003, another drought struck. None of the birds nested that year, and many died out. Medium ground finches with large bills, crowded out of feeding areas by the more powerful large ground finches, were hit particularly hard.\n\nWhen wetter weather returned in 2004, and the finches nested again, the new generation of the medium ground finch was dominated by smaller birds with smaller bills, able to survive on smaller seeds. This situation, says Peter Grant, marked the first time that biologists have been able to follow the complete process of an evolutionary change due to competition between species and the strongest response t0 natural selection that he had seen in 33 years of tracking Galipagos finches.\n\nOn the inhabited island of Santa Cruz, just south of Daphne Major, Andrew Hendry of McGill University and Jeffrey Podos of the University of Massachusetts at Amherst have discovered a new, man-made twist in finch evolution. Their study focused on birds living near the Academy Bay research station, on the fringe of the town of Puerto Ayora. The human population of the area has been growing fast—from 900 people in 1974 to 9,582 in 2001. “Today Puerto Ayora is full of hotels and mai tai bars,’ Hendry says. “People have taken\n\nee ee Ee OO:\n\nthis extremely arid place and tried to tum it into a Caribbean resort (n, JE PRE Sy.”\n\nAcademy Bay records dating back to the early 1960s show that medium ground finches captured there had either small or large bills. Very few of the birds had mid-size bills. The finches appeared to be in the early stages of a new adaptive radiation: If the trend continued, the medium ground finch on Santa Cruz could split into ovo distinct subspecies, specializing in different types of seeds. But in the late 1960s and early 70s, medium ground finches with medium-sized bills began to thrive at Academy Bay along with small and large-billed birds. The booming, human population had introduced new food sources, including exotic plants and bird feeding stations stocked with rice, Billsize, once critical to the finches survival, no longer made any difference. ‘Now an intermediate bill can do fine,”\n\nHendry says.\n\nAta control site distant from Puerto Ayora, and relatively untouched by humans, the medium ground finch population remains split between large- and small-billed birds. On undisturbed parts of Santa Cruz, there is no ecological niche for a middling medium ground finch, and the birds continue to diversify. In town, though there are still many finches, once-distinct populations are merging.\n\nThe finches of Santa Cruz demonstrate a subtle process in which human meddling can stop evolution in its tracks, ending the formation of new species. In a time when global biodiversity continues its downhill stide, Darwin's finches have yet another unexpected lesson to teach, “If we hope to regain some of the diversity that’s already been lost,’ Hendry says, “we need to protect not just creatures, but also the processes that drive the origin of new specie:\n\nby El Nino s the main food resource\n\n| AIRE RR EAT |\n\nBRB. Questions 5-8","options":[],"questions":[{"q":5,"context":"On the remote island of Santa Cruz, Andrew Hendry and Jeffrey Podos conducted a study on reversal 5... due to human activity. In the early 1960s medium ground finches were found to have a larger or smaller beak. But in the late 1960s and early 70s, finches with 6. flourished. The study speculates that it is due to the growing","answerDisplay":"adaptive radiation","sourcePage":217,"evidence":"this extremely arid place and tried to tum it into a Caribbean resort (n, JE PRE Sy.” Academy Bay records dating back to the early 1960s show that medium ground","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “On the remote island of Santa Cruz, Andrew Hendry and Jeffrey Podos conducted a study on reversal 5... due to human activity. In the early 1960s medium ground finches were found to have a larger or smaller beak. But in the late 1960s and early 70s, finches...”. Passage cung cấp bằng chứng “this extremely arid place and tried to tum it into a Caribbean resort (n, JE PRE Sy.” Academy Bay records dating back to the early 1960s show that medium ground”. Điểm quyết định là thông tin trong passage dẫn đến “adaptive radiation”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không al policies and practices vary widely between countries and even within countries. Some political parties and groups search for ways to solve the problem of diverse communities and their integration in schools and society. They see few positive consequences for the host society and worry that diversity threaten the identity of the host society Consequently,they promote unfortunate educational policies that will make the “problem\"disappear.If students retain their culture and language, they are viewed as less capable of identifying with the mainstream culture and learning the mainstream language of the society.\n\nBj The challenge for educators and policy-makers is to shape the evolution of national identity in such a way that the rights of all citizens (including school children) are respected, and the cultural, linguistic, and economic resources of the nation are maximized. To waste the resources of the nation by discouraging children from developing their mother tongues is quite simply unintelligent from the point of view of national self-interest. A first step in Providing an appropriate education for culturally and linguistically diverse children is to examine what the existing research says about the role of children’s mother tongues in their educational development.\n\nC Im facts the research is very clear. When children continue to develop their abilities in two or more languages throughout their primary school. they gain a deeper understanding of language and how to use it effectively. They have more practice in processing language, especially when they develop literacy in both. More than 150 research studies conducted during the past 35 years strongly support what Goethe, the famous cighteenth-century German philosopher, once said: that the person who knows only one language does not truly know that language. Research suggests that bilingual children may also develop more flexibility in their thinking as a result of processing information through two different languages.\n\nsc Pe Ps a: | 6\n\n[D The level of development of children’s mother tongue is a\n\nstrong predictor of their second language development. I iia Ae Children who come to school with a solid foundation in SUFettetine Minnesotan\n\ntheir mother tongue develop stronger literacy abilities in the school language, When parents and other caregivers (e.g. grandparents) are able to spend time with their children and tell stories or discuss issues with them in a way that develops their mother tongue, children come to school well-prepared to learn the school language and succeed educationally, Children's knowledge and skills transfer across languages from the mother tongue to the school language. Transfer across languages can be two-way: both languages nurture each other when the educational environment permits children access to both languages.\n\nSome educators and parents are suspicious of mother tongue-based teaching programs because they worry that they take time away from the majority language. For example, in a bilingual program where $0% of the time is spent teaching through children’s home language and 50% through the majority language, surely children's won't progress as far in the letter? One of the most strongly established findings of educational rescarch, however, is that well-implemented bilingual programs can promote literacy and subject- matter knowledge in a minority language without any negative effects on children’s development in the majority language. Within Europe, the Foyer program in Belgium, which develops children’s speaking and literacy abilities in three languages (their mother tongue, Dutch and French), most clearly illustrates the benefits of bilingual and trilingual education (see Cummins, 2000),\n\nIt is easy to understand how this happens. When children\n\nare learning through a minority language. they are Aaa herd leaming concepts and intellectual skills too. Pupils who icting know how to tell the time in their mother tongue\n\nunderstand the concept of telling time. In order to tell time in the majority language they do not need to re-learn the concept. Similarly, at more advanced stages, there is transfer across languages in other skills such as knowing how to distinguish the main idea from the supporting details of a written passage or story, and distinguishing fact from opinion, Studies of secondary school pupils are providing interesting findings in this area, and it would be worth extending this research.\n\nMany people marvel at how quickly bilingual children seem to \"pick up\" conversational skills in the majority language at school (although it takes much longer for them to catch up to native speakers in academic language skills). However, educators are often much less aware of how quickly children can lose their ability to use their mother tongue, even in the home context, The extent and rapidity of language loss will vary according to the concentration of families from\n\nparticular linguistic group in the neighborhood, Where the mother tongue is used extensively in the community, then language loss among young children will be less. However, where language communities are not concentrated in particular neighborhoods, children ean lose their ability to communicate in their mother tongue within 2-3 years of starting school, They may retain receptive skills in the language but they will use the majority language in speaking with their peers and siblings and in responding to their parents, By the time children become adolescents, the linguistic division between parents and children has become an emotional chasm. Pupils frequently become alienated from the cultures of both home and school with predictable results.\n\na Bc BE: Ec a | 6h\n\nB they go on to do much better throughout their time at school C they can read stories about their cultural background D they develop stronger relationships with their family than with their peers-\n\n30 Why are some people suspicious about mother tongue-based teaching programmes?\n\nA They worry that children will be slow to lear to read in either language\n\nB They think that children will confuse words in the two languages.\n\nC They believe that the programmes will make children less interested in their lessons D They fear that the programmes will use up valuable time in the school day.\n\nBW Ouestions 31-\n\n‘Complete the following summary of the paragraphs of Reading Passage using no more than Two words from the Reading Passage for each answer, Write your answers in boxes 31-35 on your answer sheet.\n\nREN\n\nBilingual children\n\nIt was often recorded that Bilingual Children acquire the 31.......... to converse in the majority language remarkable quickly. The fact that the mother tongue can disappear at a similar 32. is less well understood. This phenomenon depends to a certain extent, on the proposition of people with the same linguistic background that have settled in a particular 33 If this is limited, children are likely to lose the active use of their mother tongue. And thus no longer employ it even with 34 + + although they may still understand it. I follows that teenager children in these circumstances experience a sense of","options":[{"id":"A","text":"Teachers"},{"id":"B","text":"school"},{"id":"C","text":"dislocation"},{"id":"D","text":"rate"},{"id":"E","text":"time"},{"id":"F","text":"family"},{"id":"G","text":"communication"},{"id":"H","text":"type"},{"id":"I","text":"ability"},{"id":"J","text":"area"}],"questions":[{"q":31,"context":"REN weibo.com/ielts9 Bilingual children It was often recorded that Bilingual Children acquire the 31 .......... to converse in the majority language remarkable quickly. The fact that the mother tongue can disappear at a similar 32 . is less well understood. This phenomenon depends to a certain extent, on the proposition of peo","answerDisplay":"I – ability","sourcePage":221,"evidence":"Many people marvel at how quickly bilingual children seem to \"pick up\ for guarding individuals and groups from the peril of “group-think’, Decisions made without thorough canvassing, surveying, weighing, examining and reexamining relevant information and options would be suboptimal and often disastrous. One foreign affairs decision made by a well-known US political leader in the 1960s is typically held us as an example of the perils of inadequate thought, whereas his successful handlitig of a later crisis is cited as an example of the advantages of careful deliberation. However, examination of these historical events by Peter Suedfield, a psychologist at the University of British Columbia, and Roderick Kramer, a psychologist at the Stanford Graduate School of Business, found little difference in the two decision-making processes; both crises required and received complex consideration by the political administration, but later only the second one was deemed to be the effective.\n\nC In general, however, organizational and politcal science offer little evidence that complex decisions fare better than simpler cones, In fact, a growing body of work suggests that in many situations simple ‘snap’ decisions will be routinely superior to ‘more complex ones -an idea that gained widespread public appeal 5 with Malcolm Gladwell’s best-selling book Blink (2005). nm Lr59098\n\nAc Ee cs a | hl\n\nDD Anatticle by Ap Dijksterhuis of the University of Amsterdam and his colleagues, Making the Right Choice: the Deliberation-without-attention Effect\". runs very much in the spirit of Gladwell’s influential text. It” s core argument is that to be effective, conscious (deliberative) decision making requires cognitive resources. Because increasingly complex decisions place increasing strain ON 4...» those resources, the quality of our decisions declines as their \"\"*\"\" complexity increases. In short, complex decisions overrun our fatoyeed cognitive powers. On the other hand, unconscious decision making gear (what the author refer to as ‘deliberation without attention’) requires _S&a¥70I8 no cognitive resources, so task complexity does not Effectiveness. The\n\nseemingly counterintuitive conclusion is that although conscious i\n\nthought enhances simple decisions, the opposite holds true for more complex decisions.\n\nE_ Diikst6rhuis reports four Simple but elegant studies supporting this argument. In ‘one, participants assessed the quality of four hypothetical cars by considering either four attributes (a simple task) or 12 attributes (a complex task), Among participants who considered four attributes, those who were allowed to engage in undistracted deliberative thought did better at discriminating between the best and worst cars. Those who were distracted and thus unable to deliberate had to rely on their unconscious thinking and did less well. The opposite pattem emerged when people considered 12 criteria. In this case, conscious deliberation led to inferior discrimination and poor decisions.\n\nFF In other study, Dijksterhuis surveyed people shopping for clothes (‘simple\" products) and furniture (“complex” products). Compared with those who said they had deliberated long and hard, shoppers who bought with little conscious deliberation felt less happy with their simple clothing purchase but happier with the complex furniture purchases, Deliberation without attention actually produced better results as the decisions became more complex.\n\nG From there, however, the researchers take a big leap. They write:There is no reason to assume that the deliberation-without-attention effect does not generalize to other types of choices - political, managerial or otherwise. In such cases, it should benefit the individual to think consciously about simple matters and to delegate thinking about more complicated matters to the unconscious.\n\n1 Tihs radical inference contradicts standard political and managerial theory but doubtless comforts those in politics and management who always find the simple solution to the complex problem an attractive proposition. Indeed, one suspects many of our political leaders already embrace this wisdom.\n\n[Stil it is there, in the realms of society and its governance, that the more\n\nproblematic implications of deliberation without attention begin to surface, Variables that can be neatly circumscribed in decisions about shopping lose clarity in a world of group dynamics, social interaction, history and polities, Two pertinent questions arise, First, what counts as a complex decision? And second, what counts as a good outcome?\n\nAs social psychologist Kurt Lewin (1890 - 1947) noted, a “good” decision that nobody respects is actually bad, His classic studies of decision making showed that participating in deliberative processes makes people more likely to abide by the results. The issue here is that when political decision makers make mistakes, it is their politics, oF the relation between their polities and our own, rather than psychology which is at fault.\n\nGladwell's book and Dijksterhuis’s paper are invaluable in pointing out the ions of the conventional wisdom that decision quality rises with decision-making complexity. But this work still tempts us to believe that decision making is simply a matter of psychology, rather than also a question of polities, ideology and group membership. Avoiding social considerations in a search for ‘general appeal rather than toward it,\n\nLA, ORHALA: HF Mapp, WAH) SAAR AM UF AH\n\nAMAA, FRAT Noma |.—— Questions 32-.\n\n‘Complete the summary using the list of words A- I below. Write the correct letter, A—I, in boxes 32—35 on your answer sheet.\n\nDijksterhuis’s shopping study and its conclusions Using clothing and furniture as examples of different types of purchases,\n\neran Dijksterhuis questioned shoppers on their satisfaction with what they {Phone had bought. People who spent 32___time buying simple clothing qurere:\n\nitems were more satisfied than those who had not. However, when til buying furniture, shopp p and promote the sustainable use of alternative transport systems and intermediate means of transportation (IMTs) that complement the linkages of poor people with road networks and other socio-economic infrastructures to improve their livelihoods.\n\nBB On the other hand, the development of all weathered roads (only 30 percent of rural population have access to this so far) and motorable bridges are very costly for a country with a small and stagnant economy. In addition these interventions are not always a Dredicting favourable in all geographical contexts environmentally, @¥ Miwimibecomietss socially and economically. More than 60 percent of the network is concentrated in the lowland areas of the country. Although there are a number of altemative ways by which transportation and mobility needs of rural communities in the hills can be addressed, a lack of clear government focus and policies, lack of fiscal and economic incentives, lack of adequate technical knowledge and manufacturing capacities have led to underdevelopment of this alternative transport sub-sector including the provision of IMTS\n\n2aleBe eB\n\niS\n\nC One of the major causes of poverty is isolation. Improving the access and mobility\n\nmM {so\n\nA Ec: c ) —aa ff\n\nof the isolated poor paves the way for access to markets, services and opportunities. By improving transport poorer people are able to access markets where they can buy oF sell goods for income, and make better use of essential services such as health and education. No proper roads or vehicles mean women and children are forced to spend many hours each day attending to their most basic needs, such as collecting water and firewood. This valuable time could be used to tend crops, care for the family, study or develop small business ideas to generate much needed income.\n\nRoad building\n\nWithout roads, rural communities are extremely restricted, Collecting water and firewood, and going to local markets is a huge task, therefore it is understandable that the construction of roads is a major priority for many rural communities. Practical Action are helping to improve rural access/transport infrastructures through the construction and rehabilitation of short rural roads, small bridges, culverts and other transport related functions. The aim is to use methods that encourage community driven development. This means villagers can improve their own lives through better access to markets, health care, education and other economic and social opportunities, as well as bringing improved services and supplies to the now-accessible villages.\n\nDriving forward new ideas\n\nPractical Action and the communities we work with are constantly crafting and\n\n~ honing new ideas to help poor people. Cycle trailers have a practical business use\n\ntoo, helping people carry their goods, such as\n\nvegetables and charcoal, to markets for sale, Not\n\nonly that, but those on the poverty-line can earn\n\ndecent income by making, maintaining and\n\noperating bicycle taxis. With Practical Action’s\n\nknow-how, Sri Lankan communities have been\n\nable to start a bus service and maintain the roads along which it travels. The impact\n\nhas been remarkable. This service has put an end to rural people's social isolation.\n\nQuick and affordable, it gives them a reliable way to travel to the nearest town; and\n\nnow their children can get an education, making it far more likely they'll find a path\n\nout of poverty. Practical Action is also an active member of many national and\n\nregional networks through which exchange of knowledge and advocating based on\n\naction research are carried out and one conspicuous example is the Lanka Onganic Agriculture Movement.\n\nsky-scraping transport system\n\nFor people who live in remote, mountainous areas, getting food to market in order to cam enough money to survive is a scrious issue. The hills are so steep that travelling down them is dangerous. A porter can help but they are expensive, and it ‘would still take hours or even a day. The journey can take so long that their goods\n\na a so\n\n‘start to perish and become worth less and less. Practical Action have developed an ingenious solution called an aerial ropeway. It can either operate by gravitation force or with the use of extemal power. The ropeway consists of two trolleys rolling over support tracks connected to a control cable in the middle which moves in a traditional flywheel system. The trolley at the top is loaded with goods and can take up to 120kg. This is pulled down to the station at the bottom, either by the force of gravity or by external power. The other trolley at the bottom is therefore pulled upwards automatically. The external power can be produced by a micro hydro system if access to an electricity grid is not an option.\n\narr people on board nr eer mee ees ar oer Practical Action asicred a two-wheeled iron trailer that can be attached (via a 16\n\nhitch behind the seat) to a bicycle and be used to carry heavy loads (up to around 200kgs) of food, water or even passengers. People can now carry three times as much as before and still pedal the bicycle. The cycle trailers are used for transporting goods by local producers, as ambulances, as mobile | shops, and even as mobile libraries. They are made in small village workshops from iron tubing, which is cut, bent, welded and drilled to make the frame and wheels. Modifications are also carried out to the trailers in these workshops at the request of the buyers. The two-wheeled ‘ambulance’ is made from moulded metal, with standard rubber-tyred wheels, The \"bed\" section can be padded with cushions to make the patient comfortable, while the “seat” section allows a family member to attend to patient during transit. A dedicated bicycle is needed to pull the ambulance trailer, so that other community members do not need to go without the bicycles they depend on in their daily lives. A joining mechanism allows for easy removal and attachment. In response to user comments, a cover has been designed that can be added to give protection to the patient and attendant in poor weather, Made of treated cotton, the cover is durable and waterproof\n\nBeBeeeBeBe Bees ess eeBsk\n\nBSA: huty://practicalaction.org/\n\nle\n\nFy 3\n\nfl\n\nEYES Complete the following summary of the paragraphs of Reading JASEB- Passage, using mo more than two words from the Reading Passage for\n\n‘sywmean. \"each answer. Write your answers in boxes 9-13on your answer sheet, Semen\n\nERAMOMER, TLA—MATSRGLEMSROEER, tome |\n\nBesides normal transport task, changes are also implemented to the\n\ntrailers in these workshops at the request of the buyers when it was used\n\nwheels and drive by another bicycle. When put with....10...... in the\n\ntwo-wheeled ‘ambulance’, the patient can stay comfortable and which\n\nanother..... 11......can sit on caring for patient in transport journey. In\n\norder to dismantle or attach other equipments, a assembling... is designed. Later, as user’s suggest,.....13......has also been added to give\n\na protection to the patient.","options":[],"questions":[{"q":9,"context":"e paragraphs of Reading JASEB- Passage, using mo more than two words from the Reading Passage for ‘sywmean. \"each answer. Write your answers in boxes 9-13on your answer sheet, Semen ERAMOMER, TLA—MATSRGLEMSROEER, tome | Besides normal transport task, changes are also implemented to the trailers in these workshops at the request of the buyers when it was used on medical emergenc","answerDisplay":"mobile shops","sourcePage":231,"evidence":"goods by local producers, as ambulances, as mobile | shops, and even as mobile libraries. They are made in small village workshops from iron tubing, which is cut, bent, welded and drilled to make the frame and wheels. Modifications are","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “e paragraphs of Reading JASEB- Passage, using mo more than two words from the Reading Pass an be added to give protection to the patient and attendant in poor weather, Made of treated cotton, the cover is durable and waterproof”. Điểm quyết định là thông tin trong passage dẫn đến “cover”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “cover” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN TWO WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'cover' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"cover","correctText":"cover","inputType":"text"}],"sourceNote":""},{"id":46,"title":"How Should Reading Be Taught?","instruction":"CHOOSE FROM LIST A–G","sourcePages":"233–236","passage":"By Keith Rayner an Barbara R Foorman\n\nA, Leaming to speak is automatic for almost all children, but learning to read requires elaborate instruction and conscious effort, Well aware of the difficulties, educators have given a great deal of thought to how they can best help children learn to read. No single method has triumphed. Indeed, heated arguments about the most appropriate form of reading instruction continue to polarise the teaching community.\n\nBB Three general approaches have been tried. In one, called whole-word instruction, children learn by rote how to recognise at a glance a vocabulary of 50 to 100 words, Then they gradually acquire other words, often through seeing them used over and over again in the context of a story.\n\n‘Speakers of most languages lear the relationship between letters and the sounds associated with them (phonemes). That is, children are taught how to use their knowledge of the alphabet to sound out words. This procedure constitutes a second approach to teaching reading - phonics.\n\nMany schools have adopted a different approach: the whole-language method, The strategy here relies on the child's experience with language. For example, students are offered engaging books and are encouraged to guess the words that they do not know by considering the context of the sentence or by looking for clues in the storyline and illustrations, rather than trying to sound them out.\n\nMany teachers adopted the whole-language approach because of its intuitive appeal, Making reading fun promises to keep children motivated, and learning to read depends more on what the student does than on what the teacher does. The presumed benefits of whole-language instruction — and the contrast to the perceived dullness of phonics - led to its growing acceptance across America during the 1990s, and a movement away from phonics.\n\nC_ However, many linguists and psychologists objected strongly to the abandonment of phonies in American schools. Why was this so? In short, because research had clearly demonstrated that understanding how letters related to the component sounds in words is critically important in reading. This conclusion rests, in part, on knowledge of how experienced readers make sense of words on a page. Advocates of whole-language instruction have argued forcefully that people often\n\nA ic a: ic a: iam\n\nderive meanings directly from print without ever determining the sound of the word, Some psychologists today accept this view, but most believe that reading is typically a process of rapidly sounding out words mentally, Compelling evidence for this comes from experiments which show that subjects often confuse homophones (words that sound the same, such as Jrose] and ‘rowsS), This supports the idea that readers convert strings of letters to sounds.\n\n]D 1 order to evaluate different approaches to teaching reading, a:\n\nnumber of experiments have been carried out, firstly with college students, then with school pupils. Investigators trained English-speaking college students to read using unfamiliar symbols such as Arabic letters (the phonics approach), while another group learned entire words associated with certain strings of Arabic letters (whole-word). Then both groups were required to read a new set of words constructed from the original characters. In general, readers who were taught the rules of phonics could read many more new words than those trained with a whole-word procedure, Classroom studies comparing phonics with either whole-word or whole-language instruction are also quite illuminating. One particularly persuasive study compared two programmes used in 20 first-grade classrooms. Half the students were offered traditional reading instruction, which included the use of phonics drills and applications, The other half were taught using an individualised method that drew from their experiences with language; these children produced their own booklets of stories and developed sets of words to be recognised (common components of the whole-language approach). This study found that the first group scored higher at year’s end on tests of reading and comprehension,\n\nJE, Hfresearchers are so convinced about the need for phonics instruction, why does ~ the debate continue? Because the controversy is enmeshed in the philosophical differences between traditional and progressive (or new) approaches, differences that have divided educators for years. The progressives challenge the results of laboratory tests and classroom studies on the basis of a broad philosophical scepticism about the values of such research, They champion student-centred learning and teacher empowerment. Sadly, they fail to realise that these very admirable educational values are equally consistent with the teaching of phonics.\n\nFF. Hf schools of education insisted that would-be reading teachers learned something about the vast research in linguistics and psychology that bears on reading, their graduates would be more eager to use phonics and would be prepared to do so effectively. They could allow their pupils to apply the principles of phonics while reading for pleasure. Using whole-language activities to supplement phonics instruction certainly helps to make reading fun and meaningful for children, so no one would want to see such tools discarded. Indeed, recent work has indicated that the combination of literature-based instruction and phonics is more powerful\n\nA Ec BE: Bic =: ia\n\nthan either method used alone.\n\nTeachers need to strike a balance. But in doing so, we urge them to remember that reading must be grounded in a firm understanding of the connections between letters and sounds. Educators who deny this reality are neglecting decades of research. They are also neglecting the needs of their students.\n\nPisin at ala ad att al at ad al ad ad al ad a al ad ns\n\nBRR BNAA, RRB BARA APR MAA ROD IED \\y EA, OMESER. KF Moppe MARANA MME FRM L y\n\nnal a? a?\n\n} t\n\nIn the teaching community, 37 question the usefulness of research imo methods of teaching reading. These critics believe that 38__is\n\nonaen {Phone | JFOUPP\n\nincompatible aun ¢ with student-centred learning, In the future, teachers need to be aware S368 of 39 = 7\n\noo =; so that they understand the importance of phonics. They should not,; however, ignore the ideas of 40 _which make reading enjoyable for? learners. i\n\nthe phonies method the whole-word method the whole-language method\n\ntraditionalists progressives linguistics research studie","options":[{"id":"A","text":"the phonics method"},{"id":"B","text":"the whole-word method"},{"id":"C","text":"the whole-language method"},{"id":"D","text":"traditionalists"},{"id":"E","text":"progressives"},{"id":"F","text":"linguistics"},{"id":"G","text":"research studies"}],"questions":[{"q":37,"context":"KF Moppe nd it was not introduced to the Winter [S33 4Tae Olympics until the 1952 Games. It was lit that year J predicting not in Olympia, Greece, but in Norway, which was @'supimeiacomict chosen because it was the birthplace of skiing. But since the 1964 Olympics at Innsbruck, Austria, every Olympic Games — Winter and Summer — has begun with a torch-lighting ceremony in Olympia, Greece, followed by a torch relay to the Olympic stadium.\n\nDesigning an Olympic Torch The torch starts out as an idea in the mind of a designer or group of ~ designers. Several design teams submit proposals to the Olympic Committee for the opportunity to create and build the torch. The team that wins the assignment will design a torch that is both aesthetically\n\nA —Ric Di: Fi a: 6 Ur\n\npleasing and functional. A torch can take a year or two to design and build. And once the torch has been built, it must be tested rigorously in all kinds of weather conditions. The look of the modern Olympic torch originated with John Hench, a Disney artist who designed the torch for the 1960 Winter Olympics in Squaw Valley, California. His design provided the basis for all future torches. Since then, designers have tried to create a torch that represents the host country and the theme for that Olympic Games.\n\nJD The torch must then be replicated... and replicated. It’s not just one torch making the journey to the Olympic stadium; it’s thousands. Anywhere from 10,000 to 15,000 torches are constructed to accommodate the thousands of runners who carry them through each leg of the Olympic relay. Each runner has the opportunity to purchase his torch at the end of his leg of the relay.\n\nOlympic Torch fuel\n\nJE, The first torch used in the modern Olympics (the 1936 Berlin Games) was made of a thin steel rod topped with a circular piece from which the flame rose. It was inscribed with a dedication to the py yy runners. The torch must stay lit for the entire length J Settings of its journey. It must survive wind, rain, sleet, snow, DFE and a variety of climates (desert, mountain, and @> st:/meibo.competn9 ocean). For fuel, early torches burned everything from gunpowder to olive oil. Some torches used a mixture of hexamine (a mixture of formaldehyde and ammonia) and naphthalene (the hydrogen- and carbon-based substance in mothballs) with an igniting liquid, These substances weren't always the most efficient fuel sources, and they were sometimes dangerous. In the 1956 Games, the final torch in the relay was lit by magnesium and aluminum, burning chunks of which fell from the torch and seared the runner's arms. The first liquid fuels were introduced at the 1972 Munich Games. Torches since that time have carried liquid fuels — they are stored under pressure as a liquid, but burn as a gas to produce a flame, Liquid fuel is safe for the runner and can be stored in a lightweight canister. The torch designed for the 1996 Atlanta Summer Olympics has an aluminum base that houses a small fuel tank. As fuel rises through the handle, it is pushed through a brass valve with thousands of tiny openings. As the fuel squeezes through the small openings, it builds pressure. Once it makes it through the openings, the pressure drops, and the liquid fuel turns into a gas for burning. The tiny holes maintain a high pressure in the fuel to keep the flame going through harsh conditions.\n\n[come\n\nFF The 1996 torch was fueled by propylene, which produced a bright flame. But because propylene contains a high level of carbon, it also produced a lot of smoke — not a plus for the environment. In 2000, the creators of the Sydney Olympic torch came up with a more lightweight, inexpensive, and environmentally friendly design. To fuel their torch, they decided on a mixture of 35 percent propane (the gas used to heat home stoves and barbecue grills) and 65 percent butane (cigarette lighter fuel), which ignites a strong flame without making a lot of smoke. Because the propane/butane mixture can be stored as a liquid under relatively light pressure, it can be kept in a lightweight container. It then burns as gas under normal atmospheric pressure. The liquid fuel is stored in an aluminum canister located about halfway up the torch. It flows up to the top of the torch through a pipe. Before leaving the pipe, the liquid fuel is forced through a tiny hole, Once it moves through the hole, there is a pressure drop, causing the liquid to turn into gas for burning. The torch moves the liquid fuel at a consistent rate to the burner, so the flame always burns with the same intensity. The torch can stay lit for about 15\n\nG The engineers behind both the 1996 and 2000 torches adopted a burner system that utilized a double flame, helping them to stay lit even in erratic winds. The external flame burns slowly and at a lower temperature than the internal flame. This flame is big and bright orange, so it can be seen clearly; but it is unstable in winds. The interior flame burns hotter, producing a blue flame that is small but very stable, because its internal location protects it from the wind. It would act like a pilot light, able to relight the external flame should it go out.\n\nJ] When the 2002 Olympic Torch, in Salt lake city. the top section was glass, and the Olympic Flame burned within the glass, echoing the 2002 Olympic theme Light the Fire Within. The glass stood for purity, winter, ice, and nature, Also inside the glass was a geometric copper structure which helped hold the flame. The two silver sections also mirrored the blue/ purple colors of the Fire and Ice theme\n\nLAO AEN ec LU EET A TH AE ATE TART OEE\n\nitem rin oe ret CO anne e\n\np> ouestions 1-3\n\n‘Complete the summary below using NO MORE THAN THREE WORDS from the passage,\n\nWrite your answers in boxes 1-3on your answer sheet.\n\nTEL TS tt papers fered by Caipredcting com, ComyTagRO The Olympic torch, as Olympic Committee requested, is carefully designed which takes a years to design and build so that it is capab ach runner has the opportunity to 3. - his torch at completion of his joumey of the relay for memorial and as for souvenirs”. Passage cung cấp bằng chứng “thousands of runners who carry them through each leg of the Olympic relay. Each runner has the opportunity to purchase his torch at the end of his leg of the relay. Olympic Torch fuel”. Điểm quyết định là thông tin trong passage dẫn đến “purchase”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần động từ/cụm động từ; “purchase” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN THREE WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'purchase' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"purchase","correctText":"purchase","inputType":"text"}],"sourceNote":""},{"id":48,"title":"Man or Machine","instruction":"NO MORE THAN TWO WORDS","sourcePages":"241–245","passage":"A During July 2003, the Museum of Science in Cambridge, Massachusetts exhibited what Honda calls ‘the world’s most advanced humanoid robot’, ASIMO (the Advanced Step in Innovative Mobility). Honda's brainchild is on tour in North America and delighting audiences Wherever it goes. After 17 years in the making,\n\nASIMO stands at four feet tall, weighs around 15 pounds and looks like a child in an astronaut's | suit. Though it is difficult to see ASIMO's face at a distance, on closer inspection it has a smile and two large ‘eyes’ that conceal cameras. The robot cannot work autonomously - its actions are ‘remote controlled’ by scientists through the computer in its backpack (n. 47 (4. TY). Yet watching ASMIO perform at a show in Massachusetts it seemed uncannily human, The audience cheered as ASIMO walked forwards and backwards, side to side and up and downstairs. After the show, a number of people told me that they would like robots to play more of a role in daily life - one even said that the robot would be like ‘another person’\n\nA ipredicting IERZ (copy right) RURCRLME SS WTR ~ EARP UNUM RAR” MORK CELA)\n\nB while the japanese have made huge strides in solving some of the engineering problems of human kinetics (n.2i)/3°) and bipedal (adj.i4){22h990\") movements, for the past 10 years scientists at MIT's former Artificial Intelligence (Al) lab (recently renamed the Computer Science and Artificial Intelligence Laboratory, CSAIL) have been making robots that can behave like humans and interact with humans. One of MIT's robots, Kismet, is an anthropomorphic (adji, Aif)) head and has two eyes (complete with eyelids), ears, a mouth, and eyebrows. It has several facial expressions, including\n\nhappy, sad, frightened and disgusted. Human interlocutors are able to read some\n\nof the robot's facial expressions, and often change their behavior towards the machine asa result - for example, playing with it when it appears ‘sad’. Kismet is now in MIT's museum, but the ideas developed here continue to be explored in new robots.\n\nC Cog (short for Cognition) is another pioneering project from MIT's former Al lab. Cog has a head, eyes, two arms, hands and a torso (n.{R-F) - and its proportions were originally measured from the body of a researcher in the lab. The work on Cog has been used to test theories of embodiment and\n\ndevelopmental robotics, particularly getting a robot to develop intelligence by responding to its environment via sensors, and to leam through these types of interactions.\n\nD Mar ie getting furthest: down the road to creating human-like and interactive robots. Some scientists argue that ASIMO is a great engineering feat but not an intelligent machine - because it is unable to interact autonomously with unpredictabilities in its environment in meaningful ways, and learn from experience. Robots like Cog and Kismet and new robots at MIT's CSAIL and media lab, however, are beginning to do this\n\nHMRI, BRB MARA MOLE IA BA, PRRSES, HF Mapp, ewe aeamwe\n\nE these are exciting developments. Creating a machine that can walk, make gestures and learn from its environment is an amazing achievement. And watch this space: these achievements are likely rapidly to be improved upon. Humanoid robots could have a plethora of uses in society, helping to free people from everyday tasks. In Japan, for example, there is an aim to create robots that can do the tasks similar to an average human, and also. act in more sophisticated situations as firefighters, astronauts or medical assistants to the elderly in the workplace and in homes - partly in order to counterbalance the effects of an ageing population.\n\nSuch robots say much about the way in which\n\nwe view humanity, and they bring out the best and worst of us. On one hand, these developments express human creativity - our ability to invent, experiment, and to extend our control over the world, On the other hand, the aim to create a robot like a human being is spurred on by dehumanized ideas - by the sense that human companionship can be substituted by machines; that humans lose their humanity when they interact with technology; or that we are little more than [6 surface and ritual behaviors, that can be simulated with metal and electrical circuits.\n\nTE We SE 5\n\nr\n\npredicting\n\neo\n\nSo:","options":[],"questions":[{"q":7,"context":"using NO MORE THAN TWO WORDS from the Reading Passage for each answer ions 7-13 Write your answers in boxes 7-13 on your answer sheet. progress, MIT is developing robots that are human-like and can 9... humans, What is special about Kismet is that it has different 10..... Which can be read by human inter d whether you could make enough to irrigate fields and grow crops.’\n\nPee ge a |\n\nBiB BBE B BE:\n\n* Today, a decade on, his dream has taken shape as a giant greenhouse on a desert island off Abu Dhabi in the Persian Gulf--the first commercially viable version of his “seawater greenhouse’. Local scientists, working with Paton, are watering the desert and growing vegetables in what is basically a giant dew-making machine that produces fresh water and cool air from sun and seawater, In awarding Paton first prize in a design competition two years ago, Marco Goldschmied, president of the Royal Institute of British Architects, called it ‘a truly original idea which has the potential to impact on the lives of millions of people living in coastal water-starved areas around the world”\n\ny\n\né\n\n[The seawater greenhouse as developed by Paton has three main parts. They both air-condition the greenhouse and provide water for irrigation. The front of the greenhouse faces into the prevailing wind so that hot dry air blows in through a front wall. The wall is made of perforated cardboard kept moist by a constant trickle of seawater pumped up from ocean. The purpose is to cool and moisten the incoming desert air. The cool moist air allows the plants to grow faster. And, crucially, because much less water evaporates from the leaves, the plants need much less moisture to grow than if they were being irrigated in the hot dry desert air outside the greenhouse.\n\nE,_ The airconditioning of the interior of the greenhouse is completed by the second feature: the roof. It has two layers: an outer layer of clear polyethylene and an inner coated layer that reflects infrared radiation. This combination ensures that visible light can stream through to the plants, maximizing the rate of plant growth through photosynthesis but at the same time heat from the infrared radiation is trapped n the space between the layers, and kept away from the plants. This helps keep the air around the plants cool,\n\nFF Atthe back of the greenhouse sits the third elements, This is the main water production unit. Here, the air hits a second moist cardboard wall that increases its humidity as it reaches the condenser, which finally collects from the hot humid air the moisture for irrigating the plants. The condenser is a metal surface kept cool by still more seawater. It is the equivalent of the window on Paton’s Morcocean bus, Drops of pure distilled water form on the condenser and flow into a tank for irrigating the crops.\n\nG_ The Abu Dhai greenhouse more of less runs itself, Sensors switch everything on when the sun rises and alter flows of air and seawater through the day in res, to changes in pein, amid, oo emligit On wales Fy hoe days, fins ensure a constant flow of air through the A DFedicting greenhouse. ‘Once it is tuned to the local environment, you don’t need anyone there for it to work,” says Paton. ‘We can run the entire operation off one 13-amp plug, and in the future we could make it cntirely independent of the grid, powered from a few solar panels.”\n\nCritics point out that construction costs of around $4 a square foot are quite high,\n\nSo = cs\n\nBy illustration, however, Paton presents that it can cool as efficiently as a 300-kilowatt air conditioner while using less than 3 kilowatts of electricity. Thus the plants need only an eighth of the volume of water used by those grown conventionally And so the effective cost of the desalinated water in the greenhouse is only a quarter that of water from a standard desalinator, which is good economics. Besides it really suggests an environmentally-friendly way of providing air conditioning on a scale large enough to cool large greenhouses where crops can be grown despite the high outside temperatures.\n\nAMARMIM IA, RL HASH MM RIM HAG EM EAR, WHERALA: HF Mapp UCMSRARAMETAM hutp:/ /ks dpredicting.com\n\n2015 EMRE HAH RMR MR) AME TERR RE\n\nEc Ee Es a:\n\nSee Questions 37-40\n\nSummary","options":[],"question ly-friendly","inputType":"text"}],"sourceNote":""},{"id":50,"title":"T-Rex Hunter","instruction":"NO MORE THAN TWO WORDS","sourcePages":"250–253","passage":"A, Jack Homer is an unlikely academic: his dyslexia is so bad that he has trouble reading a book. But he can read the imprint of life in sandstone or muddy shale across a distance of 100m years, and it is this gift that has made him curator of palaeontology at Montana State University’s Museum of the Rockies, the leader of a multi-million dotiar scientific project to expose a complete slice of life 68m years ago, and a consultant to Steven Spielberg and other Hollywood figures,\n\nJB His father had a sand and gravel quarry in Montana, and the young Homer was a collector of stones and bones, complete with notes about when and where he found them. \"My father had owned a ranch when he was younger, in Montana,\" he says. \"He was enough of a geologist, being a sand and gravel man, to have a pretty good notion that they were dinosaur bones, So when I was cight years old he took me back to the area that had been his ranch, to where he had seen these big old bones. I picked up one. I am pretty sure it was the upper arm bone of a duckbilled dinosaur: it probably wasn't a maiaosaur but closely Ié 1m) Tbe related to that. I catalogued it, and took good care of it, and then a PFedicting later when I was in high school, excavated my first dinosaur © “™~™om\"w skeleton, It obviously started earlier than eight and Ilterally have been driven ever since. {feel like I was born this way.\"\n\nPEER AAE ke ipredicting com ROR TIN UIE 5 here\n\n(C Horer spent seven years at university, but never graduated. \"have a learning\n\ndisability, I would call ita leaning difference - dystexia, they call it - and I just had a terrible time with English and foreign languages and things like that. For a degree in geology or biology they required two years of a foreign language. There was no way in the world I could do that. In fact, I didn't u don't have all that many animals that are good predators. If T rex was a top predator, especially considering how big it is, you'd expect it to be extremely rare, much rarer than the little dromacosaurs, and yet they are everywhere, they are a dime a dozen,” he says. A 12-tonne T rex is a lot of vulture, but he doesn't see the monster as clumsy. He insisted his theory and finding, dedicated to further research upon it, of course, he would like to reevaluate if there is any case that additional evidence found or explanation raised by others in the future\n\nJE F ic en &\n\nG He examined the leg bones of the T-rex, and compared the length of the thigh bone (upper leg), to the shin bone (lower leg). He found that the thigh bone was equal in length or slightly longer than the shin bone, and much thicker and heavier. which proves that the animal was built to be a slow walker rather than fast running. On the other hand, the fossils of fast hunting dinosaurs ALWAYS showed that the shin bone was longer than the thigh bone, This same truth can be observed in many animals of today which are designed to run fast: The ostrich, cheetah, et.\n\nFH__ ie alto studied the fossil teeth of the T-rex, and compared them with the teeth of the Velociraptor, and put the nail in the coffin of the \"hunter T-rex theory”. The Velociraptor’s tecth where like stake knifes: sharp, razor-cdged, and capable of tearing through flesh with ease. The T-Rex's teeth were huge, sharp at their tip, but blunt, propelled by enormous jaw muscles, which enabled them to only crush bones,\n\nWith the evidence presented in his documentary, Homer was able to prove that the idea of the T-rex as being a hunting and ruthless killing machine is probably just a myth. In light of the scientific clues he was able to unearth, the T-rex was a slow, sluggish animal which had poor vision, an extraordinary sense of smell, that often reached its \"prey\" after the real hunters ‘were done feeding, and sometimes it had to sca \n\neeees\n\nJ Plain legal English can be used as a marketing tactic. Provincial Insurance issued their plain English Home Cover policy in 1983 and sold it heavily as such. In the first 18 months its sales rocketed, drawing in about an extra £1.5 million of business. Recently, the Eagle Star Group launched a plain English policy to a chorus of congratulatory letters from policyholders, People, it scems, prefer to buy a policy they can understand,\n\nPURE GRIME INR) CARE HERR RH\n\nC To kinds of instructions give us a lot of concern - medical labels and do-it-yourself products. With medical labels there is a serious Ce gap between what the professionals think is clear and what is really clear to patients. A survey by pharmacists Raynor and Sillito found that 31% of patients misunderstood the instruction on eye drops ‘To be instilled’, while 33% misunderstood ‘Use sparingly. The instruction ‘Take two tablets 4 hourly’ is so prone to\n\nA (Bic Die — tim: ® =?:\n\nmisunderstanding (for example, as 8 tablets an hour) that we think it should be banned. Unclear instructions on do-it-yourself products cause expense and frustration to customers. Writing the necessary instructions for these products is usually entrusted to someone who knows the product inside out, yet the best\n\nqualification for writing instructions is ignorance. The writer is then like a first-time user, discovering how to use the product in a step-by-step way. Instructions never seem to be tested with first-time users before being issued. So vital steps are missed out or components are mislabeled or not labelled at all. For example, the instructions for assembling a sliding door gear say: ‘The pendant bolt centres are fixed and should be at an equal distance from the centre of the door.’ This neglects to explain who should do the fixing and how the bolt centres will get into the correct position. By using an imperative and an active verb the instruction becomes much clearer: ‘Make sure you fix the centres of the pendant bolts at an equal distance from the centre of the door\n\nEffectively, the Plain English movement in the US began with President Jimmy\n\nCarter's Executive Order 12044 of 23 March 1978, that required regulations to be\n\nwritten in plain language. There were earlier government efforts to inform\n\nconsumers about their rights and obligations, such as the Truth in Lending Act\n\n(1969) and the Fair Credit Billing Act (1975),\n\nwhich emphasized a body of information that\n\n= consumers need in simple language. But\n\n> President Carter's executive order gave the\n\nprestige and force of a president to the\n\nmovement. All over the country isolated\n\nrevolts or efforts against legalistic gobbledygook at the federal, state and corporate\n\nlevels scemed to grow into a small revolution. These efforts and advances between the years 1978 and 1985 are described in the panel The Plain English Scorecard’\n\nThe CELAEMERR) has not fallen yet. The forces of resistance are strong, as one can sec from the case of Pennsylvania as cited in the Scorecard, In addition, President Ronald Reagan's executive order of 19 February 1981, revoking President Carter's carlier executive order, has definitely slowed the pace of plain English legislation in the United States. There are three main objections to the idea of plain English. They are given below, with the campaign's answers to them:\n\nThe statute would cause unending litigation and clog the courts. Simply not truc in all the ten states with plain English laws for consumer contracts and the 34 states\n\nwith laws or regulations for insurance policies. Since 1978 when plain English law went into effect in New York there have been only four litigations and only two decisions. Massachusetts had zero cases. The cost of compliance would be\n\n‘enormous. Translation of legal contracts into non-legal everyday language would be a waste of time and money. The experience of several corporations has proved that the cost of com
