<style id="ielts-dual-pane-layout-patch">
/* =========================================================
   IELTS READING – DUAL PANE / INDEPENDENT SCROLL PATCH
   Desktop: 60/40
   Mobile portrait (<768px): top/bottom, BOTH visible
   Mobile landscape + tablet: 60/40
   Body locked only while an exam/practice screen is active
   ========================================================= */

html.ielts-exam-active,
body.ielts-exam-active{
  height:100% !important;
  max-height:100% !important;
  overflow:hidden !important;
  overscroll-behavior:none !important;
}

body.ielts-exam-active{
  position:relative !important;
}

/* Prevent the exam/practice shell itself from becoming the scrolling surface. */
body.ielts-exam-active .exam,
body.ielts-exam-active .practice,
body.ielts-exam-active #exam-screen{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Common split containers */
body.ielts-exam-active .workspace,
body.ielts-exam-active .work{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Every reading/question pane scrolls on its own. */
body.ielts-exam-active .workspace > .pane,
body.ielts-exam-active .workspace > .reading-pane,
body.ielts-exam-active .workspace > .question-pane,
body.ielts-exam-active .workspace > .passage-pane,
body.ielts-exam-active .workspace > .passage,
body.ielts-exam-active .workspace > .questions,
body.ielts-exam-active .work > .pane,
body.ielts-exam-active .work > .reading-pane,
body.ielts-exam-active .work > .question-pane,
body.ielts-exam-active .work > .passage-pane,
body.ielts-exam-active .work > .passage,
body.ielts-exam-active .work > .questions,
body.ielts-exam-active #passage-pane,
body.ielts-exam-active #question-pane{
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain !important;
  -webkit-overflow-scrolling:touch !important;
}

/* The old "show only one pane" mobile controls are no longer needed. */
body.ielts-exam-active .mobile-switch,
body.ielts-exam-active .mobile-toggle,
body.ielts-exam-active #show-reading,
body.ielts-exam-active #show-questions{
  display:none !important;
}

/* Never allow old mobile-state classes to hide one side. */
body.ielts-exam-active .workspace.show-questions > .reading-pane,
body.ielts-exam-active .workspace.show-questions > .passage-pane,
body.ielts-exam-active .workspace.show-questions > .passage,
body.ielts-exam-active .workspace:not(.show-questions) > .question-pane,
body.ielts-exam-active .practice.show-passage .question-pane,
body.ielts-exam-active .practice:not(.show-passage) .passage-pane,
body.ielts-exam-active #passage-pane.mobile-hidden,
body.ielts-exam-active #question-pane.mobile-hidden{
  display:block !important;
}

/* Keep fixed-height practice shells inside the viewport. */
body.ielts-exam-active .practice{
  height:100vh !important;
  height:100dvh !important;
  max-height:100vh !important;
  max-height:100dvh !important;
}

/* Matching Information-style shell: 44px global brand + exam below it. */
body.ielts-exam-active .top-brand + .exam,
body.ielts-exam-active .top-brand ~ .exam{
  height:calc(100vh - 44px) !important;
  height:calc(100dvh - 44px) !important;
  min-height:0 !important;
}

/* ---------- DESKTOP + TABLET + MOBILE LANDSCAPE ---------- */
@media (min-width:768px), (orientation:landscape){
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,3fr) minmax(0,2fr) !important; /* 60 / 40 */
    grid-template-rows:minmax(0,1fr) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based exam templates */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* YES/NO/NOT GIVEN-style fixed header = 46 + 42 = 88px */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
  }

  /* Restore divider between 60% passage and 40% questions */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:1px solid var(--line, #d7dde4) !important;
    border-bottom:0 !important;
  }
}

/* ---------- MOBILE PORTRAIT ONLY ---------- */
@media (max-width:767px) and (orientation:portrait){
  /* Matching Information had height:auto + sticky header on mobile:
     force the shell back into the viewport. */
  body.ielts-exam-active .exam{
    min-height:0 !important;
    overflow:hidden !important;
  }

  body.ielts-exam-active .exam-head{
    position:relative !important;
    top:auto !important;
    flex:0 0 auto !important;
  }

  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    grid-template-rows:minmax(0,48%) minmax(0,52%) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based templates: workspace occupies exactly the remaining height. */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* Fixed 88px header templates */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }

  /* Clear old "one pane at a time" rules with high specificity. */
  body.ielts-exam-active .workspace.show-questions .reading-pane,
  body.ielts-exam-active .workspace.show-questions .passage-pane,
  body.ielts-exam-active .workspace.show-questions .passage,
  body.ielts-exam-active .workspace.show-questions .question-pane,
  body.ielts-exam-active .practice.show-passage .passage-pane,
  body.ielts-exam-active .practice.show-passage .question-pane,
  body.ielts-exam-active .practice .passage-pane,
  body.ielts-exam-active .practice .question-pane{
    display:block !important;
  }

  /* Horizontal divider between Passage (top) and Questions (bottom). */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:0 !important;
    border-bottom:2px solid var(--line, #d7dde4) !important;
  }

  /* Compact padding so both regions remain practical on small screens. */
  body.ielts-exam-active .reading-pane,
  body.ielts-exam-active .passage-pane,
  body.ielts-exam-active .work > .passage{
    padding-top:10px !important;
    padding-bottom:18px !important;
  }

  body.ielts-exam-active .question-pane,
  body.ielts-exam-active .work > .questions{
    padding-top:9px !important;
    padding-bottom:24px !important;
  }
}

/* Print should remain normal and fully expandable. */
@media print{
  html.ielts-exam-active,
  body.ielts-exam-active{
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
  }
}

const EXERCISES=[{"id":1,"title":"A Brief History of Rubber","instruction":"NO MORE THAN THREE WORDS","sourcePages":"1–5","passage":"A. Rubber is one of the most important products to come out of the rainforest.\n\nThough indigenous rainforest dwellers of South America have been using\n\nrubber for generations, it was not until 1839 that rubber had its first practical\n\napplication in the industrial world. In that year, Charles Goodyear accidentally\n\ndropped rubber and sulfur on a hot stovetop, causing it to char like leather yet\n\nremain plastic and elastic. Vulcanization, a refined version of this process,\n\ntransformed the white sap from the bark of the Heave tree into an essential\n\nproduct for the industrial age.\n\nB. With the invention of the automobile in the late 19th century, the rubber\n\nboom began. As demand for rubber soared small dumpy river towns like\n\nManaus, Brazil, were transformed into over night into bustling centers of\n\ncommerce. Manaus, situated on the Amazon where it is met by Rio Negro,\n\nbecame the opulent heart of the rubber trade. Within a few short years Manaus\n\nhad Brazil’s first telephone system, 161 miles of streetcar tracks, and an electric\n\ngrid for a city of a million, though it had a population of only 40,000.\n\nC. The opulence of the rubber barons could only be exceeded by their brutality.\n\nWild Heave trees, like all primary rainforest trees are widely dispersed, with an\n\nadaptation that protects species from the South American leaf blight which\n\neasily spreads through and decimates plantations. Thus to make a profit,\n\nbarons had to acquire control over huge tracts of land. Most did so by hiring\n\ntheir own private armies to defend their claims, acquire new land, and capture\n\nnative laborers. As the Indians died, production soared.\n\nD. The Brazilian rubber market was crushed by the rapid development of the\n\nmore efficient rubber plantations of Southeast Asia. However, the prospects of\n\ndeveloping plantations did not begin on a high note. Rubber seeds, rich with oil\n\nand latex, could not survive the long Atlantic journey from Brazil. Finally, in 1876,\n\nan English planter, Henry Wickham, collected 70,000 seeds and shipped them\n\nto England. 2800 of the seeds germinated and were sent to Colombo, Ceylon\n\n(present day Sri Lanka). After several false starts, including one planter in\n\nnorthern Borneo who felled his plantation after finding no rubber balls hanging\n\nfrom the braches, the prospects were grim. One major obstacle was the\n\nsuccess of tea and coffee gave planters no reason to try an untested crop.\n\nE. Finally in 1895, Henry Ridley, head of Singapore’s botanical garden,\n\npersuaded two coffee growers to plant two acres of Heave tress. Twelve years\n\nlater more than 300,000 ha of rubber grew in plantations in Ceylon and\n\nMalaya. New innovations increased efficiency and production doubled every\n\ntwo years. Rubber could be produced at only a fraction of the cost of collecting\n\nwild rubber in Brazil. By 1910, Brazilian production had fallen to 50%. In 1914,\n\nBrazil’s market share was down around 30%; 1918 -20%, and 1940 -1.3%.\n\nF. However the Second World War threatened to shift the rubber wealth. With\n\nJapan occupying prime rubber producing areas in Southeast Asia, the US\n\nfeared it would run out of the vital material. Every tire, hose, seal, valve, and\n\ninch of wiring required rubber. The rubber Development Corporation, the chief\n\noverseer of rubber acquisition, sought out other sources including establishing\n\na rubber program that sent intrepid explorers into the Amazon seeking rubber\n\nspecimen that would be used to produce high yields, superior product, and\n\npossibility of resistance against leaf blight. The ultimate goal of the program\n\nwas to establish rubber plantations close to home. In addition to searching the\n\nAmazon and establishing experimental plantations in Latin America, the\n\nprogram came up with some novel plans to produce rubber. Extensive work on\n\nsynthetic rubber yielded a product that, in time, economists predicted would\n\nreplace natural rubber. By 1964 synthetic rubber made up 75% of the market.\n\nG. However the situation changed drastically with the OPEC oil embargo of 1973\n\nwhich doubled the price of synthetic rubber and made oil consumers more\n\nconscious of their gas mileage. The concern over gas mileage brought\n\nunexpected threat to the synthetic market: the wide-spread adoption of the\n\nradial tire. The radial tire replaced the simple bias tires (which made up 90% of\n\nthe market only 5 year earlier) and within a few years virtually all cars were\n\nrolling in radials. Synthetic rubber did not have the strength for radials; only\n\nnatural rubber could provide the required sturdiness. By 1993 natural rubber\n\nhad recaptured 39% of the domestic market. Today nearly 50% of every auto\n\ntire and 100% of all aircraft tires are made of natural rubber. 85% of this rubber\n\nis imported from Southeast Asia meaning that the US is highly susceptible to\n\ndisruptions caused by an embargo or worse, the unintentional or intentional\n\nintroduction of leaf blight into plantations. None of the trees in plantations\n\nacross Southeast Asia has resistance to blight so a single act to biological\n\nterrorism, the systematic introduction of fungal spores so small as to be readily\n\nconcealed in a shoe, could wipe out the plantations, shutting down production\n\nof natural rubber for at least a decade. It is difficult to think of any other raw\n\nmaterial that is as vital and vulnerable.","options":[],"questions":[{"q":8,"context":"Natural rubber gave way to its replacement OPEC doubled revenue from synthetic rubber and made oil consuming nations more attentive of 8 _________. This brought threats to the synthetic market by espousing the 9_________, which would replace all the simple bias tires within a few years. Because 10_________ is the only mate u trúc câu và yêu cầu NO MORE THAN THREE WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'vital and vulnerable' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"vital and vulnerable","correctText":"vital and vulnerable","inputType":"text"}],"sourceNote":""},{"id":2,"title":"Living Dunes","instruction":"ONE WORD ONLY","sourcePages":"6–12","passage":"When you think of a sand dune, you probably picture a barren pile of lifeless\n\nsand. But sand dunes are actually dynamic natural structures. They grow, shift\n\nand travel. They crawl with living things. Some sand dunes even sing.\n\nA. Although no more than a pile of wind-blown sand, dunes can roll over trees\n\nand buildings, march relentlessly across highways, devour vehicles on its path,\n\nand threaten crops and factories in Africa, the Middle East, and China. In some\n\nplaces, killer dunes even roll in and swallow up towns. Entire villages have\n\ndisappeared under the sand. In a few instances the government built new\n\nvillages for those displaced only to find that new villages themselves were\n\nburied several years later. Preventing sand dunes from overwhelming cities\n\nand agricultural areas has become a priority for the United Nations\n\nEnvironment Program.\n\nB. Some of the most significant experimental measurements on sand\n\nmovement were performed by Ralph Bagnold, a British engineer who worked in\n\nEgypt prior to World War II. Bagnold investigated the physics of particles\n\nmoving through the atmosphere and deposited by wind. He recognised two\n\nbasic dune types, the crescentic dune, which he called “barchan,” and the\n\nlinear dune, which he called longitudinal or “sief ’ (Arabic for “sword”). The\n\ncrescentic barchan dune is the most common type of sand dune. As its name\n\nsuggests, this dune is shaped like a crescent moon with points at each end,\n\nand it is usually wider than it is long. Some types of barchan dunes move faster\n\nover desert surfaces than any other type of dune. The linear dune is straighter\n\nthan the crescentic dune with ridges as its prominent feature. Unlike crescentic\n\ndunes, linear dunes are longer than they are wide—in fact, some are more than\n\n100 miles (about 160 kilometers) long. Dunes can also be comprised of smaller\n\ndunes of different types, called complex dunes.\n\nC. Despite the complicated dynamics of dune formation, Bagnold noted that a\n\nsand dune generally needs the following three things to form: a large amount\n\nof loose sand in an area with little vegetation—usually on the coast or in a\n\ndried-up river, lake or sea bed; a wind or breeze to move the grains of sand;\n\nand an obstacle, which could be as small as a rock or as big as a tree, that\n\ncauses the sand to lose momentum and settle. Where these three variables\n\nmerge, a sand dune forms.\n\nD. As the wind picks up the sand, the sand travels, but generally only about an\n\ninch or two above the ground, until an obstacle causes it to stop. The heaviest\n\ngrains settle against the obstacle, and a small ridge or bump forms. The lighter\n\ngrains deposit themselves on the other side of the obstacle. Wind continues to\n\nmove sand up to the top of the pile until the pile is so steep that it collapses\n\nunder its own weight. The collapsing sand comes to rest when it reaches just\n\nthe right steepness to keep the dune stable. The repeating cycle of sand\n\ninching up the windward side to the dune crest, then slipping down the dune’s\n\nslip face allows the dune to inch forward, migrating in the direction the wind\n\nblows.\n\nE. Depending on the speed and direction of the wind and the weight of the local\n\nsand, dunes will develop into different shapes and sizes. Stronger winds tend to\n\nmake taller dunes; gentler winds tend to spread them out. If the direction of the\n\nwind generally is the same over the years, dunes gradually shift in that\n\ndirection. But a dune is “a curiously dynamic creature”, wrote Farouk El-Baz in\n\nNational Geographic. Once formed, a dune can grow, change shape, move\n\nwith the wind and even breed new dunes. Some of these offspring may be\n\ncarried on the back of the mother dune. Others are born and race downwind,\n\noutpacing their parents.\n\nF. Sand dunes even can be heard ‘singing’ in more than 30 locations worldwide,\n\nand in each place the sounds have their own characteristic frequency, or note.\n\nWhen the thirteenth century explorer Marco Polo encountered the weird and\n\nwonderful noises made by desert sand dunes, he attributed them to evil spirits.\n\nThe sound is unearthly. The volume is also unnerving. Adding to the tone’s\n\notherworldliness is the inability of the human ear to localise the source of the\n\nnoise. Stéphane Douady of the French national research agency CNRS and his\n\ncolleagues have been delving deeper into dunes in Morocco, Chile, China and\n\nOman, and believe they can now explain the exact mechanism behind this\n\nacoustic phenomenon.\n\nG. The group hauled sand back to the laboratory and set it up in channels with\n\nautomated pushing plates. The sands still sang, proving that the dune itself\n\nwas not needed to act as a resonating body for the sound, as some\n\nresearchers had theorised. To make the booming sound, the grains have to be\n\nof a small range of sizes, all alike in shape: well-rounded. Douady’s key\n\ndiscovery was that this synchronised frequency — which determines the tone\n\nof sound — is the result of the grain size. The larger the grain, the lower the key.\n\nHe has successfully predicted the notes emitted by dunes in Morocco, Chile\n\nand the US simply by measuring the size of the grains they contain. Douady\n\nalso discovered that the singing grains had some kind of varnish or a smooth\n\ncoating of various minerals: silicon, iron and manganese, which probably\n\nformed on the sand when the dunes once lay beneath an ancient ocean. But in\n\nthe muted grains this coat had been worn away, which explains why only some\n\ndunes can sing. He admits he is unsure exactly what role the coating plays in\n\nproducing the noise. The mysterious dunes, it seems, aren’t quite ready yet to\n\ngive up all of their secrets.","options":[],"questions":[{"q":37,"context":"There are many different types of dunes, two of which are most commonly found in deserts throughout the world, the linear dune and the 37. ________ dune, sometimes also known as the crescentic dune. It’s been long known that in some places dunes can even sing and the answer lies in the sand itself. To produce singing sand in lab, all the sands mus","answerDisplay":"barchan","sourcePage":7,"evidence":"moving through the atmosphere and deposited by wind. He recognised two basic dune types, the crescentic dune, which he called “barchan,” and the linear dune, which he called longitudinal or “sief ’ (Arabic for “sword”). The crescentic barchan dune is the most common type of sand dune. As its name","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “There are many different types of dunes, two of which are most commonly found in deserts throughout the world, the linear dune and the 37. ________ dune, sometimes also known as the crescentic dune. It’s been long known that in some places dunes can even sing...”. Passage cung cấp bằng chứng “moving through the atmosphere and deposited by wind. He recognised two basic dune types, the crescentic dune, which he called “barchan,” and the linear dune, which he called longitudinal or “sief ’ (Arabic for “sword”). The crescentic barchan dune is the most commo ong passage dẫn đến “minerals”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “minerals” phù hợp với cấu trúc câu và yêu cầu ONE WORD ONLY. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'minerals' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"minerals","correctText":"minerals","inputType":"text"}],"sourceNote":""},{"id":3,"title":"When Conversation Flows","instruction":"NO MORE THAN TWO WORDS","sourcePages":"13–18","passage":"We spend a large part of our daily life talking with other people\n\nand, consequently, we are very accustomed to the art of conversing. But why\n\ndo we feel comfortable in conversations that have flow, but get nervous and\n\ndistressed when a conversation is interrupted by unexpected silences? To\n\nanswer this question we will first look at some of the effects of conversational\n\nflow. Then we will explain how flow can serve different social needs.\n\nThe positive consequences of conversational flow show some similarities with\n\nthe effects of ‘processing fluency’. Research has shown that processing fluency\n\n– the ease with which people process information – influences people's\n\njudgments across a broad range of social dimensions. For instance, people feel\n\nthat when something is easily processed, it is more true or accurate.\n\nMoreover, they have more confidence in their judgments regarding information\n\nthat came to them fluently, and they like things that are easy to process more\n\nthan things that are difficult to process. Research indicates that a speaker is\n\njudged to be more knowledgeable when they answer questions\n\ninstantly; responding with disfluent speech markers such as ‘uh’ or ‘urn or\n\nsimply remaining silent for a moment too long can destroy that positive image.\n\nOne of the social needs addressed by conversational flow is the human need\n\nfor ‘synchrony’ – to be ‘in sync’ or in harmony with one another. Many studies\n\nhave shown how people attempt to synchronize with their partners, by\n\ncoordinating their behavior.\n\nThis interpersonal coordination underlies a wide array of human activities,\n\nranging from more complicated ones like ballroom dancing to simply walking\n\nor talking with friends. In conversations, interpersonal coordination is found\n\nwhen people adjust the duration of their utterances and their speech rate to\n\none another so that they can enable turn-taking to occur, without talking over\n\neach other or experiencing awkward silences. Since people are very\n\nwell-trained in having conversations, they are often able to take turns within\n\nmilliseconds, resulting in a conversational flow of smoothly meshed behaviors.\n\nA lack of flow is characterized by interruptions, simultaneous speech or mutual\n\nsilences. Avoiding these features is important for defining and maintaining\n\ninterpersonal relationships. The need to belong has been identified as one of\n\nthe most basic of human motivations and plays a role in many human\n\nbehaviors. That conversational flow is related to belonging may be most easily\n\nillustrated by the consequences of flow disruptions. What happens when the\n\npositive experience of flow is disrupted by, for instance, a brief silence? We all\n\nknow that silences can be pretty awkward, and research shows that even short\n\ndisruptions in conversational flow can lead to a sharp rise in distress levels.\n\nIn movies, silences are often used to signal non-compliance or confrontation\n\n(Piazza, 2006). Some researchers even argue that ‘silencing someone’ is one of\n\nthe most serious forms of exclusion. Group membership is of elementary\n\nimportance to our wellbeing and because humans are very sensitive to signals\n\nof exclusion, a silence is generally taken as a sign of rejection. In this way, a\n\nlack of flow in a conversation may signal that our relationship is not as solid as\n\nwe thought it was. Another aspect of synchrony is that people often try to\n\nvalidate their opinions to those of others. That is, people like to see others as\n\nhaving similar ideas or worldviews as they have themselves, because this\n\ninforms people that they are correct and their worldviews are justified.\n\nOne way in which people can justify their worldviews is by assuming that, as\n\nlong as their conversations run smoothly, their interaction partners probably\n\nagree with them. This idea was tested by researchers using video observations.\n\nParticipants imagined being one out of three people in a video clip who had\n\neither a fluent conversation or a conversation in which flow was disrupted by a\n\nbrief silence. Except for the silence, the videos were identical. After watching the\n\nvideo, participants were asked to what extent the people in the video agreed\n\nwith each other. Participants who watched the fluent conversation\n\nrated agreement to be higher than participants watching the conversation\n\nthat was disrupted by a silence, even though participants were not consciously\n\naware of the disruption.\n\nIt appears that the subjective feeling of being out of sync informs people of\n\npossible disagreements, regardless of the content of the conversation.\n\nBecause people are generally so well- trained in having smooth conversations,\n\nany disruption of this flow indicates that something is wrong, either\n\ninterpersonally or within the group as a whole. Consequently, people who do\n\nnot talk very easily may be incorrectly understood as being less agreeable\n\nthan those who have no difficulty keeping up a conversation. On a societal\n\nlevel, one could even imagine that a lack of conversational flow may hamper\n\nthe integration of immigrants who have not completely mastered the\n\nlanguage of their new country yet.\n\nIn a similar sense, the ever- increasing number of online conversations may be\n\ndisrupted by misinterpretations and anxiety that are produced by insuperable\n\ndelays in the Internet connection. Keeping in mind the effects of conversational\n\nflow for feelings of belonging and validation may help one to be prepared to\n\navoid such misunderstandings in future conversations.","options":[],"questions":[{"q":33,"context":"Delays in online chat fail to have the same negative effect as disruptions that occur in natural conversation. There is a human desire to coordinate 33................................... in an effort to be ‘in harmony’. This coordination can be seen in conversations when speakers alter the speed and extent of their speech in order to facilitate 34","answerDisplay":"behavior","sourcePage":14,"evidence":"have shown how people attempt to synchronize with their partners, by coordinating their behavior. This interpersonal coordination underlies a wide array of human activities, ranging from more complicated ones like ballroom dancing to simply walking","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “Delays in online chat fail to have the same negative effect as disruptions that occur in natural conversation. There is a human desire to coordinate 33................................... in an effort to be ‘in harmony’. This coordination can be seen in...”. Passage cung cấp bằng chứng “have shown how people attempt to synchronize with their partners, by coordinating their behavior. This interpersonal coordination underlies a wide array of human activities, ranging from more complicated ones like ballroom dancing to simply walking”. Điểm quyết định là thông tin t ượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'content' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"content","correctText":"content","inputType":"text"}],"sourceNote":""},{"id":4,"title":"The Robots Are Coming","instruction":"ONE WORD ONLY","sourcePages":"19–23","passage":"A. Can robots advance so far that they become the ultimate threat to our\n\nexistence? Some scientists say no, and dismiss the very idea of Artificial\n\nIntelligence. The human brain, they argue, is the most complicated system\n\never created, and any machine designed to reproduce human thought is\n\nbound to fail. Physicist Roger Penrose of Oxford University and others believe\n\nthat machines are physically incapable of human thought. Colin McGinn of\n\nRutgers University backs this up when he says that Artificial Intelligence ‘is like\n\nsheep trying to do complicated psychoanalysis. They just don’t have the\n\nconceptual equipment they need in their limited brains’.\n\nB. Artificial Intelligence, or Al, is different from most technologies in that\n\nscientists still understand very little about how intelligence works. Physicists\n\nhave a good understanding of Newtonian mechanics and the quantum theory\n\nof atoms and molecules, whereas the basic laws of intelligence remain a\n\nmystery. But a sizable number of mathematicians and computer scientists,\n\nwho are specialists in the area, are optimistic about the possibilities. To them it\n\nis only a matter of time before a thinking machine walks out of the laboratory.\n\nOver the years, various problems have impeded all efforts to create robots.\n\nTo attack these difficulties, researchers tried to use the ‘top- down approach’,\n\nusing a computer in an attempt to program all the essential rules onto a single\n\ndisc. By inserting this into a machine, it would then become self-aware and\n\nattain human-like intelligence.\n\nC. In the 1950s and 1960s great progress was made, but the shortcomings of\n\nthese prototype robots soon became clear. They were huge and took hours to\n\nnavigate across a room. Meanwhile, a fruit fly, with a brain containing only a\n\nfraction of the computing power, can effortlessly navigate in three dimensions.\n\nOur brains, like the fruit fly’s, unconsciously recognize what we see by\n\nperforming countless calculations. This unconscious awareness of patterns is\n\nexactly what computers are missing. The second problem is robots’ lack of\n\ncommon sense. Humans know that water is wet and that mothers are older\n\nthan their daughters. But there is no mathematics that can express these\n\ntruths. Children learn the intuitive laws of biology and physics by interacting\n\nwith the real world. Robots know only what has been programmed into them.\n\nD. Because of the limitations of the top-down approach to Artificial Intelligence,\n\nattempts have been made to use a ‘bottom-up’ approach instead – that is, to\n\ntry to imitate evolution and the way a baby learns. Rodney Brooks was the\n\ndirector of MIT’s Artificial Intelligence laboratory, famous for its lumbering ‘top-\n\ndown’ walking robots. He changed the course of research when he explored the\n\nunorthodox idea of tiny ‘insectoid’ robots that learned to walk by bumping into\n\nthings instead of computing mathematically the precise position of their feet.\n\nToday many of the descendants of Brooks’ insectoid robots are on Mars\n\ngathering data for NASA (The National Aeronautics and Space Administration),\n\nrunning across the dusty landscape of the planet. For all their successes in\n\nmimicking the behavior of insects, however, robots using neural networks have\n\nperformed miserably when their programmers have tried to duplicate in them\n\nthe behavior of higher organisms such as mammals. MIT’s Marvin Minsky\n\nsummarises the problems of Al: ‘The history of Al is sort of funny because the\n\nfirst real accomplishments were beautiful things, like a machine that could do\n\nwell in a maths course. But then we started to try to make machines that could\n\nanswer questions about simple children’s stories. There’s no machine today\n\nthat can do that.’\n\nE. There are people who believe that eventually there will be a combination\n\nbetween the top- down and bottom-up, which may provide the key to Artificial\n\nIntelligence. As adults, we blend the two approaches. It has been suggested\n\nthat our emotions represent the quality that most distinguishes us as human,\n\nthat it is impossible for machines ever to have emotions. Computer expert\n\nHans Moravec thinks that in the future robots will be programmed with\n\nemotions such as fear to protect themselves so that they can signal to humans\n\nwhen their batteries are running low, for example. Emotions are vital in\n\ndecision-making. People who have suffered a certain kind of brain injury lose\n\nthe ability to experience emotions and become unable to make decisions.\n\nWithout emotions to guide them, they debate endlessly over their options.\n\nMoravec points out that as robots become more intelligent and are able to\n\nmake choices, they could likewise become paralysed with indecision. To aid\n\nthem, robots of the future might need to have emotions hardwired into their\n\nbrains.\n\nF. There is no universal consensus as to whether machines can be conscious,\n\nor even, in human terms, what consciousness means. Minsky suggests the\n\nthinking process in our brain is not localised but spread out, with different\n\ncentres competing with one another at any given time. Consciousness may\n\nthen be viewed as a sequence of thoughts and images issuing from these\n\ndifferent, smaller ‘minds’, each one competing for our attention. Robots might\n\neventually attain a ‘silicon consciousness’. Robots, in fact, might one day\n\nembody an architecture for thinking and processing information that is\n\ndifferent from ours – but also indistinguishable. If that happens, the question of\n\nwhether they really ‘understand’ becomes largely irrelevant. A robot that has\n\nperfect mastery of syntax, for all practical purposes, understands what is being\n\nsaid.\n\nA. Artificial Intelligence may require something equivalent to feelings in order to succeed.\n\nB. Different kinds of people use different parts of the brain.\n\nC. Tests involving fiction have defeated Artificial Intelligence so far.\n\nD. People have intellectual capacities which do not exist in computers.\n\nE. People have no reason to be frightened of robots\n\nWhen will we have a thinking machine?\n\nDespite some advances, the early robots had certain weaknesses. They were\n\ngiven the information they needed on a (24)………………………..This was known as the\n\n‘top-down’ approach and enabled them to do certain tasks but they were\n\nunable to recognise (25)……………………Nor did they have any intuition or ability to\n\nmake decisions based on experience. Rodney Brooks tried a different\n\napproach. Robots similar to those invented by Brooks are to be found on\n\n(26)…………………where they are collecting information.","options":[],"questions":[{"q":24,"context":"They were given the information they needed on a (24).............................This was known as the ‘top-down’ approach and enabled them to do certain tasks but they were unable to recognise (25)........................Nor did they have any intuition or ability to make decis","answerDisplay":"disc","sourcePage":20,"evidence":"using a computer in an attempt to program all the essential rules onto a single disc. By inserting this into a machine, it would then become self-aware and attain human-like intelligence. C. In the 1950s and 1960s great progress was made, but the shortcomings of","explanation":"Đ viding the\n\ntraditional resort-leisure product, it has been argued that ecotourism resort\n\nmanagement should have a particular focus on best-practice environmental\n\nmanagement, an educational and interpretive Component, and direct and\n\nindirect contributions to the conservation of the natural and cultural\n\nenvironment (Ayala. I996). Conran Cove Island Resort is a large integrated\n\necotourism-based resort located south of Brisbane on the Gold Coast,\n\nQueensland. Australia. As the world’s population becomes increasingly\n\nurbanized, the demand for tourist attractions which are environmentally\n\nfriendly, serene and offer amenities of a unique nature has grown rapidly.\n\nCouran Cove Resort, which is one such tourist attraction, is located on South\n\nStradbroke Island, occupying approximately 150 hectares of the island. South\n\nStradbroke Island is separated from the mainland by the Broadwater, a stretch\n\nof sea.’ kilometres wide. More than a century ago there was only one\n\nStradbroke Island, and there were at least four Aboriginal tribes living and\n\nlimiting on the island. Regrettably, most of the original island dwellers were\n\neventually killed by diseases such as tuberculosis, smallpox and influenza by\n\nthe end of the 19th century. The second ship wrecked on the island in 1894, and\n\nthe subsequent destruction of the ship (the Cambus Wallace) because it\n\ncontained dynamite, caused a large crater in the sandhills on Stradbroke\n\nIsland.\n\nEventually, the ocean broke through the weakened land form and Stradbroke\n\nbecame two islands. Conran Cove Island Resort is built on one of the world’s\n\nlew naturally -occurring sand lands, which is home to a wide range of plant\n\ncommunities and one of the largest remaining remnants of the rare livistona\n\nrainforest left on the Gold Coast. Many mangrove and rainforest areas, and\n\nMalaleuca Wetlands on South Stradbroke Island (and in Queensland), have\n\nbeen cleared, drained or filled for residential, industrial, agricultural or urban\n\ndevelopment in the first half of the 20th century. Farmers and graziers finally\n\nabandoned South Stradbroke Island in 1959 because the vegetation and the\n\nsoil conditions there were not suitable for agricultural activities.\n\nSUSTAINABLE PRACTICES OF COUKAN COVE RESORT\n\nBeing located on an offshore island, the resort is only accessible by means of\n\nwater transport. The resort provides hourly ferry service from the marina on the\n\nmainland to and from the island. Within the resort. transport modes include\n\nwalking trails, bicycle tracks and the beach train. The reception area is the\n\ncounter of the shop which has not changed for 8 years at least. The\n\naccommodation is an octagonal “Bure’’. These are large rooms that are clean\n\nbut the equipment is tiled and in some cases just working. Our ceiling fan only\n\nworks on high speed for example. Beds are hard but clean. There is a television,\n\na radio, an old air conditioner and a small fridge. These “Bures” are right on top\n\nof each other and night noises do carry. So he careful what you say and do. The\n\nonly tiling is the mosquitoes, but if you forget to bring mosquito repellent they\n\nsell some oil the island.\n\nAs an ecotourism-based resort most of the planning and development of the\n\nattraction lies been concentrated on the need to co-exist with the fragile\n\nnatural environment of South Stradbroke Island to achieve sustainable\n\ndevelopment.\n\nWATER AND ENERGY MANAGEMENT\n\nSouth Stradbroke Island has groundwater at the centre of the island, which has\n\na maximum height of 3 metres above sea level. The water supply is recharged\n\nby rainfall and is commonly known as an unconfined freshwater aquifer.\n\nCouran Cove Island Resort obtains its water supply by tapping into this aquifer\n\nand extracting it via a bore system. Some of the problems which have\n\nthreatened the island’s freshwater supply include pollution, contamination and\n\nover-consumption. In order to minimize some of these problems, all laundry\n\nactivities are carried out on the mainland. The resort considers washing\n\nmachines as onerous to the island’s freshwater supply, and that the detergents\n\ncontain a high level of phosphates which are a major source of water pollution.\n\nThe resort uses LPG-power generation rather than a diesel-powered plant for\n\nits energy supply, supplemented by wind turbines, which has reduced\n\ngreenhouse emissions by 70% of diesel-equivalent generation methods. Excess\n\nheat recovered from the generator is used to heat the swimming pool. Hot\n\nwater in the eco-cabins and for some of the resort’s vehicles are\n\nsolar-powered. Water efficient fittings are also installed in showers and toilets.\n\nHowever, not all the appliances used by the resort are energy efficient, such as\n\nrefrigerators. Visitors who stay at the resort are encouraged to monitor their\n\nwater and energy usage via the in-house television systems, and are rewarded\n\nwith prizes (such as a free return trip to the resort) accordingly if their usage\n\nlevel is low.\n\nCONCLUDING REMARKS\n\nWe examined a case study of good management practice and a pro-active\n\nsustainable tourism stance of an eco-resort. In three years of operation,\n\nCouran Cove Island Resort has won 23 international and national awards,\n\nincluding the 2001 Australian Tourism Award in the 4-Star Accommodation\n\ncategory.\n\nThe resort has embraced and has effectively implemented contemporary\n\nenvironmental management practices. It has been argued that the successful\n\nimplementation of the principles of sustainability should promote long-term\n\nsocial, economic and environmental benefits, while ensuring and enhancing\n\nthe prospects of continued viability for the tourism enterprise. Couran Cove\n\nIsland Resort does not conform to the characteristics of the Resort\n\nDevelopment Spectrum, as proposed by Pridcaux (2000). According to\n\nPridcaux. The resort should be at least at Phase 3 of the model (the National\n\ntourism phase), which describes an integrated resort providing 3-4 star\n\nhotel-type accommodation.\n\nThe primary tourist market in Phase 3 of the model consists mainly of interstate\n\nvisitors. However, the number of interstate and international tourists visiting the\n\nresort is small, with the principal visitor markets comprising locals and\n\nresidents in nearby towns and the Gold Coast region. The carrying capacity of\n\nCouran Cove does not seem to be of any concern to the Resort management.\n\nGiven that it is a private commercial ecotourist enterprise, regulating the\n\nnumber of visitors to the resort to minimise damage done to the natural\n\nenvironment on South Stradbroke Island is not a binding constraint. However,\n\nthe Resort’s growth will eventually be constrained by its carrying capacity, and\n\nquantity control should be incorporated in the management strategy of the\n\nresort.","options":[],"questions":[{"q":19,"context":"to obtain its water supply via a bore system Being located away from the mainland, tourists can attain the resort only by (19)........................in a regular service provided by the resort itself. Within the resort, transports include trails for walking or tracks for both (20).................................and the beach train. The on-island eq","answerDisplay":"ferry","sourcePage":26,"evidence":"Being located on an offshore island, the resort is only accessible by means of water transport. The resort provides hourly ferry service from the marina on the mainland to and from the island. Within the resort. transport modes include walking trails, bicycle tracks and the beach train. The reception area is the","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “to obtain its water supply via a bore system PRACTICE TEST 4 Being located away from the mainland, tourists can attain the resort only by (19)........................in a regula osquitoes” phù hợp với cấu trúc câu và yêu cầu NO MORE THAN TWO WORDS. Đây là dạng lấy từ/cụm từ trong passage: sau khi xác định đúng vùng evidence, phải chép đúng chính tả và không vượt quá giới hạn từ. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'mosquitoes' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"mosquitoes","correctText":"mosquitoes","inputType":"text"}],"sourceNote":""},{"id":6,"title":"The Future of the World’s Language","instruction":"CHOOSE FROM LIST A–J","sourcePages":"31–37","passage":"Of the world’s 6,500 living languages, around half are expected to the out by\n\nthe end of this century, according to UNESCO. Just 11 are spoken by more than\n\nhalf of the earth’s population, so it is little wonder that those used by only a few\n\nare being left behind as we become a more homogenous, global society. In\n\nshort, 95 percent of the world’s languages are spoken by only five percent of its\n\npopulation—a remarkable level of linguistic diversity stored in tiny pockets of\n\nspeakers around the world. Mark Turin, a university professor, has launched\n\nWOLP (World Oral Language Project) to prevent the language from the brink of\n\nextinction.\n\nHe is trying to encourage indigenous communities to collaborate with\n\nanthropologists around the world to record what he calls “oral literature”\n\nthrough video cameras, voice recorders and other multimedia tools by\n\nawarding grants from a £30,000 pot that the project has secured this year. The\n\nidea is to collate this literature in a digital archive that can be accessed on\n\ndemand and will make the nuts and bolts of lost cultures readily available.For\n\nmany of these communities, the oral tradition is at the heart of their culture.\n\nThe stories they tell are creative as well as communicative. Unlike the\n\nlanguages with celebrated written traditions, such as Sanskrit, Hebrew and\n\nAncient Greek, few indigenous communities have recorded their own\n\nlanguages or ever had them recorded until now. The project suggested itself\n\nwhen Turin was teaching in Nepal. He wanted to study for a PhD in endangered\n\nlanguages and, while discussing it with his professor at Leiden University in the\n\nNetherlands, was drawn to a map on his tutor’s wall.\n\nThe map was full of pins of a variety of colours which represented all the\n\nworld’s languages that were completely undocumented. At random, Turin\n\nchose a “pin” to document. It happened to belong to the Thangmi tribe, an\n\nindigenous community in the hills east of Kathmandu, the capital of Nepal.\n\n“Many of the choices anthropologists and linguists who work on these\n\ntraditional field-work projects are quite random,” he admits.\n\nContinuing his work with the Thangmi community in the 1990s, Turin began to\n\nrecord the language he was hearing, realising that not only was this language\n\nand its culture entirely undocumented, it was known to few outside the tiny\n\ncommunity. He set about trying to record their language and myth of origins. “I\n\nwrote 1,000 pages of grammar in English that nobody could use—but I realised\n\nthat wasn’t enough. It wasn’t enough for me, it wasn’t enough for them. It\n\nsimply wasn’t going to work as something for the community. So then I\n\nproduced this trilingual word list in Thangmi, Nepali and English.” In short, it\n\nwas the first ever publication of that language. That small dictionary is still sold\n\nin local schools for a modest 20 rupees, and used as part of a wider cultural\n\nregeneration process to educate children about their heritage and language.\n\nThe task is no small undertaking: Nepal itself is a country of massive ethnic and\n\nlinguistic diversity, home to 100 languages from four different language\n\nfamilies. What’s more, even fewer ethnic Thangmi speak the Thangmi\n\nlanguage.\n\nMany of the community members have taken to speaking Nepali, the national\n\nlanguage taught in schools and spread through the media, and community\n\nelders are dying without passing on their knowledge. Despite Turin’s\n\nenthusiasm for his subject, he is baffled by many linguists’ refusal to engage in\n\nthe issue he is working on. “Of the 6,500 languages spoken on Earth, many do\n\nnot have written traditions and many of these spoken forms are endangered,”\n\nhe says. “There are more linguists in universities around the world than there\n\nare spoken languages—but most of them aren’t working on this issue.\n\nTo me it’s amazing that in this day and age, we still have an entirely\n\nincomplete image of the world’s linguistic diversity. People do PhDs on the\n\napostrophe in French, yet we still don’t know how many languages are spoken.”\n\n“When a language becomes endangered, so too does a cultural worldview.\n\nWe want to engage with indigenous people to document their myths and\n\nfolklore, which can be harder to find funding for if you are based outside\n\nWestern universities.” Yet, despite the struggles facing initiatives such as the\n\nWorld Oral Literature Project, there are historical examples that point to the\n\npossibility that language restoration is no mere academic pipe dream. The\n\nrevival of a modern form of Hebrew in the 19th century is often cited as one of\n\nthe best proofs that languages long dead, belonging to small communities,\n\ncan be resurrected and embraced by a large number of people. By the 20th\n\ncentury, Hebrew was well on its way to becoming the main language of the\n\nJewish population of both Ottoman and British Palestine. It is now spoken by\n\nmore than seven million people in Israel.\n\nYet, despite the difficulties these communities face in saving their languages,\n\nDr Turin believes that the fate of the world’s endangered languages is not\n\nsealed, and globalisation is not necessarily the nefarious perpetrator of evil it is\n\noften presented to be. “I call it the globalisation paradox: on the one hand\n\nglobalisation and rapid socio-economic change are the things that are\n\neroding and challenging diversity But on the other, globalisation is providing us\n\nwith new and very exciting tools and facilities to get to places to document\n\nthose things that globalisation is eroding. Also, the communities at the\n\ncoal-face of change are excited by what globalisation has to offer.”\n\nIn the meantime, the race is on to collect and protect as many of the\n\nlanguages as possible, so that the Rai Shaman in eastern Nepal and those in\n\nthe generations that follow him can continue their traditions and have a sense\n\nof identity. And it certainly is a race: Turin knows his project’s limits and\n\nbelieves it inevitable that a large number of those languages will disappear.\n\n“We have to be wholly realistic.\n\nA project like ours is in no position, and was not designed, to keep languages\n\nalive. The only people who can help languages survive are the people in those\n\ncommunities themselves. They need to be reminded that it’s good to speak\n\ntheir own language and I think we can help them do that—becoming modem\n\ndoesn’t mean you have to lose your language.”\n\nOf the world’s 6,500 living languages, about half of them are expected to be\n\nextinct. Most of the world’s languages are spoken by a (27)…………………of people.\n\nHowever, Professor Turin set up a project WOLP to prevent (28)……………….of the\n\nlanguages.\n\nwith new and very exciting tools and facilities to get to places to document\n\nthose things that globalisation is eroding. Also, the communities at the\n\ncoal-face of change are excited by what globalisation has to offer.”\n\nIn the meantime, the race is on to collect and protect as many of the\n\nlanguages as possible, so that the Rai Shaman in eastern Nepal ns and gathering market\n\nintelligence. ‘In many cases, they can outperform humans,’ says Pachidi.\n\n‘Organisations are attracted to using algorithms because they want to make\n\nchoices based on what they consider is “perfect information”, as well as to\n\nreduce costs and enhance productivity.’‘But these enhancements are not\n\nwithout consequences,’ says Pachidi. ‘If routine cognitive tasks are taken over\n\nby AI, how do professions develop their future experts?’ she asks. ‘One way of\n\nlearning about a job is “legitimate peripheral participation” – a novice stands\n\nnext to experts and learns by observation. If this isn’t happening, then you need\n\nto find new ways to learn.’\n\nAnother issue is the extent to which technology influences or even controls the\n\nworkforce. For over two years, Pachidi monitored a telecommunications\n\ncompany. ‘The way telecoms salespeople work is through personal and\n\nfrequent contact with clients, using the benefit of experience to assess a\n\nsituation and reach a decision. However, the company had started using a[n]\n\n… algorithm that defined when account managers should contact certain\n\ncustomers about which kinds of campaigns and what to offer them.’\n\nThe algorithm – usually built by external designers – often becomes the keeper\n\nof knowledge, she explains. In cases like this, Pachidi believes, a short-sighted\n\nview begins to creep into working practices whereby workers learn through the\n\n‘algorithm’s eyes’ and become dependent on its instructions. Alternative\n\nexplorations – where experimentation and human instinct lead to progress\n\nand new ideas – are effectively discouraged. Pachidi and colleagues even\n\nobserved people developing strategies to make the algorithm work to their\n\nown advantage. ‘We are seeing cases where workers feed the algorithm with\n\nfalse data to reach their targets,’ she reports.\n\nIt’s scenarios like these that many researchers are working to avoid. Their\n\nobjective is to make AI technologies more trustworthy and transparent, so that\n\norganisations and individuals understand how AI decisions are made. In the\n\nmeantime, says Pachidi, ‘We need to make sure we fully understand the\n\ndilemmas that this new world raises regarding expertise, occupational\n\nboundaries and control.’\n\nEconomist Professor Hamish Low believes that the future of work will involve\n\nmajor transitions across the whole life course for everyone: ‘The traditional\n\ntrajectory of full-time education followed by full-time work followed by a\n\npensioned retirement is a thing of the past,’ says Low. Instead, he envisages a\n\nmultistage employment life: one where retraining happens across the life\n\ncourse, and where multiple jobs and no job happen by choice at different\n\nstages.\n\nOn the subject of job losses, Low believes the predictions are founded on a\n\nfallacy: ‘It assumes that the number of jobs is fixed. If in 30 years, half of 100\n\njobs are being carried out by robots, that doesn’t mean we are left with just 50\n\njobs for humans. The number of jobs will increase: we would expect there to be\n\n150 jobs.’ Dr Ewan McGaughey, at Cambridge’s Centre for Business Research\n\nand King’s College London, agrees that ‘apocalyptic’ views about the future of\n\nwork are misguided. ‘It’s the laws that restrict the supply of capital to the job\n\nmarket, not the advent of new technologies that causes unemploymen.’\n\nHis recently published research answers the question of whether automation,\n\nAI and robotics will mean a ‘jobless future’ by looking at the causes of\n\nunemployment. ‘History is clear that change can mean redundancies. But\n\nsocial policies can tackle this through retraining and redeployment.’ He adds:\n\n‘If there is going to be change to jobs as a result of AI and robotics then I’d like\n\nto see governments seizing the opportunity to improve policy to enforce good\n\njob security.\n\nWe can “reprogramme” the law to prepare for a fairer future of work and\n\nleisure.’ McGaughey’s findings are a call to arms to leaders of organisations,\n\ngovernments and banks to pre-empt the coming changes with bold new\n\npolicies that guarantee full employment, fair incomes and a thriving economic\n\ndemocracy. ‘The promises of these new technologies are astounding. They\n\ndeliver humankind the capacity to live in a way that nobody could have once\n\nimagined,’ he adds. ‘Just as the industrial revolution brought people past\n\nsubsistence agriculture, and the corporate revolution enabled mass\n\nproduction, a third revolution has been pronounced. But it will not only be one\n\nof technology. The next revolution will be social.","options":[{"id":"A","text":"pressure"},{"id":"B","text":"satisfaction"},{"id":"C","text":"intuition"},{"id":"D","text":"promotion"},{"id":"E","text":"reliance"},{"id":"F","text":"confidence"},{"id":"G","text":"information"}],"questions":[{"q":31,"context":"on’ of jobs Stella Pachidi of Cambridge Judge Business School has been focusing on the ‘algorithmization’ of jobs which rely not on production but on (31) ....................... While monitoring a telecommunications company, Pachidi observed a growing (32) ......................... on the recommendations made by Al, as workers begin to learn through the ‘algorithm’s eyes’. Mea","answerDisplay":"G – information","sourcePage":38,"evidence":"‘Organisations are attracted to using algorithms because they want to make choices based on what they consider is “perfect information”, as well as to 115","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “on’ of jobs Stella Pachidi of Cambridge Judge Business School has been focusing on the ‘algorithmization’ of jobs which rely not on production but on (31) ....................... While monitoring a telecommunications company, Pachidi observed a growing (32)...”. Passage cung cấp bằng chứng “‘Organisations are attracted to using algorithms because they want to make choices b o avoid. Their objective is to make AI technologies more trustworthy and transparent, so that organisations and individuals understand how AI decisions are made. In the meantime, says Pachidi, ‘We need to make sure we fully understand the","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “e kind of situations which Pachidi observed, researchers are trying to make Al’s decision-making process easier to comprehend, and to increase users’ (34) ...................... with regard to technology. PRACTICE TEST 6 A. pressure B. satisfaction C....”. Passage cung cấp bằng chứng “It’s scenarios like these that many researchers are working to avoid. Their objective is to make AI technologies more trustworthy and transparent, so that organisations and individuals understand how AI decisions are made. In the meantime, says Pachidi, ‘We need to make sure we fully understand the”. Điểm quyết định là thông tin trong passage dẫn đến “confidence”; vì vậy đáp án này hoàn chỉnh đúng ý của câu tóm tắt chứ không chỉ trùng một từ khóa rời rạc. Về ngữ pháp, vị trí trống cần danh từ/cụm danh từ hoặc cụm từ cố định; “confidence” phù hợp với cấu trúc câu và yêu cầu CHOOSE FROM LIST A–G. Đây là dạng chọn từ/cụm trong danh sách: đáp án không nhất thiết lặp nguyên văn trong passage; điều bắt buộc là nghĩa của phương án phải khớp chính xác với evidence. Trước khi chốt đáp án cần kiểm tra thêm số ít/số nhiều, dạng từ, mạo từ đi kèm và số từ tối đa. Bẫy chính là chọn một chi tiết nằm gần evidence nhưng sai quan hệ nghĩa, hoặc bỏ qua phần paraphrase khiến câu summary không còn tương đương với passage.","paraphrase":"ý trong summary ↔ passage: cụm 'confidence' hoặc thông tin tương đương được xác nhận bởi evidence đã trích.","warning":"","correct":"F","correctText":"confidence","inputType":"select"}],"sourceNote":""},{"id":8,"title":"I contain Multitudes","instruction":"CHOOSE FROM LIST A–H","sourcePages":"44–49","passage":"Microbes, most of them bacteria, have populated this planet since long before\n\nanimal life developed and they will outlive us. Invisible to the naked eye, they\n\nare ubiquitous. They inhabit the soil, air, rocks and water and are present within\n\nevery form of life, from seaweed and coral to dogs and humans. And, as Yong\n\nexplains in his utterly absorbing and hugely important book, we mess with\n\nthem at our peril.\n\nEvery species has its own colony of microbes, called a ‘microbiome’, and these\n\nmicrobes vary not only between species but also between individuals and\n\nwithin different parts of each individual. What is amazing is that while the\n\nnumber of human cells in the average person is about 30 trillion, the number of\n\nmicrobial ones is higher – about 39 trillion. At best, Yong informs us, we are\n\nonly 50 percent human. Indeed, some scientists even suggest we should think\n\nof each species and its microbes as a single unit, dubbed a ‘holobiont’.\n\nIn each human there are microbes that live only in the stomach, the mouth or\n\nthe armpit and by and large they do so peacefully.\n\nSo ‘bad’ microbes are just microbes out of context. Microbes that sit\n\ncontentedly in the human gut (where there are more microbes than there are\n\nstars in the galaxy) can become deadly if they find their way into the\n\nbloodstream. These communities are constantly changing too. The right hand\n\nshares just one sixth of its microbes with the left hand. And, of course, we are\n\nsurrounded by microbes. Every time we eat, we swallow a million microbes in\n\neach gram of food; we are continually swapping microbes with other humans,\n\npets and the world at large.\n\nIt’s a fascinating topic and Yong, a young British science journalist, is an\n\nextraordinarily adept guide. Writing with lightness and panache, he has a\n\nknack of explaining complex science in terms that are both easy to understand\n\nand totally enthralling. Yong is on a mission. Leading us gently by the hand, he\n\ntakes us into the world of microbes – a bizarre, alien planet – in a bid to\n\npersuade us to love them as much as he does. By the end, we do.\n\nFor most of human history we had no idea that microbes existed. The first man\n\nto see these extraordinarily potent creatures was a Dutch lens-maker called\n\nAntony van Leeuwenhoek in the 1670s. Using microscopes of his own design\n\nthat could magnify up to 270 times, he examined a drop of water from a\n\nnearby lake and found it teeming with tiny creatures he called ‘animalcules’. It\n\nwasn’t until nearly two hundred years later that the research of French biologist\n\nLouis Pasteur indicated that some microbes caused disease. It was Pasteur’s\n\n‘germ theory’ that gave bacteria the poor image that endures today. Yong’s\n\nbook is in many ways a plea for microbial tolerance, pointing out that while\n\nfewer than one hundred species of bacteria bring disease, many thousands\n\nmore play a vital role in maintaining our health. The book also acknowledges\n\nthat our attitude towards bacteria is not a simple one. We tend to see the\n\ndangers posed by bacteria, yet at the same time we are sold yoghurts and\n\ndrinks that supposedly nurture ‘friendly’ bacteria. In reality, says Yong, bacteria\n\nshould not be viewed as either friends or foes, villains or heroes. Instead we\n\nshould realise we have a symbiotic relationship, that can be mutually\n\nbeneficial or mutually destructive. What then do these millions of organisms\n\ndo? The answer is pretty much everything. New research is now unravelling the\n\nways in which bacteria aid digestion, regulate our immune systems, eliminate\n\ntoxins, produce vitamins, affect our behaviour and even combat obesity.\n\n‘They actually help us become who we are,’ says Yong. But we are facing a\n\ngrowing problem. Our obsession with hygiene, our overuse of antibiotics and\n\nour unhealthy, low-fibre diets are disrupting the bacterial balance and may be\n\nresponsible for soaring rates of allergies and immune problems, such as\n\ninflammatory bowel disease (IBD). The most recent research actually turns\n\naccepted norms upside down. For example, there are studies indicating that\n\nthe excessive use of household detergents and antibacterial products actually\n\ndestroys the microbes that normally keep the more dangerous germs at bay.\n\nOther studies show that keeping a dog as a pet gives children early exposure\n\nto a diverse range of bacteria, which may help protect them against allergies\n\nlater. The readers of Yong’s book must be prepared for a decidedly\n\nunglamorous world. Among the less appealing case studies is one about a\n\nfungus that is wiping out entire populations of frogs and that can be halted by\n\na rare microbial bacterium. Another is about squid that carry luminescent\n\nbacteria that protect them against predators.\n\nHowever, if you can overcome your distaste for some of the investigations, the\n\nreasons for Yong’s enthusiasm become clear. The microbial world is a place of\n\nwonder. Already, in an attempt to stop mosquitoes spreading dengue fever – a\n\ndisease that infects 400 million people a year – mosquitoes are being loaded\n\nwith a bacterium to block the disease. In the future, our ability to manipulate\n\nmicrobes means we could construct buildings with useful microbes built into\n\ntheir walls to fight off infections. Just imagine a neonatal hospital ward coated\n\nin a specially mixed cocktail of microbes so that babies get the best start in life.\n\nWe should be more tolerant of microbes\n\nYong’s book argues that we should be more tolerant of microbes. Many have a\n\nbeneficial effect, and only a relatively small number lead to (17) ……………….. and\n\nalthough it is misleading to think of microbes as ‘friendly’, we should also stop\n\nthinking of them as the enemy. In fact, we should accept that our relationship\n\nwith microbes is one based on (18) ……………… New research shows that\n\nmicrobes have numerous benefits for humans.\n\nAmongst other things, they aid digestion, remove poisons, produce vitamins\n\nand may even help reduce obesity. However, there is a growing problem. Our\n\npoor (19) ………………, our overuse of antibiotics, and our excessive focus on (20)\n\n……………………. are upsetting the bacterial balance and may be contributing to\n\nthe huge increase in allergies and immune system problems.\n\nA. solution\n\nB. partnership\n\nC. destruction\n\nD. exaggeration\n\nE. cleanliness\n\nF. regulations\n\nG. illness\n\nH. nutrition","options":[{"id":"A","text":"solution"},{"id":"B","text":"partnership"},{"id":"C","text":"destruction"},{"id":"D","text":"exaggeration"},{"id":"E","text":"cleanliness"},{"id":"F","text":"regulations"},{"id":"G","text":"illness"},{"id":"H","text":"nutrition"}],"questions":[{"q":17,"context":"Many have a beneficial effect, and only a relatively small number lead to (17) .................... and although it is misleading to think of microbes as ‘friendly’, we should also stop thinking of them as the enemy. In fact, we should accept that our relationship with microbes is one based on (18)","answerDisplay":"G – illness","sourcePage":46,"evidence":"book is in many ways a plea for microbial tolerance, pointing out that while fewer than one hundred species of bacteria bring disease, many thousands more play a vital role in maintaining our health. The book also acknowledges that our attitude towards bacteria is not a simple one. We tend to see the","explanation":"Đối chiếu trực tiếp: summary đặt chỗ trống trong ngữ cảnh “Many have a beneficial effect, and only a relatively small number lead to (17) .................... and although it is misleading to think of microbes as ‘friendly’, we should also stop thinking of them as the enemy. In fact, we should accept that our...”. Passage cung cấp bằng chứng “book is in many ways a plea for microbial tolerance, pointing out that while fewer than one hundred species of bacteria bring disease, many thousands more play a vital role in maintaining our health sions","instruction":"CHOOSE FROM LIST A–J","sourcePages":"50–55","passage":"Across cultures, wisdom has been considered one of the most revered human\n\nqualities. Although the truly wise may seem few and far between, empirical\n\nresearch examining wisdom suggests that it isn’t an exceptional trait\n\npossessed by a small handful of bearded philosophers after all – in fact, the\n\nlatest studies suggest that most of us have the ability to make wise decisions,\n\ngiven the right context.\n\n‘It appears that experiential, situational, and cultural factors are even more\n\npowerful in shaping wisdom than previously imagined,’ says Associate\n\nProfessor Igor Grossmann of the University of Waterloo in Ontario, Canada.\n\n‘Recent empirical findings from cognitive, developmental, social, and\n\npersonality psychology cumulatively suggest that people’s ability to reason\n\nwisely varies dramatically across experiential and situational contexts.\n\nUnderstanding the role of such contextual factors offers unique insights into\n\nunderstanding wisdom in daily life, as well as how it can be enhanced and\n\ntaught.\n\n’It seems that it’s not so much that some people simply possess wisdom and\n\nothers lack it, but that our ability to reason wisely depends on a variety of\n\nexternal factors. ‘It is impossible to characterise thought processes attributed\n\nto wisdom without considering the role of contextual factors,’ explains\n\nGrossmann. ‘In other words, wisdom is not solely an “inner quality” but rather\n\nunfolds as a function of situations people happen to be in. Some situations are\n\nmore likely to promote wisdom than others.’\n\nComing up with a definition of wisdom is challenging, but Grossmann and his\n\ncolleagues have identified four key characteristics as part of a framework of\n\nwise reasoning. One is intellectual humility or recognition of the limits of our\n\nown knowledge, and another is appreciation of perspectives wider than the\n\nissue at hand. Sensitivity to the possibility of change in social relations is also\n\nkey, along with compromise or integration of different attitudes and beliefs.\n\nGrossmann and his colleagues have also found that one of the most reliable\n\nways to support wisdom in our own day-to-day decisions is to look at\n\nscenarios from a third-party perspective, as though giving advice to a friend.\n\nResearch suggests that when adopting a first-person viewpoint we focus on\n\n‘the focal features of the environment’ and when we adopt a third-person,\n\n‘observer’ viewpoint we reason more broadly and focus more on interpersonal\n\nand moral ideals such as justice and impartiality.\n\nLooking at problems from this more expansive viewpoint appears to foster\n\ncognitive processes related to wise decisions. What are we to do, then, when\n\nconfronted with situations like a disagreement with a spouse or negotiating a\n\ncontract at work, that require us to take a personal stake? Grossmann argues\n\nthat even when we aren’t able to change the situation, we can still evaluate\n\nthese experiences from different perspectives. For example, in one experiment\n\nthat took place during the peak of a recent economic recession, graduating\n\ncollege seniors were asked to reflect on their job prospects.\n\nThe students were instructed to imagine their career either ‘as if you were a\n\ndistant observer’ or ‘before your own eyes as if you were right there’.\n\nParticipants in the group assigned to the ‘distant observer’ role displayed more\n\nwisdom-related reasoning (intellectual humility and recognition of change)\n\nthan did participants in the control group. In another study, couples in\n\nlong-term romantic relationships were instructed to visualize an unresolved\n\nrelationship conflict either through the eyes of an outsider or from their own\n\nperspective. Participants then discussed the incident with their partner for 10\n\nminutes, after which they wrote down their thoughts about it.\n\nCouples in the ‘other’s eyes’ condition were significantly more likely to rely on\n\nwise reasoning – recognizing others’ perspectives and searching for a\n\ncompromise – compared to the couples in the egocentric condition.\n\n‘Ego-decentering promotes greater focus on others and enables a bigger\n\npicture, conceptual view of the experience, affording recognition of intellectual\n\nhumility and change,’ says Grossmann. We might associate wisdom with\n\nintelligence or particular personality traits, but research shows only a small\n\npositive relationship between wise thinking and crystallized intelligence and\n\nthe personality traits of openness and agreeableness.\n\n‘It is remarkable how much people can vary in their wisdom from one situation\n\nto the next, and how much stronger such contextual effects are for\n\nunderstanding the relationship between wise judgement and its social and\n\naffective outcomes as compared to the generalized “traits”,’ Grossmann\n\nexplains. ‘That is, knowing how wisely a person behaves in a given situation is\n\nmore informative for understanding their emotions or likelihood to forgive [or]\n\nretaliate as compared to knowing whether the person may be wise “in\n\ngeneral”.’","options":[{"id":"A","text":"opinions"},{"id":"B","text":"confidence"},{"id":"C","text":"view"},{"id":"D","text":"modesty"},{"id":"E","text":"problems"},{"id":"F","text":"objectivity"},{"id":"G","text":"fairness"},{"id":"H","text":"experiences"},{"id":"I","text":"range"},{"id":"J","text":"reasons"}],"questions":[{"q":31,"context":"or Grossmann and colleagues have established four characteristics which enable us to make wise decisions. It is important to have a certain degree of (31) ...................... regarding the extent of our knowledge, and to take into account (32) ....................... which may not be the same as our own. We should also be able to take a broad (33) ........................ of","answerDisplay":"D – modesty","sourcePage":51,"evidence":"colleagues
