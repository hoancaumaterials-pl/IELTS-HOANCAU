dolescence, children's thinking is dominated by a need to have a concrete example for any problem that they solve. Their thinking is constrained to what is real and physical. During adolescence, young people begin to recognize and understand abstractions, The adolescent must adjust to increased cognitive (adj.iA jaf’) demands at school. Adults see high school in part as a place where adolescents prepare for adult roles and responsibilities and in part as preparatory for further education. School curricula are frequently dominated by inclusion of more abstract, demanding material, regardless of whether the adolescents have achieved formal thought. Since not all adolescents make the intellectual transition at the same rate, demands for abstract thinking prior to achievement of that ability may be frustrating.\n\nG During adolescence, as teens develop increasingly complex knowledge systems and a sense of self, they also adopt an integrated set of values and morals (nlf\n\n#2). During the early stages of moral development, parents provide their child with a structured set of rules of what is right and wrong, what is acceptable and unacceptable. Eventually the adolescent must assess the parents' values as they come into conflict (n.*'%) with values expressed by\n peers and other segments of society. To reconcile Bian) 4J.o% differences, the adolescent restructures those beliefs\n into a personal ideology.\n The adolescent must develop expanded verbal skills. As adolescents mature intellectually, as they face increased school demands, and as they prepare for adult roles, they must develop new verbal skills to accommodate more complex (adj. & 4X0) concepts and tasks. Their limited language of childhood is no longer adequate (adj. 4489). Adolescents may appear less competent because of their inability to express themselves meaningfully,\n The adolescent must establish emotional (adj. fi 8809)\nand psychological independence from his or her parents, Childhood is marked by strong dependence on one's parents. Adolescents may yearn to keep that safe, secure, supportive, dependent relationship. Yet, to be an adult implies a sense of independence, of autonomy, of being one's own person. Adolescents may vacillate between their desire for dependence and their need to be independent. In an attempt to assert their need for independence and individuality, adolescents may respond with what appears to be hostility and lack (n.ikt 2) of cooperation.\n Adolescents do not progress through these multiple developmental tasks separately. At any given time, adolescents may be dealing with several. Further, the centrality of specific developmental tasks varies with early, middle, and late periods of the transition.\n i: UM: ie: i\n 10 | 16 | 18 | 20 | 40 | 44 | 46 | 48 | 50 |", "options": {"A": "form personal identity with a set of morals and values.", "B": "develop stable and productive peer relationships.", "C": "are designed to be more challenging than some can accept.", "D": "varies from person to person.", "E": "focuses on creating self-image.", "F": "become an extension of their parents."}, "questions": [{"number": "7", "stem": "One of Havighurst’s research", "answer": "E", "ending": "focuses on creating self-image", "evidence": "“developing a conscious sense of self… is one of the developmental tasks”", "paraphrase": "self-image ↔ sense of self", "explanation": "E khớp trọng tâm nhiệm vụ phát triển."}, {"number": "8", "stem": "High school courses", "answer": "C", "ending": "are designed to be more challenging than some can accept", "evidence": "“demands for abstract thinking prior to achievement… may be frustrating”", "paraphrase": "more challenging than some can accept ↔ demands before ability is achieved", "explanation": "C đúng vì tốc độ phát triển nhận thức không đồng đều."}, {"number": "9", "stem": "Adolescence is a time when young people", "answer": "A", "ending": "form personal identity with a set of morals and values", "evidence": "“the adolescent restructures those beliefs into a personal ideology”", "paraphrase": "personal identity/morals/values ↔ personal ideology", "explanation": "A đúng quá trình tái cấu trúc hệ giá trị."}, {"number": "10", "stem": "The developmental speed of thinking patterns", "answer": "D", "ending": "varies from person to person", "evidence": "“not all adolescents make the intellectual transition at the same rate”", "paraphrase": "varies ↔ not at the same rate", "explanation": "D là paraphrase trực tiếp."}]}, {"id": 10, "title": "Pollinators / The Fragile Agricultural System", "passage": "EXERCSE 10\n You should spend about 20 minutes on Questions 27-40, which are based on Reading Passage 3 below.\n Honey bees in trouble\n Can native pollinators fill the gap?\n\nA Recently, ominous headlines have described a mysterious ailment, colony collapse disorder(CCD), that is wiping out the honeybees that pollinate many crops, Without honeybees, the story goes, fields will be sterile, economies will collapse, and food will be scarce.\n\nB But what few accounts acknowledge is that what's at risk is not itself a natural state of affairs, For one thing, in the United States, where CCD was first reported and has had its greatest impacts, honeybees are not a native species, Pollination in modern agriculture isn't alchemy, it's industry, The total number of hives involved in the U.S. pollination industry has been somewhere between 2.5 lee Senn million and 3 million in recent years. Meanwhile, American -gjgpeyeay farmers began using large quantities of organophosphate insecticides, planted large-scale crop monocultures, and adopted iPhone “clean farming\" practices that scrubbed native vegetation from field margins and roadsides, These practices killed many native bees outnght--they’re as vulnerable to insecticides as any agricultural pest--and made the agricultural landscape inhospitable to those that remained. Concern about these practices and their effects on pollinators isn't new--in her 1962 ecological alarm cry Silent Spring, Rachel Carson wamed of a ‘Fruitless Fall’ that could result from the disappearance of insect pollinators.\n Cc If that ‘Fruitless Fall’ has not--yet--occurred, it may be largely thanks to the honeybee, which farmers turned to as the ability of wild pollinators to service crops declined. The honeybee has been semi-domesticated since the time of the ancient Egyptians, but it wasn't just familiarity that determined this choice: the bees' biology is in many ways suited to the kind of agricultural system that was emerging. For example, honeybee hives can be closed up and moved out of the way when pesticides are applied to a field. The bees are generalist pollinators, so they can be used to pollinate many different crops. And although they are not the most efficient pollinator of every crop, honeybees have strength in numbers, with 20,000 to 100,000 bees living in a single hive. \"Without a doubt, if there was one bee you wanted for agriculture, it would be the honeybee,\" says Jim Cane, of the U.S. Department of Agriculture. The honeybee, in other words, has become a crucial cog in the modern system of industrial agriculture, That system delivers\n\nA Tic TE: EE: x 67\n\nmore food, and more kinds of it, to more places, more cheaply than ever before, But that system is also vulnerable, because making a farm field into the photosynthetic equivalent of a factory floor, and pollination into a series of continent-long assembly lines, also leaches out some of the resilience characteristic of natural ecosystems.\n Breno Freitas, an agronomist, pointed out that in nature such a high degree of Specialization usually is a very dangerous game: it works well while all the rest is in equilibrium, but runs quickly to extinction at the least disbalance. In effect, by developing an agricultural system that is heavily reliant on a single pollinator species, we humans have become riskily overspecialized. And when the human-honeybee relationship is disrupted, as it has been by colony collapse disorder, the vulnerability of that agricultural system begins to become clear.\n In fact, a few wild bees are already being successfully managed for crop pollination. \"The problem is trying to provide native bees in adequate numbers on a reliable basis in a fairly short number of years in order to service the crop,” Jim Cane says. \"You're talking millions of flowers per acre in a two-to three-week time frame, or less, for a lot of crops.\" On the other hand, native bees can be much more efficient pollinators of certain crops than honeybees, so you don't need as many to do the job, For example, about 750 blue orchard bees (Osmia lignaria) can pollinate a hectare of apples or almonds, a task that would require roughly 50,000 to 150,000 honeybees. There are bee tinkerers engaged in similar work in many corners of the world. In Brazil, Breno Freitas has found that Centris tarsata, the native pollinator\n growers provide a source of floral oils, such as by interplanting their cashew trees with Caribbean cherry.\n In certain places, native bees may already be doing more than they're getting credit for. Ecologist Rachael Winfree recently led a team that looked at pollination of four summer crops (tomato, watermelon, peppers, and muskmelon)\nat 29 farms in the region of New Jersey and Pennsylvania. Winfree's team identified 54 species of wild bees that visited these crops, and found that wild bees were the most important pollinators in the system: even though managed honeybees were present on many of the farms, wild bees were responsible for 62 percent of flower visits in the study. In another study focusing specifically on watermelon, Winfree and her colleagues calculated that native bees alone could provide sufficient pollination at 90 percent of the 23 farms studied. By contrast, honeybees alone could provide sufficient pollination at only 78 percent of farms.\n \"The region I work in is not typical of the way most food is produced,\" Winfree\n admits. In the Delaware Valley, most farms and farm fields are relatively small, each farmer typically grows a variety of crops, and farms are interspersed with\n a ae a\n\nsuburbs and other types of land use which means there are opportunities for homeowners to get involved in bee conservation, too. The landscape is a bee-friendly patchwork that provides a variety of nesting habitat and floral resources distributed among different kinds of crops, weedy field margins, fallow fields, suburban neighborhoods, and semi natural habitat like old woodlots, all at a relatively small scale. In other words, \"pollinator-friendly\" farming practices would not only aid pollination of agricultural crops, but also serve as a key clement in the over all conservation strategy for wild pollinators, and often aid other wild species as well.\n\nH Of course, not all farmers will be able to implement all of these practices. And researchers are suggesting a shift to a kind of polyglot agricultural system. For some small-scale farms, native bees may indeed be all that's needed. For larger operations, a suite of managed bees--with honeybees filling the generalist role and other, native bees pollinating specific crops--could be augmented by free pollination services from resurgent wild pollinators. In other words, they're saying, we still have an opportunity to replace a risky monoculture with something diverse, resilient, and robust.\n , AR PEM ETAT\n naar me aneenamnanniacee ieee een: =\n EMEA MMM A, BRA KES MAR EM IK ER EA, MHEAALA: HF Mapp, Vis) SRARMMCFRK\n ae a a | lh", "options": {"A": "native pollinators can survive when a specific plant is supplied.", "B": "it would cause severe consequences both to commerce and agriculture.", "C": "honeybees cannot be bred.", "D": "some agricultural landscapes are favorable in supporting wild bees.", "E": "a large number of honeybees are needed to pollinate.", "F": "an agricultural system is fragile when relying on a single p rom aging, she slept on a Lodestone to keep her skin youthful. Ancient Romans also used magnet therapy to\n a Cc Ee es OO: le\n\ntreat eye disease.\n\nD The popularity of magnet therapy in the United States began to rise during the 1800s and soared in the post-Civil War era. Sears-Roebuck advertised magnetic jewelry in its catalog for the healing of virtually any ailment. An Austrian psychoanalyst by the name of Wilhelm\n How Magnets Work Reich immigrated to the United States Arery in 1939 and researched the effects of electromagnetism on humans. Today,\n = Germany, Japan, Israel, Russia and at png ~+ =e least 45 other countries considers\n Fag =< magnetic therapy to be an official\n & pa to tiagene fees Seowwem tte medical procedure for the treatment of\n <a | sae numerous ailments, including various\n wm Gees wun teeta inflammatory and neurological (adj.7!\nnae 22°F: N) problems.\n\nE For those who practice magnetic therapy, strongly believe that certain ailments can be treated if the patient is exposed to magnetic fields while at the same time there is a strong resentment (n, 4>j}i) from the medical establishment and critics claim that most magnets don't have the strength to effect the various organs and tissues within the body and it is a product of Pseudoscience (n.{'y#}2}*) and is not based on proper research and analysis. There are few reported complications of magnetic therapy and the World Health Organization says low level of magnetic energy is not harmful. Documented side effects are not life-threatening and include pain, nausea and dizziness that disappeared when the magnets were removed. If considering magnet therapy, as with any medical treatment, it is always advisable to consult one's regular physician first.Magnet therapy is gaining popularity; however, the scientific evidence to support the success of this therapy is lacking. More scientifically sound studies are needed in order to fully understand the effects that magnets can have on the body and the possible benefits or dangers that could result from their use,Magnet therapy is gaining popularity; however, the scientific evidence to support the success of this therapy is lacking, More scientifically sound studies are needed in order to fully understand the effects that magnets can have on the body and the possible benefits or dangers that could result from their use,\n\nF Researchers at Baylor University Medical Center recently conducted a double-blind study on the use of concentric-circle magnets to relieve chronic pain in 50 post-polio patients. A static magnetic device or a placebo device was applied to the patient's skin for 45 minutes. The patients were asked to rate how much pain\n\nthey experienced when a \"trigger point was touched,\" The researchers reported that the 29 patients exposed to the magnetic device achieved lower pain scores than did the 21 who were exposed to the placebo device, However, this study had significant flaws in their design. Although the groups were said to be selected randomly, the ratio of women to men in the experimental group was twice that of the control group; the age of the placebo group was four years higher than that of the control group; there was just one brief exposure and no systematic follow-up of patients.\n\nG Magnet therapy is gaining popularity; however, the scientific evidence to support the success of this therapy is lacking. More scientifically sound studies are needed in order to fully understand the effects that magnets can have on the body and the possible benefits or dangers that could result from their use.", "options": {"A": "has no negative side effect.", "B": "resulted from the physical ailment.", "C": "should have more sophisticated studies.", "D": "is exposed to the placebo device.", "E": "must select the subjects randomly.", "F": "came from the absence of a magnetic field."}, "questions": [{"number": "11", "stem": "The first NASA astronauts’ sickness", "answer": "F", "ending": "came from the a const STORAGE_KEY='ielts_matching_sentence_endings_v1';
let state=loadState(), current=Number(state.current||1);
function blankState(){return {current:1,answers:{},submitted:{},scores:{},updated:Date.now()}}
function loadState(){try{return {...blankState(),...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch(e){return blankState()}}
function saveState(){state.current=current;state.updated=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Đã lưu • '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});}
function ex(){return EXERCISES[current-1]} function key(q){return current+'_'+q.number}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function passageHTML(t){return t.split(/\n\s*\n/).filter(Boolean).map(p=>'<p>'+esc(p.replace(/\s*\n\s*/g,' '))+'</p>').join('')}

 const answered=e.questions.filter(q=>state.answers[key(q)]).length;
 const score=state.scores[current]??0;
 let out=`<div class="eyebrow">QUESTIONS</div><h2>Complete each sentence</h2><div class="instructions">Ghép mỗi nửa đầu câu với một phương án <b>A–${String.fromCharCode(64+Object.keys(e.options).length)}</b>. Hãy kiểm tra cả <b>ngữ pháp</b> và <b>ý nghĩa</b>. Không tính thời gian.</div><div class="summary ${submitted?'show':''}"><div class="score">${score}/${e.questions.length}</div><div>${score===e.questions.length?'Hoàn thành xuất sắc.':score>=Math.ceil(e.questions.length*.7)?'Khá tốt. Hãy xem kỹ các bẫy còn sai.':'Hãy đọc lại bằng chứng và chuỗi paraphrase ở từng câu.'}</div></div>`;
 out+=e.questions.map((q,idx)=>{const a=state.answers[key(q)]||'',ok=a===q.answer,cls=submitted?(ok?'correct':'wrong'):'';return `<article class="qcard ${cls}" id="q-${q.number}"><div class="qline"><span class="qnum">${q.number}</span><div class="qstem">${esc(q.stem)} …</div></div><select data-q="${q.number}" ${submitted?'disabled':''}><option value="">— Chọn phương án —</option>${Object.entries(e.options).map(([l,v])=>`<option value="${l}" ${a===l?'selected':''}>${l}. ${esc(v)}</option>`).join('')}</select><div class="review ${submitted?'show':''}"><div class="answerLine">Đáp án: ${q.answer} — ${esc(q.stem)} ${esc(q.ending)}</div><div><span class="label">Bằng chứng:</span><div class="evidence">${esc(q.evidence)}</div></div><div><span class="label">Paraphrase:</span> ${esc(q.paraphrase)}</div><div><span class="label">Giải thích & loại bẫy:</span> ${esc(q.explanation)}</div></div></article>`}).join('');

 document.getElementById('questionPane').innerHTML=out; document.querySelectorAll('select[data-q]').forEach(s=>s.addEventListener('change',onAnswer));renderDots();document.getElementById('submit').disabled=submitted;document.getElementById('submit').textContent=submitted?'ĐÃ NỘP':'NỘP BÀI';
 document.getElementById('prevEx').disabled=current===1;document.getElementById('nextEx').disabled=current===EXERCISES.length;}

function submit(){const e=ex(),missing=e.questions.filter(q=>!state.answers[key(q)]);if(missing.length&&!confirm(`Còn ${missing.length} câu chưa trả lời. Vẫn nộp bài?`))return;let score=0;e.questions.forEach(q=>{if(state.answers[key(q)]===q.answer)score++});state.submitted[current]=true;state.scores[current]=score;saveState();render();document.getElementById('questionPane').scrollTo({top:0,behavior:'smooth'});toast(`Kết quả Exercise ${current}: ${score}/${e.questions.length}`)}
function switchEx(n){current=Math.max(1,Math.min(EXERCISES.length,n));saveState();render();document.getElementById('passagePane').scrollTop=0;document.getElementById('questionPane').scrollTop=0}
function resetEx(){if(!confirm('Xóa câu trả lời và kết quả của bài hiện tại?'))return;ex().questions.forEach(q=>delete state.answers[key(q)]);delete state.submitted[current];delete state.scores[current];saveState();render();toast('Đã làm mới Exercise '+current)}
function resetAll(){if(!confirm('Xóa toàn bộ câu trả lời, kết quả và tiến độ của 11 Exercises?'))return;state=blankState();current=1;saveState();render();toast('Đã xóa toàn bộ tiến độ')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
document.getElementById('exerciseSelect').innerHTML=EXERCISES.map(e=>`<option value="${e.id}">Exercise ${e.id} – ${esc(e.title)}</option>`).join('');
document.getElementById('exerciseSelect').onchange=e=>switchEx(Number(e.target.value));document.getElementById('submit').onclick=submit;document.getElementById('prevEx').onclick=()=>switchEx(current-1);document.getElementById('nextEx').onclick=()=>switchEx(current+1);document.getElementById('resetEx').onclick=resetEx;document.getElementById('resetAll').onclick=resetAll;render();
</script>

<script id="ielts-dual-pane-layout-runtime">
(function(){
  function visible(el){
    if(!el) return false;
    if(el.classList && el.classList.contains('hidden')) return false;
    const s = window.getComputedStyle(el);
    if(s.display === 'none' || s.visibility === 'hidden') return false;
    return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  }

  function syncExamLock(){
    const candidates = Array.from(document.querySelectorAll('.exam,.practice,#exam-screen'));
    const active = candidates.some(visible);
    document.documentElement.classList.toggle('ielts-exam-active', active);
    if(document.body) document.body.classList.toggle('ielts-exam-active', active);
  }

  function start(){
    syncExamLock();
    const obs = new MutationObserver(syncExamLock);
    obs.observe(document.documentElement,{
      subtree:true,
      childList:true,
      attributes:true,
      attributeFilter:['class','style','hidden']
    });
    window.addEventListener('resize', syncExamLock, {passive:true});
    window.addEventListener('orientationchange', syncExamLock, {passive:true});
    document.addEventListener('click', function(){ setTimeout(syncExamLock,0); }, {passive:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }else{
    start();
  }
})();
</script>
<!-- IELTS_DUAL_PANE_PATCH_SCRIPT_END -->
