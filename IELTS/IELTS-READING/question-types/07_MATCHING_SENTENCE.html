<style id="ielts-dual-pane-layout-patch">
/* =========================================================
   IELTS READING – DUAL PANE / INDEPENDENT SCROLL PATCH
   Desktop: 60/40
   Mobile portrait (<768px): top/bottom, BOTH visible
   Mobile landscape + tablet: 60/40
   Body locked only while an exam/practice screen is active
   ========================================================= */

html.ielts-exam-active,
body.ielts-exam-active{
  height:100% !important;
  max-height:100% !important;
  overflow:hidden !important;
  overscroll-behavior:none !important;
}

body.ielts-exam-active{
  position:relative !important;
}

/* Prevent the exam/practice shell itself from becoming the scrolling surface. */
body.ielts-exam-active .exam,
body.ielts-exam-active .practice,
body.ielts-exam-active #exam-screen{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Common split containers */
body.ielts-exam-active .workspace,
body.ielts-exam-active .work{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Every reading/question pane scrolls on its own. */
body.ielts-exam-active .workspace > .pane,
body.ielts-exam-active .workspace > .reading-pane,
body.ielts-exam-active .workspace > .question-pane,
body.ielts-exam-active .workspace > .passage-pane,
body.ielts-exam-active .workspace > .passage,
body.ielts-exam-active .workspace > .questions,
body.ielts-exam-active .work > .pane,
body.ielts-exam-active .work > .reading-pane,
body.ielts-exam-active .work > .question-pane,
body.ielts-exam-active .work > .passage-pane,
body.ielts-exam-active .work > .passage,
body.ielts-exam-active .work > .questions,
body.ielts-exam-active #passage-pane,
body.ielts-exam-active #question-pane{
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain !important;
  -webkit-overflow-scrolling:touch !important;
}

/* The old "show only one pane" mobile controls are no longer needed. */
body.ielts-exam-active .mobile-switch,
body.ielts-exam-active .mobile-toggle,
body.ielts-exam-active #show-reading,
body.ielts-exam-active #show-questions{
  display:none !important;
}

/* Never allow old mobile-state classes to hide one side. */
body.ielts-exam-active .workspace.show-questions > .reading-pane,
body.ielts-exam-active .workspace.show-questions > .passage-pane,
body.ielts-exam-active .workspace.show-questions > .passage,
body.ielts-exam-active .workspace:not(.show-questions) > .question-pane,
body.ielts-exam-active .practice.show-passage .question-pane,
body.ielts-exam-active .practice:not(.show-passage) .passage-pane,
body.ielts-exam-active #passage-pane.mobile-hidden,
body.ielts-exam-active #question-pane.mobile-hidden{
  display:block !important;
}

/* Keep fixed-height practice shells inside the viewport. */
body.ielts-exam-active .practice{
  height:100vh !important;
  height:100dvh !important;
  max-height:100vh !important;
  max-height:100dvh !important;
}

/* Matching Information-style shell: 44px global brand + exam below it. */
body.ielts-exam-active .top-brand + .exam,
body.ielts-exam-active .top-brand ~ .exam{
  height:calc(100vh - 44px) !important;
  height:calc(100dvh - 44px) !important;
  min-height:0 !important;
}

/* ---------- DESKTOP + TABLET + MOBILE LANDSCAPE ---------- */
@media (min-width:768px), (orientation:landscape){
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,3fr) minmax(0,2fr) !important; /* 60 / 40 */
    grid-template-rows:minmax(0,1fr) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based exam templates */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* YES/NO/NOT GIVEN-style fixed header = 46 + 42 = 88px */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
  }

  /* Restore divider between 60% passage and 40% questions */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:1px solid var(--line, #d7dde4) !important;
    border-bottom:0 !important;
  }
}

/* ---------- MOBILE PORTRAIT ONLY ---------- */
@media (max-width:767px) and (orientation:portrait){
  /* Matching Information had height:auto + sticky header on mobile:
     force the shell back into the viewport. */
  body.ielts-exam-active .exam{
    min-height:0 !important;
    overflow:hidden !important;
  }

  body.ielts-exam-active .exam-head{
    position:relative !important;
    top:auto !important;
    flex:0 0 auto !important;
  }

  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    grid-template-rows:minmax(0,48%) minmax(0,52%) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based templates: workspace occupies exactly the remaining height. */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* Fixed 88px header templates */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }

  /* Clear old "one pane at a time" rules with high specificity. */
  body.ielts-exam-active .workspace.show-questions .reading-pane,
  body.ielts-exam-active .workspace.show-questions .passage-pane,
  body.ielts-exam-active .workspace.show-questions .passage,
  body.ielts-exam-active .workspace.show-questions .question-pane,
  body.ielts-exam-active .practice.show-passage .passage-pane,
  body.ielts-exam-active .practice.show-passage .question-pane,
  body.ielts-exam-active .practice .passage-pane,
  body.ielts-exam-active .practice .question-pane{
    display:block !important;
  }

  /* Horizontal divider between Passage (top) and Questions (bottom). */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:0 !important;
    border-bottom:2px solid var(--line, #d7dde4) !important;
  }

  /* Compact padding so both regions remain practical on small screens. */
  body.ielts-exam-active .reading-pane,
  body.ielts-exam-active .passage-pane,
  body.ielts-exam-active .work > .passage{
    padding-top:10px !important;
    padding-bottom:18px !important;
  }

  body.ielts-exam-active .question-pane,
  body.ielts-exam-active .work > .questions{
    padding-top:9px !important;
    padding-bottom:24px !important;
  }
}

/* Print should remain normal and fully expandable. */
@media print{
  html.ielts-exam-active,
  body.ielts-exam-active{
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
  }
}
</style>

n the 1970s to support an initiative that has resulted in good documentation of most of the 130 remaining Aboriginal languages. In England, another Australian, Peter Austin, has directed one of the world’s most active efforts to limit language loss, at the University of London. Austin heads a programme that has trained many documentary linguists in England as well as in language-loss hotspots\n such as West Africa and South America.\nAt linguistics meetings in the US, where the endangered-language issue has of late been something of a flavour of the month, there is growing evidence that\n not all approaches to the preservation of languages will be particularly helpful.\n\nPRACTICE TEST 3 >\n Some linguists are boasting, for example, of more and more sophisticated means of capturing languages: digital recording and storage, and internet and mobile phone technologies. But these are encouraging the ‘quick dash’ style of recording trip: fly in, switch on digital recorder, fly home, download to hard drive, and store gathered material for future research. That’s not quite what some endangered-language specialists have been seeking for more than 30 years. Most loud and untiring has been Michael Krauss, of the University of Alaska. He has often complained that linguists are playing with non-essentials\n while most of their raw data is disappearing.\n Who is to blame? That prominent linguist Noam Chomsky, say Krauss and many others. Or, more precisely, they blame those linguists who have been obsessed with his approaches. Linguists who go out into communities to study, document and describe languages, argue that theoretical linguists, who draw conclusions about how languages work, have had so much influence that linguistics has largely ignored the continuing disappearance of languages.\nChomsky, from his post at the Massachusetts Institute of Technology, has been the great man of theoretical linguistics for far longer than he has been known\n as a political commentator.\n\nPRACTICE TEST 3 >\n His landmark work of 1957 argues that all languages exhibit certain universal grammatical features, encoded in the human mind. American linguists, in particular, have focused largely on theoretical concerns ever since, even while doubts have mounted about Chomsky’s universals. Austin and Co. are in no doubt that because languages are unique, even if they do tend to have common underlying features, creating dictionaries and grammars requires prolonged and dedicated work. This requires that documentary linguists observe not only languages’ structural subtleties, but also related social, historical and political factors. Such work calls for persistent funding of field scientists who may sometimes have to venture into harsh and even hazardous\n places. Once there, they may face difficulties such as community suspicion.\n As Nick Evans says, a community who speak an endangered language may have reasons to doubt or even oppose efforts to preserve it. They may have seen support and funding for such work come and go. They may have given up using the language with their children, believing they will benefit from speaking a more widely understood one. Plenty of students continue to be drawn to the intellectual thrill of linguistics field work. That's all the more reason to clear away barriers, contend Evans, Austin and others. The highest barrier, they agree, is that the linguistics profession’s emphasis on theory gradually wears\n down the enthusiasm of linguists who work in communities.\n\nPRACTICE TEST 3 >\n Chomsky disagrees. Chomsky has recently begun to speak in support of language preservation. But his linguistic, as opposed to humanitarian, argument is, let’s say, unsentimental: the loss of a language, he states, ‘is much more of a tragedy for linguists whose interests are mostly theoretical, like me, than for linguists who focus on describing specific languages, since it means the permanent loss of the most relevant data for general theoretical work’. At the moment, few institutions award doctorates for such work, and\n that’s the way it should be, he reasons.\n In linguistics, as in every other discipline, he believes that good descriptive work requires thorough theoretical understanding and should also contribute to building new theory. But that’s precisely what documentation does, objects Evans. The process of immersion in a language, to extract, analyse and sum it up, deserves a PhD because it is ‘the most demanding intellectual task a\n linguist can engage in’.\n Do the following statements agree with the information given in Reading Passage 3? In boxes 27-32 on your answer sheet, write -\n TRUE if the statement agrees with the information\n FALSE if the statement contradicts the information\n NOT GIVEN If there is no information on this\n 27. By 2050 only a small number of languages will be flourishing.", "options": {"A": "even though it is in danger of disappearing.", "B": "provided that it has a strong basis in theory.", "C": "although it may share certain universal characteristics.", "D": "because there is a practical advantage to it.", "E": "so long as the drawbacks are clearly understood.", "F": "in spite of the prevalence of theoretical linguistics.", "G": "until they realize what is involved."}, "questions": [{"number": "37", "stem": "Linguists like Peter Austin believe that every language is unique", "answer": "C", "ending": "although it may share certain universal characteristics", "evidence": "“because languages are unique, even if they do tend to have common underlying features”", "paraphrase": "unique ↔ unique; common underlying features ↔ universal characteristics", "explanation": "C giữ nguyên quan hệ nhượng bộ: mỗi ngôn ngữ là độc nhất dù vẫn có đặc điểm nền tảng chung. Không chọn B vì “strong basis in theory” là quan điểm của Chomsky về descriptive work, không phải nhận định này của Austin."}, {"number": "38", "stem": "Nick Evans suggests a community may resist attempts to save its language", "answer": "A", "ending": "even though it is in danger of disappearing", "evidence": "“a community who speak an endangered language may have reasons to doubt or even oppose efforts to preserve it”", "paraphrase": "resist ↔ doubt or oppose; save ↔ preserve", "explanation": "A nối đúng nghịch lý: chính cộng đồng nói ngôn ngữ đang nguy cấp vẫn có thể phản đối việc bảo tồn. D nói về lợi ích thực tế nhưng không hoàn thành đúng ý."}, {"number": "39", "stem": "Many young researchers are interested in doing practical research", "answer": "F", "ending": "in spite of the prevalence of theoretical linguistics", "evidence": "“Plenty of students continue to be drawn to the intellectual thrill of linguistics field work… The highest barrier… is the linguistics profession’s emphasis on theory”", "paraphrase": "practical research ↔ field work; prevalence ↔ emphasis", "explanation": "F kết nối hai ý đối lập: sinh viên vẫn bị thu hút bởi fieldwork mặc dù ngành ưu tiên lý thuyết."}, {"number": "40", "stem": "Chomsky supports work in descriptive linguistics", "answer": "B", "ending": "provided that it has a strong basis in theory", "evidence": "“good descriptive work requires thorough theoretical understanding and should also contribute to building new theory”", "paraphrase": "provided that ↔ requires; strong basis in theory ↔ theoretical understanding", "explanation": "B thể hiện điều kiện Chomsky đặt ra. Ông không ủng hộ mô tả thuần túy; công việc phải dựa trên và đóng góp cho lý thuyết."}]}, {"id": 2, "title": "Why Are Fairy Tales Really Scary Tales?", "passage": "PRACTICE TEST II >\n The purified water comes out through one tube, and alll types Of (24) ......ssssssssscceoee come out through another. A screen displays the (25) .............«... of the device, and transmits the information to the company so that they know when the\n Desolenator requires (26) ......asssscsssceeoee\n Why Are Fairy Tales Really Scary Tales?\n People of every culture tell each other fairy tales but the same story often takes a variety of forms in different parts of the world. In the story of Little Red Riding Hood that European children are familiar with, a young girl on the way to see her grandmother meets a wolf and tells him where she is going. The wolf runs on ahead and disposes of the grandmother, then gets into bed dressed in the grandmother's clothes to wait for Little Red Riding Hood. You may think you know the story — but which version? In some versions, the wolf swallows up the grandmother, while in others it locks her in a cupboard. In some stories Red Riding Hood gets the better of the wolf on her own, while in others a hunter or a\n woodcutter hears her cries and comes to her rescue.\n\nPRACTICE TEST II >\n The universal appeal of these tales is frequently attributed to the idea that they contain cautionary messages: in the case of Little Red Riding Hood, to listen to your mother, and avoid talking to strangers. ‘It might be what we find interesting about this story is that it’s got this survival-relevant information in it, says anthropologist Jamie Tehrani at Durham University in the UK. But his research suggests otherwise. ‘We have this huge gap in our knowledge about the history and prehistory of storytelling, despite the fact that we know this genre is an incredibly ancient one,’ he says. That hasn't stopped anthropologists, folklorists* and other academics devising theories to explain the importance of fairy tales in human society. Now Tehrani has found a way to\n test these ideas, borrowing a technique from evolutionary biologists.\n To work out the evolutionary history, development and relationships among groups of organisms, biologists compare the characteristics of living species in a process called ‘phylogenetic analysis’. Tehrani has used the same approach to compare related versions of fairy tales to discover how they have evolved\n and which elements have survived longest.\n Tehrani’s analysis focused on Little Red Riding Hood in its many forms, which include another Western fairy tale known as The Wolf and the Kids. Checking for variants of these two tales and similar stories from Africa, East Asia and\n other regions, he ended up with 58 stories recorded from oral traditions.\n\nPRACTICE TEST II >\n Once his phylogenetic analysis had established that they were indeed related, he used the same methods to explore how they have developed and altered over time. First he tested some assumptions about which aspects of the story alter least as it evolves, indicating their importance. Folklorists believe that\n what happens\n in a story is more central to the story than the characters in it — that visiting a relative, only to be met by a scary animal in disguise, is ‘Folklorists: those who study traditional stories more fundamental than whether the visitor is a little girl or three siblings, or the animal is a tiger instead of a wolf. However, Tehrani found no significant difference in the rate of evolution of incidents compared with that of characters. ‘Certain episodes are very stable because they are crucial to the story, but there are lots of other details that can evolve quite freely,’ he says. Neither did his analysis support the theory that the central section of a story is the most conserved part. He found no significant difference\n in the flexibility of events there compared with the beginning or the end.\n But the really big surprise came when he looked at the cautionary elements of the story. ‘Studies on hunter-gatherer folk tales suggest that these narratives include really important information about the environment and the possible dangers that may be faced there — stuff that’s relevant to survival,’ he says. Yet\n in his analysis such elements were just as flexible as seemingly trivial details.\n\nPRACTICE TEST II >\n What, then, is important enough to be reproduced from generation to generation? The answer, it would appear, is fear — blood-thirsty and gruesome aspects of the story, such as the eating of the grandmother by the wolf, turned out to be the best preserved of all. Why are these details retained by generations of storytellers, when other features are not? Tehrani has an idea:\n ‘In an oral context, a story won't survive because of one great teller.\n It also needs to be interesting when it’s told by someone who's not necessarily a great storyteller.’ Maybe being swallowed whole by a wolf, then cut out of its stomach alive is so gripping that it helps the story remain popular, no matter how badly it’s told. Jack Zipes at the University of Minnesota, Minneapolis, is unconvinced by Tehrani’s views on fairy tales. ‘Even if they’re gruesome, they won't stick unless they matter,’ he says. He believes the perennial theme of women as victims in stories like Little Red Riding Hood explains why they continue to feel relevant. But Tehrani points out that although this is often the case in Western versions, it is not always true elsewhere. In Chinese and Japanese versions, often known as The Tiger Grandmother, the villain is a woman, and in both Iran and Nigeria, the victim is a boy. Mathias Clasen at Aarhus University in Denmark isn’t surprised by Tehrani’s findings. ‘Habits and morals change, but the things that scare us, and the fact that we seek out\n entertainment that’s designed to scare us — those are constant,’ he says.\n\nPRACTICE TEST Il >\n Clasen believes that scary stories teach us what it feels like to be afraid without having to experience real danger, and so build up resistance to negative\n emotions.\n Complete each sentence with the correct ending, A-F, below. Write the correct letter, A-F, in boxes 27-31.\n 27. In fairy tales, details of the plot\n 28. Tehrani rejects the idea that the useful lessons for life in fairy tales 29. Various theories about the social significance of fairy tales\n 30. Insights into the development of fairy tales\n 31. All the fairy tales analysed by Tehrani\n A. may be provided through methods used in biological research.\nB. are the reason for their survival.\n C. show considerable global variation.\n D. contain animals which transform to become humans.\n E. were originally spoken rather than written.\n F. have been developed without factual basis.", "options": {"A": "may be provided through methods used in biological research.", "B": "are the reason for their survival.", "C": "show considerable global variation.", "D": "contain animals which transform to become humans.", "E": "were originally spoken rather than written.", "F": "have been developed without factual basis."}, "questions": [{"number": "27", "stem": "In fairy tales, details of the plot", "answer": "C", "ending": "show considerable global variation", "evidence": "“the same story often takes a variety of forms in different parts of the world”", "paraphrase": "details of the plot ↔ versions/forms; global ↔ different parts of the world", "explanation": "C tóm đúng việc cùng một truyện thay đổi chi tiết theo vùng. E nói về nguồn truyền miệng của bộ dữ liệu, không nói về plot details."}, {"number": "28", "stem": "Tehrani rejects the idea that the useful lessons for life in fairy tales", "answer": "B", "ending": "are the reason for their survival", "evidence": "“Yet in his analysis such elements were just as flexible as seemingly trivial details.”", "paraphrase": "useful lessons ↔ cautionary/survival-relevant elements; survival ↔ best preserved", "explanation": "B đúng vì các yếu tố mang bài học sinh tồn không được bảo tồn ổn định hơn chi tiết vụn vặt."}, {"number": "29", "stem": "Various theories about the social significance of fairy tales", "answer": "F", "ending": "have been developed without factual basis", "evidence": "“That hasn’t stopped anthropologists, folklorists and other academics devising theories…”", "paraphrase": "developed ↔ devising; without factual basis ↔ huge gap in knowledge", "explanation": "F dựa vào mạch lập luận: dữ liệu lịch sử kể chuyện còn thiếu nhưng nhiều lý thuyết vẫn được dựng lên."}, {"number": "30", "stem": "Insights into the development of fairy tales", "answer": "A", "ending": "may be provided through methods used in biological research", "evidence": "“borrowing a technique from evolutionary biologists” / “phylogenetic analysis”", "paraphrase": "methods used in biological research ↔ technique from evolutionary biologists", "explanation": "A là paraphrase trực tiếp về việc dùng phylogenetic analysis để nghiên cứu sự tiến hóa của truyện."}, {"number": "31", "stem": "All the fairy tales analysed by Tehrani", "answer": "E", "ending": "were originally spoken rather than written", "evidence": "“he ended up with 58 stories recorded from oral traditions”", "paraphrase": "originally spoken ↔ oral traditions", "explanation": "E đúng với đặc điểm chung của toàn bộ 58 truyện. D sai vì không phải truyện nào cũng có động vật biến thành người."}]}, {"id": 3, "title": "Artists’ Fingerprints", "passage": "EXERCTSSE 3\n Artists’ Fingerpruty\n Works of art often bear the fingerprints of the artist who created them.\nSuch crucial evidence usually goes unnoticed even by connoisseurs, art experts and conservators. If present, such evidence could be valuable in clarifying questions about authorship and dating.\n The unique character of ridges on our hands has been recognized for thousands of years. The study of ancient pottery for example\n s reveals the utilization of fingerprint impressions in the Ai inn ') 4WS5s clay as a maker's mark. In prehistoric times, we find\n predicting examples of hand prints in cave painting. Only as\n recently as 1858 did Sir William Herschel establish its\n use for identification. In 1888, Sir Francis Galton undertook to refine and formulate\n Herschel's observations. Identification by fingerprint was first adopted in England in 1905 and received general acceptance worldwide in 1908.\n\nB The combination of a number of characteristics in a given finger impression is specific to a particular print. The placing of reliance on fi ingerprint evidence has always been on the assumption (now accepted as a fact, j\n s hat no two fingers can have identical ridge chatacteristios. Galton's shacheniatioal conclusions predicted the possible existence of some 64 billion different fingerprint patterns. The functionality of this technique is that the probability for the existence of two identical finger impressions from different individuals is nil and no such possibility has ever been noticed in any part of the world at any time.\n Cc The individuality of a fingerprint is not determined by its general shape or pattern but by the careful study of its ridge characteristics. Since at a scene of crime, usually only partial prints are found, comparison of a relatively small number of characteristics is accepted in legal practice. In a judicial proceeding, a point-by-point comparison must be demonstrated by the fingerprint expert. This is exactly the principle that must be followed in art related fingerprint issues.\n\nArtists in the area of the visual arts use their hands for creation. Their tools, such as brushes often isolate them from the surface they are working on. Inaccurate deposits of paint are often corrected by modeling with the fingertip. Some artists used the fingertip to soften the marks left by the brush by gently tapping or stroking the still wet surface. In some instances, the fingertip was used for literally 'stamping' the fine\n network of ridges onto the painting.\nBecrceareearcmaraen f\n The eventual authentication of a painting by J. M. W. Turner entitled Landscape with Rainbow in 1993 is a good illustration of the process. The painting was discovered in the early 1980's. When the Biros took the painting to the Tate Gallery, in London, to show it to the world’s leading Turner experts and connoisseurs. The verdict was unanimous — the painting was a tattered imitation. However, fingerprint evidence was\n discovered on the painting during restoration, appropriately documented and\n re-examined by a veteran expert from the RCMP. A match was found between a\n fingerprint on ‘Landscape with Rainbow’ and fingerprints photographed on another\n Tumer painting, ‘Chichester Canal’. When an independent fingerprint examination\n by John Manners of the West Yorkshire Police confirmed the conclusions that the\n fingerprints on both paintings were identical, the unbelievers changed their minds. In addition, it is well known that Turner always worked alone and had no assistants.\n This reduces the chances of accidental contribution substantially. The painting,\n originally bought for a few hundred dollars finally sold for close to $200,000 at\n auction at Phillips in London in 1995.\nfsa UAE incccomonsuntmaned | ©\n In 1998, three envelopes containing old correspondence had been purchased in an\n antique shop. One of the envelopes postmarked April 2, 1915 was found to contain a drawing folded in half. The drawing depicts a woman's head. It is executed in red chalk with an inscription written in reverse with brown ink. The design is faded and worn. Some spots suggest foxing and subsequent discoloration. The paper is yellowed and contaminated.\n The newly discovered design bears great similarity to that of the Head of St Anne by Leonardo da Vinci, (RL 12533) in the Windsor Collection since 1629. The medium is different, red chalk being used instead of black. The scale of the two images is different so offsetting (copying by contact transference) is not a satisfactory explanation for the new drawing. When the paper was first examined, several fingerprints have been noticed on the verso. One of them was found clear\n Boic PTs Fie fo Ty\n\nand containing many ridges suitable for comparison, however, no analysis was done at the time due to the lack of reference material. Many of Leonardo's works are not easily accessible and fingerprint data either does not exist or is not published.\n\nH By chance, on March 30, 1999, several clear and useable fingerprints were found on an unusually good detail photo in a_ publication on Leonardo. The photograph of Leonardo's St Jerome, in the Vatican Museum, revealed no less than 16 partial fingertip marks. The importance of this is that the fingerprints are left in the still wet paint and without doubt the use of the fingertip served to model paint. Since the authorship of the painting of St Jerome is unquestioned by scholarship and has always been ascribed to Leonardo, the conclusion that these fingerprints are his would be hard to argue against.\n\nI The fingerprints on the St Jerome illustration were scanned and enlarged so comparisons could be made with the fingerprint on the newly discovered drawing.\nOne of them proved to match. The result of our analyses was presented on March 31, 1999 to fingerprint examiner Staff Sergeant André Turcotte for an independent assessment. He agreed with the findings and confirmed the conclusion. The fingerprint on the St Jerome painting in the Vatican and the newly discovered drawing were created by the same finger.\n\nJ Remember, the authentication approach should rest on strict considerations and rigorous methodology. Only prints that are clearly from the original creative process are admitted for consideration. The reference samples should ideally come from unquestioned works of art with good provenance. Spurious contributors must be eliminated such as assistants who may have touched the painting while still wet. A match is never made unless corroborated by at least one fully trained and experienced fingerprint examiner.", "options": {"A": "might use fingers to remove unwanted paint left by brushes.", "B": "revealed the utilization of clay.", "C": "was first used on Galton’s mathematical assumption.", "D": "was left to identify the person who made it.", "E": "was restored at a high expense.", "F": "was finally determined at an appropriate price.", "G": "has been accepted as a reliable system available.", "H": "was preserved at the Windsor Collection.", "I": "could be authenticated by comparing with fingerprints from other sources."}, "questions": [{"number": "33", "stem": "The fingerprint in ancient pottery", "answer": "D", "ending": "was left to identify the person who made it", "evidence": "“Babylonian fingerprints pressed into clay tablets… may have served as signatures”", "paraphrase": "identify the person ↔ signatures", "explanation": "D đúng vì dấu vân tay trên đồ đất sét cổ có chức năng như chữ ký nhận diện người tạo."}, {"number": "34", "stem": "The science of fingerprint identification", "answer": "G", "ending": "has been accepted as a reliable system available", "evidence": "“fingerprint identification gained acceptance as a reliable system”", "paraphrase": "accepted/reliable ↔ accepted/reliable", "explanation": "G là kết hợp từ vựng trực tiếp; C là bẫy gán nhầm nền tảng toán học."}, {"number": "35", "stem": "The authentication of a painting without a signature", "answer": "I", "ending": "could be authenticated by comparing with fingerprints from other sources", "evidence": "“prints… can be compared with reference fingerprints on other works”", "paraphrase": "authentication ↔ compared with reference fingerprints", "explanation": "I nêu đúng quy trình xác thực: dấu trên tác phẩm vô danh phải được đối chiếu với mẫu tham chiếu."}, {"number": "36", "stem": "Landscape with Rainbow", "answer": "F", "ending": "was finally determined at an appropriate price", "evidence": "“the painting… was eventually authenticated… and sold for a price appropriate to a Turner”", "paraphrase": "finally determined ↔ eventually authenticated; appropriate price ↔ price appropriate to a Turner", "explanation": "F khớp kết quả cuối cùng sau khi chuyên gia ban đầu bác bỏ."}, {"number": "37", "stem": "When painting, artists", "answer": "A", "ending": "might use fingers to remove unwanted paint left by brushes", "evidence": "“Inaccurate deposits of paint are often corrected by modeling with the fingertip.”", "paraphrase": "remove/correct unwanted paint ↔ inaccurate deposits corrected", "explanation": "A mô tả đúng thao tác dùng đầu ngón tay sửa dấu sơn do cọ để lại."}]}, {"id": 4, "title": "The Gap of Ingenuity 2", "passage": "You should spend about 20 minutes on Questions 27-40 which are based on Reading\n Passage 3 below.\n THE GAP of INGENUITY 2\n\nA Ingenuity, as I define it here, consists not only of ideas for new technologies like\n computers or drought-resistant crops but, more fundamentally, of ideas for better institutions and social arrangements, like efficient markets and competent governments.\n How much and what kinds of ingenuity a society requires depends on a range of factors, including the society’s goals and the circumstances within which it must achieve those goals— —whether it has a young population or an aging one, an abundance of natural resources or a scarcity of them, an easy climate or a punishing one, whatever the case may be.\n How much and what kinds of ingenuity a society supplies also depends on many factors, such as the nature of human inventiveness and understanding, the rewards an economy gives to the producers of useful knowledge, and the strength of political opposition to social and institutional reforms.\n\nA good supply of the right kind of ingenuity is essential, but it isn’t, of course, enough by itself. We know that the creation of wealth, for example, depends not only on an adequate supply of useful ideas but also on the availability of other, more conventional factors of production, like capital and labor. Similarly, prosperity, stability and justice usually depend on the resolution, or at least the containment, of major political struggles over wealth and power. Yet within our economies ingenuity often supplants labor, and growth in the stock of physical plant is usually accompanied by growth in the stock of ingenuity. And in our political systems, we need great ingenuity to set up institutions that successfully manage struggles over wealth and power. Clearly, our economic and -political processes are intimately entangled with the production and use of ingenuity.\n The past century’s countless incremental changes in our societies around the planet, in our technologies and our interactions with our surrounding natural environments have accumulated to create a qualitatively new world. Because\n [BO Dp\n\nthese changes have accumulated slowly, it’s often hard for us to recognize how profound and sweeping they’ve. They include far larger and denser populations;\nmuch higher per capita consumption of natural resources; and far better and more widely available technologies for the movement of people, materials, and especially information.\n In combination, these changes have sharply increased the density, intensity, and pace of our inter actions with each other; they have greatly increased the burden we place on our natural environment; and they have helped shift power from national and international institutions to individuals and subgroups, such as political special interests and ethnic factions.\n As a result, people in all walks of life—from our political and business leaders to all of us in our day-to-day ——must cope with much more complex, urgent, and often unpredictable circumstances. The management of our relationship with this new world requires immense and ever-increasing amounts of social and technical ingenuity. As we strive to maintain or increase our prosperity and improve the quality of our lives, we must make far more sophisticated decisions, and in less time, than ever before.\n When we enhance the performance of any system, from our cars to the planet’s network of financial institutions, we tend to make it more complex. Many of the natural systems critical to our well-being, like the global climate and the oceans, are extraordinarily complex to begin with. We often can’t predict or manage the behavior of complex systems with much precision, because they are often very sensitive to the smallest of changes and perturbations, and their behavior can flip from one mode to another suddenly and dramatically. In general, as the human-made and natural systems we depend upon become more complex, and as our demands on them increase, the institutions and technologies we use to manage them must become more complex too, which further boosts our need for ingenuity.\n The good news, though, is that the last century's stunning changes in our societies and technologies have not just increased our need for ingenuity; they have also produced a huge increase in its supply. The growth and urbanization of human populations have combined with astonishing new communication and transportation technologies to expand interactions among people and produce larger, more integrated, and more efficient markets. These changes have, in turn, vastly accelerated the generation and delivery of useful ideas.\n But—and this is the critical “but” —-—we should not jump to the conclusion that the supply of ingenuity always increases in lockstep with our ingenuity requirement: while it’s true that necessity is often the mother of invention, we can't always rely on the right kind of ingenuity appearing when and where we\n Ec DE: FRc E6h—6h6hh\n\nA\n need it. In many cases, the complexity and speed of operation of today's vital economic, social, arid ecological systems exceed the human brain s grasp. Very few of us have more than a rudimentary understanding of how these systems work. They remain fraught with countless “unknown unknowns,” which makes it hard to supply the ingenuity we need to solve problems associated with these systems.\n In this book, explore a wide range of other factors that will limit our ability to supply the ingenuity required in the coming century. For example, many people believe that new communication technologies strengthen democracy and will make it easier to find solutions to our societies’ collective problems, but the story is less clear than it seems. The crush of information in our everyday lives is shortening our attention span, limiting the time we have to reflect on critical matters of public policy, and making policy arguments more superficial.\n Modern markets and science are an important part of the story of how we supply ingenuity. Markets are critically important, because they give entrepreneurs an incentive to produce knowledge. As for science, although it seems to face no theoretical limits, at least in the foreseeable future, practical constraints often slow its progress. The cost of scientific research tends to increase as it delves deeper into nature. And science’s rate of advance depends on the characteristic of the natural phenomena it investigates, simply because some phenomena are intrinsically harder to understand than others, so the production of useful new knowledge in these areas can be very slow. Consequently, there is often a critical time lag between the recognition between a problem and the delivery of sufficient ingenuity, in the form of technologies, to solve that problem. Progress in the social sciences is especially slow, for reasons we don’t yet understand; but we desperately need better social scientific knowledge to build the sophisticated institutions today’s world demands.\n App Storelt — ™ yy (ee\n one :\nzyupp Seale\n SREa alee &\n | 27 |\n Em: EE EE: ba 6a", "options": {"A": "depends on many factors including climate.", "B": "depends on the management and solution of disputes.", "C": "is not only of technological advance, but more of institutional renovation.", "D": "also depends on the availability of some traditional resources."}, "questions": [{"number": "27", "stem": "The definition of ingenuity", "answer": "C", "ending": "is not only of technological advance, but more of institutional renovation", "evidence": "“consists not only of ideas for new technologies… but, more fundamentally, of ideas for better institutions and social arrangements”", "paraphrase": "technological advance ↔ new technologies; institutional renovation ↔ better institutions", "explanation": "C tái hiện chính xác cấu trúc not only … but more fundamentally."}, {"number": "28", "stem": "The requirement for ingenuity", "answer": "A", "ending": "depends on many factors including climate", "evidence": "“depends on a range of factors… an easy climate or a punishing one”", "paraphrase": "depends on many factors ↔ depends on a range; climate ↔ climate", "explanation": "A là nối trực tiếp; không nhầm với các yếu tố quyết định nguồn cung ingenuity ở đoạn C."}, {"number": "29", "stem": "The creation of social wealth", "answer": "D", "ending": "also depends on the availability of some traditional resources", "evidence": "“depends not only on… useful ideas but also on… capital and labor”", "paraphrase": "traditional resources ↔ conventional factors of production", "explanation": "D đúng: ý tưởng chưa đủ, còn cần vốn và lao động."}, {"number": "30", "stem": "The stability of society", "answer": "B", "ending": "depends on the management and solution of disputes", "evidence": "“stability and justice usually depend on the resolution, or at least the containment, of major political struggles”", "paraphrase": "management/solution ↔ containment/resolution; disputes ↔ struggles", "explanation": "B là paraphrase chuẩn của resolution/containment of struggles."}]}, {"id": 5, "title": "The Beginning of Football", "passage": "‘= i,\n The Beginning of FOOtbaLl !\n Football as we now know it developed in Britain in the 19th century, but the game is far older than this. In fact, the term has historically been applied to games played on foot, as opposed to those played on horseback, so 'football' hasn't always involved kicking a ball.It has generally been played by men, though at the end of the 17th century, games were played between married and single\n women in a town in Scotland. The married women west ca regularly won. es “\n\nB The very earliest form of football for which we have i :\nevidence is the 'tsu'chu', which was played in China pe and may date back 3,000 years. It was performed in 7% front of the Emperor during festivities to mark his birthday. It involved kicking a leather ball through a 30-40cm opening into a small net fixed onto long bamboo canes - a feat that demanded great skill and excellent technique.\n Cc Another form of the game, also originating from the Far East, was the Japanese 'kemari' which dates from about the fifth century and is still played today. This is a type of circular football game, a more dignified and ceremonious experience requiring certain skills, but not competitive in the way the Chinese\n _ game was, nor is there Binns 43-5 * the slightest sign of predicting struggle for possession\n of the ball. The players had to pass the ball to\n each other, in a relatively small space, trying not to let it touch the ground.\n\nD The Romans had a much livelier game, 'harpastum'. Each team member had his own specific tactical assignment\n\nA Bic DE: Fc fo\n\ntook a noisy interest in the proceedings and the score. The role of the feet was so small as scarcely to be of consequence. The game remained popular for 700 or 800 years, but, although it was taken to England, it is doubtful whether it can be considered as a forerunner of\n contemporary football.\n\nE The game that flourished in Britain from the 8th Ai 4 Bs —_ to the 19th centuries was substantially different I AK] WS predicting\n from all the previously known forms - more r and usually played by an indefinite number of players. Frequently, the games took the form of a heated contest between whole villages. Kicking opponents was allowed, as in fact was almost everything else.\n\nF There was tremendous enthusiasm for football, even though the authorities repeatedly intervened to restrict it, as a public nuisance. In the 14th and 15th centuries, England, Scotland and France all made football punishable by law, because of the disorder that commonly accompanied it, or because the well-loved recreation prevented subjects from practising more useful military disciplines. None of these efforts had much effect.\n\nG The English passion for football was particularly strong in pera the 16th century, influenced by the popularity of the rather better organised Italian game of 'calcio'. English football was as rough as ever, but it found a prominent supporter in the school headmaster Richard Mulcaster. He pointed out that it had positive educational value and promoted health and strength. Mulcaster claimed that all that was needed was to refine it a little, limit the number of participants in each team and, more importantly, have a referee to oversee the game.\n\nH The game persisted in a disorganised form until the early 19th century, when a number of influential English schools developed their own adaptations. In some, including Rugby School, the ball could be touched with the hands or carried; opponents could be tripped up and even kicked. It was recognised in educational circles that, as a team game, football helped to develop such fine qualities as loyalty, selflessness, cooperation, subordination and deference to the team spirit. A 'games cult! developed in schools, and some form of football became an\n\nA Ec a i\n\nobligatory part of the curriculum.\n In 1863, developments reached a climax. At Cambridge University, an initiative began to establish some uniform standards and rules that would be accepted by everyone, but there were essentially two camps: the minority ~~ Rugby School and some others - wished to continue with their own form of the game, in particular allowing players to carry the ball. In October of the same year, eleven London clubs and schools sent representatives to establish a set of fundamental rules to govern the matches played amongst them. This meeting marked the birth of the Football Association.\n The dispute concerning kicking and tripping opponents and carrying the ball was discussed thoroughly at this and subsequent meetings, until eventually, on 8 December, the die-hard exponents of the Rugby style withdrew, marking a final split between rugby and football. Within eight years, the Football Association already had 50 member clubs, and the first football competition in the world was started - the FA Cup.", "options": {"A": "was seen as something to be encouraged in the young.", "B": "involved individual players having different responsibilities.", "C": "was influenced by a game from another country.", "D": "was a cooperative effort by all the players.", "E": "distracted people from more important activities.", "F": "was played by teams of a fixed size.", "G": "was less popular than it later became.", "H": "was often played by one community against another.", "I": "formed part of a celebration."}, "questions": [{"number": "8", "stem": "Tsu’chu", "answer": "I", "ending": "formed part of a celebration", "evidence": "“performed in front of the Emperor during festivities to mark his birthday”", "paraphrase": "celebration ↔ festivities/birthday", "explanation": "I đúng vì trò chơi là một phần nghi lễ mừng sinh nhật hoàng đế."}, {"number": "9", "stem": "Kemari", "answer": "D", "ending": "was a cooperative effort by all the players", "evidence": "“players had to keep the ball in the air… in a cooperative rather than competitive spirit”", "paraphrase": "cooperative effort ↔ cooperative spirit", "explanation": "D đúng; không phải mỗi người có nhiệm vụ chiến thuật riêng."}, {"number": "10", "stem": "Harpastum", "answer": "B", "ending": "involved individual players having different responsibilities", "evidence": "“each member had his own specific tactical assignment”", "paraphrase": "different responsibilities ↔ specific tactical assignment", "explanation": "B là paraphrase trực tiếp."}, {"number": "11", "stem": "From the 8th to the 19th centuries, football in the British Isles", "answer": "H", "ending": "was often played by one community against another", "evidence": "“contests between neighbouring towns and villages”", "paraphrase": "one community against another ↔ neighbouring towns/villages", "explanation": "H đúng về kiểu đối đầu cộng đồng."}, {"number": "12", "stem": "In the past, the authorities legitimately despised football and acted on the belief that football", "answer": "E", "ending": "distracted people from more important activities", "evidence": "“prevented subjects from practising more useful military disciplines”", "paraphrase": "distracted/prevented; important activities/useful military disciplines", "explanation": "E giải thích vì sao chính quyền cấm."}, {"number": "13", "stem": "When it was accepted in academic settings, football", "answer": "A", "ending": "was seen as something to be encouraged in the young", "evidence": "“helped to develop… loyalty, selflessness, cooperation… team spirit”", "paraphrase": "encouraged in the young ↔ educational value/qualities", "explanation": "A đúng vì nhà trường coi bóng đá giúp hình thành phẩm chất tốt."}]}, {"id": 6, "title": "History of Refrigeration", "passage": "EXERCTSE 6\n History of Refrigeration\n\nA The term refrigeration refers to cooling an area or substance below the environmental temperature, the process of removing heat. Mechanical refrigeration uses the evaporation of a liquid refrigerant to absorb heat, The refrigerant goes through a cycle so that it can be reused, the main cycles are; vapour-compression, absorption, steam-jet or steam-ejector, and air.\nMaryland farmer Thomas Moore first introduced the term Refrigerator in 1803, the appliance we know today first appeared in the 20th century.\n\nB Prior to mechanical refrigeration systems, people found different ways of preserving their food. Some people preferred to use cooling systems of ice or snow found either locally or brought down from mountains and sometimes stored in cellars. Using those techniques meant that diets would have consisted of very little fresh food or fruits and vegetables, but mostly of bread, cheese and salted meats. Milk and cheeses were difficult to keep fresh, they were usually stored in a cellar or window box, but despite those methods, they could not prevent rapid spoilage. People were more than ready for a better system of preserving food.Later on, it was discovered that adding chemicals like sodium nitrate or potassium nitrate to water caused the temperature to fall. Cooling wine with this technique was first recorded in 1550, as was the term \"to refrigerate”, Cooling drinks became very popular by 1600 in Europe, especially in Spain, Italy and France. Instead of cooling water at night, people used a new technique;\nrotating long necked bottles in water which held dissolved saltpeter. The solution was used to create very low temperatures and even to make ice. By the end of the 17th century, iced drinks including frozen juices and liquors were very popular in French society.\n Cc A demand for ice soon became very strong, Consumer demand for fresh food, especially produce, led to diet reform between 1830 and the Civil War, fueled by the dramatic growth of cities and the improvement in economic status of the general populace. And as cities grew, so did the distance between the consumer and the source of the food. In 1799, ice was\n i4 | 18 | | 20 | 38 | 40 |\n\nfirst shipped commercially out of Canal Street in New York City to Charleston, South Carolina. The attempt was a failure as there was very little ice left when the shipment arrived. Frederick Tudor and Nathaniel Wyeth of New England saw the great potential that existed for the ice business and revolutionized the industry with their efforts in the first half of the 1800s. Tudor, who was known as the “Ice King”, was more focused on shipping ice to tropical climates.\nTo ensure his product would arrive safely, he experimented with different insulating materials and built icchouses that decreased melting losses from 66 percent to less than 8 percent, Wyeth developed a method of cheaply and quickly cutting uniform blocks of ice that transformed the ice industry, He made speed handling techniques in storage, transportation and distribution possible, with less waste.\n\nD Eventually it became clear that the ice being scraped was not all clean and was causing health problems. It was becoming an increasingly difficult task to find clean sources of natural ice and by the 1890’s, pollution and sewage dumping had made the job seem even more impossible. The first signs were noticed in the brewing industry, and then the meat packing and dairy industries became seriously affected. Some sort of clean, mechanical refrigeration was desperately needed.\n\nE Many inventive men were involved in the eventual creation of the refrigerator, through different discoveries that each built on the next.\nDr. William Cullen, a Scotsman, was the first to study the evaporation of liquids in a vacuum in 1720. He later demonstrated the first known artificial refrigeration at the University of Glasgow in 1748 by letting ethyl ether boil into a partial =\n vacuum.Olvier Evans, an American inventor, designed the first refrigeration machine to use vapor instead of liquid in 1805. Although he did not actually build it, an American physician named John Gorrie, produced one very similar to Evans’ in 1842 to cool the patients with yellow fever in a Florida hospital. His basic principle is still the most often used in refrigerators today. He found the best way to cool the air was by compressing a gas, then cooling it by sending it through radiating coils, and then expanding it to lower the temperature even more, Evans was granted the first U.S. patent for mechanical refrigeration in 1851 after giving up his medical practice to focus on his experimentation with ice making.In 1820 Michael Faraday, a Londoner, first liquefied ammonia to cause cooling.\nFerdinand Carre of France developed the first ammonia/water refrigeration\n a ae |\n\nmachine in 1859, Carl von Linde was also very influential in the creation of refrigeration. In 1873 he designed the first practical and portable compressor refrigeration machine in Munich and in 1876 he began using an ammonia cycle rather than the methyl ether he used in his earlier models.\nLinde later developed a new method (Linde technique) for the liquefaction of large quantities of air inl894. The meat packing industry in Chicago was the next to adopt mechanical refrigeration nearly a decade later.\n\nF Beginning in the 1840s, refrigerated cars were used to transport milk and butter. By 1860, refrigerated transport was limited to mostly seafood and dairy products. The refrigerated railroad car was patented by J.B. Sutherland of Detroit, Michigan in 1867, He designed an insulated car with ice bunkers in cach end. Air came in on the top, passed through the bunkers, and circulated through the car by gravity, controlled by the use of hanging flaps that created differences in air temperature. There were different car designs based upon the type of cargo, whether meat or fruit.\nThe first refrigerated car to carry fresh fruit was built in 1867 by Parker Earle of Illinois, who shipped strawberries on the Illinois Central Railroad.\nEach chest contained 100 pounds of ice and 200 quarts of strawberries, It wasn until 1949 that a refrigeration system made its way into the trucking industry by way of a roof-mounted cooling device, patented by Fred Jones.\n ee ee ee ee eee ee eee ee\n\nG Refrigerators that were built in the late 1800s to 1929 used the toxic gases; methyl chloride, ammonia and sulphur dioxide as refrigerants.\nThere were numerous fatal accidents that occurred in the 1920s when methyl chloride leaked out of refrigerators. After the terrible incidents, three American companies began researching less dangerous methods of refrigeration. Frigidaire discovered a new class of synthetic refrigerants called halocarbons or CFCs (chlorofluorocarbons) in 1928. That research lead to the discovery of chlorofluorocarbons (Freon), which quickly became the standard used in compressor refrigerators. Freon was safer for those nearby but was later discovered in 1973 by Prof. James Lovelock, to be harmful to the ozone layer. To prevent further damage, new developments were made, such as Hydroflourocarbons which have no known effect on the ozone layer. Chlorofluorocarbons (CFS) are no longer used; they are outlawed in several places, making refrigeration far safer today than it has ever been,", "options": {"A": "new developments were made, such as hydrofluorocarbons.", "B": "a healthy dietary change between 1830 and the Civil War.", "C": "the discovery of chlorofluorocarbons (Freon).", "D": "a regional transport system for refrigerators over distance.", "E": "the widespread use of mechanical refrigerators."}, "questions": [{"number": "11", "stem": "The development of cities resulted in", "answer": "B", "ending": "a healthy dietary change between 1830 and the Civil War", "evidence": "“the growing urban population… created a demand for fresh food… consumption of fresh meat, fruit and vegetables increased”", "paraphrase": "development of cities ↔ growing urban population; healthy dietary change ↔ fresh food", "explanation": "B đúng về hệ quả xã hội của đô thị hóa."}, {"number": "12", "stem": "Problems/fatal accidents caused by refrigerants resulted in", "answer": "C", "ending": "the discovery of chlorofluorocarbons (Freon)", "evidence": "“toxic gases… caused fatal accidents… research led to the development of Freon”", "paraphrase": "fatal accidents ↔ toxic refrigerants; resulted in ↔ led to", "explanation": "C đúng theo quan hệ nguyên nhân-kết quả."}, {"number": "13", "stem": "Risk of environmental damage from refrigerators leads to", "answer": "A", "ending": "new developments such as hydrofluorocarbons", "evidence": "“CFCs damage the ozone layer… alternatives such as hydrofluorocarbons were developed”", "paraphrase": "environmental damage ↔ ozone depletion; new developments ↔ alternatives", "explanation": "A đúng; C là công nghệ cũ gây ra rủi ro chứ không phải giải pháp mới."}]}, {"id": 7, "title": "Nature Works for NatureWorks PLA", "passage": "EXERCGSE7\n Nature works for Nature Works™ PLA\n\nA dozen years ago, scientists at Cargill got the idea of converting lactic acid made from com into plastic while examining possible new uses for materials produced from corn wet milling processes. In the past, several efforts had been made to develop plastics from lactic acid, but with limited success. Achieving this technological breakthrough didn't come casily, but in time the efforts did succeed. A fermentation and distillation process using com was designed to create a polymer suitable for a broad variety of applications.\n\nB As an agricultural based firm, Cargill had taken this product as far as it could by 1997. The company needed a partner with access to plastics markets and polymerization capabilities, and began discussions with The Dow Chemical Company. The next step was the formation of the joint venture that created Cargill Dow LLC. Cargill Dow’s product is the world’s first commercially available plastic made from annually renewable resources such as com:\n * Nature Works™ PLA is a family of packaging polymers (carbon-based molecules) made from non-petroleum based resources.\n * Ingeo is a family of polymers for fibers made in a similar manner.\n & By applying their unique technology to the processing of natural plant sugars, Cargill Dow has created a more environmentally friendly material that reaches the consumer in clothes, cups, packaging and other products.While Cargill Dow is a stand-alone business, it continues to leverage the agricultural processing, manufacturing and polymer expertise of the two parent companies in order to bring the best possible products to market,\n\nD The basic raw materials for PLA are carbon dioxide and water. Growing plants, like corn take these building blocks from the atmosphere and the soil. They are combined in the plant to make carbohydrates (sucrose and starch) through a process driven by photosynthesis. The process for making Nature Works PLA begins when a renewable resource such as corn is milled, separating starch from the raw material. Unrefined dextrose, in tum, is processed from the starch.\n\nE Cargill Dow turns the unrefined dextrose into lactic acid using a fermentation process similar to that used by beer and wine producers, This is the same lactic\n = ==\n\nacid that is used as a food additive and is found in muscle tissue in the human body, Through a special condensation process, a lactide is formed. This lactide is purified through vacuum distillation and becomes a polymer (the base for NatureWorks PLA) that is ready for use through a solvent-free melt process.\nDevelopment of this new technology allows the company to \"harvest\" the carbon that living plants remove from the air through photosynthesis, Carbon ts stored in plant starches, which can be broken down into natural plant sugars. The carbon and other elements in these natural sugars are then used to make NatureWorks PLA.\n Nature Works PLA fits all disposal systems and is fully compostable in commercial composting facilities. With the proper infrastructure, products made from this polymer can be recycled back to a monomer and re-used as a polymer.\nThus, at the end of its life cycle, a product made from Nature Works PLA can be broken down into its simplest parts so that no sign of it remains.\n PLA is now actively competing with traditional materials in packaging and fiber applications throughout the world; based on the technology's success and promise, Cargill Dow is quickly becoming a premier player in the polymers market. This new polymer now competes head-on with petroleum-based materials like polyester. A wide range of products that vary in molecular weight and crystallinity can be produced, and the blend of physical properties of PLA makes it suited for a broad range of fiber and packaging applications. Fiber and non-woven applications include clothing, fiberfill, blankets and wipes, Packaging applications include packaging films and food and beverage containers.\n As Nature Works PLA polymers are more oil- and grease-resistant and provide a better flavor and aroma barrier than existing petroleum-based polymers, grocery retailers are increasingly using this packaging for their fresh foods. As companies begin to explore this family of polymers, more potential applications are being identified. For example, PLA possess two properties that are particularly useful for drape fabrics and window furnishings, Their resistance to ultraviolet light is particularly appealing as this reduces the amount of fading in such fabrics, and their refractive index is low, which means fabrics constructed from these polymers can be made with deep colors without requiring large amounts of dye.\nIn addition, sportswear makers have been drawn to the product as it has an inherent ability to take moisture away from the skin and when blended with cotton and wool, the result is garments that are lighter and better at absorbing moisture.\n ells le:\n\nPLA combines inexpensive large-scale fermentation with chemical processing to produce a value-added polymer product that improves the environment as well.\nThe source material for PLA is a natural sugar found in plants such as corn and using such renewable feedstock presents several environmental benefits. As an\n alternative to traditional petroleum-based polymers, the production of PLA uses 20%-50% less fossil fuel and releases a lower amount of greenhouse gasses than comparable petroleumbased plastic; carbon dioxide in the atmosphere is removed when the feedstock is grown and is returned to the earth when the polymer is degraded. Because the company is using raw materials that can be regenerated year after year, it is both cost competitive and environmentally responsible.\n ac Oe Cc\n 10 | 12 | 16 | 20 | 28 | 40 | 50 |", "options": {"A": "make things like clothes.", "B": "produce plastic from plants.", "C": "selling plastic in the market.", "D": "fermentation process.", "E": "drape fabrics.", "F": "wrapping products."}, "questions": [{"number": "27", "stem": "Scientists manage to", "answer": "B", "ending": "produce plastic from plants", "evidence": "“converting lactic acid made from corn into plastic”", "paraphrase": "plants ↔ corn; produce plastic ↔ converting into plastic", "explanation": "B là mục tiêu/công nghệ cốt lõi."}, {"number": "28", "stem": "Cargill needs to have contacts with", "answer": "C", "ending": "selling plastic in the market", "evidence": "“Dow… had extensive experience and access to plastics markets”", "paraphrase": "contacts with market ↔ access to plastics markets", "explanation": "C nói đúng năng lực thương mại mà Cargill cần từ đối tác."}, {"number": "29", "stem": "NatureWorks is used for", "answer": "F", "ending": "wrapping products", "evidence": "“packaging films and food and beverage containers”", "paraphrase": "wrapping products ↔ packaging applications", "explanation": "F khớp nhóm ứng dụng packaging."}, {"number": "30", "stem": "Ingeo is used to", "answer": "E", "ending": "drape fabrics", "evidence": "“properties… particularly useful for drape fabrics and window furnishings”", "paraphrase": "used to ↔ useful for; drape fabrics ↔ drape fabrics", "explanation": "E là cụm từ trực tiếp trong bài; A quá rộng và thuộc ứng dụng fiber nói chung."}]}, {"id": 8, "title": "Tele-working", "passage": "EXERCSE 8\n Tele-working\n Teleworking - working remotely from an office - is said to have many benefits for organisations, the environment and society. It provokes mixed reactions from its acolytes and those that experience it first-hand. Whether you like it or not, it is true to say that work is no longer dependent on geography and this opens up a range of opportunities for working in new ways and environments.\n\nB The surveys show “that the productivity increase is not primarily because of longer working hours (as is sometimes suggested). Although prevalent, working more is just one of a number of influencing factors, and not the most important.”\nAn unusual comparison of the performance of teleworkers with a closely matched control group of non-teleworkers found that not only was productivity higher, but also that absenteeism and error rates were lower.\n Two other areas where SUSTEL has added to the economic impact knowledge base is its effect on absenteeism and space utilisation. In the case of absenteeism, over 60 per cent of those surveyed stated that telework had enabled them to work when they were prevented from reaching a work location (usually through illness or transport problems). Around half the cases also identified substantial reductions in space requirements - to the point where one organisation had completely done away with a central office. Changes in non-commuting travel on weekends: home-bases workers, which includes a substantial population of people who are not telecommuters, spend more time shopping out of the home than traditional workers.\n\nD Half-time telecommuting could reduce carbon emissions by over 51 million metric tons a year—the equivalent of taking all of New York's commuters off the road. Additional carbon footprint savings will come from reduced: office energy, roadway repairs, urban heating, office construction, business travel, paper usage\n ae a | hl\n\n(as electronic documents replace paper). Although energy utilization will continue to grow as we expand our industry and improve our standard of living, efficient use of energy will always be of prime importance. By telecommuting to work instead of using more conventional methods, there is a great potential to save energy. The three major areas where energy can be conserved are:\nVehicle-related materials and resources; Highway-related materials and resources; and work-related materials and resources.\n\nE A tremendous amount of energy is required to produce transportation equipment\n such as automobiles, buses, trains and jet aircraft. If telecommuting is promoted, there will be less use of this equipment and less energy will be required for production, maintenance and repair of this equipment. Fuel resources and gases needed to operate this equipment will be reduced, as well the building and repair of highways and maintenance requires a large consumption of energy, not only in the operation of the highway construction and repair equipment, but also in the manufacture and transportation of the required materials, An increase in the percentage of people telecommuting to work will decrease the need for expanded highways and associated road maintenance, The first two areas related to getting to work,\n\nF Socially, the SUSTEL research found that most survey respondents felt that teleworking gave them a better quality of life and work-life balance, Many also reported health benefits. A significant number also stated that they were using local services more and becoming more involved in their local communities. The loss of teamwork and team spirit within teleworking populations was tackled through ideas such as Oracle's 'FUNctional’ offices. Designed to increase communication and interaction when people are at the office, they are bright, and focused around a central café to stimulate ideas and face-to-face\n contact.\n\nG The finding that many teleworkers report both longer working hours and better quality of life is paradoxical. More time working is usually associated with increased stress, domestic tension and other factors that reduce quality of life.\nOne possible explanation is that, for many individuals, their increased working hours will be less than the time they have saved in commuting. Hence, they still have more time available for family and other activities. For some, the stress\n\nH\n | aaemRE ADRIAN FRAT f\n associated with commuting (especially for long distances) may be less than that arising from additional working time. Perhaps most significantly, teleworking can in effect create time through opportunities for multi-tasking or greater control of activities, As one survey respondent noted, \"Although the amount of time has not changed it has made the weekends freer, as domestic activities can be fitted in during lunchtimes or early morning.\"\n When you work in an office or a cubicle and something goes wrong with any hardware or software you have the option of calling in the IT man. In fact, all of the equipment that you use at the office is supported by technical staff. That means regular updates and maintenance for various and sundry office tools like land-line phones, computers, internet connections, laptops, cell phones, printers, and other office equipment is all up to you. When you work from home, you'll surely encounter technical 18 | problems and when you do, where do you get the support and help you need? If your computer hard drive crashed today, would you have the funds to replace it?\n PEGG CCCOCOCOC EO\n ne a |", "options": {"A": "stress and tension.", "B": "consumption of goods.", "C": "the problem of less communication with colleagues.", "D": "many problems when equipment doesn’t work.", "E": "transport equipment such as automobiles.", "F": "technical supporters."}, "questions": [{"number": "36", "stem": "More working time is often connected with", "answer": "A", "ending": "stress and tension", "evidence": "“stress associated with commuting… may be less than that arising from additional working time”", "paraphrase": "stress ↔ stress; more working time ↔ additional working time", "explanation": "A đúng quan hệ trực tiếp."}, {"number": "37", "stem": "Oracle’s Functional idea aims to improve", "answer": "C", "ending": "the problem of less communication with colleagues", "evidence": "“designed to recreate informal contact and communication among remote workers”", "paraphrase": "improve less communication ↔ recreate contact/communication", "explanation": "C đúng mục tiêu khắc phục cô lập giao tiếp."}, {"number": "38", "stem": "When you work at an office, equipment such as computers and printers is maintained by", "answer": "F", "ending": "technical supporters", "evidence": "“the company’s technical support staff maintain office equipment”", "paraphrase": "maintained by ↔ technical support staff", "explanation": "F trực tiếp."}, {"number": "39", "stem": "When working from home using hardware and software, workers may face", "answer": "D", "ending": "many problems when equipment doesn’t work", "evidence": "“when you work from home… maintenance… is all up to you… you’ll encounter technical problems”", "paraphrase": "problems ↔ technical problems; equipment does not work ↔ maintenance is up to you", "explanation": "D đúng; F chỉ đúng trong môi trường văn phòng."}]}, {"id": 9, "title": "The Adolescents", "passage": "The Adolescents\n The American Academy of Pediatrics recognizes three stages of adolescence.\nThese are early, middle and late adolescence, and each has its own developmental tasks. Teenagers move through these tasks at their own speed depending on their physical development and hormone levels. Although these stages are common to all teenagers, each child will go through them in her own highly individual ways.\n\nB During the carly years young people make the first attempts to leave the dependent, secure role of a child and to establish themselves as unique individuals, independent of their parents. Early adolescence is marked by rapid physical growth and maturation. The focus of adolescents’ self-concepts are thus often on their\n physical self and their evaluation (nif (4) of their\n physical acceptability. Early adolescence is also a period of intense conformity to peers. ‘Getting along,’ not being different, and being accepted seem somehow pressing to the carly adolescent. The worst possibility, from the view of the carly adolescent, is to be seen by peers as “different,”\n ee: BB Be ee eee ee\n Cc Middle adolescence is marked by the emergence of new thinking skills. The intellectual world of the young person is suddenly greatly expanded. Their concerns about peers are A more directed toward their opposite sexed peers. It is also during this period that the move to establish\n (v. HNL) psychological independence from one's\n parents accelerates. Delinquency behavior may\n emerge since parental views are no longer seen as absolutely correct by adolescents. Despite some delinquent behavior, middle adolescence is a period during which young people are oriented toward what is right and proper, They are developing a sense of behavioral maturity and learning to control their\n impulsiveness (n.7P2),\n\nD Late adolescence is marked be the final preparations for adult roles. The developmental demands of late adolescence often extend into the period that we think of as young adulthood. Late adolescents attempt to crystallize their vocational goals and to establish sense of personal identity, Their needs for peer approval are diminished and they are largely psychologically independent from their parents. The shift to adulthood is nearly complete.\n\nE Some years ago, Professor Robert Havighurst of the University of Chicago proposed that stages in human development can best be thought of in terms of the developmental tasks that are part of the normal transition (n.ii¥). He identified eleven developmental tasks associated with the adolescent transition, One developmental task an adolescent needs to achieve ts to adjust to a new physical (adj. 44 (KS. 42209) sense of self. At no other time since birth does an individual undergo such rapid and profound physical changes as during early adolescence. Puberty is marked by sudden rapid growth in height and weight. Also, the young person experiences the emergence (n.{H4) and accentuation of those physical traits (nf iE) that make him or her a boy or girl. The effect of this rapid change is that the young adolescent often becomes focused on his or her body.\n\nF Before a
