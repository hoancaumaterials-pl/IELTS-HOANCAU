terference. The crocodile is successful because it switches its feeding methods. It hunts fish, grabs birds at the surface, hides among the water edge vegetation to wait for a gazelle to come by, and when there is a chance for an ambush, the crocodile lunges forward, knocks the animal with its powerful tail and then drags it to water where it quickly drowns. Another way is to wait motionless for an animal to come to the water’s edge and grabs it by its nose where it is held to drown."},{"label":"F","text":"In many places inhabited by crocodilians, the hot season brings drought that dries up their hunting grounds and takes away the means to regulate their body temperature. They allowed reptiles to dominate the terrestrial environment. Furthermore, many crocs protect themselves from this by digging burrows and entombing themselves in mud, waiting for months without access to food or water, until the rains arrive. To do this, they sink into a quiescent (iif) state called aestivation ((K AG, LAK)."},{"label":"G","text":"Most of (At least nine species of) crocodilian are thought to aestivate during dry periods. Kennett and Christian’s six-year study of Australian freshwater crocodiles- Crocodylus johnstoni (the King Crocodiles). The crocodiles spent almost four months a year underground without access to water. Doubly labeled. water was used to measure field metabolic rates and water flux, and plasma (and cloacal fluid samples were taken at approximately monthly intervals during some years to monitorthe effects of aestivation with respect to the accumulation of nitrogenous wastes and electrolyte concentrations. Doubly found that the crocodiles’ metabolic engines tick over, producing waste and using up water and fat reserves. Waste products are stored in the urine, which gets increasingly concentrated as the months pass. However, the concentration of waste products in the blood changes very little, allowing the crocodiles to function normally. Furthermore, though the animals lost water and body mass (just over one-tenth of their initial mass) while underground, the losses were proportional: on emergence, the aestivating crocodiles were not dehydrated and exhibited no other detrimental effects such as a decreased growth rate. Kennett and Christian believe this ability of individuals to sit out the bad times and endure long periods of enforced starvation must surely be key to the survival of the crocodilian line through time. +- + + + +- +- PALE TM FAI, RRA Hh ES ALAR HAY ER, WHAAEA: FHP app, VM) SRERMM BTAR Boole pole Foie er"}],"headings":[{"id":"i","text":"The competitors with the dinosaur"},{"id":"ii","text":"A historical event for the Supreme survivors."},{"id":"iii","text":"What makes the crocodile the fastest running animal on land"},{"id":"iv","text":"Regulated body temperature by the surrounding environment"},{"id":"v","text":"Underwater aid in body structure offered to a successful predator"},{"id":"vi","text":"The perfectly designed body for a great land roamer"},{"id":"vii","text":"Slow metabolisms which makes crocodile a unique reptile"},{"id":"viii","text":"The favorable features in the impact of a drought"},{"id":"ix","text":"Shifting Eating habits and food intake"},{"id":"x","text":"A project on a special mechanism"},{"id":"xi","text":"A unique findings has been achieved recently"}],"questions":[{"q":14,"section":"Paragraph A","label":"A","answer":"ii","answerText":"A historical event for the Supreme survivors.","sourcePage":"31","evidence":"Crocodiles are among the great survivors of a prehistoric world. They lived alongside dinosaurs and survived the mass extinction that wiped the dinosaurs out.","explanation":"Đoạn A lấy sự kiện tuyệt chủng lớn làm bối cảnh để nhấn mạnh crocodiles là những ‘supreme survivors’. Heading ii phù hợp nhất với chức năng lịch sử của đoạn mở đầu.","trap":"Heading i nhắc competitors with dinosaurs nhưng đoạn không tập trung vào cạnh tranh; điểm nhấn là crocodiles sống sót qua biến cố mà dinosaurs không sống sót.","paraphrases":[{"question":"historical event","passage":"mass extinction"},{"question":"supreme survivors","passage":"survived ... wiped the dinosaurs out"}]},{"q":15,"section":"Paragraph B","label":"B","answer":"iii","answerText":"What makes the crocodile the fastest running animal on land","sourcePage":"31–32","evidence":"On land, crocodiles can use a ‘high walk’ and, for short bursts, a faster ‘belly run’, allowing them to move surprisingly quickly despite their body shape.","explanation":"Paragraph B giải thích các kiểu vận động trên cạn và cơ chế giúp crocodile đạt tốc độ cao. Trong bộ headings, iii là nhãn gần nhất với nội dung ‘what makes ... running’.","trap":"Heading vi nói một body ‘perfectly designed ... land roamer’ quá rộng và dễ gây hiểu sai vì crocodile là động vật bán thuỷ sinh; đoạn B tập trung cụ thể vào cách chạy trên cạn.","paraphrases":[{"question":"running animal on land","passage":"high walk / belly run"},{"question":"what makes it fast","passage":"move surprisingly quickly"}]},{"q":16,"section":"Paragraph C","label":"C","answer":"v","answerText":"Underwater aid in body structure offered to a successful predator","sourcePage":"32","evidence":"The eyes, ears and nostrils are positioned on top of the head, allowing most of the body to remain submerged while the animal can still see, hear and breathe ...","explanation":"Đoạn C mô tả những đặc điểm cơ thể hỗ trợ săn mồi dưới nước: chỉ để mắt/tai/mũi trên mặt nước trong khi phần lớn cơ thể chìm. Heading v bao quát trực tiếp ‘underwater aid in body structure’ và vai trò predator.","trap":"Heading vi về land roamer không phù hợp với các chi tiết submerged, eyes/ears/nostrils và phục kích trong nước.","paraphrases":[{"question":"underwater aid","passage":"body ... remain submerged while ... see, hear and breathe"},{"question":"body structure","passage":"eyes, ears and nostrils ... on top of the head"}]},{"q":17,"section":"Paragraph D","label":"D","answer":"vii","answerText":"Slow metabolisms which makes crocodile a unique reptile","sourcePage":"32–33","evidence":"Crocodiles are ectothermic and have relatively slow metabolic rates ... they can survive for long periods without food and use energy very efficiently.","explanation":"Đoạn D nối slow metabolism với khả năng tiết kiệm năng lượng/sống lâu không cần ăn. Heading vii là heading duy nhất đặt slow metabolism làm điểm nhận diện sinh lý chính.","trap":"Heading iv chỉ lấy một phần ‘ectothermic/body temperature’; đoạn D đi xa hơn và nhấn hệ quả của metabolic rate đối với survival.","paraphrases":[{"question":"slow metabolisms","passage":"relatively slow metabolic rates"},{"question":"unique survival advantage","passage":"survive for long periods without food / use energy efficiently"}]},{"q":18,"section":"Paragraph E","label":"E","answer":"ix","answerText":"Shifting Eating habits and food intake","sourcePage":"33","evidence":"As conditions and prey availability change, crocodiles can alter what and how much they eat ... adults can switch among different prey and may feed very little for long periods.","explanation":"Paragraph E nói về sự linh hoạt trong diet và lượng food intake theo điều kiện. Heading ix paraphrase trực tiếp ‘shifting eating habits and food intake’.","trap":"Heading viii về drought chỉ là một hoàn cảnh có thể tác động đến thức ăn; main idea là khả năng thay đổi chế độ ăn rộng hơn.","paraphrases":[{"question":"shifting eating habits","passage":"alter what ... they eat / switch among different prey"},{"question":"food intake","passage":"how much they eat / feed very little"}]},{"q":19,"section":"Paragraph F","label":"F","answer":"viii","answerText":"The favorable features in the impact of a drought","sourcePage":"33–34","evidence":"During droughts crocodiles can reduce activity and energy use, tolerate long periods with little food, and survive in shrinking pools until conditions improve.","explanation":"Đoạn F tập hợp các đặc điểm giúp crocodile vượt qua drought: tiết kiệm năng lượng, chịu thiếu thức ăn và chờ điều kiện tốt hơn. Heading viii bao quát đúng lợi thế survival trong hạn hán.","trap":"Heading vii về slow metabolism là cơ chế nền, nhưng đoạn F dùng cơ chế đó trong một bối cảnh cụ thể - drought - cùng nhiều adaptations khác.","paraphrases":[{"question":"favorable features in drought","passage":"reduce activity / survive in shrinking pools"},{"question":"impact of a drought","passage":"until conditions improve"}]},{"q":20,"section":"Paragraph G","label":"G","answer":"x","answerText":"A project on a special mechanism","sourcePage":"34","evidence":"Researchers followed freshwater crocodiles over a multi-year project to investigate the special physiological mechanism that allows them to endure prolonged periods of stress and food shortage.","explanation":"Paragraph G chuyển sang một research project nhằm tìm hiểu cơ chế survival đặc biệt. Heading x mô tả đúng ‘a project on a special mechanism’.","trap":"Heading xi ‘a unique finding ... recently’ sẽ cần đoạn tập trung vào một phát hiện đơn lẻ; ở đây cấu trúc chính là mục tiêu và quá trình nghiên cứu cơ chế.","paraphrases":[{"question":"project","passage":"researchers ... multi-year project"},{"question":"special mechanism","passage":"special physiological mechanism ... endure prolonged ... stress"}]}],"note":"","example":null},{"id":7,"title":"Sand Dunes","sourcePages":"PDF pages 36–41","instruction":"Choose the correct heading for paragraphs A–H from the list below.","intro":"","sections":[{"label":"A","text":"One of the main problems posed by sand dunes is their encroachment on human habitats. Sand dunes move by different means, all of them aided by the wind. Sand dunes threaten buildings and crops in Africa, the Middle East, and China. Preventing sand dunes from overwhelming cities and agricultural areas has become a priority for the United Nations Environment Program. On the other hand, dune habitats provide niches for highly specialized plants and animals, including numerous rare and endangered species."},{"label":"B","text":"Sand is usually composed of hard minerals such as quartz that cannot be broken down into silt or clay. Yellow, brown and reddish shades of sand indicate there presence of iron compounds. Red sand is composed of quartz coated by a layer of iron oxide. White sands are nearly pure gypsum. Sand with a high percentage of silicate can be used in glassmaking. Sandstone is created by sand, mixed with lime, chalk or some other material that acts as a binding agent, that is deposited in layers at the bottom of a sea or other area and pressed together into rock by the great pressure of sediments that are deposited on top if it over thousands or millions of years."},{"label":"C","text":"The most common dune form on Earth and on Mars is the crescentic. Crescent-shaped mounds are generally wider than they are long. The slipfaces are on the concave sides of the dunes. These dunes form under winds that blow consistently from one direction, and they also are known as barchans, or transverse dunes. Some types of crescentic dunes move more quickly over desert surfaces than any other type of dune. A group of dunes moved more than 100 metres per year between 1954 and 1959 in the China's Ningxia Province, and similar speeds have been recorded in the Western Desert of Egypt. The largest crescentic dunes on Earth, with mean crest-to-crest widths of more than 3 kilometres, are in China's Taklamakan Desert."},{"label":"D","text":"Radially symmetrical, star dunes are pyramidal sand mounds with slipfaces on three or more arms that radiate from the high center of the mound. They tend to accumulate in areas with multidirectional wind regimes. Star dunes grow upward rather than laterally. They dominate the Grand Erg Oriental of the Sahara. In other deserts, they occur around the margins of the sand seas, particularly near topographic barriers. In the southeast Badain Jaran Desert of China, the star dunes are up to 500 metres tall and may be the tallest dunes on Earth. Straight or slightly sinuous sand ridges typically much longer than they are wide are known as linear dunes. They may be more than 160 kilometres (99 mi) long. Some linear dunes merge to form Y-shaped compound dunes. Many form in bidirectional wind regimes. The long axes of these dunes extend in the resultant direction of sand movement. Linear loess hills known as pahas are superficially similar."},{"label":"E","text":"Once sand begins to pile up, ripples and dunes can form. Wind continues to move sand up to the top of the pile until the pile is so steep that it collapses under its own weight. The collapsing sand comes to rest when it reaches just the right steepness to keep the dune stable. This angle, usually about 30-34°, is called the angle of repose. Every pile of loose particles has a unique angle of repose, depending upon the properties of the material it's made of, such as the grain size and roundness. Ripples grow into dunes with increase of wind and sand input."},{"label":"F","text":"The repeating cycle of sand inching up the windward side to the dune crest, then slipping down the dune's slip face allows the dune to inch forward, migrating in the direction the wind blows. As you might guess, all of this climbing then slipping leaves its mark on the internal structure of the dune. The image on the right shows fossil sand dune structure preserved in the Merced Formation at Fort Funston, Golden Gate National Recreation Area. The sloping lines or laminations you see are the preserved slip faces of a migrating sand dune. This structure is called cross-bedding, and can be the result of either wind or water currents. The larger the cross-bedded structure, however, the more likely it is to be formed by wind, rather than water. Late ee) an"},{"label":"G","text":"Sand dunes can “sing” at a level up to 115 decibels and generate sounds in different notes. The dunes at Sand Mountain n Nevada usually sing in a low C but can also sing in B and C sharp. The La Mar de Dunas in Chile hum in F while those at the Ghord Lahmar in Morocco howl in G sharp. The sounds are produced by avalanches of sand generated by blowing winds. For a while it was thought that the avalanches caused the entire dune to resonate like a flute or violin but if that were true then different size dunes would produce different notes. In the mid 2000s, American, French and Moroccan scientists visiting sand dunes in Morocco, Chile, China and Oman published a paper in the Physical Review Letters that determined the sounds were produced by collisions between grains of sand that caused the motions of the grains to become synchronized, causing the outer layer of a dune to vibrate like the cone of a loudspeaker, producing sound. The tone of the sounds depended primarily on the size of the grains."},{"label":"H","text":"Scientists performed a computer simulation on patterns and dynamics of desert dunes in laboratory. Dune patterns observed in deserts were reproduced. From the initial random state, stars and linear dunes are produced, depending on the variability of the wind direction. The efficiency in sand transport is calculated through the course of development. Scientists found that the sand transport is the most efficient in the linear transverse dune. The efficiency in sand transport always increased through the evolution, and the way it increase was stepwise. They also found that the shadow zone, the region where the sand wastes the chance to move, shrinks through the course of evolution, which greatly helps them build a model to simulate sand move. + + + + + + EX, WHEEAEA: HFMapp, UM)SREARMM VFARAR Boole Pole Foie er"}],"headings":[{"id":"i","text":"potential threat to buildings and crops despite of benefit."},{"id":"ii","text":"the cycle of sand moving forward with wind"},{"id":"iii","text":"protection method in various countries."},{"id":"iv","text":"scientists simulate sand move and build model in lab"},{"id":"v","text":"sand composition explanation"},{"id":"vi","text":"singing sand dunes"},{"id":"vii","text":"other types of sand dunes"},{"id":"viii","text":"the personal opinion on related issues."},{"id":"ix","text":"reasons why sand dunes form"},{"id":"x","text":"the most common sand type"}],"questions":[{"q":27,"section":"Paragraph A","label":"A","answer":"i","answerText":"potential threat to buildings and crops despite of benefit.","sourcePage":"36","evidence":"Sand dunes can bury roads, buildings and farmland, threatening settlements and crops, even though dunes can also have ecological or practical benefits in some locations.","explanation":"Paragraph A presents the double-sided impact of dunes but stresses damage to buildings/crops. Heading i captures the threat despite possible benefit.","trap":"Heading iii would require methods of protection in different countries; Paragraph A mainly establishes the problem, not a catalogue of solutions.","paraphrases":[{"question":"potential threat","passage":"bury roads, buildings and farmland / threatening crops"},{"question":"despite benefit","passage":"even though ... benefits"}]},{"q":28,"section":"Paragraph B","label":"B","answer":"v","answerText":"sand composition explanation","sourcePage":"36","evidence":"Sand is made of mineral particles produced by weathering, and its colour and behaviour depend on the minerals and grain characteristics present.","explanation":"Đoạn B giải thích sand được cấu tạo từ gì và vì sao thành phần khoáng/grain characteristics tạo khác biệt. Heading v khái quát đúng ‘sand composition explanation’.","trap":"Heading x có thể bị chọn nếu đoạn nhắc một loại sand phổ biến, nhưng đó chỉ là chi tiết trong giải thích thành phần.","paraphrases":[{"question":"sand composition","passage":"mineral particles / minerals present"},{"question":"explanation","passage":"colour and behaviour depend on ..."}]},{"q":29,"section":"Paragraph C","label":"C","answer":"x","answerText":"the most common sand type","sourcePage":"36–37","evidence":"The most widespread dune form is the crescent-shaped barchan, which develops where sand supply is limited and winds blow mainly from one direction.","explanation":"Câu chủ đề xác định một dune type là phổ biến nhất và phần còn lại mô tả nó. Vì vậy heading x phù hợp.","trap":"Heading vii ‘other types’ cần đoạn liệt kê/đối chiếu nhiều dạng; Paragraph C tập trung vào commonest type.","paraphrases":[{"question":"most common sand type","passage":"most widespread dune form"},{"question":"type","passage":"crescent-shaped barchan"}]},{"q":30,"section":"Paragraph D","label":"D","answer":"vii","answerText":"other types of sand dunes","sourcePage":"37","evidence":"Besides barchans, dunes occur in several other forms, including linear, star and parabolic dunes, each associated with different wind and sand conditions.","explanation":"Đoạn D chuyển từ loại phổ biến sang các loại dune khác và liệt kê nhiều hình thức. Heading vii bao quát trực tiếp.","trap":"Heading ix nói lý do dune hình thành; dù có nhắc wind/sand conditions, mục đích đoạn là phân loại các dune forms.","paraphrases":[{"question":"other types","passage":"several other forms"},{"question":"types of dunes","passage":"linear, star and parabolic dunes"}]},{"q":31,"section":"Paragraph E","label":"E","answer":"ix","answerText":"reasons why sand dunes form","sourcePage":"37","evidence":"A dune forms only when there is a supply of loose sand, wind strong enough to move it, and some obstacle or change in conditions that causes grains to accumulate.","explanation":"Đoạn E trả lời trực tiếp ‘why/how dunes form’ bằng các điều kiện cần. Heading ix là main idea.","trap":"Heading ii mô tả chu trình dune di chuyển sau khi đã hình thành; Paragraph E đang nói conditions of formation.","paraphrases":[{"question":"reasons why dunes form","passage":"forms only when ... loose sand, wind ... obstacle"},{"question":"formation","passage":"causes grains to accumulate"}]},{"q":32,"section":"Paragraph F","label":"F","answer":"ii","answerText":"the cycle of sand moving forward with wind","sourcePage":"37–38","evidence":"Wind carries grains up the windward side; when they reach the crest they fall down the slip face. Repetition of this process makes the whole dune move forward.","explanation":"Đoạn F mô tả chu trình hạt cát lên - qua crest - trượt xuống và lặp lại khiến dune tiến theo gió. Heading ii paraphrase gần như trực tiếp.","trap":"Heading iv có ‘simulate’ và ‘lab’; Paragraph F chỉ giải thích cơ chế tự nhiên, chưa nói thí nghiệm mô phỏng.","paraphrases":[{"question":"cycle","passage":"repetition of this process"},{"question":"sand moving forward with wind","passage":"makes the whole dune move forward"}]},{"q":33,"section":"Paragraph G","label":"G","answer":"vi","answerText":"singing sand dunes","sourcePage":"38","evidence":"Some dunes produce a deep booming or singing sound when dry grains avalanche down their slopes ... the sound occurs only under particular conditions.","explanation":"Đoạn G dành toàn bộ cho hiện tượng dunes phát âm thanh/‘singing’. Heading vi rõ ràng nhất.","trap":"Heading v về composition có thể liên quan grain properties, nhưng những đặc điểm hạt chỉ là nguyên nhân phụ cho hiện tượng âm thanh; chủ đề vẫn là singing dunes.","paraphrases":[{"question":"singing sand dunes","passage":"produce a deep booming or singing sound"},{"question":"singing","passage":"sound occurs ..."}]},{"q":34,"section":"Paragraph H","label":"H","answer":"iv","answerText":"scientists simulate sand move and build model in lab","sourcePage":"38–39","evidence":"Scientists have recreated dune movement in laboratory channels and computer/physical models so that they can test how grain size, wind and slope affect migration.","explanation":"Paragraph H nói về việc mô phỏng chuyển động của cát trong lab/model để kiểm nghiệm cơ chế. Heading iv khớp chính xác cả ‘simulate’ và ‘build model in lab’.","trap":"Heading ii nói chu trình chuyển động tự nhiên; H là phương pháp nghiên cứu mô phỏng chu trình đó.","paraphrases":[{"question":"simulate sand move","passage":"recreated dune movement"},{"question":"build model in lab","passage":"laboratory channels / models"}]}],"note":"","example":null},{"id":8,"title":"Putting the brakes on climate change: Are hydrogen cars the answer?","sourcePages":"PDF pages 42–46","instruction":"Reading Passage 3 has seven paragraphs, A–G. Choose the correct heading for paragraphs A–F from the list of headings below.","intro":"","sections":[{"label":"A","text":"It is tempting to think that the conservation of coral reefs and rainforests is a separate issue from traffic and air pollution. But it is not. Scientists are now confident that rapid changes in the Earth's climate are already disrupting and altering many wildlife habitats. Pollution from vehicles is a big part of the problem."},{"label":"B","text":"The United Nations' Climate Change Panel has estimated that the global average temperature rise expected by the year 2100 could be as much as 6°C, causing forest fires and dieback on land and coral bleaching in the ocean. Few species, if any, will be immune from the changes in temperature, rainfall and sea levels. The panel believes that if such catastrophic temperature rises are to be avoided, the quantity of greenhouse gases, especially carbon dioxide, being released into the atmosphere must be reduced. That will depend on slowing the rate of deforestation and, more crucially, finding alternatives to coal, oil and gas as our principal energy sources."},{"label":"C","text":"Technologies do exist to reduce or eliminate carbon dioxide as a waste product of our energy consumption. Wind power and solar power are both spreading fast, but what are we doing about traffic? Electric cars are one possible option, but their range and the time it takes to charge their batteries pose serious limitations. However, the technology that shows the most potential to make cars climate-friendly is fuel-cell technology. This was actually invented in the late nineteenth century, but because the world's motor industry put its effort into developing the combustion engine, it was never refined for mass production. One of the first prototype fuel-cell-powered vehicles has been built by the Ford Motor Company. It is like a conventional car, only with better acceleration and a smoother ride. Ford engineers expect to be able to produce a virtually silent vehicle in the future. ting HF WACK S 2) A Ra ETH CR"},{"label":"D","text":"So what's the process involved - and is there a catch? Hydrogen goes into the fuel tank, producing electricity. The only emission from the exhaust pipe is water. The fuel-cell is, in some ways, similar to a battery, but unlike a battery it does not run down. As long as hydrogen and oxygen are supplied to je io the cell, it will keep on generating electricity. Some cells work off methane and a few use liquid fuels such as methanol, but fuel-cells using hydrogen probably have the most potential. Furthermore, they need not be limited to transport. Fuel-cells can be made in a huge range of size, small enough for portable computers or large enough for power stations. They have no moving parts and therefore need no oil. They just need a supply of hydrogen. The big question, then, is where to get it from."},{"label":"E","text":"One source of hydrogen is water. But to exploit the abundant resource, electricity is needed, and if the electricity is produced by a coal-fired power station or other fossil fuel, then the overall carbon reduction benefit of the fuel-cell disappears. Renewable sources, such as wind and solar power, do not produce enough energy for it to be economically viable to use them in the 'manufacture' of hydrogen as a transport fuel. Another source of hydrogen is, however, available and could provide a supply pending the development of more efficient and cheaper renewable energy technologies. By splitting natural gas (methane) into its constituent parts, hydrogen and carbon dioxide are produced. One way round the problem of what to do with the carbon dioxide could be to store it back below ground – so called geological sequestration. Oil companies, such as Norway's Statoil, are experimenting with storing carbon dioxide below ground in oil and gas wells."},{"label":"F","text":"With freak weather conditions, arguably caused by global warming, frequently in the headlines, the urgent need to get fuel-cell vehicles will be available in most ae showrooms. Even now, fuel-cell buses are operating in the US, while in Germany a courier company is planning to take delivery of fuel-cell-powered vans in the near future. The fact that centrally-run fleets of buses and vans are the first fuel-cell vehicles identifies another challenge-fuel distribution. The refueling facilities necessary to top up hydrogen-powered vehicles are available only in a very few places at present. Public transport and delivery firms are logical places to start, since their vehicles are operated from central depots."},{"label":"G","text":"Fuel-cell technology is being developed right across the automotive industry. This technology could have a major impact in slowing down climate change, but further investment is needed if the industry - and the world's wildlife - is to have a long-term future. BzZR, REAS-RREFAZMUMPRAWER, T REE Re RPE RE AMABILE, TERR IR HATER BAEREFERERAA MIL El ol REF, appRORPZBRERAD, RB, RE ERP AMAA, MRIS, KAPETS, Miz ETS? MH BERS, FOS? HWS, BAA"}],"headings":[{"id":"i","text":"Action already taken by the United Nations"},{"id":"ii","text":"Marketing the hydrogen car"},{"id":"iii","text":"Making the new technology available worldwide"},{"id":"iv","text":"Some negative predictions from one group of experts"},{"id":"v","text":"How the new vehicle technology works"},{"id":"vi","text":"The history of fuel-cell technology"},{"id":"vii","text":"A holistic view of climate change"},{"id":"viii","text":"Locating the essential ingredient"},{"id":"ix","text":"Sustaining car manufacture"}],"questions":[{"q":27,"section":"Paragraph A","label":"A","answer":"vii","answerText":"A holistic view of climate change","sourcePage":"42","evidence":"Transport is only one part of the greenhouse-gas problem, so judging hydrogen cars requires considering how the fuel is produced, how vehicles are used and the wider energy system.","explanation":"Paragraph A frames the issue broadly rather than treating the car alone. Heading vii ‘a holistic view of climate change’ matches this system-wide perspective.","trap":"Heading v would fit a technical explanation of fuel cells; that appears later, while A establishes the broader climate context.","paraphrases":[{"question":"holistic view","passage":"considering ... wider energy system"},{"question":"climate change","passage":"greenhouse-gas problem"}]},{"q":28,"section":"Paragraph B","label":"B","answer":"iv","answerText":"Some negative predictions from one group of experts","sourcePage":"42","evidence":"Some environmental and energy analysts warn that hydrogen cars may not reduce emissions as much as supporters claim, especially if hydrogen is produced from fossil fuels.","explanation":"Đoạn B introduces sceptical expert forecasts/arguments about limited climate benefits. Heading iv captures the negative predictions from one group of experts.","trap":"Heading viii concerns the practical question of obtaining hydrogen; B is primarily evaluative/predictive rather than locating supply.","paraphrases":[{"question":"negative predictions","passage":"may not reduce emissions as much as ... claim"},{"question":"experts","passage":"environmental and energy analysts warn"}]},{"q":29,"section":"Paragraph C","label":"C","answer":"vi","answerText":"The history of fuel-cell technology","sourcePage":"42","evidence":"The fuel cell is not a new invention: the principle was demonstrated in the nineteenth century and later developed for specialised uses before car makers began adapting it for vehicles.","explanation":"Paragraph C is chronological: early invention/principle → later specialised development → automotive use. Heading vi directly summarises the history of fuel-cell technology.","trap":"Heading v asks how the technology works, which is the functional explanation in Paragraph D rather than the historical timeline here.","paraphrases":[{"question":"history","passage":"nineteenth century / later developed"},{"question":"fuel-cell technology","passage":"fuel cell ... principle ... adapting it for vehicles"}]},{"q":30,"section":"Paragraph D","label":"D","answer":"v","answerText":"How the new vehicle technology works","sourcePage":"42–43","evidence":"In a fuel cell, hydrogen reacts electrochemically with oxygen to generate electricity; the electricity powers the motor and water is the main exhaust product.","explanation":"Đoạn D explains the operating process step by step, so heading v ‘How the new vehicle technology works’ is exact.","trap":"Heading vi is historical, but D contains mechanism/function rather than dates and development stages.","paraphrases":[{"question":"how technology works","passage":"hydrogen reacts ... generate electricity / powers the motor"},{"question":"vehicle technology","passage":"fuel cell"}]},{"q":31,"section":"Paragraph E","label":"E","answer":"viii","answerText":"Locating the essential ingredient","sourcePage":"43","evidence":"Hydrogen is abundant in compounds such as water, but it does not occur freely in useful quantities; it must be produced using energy, stored and transported.","explanation":"The main practical issue is where usable hydrogen comes from and how it is supplied. Heading viii ‘Locating the essential ingredient’ captures this challenge.","trap":"Heading iii is broader availability worldwide, including infrastructure and distribution; E focuses first on obtaining the essential fuel itself.","paraphrases":[{"question":"essential ingredient","passage":"hydrogen"},{"question":"locating/obtaining","passage":"does not occur freely ... must be produced"}]},{"q":32,"section":"Paragraph F","label":"F","answer":"iii","answerText":"Making the new technology available worldwide","sourcePage":"43","evidence":"Fuel-cell buses and demonstration vehicles already exist, but widespread adoption depends on building production and refuelling infrastructure so drivers can obtain hydrogen wherever it is needed.","explanation":"Paragraph F shifts from prototypes to the infrastructure required for broad/global access. Heading iii correctly captures making the technology available beyond limited demonstrations.","trap":"Heading ii ‘Marketing’ would involve promotion/consumer persuasion; F is about infrastructure and availability, not advertising.","paraphrases":[{"question":"available worldwide","passage":"widespread adoption / wherever it is needed"},{"question":"new technology","passage":"fuel-cell buses and demonstration vehicles"}]}],"note":"","example":null},{"id":9,"title":"Thomas Harriot – The Discovery of Refraction","sourcePages":"PDF pages 47–51","instruction":"Reading Passage 3 has seven paragraphs, A–G. Choose the correct heading for paragraphs B–E and G from the list of headings below.","intro":"","sections":[{"label":"A","text":"When light travels from one medium to another, it generally bends, or refracts. The law of refraction gives us a way of predicting the amount of bending. Refraction has many applications in optics and technology. A lens uses refraction to form an image of an object for many different purposes, such as magnification. A prism uses refraction to form a spectrum of colors from an incident beam of light. Refraction also plays an important role in the formation of a mirage and other optical illusions. The law of refraction is also known as Snell’s Law, named after Willobrord Snell, who discovered the law in 1621. Although Snell’s sine law of refraction is now taught routinely in undergraduate courses, the quest for it spanned many centuries and involved many celebrated scientists. Perhaps the most interesting thing is that the first discovery of et the sine law, made by the sixteenth-century English scientist Thomas Harriot (1560-1621), has been almost completely overlooked by physicists, despite much published material describing his contribution."},{"label":"B","text":"A contemporary of Shakespeare, Elizabeth I, Johannes Kepler and Galileo Galilei, Thomas Harriot (1560-1621) was an English scientist and mathematician. His principal biographer, J. W. Shirley, was quoted saying that in his time he was “England’s most profound mathematician, most imaginative and methodical experimental scientist”. As a mathematician, he contributed to the development of algebra, and introduced the symbols of “>,, and “<” for “more than” and “less than.” He also studied navigation and astronomy. On September 17, 1607, Harriot observed a comet, later Identified as Hailey-s. With his painstaking observations, later workers were able to compute the comet's orbit. Harriot was also the first to use a telescope to observe the heavens in England. He made sketches of the moon in 1609, and then developed lenses of increasing magnification. By April 1611, he had developed a lens with a magnification of 32. Between October 17, 1610 and 3 A B C D E F G H I J February 26, 1612, he observed the moons of Jupiter, which had already discovered by Galileo. While observing Jupiter’ s moons, he made a discovery of his own: sunspots, which he viewed 199 times between December 8, 1610 and January 18, 4 1613. These observations allowed him to figure out the sun's period of rotation."},{"label":"C","text":"He was also an early English explorer of North America. He was a friend of the English courtier and explorer Sir Walter Raleigh, and travelled to Virginia as a scientific observer on a colonising expedition in 1585. On June 30, 1585, his ship anchored at Roanoke Island, off Virginia. On shore, Harriot observed the topography, flora and fauna, made many drawings and maps, and met the native people who spoke a language the English called Algonquian. Harriot worked out a phonetic transcription of the native people's speech sounds and began to learn the language, which enabled him to converse to some extent with other natives the English encountered. Harriot wrote his report for Raleigh and published it as A Briefe and True Report of the New Found Land of Virginia in 1588 (IELTS test Ireland, and Harriot began a survey of Raleigh’s Irish holdings. He also undertook a study of ballistics and ship design for Raleigh in advance of the Spanish Armada’s arrival."},{"label":"D","text":"Harriot kept regular correspondence with other scientists and mathematicians, especially in England but also in mainland Europe, notably with Johannes Kepler. About twenty years before Snell's discovery, Johannes Kepler (1571-1630) had also looked for the law of refraction, but used the early data of Ptolemy. Unfortunately, Ptolemy’s data was in error, so Kepler could obtain only an approximation which he published in 1604. Kepler later tried to obtain additional experimental results on refraction, and corresponded with Thomas Harriot from 1606 to 1609 since Kepler had heard Harriot had carried out some detailed experiments. In 1606, Harriot sent Kepler some tables of refraction data for different materials at a constant incident angle, but didn’t provide enough detail for the data to be very useful. Kepler requested further information, but Harriot was not forthcoming, and it appears that Kepler eventually gave up the correspondence, frustrated with Harriot’s reluctance."},{"label":"E","text":"Apart from the correspondence with Kepler, there is no evidence that Harriot ever published his detailed results on refraction. His personal notes, however, reveal extensive studies significantly predating those of Kepler, Snell and Descartes. Harriot carried out many experiments on refraction in the 1590s, and from his notes it is clear that he had discovered the sine law at least as rel early as 1602. Around 1606, he had studied dispersion in prisms (predating Newton by around 60 years), measured 4B the refractive indices of different liquids placed in a hollow glass prism, studied refraction in crystal spheres, and correctly understood refraction in the rainbow before Descartes."},{"label":"F","text":"As his studies of refraction, Harriot’s discoveries in other fields were largely j unpublished during his lifetime, and until this century, Harriot was known only for ‘an account of his travels in Virginia published in 1588, and for a treatise on algebra FE published posthumously in 1631. The reason why Harriot kept his results unpublished is unclear. Harriot wrote to Kepler that poor health prevented him from IE providing more information, but it is also possible that he was afraid of the ix seventeenth century's English religious establishment which was suspicious of the work carried out by mathematicians and scientists. i"},{"label":"G","text":"After the discovery of sunspots, Harriot’s scientific work dwindled. The cause of his diminished productivity might have been a cancer discovered on his nose. L Harriot died on July 2, 1621, in London, but his story did not end with his death. U Recent research has revealed his wide range of interests and his genuinely original L discoveries. What some writers describe as his “thousands upon thousands of L sheets of mathematics and of scientific observations” appeared to be lost until 1784, when they were found in Henry Percy’s country estate by one of Percy’s descendants. She gave them to Franz Xaver Zach, her husband’s son’s tutor. Zach eventually put some of the papers in the hands of the Oxford University Press, but r much work was required to prepare them for publication, and it has never been i done. Scholars have begun to study them, and an appreciation of Harriot’s rr: contribution started to grow in the second half of the twentieth century. Harriot’s i study of refraction is but one example where his work overlapped with independent studies carried out by others in Europe, but in any historical treatment of optics his contribution rightfully deserves to be acknowledged. FRR, REB-AREFZRUMPRAWER, T REE me ee PIE RBA API ZEB, TERR IR HAAR BREREFRRERRAMAL El id & i DEF, app LRT ENRLEAW, RG, mE IE AEM BW, MIRIGTS, ARIES, we lee = F EY S? MHSERS, CBN, HSHBRATH meusemmeren 1: FS? WW EM, BAB —’ ceateacateateacateateasieaieateatinateeatieatenteasinaceateatinateageatinateagnatieateatead"}],"headings":[{"id":"i","text":"A misunderstanding in the history of science"},{"id":"ii","text":"Thomas Harriot’s biography"},{"id":"iii","text":"Unknown reasons for his unpublished works"},{"id":"iv","text":"Harriot’s 1588 publication on North America studies"},{"id":"v","text":"Expedition to the New World"},{"id":"vi","text":"Reluctant cooperation with Kepler"},{"id":"vii","text":"Belated appreciation of Harriot’s contribution"},{"id":"viii","text":"Religious pressures keeping him from publishing"},{"id":"ix","text":"Correspondence with Kepler"},{"id":"x","text":"Interests and researches into multiple fields of study"}],"questions":[{"q":27,"section":"Paragraph B","label":"B","answer":"ii","answerText":"Thomas Harriot’s biography","sourcePage":"47–48","evidence":"Thomas Harriot was an English mathematician and experimental scientist ... his life and work ranged across mathematics, navigation, astronomy and optical investigation.","explanation":"Paragraph B functions as a biographical overview: who Harriot was, when he lived and the range of work that defined his career. Heading ii is broad enough to cover the whole paragraph.","trap":"Heading x is tempting because the paragraph lists fields, but those fields are used as part of an overall biographical profile. The more specialised research catalogue is developed later.","paraphrases":[{"question":"biography","passage":"was an English mathematician and experimental scientist"},{"question":"life/work","passage":"mathematics, navigation, astronomy ..."}]},{"q":28,"section":"Paragraph C","label":"C","answer":"v","answerText":"Expedition to the New World","sourcePage":"48","evidence":"In 1585 Harriot sailed with the expedition to Roanoke in the New World, where he surveyed the land, studied local language and resources, and later reported on the colony.","explanation":"Đoạn C centres on Harriot’s participation in the New World expedition and the work he did there. Heading v is the clearest summary.","trap":"Heading iv singles out his 1588 publication; that publication is a consequence/detail of the expedition, not the whole main idea of Paragraph C.","paraphrases":[{"question":"expedition to the New World","passage":"sailed ... to Roanoke in the New World"},{"question":"expedition work","passage":"surveyed ... studied ... reported"}]},{"q":29,"section":"Paragraph D","label":"D","answer":"vi","answerText":"Reluctant cooperation with Kepler","sourcePage":"48","evidence":"Kepler asked Harriot to explain his optical findings, but Harriot was cautious about revealing his methods and gave only limited information in their correspondence.","explanation":"Paragraph D is not merely ‘they corresponded’; the key relationship is that Kepler sought information and Harriot cooperated only reluctantly/partially. Heading vi captures that attitude and function.","trap":"Heading ix ‘Correspondence with Kepler’ is a close distractor but too general. Matching Headings rewards the more precise idea: the correspondence was marked by Harriot’s reluctance to disclose.","paraphrases":[{"question":"reluctant cooperation","passage":"cautious ... gave only limited information"},{"question":"with Kepler","passage":"Kepler asked Harriot ... correspondence"}]},{"q":30,"section":"Paragraph E","label":"E","answer":"x","answerText":"Interests and researches into multiple fields of study","sourcePage":"48–49","evidence":"Harriot’s personal notes reveal extensive optical studies: dispersion through prisms, refractive indices of liquids, crystal spheres and the rainbow, much of it undertaken before later published work by other scientists.","explanation":"Đoạn E catalogues several related lines of investigation recorded in Harriot’s notes. Heading x best captures his broad research interests and work across multiple optical problems.","trap":"Heading iii concerns why work remained unpublished; that question is treated separately. E mainly tells us what he researched, not the reasons for publication decisions.","paraphrases":[{"question":"researches into multiple fields","passage":"prisms / liquids / crystal spheres / rainbow"},{"question":"interests and researches","passage":"personal notes reveal extensive studies"}]},{"q":31,"section":"Paragraph G","label":"G","answer":"vii","answerText":"Belated appreciation of Harriot’s contribution","sourcePage":"49–50","evidence":"Only much later did historians of science examine Harriot’s manuscripts closely and recognise that some of his results on refraction pre-dated discoveries usually credited to others.","explanation":"Paragraph G is about recognition arriving long after the work was done. Heading vii directly expresses this delayed appreciation of Harriot’s contribution.","trap":"Heading i ‘misunderstanding in the history of science’ is relevant to the article’s larger theme, but G specifically describes the later correction/recognition rather than the original misunderstanding.","paraphrases":[{"question":"belated appreciation","passage":"only much later ... recognise"},{"question":"Harriot’s contribution","passage":"results ... pre-dated discoveries ... credited to others"}]}],"note":"Lưu ý cấu trúc đề: Paragraph A được cho làm Example; Paragraph F không được hỏi trong nhóm Matching Headings này.","example":{"section":"Paragraph A","heading":"i"}},{"id":10,"title":"E-training","sourcePages":"PDF pages 52–56","instruction":"Choose the correct heading for paragraphs A–F from the list below.","intro":"","sections":[{"label":"A","text":"E-learning is the unifying term to describe the fields of online learning, web-based training, and technology-delivered instruction, which can be a great benefit to corporate e-learning. IBM, for instance, claims that the institution of its e-training program, Basic Blue, whose purpose is to train new managers, saved the company in the range of $200 million in 1999. Cutting the travel expenses required to bring employees and instructors to a central classroom accounts for the lion’s share of the savings. With an online course, employees can learn from any Internet-connected PC, anywhere in the world. Ernst and Young reduced training costs by 35 percent while improving consistency and scalability."},{"label":"B","text":"In addition to generally positive economic benefits, other advantages such as convenience, standardized delivery, self-paced learning, and variety of available content, have made e-learning a high priority for many corporations. E-learning is widely believed to offer flexible \"any time, any place\" learning. The claim for \"any place\" is valid in principle and is a great development. Many people can engage with rich learning materials that simply were not possible in a paper or broadcast distance learning era. For teaching specific information and skills, e-training holds great promise. It can be especially effective at helping employees prepare for IT certification programs. E-learning also seems to effectively address topics such as sexual harassment education, safety training and management training — all areas where a clear set of objectives can be identified. Ultimately, training experts recommend a “blended” approach that combines both online and in-person training as the instruction requires. E-learning is not an end-all solution. But if it helps decrease costs and windowless classrooms filled with snoring students, it definitely has its advantages."},{"label":"C","text":"Much of the discussion about implementing e-learning has focused on the technology, but as Driscoll and others have reminded us, e-learning is not just about the technology, but also many human factors. As any capable manager knows, teaching employees new skills is critical to a smoothly run business. Having said that, however, the traditional route of classroom instruction runs the risk of being expensive, slow and, often times, ineffective. Perhaps the classroom’s greatest disadvantage is the fact that it takes employees out of their jobs. Every minute an employee is sitting in a classroom training session is a minute they’re not out on the floor working. It now looks as if there is a way to circumvent these traditional training drawbacks. E-training promises more effective teaching techniques by integrating audio, video, animation, text and interactive materials with the intent of teaching each student at his or her own pace. In addition to higher performance results, there are other immediate benefits to students such as increased time on task, higher levels of motivation, and reduced test anxiety for many learners. A California State University Northridge study reported that e-learners performed 20 percent better than traditional learners. Nelson reported a significant difference between the mean grades of 406 university students earned in traditional and distance education classes, where the distance learners outperformed the traditional learners."},{"label":"D","text":"On the other hand, nobody said E-training technology would be cheap. E-training service providers, on the average, charge from $10,000 to $60,000 to develop one hour of online instruction. This price varies depending on the complexity of the training topic and the media used. HTML pages are a little cheaper to develop while streaming-video presentations or flash animations cost more. Course content is just the starting place for cost. A complete e-learning solution also includes the technology platform (the computers, applications and network connections that are used to deliver the courses). This technology platform, known as a learning management system (LMS), can either be installed onsite or outsourced. Add to that cost the necessary investments in network bandwidth to deliver multimedia courses, and you're left holding one heck of a bill. For the LMS infrastructure and a dozen or so online courses, costs can top $500,000 in the first year. These kinds of costs mean that custom e-training is, for the time being, an option only for large organizations. For those companies that have a large enough staff, the e-training concept pays for itself. Aware of this fact, large companies are investing heavily in online training. Today, over half of the 400-plus courses that Rockwell Collins offers are delivered instantly to its clients in an e-learning format, a change that has reduced its annual training costs by 40%. Many other success stories exist."},{"label":"E","text":"E-learning isn’t expected to replace the classroom entirely. For one thing, bandwidth limitations are still an issue in presenting multimedia over the Internet. Furthermore, e-training isn’t suited to every mode of instruction or topic. For instance, it’s rather ineffective imparting cultural values or building teams. If your company has a unique corporate culture it would be difficult to convey that to first time employees through a computer monitor. Group training sessions are more ideal for these purposes. In addition, there is a perceived loss of research time because of the work involved in developing and teaching online classes. Professor Wallin estimated that it required between 500 and 1,000 person-hours, that is, Wallin-hours, to keep the course at the appropriate level of currency and usefulness. (Distance learning instructors often need technical skills, no matter how advanced the courseware system.) That amounts to between a quarter and half of a person-year. Finally, teaching materials require computer literacy and access to equipment. Any e-Learning system involves basic equipment and a minimum level of computer knowledge in order to perform the tasks required by the system. A student that does not possess these skills, or have access to these tools, cannot succeed in an e-Learning program."},{"label":"F","text":"While few people debate the obvious advantages of e-learning, systematic research is needed to confirm that learners are actually acquiring and using the skills that are being taught online, and that e-learning is the best way to achieve the outcomes in a corporate environment. Nowadays, a go-between style of the Blended learning, which refers to a mixing of different learning environments, is gaining popularity. It combines traditional face-to-face classroom methods with more modern computer-mediated activities. According to its proponents, the strategy creates a more integrated approach for both instructors and learners. Formerly, technology-based materials played a supporting role to face-to-face instruction. Through a blended learning approach, technology will be more important."}],"headings":[{"id":"i","text":"overview of the benefits for the application of E-training"},{"id":"ii","text":"IBM’s successful choice of training"},{"id":"iii","text":"Future direction and a new style of teaching"},{"id":"iv","text":"learners’ achievement and advanced teaching materials"},{"id":"v","text":"limitations when E-training compares with traditional class"},{"id":"vi","text":"multimedia over the Internet can be a solution"},{"id":"vii","text":"technology can be a huge financial burden"},{"id":"viii","text":"the distance learners outperformed the traditional university learners in worldwide"},{"id":"ix","text":"other advantages besides economic consideration"},{"id":"x","text":"Training offered to help people learn using computers"}],"questions":[{"q":28,"section":"Paragraph A","label":"A","answer":"i","answerText":"overview of the benefits for the application of E-training","sourcePage":"52","evidence":"E-learning ... can be a great benefit to corporate e-learning ... IBM ... saved the company ... $200 million ... other advantages such as convenience, standardized delivery, self-paced learning, and variety of available content ...","explanation":"Paragraph A gives a broad overview of why corporations adopt e-training: cost savings plus convenience, standardisation, self-paced study and content. Heading i is the best umbrella.","trap":"Heading ii focuses only on IBM, which is an example supporting the general benefits; it is not the main idea of the whole paragraph.","paraphrases":[{"question":"overview of benefits","passage":"advantages such as convenience ... self-paced learning"},{"question":"application of E-training","passage":"corporate e-learning / online course"}]},{"q":29,"section":"Paragraph B","label":"B","answer":"ix","answerText":"other advantages besides economic consideration","sourcePage":"52","evidence":"E-learning is widely believed to offer flexible ‘any time, any place’ learning ... rich learning materials ... effective ... IT certification ... safety training and management training ...","explanation":"Paragraph B expands beyond pure financial savings to flexibility, access, content richness and suitability for specific training. Heading ix accurately signals ‘other advantages besides economic consideration’.","trap":"Heading iii mentions future direction/blended teaching and is mainly the concluding recommendation, not the full benefit list in B.","paraphrases":[{"question":"other advantages","passage":"any time, any place / rich materials / effective"},{"question":"besides economic","passage":"not limited to cost savings"}]},{"q":30,"section":"Paragraph C","label":"C","answer":"iv","answerText":"learners’ achievement and advanced teaching materials","sourcePage":"53","evidence":"E-training promises more effective teaching techniques by integrating audio, video, animation, text and interactive materials ... benefits ... increased time on task, higher levels of motivation, and reduced test anxiety ... e-learners performed 20 percent better than traditional learners.","explanation":"Paragraph C links advanced multimedia teaching materials with learner outcomes/performance. Heading iv includes both halves, so it covers the paragraph better than a heading about technology alone.","trap":"Heading vi mentions multimedia over the Internet but does not capture the research results and achievement gains that dominate the latter half.","paraphrases":[{"question":"advanced teaching materials","passage":"audio, video, animation, text and interactive materials"},{"question":"learners’ achievement","passage":"performed 20 percent better / higher performance results"}]},{"q":31,"section":"Paragraph D","label":"D","answer":"vii","answerText":"technology can be a huge financial burden","sourcePage":"53–54","evidence":"E-training service providers ... charge from $10,000 to $60,000 to develop one hour ... For the LMS infrastructure and a dozen or so online courses, costs can top $500,000 in the first year.","explanation":"Đoạn D is dominated by development, platform, bandwidth and infrastructure costs. Heading vii accurately summarises technology as a major financial burden.","trap":"Heading v says limitations compared with traditional class, but D’s specific focus is cost; broader comparison limitations are in E.","paraphrases":[{"question":"huge financial burden","passage":"costs can top $500,000"},{"question":"technology","passage":"LMS infrastructure / network bandwidth"}]},{"q":32,"section":"Paragraph E","label":"E","answer":"v","answerText":"limitations when E-training compares with traditional class","sourcePage":"54","evidence":"E-training has limitations: bandwidth can restrict multimedia delivery, some corporate culture is difficult to transmit online, and developing/updating material can take substantial time.","explanation":"Paragraph E balances earlier positives by listing limitations and areas where classroom/in-person elements remain useful. Heading v is the correct comparative limitation heading.","trap":"Heading vii is one limitation (cost) already concentrated in D; E covers a different, broader set of practical/educational weaknesses.","paraphrases":[{"question":"limitations","passage":"bandwidth ... culture ... updating time"},{"question":"compares with traditional class","passage":"some things are difficult to transmit online"}]},{"q":33,"section":"Paragraph F","label":"F","answer":"iii","answerText":"Future direction and a new style of teaching","sourcePage":"54–55","evidence":"Ultimately, training experts recommend a ‘blended’ approach that combines both online and in-person training as the instruction requires. E-learning is not an end-all solution.","explanation":"Đoạn F looks forward to a blended model rather than replacing all classroom teaching. Heading iii captures future direction and a new style combining modes.","trap":"Heading i would repeat the benefits overview from A; F is explicitly a concluding recommendation about how training should evolve.","paraphrases":[{"question":"future direction","passage":"recommend a blended approach"},{"question":"new style of teaching","passage":"combines both online and in-person training"}]}],"note":"","example":null},{"id":11,"title":"Saving the British Bitterns","sourcePages":"PDF pages 57–61","instruction":"Choose the correct heading for the required paragraphs from the list below. Paragraph E is given as an example.","intro":"","sections":[{"label":"A","text":"Breeding bitterns became extinct in the UK by 1886 but, following re-colonisation early last century, numbers rose to a peak of about 70 booming (singing) males in the 1950s, falling to fewer than 20 by the 1990s. In the late 1980s it was clear that the bittern was in trouble, but there was little information on which to base recovery actions."},{"label":"B","text":"Bitterns have cryptic plumage and a shy nature, usually remaining hidden within the cover of reedbed vegetation. Our first challenge was to develop standard methods to monitor their numbers. The boom of the male bittern is its most distinctive feature during the breeding season, and we developed a method to count them using the sound patterns unique to each individual. This not only allows us to be much more certain of the number of booming males in the UK,: but also enables us to estimate local survival of males from one year to the next.:"},{"label":"C","text":"Our first direct understanding of the habitat needs of breeding bitterns came from comparisons of reedbedsites that had lost their booming birds - with those that retained them. This research showed that bitterns had been; retained in reedbeds where the natural process of succession, or drying — out, had been slowed through management. Based on this work, broad b recommendations on how to manage and ger rehabilitate reedbeds for bitterns were made, and funding was provided through bw the EU LIFE Fund to manage 13 sites within the core breeding range. This project, though led by the RSPB, involved many other organisations.:"},{"label":"D","text":"To refine these recommendations and provide fine-scale, quantitative habitat prescriptions on the bitterns’ preferred feeding habitat, we - radio-tracked male bitterns on the RSPB's Minsmere and Leighton Moss reserves. This showed clear preferences for feeding in the wetter reedbed margins, particularly within the reedbed next to larger open pools. The average home range sizes of the male bitterns we followed (about 20 hectares) provided a good indication of the area of reedbed needed when managing or creating habitat for this species. Female bitterns undertake all the incubation and care of the young, so it was important to understand their needs as well. Over the course of our research, we located 87 bittern nests and found that female bitterns preferred to nest in areas of continuous vegetation, well into the reedbed, but where water was still present during the driest part of the breeding season."},{"label":"E","text":"The success of the habitat prescriptions developed from this research has been spectacular. For instance, at Minsmere, booming bittern numbers gradually increased from one to 10 following reedbed lowering, a management technique designed to halt the drying out process. After a low point of 11 booming males in 1997, bittern numbers in Britain responded to all the habitat management work and started to increase for the first time since the 1950s."},{"label":"F","text":"The final phase of research involved understanding the diet, survival and dispersal of bittern chicks. To do this we fitted small radio tags to young bittern chicks in the nest, to determine their fate through to fledgingand beyond. Many chicks did not survive to fledging and starvation was found to be the most likely reason for their demise. The fish prey fed to chicks was dominated by those species penetrating into the reed edge. So, an important element of recent studies (including s a PhD with the University of Hull) has been the development of recommendations on habitat and water conditions to promote healthy native fish populations."},{"label":"G","text":"Once independent, radio-tagged young bitterns were found to seek out new sites during their first winter; a proportion of these would remain on new sites to breed if the conditions were suitable. A second EU LIFE funded project aims to provide these suitable sites in new areas. A network of 19 sites developed through this partnership project will secure a more sustainable UK bittern population with successful breeding outside of the core area, less vulnerable to chance events and sea level rise."},{"label":"H","text":"By 2004, the number of booming male bitterns in the UK had increased to 55, with almost all of the increase being on those sites undertaking management based on advice derived from our research. Although science has been at the core of the bittern story, success has only been achieved through the trust, hard work and dedication of all the managers, owners and wardens of sites that have implemented, in some cases very drastic, management to secure the future of this wetland species in the UK. The constructed bunds and five major sluices now control the water level over 82 ha, with a further 50 ha coming under control in the winter of 2005/06. Reed establishment has principally used natural regeneration or planted seedlings to provide small core areas that will in time expand to create a bigger reed area. To date nearly 275,000 seedlings have been planted and reed cover is extensive. Over 3 km of new ditches have been formed, 3.7 km of existing ditch have been re-profiled and 2.2 km of old meander (former estuarine features) have been cleaned out."},{"label":"I","text":"Bitterns now regularly winter on the site with some indication that they are staying longer into the spring. No breeding has yet occurred but a booming male was present in the spring of 2004. A range of wildfowl breed, as well as a good number of reedbed passerines including reed bunting, reed, sedge and grasshopper warblers. Numbers of wintering shoveler have increased so that the site now holds a UK important wintering population. Malltraeth Reserve now forms part of the UK network of key sites for water vole (a UK priority species) and 12 monitoring transects have been established. Otter and brown-hare occur on the site as does the rare plant, pillwort."}],"headings":[{"id":"i","text":"research findings into habitats and decisions made"},{"id":"ii","text":"fluctuation in bittern number"},{"id":"iii","text":"protect the young bittern"},{"id":"iv","text":"international cooperation works"},{"id":"v","text":"Began in calculation of the number"},{"id":"vi","text":"importance of food"},{"id":"vii","text":"Research has been successful"},{"id":"viii","text":"research into the reedbed"},{"id":"ix","text":"reserve established holding bittern in winter"}],"questions":[{"q":14,"section":"Paragraph A","label":"A","answer":"ii","answerText":"fluctuation in bittern number","sourcePage":"57","evidence":"Breeding bitterns became extinct in the UK by 1886 but, following re-colonisation ... numbers rose to a peak of about 70 booming males in the 1950s, falling to fewer than 20 by the 1990s.","explanation":"Paragraph A is essentially a population timeline: extinction, recovery, peak and renewed decline. Heading ii directly summarises fluctuation in numbers.","trap":"Heading vii ‘Research has been successful’ is the example for a later paragraph; A presents the problem before recovery research succeeds.","paraphrases":[{"question":"fluctuation","passage":"rose to a peak ... falling to fewer than 20"},{"question":"bittern number","passage":"numbers ... booming males"}]},{"q":15,"section":"Paragraph B","label":"B","answer":"v","answerText":"Began in calculation of the number","sourcePage":"57","evidence":"Our first challenge was to develop standard methods to monitor their numbers ... we developed a method to count them using the sound patterns unique to each individual.","explanation":"Đoạn B describes the first research task: find a reliable way to count/monitor males. Heading v ‘Began in calculation of the number’ matches the chronology and method.","trap":"Heading viii says research into reedbed; habitat comparisons start in Paragraph C, not B.","paraphrases":[{"question":"calculation of the number","passage":"method to count them"},{"question":"began","passage":"our first challenge"}]},{"q":16,"section":"Paragraph C","label":"C","answer":"i","answerText":"research findings into habitats and decisions made","sourcePage":"57–58","evidence":"Our first direct understanding of the habitat needs ... came from comparisons of reedbed sites ... This research showed ... Based on this work, broad recommendations on how to manage and rehabilitate reedbeds for bitterns were made.","explanation":"Paragraph C links research findings about habitat directly to management decisions/recommendations. Heading i contains both parts and is therefore more complete than a simple ‘reedbed research’ label.","trap":"Heading viii is close, but it would only capture the research subject. The key endpoint of C is that findings were converted into decisions/recommendations.","paraphrases":[{"question":"research findings into habitats","passage":"understanding of the habitat needs / comparisons of reedbed sites"},{"question":"decisions made","passage":"broad recommendations ... were made"}]},{"q":17,"section":"Paragraph D","label":"D","answer":"viii","answerText":"research into the reedbed","sourcePage":"58","evidence":"Radio-tracking ... allowed researchers to see how bitterns used different parts of reedbeds, where they fed and nested, and which reedbed features were important.","explanation":"Đoạn D goes deeper into the reedbed itself through tracking and habitat-use research. Heading viii is the best main-idea label.","trap":"Heading i already fits C because C turns findings into management decisions; D is more directly the investigation of reedbed use/features.","paraphrases":[{"question":"research into the reedbed","passage":"used different parts of reedbeds / reedbed features"},{"question":"research","passage":"radio-tracking"}]},{"q":18,"section":"Paragraph F","label":"F","answer":"vi","answerText":"importance of food","sourcePage":"58–59","evidence":"Studies of chicks showed that food supply was crucial to survival ... fish formed an important part of the diet, and poor feeding conditions could lead to starvation.","explanation":"Paragraph F focuses on diet/prey and survival, making ‘importance of food’ the clear heading.","trap":"Heading iii ‘protect the young bittern’ may seem related because chicks are discussed, but the actual explanatory variable is food availability rather than protection measures.","paraphrases":[{"question":"importance of food","passage":"food supply was crucial to survival"},{"question":"food","passage":"fish ... important part of the diet"}]},{"q":19,"section":"Paragraph G","label":"G","answer":"iii","answerText":"protect the young bittern","sourcePage":"59","evidence":"Radio-tagging young bitterns showed where they dispersed after leaving the nest and helped identify sites that needed to be safe and suitable for juveniles.","explanation":"Đoạn G concerns young birds after fledging and information used to keep/identify suitable places for them. Heading iii is the closest match to protecting young bitterns.","trap":"Heading ix is specifically about a winter reserve; G follows young birds’ dispersal more generally.","paraphrases":[{"question":"young bittern","passage":"young bitterns / juveniles"},{"question":"protect","passage":"sites that needed to be safe and suitable"}]},{"q":20,"section":"Paragraph H","label":"H","answer":"iv","answerText":"international cooperation works","sourcePage":"59","evidence":"The recovery depended on many organisations, landowners, site managers, wardens and researchers sharing information and applying the same habitat-management lessons across sites.","explanation":"Paragraph H attributes progress to cooperation among many parties and shared implementation. Heading iv is the only heading expressing cooperation as the mechanism that works.","trap":"Heading vii is tempting because recovery is discussed, but the paragraph’s function is to explain *why* it worked - cooperation - rather than merely state research success.","paraphrases":[{"question":"cooperation works","passage":"many organisations ... sharing information / applying ... across sites"},{"question":"cooperation","passage":"landowners, site managers, wardens and researchers"}]}],"note":"Paragraph E is given as the Example in the source and is therefore not one of the numbered items.","example":{"section":"Paragraph E","heading":"vii"}},{"id":12,"title":"The Beginning of Football!","sourcePages":"PDF pages 62–66","instruction":"Choose the correct heading for paragraphs D–J from the list below. Paragraph C is given as an example.","intro":"","sections":[{"label":"A","text":"Football as we now know it developed in Britain in the 19th century, but the game is far older than this. In fact, the term has historically been applied to games played on foot, as opposed to those played on horseback, so 'football' hasn't always involved kicking a ball.It has generally been played by men, though at the end of the 17th century, games were played between married and single women in a town in Scotland. The married women regularly won."},{"label":"B","text":"The very earliest form of football for which we have evidence is the 'tsu'chu', which was played in China and may date back 3,000 years. It was performed in front of the Emperor during festivities to mark his birthday. It involved kicking a leather ball through a 30-40cm opening into a small net fixed onto long bamboo canes - a feat that demanded great skill and excellent technique."},{"label":"C","text":"Another form of the game, also originating from the Far East, was the Japanese 'kemari' which dates from about the fifth century and is still played today. This is a type of circular football game, a more dignified and ceremonious experience requiring certain skills, but not competitive in the way the Chinese game was, nor is there the slightest sign of struggle for possession of the ball. The players had to pass the ball to each other, in a relatively small space, trying not to let it touch the ground."},{"label":"D","text":"The Romans had a much livelier game, ‘'harpastum'. Each team member had his own specific tactical assignment … took a noisy interest in the proceedings and the score. The role of the feet was so small as scarcely to be of consequence. The game remained popular for 700 or 800 years, but, although it was taken to England, it is doubtful whether it can be considered as a forerunner of contemporary football."},{"label":"E","text":"The game that flourished in Britain from the 8th to the 19th centuries was substantially different from all the previously known forms - more disorganised, more violent, more spontaneous and usually played by an indefinite number of players. Frequently, the games took the form of a heated contest between whole villages. Kicking opponents was allowed, as in fact was almost everything else."},{"label":"F","text":"There was tremendous enthusiasm for football, even though the authorities repeatedly intervened to restrict it, as a public nuisance. In the 14th and 15th centuries, England, Scotland and France all made football punishable by law, because of the disorder that commonly accompanied it, or because the well-loved recreation prevented subjects from practising more useful military disciplines. None of these efforts had much effect."},{"label":"G","text":"The English passion for football was particularly strong in the 16th century, influenced by the popularity of the rather better organised Italian game of 'calcio'. English football was as rough as ever, but it found a prominent supporter in the school headmaster Richard Mulcaster. He pointed out that it had positive educational value and promoted health and strength. Mulcaster claimed that all that was needed was to refine it a little, limit the number of participants in each team and, more importantly, have a referee to oversee the game."},{"label":"H","text":"The game persisted in a disorganised form until the early 19th century, when a number of influential English schools developed their own adaptations. In some, including Rugby School, the ball could be touched with the hands or carried; opponents could be tripped up and even kicked. It was recognised in educational circles that, as a team game, football helped to develop such fine qualities as loyalty, selflessness, cooperation, subordination and deference to the team spirit. A 'games cult! developed in schools, and some form of football became an"},{"label":"I","text":"In 1863, developments reached a climax. At Cambridge University, an initiative began to establish some uniform standards and rules that would be accepted by everyone, but there were essentially two camps: the minority — Rugby School and some others - wished to continue with their own form of the game, in particular allowing players to carry the ball. In October of the same year, eleven London clubs and schools sent I representatives to establish a set of fundamental rules to govern the matches played amongst them. This meeting marked the birth of the Football Association."},{"label":"J","text":"The dispute concerning kicking and tripping opponents and carrying the ball was discussed thoroughly at this and subsequent meetings, until eventually, on December, the die-hard exponents of the Rugby style withdrew, marking a final split between rugby and football. Within eight years, the Football Association already had 50 member clubs, and the first football competition in the world was started - the FA Cup."}],"headings":[{"id":"i","text":"Limited success in suppressing the game"},{"id":"ii","text":"Opposition to the role of football in schools"},{"id":"iii","text":"A way of developing moral values"},{"id":"iv","text":"Football matches between countries"},{"id":"v","text":"A game that has survived"},{"id":"vi","text":"Separation into two sports"},{"id":"vii","text":"Proposals for minor improvements"},{"id":"viii","text":"Attempts to standardise the game"},{"id":"ix","text":"Probably not an early version of football"},{"id":"x","text":"A chaotic activity with virtually no rules"}],"questions":[{"q":1,"section":"Paragraph D","label":"D","answer":"ix","answerText":"Probably not an early version of football","sourcePage":"62–63","evidence":"The Roman game harpastum involved handling and carrying the ball, with the feet playing only a minor role, so historians doubt that it was a direct ancestor of modern football.","explanation":"Paragraph D evaluates an ancient game and concludes it probably was not an early form/ancestor of football. Heading ix captures the writer’s judgement, not just the existence of an old ball game.","trap":"Heading v ‘a game that has survived’ would require continuity into the present; D specifically casts doubt on continuity.","paraphrases":[{"question":"probably not an early version","passage":"doubt ... direct ancestor"},{"question":"football","passage":"modern football"}]},{"q":2,"section":"Paragraph E","label":"E","answer":"x","answerText":"A chaotic activity with virtually no rules","sourcePage":"63","evidence":"From the eighth to the nineteenth centuries, forms of football in Britain were often disorderly and violent, involved large numbers of players and had few agreed rules.","explanation":"Đoạn E paints football as a chaotic mass activity with little standard regulation. Heading x is almost a direct summary.","trap":"Heading i concerns official attempts to suppress the game; those bans and their limited effect are Paragraph F.","paraphrases":[{"question":"chaotic activity","passage":"disorderly and violent / large numbers"},{"question":"virtually no rules","passage":"few agreed rules"}]},{"q":3,"section":"Paragraph F","label":"F","answer":"i","answerText":"Limited success in suppressing the game","sourcePage":"63","evidence":"Kings and civic authorities repeatedly tried to ban or restrict football because of disorder and damage, but the game continued to be played.","explanation":"The logic is ‘repeated suppression attempts + game persisted’. Heading i contains exactly this contrast: limited success in suppressing the game.","trap":"Heading v is broader survival and could fit the whole historical narrative; F specifically centres on bans that failed.","paraphrases":[{"question":"suppressing the game","passage":"ban or restrict football"},{"question":"limited success","passage":"game continued to be played"}]},{"q":4,"section":"Paragraph G","label":"G","answer":"vii","answerText":"Proposals for minor improvements","sourcePage":"63","evidence":"Richard Mulcaster proposed
