that football could be improved by limiting the number of players, appointing a referee and organising teams more carefully.","explanation":"Paragraph G does not yet create a single standard code; it proposes practical adjustments to make the game safer/more orderly. Heading vii fits these minor improvements.","trap":"Heading viii ‘Attempts to standardise’ belongs later when schools/clubs formulate common rules; G is one reformer’s suggested improvements.","paraphrases":[{"question":"minor improvements","passage":"limiting players / appointing a referee"},{"question":"proposals","passage":"proposed that football could be improved"}]},{"q":5,"section":"Paragraph H","label":"H","answer":"iii","answerText":"A way of developing moral values","sourcePage":"63–64","evidence":"Public schools increasingly used organised games to teach loyalty, selflessness, cooperation and respect for the team.","explanation":"Đoạn H reframes football as a tool for character/moral education. Heading iii directly summarises this educational purpose.","trap":"Heading ii says opposition to football in schools, the opposite of the passage’s positive use of organised games for values.","paraphrases":[{"question":"developing moral values","passage":"loyalty, selflessness, cooperation"},{"question":"a way of developing","passage":"used ... to teach"}]},{"q":6,"section":"Paragraph I","label":"I","answer":"viii","answerText":"Attempts to standardise the game","sourcePage":"64","evidence":"Different schools played by different rules, so meetings in the nineteenth century tried to draw up a common code; the 1863 meetings helped form the Football Association.","explanation":"Paragraph I is about reconciling different rule systems and establishing common standards. Heading viii accurately captures attempts to standardise.","trap":"Heading vi ‘separation into two sports’ is the consequence of disagreement developed in J, not the standardisation attempt itself.","paraphrases":[{"question":"standardise the game","passage":"draw up a common code"},{"question":"attempts","passage":"meetings ... different schools ... different rules"}]},{"q":7,"section":"Paragraph J","label":"J","answer":"vi","answerText":"Separation into two sports","sourcePage":"64","evidence":"Disagreement over whether players could run with the ball and use hacking led representatives of the Rugby style to withdraw, and the codes developed separately into association football and rugby football.","explanation":"The paragraph explains a split caused by rule disagreement, producing two distinct sports. Heading vi is therefore exact.","trap":"Heading viii may be tempting because rules are being discussed, but the outcome/main point of J is separation rather than successful standardisation.","paraphrases":[{"question":"separation into two sports","passage":"developed separately into association football and rugby football"},{"question":"separation","passage":"Rugby ... withdraw"}]}],"note":"Paragraph C is given as the Example (v. A game that has survived).","example":{"section":"Paragraph C","heading":"v"}},{"id":13,"title":"BIRD MIGRATION","sourcePages":"PDF pages 67–70","instruction":"Reading Passage 2 has seven paragraphs, A–G. Choose the correct heading for each paragraph from the list of headings below.","intro":"","sections":[{"label":"A","text":"Birds have many unique design features that enable them to perform such amazing feats of endurance. They are equipped with lightweight, hollow bones, intricately designed feathers providing both lift and thrust for rapid flight, navigation systems superior to any that man has developed, and an ingenious heat conserving design that, among other things, concentrates all blood circulation beneath layers of warm, waterproof plumage, leaving them fit to face life in the harshest of climates. Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have a system of extracting oxygen from their lungs that far exceeds that of any other animal. During the later stages of the summer breeding season, when food is plentiful, their bodies are able to accumulate considerable layers of fat, in order to provide sufficient energy for their long migratory flights."},{"label":"B","text":"The fundamental reason that birds migrate is to find adequate food during the winter months when it is in short supply. This particularly applies to birds that breed in the temperate and Arctic regions of the Northern Hemisphere, where food is abundant during the short growing season. Many species can tolerate cold temperatures if food is plentiful, but when food is not available they must migrate. However, intriguing questions remain."},{"label":"C","text":"One puzzling fact is that many birds journey much further than would be necessary just to find food and good weather. Nobody knows, for instance, why British swallows, which could presumably survive equally well if they spent the winter in equatorial Africa, instead fly several thousands of miles further to their preferred winter home in South Africa’s Cape Province. Another mystery involves the huge migrations performed by arctic terns and mudflat-feeding shorebirds that breed close to Polar Regions. In general, the further north a migrant species breeds, the further south it spends the winter. For arctic terns this necessitates an annual round trip of 25,000 miles. Yet, en route to their final destination in far-flung southern latitudes, all these individuals overfly other areas of seemingly suitable habitat spanning two hemispheres. While we may not fully understand birds’ reasons for going to particular places, we can marvel at their feats."},{"label":"D","text":"One of the greatest mysteries is how young birds know how to find the traditional wintering areas without parental guidance, Very few adults migrate with juveniles in tow, and youngsters may even have little or no inkling of their parents’ appearance. A familiar example is that of the cuckoo, which lays its eggs in another species’ nest and never encounters its young again. It is mind boggling to consider that, once raised by its host species, the young cuckoo makes it own way to ancestral wintering grounds in the tropics before returning single-handedly to northern Europe the next season to seek out a mate among its own kind. The obvious implication is that it inherits from its parents an inbuilt route map and direction-finding capability, as well as a mental image of what another cuckoo looks like. Yet nobody has the slightest idea as to how this is possible."},{"label":"E","text":"Mounting evidence has confirmed that birds use the positions of the sun and stars to obtain compass directions. They seem also to be able to detect the earth’s magnetic field, probably due to having minute crystals of magnetite in the region of their brains. However, true navigation also requires an awareness of position and time, especially when lost. Experiments have shown that after being taken thousands of miles over an unfamiliar landmass, birds are still capable of returning rapidly to nest sites. Such phenomenal powers are the product of computing a number of sophisticated cues, including an inborn map of the night sky and the pull of the earth’s magnetic field. How the birds use their ‘instruments’ remains unknown, but one thing is clear: they see the world with a superior sensory perception to ours. Most small birds migrate at night and take their direction from the position of the setting sun, However, as well as seeing the sun go down, they also seem to see the plane of polarized light caused by it, which calibrates their compass. Traveling at night provides other benefits. Daytime predators are avoided and the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced. Furthermore, at night the air is generally cool and less turbulent and so conducive to sustained, stable flight."},{"label":"F","text":"Nevertheless, all journeys involve considerable risk, and part of the skill in arriving safely is setting off at the right time. This means accurate weather forecasting, and utilizing favorable winds. Birds are adept at both, and, in laboratory tests, some have been shown to detect the minute difference in barometric pressure between the floor and ceiling of a room. Often birds react to weather changes before there is any visible sign of them. Lapwings, which feed on grassland, flee west from the Netherlands to the British Isles, France and Spain at the onset of a cold snap. When the ground surface freezes the birds could starve. Yet they return to Holland ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather."},{"label":"G","text":"In one instance a Welsh Manx shearwater carried to America and released was back in its burrow on Skokholm Island, off the Pembrokeshire coast, one day before a letter announcing its release! Conversely, each autumn a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds. Not only do they arrive safely in Europe, but, based on ringing evidence, some make it back to North America the following spring, after probably spending the winter with European migrants in sunny African climes."}],"headings":[{"id":"i","text":"The best moment to migrate"},{"id":"ii","text":"The unexplained rejection of closer feeding ground"},{"id":"iii","text":"The influence of weather on the migration route"},{"id":"iv","text":"Physical characteristics that allow birds to migrate"},{"id":"v","text":"The main reason why birds migrate"},{"id":"vi","text":"The best wintering grounds for birds"},{"id":"vii","text":"Research findings on how birds migrate"},{"id":"viii","text":"Successful migration despite trouble of wind"},{"id":"ix","text":"Contrast between long-distance migration and short-distance migration"},{"id":"x","text":"Mysterious migration despite lack of teaching"}],"questions":[{"q":14,"section":"Paragraph A","label":"A","answer":"iv","answerText":"Physical characteristics that allow birds to migrate","sourcePage":"67","evidence":"Birds ... are equipped with lightweight, hollow bones, intricately designed feathers ... navigation systems ... heat-conserving design ... respiratory systems ... and ... layers of fat ... for their long migratory flights.","explanation":"Paragraph A is a list of anatomical/physiological features enabling endurance flight. Heading iv covers the whole set.","trap":"Heading vii concerns research on navigation mechanisms; A simply describes physical adaptations, not experiments/findings.","paraphrases":[{"question":"physical characteristics","passage":"hollow bones / feathers / respiratory systems / fat"},{"question":"allow birds to migrate","passage":"provide ... endurance / long migratory flights"}]},{"q":15,"section":"Paragraph B","label":"B","answer":"v","answerText":"The main reason why birds migrate","sourcePage":"67","evidence":"The fundamental reason that birds migrate is to find adequate food during the winter months when it is in short supply.","explanation":"The paragraph explicitly states the ‘fundamental reason’. Heading v is a direct paraphrase and therefore strongest.","trap":"Heading vi concerns *where* birds winter; B explains *why* migration occurs - food availability.","paraphrases":[{"question":"main reason","passage":"fundamental reason"},{"question":"migrate","passage":"to find adequate food during the winter months"}]},{"q":16,"section":"Paragraph C","label":"C","answer":"ii","answerText":"The unexplained rejection of closer feeding ground","sourcePage":"67–68","evidence":"One puzzling fact is that many birds journey much further than would be necessary just to find food and good weather ... British swallows ... fly several thousands of miles further to ... South Africa.","explanation":"Paragraph C asks why birds reject nearer locations that appear sufficient and travel much farther. Heading ii captures that unexplained choice.","trap":"Heading vi ‘best wintering grounds’ would imply the passage explains why South Africa is best; it explicitly says the reason is puzzling/unknown.","paraphrases":[{"question":"unexplained rejection of closer ground","passage":"journey much further than would be necessary"},{"question":"closer feeding ground","passage":"could presumably survive ... equatorial Africa"}]},{"q":17,"section":"Paragraph D","label":"D","answer":"x","answerText":"Mysterious migration despite lack of teaching","sourcePage":"68","evidence":"Young birds of some species migrate successfully on their first journey without being shown the route by their parents ... how this inherited programme works remains mysterious.","explanation":"Đoạn D highlights successful migration without teaching/parental guidance, followed by the mystery of inherited navigation. Heading x is exact.","trap":"Heading vii needs research findings explaining how navigation works; D stresses that the ability remains mysterious rather than fully explained.","paraphrases":[{"question":"lack of teaching","passage":"without being shown the route by their parents"},{"question":"mysterious migration","passage":"remains mysterious"}]},{"q":18,"section":"Paragraph E","label":"E","answer":"vii","answerText":"Research findings on how birds migrate","sourcePage":"68–69","evidence":"Experiments indicate that birds can use the sun, stars, the Earth’s magnetic field and patterns of polarised light as navigational cues.","explanation":"Paragraph E synthesises experimental findings about navigation cues. Heading vii is the correct research-results heading.","trap":"Heading iv is physical body adaptations; E deals with sensory/navigation mechanisms discovered by experiments.","paraphrases":[{"question":"research findings","passage":"experiments indicate"},{"question":"how birds migrate","passage":"use the sun, stars, ... magnetic field ... as navigational cues"}]},{"q":19,"section":"Paragraph F","label":"F","answer":"i","answerText":"The best moment to migrate","sourcePage":"69","evidence":"A crucial skill is setting off at the right time. Birds respond to seasonal changes and weather conditions and can delay departure until winds and conditions are favourable.","explanation":"The main issue is timing departure. Heading i ‘The best moment to migrate’ summarises this temporal decision.","trap":"Heading iii focuses on how weather alters route; here weather is used to decide *when to leave*, not primarily which route to take.","paraphrases":[{"question":"best moment","passage":"setting off at the right time"},{"question":"moment to migrate","passage":"delay departure until ... favourable"}]},{"q":20,"section":"Paragraph G","label":"G","answer":"viii","answerText":"Successful migration despite trouble of wind","sourcePage":"69","evidence":"Migrants can be blown far off course by strong winds, yet displaced birds have been recorded reaching their normal destinations or completing migration successfully.","explanation":"Paragraph G stresses robustness: wind causes serious displacement but birds can still complete migration. Heading viii captures the contrast.","trap":"Heading iii only mentions influence of weather on route, but misses the key outcome ‘successful despite trouble’ which is the paragraph’s punch line.","paraphrases":[{"question":"trouble of wind","passage":"blown far off course by strong winds"},{"question":"successful migration","passage":"reaching ... normal destinations / completing migration successfully"}]}],"note":"","example":null},{"id":14,"title":"How should reading be taught?","sourcePages":"PDF pages 71–74","instruction":"Reading Passage 3 has six sections, A–F. Choose the correct heading for sections B–F from the list of headings below. Section A is given as an example.","intro":"","sections":[{"label":"A","text":"Learning to speak is automatic for almost all children, but learning to read requires elaborate instruction and conscious effort, Well aware of the difficulties, educators have given a great deal of thought to how they can best help children learn to read. No single method has triumphed. Indeed, heated arguments about the most appropriate form of reading instruction continue to polarise the teaching community."},{"label":"B","text":"Three general approaches have been tried. In one, called whole-word instruction, children learn by rote how to recognise at a glance a vocabulary of 50 to 100 words. Then they gradually acquire other words, often through seeing them used over and over again in the context of a story. Speakers of most languages learn the relationship between letters and the sounds associated with them (phonemes). That is, children are taught how to use their knowledge of the alphabet to sound out words. This procedure constitutes a second approach to teaching reading - phonics. Many schools have adopted a different approach: the whole-language method. The strategy here relies on the child's experience with language. For example, students are offered engaging books and are encouraged to guess the words that they do not know by considering the context of the sentence or by looking for clues in the storyline and illustrations, rather than trying to sound them out. Many teachers adopted the whole-language approach because of its intuitive appeal. Making reading fun promises to keep children motivated, and learning to read depends more on what the student does than on what the teacher does, The presumed benefits of whole-language instruction — and the contrast to the perceived dullness of phonics - led to its growing acceptance across America during the 1990s, and a movement away from phonics."},{"label":"C","text":"However, many linguists and psychologists objected strongly to the abandonment of phonics in American schools. Why was this so? In short, because research had clearly demonstrated that understanding how letters related to the component sounds in words is critically important in reading. This conclusion rests, in part, on knowledge of how experienced readers make sense of words on a page. Advocates of whole-language instruction have argued forcefully that people often derive meanings directly from print without ever determining the sound of the word, Some psychologists today accept this view, but most believe that reading is typically a process of rapidly sounding out words mentally. Compelling evidence for this comes from experiments which show that subjects often confuse homophones words that sound the same, such as 'rose' and 'rows'. This supports the idea that readers convert strings of letters to sounds."},{"label":"D","text":"In order to evaluate different approaches to teaching reading, a number of experiments have been carried out, firstly with college students, then with school pupils. Investigators trained English-speaking college students to read using unfamiliar symbols such as Arabic letters (the phonics approach), while another group learned entire words associated with certain strings of Arabic letters (whole-word). Then both groups were required to read a new set of words constructed from the original characters. In general, readers who were taught the rules of phonics could read many more new words than those trained with a whole-word procedure, Classroom studies comparing phonics with either whole-word or whole-language instruction are also quite illuminating. One particularly persuasive study compared two programmes used in 20 first-grade classrooms. Half the students were offered traditional reading instruction, which included the use of phonics drills and applications. The other half were taught using an individualised method that drew from their experiences with language; these children produced their own booklets of stories and developed sets of words to be recognised (common components of the whole-language approach), This study found that the first group scored higher at year’s end on tests of reading and comprehension,"},{"label":"E","text":"If researchers are so convinced about the need for phonics instruction, why does the debate continue? Because the controversy is enmeshed in the philosophical differences between traditional and progressive (or new) approaches, differences that have divided educators for years. The progressives challenge the results of laboratory tests and classroom studies on the basis of a broad philosophical scepticism about the values of such research. They champion student-centred learning and teacher empowerment. Sadly, they fail to realise that these very admirable educational values are equally consistent with the teaching of phonics."},{"label":"F","text":"If schools of education insisted that would-be reading teachers learned something about the vast research in linguistics and psychology that bears on reading, their graduates would be more eager to use phonics and would be prepared to do so effectively, They could allow their pupils to apply the principles of phonics while reading for pleasure. Using whole-language activities to supplement phonics instruction certainly helps to make reading fun and meaningful for children, so no one would want to see such tools discarded. Indeed, recent work has indicated that the combination of literature-based instruction and phonics is more powerful a —E—FEeei—ell than either method used alone. Teachers need to strike a balance. But in doing so, we urge them to remember that reading must be grounded in a firm understanding of the connections between letters and sounds, Educators who deny this reality are neglecting decades of research. They are also neglecting the needs of their students."}],"headings":[{"id":"i","text":"Disagreement about the reading process"},{"id":"ii","text":"The roots of the debate"},{"id":"iii","text":"A combined approach"},{"id":"iv","text":"Methods of teaching reading"},{"id":"v","text":"A controversial approach"},{"id":"vi","text":"Inconclusive research"},{"id":"vii","text":"Research with learners"},{"id":"viii","text":"Allowing teachers more control"},{"id":"ix","text":"A debate amongst educators"}],"questions":[{"q":27,"section":"Section B","label":"B","answer":"iv","answerText":"Methods of teaching reading","sourcePage":"71–72","evidence":"One approach is the whole-word method ... Another is phonics ... Many schools have adopted a different approach: the whole-language method.","explanation":"Section B introduces and distinguishes the principal teaching methods. Heading iv is the correct umbrella.","trap":"Heading i concerns disagreement over what the reading process actually involves; that theoretical dispute is developed in Section C.","paraphrases":[{"question":"methods of teaching reading","passage":"whole-word / phonics / whole-language"},{"question":"methods","passage":"one approach ... another ... a different approach"}]},{"q":28,"section":"Section C","label":"C","answer":"i","answerText":"Disagreement about the reading process","sourcePage":"72","evidence":"Whole-language advocates assume readers move directly from printed words to meaning, whereas psychological evidence suggests readers routinely convert strings of letters into sounds ... homophone experiments support this.","explanation":"Section C contrasts two accounts of the mental process of reading. Heading i captures the disagreement about how reading happens, not merely teaching preference.","trap":"Heading v ‘controversial approach’ is too vague; the paragraph explicitly pits competing models of the reading process against each other.","paraphrases":[{"question":"disagreement about the reading process","passage":"directly ... to meaning vs convert ... letters into sounds"},{"question":"evidence","passage":"homophones ... supports the idea"}]},{"q":29,"section":"Section D","label":"D","answer":"vii","answerText":"Research with learners","sourcePage":"72","evidence":"Investigators trained English-speaking college students ... one group using phonics and another whole-word ... Classroom studies comparing phonics with either whole-word or whole-language instruction are also quite illuminating.","explanation":"Section D reports experiments with learners at college and school level comparing methods. Heading vii is a direct description of the section’s evidence base.","trap":"Heading vi ‘Inconclusive research’ is wrong because the experiments reported clear performance differences, especially favouring phonics on new words/comprehension.","paraphrases":[{"question":"research with learners","passage":"trained ... college students / classroom studies"},{"question":"research","passage":"experiments ... comparing phonics ..."}]},{"q":30,"section":"Section E","label":"E","answer":"ii","answerText":"The roots of the debate","sourcePage":"72–73","evidence":"If researchers are so convinced about the need for phonics instruction, why does the debate continue? Because the controversy is enmeshed in the philosophical differences between traditional and progressive approaches.","explanation":"Section E explains the source/root of continued controversy: longstanding philosophical differences in education. Heading ii matches the causal function of the section.","trap":"Heading viii mentions teacher control, which is one progressive value mentioned, but it is an example within the deeper philosophical divide.","paraphrases":[{"question":"roots of the debate","passage":"because ... philosophical differences"},{"question":"debate","passage":"why does the debate continue?"}]},{"q":31,"section":"Section F","label":"F","answer":"iii","answerText":"A combined approach","sourcePage":"73","evidence":"Using whole-language activities to supplement phonics instruction certainly helps ... recent work has indicated that the combination of literature-based instruction and phonics is more powerful than either method used alone. Teachers need to strike a balance.","explanation":"The conclusion recommends combining strengths of both approaches, explicitly saying the combination outperforms either alone. Heading iii is exact.","trap":"Heading iv would merely list teaching methods; Section F takes a position on how to combine them.","paraphrases":[{"question":"combined approach","passage":"combination ... and phonics / supplement phonics"},{"question":"combined","passage":"strike a balance"}]}],"note":"Section A is the Example in the source and is not one of Q27–31.","example":{"section":"Section A","heading":"ix"}},{"id":15,"title":"Magnetic Therapy","sourcePages":"PDF pages 75–78","instruction":"Reading Passage 1 has seven paragraphs, A–G. Choose the correct heading for paragraphs A–F from the list of headings below.","intro":"","sections":[{"label":"A","text":"Magnetic therapy, which is a $5-billion market worldwide, is a form of alternative medicine which claims that magnetic fields have healing powers. Magnetic devices that are claimed to be therapeutic include magnetic bracelets, insoles, wrist and knee bands, back and neck braces, and even pillows and mattresses, Their annual sales are estimated at $300 million in the United States and more than a billion dollars globally. They have been advertised to cure a vast array of ills, particularly pain."},{"label":"B","text":"The therapy works on the principle of balancing electrical energy in the body by pulsating magnetic waves through different parts of the body. The electrical currents generated by magnets increase the blood flow and oxygen which helps to heal many of the ailments. The natural effects of the Earth’s magnetic field are considered to play an essential role in the health of humans and animals. It is generally accepted that our body draws some benefit from the Earth’s magnetic field. To restore the balance within our body allows us to function at our optimum level. For example, when the first astronauts returned to earth sick, NASA concluded that their illness resulted from the lack of a planetary magnetic field in outer space. To resolve the problem, NASA placed magnets in the astronauts’ space suits and space travel vehicles, and astronauts have returned to Earth healthy ever since,"},{"label":"C","text":"Historically it is reported that magnets have been around for an extremely long time. The therapeutic power of magnets was known to physicians in ancient Greece, Egypt and China over 4000 years ago, who used naturally magnetic rock -lodestone- to treat a variety of physical and psychological ailments. Cleopatra the beautiful Egyptian queen was probably the first celebrity to use magnets. It is documented that in order to prevent from aging, she slept on a Lodestone to keep her skin youthful. Ancient Romans also used magnet therapy to treat eye disease."},{"label":"D","text":"The popularity of magnet therapy in the United States began to rise during the 1800s and soared in the post-Civil War era. Sears-Roebuck advertised magnetic jewelry in its catalog for the healing of virtually any ailment. An Austrian psychoanalyst by the name of Wilhelm Reich immigrated to the United States in 1939 and researched the effects of electromagnetism on humans. Today, Germany, Japan, Israel, Russia and at least 45 other countries considers magnetic therapy to be an official medical procedure for the treatment of numerous ailments, including various inflammatory and neurological problems."},{"label":"E","text":"For those who practice magnetic therapy, strongly believe that certain ailments can be treated if the patient is exposed to magnetic fields while at the same time there is a strong resentment from the medical establishment and critics claim that most magnets don't have the strength to effect the various organs and tissues within the body and it is a product of Pseudoscience and is not based on proper research and analysis. There are few reported complications of magnetic therapy and the World Health Organization says low level of magnetic energy is not harmful. Documented side effects are not life-threatening and include pain, nausea and dizziness that disappeared when the magnets were removed. If considering magnet therapy, as with any medical treatment, it is always advisable to consult one's regular physician first."},{"label":"F","text":"Researchers at Baylor University Medical Center recently conducted a double-blind study on the use of concentric-circle magnets to relieve chronic pain in 50 post-polio patients. A static magnetic device or a placebo device was applied to the patient's skin for 45 minutes. The patients were asked to rate how much pain they experienced when a \"trigger point was touched,\" The researchers reported that the 29 patients exposed to the magnetic device achieved lower pain scores than did the 21 who were exposed to the placebo device, However, this study had significant flaws in their design. Although the groups were said to be selected randomly, the ratio of women to men in the experimental group was twice that of the control group; the age of the placebo group was four years higher than that of the control group; there was just one brief exposure and no systematic follow-up of patients."},{"label":"G","text":"Magnet therapy is gaining popularity; however, the scientific evidence to support the success of this therapy is lacking. More scientifically sound studies are needed in order to fully understand the effects that magnets can have on the body and the possible benefits or dangers that could result from their use."}],"headings":[{"id":"i","text":"Earth itself as the biggest magnet"},{"id":"ii","text":"The commercial magnetic products"},{"id":"iii","text":"Utilize the power from natural magnetic field"},{"id":"iv","text":"Early application of magnet"},{"id":"v","text":"Brief introduction of how the magnetic therapy works"},{"id":"vi","text":"Pain-reducing effect"},{"id":"vii","text":"Arguments for and against the therapy"},{"id":"viii","text":"An experiment on post-polio patients"},{"id":"ix","text":"Conditions of magnet use today"}],"questions":[{"q":1,"section":"Paragraph A","label":"A","answer":"ii","answerText":"The commercial magnetic products","sourcePage":"75","evidence":"Magnetic products have become a multi-billion-dollar market, including bracelets, insoles, braces, pillows and mattresses sold with health claims.","explanation":"Paragraph A primarily introduces the commercial market and range of magnetic products. Heading ii captures both sales context and products.","trap":"Heading v would require explanation of mechanism; the ‘how it works’ claims are developed in Paragraph B.","paraphrases":[{"question":"commercial","passage":"multi-billion-dollar market / sold"},{"question":"magnetic products","passage":"bracelets, insoles, braces, pillows, mattresses"}]},{"q":2,"section":"Paragraph B","label":"B","answer":"v","answerText":"Brief introduction of how the magnetic therapy works","sourcePage":"75","evidence":"Practitioners claim that magnets influence electrical or magnetic processes in the body, improve circulation and oxygen delivery, and thereby promote healing or reduce pain.","explanation":"Paragraph B gives the proposed mechanism of magnetic therapy. Heading v ‘Brief introduction of how ... works’ is the correct function even though the claims are contested later.","trap":"Heading iii focuses on the Earth’s natural field; B may mention natural magnetism as context, but the main task is explaining the therapy’s claimed mechanism.","paraphrases":[{"question":"how magnetic therapy works","passage":"magnets influence ... processes / improve circulation"},{"question":"therapy","passage":"promote healing or reduce pain"}]},{"q":3,"section":"Paragraph C","label":"C","answer":"iv","answerText":"Early application of magnet","sourcePage":"75–76","evidence":"Magnets and lodestones were used therapeutically in ancient Greece, Egypt and China; historical accounts also describe Cleopatra and later Roman uses.","explanation":"Paragraph C is historical and catalogues early uses of magnets. Heading iv is straightforward.","trap":"Heading ix concerns present-day conditions/use; C is explicitly about ancient/early application.","paraphrases":[{"question":"early application","passage":"ancient Greece, Egypt and China"},{"question":"magnet","passage":"magnets and lodestones were used therapeutically"}]},{"q":4,"section":"Paragraph D","label":"D","answer":"ix","answerText":"Conditions of magnet use today","sourcePage":"76","evidence":"Magnetic treatments became popular again in the nineteenth century and today magnets are used or marketed under a variety of conditions, while only some magnetic procedures have recognised medical applications.","explanation":"Paragraph D bridges historical revival and present status/conditions of use. Heading ix best fits the current-use focus.","trap":"Heading ii is about products and market size in A; D is about when/under what status magnets are used as therapy.","paraphrases":[{"question":"magnet use today","passage":"today magnets are used or marketed"},{"question":"conditions","passage":"variety of conditions / recognised medical applications"}]},{"q":5,"section":"Paragraph E","label":"E","answer":"vii","answerText":"Arguments for and against the therapy","sourcePage":"76","evidence":"Supporters report benefits and argue that magnetic fields can aid healing, while many doctors and scientists regard the claims as unproven or pseudoscientific and point to weak evidence.","explanation":"Paragraph E explicitly presents both sides of the dispute. Heading vii is the only balanced ‘for and against’ heading.","trap":"Heading vi ‘Pain-reducing effect’ would treat benefit as established; E is about controversy and quality of evidence, not a single positive result.","paraphrases":[{"question":"arguments for","passage":"supporters report benefits"},{"question":"against","passage":"doctors and scientists ... unproven / weak evidence"}]},{"q":6,"section":"Paragraph F","label":"F","answer":"viii","answerText":"An experiment on post-polio patients","sourcePage":"76–77","evidence":"In a double-blind Baylor study, 50 post-polio patients with pain received either a magnet or a placebo device; the magnet group reported greater pain reduction, although the study had limitations.","explanation":"Paragraph F centres on one specific experiment, its participants, control/placebo design and outcome. Heading viii exactly names that study population.","trap":"Heading vi describes the result only. Because the paragraph’s structure is the entire experiment on post-polio patients, heading viii is more complete.","paraphrases":[{"question":"experiment","passage":"double-blind ... magnet or placebo"},{"question":"post-polio patients","passage":"50 post-polio patients"}]}],"note":"Paragraph G continues the passage but is not included in Q1–6 Matching Headings.","example":null}];
const APP_VERSION='mh15-v1';
const LAST_NAME_KEY='ielts_mh_last_name_v1';
const PROFILE_PREFIX='ielts_mh_profile_v1_';
let currentName=''; let profile={}; let activeEx=null; let activeView='reading'; let filter='all'; let storageOK=true; let saveTimer=null;
const $=s=>document.querySelector(s); const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function profileKey(name){return PROFILE_PREFIX+encodeURIComponent(name.trim().toLocaleLowerCase('vi'))}
function defaultProfile(name){return {version:APP_VERSION,name,exercises:{},lastOpened:null,updatedAt:Date.now()}}
function testStorage(){try{localStorage.setItem('__mh_test__','1');localStorage.removeItem('__mh_test__');return true}catch(e){return false}}
storageOK=testStorage();
function loadProfile(name){if(!storageOK)return defaultProfile(name);try{const raw=localStorage.getItem(profileKey(name));if(!raw)return defaultProfile(name);const p=JSON.parse(raw);if(!p||typeof p!=='object')return defaultProfile(name);p.name=name;p.exercises=p.exercises||{};return p}catch(e){return defaultProfile(name)}}
function saveProfile(immediate=false){profile.updatedAt=Date.now();if(!storageOK){setSaveText('Không thể lưu trên trình duyệt');return}const go=()=>{try{localStorage.setItem(profileKey(currentName),JSON.stringify(profile));localStorage.setItem(LAST_NAME_KEY,currentName);setSaveText('Đã lưu '+timeNow())}catch(e){storageOK=false;setSaveText('Không thể lưu trên trình duyệt')}};if(immediate){clearTimeout(saveTimer);go()}else{clearTimeout(saveTimer);saveTimer=setTimeout(go,180)}}
function setSaveText(t){const el=document.getElementById('saveState');if(el)el.textContent=t}
function timeNow(){return new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.add('hidden'),1800)}
function stateFor(id){if(!profile.exercises[id])profile.exercises[id]={answers:{},flags:{},submitted:false,result:null,startedAt:null,submittedAt:null,passageScroll:0,questionScroll:0};return profile.exercises[id]}
function exById(id){return EXERCISES.find(x=>x.id===Number(id))}
function answeredCount(ex,st){return ex.questions.filter(q=>String(st.answers?.[q.q]||'').trim()).length}
function grade(ex,st){let correct=0,wrong=0,blank=0;const per={};for(const q of ex.questions){const a=(st.answers?.[q.q]||'').trim();let status;if(!a){status='blank';blank++}else if(a===q.answer){status='correct';correct++}else{status='wrong';wrong++}per[q.q]={status,student:a}}return {correct,wrong,blank,total:ex.questions.length,per}}
function showStart(){activeEx=null;const last=storageOK?(localStorage.getItem(LAST_NAME_KEY)||''):'';app.innerHTML=`<div class="screen start-wrap"><div class="start-card"><div class="brandline"></div><div class="eyebrow">IELTS ACADEMIC READING</div><h1>Matching Headings Practice</h1><p>15 exercises • 99 câu Matching Headings. Không giới hạn thời gian. Kết quả và tiến độ được lưu trên trình duyệt này.</p><label class="name-label" for="studentName">Họ và tên học sinh</label><input id="studentName" class="name-input" autocomplete="name" value="${esc(last)}" placeholder="Nhập họ và tên"><button id="enterBtn" class="primary">VÀO DANH SÁCH BÀI</button><div class="small-note">Đáp án và giải thích chỉ xuất hiện sau khi nộp từng Exercise.${storageOK?'':' <b>Trình duyệt hiện không cho phép localStorage; tiến độ sẽ không được lưu sau khi đóng trang.</b>'}</div></div></div>`;$('#enterBtn').onclick=enter;$('#studentName').onkeydown=e=>{if(e.key==='Enter')enter()};setTimeout(()=>$('#studentName').focus(),30)}
function enter(){const name=$('#studentName').value.trim();if(!name){toast('Vui lòng nhập họ và tên học sinh.');$('#studentName').focus();return}currentName=name;profile=loadProfile(name);saveProfile(true);showDashboard()}
function showDashboard(){activeEx=null;let done=0,inprog=0,totalCorrect=0,totalDoneQ=0;for(const ex of EXERCISES){const st=profile.exercises[ex.id];if(st?.submitted){done++;const g=st.result||grade(ex,st);totalCorrect+=g.correct;totalDoneQ+=g.total}else if(st&&answeredCount(ex,st)>0)inprog++}app.innerHTML=`<div class="screen dash"><header class="dash-head"><div><div class="dash-title">IELTS Reading • Matching Headings</div><div class="dash-user">Học sinh: ${esc(currentName)}</div></div><div class="dash-actions"><button id="switchUser">ĐỔI HỌC SINH</button></div></header><main class="dash-main"><div class="summary-row"><div class="summary"><span>Đã hoàn thành</span><b>${done}/15</b></div><div class="summary"><span>Đang làm</span><b>${inprog}</b></div><div class="summary"><span>Điểm các bài đã nộp</span><b>${totalDoneQ?totalCorrect+'/'+totalDoneQ:'—'}</b></div></div><div class="exercise-grid">${EXERCISES.map(cardHTML).join('')}</div></main></div>`;$('#switchUser').onclick=showStart;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openExercise(+b.dataset.open))}
function cardHTML(ex){const st=profile.exercises[ex.id]||{};const n=answeredCount(ex,st);const pct=Math.round(100*n/ex.questions.length);let status='CHƯA LÀM',cl='',label='BẮT ĐẦU',meta=`${ex.questions.length} câu • ${esc(ex.sourcePages)}`;if(st.submitted){const g=st.result||grade(ex,st);status='ĐÃ LÀM';cl='done';label='XEM KẾT QUẢ';meta=`${g.correct}/${g.total} đúng • ${esc(ex.sourcePages)}`}else if(n){status='ĐANG LÀM';cl='progress';label='TIẾP TỤC';meta=`Đã trả lời ${n}/${ex.questions.length} • ${esc(ex.sourcePages)}`}return `<article class="ex-card"><div class="ex-top"><div class="ex-num">EXERCISE ${ex.id}</div><span class="status ${cl}">${status}</span></div><h3>${esc(ex.title)}</h3><div class="ex-meta">${meta}</div><div class="progressbar"><i style="width:${st.submitted?100:pct}%"></i></div><button data-open="${ex.id}" class="${st.submitted?'secondary':'primary'}">${label}</button></article>`}
function openExercise(id){activeEx=exById(id);const st=stateFor(id);if(!st.startedAt)st.startedAt=Date.now();profile.lastOpened=id;saveProfile(true);renderExam(st.submitted?'review':'test');requestAnimationFrame(()=>restoreScroll())}
function renderExam(mode){const ex=activeEx,st=stateFor(ex.id);const g=st.submitted?(st.result||grade(ex,st)):null;const ans=answeredCount(ex,st);app.innerHTML=`<div class="screen exam"><header class="topbar"><button id="backList" class="backbtn" aria-label="Quay lại danh sách">← DANH SÁCH</button><div class="top-ident"><div class="top-title">Exercise ${ex.id}: ${esc(ex.title)}</div><div class="top-sub">${esc(currentName)} • ${mode==='review'?'Đã nộp':'Đang làm bài'}</div></div><div class="top-stat">${mode==='review'?`${g.correct}/${g.total} đúng`:`Đã trả lời ${ans}/${ex.questions.length}`}</div><div id="saveState" class="save-state">Đã lưu</div>${mode==='test'?'<button id="manualSave" class="secondary">LƯU BÀI</button><button id="submitBtn" class="submit-btn">NỘP BÀI</button>':'<button id="copyBtn" class="secondary">SAO CHÉP KẾT QUẢ</button>'}</header><nav class="qnav" aria-label="Điều hướng câu hỏi">${ex.questions.map(q=>chipHTML(q,st,g)).join('')}</nav><div class="mobile-switch"><button id="mobRead" class="active">BÀI ĐỌC</button><button id="mobQ">${mode==='review'?'KẾT QUẢ':'CÂU HỎI'}</button></div><main id="workspace" class="workspace"><section id="readingPane" class="pane reading-pane">${passageHTML(ex)}</section><section id="questionPane" class="pane question-pane">${mode==='review'?reviewHTML(ex,st,g):questionsHTML(ex,st)}</section></main></div>`;
$('#backList').onclick=()=>{captureScroll();saveProfile(true);showDashboard()};if(mode==='test'){document.querySelectorAll('.answer-select').forEach(sel=>sel.onchange=onAnswer);document.querySelectorAll('.flag-btn').forEach(b=>b.onclick=()=>toggleFlag(+b.dataset.q));$('#submitBtn').onclick=submitPrompt;$('#manualSave').onclick=()=>{captureScroll();saveProfile(true);toast('Đã lưu bài.')}}else{$('#copyBtn').onclick=copyResults;document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jumpToSection(b.dataset.jump));document.querySelectorAll('.filterbtn').forEach(b=>b.onclick=()=>applyFilter(b.dataset.filter));const reset=$('#resetEx');if(reset)reset.onclick=resetExercise}
document.querySelectorAll('.qchip').forEach(b=>b.onclick=()=>jumpQuestion(+b.dataset.q));setupMobile();setupScrollSave()}
function chipHTML(q,st,g){let cl='';if(g)cl=g.per[q.q].status;else{if(st.answers?.[q.q])cl='answered';if(st.flags?.[q.q])cl+=(cl?' ':'')+'flagged'}return `<button class="qchip ${cl}" data-q="${q.q}">${q.q}</button>`}
function passageHTML(ex){return `<div class="passage-kicker">Exercise ${ex.id} • Reading Passage</div><h2 class="passage-title">${esc(ex.title)}</h2>${ex.intro?`<p class="passage-intro">${esc(ex.intro)}</p>`:''}${ex.sections.map(s=>`<article id="sec-${s.label}" class="section" data-label="${s.label}"><p><span class="section-label">${s.label}.</span>${esc(s.text)}</p></article>`).join('')}<div class="source-note">Nguồn bài đọc: ${esc(ex.sourcePages)} trong 04_MATCHING_HEADINGS.pdf. Nội dung scan đã được chuyển thành văn bản để đọc và chọn chữ trực tiếp.</div>`}
function headingsHTML(ex){return `<div class="headings-card"><h3>List of Headings</h3><div class="heading-list">${ex.headings.map(h=>`<div class="heading-row"><span class="roman">${h.id}.</span><span>${esc(h.text)}</span></div>`).join('')}</div></div>`}
function exampleHTML(ex){if(!ex.example)return'';const h=ex.headings.find(x=>x.id===ex.example.heading);return `<div class="example-box"><b>Example:</b> ${esc(ex.example.section)} → <b>${ex.example.heading}. ${esc(h?.text||'')}</b></div>`}
function questionsHTML(ex,st){return `<div class="instruction-box"><b>Questions ${ex.questions[0].q}–${ex.questions.at(-1).q}</b><br>${esc(ex.instruction)}<br><b>Write/choose the correct number.</b></div>${headingsHTML(ex)}${exampleHTML(ex)}${ex.questions.map(q=>questionHTML(ex,q,st)).join('')}`}
function questionHTML(ex,q,st){const val=st.answers?.[q.q]||'';return `<div id="q-${q.q}" class="question-card"><div class="qhead"><span class="qbadge">${q.q}</span><span class="qsection">${esc(q.section)}</span><button type="button" class="flag-btn ${st.flags?.[q.q]?'on':''}" data-q="${q.q}" title="Đánh dấu xem lại" aria-label="Đánh dấu xem lại câu ${q.q}">⚑</button></div><select class="answer-select" data-q="${q.q}" aria-label="Câu ${q.q}, ${esc(q.section)}"><option value="">— Chọn heading —</option>${ex.headings.map(h=>`<option value="${h.id}" ${val===h.id?'selected':''}>${h.id}. ${esc(h.text)}</option>`).join('')}</select><div class="answered-line">${val?'Đã chọn: '+esc(val):'Chưa trả lời'}</div></div>`}
function onAnswer(e){const st=stateFor(activeEx.id);st.answers[e.target.dataset.q]=e.target.value;st.lastSaved=Date.now();saveProfile();const card=e.target.closest('.question-card');card.querySelector('.answered-line').textContent=e.target.value?'Đã chọn: '+e.target.value:'Chưa trả lời';updateTestChrome()}
function toggleFlag(q){const st=stateFor(activeEx.id);st.flags[q]=!st.flags[q];saveProfile();renderExam('test');requestAnimationFrame(()=>{const el=$(`#q-${q}`);if(el)el.scrollIntoView({block:'center'})})}
function updateTestChrome(){const ex=activeEx,st=stateFor(ex.id),n=answeredCount(ex,st);const stat=$('.top-stat');if(stat)stat.textContent=`Đã trả lời ${n}/${ex.questions.length}`;for(const q of ex.questions){const c=document.querySelector(`.qchip[data-q="${q.q}"]`);if(c){c.classList.toggle('answered',!!st.answers?.[q.q]);c.classList.toggle('flagged',!!st.flags?.[q.q])}}}
function submitPrompt(){const ex=activeEx,st=stateFor(ex.id),n=answeredCount(ex,st);const missing=ex.questions.filter(q=>!st.answers?.[q.q]).map(q=>q.q);const flags=ex.questions.filter(q=>st.flags?.[q.q]).map(q=>q.q);showModal(`<h2>Xác nhận nộp bài</h2><p>Bạn đã trả lời <b>${n}/${ex.questions.length}</b> câu.</p>${missing.length?`<p><b>Câu chưa trả lời:</b> ${missing.join(', ')}</p>`:'<p>Không còn câu bỏ trống.</p>'}${flags.length?`<p><b>Đánh dấu xem lại:</b> ${flags.join(', ')}</p>`:''}<p>Sau khi nộp, Exercise này sẽ được khóa và hiển thị đáp án cùng giải thích chi tiết.</p><div class="modal-actions"><button id="cancelModal" class="secondary">TIẾP TỤC LÀM BÀI</button><button id="confirmSubmit" class="primary">XÁC NHẬN NỘP</button></div>`);$('#cancelModal').onclick=closeModal;$('#confirmSubmit').onclick=doSubmit}
function doSubmit(){const ex=activeEx,st=stateFor(ex.id);captureScroll();st.submitted=true;st.submittedAt=Date.now();st.result=grade(ex,st);saveProfile(true);closeModal();filter='all';renderExam('review');toast(`Đã nộp: ${st.result.correct}/${st.result.total} câu đúng.`)}
function reviewHTML(ex,st,g){return `<div class="result-summary"><div class="result-score"><strong>${g.correct}/${g.total}</strong><span>câu đúng • ${Math.round(g.correct/g.total*100)}%</span></div><div style="font-size:12px;color:var(--muted);margin-top:4px">Sai: ${g.wrong} • Bỏ trống: ${g.blank}</div><div class="result-actions"><button id="resetEx" class="danger">LÀM LẠI EXERCISE</button></div></div>${ex.note?`<div class="review-note"><b>Lưu ý cấu trúc đề:</b> ${esc(ex.note)}</div>`:''}<div class="filterbar"><button class="filterbtn active" data-filter="all">TẤT CẢ</button><button class="filterbtn" data-filter="wrong">CÂU SAI</button><button class="filterbtn" data-filter="correct">CÂU ĐÚNG</button><button class="filterbtn" data-filter="blank">BỎ TRỐNG</button><button class="filterbtn" data-filter="flagged">ĐÁNH DẤU</button></div>${headingsHTML(ex)}${exampleHTML(ex)}<div id="resultsList">${ex.questions.map(q=>resultCard(ex,q,st,g)).join('')}</div>`}
function resultCard(ex,q,st,g){const r=g.per[q.q],student=r.student||'';const sh=ex.headings.find(h=>h.id===student);const isOpen=r.status!=='correct';return `<details id="r-${q.q}" class="result-card ${r.status}" data-status="${r.status}" data-flagged="${st.flags?.[q.q]?'1':'0'}" ${isOpen?'open':''}><summary><span class="qbadge">${q.q}</span><b style="flex:1">${esc(q.section)}</b><span class="status-pill">${r.status==='correct'?'ĐÚNG':r.status==='wrong'?'SAI':'BỎ TRỐNG'}</span></summary><div class="result-body"><div class="ans-grid"><div class="ans-box"><b>Câu trả lời của học sinh</b>${student?`<strong>${esc(student)}. ${esc(sh?.text||'')}</strong>`:'<em>Không trả lời</em>'}</div><div class="ans-box"><b>Đáp án đúng</b><strong>${esc(q.answer)}. ${esc(q.answerText)}</strong></div></div><div class="evidence"><b>Evidence • ${esc(q.section)} • trang ${esc(q.sourcePage)}</b><br>“${esc(q.evidence)}”</div><div class="explain"><h4>GIẢI THÍCH</h4><div>${esc(q.explanation)}</div><h4>BẪY / HEADING DỄ NHẦM</h4><div>${esc(q.trap)}</div><h4>PARAPHRASE</h4>${q.paraphrases.map(p=>`<div class="pp-row"><b>${esc(p.question)}</b> ↔ ${esc(p.passage)}</div>`).join('')}</div><button class="jumpbtn" data-jump="${q.label}">XEM ĐOẠN TRONG BÀI ĐỌC</button></div></details>`}
function jumpQuestion(q){const st=stateFor(activeEx.id);if(window.innerWidth<=920){activeView='questions';setMobileView('questions')}const el=st.submitted?document.getElementById('r-'+q):document.getElementById('q-'+q);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.qchip').forEach(c=>c.classList.toggle('active',+c.dataset.q===q))}
function jumpToSection(label){if(window.innerWidth<=920){activeView='reading';setMobileView('reading')}const el=document.getElementById('sec-'+label);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800)}}
function applyFilter(f){filter=f;document.querySelectorAll('.filterbtn').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));document.querySelectorAll('.result-card').forEach(c=>{const show=f==='all'||c.dataset.status===f||(f==='flagged'&&c.dataset.flagged==='1');c.style.display=show?'':'none'})}
function resetExercise(){showModal(`<h2>Làm lại Exercise ${activeEx.id}?</h2><p>Thao tác này sẽ xóa đáp án, trạng thái đã nộp, đánh dấu xem lại và điểm của riêng Exercise này.</p><div class="modal-actions"><button id="cancelModal" class="secondary">HỦY</button><button id="confirmReset" class="danger">XÓA VÀ LÀM LẠI</button></div>`);$('#cancelModal').onclick=closeModal;$('#confirmReset').onclick=()=>{delete profile.exercises[activeEx.id];saveProfile(true);closeModal();openExercise(activeEx.id)}}
function copyResults(){const ex=activeEx,st=stateFor(ex.id),g=st.result||grade(ex,st);const lines=[`IELTS READING – MATCHING HEADINGS`,`Học sinh: ${currentName}`,`Exercise ${ex.id}: ${ex.title}`,`Kết quả: ${g.correct}/${g.total} đúng`,``];for(const q of ex.questions){const r=g.per[q.q],sh=ex.headings.find(h=>h.id===r.student);lines.push(`Câu ${q.q} – ${q.section}`,`Học sinh: ${r.student?`${r.student}. ${sh?.text||''}`:'Bỏ trống'}`,`Đáp án: ${q.answer}. ${q.answerText}`,`Kết quả: ${r.status==='correct'?'ĐÚNG':r.status==='wrong'?'SAI':'BỎ TRỐNG'}`,`Evidence: ${q.evidence}`,`Giải thích: ${q.explanation}`,`Bẫy: ${q.trap}`,`Paraphrase: ${q.paraphrases.map(p=>p.question+' ↔ '+p.passage).join('; ')}`,``)}const text=lines.join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Đã sao chép toàn bộ kết quả.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép toàn bộ kết quả.')}catch(e){toast('Không thể tự động sao chép.')}ta.remove()}
function showModal(inner){const root=$('#modalRoot');root.innerHTML=`<div class="modal-wrap" role="dialog" aria-modal="true"><div class="modal">${inner}</div></div>`;document.addEventListener('keydown',escModal)}function closeModal(){const root=$('#modalRoot');root.innerHTML='';document.removeEventListener('keydown',escModal)}function escModal(e){if(e.key==='Escape')closeModal()}
function setupMobile(){const r=$('#mobRead'),q=$('#mobQ');if(!r||!q)return;r.onclick=()=>setMobileView('reading');q.onclick=()=>setMobileView('questions');setMobileView(activeView)}function setMobileView(v){activeView=v;const w=$('#workspace');if(!w)return;w.classList.toggle('show-questions',v==='questions');$('#mobRead')?.classList.toggle('active',v==='reading');$('#mobQ')?.classList.toggle('active',v==='questions')}
function captureScroll(){if(!activeEx)return;const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');if(rp)st.passageScroll=rp.scrollTop;if(qp)st.questionScroll=qp.scrollTop}
function restoreScroll(){const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');if(rp)rp.scrollTop=st.passageScroll||0;if(qp)qp.scrollTop=st.questionScroll||0}
function setupScrollSave(){const st=stateFor(activeEx.id),rp=$('#readingPane'),qp=$('#questionPane');const fn=()=>{captureScroll();saveProfile()};if(rp)rp.addEventListener('scroll',debounce(fn,250));if(qp)qp.addEventListener('scroll',debounce(fn,250))}
function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
window.addEventListener('beforeunload',()=>{captureScroll();saveProfile(true)});
showStart();
</script>

<script id="ielts-dual-pane-layout-runtime">
(function(){
  function visible(el){
    if(!el) return false;
    if(el.classList && el.classList.contains('hidden')) return false;
    const s = window.getComputedStyle(el);
    if(s.display === 'none' || s.visibility === 'hidden') return false;
    return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  }

  function syncExamLock(){
    const candidates = Array.from(document.querySelectorAll('.exam,.practice,#exam-screen'));
    const active = candidates.some(visible);
    document.documentElement.classList.toggle('ielts-exam-active', active);
    if(document.body) document.body.classList.toggle('ielts-exam-active', active);
  }

  function start(){
    syncExamLock();
    const obs = new MutationObserver(syncExamLock);
    obs.observe(document.documentElement,{
      subtree:true,
      childList:true,
      attributes:true,
      attributeFilter:['class','style','hidden']
    });
    window.addEventListener('resize', syncExamLock, {passive:true});
    window.addEventListener('orientationchange', syncExamLock, {passive:true});
    document.addEventListener('click', function(){ setTimeout(syncExamLock,0); }, {passive:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }else{
    start();
  }
})();
</script>
<!-- IELTS_DUAL_PANE_PATCH_SCRIPT_END -->
