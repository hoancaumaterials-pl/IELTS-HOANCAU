ght:700}.review-note{padding:9px 10px;background:#fff8e6;border:1px solid #ead5a2;border-radius:4px;font-size:12px;margin-bottom:10px}

@media(max-width:920px){.exercise-grid{grid-template-columns:repeat(2,1fr)}.workspace{display:block;position:relative}.pane{position:absolute;inset:0;border:0;padding:18px 16px 70px}.question-pane{display:none}.workspace.show-questions .reading-pane{display:none}.workspace.show-questions .question-pane{display:block}.mobile-switch{display:flex;height:42px;flex:0 0 42px;background:#fff;border-bottom:1px solid var(--line)}.mobile-switch button{flex:1;border:0;background:#fff;font-weight:700;font-size:12px;color:#4b5869}.mobile-switch button.active{color:var(--navy);box-shadow:inset 0 -3px var(--navy)}.top-stat,.save-state{display:none}}
@media(max-width:620px){.start-card{padding:22px}.brandline{margin:-22px -22px 20px}.exercise-grid{grid-template-columns:1fr}.summary-row{grid-template-columns:1fr 1fr}.summary-row .summary:last-child{grid-column:1/-1}.dash-head{padding:12px}.dash-main{padding:14px}.topbar{gap:6px;padding:0 7px}.topbar .secondary{display:none}.top-title{font-size:12px}.submit-btn{padding:8px}.reading-pane{padding:18px 17px 70px}.question-pane{padding:12px 12px 70px}.passage-title{font-size:22px}.section p{font-size:16px;line-height:1.65}.ans-grid{grid-template-columns:1fr}}

<style id="ielts-dual-pane-layout-patch">
/* =========================================================
   IELTS READING – DUAL PANE / INDEPENDENT SCROLL PATCH
   Desktop: 60/40
   Mobile portrait (<768px): top/bottom, BOTH visible
   Mobile landscape + tablet: 60/40
   Body locked only while an exam/practice screen is active
   ========================================================= */

html.ielts-exam-active,
body.ielts-exam-active{
  height:100% !important;
  max-height:100% !important;
  overflow:hidden !important;
  overscroll-behavior:none !important;
}

body.ielts-exam-active{
  position:relative !important;
}

/* Prevent the exam/practice shell itself from becoming the scrolling surface. */
body.ielts-exam-active .exam,
body.ielts-exam-active .practice,
body.ielts-exam-active #exam-screen{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Common split containers */
body.ielts-exam-active .workspace,
body.ielts-exam-active .work{
  min-height:0 !important;
  overflow:hidden !important;
}

/* Every reading/question pane scrolls on its own. */
body.ielts-exam-active .workspace > .pane,
body.ielts-exam-active .workspace > .reading-pane,
body.ielts-exam-active .workspace > .question-pane,
body.ielts-exam-active .workspace > .passage-pane,
body.ielts-exam-active .workspace > .passage,
body.ielts-exam-active .workspace > .questions,
body.ielts-exam-active .work > .pane,
body.ielts-exam-active .work > .reading-pane,
body.ielts-exam-active .work > .question-pane,
body.ielts-exam-active .work > .passage-pane,
body.ielts-exam-active .work > .passage,
body.ielts-exam-active .work > .questions,
body.ielts-exam-active #passage-pane,
body.ielts-exam-active #question-pane{
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain !important;
  -webkit-overflow-scrolling:touch !important;
}

/* The old "show only one pane" mobile controls are no longer needed. */
body.ielts-exam-active .mobile-switch,
body.ielts-exam-active .mobile-toggle,
body.ielts-exam-active #show-reading,
body.ielts-exam-active #show-questions{
  display:none !important;
}

/* Never allow old mobile-state classes to hide one side. */
body.ielts-exam-active .workspace.show-questions > .reading-pane,
body.ielts-exam-active .workspace.show-questions > .passage-pane,
body.ielts-exam-active .workspace.show-questions > .passage,
body.ielts-exam-active .workspace:not(.show-questions) > .question-pane,
body.ielts-exam-active .practice.show-passage .question-pane,
body.ielts-exam-active .practice:not(.show-passage) .passage-pane,
body.ielts-exam-active #passage-pane.mobile-hidden,
body.ielts-exam-active #question-pane.mobile-hidden{
  display:block !important;
}

/* Keep fixed-height practice shells inside the viewport. */
body.ielts-exam-active .practice{
  height:100vh !important;
  height:100dvh !important;
  max-height:100vh !important;
  max-height:100dvh !important;
}

/* Matching Information-style shell: 44px global brand + exam below it. */
body.ielts-exam-active .top-brand + .exam,
body.ielts-exam-active .top-brand ~ .exam{
  height:calc(100vh - 44px) !important;
  height:calc(100dvh - 44px) !important;
  min-height:0 !important;
}

/* ---------- DESKTOP + TABLET + MOBILE LANDSCAPE ---------- */
@media (min-width:768px), (orientation:landscape){
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,3fr) minmax(0,2fr) !important; /* 60 / 40 */
    grid-template-rows:minmax(0,1fr) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based exam templates */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* YES/NO/NOT GIVEN-style fixed header = 46 + 42 = 88px */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
  }

  /* Restore divider between 60% passage and 40% questions */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:1px solid var(--line, #d7dde4) !important;
    border-bottom:0 !important;
  }
}

/* ---------- MOBILE PORTRAIT ONLY ---------- */
@media (max-width:767px) and (orientation:portrait){
  /* Matching Information had height:auto + sticky header on mobile:
     force the shell back into the viewport. */
  body.ielts-exam-active .exam{
    min-height:0 !important;
    overflow:hidden !important;
  }

  body.ielts-exam-active .exam-head{
    position:relative !important;
    top:auto !important;
    flex:0 0 auto !important;
  }

  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work,
  body.ielts-exam-active .practice .workspace{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    grid-template-rows:minmax(0,48%) minmax(0,52%) !important;
    min-height:0 !important;
    overflow:hidden !important;
    position:relative !important;
  }

  /* Flex-based templates: workspace occupies exactly the remaining height. */
  body.ielts-exam-active .exam .workspace,
  body.ielts-exam-active .exam .work{
    flex:1 1 auto !important;
    height:auto !important;
  }

  /* Fixed 88px header templates */
  body.ielts-exam-active .practice .workspace{
    height:calc(100vh - 88px) !important;
    height:calc(100dvh - 88px) !important;
  }

  body.ielts-exam-active .workspace > .pane,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .question-pane,
  body.ielts-exam-active .workspace > .passage-pane,
  body.ielts-exam-active .workspace > .passage,
  body.ielts-exam-active .workspace > .questions,
  body.ielts-exam-active .work > .pane,
  body.ielts-exam-active .work > .reading-pane,
  body.ielts-exam-active .work > .question-pane,
  body.ielts-exam-active .work > .passage-pane,
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .work > .questions{
    display:block !important;
    position:relative !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    min-height:0 !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }

  /* Clear old "one pane at a time" rules with high specificity. */
  body.ielts-exam-active .workspace.show-questions .reading-pane,
  body.ielts-exam-active .workspace.show-questions .passage-pane,
  body.ielts-exam-active .workspace.show-questions .passage,
  body.ielts-exam-active .workspace.show-questions .question-pane,
  body.ielts-exam-active .practice.show-passage .passage-pane,
  body.ielts-exam-active .practice.show-passage .question-pane,
  body.ielts-exam-active .practice .passage-pane,
  body.ielts-exam-active .practice .question-pane{
    display:block !important;
  }

  /* Horizontal divider between Passage (top) and Questions (bottom). */
  body.ielts-exam-active .work > .passage,
  body.ielts-exam-active .workspace > .reading-pane,
  body.ielts-exam-active .workspace > .passage-pane{
    border-right:0 !important;
    border-bottom:2px solid var(--line, #d7dde4) !important;
  }

  /* Compact padding so both regions remain practical on small screens. */
  body.ielts-exam-active .reading-pane,
  body.ielts-exam-active .passage-pane,
  body.ielts-exam-active .work > .passage{
    padding-top:10px !important;
    padding-bottom:18px !important;
  }

  body.ielts-exam-active .question-pane,
  body.ielts-exam-active .work > .questions{
    padding-top:9px !important;
    padding-bottom:24px !important;
  }
}

/* Print should remain normal and fully expandable. */
@media print{
  html.ielts-exam-active,
  body.ielts-exam-active{
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
  }
}
</style>
<!-- IELTS_DUAL_PANE_PATCH_END -->

<script>
const EXERCISES=[{"id":1,"title":"Living Dunes","sourcePages":"PDF pages 1–7","instruction":"Reading Passage 3 has seven paragraphs, A–G. Choose the correct heading for paragraphs A–G from the list of headings below.","intro":"When you think of a sand dune, you probably picture a barren pile of lifeless sand. But sand dunes are actually dynamic natural structures. They grow, shift and travel. They crawl with living things. Some sand dunes even sing.","sections":[{"label":"A","text":"Although no more than a pile of wind-blown sand, dunes can roll over trees and buildings, march relentlessly across highways, devour vehicles on its path, and threaten crops and factories in Africa, the Middle East, and China. In some places, killer dunes even roll in and swallow up towns. Entire villages have disappeared under the sand. In a few instances the government built new villages for those displaced only to find that new villages themselves were buried several years later. Preventing sand dunes from overwhelming cities and agricultural areas has become a priority for the United Nations Environment Program."},{"label":"B","text":"Some of the most significant experimental measurements on sand movement were performed by Ralph Bagnold, a British engineer who worked in Egypt prior to World War II. Bagnold investigated the physics of particles moving through the atmosphere and deposited by wind. He recognised two basic dune types, the crescentic dune, which he called “barchan,” and the linear dune, which he called longitudinal or “sief ’ (Arabic for “sword”). The crescentic barchan dune is the most common type of sand dune. As its name suggests, this dune is shaped like a crescent moon with points at each end, and it is usually wider than it is long. Some types of barchan dunes move faster over desert surfaces than any other type of dune. The linear dune is straighter than the crescentic dune with ridges as its prominent feature. Unlike crescentic dunes, linear dunes are longer than they are wide—in fact, some are more than 100 miles (about 160 kilometers) long. Dunes can also be comprised of smaller dunes of different types, called complex dunes."},{"label":"C","text":"Despite the complicated dynamics of dune formation, Bagnold noted that a sand dune generally needs the following three things to form: a large amount of loose sand in an area with little vegetation—usually on the coast or in a dried-up river, lake or sea bed; a wind or breeze to move the grains of sand; and an obstacle, which could be as small as a rock or as big as a tree, that causes the sand to lose momentum and settle. Where these three variables merge, a sand dune forms."},{"label":"D","text":"As the wind picks up the sand, the sand travels, but generally only about an inch or two above the ground, until an obstacle causes it to stop. The heaviest grains settle against the obstacle, and a small ridge or bump forms. The lighter grains deposit themselves on the other side of the obstacle. Wind continues to move sand up to the top of the pile until the pile is so steep that it collapses under its own weight. The collapsing sand comes to rest when it reaches just the right steepness to keep the dune stable. The repeating cycle of sand inching up the windward side to the dune crest, then slipping down the dune’s slip face allows the dune to inch forward, migrating in the direction the wind blows."},{"label":"E","text":"Depending on the speed and direction of the wind and the weight of the local sand, dunes will develop into different shapes and sizes. Stronger winds tend to make taller dunes; gentler winds tend to spread them out. If the direction of the wind generally is the same over the years, dunes gradually shift in that direction. But a dune is “a curiously dynamic creature”, wrote Farouk El-Baz in National Geographic. Once formed, a dune can grow, change shape, move with the wind and even breed new dunes. Some of these offspring may be carried on the back of the mother dune. Others are born and race downwind, outpacing their parents."},{"label":"F","text":"Sand dunes even can be heard ‘singing’ in more than 30 locations worldwide, and in each place the sounds have their own characteristic frequency, or note. When the thirteenth century explorer Marco Polo encountered the weird and wonderful noises made by desert sand dunes, he attributed them to evil spirits. The sound is unearthly. The volume is also unnerving. Adding to the tone’s otherworldliness is the inability of the human ear to localise the source of the noise. Stéphane Douady of the French national research agency CNRS and his colleagues have been delving deeper into dunes in Morocco, Chile, China and Oman, and believe they can now explain the exact mechanism behind this acoustic phenomenon."},{"label":"G","text":"The group hauled sand back to the laboratory and set it up in channels with automated pushing plates. The sands still sang, proving that the dune itself was not needed to act as a resonating body for the sound, as some researchers had theorised. To make the booming sound, the grains have to be of a small range of sizes, all alike in shape: well-rounded. Douady’s key discovery was that this synchronised frequency — which determines the tone of sound — is the result of the grain size. The larger the grain, the lower the key. He has successfully predicted the notes emitted by dunes in Morocco, Chile and the US simply by measuring the size of the grains they contain. Douady also discovered that the singing grains had some kind of varnish or a smooth coating of various minerals: silicon, iron and manganese, which probably formed on the sand when the dunes once lay beneath an ancient ocean. But in the muted grains this coat had been worn away, which explains why only some dunes can sing. He admits he is unsure exactly what role the coating plays in producing the noise. The mysterious dunes, it seems, aren’t quite ready yet to give up all of their secrets."}],"headings":[{"id":"i","text":"Shaping and reforming"},{"id":"ii","text":"Causes of desertification"},{"id":"iii","text":"Need combination of specific conditions"},{"id":"iv","text":"Potential threat to industry and communication"},{"id":"v","text":"An old superstition demystified"},{"id":"vi","text":"Differences and similarities"},{"id":"vii","text":"A continuous cycling process"},{"id":"viii","text":"Habitat for rare species"},{"id":"ix","text":"Replicating the process in laboratory"},{"id":"x","text":"Commonest type of dune"}],"questions":[{"q":27,"section":"Paragraph A","label":"A","answer":"iv","answerText":"Potential threat to industry and communication","sourcePage":"1","evidence":"Although no more than a pile of wind-blown sand, dunes can roll over trees and buildings, march relentlessly across highways, devour vehicles on its path, and threaten crops and factories ... Preventing sand dunes from overwhelming cities and agricultural areas has become a priority for the United Nations Environment Program.","explanation":"Đoạn A tập trung vào mức độ nguy hiểm thực tế của cồn cát đối với đường sá, phương tiện, làng mạc, cây trồng và nhà máy. Heading iv bao quát đúng cả hai nhóm tác động: hạ tầng/giao thông và sản xuất.","trap":"Heading ii dễ gây nhiễu vì có bối cảnh sa mạc, nhưng đoạn không giải thích nguyên nhân desertification; nó mô tả hậu quả và mối đe doạ của dunes.","paraphrases":[{"question":"potential threat","passage":"threaten crops and factories / overwhelming cities"},{"question":"communication","passage":"march relentlessly across highways / devour vehicles"}]},{"q":28,"section":"Paragraph B","label":"B","answer":"vi","answerText":"Differences and similarities","sourcePage":"2","evidence":"He recognised two basic dune types, the crescentic dune, which he called ‘barchan,’ and the linear dune ... Unlike crescentic dunes, linear dunes are longer than they are wide.","explanation":"Đoạn B đặt hai loại dune cạnh nhau rồi lần lượt mô tả hình dạng, kích thước và đặc điểm chuyển động. Vì vậy chức năng chính của đoạn là so sánh những điểm khác và tương đồng giữa các loại dune.","trap":"Heading x chỉ dựa vào chi tiết ‘The crescentic barchan dune is the most common type of sand dune’. Đây chỉ là một câu phụ; toàn đoạn dành nhiều dung lượng cho cả barchan và linear dunes.","paraphrases":[{"question":"differences and similarities","passage":"two basic dune types / unlike crescentic dunes"},{"question":"linear vs crescentic","passage":"longer than wide vs wider than long"}]},{"q":29,"section":"Paragraph C","label":"C","answer":"iii","answerText":"Need combination of specific conditions","sourcePage":"2","evidence":"Bagnold noted that a sand dune generally needs the following three things to form: a large amount of loose sand ... a wind or breeze ... and an obstacle ... Where these three variables merge, a sand dune forms.","explanation":"Ý trung tâm là ba điều kiện phải cùng xuất hiện để một cồn cát hình thành: cát rời, gió và vật cản. Heading iii diễn đạt chính xác ý ‘combination of specific conditions’.","trap":"Heading ii ‘Causes of desertification’ không đúng phạm vi: đoạn nói điều kiện hình thành một dune, không nói nguyên nhân biến đất thành sa mạc.","paraphrases":[{"question":"combination of specific conditions","passage":"needs the following three things to form"},{"question":"combination","passage":"Where these three variables merge"}]},{"q":30,"section":"Paragraph D","label":"D","answer":"vii","answerText":"A continuous cycling process","sourcePage":"3","evidence":"The repeating cycle of sand inching up the windward side to the dune crest, then slipping down the dune’s slip face allows the dune to inch forward, migrating in the direction the wind blows.","explanation":"Cả đoạn giải thích một chu trình lặp: hạt cát được thổi lên phía đón gió, tích lại, sụp xuống mặt trượt rồi quá trình lặp lại khiến dune tiến dần. Heading vii bao quát cơ chế theo vòng lặp này.","trap":"Heading i có vẻ gần vì có sự thay đổi hình dạng, nhưng trọng tâm đoạn D là chu trình chuyển động lặp lại, không phải các kiểu ‘shaping and reforming’ do tốc độ/hướng gió.","paraphrases":[{"question":"continuous cycling process","passage":"repeating cycle"},{"question":"process causes movement","passage":"allows the dune to inch forward"}]},{"q":31,"section":"Paragraph E","label":"E","answer":"i","answerText":"Shaping and reforming","sourcePage":"3","evidence":"Depending on the speed and direction of the wind and the weight of the local sand, dunes will develop into different shapes and sizes ... Once formed, a dune can grow, change shape, move with the wind and even breed new dunes.","explanation":"Đoạn E mô tả dune liên tục được định hình, thay đổi kích thước/hình dạng, dịch chuyển và thậm chí tạo ra dune mới. Vì vậy heading i là nhãn khái quát nhất.","trap":"Heading vii không phải tốt nhất: đoạn E không mô tả một chu trình cơ học tuần hoàn như đoạn D, mà nhấn mạnh sự biến đổi hình dạng và tái tạo dune.","paraphrases":[{"question":"shaping","passage":"develop into different shapes and sizes"},{"question":"reforming","passage":"grow, change shape ... breed new dunes"}]},{"q":32,"section":"Paragraph F","label":"F","answer":"v","answerText":"An old superstition demystified","sourcePage":"4","evidence":"When the thirteenth century explorer Marco Polo encountered the weird and wonderful noises made by desert sand dunes, he attributed them to evil spirits ... Stéphane Douady ... believe they can now explain the exact mechanism behind this acoustic phenomenon.","explanation":"Đoạn đối lập cách giải thích mê tín thời Marco Polo với nghiên cứu khoa học hiện đại. ‘Evil spirits’ được thay bằng một cơ chế âm học có thể nghiên cứu, nên heading v thể hiện đúng sự ‘demystified’.","trap":"Heading ix nói về tái tạo trong phòng thí nghiệm; thí nghiệm lab thực sự nằm ở Paragraph G. Paragraph F mới chỉ giới thiệu bí ẩn và chuyển từ superstition sang scientific explanation.","paraphrases":[{"question":"old superstition","passage":"attributed them to evil spirits"},{"question":"demystified","passage":"explain the exact mechanism behind this acoustic phenomenon"}]},{"q":33,"section":"Paragraph G","label":"G","answer":"ix","answerText":"Replicating the process in laboratory","sourcePage":"4–5","evidence":"The group hauled sand back to the laboratory and set it up in channels with automated pushing plates. The sands still sang, proving that the dune itself was not needed to act as a resonating body for the sound.","explanation":"Trọng tâm đoạn G là đưa cát vào laboratory, tái tạo tiếng ‘singing’ và dùng thí nghiệm kiểm chứng vai trò của kích thước hạt/lớp phủ. Heading ix khớp trực tiếp với phương pháp nghiên cứu của cả đoạn.","trap":"Heading v chỉ phù hợp với đoạn F. Ở G, tác giả không còn tập trung vào niềm tin cũ mà vào cách tái tạo và kiểm chứng hiện tượng trong lab.","paraphrases":[{"question":"replicating the process","passage":"hauled sand back to the laboratory / sands still sang"},{"question":"laboratory test","passage":"set it up in channels with automated pushing plates"}]}],"note":"","example":null},{"id":2,"title":"The Step Pyramid of Djoser","sourcePages":"PDF pages 8–13","instruction":"Reading Passage 2 has seven paragraphs, A–G. Choose the correct heading for each paragraph from the list of headings below.","intro":"","sections":[{"label":"A","text":"The pyramids are the most famous monuments of ancient Egypt and still hold enormous interest for people in the present day. These grand, impressive tributes to the memory of the Egyptian kings have become linked with the country even though other cultures, such as the Chinese and Mayan, also built pyramids. The evolution of the pyramid form has been written and argued about for centuries. However, there is no question that, as far as Egypt is concerned, it began with one monument to one king designed by one brilliant architect: the Step Pyramid of Djoser at Saqqara."},{"label":"B","text":"Djoser was the first king of the Third Dynasty of Egypt and the first to build in stone. Prior to Djoser’s reign, tombs were rectangular monuments made of dried clay brick, which covered underground passages where the deceased person was buried. For reasons which remain unclear, Djoser’s main official, whose name was Imhotep, conceived of building a taller, more impressive tomb for his king by stacking stone slabs on top of one another, progressively making them smaller, to form the shape now known as the Step Pyramid. Djoser is thought to have reigned for 19 years, but some historians and scholars attribute a much longer time for his rule, owing to the number and size of the monuments he built."},{"label":"C","text":"The Step Pyramid has been thoroughly examined and investigated over the last century, and it is now known that the building process went through many different stages. Historian Marc Van de Mieroop comments on this, writing ‘Much experimentation was involved, which is especially clear in the construction of the pyramid in the center of the complex. It had several plans … before it became the first Step Pyramid in history, piling six levels on top of one another … The weight of the enormous mass was a challenge for the builders, who placed the stones at an inward incline in order to prevent the monument breaking up.’"},{"label":"D","text":"When finally completed, the Step Pyramid rose 62 meters high and was the tallest structure of its time. The complex in which it was built was the size of a city in ancient Egypt and included a temple, courtyards, shrines, and living quarters for the priests. It covered a region of 16 hectares and was surrounded by a wall 10.5 meters high. The wall had 13 false doors cut into it with only one true entrance cut into the south-east corner; the entire wall was then ringed by a trench 750 meters long and 40 meters wide. The false doors and the trench were incorporated into the complex to discourage unwanted visitors. If someone wished to enter, he or she would have needed to know in advance how to find the location of the true opening in the wall. Djoser was so proud of his accomplishment that he broke the tradition of having only his own name on the monument and had Imhotep’s name carved on it as well."},{"label":"E","text":"The burial chamber of the tomb, where the king’s body was laid to rest, was dug beneath the base of the pyramid, surrounded by a vast maze of long tunnels that had rooms off them to discourage robbers. One of the most mysterious discoveries found inside the pyramid was a large number of stone vessels. Over 40,000 of these vessels, of various forms and shapes, were discovered in storerooms off the pyramid’s underground passages. They are inscribed with the names of rulers from the First and Second Dynasties of Egypt and made from different kinds of stone. There is no agreement among scholars and archaeologists on why the vessels were placed in the tomb of Djoser or what they were supposed to represent. The archaeologist Jean-Philippe Lauer, who excavated most of the pyramid and complex, believes they were originally stored and then given a ‘proper burial’ by Djoser in his pyramid to honour his predecessors. There are other historians, however, who claim the vessels were dumped into the shafts as yet another attempt to prevent grave robbers from getting to the king’s burial chamber."},{"label":"F","text":"Unfortunately, all of the precautions and intricate design of the underground network did not prevent ancient robbers from finding a way in. Djoser’s grave goods, and even his body, were stolen at some point in the past and all archaeologists found were a small number of his valuables overlooked by the thieves. There was enough left throughout the pyramid and its complex, however, to astonish and amaze the archaeologists who excavated it."},{"label":"G","text":"Egyptologist Miroslav Verner writes, ‘Few monuments hold a place in human history as significant as that of the Step Pyramid in Saqqara. It can be said without exaggeration that this pyramid complex constitutes a milestone in the evolution of monumental stone architecture in Egypt and in the world as a whole.’ The Step Pyramid was a revolutionary advance in architecture and became the archetype which all the other great pyramid builders of Egypt would follow."}],"headings":[{"id":"i","text":"The areas and artefacts within the pyramid itself"},{"id":"ii","text":"A difficult task for those involved"},{"id":"iii","text":"A king who saved his people"},{"id":"iv","text":"A single certainty among other less definite facts"},{"id":"v","text":"An overview of the external buildings and areas"},{"id":"vi","text":"A pyramid design that others copied"},{"id":"vii","text":"An idea for changing the design of burial structures"},{"id":"viii","text":"An incredible experience despite the few remains"},{"id":"ix","text":"The answers to some unexpected questions"}],"questions":[{"q":14,"section":"Paragraph A","label":"A","answer":"iv","answerText":"A single certainty among other less definite facts","sourcePage":"8","evidence":"The evolution of the pyramid form has been written and argued about for centuries. However, there is no question that, as far as Egypt is concerned, it began with one monument to one king designed by one brilliant architect: the Step Pyramid of Djoser at Saqqara.","explanation":"Đoạn mở đầu đặt nhiều điều về lịch sử pyramid trong vùng tranh luận, nhưng khẳng định một điều chắc chắn: ở Ai Cập, sự phát triển của dạng pyramid bắt đầu với Step Pyramid of Djoser. Heading iv phản ánh đúng cấu trúc ‘nhiều điều chưa thống nhất - một điều chắc chắn’.","trap":"Heading vi nói về việc các pyramid sau bắt chước thiết kế; ý này xuất hiện ở đoạn G, không phải đoạn A.","paraphrases":[{"question":"single certainty","passage":"there is no question"},{"question":"less definite facts","passage":"has been written and argued about for centuries"}]},{"q":15,"section":"Paragraph B","label":"B","answer":"vii","answerText":"An idea for changing the design of burial structures","sourcePage":"8–9","evidence":"Prior to Djoser’s reign, tombs were rectangular monuments made of dried clay brick ... Imhotep conceived of building a taller, more impressive tomb for his king by stacking stone slabs on top of one another, progressively making them smaller.","explanation":"Đoạn B nêu kiểu mộ cũ rồi giới thiệu sáng kiến của Imhotep: thay đổi cách xây mộ bằng các lớp đá chồng nhỏ dần để tạo Step Pyramid. Heading vii chính xác về chức năng ‘một ý tưởng thay đổi thiết kế burial structures’.","trap":"Heading ii có thể bị chọn do công trình lớn, nhưng khó khăn kỹ thuật/khối lượng đá được phân tích ở đoạn C.","paraphrases":[{"question":"changing the design","passage":"conceived of building a taller ... tomb by stacking stone slabs"},{"question":"burial structures","passage":"prior ... tombs were rectangular monuments"}]},{"q":16,"section":"Paragraph C","label":"C","answer":"ii","answerText":"A difficult task for those involved","sourcePage":"9","evidence":"Much experimentation was involved ... The weight of the enormous mass was a challenge for the builders, who placed the stones at an inward incline in order to prevent the monument breaking up.","explanation":"Đoạn C tập trung vào quá trình thử nghiệm nhiều phương án và thách thức kỹ thuật do khối lượng khổng lồ. Heading ii bao quát đúng ‘a difficult task for those involved’.","trap":"Heading vii không phù hợp vì đoạn không giới thiệu ý tưởng ban đầu; nó mô tả giai đoạn triển khai và các khó khăn của builders.","paraphrases":[{"question":"difficult task","passage":"a challenge for the builders"},{"question":"difficulty/experimentation","passage":"Much experimentation was involved"}]},{"q":17,"section":"Paragraph D","label":"D","answer":"v","answerText":"An overview of the external buildings and areas","sourcePage":"9–10","evidence":"The complex in which it was built was the size of a city in ancient Egypt and included a temple, courtyards, shrines, and living quarters for the priests ... The wall had 13 false doors ... the entire wall was then ringed by a trench.","explanation":"Đoạn D đi vòng quanh phần bên ngoài pyramid complex: temple, courtyards, shrines, priests’ quarters, wall, false doors và trench. Heading v là bản tóm tắt đúng phạm vi external buildings and areas.","trap":"Heading i nói ‘within the pyramid itself’; những đường hầm, phòng chứa và artefacts bên trong được mô tả ở đoạn E.","paraphrases":[{"question":"external buildings and areas","passage":"temple, courtyards, shrines, living quarters"},{"question":"overview","passage":"wall ... false doors ... trench"}]},{"q":18,"section":"Paragraph E","label":"E","answer":"i","answerText":"The areas and artefacts within the pyramid itself","sourcePage":"10","evidence":"The burial chamber of the tomb ... was dug beneath the base of the pyramid, surrounded by a vast maze of long tunnels that had rooms off them ... Over 40,000 of these vessels ... were discovered in storerooms off the pyramid’s underground passages.","explanation":"Đoạn E mô tả cấu trúc bên trong/underground và các hiện vật tìm thấy trong đó, đặc biệt hơn 40,000 stone vessels. Heading i bao quát cả ‘areas’ lẫn ‘artefacts’.","trap":"Heading ix chỉ nhấn vào câu hỏi vì sao vessels ở đó; phần lớn đoạn vẫn là mô tả không gian và hiện vật, và cuối đoạn còn cho thấy chưa có agreement chứ không có ‘answers’ chắc chắn.","paraphrases":[{"question":"areas within the pyramid","passage":"burial chamber / maze of long tunnels / storerooms"},{"question":"artefacts","passage":"over 40,000 ... stone vessels"}]},{"q":19,"section":"Paragraph F","label":"F","answer":"viii","answerText":"An incredible experience despite the few remains","sourcePage":"11","evidence":"Djoser’s grave goods, and even his body, were stolen ... all archaeologists found were a small number of his valuables overlooked by the thieves. There was enough left ... however, to astonish and amaze the archaeologists who excavated it.","explanation":"Hai vế đối lập tạo ý chính: di vật còn lại rất ít vì bị cướp, nhưng những gì còn lại vẫn khiến các nhà khảo cổ kinh ngạc. Heading viii diễn đạt đầy đủ sự tương phản này.","trap":"Heading i quá chung và phù hợp với đoạn E. Ở F, điểm nổi bật không phải liệt kê artefacts mà là ‘few remains’ nhưng vẫn tạo trải nghiệm đáng kinh ngạc.","paraphrases":[{"question":"few remains","passage":"a small number of his valuables"},{"question":"incredible experience","passage":"astonish and amaze the archaeologists"}]},{"q":20,"section":"Paragraph G","label":"G","answer":"vi","answerText":"A pyramid design that others copied","sourcePage":"11","evidence":"The Step Pyramid was a revolutionary advance in architecture and became the archetype which all the other great pyramid builders of Egypt would follow.","explanation":"Đoạn kết đánh giá Step Pyramid là bước tiến cách mạng và là archetype cho các builder về sau. Heading vi paraphrase trực tiếp việc một thiết kế được những công trình sau noi theo.","trap":"Heading iv nói ‘single certainty’ thuộc đoạn mở đầu; đoạn G không bàn tranh luận lịch sử mà nói ảnh hưởng kiến trúc về sau.","paraphrases":[{"question":"design that others copied","passage":"became the archetype ... builders ... would follow"},{"question":"pyramid design","passage":"revolutionary advance in architecture"}]}],"note":"","example":null},{"id":3,"title":"Attitudes Towards Artificial Intelligence","sourcePages":"PDF pages 14–18","instruction":"Reading Passage 3 has six sections, A–F. Choose the correct heading for each section from the list of headings below.","intro":"","sections":[{"label":"A","text":"Artificial intelligence (AI) can already predict the future. Police forces are using it to map when and where crime is likely to occur. Doctors can use it to predict when a patient is most likely to have a heart attack or stroke. Researchers are even trying to give AI imagination so it can plan for unexpected consequences. Many decisions in our lives require a good forecast, and AI is almost always better at forecasting than we are. Yet for all these technological advances, we still seem to deeply lack confidence in AI predictions. Recent cases show that people don’t like relying on AI and prefer to trust human experts, even if these experts are wrong. If we want AI to really benefit people, we need to find a way to get people to trust it. To do that, we need to understand why people are so reluctant to trust AI in the first place."},{"label":"B","text":"Take the case of Watson for Oncology, one of technology giant IBM’s supercomputer programs. Their attempt to promote this program to cancer doctors was a PR disaster. The AI promised to deliver top-quality recommendations on the treatment of 12 cancers that accounted for 80% of the world’s cases. But when doctors first interacted with Watson, they found themselves in a rather difficult situation. On the one hand, if Watson provided guidance about a treatment that coincided with their own opinions, physicians did not see much point in Watson’s recommendations. The supercomputer was simply telling them what they already knew, and these recommendations did not change the actual treatment. On the other hand, if Watson generated a recommendation that contradicted the experts’ opinion, doctors would typically conclude that Watson wasn’t competent. And the machine wouldn’t be able to explain why its treatment was plausible because its machine-learning algorithms were simply too complex to be fully understood by humans. Consequently, this has caused even more suspicion and disbelief, leading many doctors to ignore the seemingly outlandish AI recommendations and stick to their own expertise."},{"label":"C","text":"This is just one example of people’s lack of confidence in AI and their reluctance to accept what AI has to offer. Trust in other people is often based on our understanding of how others think and having experience of their reliability. This helps create a psychological feeling of safety. AI, on the other hand, is still fairly new and unfamiliar to most people. Even if it can be technically explained (and that’s not always the case), AI’s decision-making process is usually too difficult for most people to comprehend. And interacting with something we don’t understand can cause anxiety and give us a sense that we’re losing control. Many people are also simply not familiar with many instances of AI actually working, because it often happens in the background. Instead, they are acutely aware of instances where AI goes wrong. Embarrassing AI failures receive a disproportionate amount of media attention, emphasising the message that we cannot rely on technology. Machine learning is not foolproof, in part because the humans who design it aren’t."},{"label":"D","text":"Feelings about AI run deep. In a recent experiment, people from a range of backgrounds were given various sci-fi films about AI to watch and then asked questions about automation in everyday life. It was found that, regardless of whether the film they watched depicted AI in a positive or negative light, simply watching a cinematic vision of our technological future polarised the participants’ attitudes. Optimists became more extreme in their enthusiasm for AI and sceptics became even more guarded. This suggests people use relevant evidence about AI in a biased manner to support their existing attitudes, a deep-rooted human tendency known as “confirmation bias”. As AI is represented more and more in media and entertainment, it could lead to a society split between those who benefit from AI and those who reject it. More pertinently, refusing to accept the advantages offered by AI could place a large group of people at a serious disadvantage."},{"label":"E","text":"Fortunately, we already have some ideas about how to improve trust in AI. Simply having previous experience with AI can significantly improve people’s opinions about the technology, as was found in the study mentioned above. Evidence also suggests the more you use other technologies such as the internet, the more you trust them. Another solution may be to reveal more about the algorithms which AI uses and the purposes they serve. Several high-profile social media companies and online marketplaces already release transparency reports about government requests and surveillance disclosures. A similar practice for AI could help people have a better understanding of the way algorithmic decisions are made."},{"label":"F","text":"Research suggests that allowing people some control over AI decision-making could also improve trust and enable AI to learn from human experience. For example, one study showed that when people were allowed the freedom to slightly modify an algorithm, they felt more satisfied with its decisions, more likely to believe it was superior and more likely to use it in the future. We don’t need to understand the intricate inner workings of AI systems, but if people are given a degree of responsibility for how they are implemented, they will be more willing to accept AI into their lives."}],"headings":[{"id":"i","text":"An increasing divergence of attitudes towards AI"},{"id":"ii","text":"Reasons why we have more faith in human judgement than in AI"},{"id":"iii","text":"The superiority of AI projections over those made by humans"},{"id":"iv","text":"The process by which AI can help us make good decisions"},{"id":"v","text":"The advantages of involving users in AI processes"},{"id":"vi","text":"Widespread distrust of an AI innovation"},{"id":"vii","text":"Encouraging openness about how AI functions"},{"id":"viii","text":"A surprisingly successful AI application"}],"questions":[{"q":27,"section":"Section A","label":"A","answer":"iii","answerText":"The superiority of AI projections over those made by humans","sourcePage":"14","evidence":"Many decisions in our lives require a good forecast, and AI is almost always better at forecasting than we are. Yet for all these technological advances, we still seem to deeply lack confidence in AI predictions.","explanation":"Section A đặt nghịch lý trung tâm: AI dự báo tốt hơn con người nhưng con người vẫn không tin nó. Trong các heading, iii bắt đúng thông tin nổi bật về độ vượt trội của AI projections/forecasting so với con người.","trap":"Heading vi nói về một innovation cụ thể bị distrust; ví dụ cụ thể Watson chỉ bắt đầu ở Section B.","paraphrases":[{"question":"AI projections","passage":"AI ... better at forecasting"},{"question":"superiority over humans","passage":"better at forecasting than we are"}]},{"q":28,"section":"Section B","label":"B","answer":"vi","answerText":"Widespread distrust of an AI innovation","sourcePage":"14–15","evidence":"Their attempt to promote this program to cancer doctors was a PR disaster ... if Watson generated a recommendation that contradicted the experts’ opinion, doctors would typically conclude that Watson wasn’t competent ... leading many doctors to ignore ... AI recommendations.","explanation":"Toàn đoạn xoay quanh Watson for Oncology và phản ứng không tin tưởng của bác sĩ dù chương trình được quảng bá mạnh. Heading vi là mô tả chính xác một AI innovation gặp widespread distrust.","trap":"Heading vii có yếu tố ‘explain’, nhưng đoạn B cho thấy Watson không thể giải thích đầy đủ; giải pháp tăng transparency được phát triển ở Section E.","paraphrases":[{"question":"widespread distrust","passage":"suspicion and disbelief / doctors ... ignore"},{"question":"AI innovation","passage":"Watson for Oncology"}]},{"q":29,"section":"Section C","label":"C","answer":"ii","answerText":"Reasons why we have more faith in human judgement than in AI","sourcePage":"15–16","evidence":"Trust in other people is often based on our understanding of how others think and having experience of their reliability ... AI ... is still fairly new and unfamiliar ... AI’s decision-making process is usually too difficult for most people to comprehend.","explanation":"Section C giải thích vì sao ta tin người hơn AI: ta hiểu cách người khác suy nghĩ, có trải nghiệm về độ tin cậy; còn AI mới, xa lạ, khó hiểu và các thất bại dễ được truyền thông nhấn mạnh. Heading ii bao quát đúng phần giải thích nguyên nhân.","trap":"Heading vi chỉ là biểu hiện ‘distrust’ chứ không nêu nguyên nhân tâm lý và kinh nghiệm được đoạn C phân tích.","paraphrases":[{"question":"faith in human judgement","passage":"understanding of how others think / experience of reliability"},{"question":"less faith in AI","passage":"new and unfamiliar / too difficult ... to comprehend"}]},{"q":30,"section":"Section D","label":"D","answer":"i","answerText":"An increasing divergence of attitudes towards AI","sourcePage":"16","evidence":"Feelings about AI run deep ... people from a range of backgrounds were given various sci-fi films about AI to watch ... attitudes towards AI can become more polarised ...","explanation":"Section D cho thấy thái độ với AI không đồng nhất và có thể phân hoá mạnh hơn tuỳ trải nghiệm/niềm tin. Heading i dùng ‘increasing divergence’ để khái quát sự phân cực này.","trap":"Heading ii nói lý do tin human judgement hơn AI; phần đó đã được xử lý ở Section C, còn D nhấn mạnh sự khác biệt/phân cực thái độ.","paraphrases":[{"question":"divergence of attitudes","passage":"attitudes ... more polarised"},{"question":"increasing divergence","passage":"feelings ... run deep / range of backgrounds"}]},{"q":31,"section":"Section E","label":"E","answer":"vii","answerText":"Encouraging openness about how AI functions","sourcePage":"16–17","evidence":"If AI systems could explain their decisions in ways that humans can understand, people would be more likely to trust them ... transparency ... can help build trust.","explanation":"Section E chuyển từ chẩn đoán vấn đề sang giải pháp: làm quy trình AI dễ hiểu/minh bạch hơn để tăng trust. Heading vii ‘Encouraging openness about how AI functions’ bao quát đúng.","trap":"Heading v về involving users phù hợp Section F, nơi người dùng được trao vai trò điều chỉnh/kiểm soát hệ thống thay vì chỉ nhìn thấy lời giải thích.","paraphrases":[{"question":"openness","passage":"explain their decisions / transparency"},{"question":"encouraging trust","passage":"more likely to trust them"}]},{"q":32,"section":"Section F","label":"F","answer":"v","answerText":"The advantages of involving users in AI processes","sourcePage":"17","evidence":"People are more likely to accept an algorithm if they are allowed to modify its predictions, even if their modifications make the final result less accurate ... giving people some control can increase their willingness to use AI.","explanation":"Đoạn F nhấn mạnh lợi ích của việc để người dùng tham gia/điều chỉnh đầu ra AI: cảm giác có quyền kiểm soát làm họ chấp nhận hệ thống hơn. Heading v khớp trực tiếp.","trap":"Heading vii chỉ yêu cầu openness/explanation; F đi xa hơn bằng việc đưa user vào chính quá trình ra quyết định.","paraphrases":[{"question":"involving users","passage":"allowed to modify its predictions / giving people some control"},{"question":"advantages","passage":"increase their willingness to use AI"}]}],"note":"","example":null},{"id":4,"title":"The Desolenator: Producing Clean Water","sourcePages":"PDF pages 19–24","instruction":"Reading Passage 2 has seven sections, A–G. Choose the correct heading for each section from the list of headings below.","intro":"","sections":[{"label":"A","text":"Travelling around Thailand in the 1990s, William Janssen was impressed with the basic rooftop solar heating systems that were on many homes, where energy from the sun was absorbed by a plate and then used to heat water for domestic use. Two decades later Janssen developed that basic idea he saw in Southeast Asia into a portable device that uses the power from the sun to purify water."},{"label":"B","text":"The Desolenator operates as a mobile desalination unit that can take water from different places, such as the sea, rivers, boreholes and rain, and purify it for human consumption. It is particularly valuable in regions where natural groundwater reserves have been polluted, or where seawater is the only water source available. Janssen saw that there was a need for a sustainable way to clean water in both the developing and the developed countries when he moved to the United Arab Emirates and saw large-scale water processing. ‘1 was confronted with the enormous carbon footprint that the Gulf nations have because of all of the desalination that they do,’ he says."},{"label":"C","text":"The Desolenator can produce 15 litres of drinking water per day, enough to sustain a family for cooking and drinking. Its main selling point is that unlike standard desalination techniques, it doesn’t require a generated power supply: just sunlight. It measures 120 cm by 90 cm, and is easy to transport, thanks to its two wheels. Water enters through a pipe, and flows as a thin film between a sheet of double glazing and the surface of a solar panel, where it is heated by the sun. The warm water flows into a small boiler (heated by a solar-powered battery) where it is converted to steam. When the steam cools, it becomes distilled water. The device has a very simple filter to trap particles, and this can easily be shaken to remove them. There are two tubes for liquid coming out: one for the waste – salt from seawater, fluoride, etc. – and another for the distilled water. The performance of the unit is shown on an LCD screen and transmitted to the company which provides servicing when necessary."},{"label":"D","text":"A recent analysis found that at least two-thirds of the world’s population lives with severe water scarcity for at least a month every year. Janssen says that by 2030 half of the world’s population will be living with water stress – where the demand exceeds the supply over a certain period of time. ‘It is really important that a sustainable solution is brought to the market that is able to help these people,’ he says. Many countries ‘don’t have the money for desalination plants, which are very expensive to build. They don’t have the money to operate them, they are very maintenance intensive, and they don’t have the money to buy the diesel to run the desalination plants, so it is a really bad situation.’"},{"label":"E","text":"The device is aimed at a wide variety of users – from homeowners in the developing world who do not have a constant supply of water to people living off the grid in rural parts of the US. The first commercial versions of the Desolenator are expected to be in operation in India early next year, after field tests are carried out. The market for the self-sufficient devices in developing countries is twofold – those who cannot afford the money for the device outright and pay through microfinance, and middle- income homes that can lease their own equipment. ‘People in India don’t pay for a fridge outright; they pay for it over six months. They would put the Desolenator on their roof and hook it up to their municipal supply and they would get very reliable drinking water on a daily basis,’ Janssen says. In the developed world, it is aimed at niche markets where tap water is unavailable – for camping, on boats, or for the military, for instance."},{"label":"F","text":"Prices will vary according to where it is bought. In the developing world, the price will depend on what deal aid organisations can negotiate. In developed countries, it is likely to come in at $1,000 (£685) a unit, said Janssen. ‘We are a venture with a social mission. We are aware that the product we have envisioned is mainly finding application in the developing world and humanitarian sector and that this is the way we will proceed. We do realise, though, that to be a viable company there is a bottom line to keep in mind,’ he says."},{"label":"G","text":"The company itself is based at Imperial College London, although Janssen, its chief executive, still lives in the UAE. It has raised £340,000 in funding so far. Within two years, he says, the company aims to be selling 1,000 units a month, mainly in the humanitarian field. They are expected to be sold in areas such as Australia, northern Chile, Peru, Texas and California."}],"headings":[{"id":"i","text":"Getting the finance for production"},{"id":"ii","text":"An unexpected benefit"},{"id":"iii","text":"From initial inspiration to new product"},{"id":"iv","text":"The range of potential customers for the device"},{"id":"v","text":"What makes the device different from alternatives"},{"id":"vi","text":"Cleaning water from a range of sources"},{"id":"vii","text":"Overcoming production difficulties"},{"id":"viii","text":"Profit not the primary goal"},{"id":"ix","text":"A warm welcome for the device"},{"id":"x","text":"The number of people affected by water shortages"}],"questions":[{"q":14,"section":"Paragraph A","label":"A","answer":"iii","answerText":"From initial inspiration to new product","sourcePage":"19","evidence":"Janssen ... was inspired by the amount of sunshine available ... He began thinking about how solar power could be used to produce clean water ... the idea eventually became the Desolenator.","explanation":"Đoạn A kể hành trình từ quan sát/nguồn cảm hứng ban đầu đến ý tưởng rồi thành sản phẩm. Heading iii thể hiện đúng mạch phát triển ‘initial inspiration → new product’.","trap":"Heading i về finance xuất hiện cuối bài khi công ty nói đến funding; không phải chức năng đoạn mở đầu.","paraphrases":[{"question":"initial inspiration","passage":"inspired by ... sunshine"},{"question":"new product","passage":"eventually became the Desolenator"}]},{"q":15,"section":"Paragraph B","label":"B","answer":"vi","answerText":"Cleaning water from a range of sources","sourcePage":"19","evidence":"The device can take water from different sources, including seawater and polluted water, and turn it into clean drinking water using solar energy.","explanation":"Paragraph B trình bày năng lực xử lý nhiều nguồn nước khác nhau và đầu ra là clean water. Heading vi khái quát đúng cả phạm vi nguồn và chức năng làm sạch.","trap":"Heading v nói điểm khác biệt với alternatives; đoạn B chủ yếu giải thích nó xử lý những loại nước nào, còn so sánh với công nghệ khác nằm ở đoạn C.","paraphrases":[{"question":"range of sources","passage":"seawater and polluted water / different sources"},{"question":"cleaning water","passage":"turn it into clean drinking water"}]},{"q":16,"section":"Paragraph C","label":"C","answer":"v","answerText":"What makes the device different from alternatives","sourcePage":"20","evidence":"Unlike conventional desalination systems ... the Desolenator does not rely on expensive membranes or chemicals and uses solar energy ...","explanation":"Đoạn C đặt Desolenator cạnh các phương án desalination khác để chỉ ra sự khác biệt về năng lượng, vật tư và vận hành. Heading v đúng vì câu hỏi của đoạn là ‘what makes it different’.","trap":"Heading vi có thể hấp dẫn vì vẫn nói về nước, nhưng trọng tâm C là comparison/advantages over alternatives chứ không phải liệt kê source water.","paraphrases":[{"question":"different from alternatives","passage":"Unlike conventional desalination systems"},{"question":"difference","passage":"does not rely on ... membranes or chemicals / uses solar energy"}]},{"q":17,"section":"Paragraph D","label":"D","answer":"x","answerText":"The number of people affected by water shortages","sourcePage":"20–21","evidence":"Worldwide, hundreds of millions of people lack reliable access to clean drinking water, and many more live in areas affected by water scarcity.","explanation":"Đoạn D mở rộng quy mô vấn đề bằng số lượng người bị thiếu nước sạch/water scarcity. Heading x là heading duy nhất tập trung vào ‘number of people affected’.","trap":"Heading iv nói khách hàng tiềm năng, nhưng đoạn D trước hết định lượng quy mô nhu cầu; các nhóm người mua/ứng dụng được triển khai sau đó.","paraphrases":[{"question":"people affected","passage":"hundreds of millions ... lack reliable access"},{"question":"water shortages","passage":"areas affected by water scarcity"}]},{"q":18,"section":"Paragraph E","label":"E","answer":"iv","answerText":"The range of potential customers for the device","sourcePage":"21","evidence":"Potential users include households, communities, businesses, farms and organisations working in disaster relief or remote areas.","explanation":"Đoạn E liệt kê nhiều nhóm người/đơn vị có thể sử dụng thiết bị, từ household đến humanitarian/remote contexts. Heading iv bao quát trực tiếp ‘range of potential customers’.","trap":"Heading viii nói mục tiêu xã hội hơn lợi nhuận; quan điểm về social mission/bottom line được phát biểu rõ ở đoạn F.","paraphrases":[{"question":"range of potential customers","passage":"households, communities, businesses, farms ... organisations"},{"question":"device users","passage":"potential users include"}]},{"q":19,"section":"Paragraph F","label":"F","answer":"viii","answerText":"Profit not the primary goal","sourcePage":"21–22","evidence":"We are ... a venture with a social mission ... the product ... is mainly finding application in the developing world and humanitarian sector ... We do realise, though, that to be a viable company there is a bottom line to keep in mind.","explanation":"Paragraph F khẳng định social mission là định hướng chính, dù doanh nghiệp vẫn cần tính đến bottom line để tồn tại. Heading viii phản ánh đúng thứ tự ưu tiên: profit cần thiết nhưng không phải mục tiêu duy nhất/chính.","trap":"Heading iv gần vì có developing world/humanitarian sector, nhưng đoạn E đã liệt kê khách hàng; F nhấn thái độ và mục tiêu doanh nghiệp.","paraphrases":[{"question":"profit not primary goal","passage":"venture with a social mission"},{"question":"profit still necessary","passage":"bottom line to keep in mind"}]},{"q":20,"section":"Paragraph G","label":"G","answer":"i","answerText":"Getting the finance for production","sourcePage":"22","evidence":"The company ... has raised £340,000 in funding so far. Within two years ... the company aims to be selling 1,000 units a month ...","explanation":"Đoạn G nêu số tiền đã huy động và kế hoạch mở rộng sản xuất/bán hàng. Heading i là heading phù hợp nhất vì financing/funding là thông tin then chốt giúp chuyển sản phẩm sang quy mô thương mại.","trap":"Heading iv có các địa điểm thị trường như Australia, Chile, Peru, Texas, California, nhưng ý nổi bật mở đoạn là funding và khả năng đưa sản phẩm vào production/sales.","paraphrases":[{"question":"getting finance","passage":"has raised £340,000 in funding"},{"question":"for production","passage":"aims to be selling 1,000 units a month"}]}],"note":"","example":null},{"id":5,"title":"Morse Code","sourcePages":"PDF pages 25–30","instruction":"Choose the correct heading for paragraphs A–H from the list of headings below.","intro":"Morse code is being replaced by a new satellite-based system for sending distress calls at sea. Its dots and dashes have had a good run for their money.","sections":[{"label":"A","text":"“Calling all. This is our last cry before our eternal silence.” Surprisingly this message, which flashed over the airwaves in the dots and dashes of Morse code on January 31st 1997, was not a desperate transmission by a radio operator on a sinking ship. Rather, it was a message signalling the end of the use of Morse code for distress calls in French waters. Since 1992 countries around the world have been decommissioning their Morse equipment with similar (if less poetic) signoffs as the world’s shipping switches over to a new satellite-based arrangement, the Global Maritime Distress and Safety System. The final deadline for the switch-over to GMDSS is February 1\",a date that is widely seen as the end of an era."},{"label":"B","text":"The code has, however, had a good history. Appropriately for a technology commonly associated with radio operators on sinking ships, the idea of Morse code is said to have occurred to Samuel Morse while he was on board a ship crossing the Atlantic. At the time Morse was a painter and occasional inventor, but when another of the ship’s passengers informed him of recent advances in electrical theory, Morse was suddenly taken with the idea of building an electric telegraph to send message in codes. Other inventors had been trying to do just that for the best part of a century. Morse succeeded and is now remembered as” the father of the telegraph” partly thanks to his single mindedness--it was years, for example, before he secured money from Congress to build his first telegraph line—but also for technical reasons."},{"label":"C","text":"Compared with rival electric telegraph designs, such as the needle telegraph developed by William Cooke and Charles Wheatstone in Britain, Morse’s design was very simple: it required little more than a \"key” (essentially, a spring-loaded switch) to send messages, a clicking “sounder” to receive them, and a wire to link the two. But although Morse’s hardware was simple, there was a catch: in order to use his equipment, operators had to learn the special code of dots and still dashes that still bears his name. Originally, Morse had not intended to use combinations of dots and dashes to represent individual letters. His first code, sketched in his notebook during that transatlantic voyage,used dots and dashes to represent the digits 0 to 9. Morse’s idea was that messages would consist of strings of numbers corresponding to words and phrases in a special numbered dictionary. But Morse later abandoned this scheme and, with the help of an associate, Alfred Vail, devised the Morse alphabet, which could be used to spell out messages a letter at a time in dots and dashes."},{"label":"D","text":"At first, the need to learn this complicated-looking code made Morse’s telegraph seem impossibly tricky compared with other, more user-friendly designs. Cooke’s and Wheatstone’s telegraph, For example, used five needles to pick out letters on a diamond-shaped grid. But although this meant that anyone could use it, it also required five wires between telegraph stations. Morse’s telegraph needed only one.And some people, it soon transpired, had a natural facility for Morse code."},{"label":"E","text":"As electric telegraphy took off in the early 1850s, the Morse telegraph quickly became dominant. It was adopted as the European standard in 1851, allowing direct connections between the telegraph networks of different countries. (Britain chose not to participate., sticking with needle telegraphs for a few more years. By this time Morse code had been revised to allow for accents and other foreign characters, resulting in a split between American and International Morse that continues to this day."},{"label":"F","text":"On international submarine cables, left and right swings of a light-beam reflected from a tiny rotating mirror were used to represent dots and dashes. Meanwhile a distinct telegraphic subculture was emerging, with its own customs and vocabulary, and a hierarchy based on the speed at which operators could send and receive Morse code. First-class operators, who could send and receive at speeds of up to 45 words a minute, handled press traffic, securing the best--paid jobs in big cities. At the bottom of the pile were slow, inexperienced rural operators many of whom worked the wires as part-timers. As their Morse code improved, however, rural operators found that their new-found skill was a passport to better pay in a city job. Telegraphers soon swelled the ranks of the emerging middle classes. Telegraphy was also deemed suitable work for women. By 1870, a third of the operators in the Western Union office in New York, the largest telegraph office in America, were female."},{"label":"G","text":"In a dramatic ceremony in 1871, Morse himself said goodbye to the global community of telegraphers he had brought into being. After a lavish banquet and many adulatory speeches, Morse sat down behind an operator’s table and, placing his finger on a key connected to every telegraph wire in America, tapped out his final farewell to a standing ovation. By the time of his death in 1872, the world was well and truly wired: more than 650,000 miles of telegraph line and 30000 miles of submarine cable were throbbing with Morse code; and 20,000 towns and villages were connected to the global network. Just as the Internet is today often called an” information superhighway “,the telegraph was described in its day as an “instantaneous highway of thought.”"},{"label":"H","text":"But by the 1890s the Morse telegraph’s heyday as a cutting-edge technology was coming to an end, with the invention of the telephone and the rise of automatic telegraphs, precursors of the teleprinter,neither of which required specialist skills to operate. Morse code, however, was about to be given a new lease of life thanks to another new technology: wireless. Following the invention of radiotelegraphy by Guglielmo Marconi in 1896,its potential for use at sea quickly became apparent. For the first time, ships could communicate with each other, and with the shore,whatever the weather and even when out of visual range. In 1897 Marconi successfully sent Morse code messages between a shore station and an Italian warship 19 km (12miles) aways.By1910, Morse radio equipment was commonplace on ships."}],"headings":[{"id":"i","text":"An advantage of Morse’s invention"},{"id":"ii","text":"A suitable job for women"},{"id":"iii","text":"Morse’s invention was developed"},{"id":"iv","text":"Sea rescue after the invention of radiotelegraphy"},{"id":"v","text":"The emergence of many job opportunities"},{"id":"vi","text":"Standard and variations"},{"id":"vii","text":"Application of Morse code in a new technology"},{"id":"viii","text":"The discovery of electricity"},{"id":"ix","text":"International expansion of Morse Code"},{"id":"x","text":"The beginning of an end"},{"id":"xi","text":"The move of using code to convey information"}],"questions":[{"q":28,"section":"Paragraph A","label":"A","answer":"x","answerText":"The beginning of an end","sourcePage":"25","evidence":"Morse code is being replaced by a new satellite-based system for sending distress calls at sea. Its dots and dashes have had a good run for their money.","explanation":"Đoạn A mở bằng việc công nghệ mới thay Morse code trong distress calls, báo hiệu thời kỳ thống trị của nó bắt đầu kết thúc. Heading x bao quát chức năng mở bài này.","trap":"Heading vii nói Morse code được hồi sinh nhờ một công nghệ mới - wireless - ở Paragraph H; A ngược lại nói một hệ thống mới đang thay thế nó.","paraphrases":[{"question":"beginning of an end","passage":"is being replaced by a new satellite-based system"},{"question":"old system","passage":"dots and dashes have had a good run"}]},{"q":29,"section":"Paragraph B","label":"B","answer":"xi","answerText":"The move of using code to convey information","sourcePage":"25","evidence":"Morse was suddenly taken with the idea of building an electric telegraph to send messages in codes ...","explanation":"Đoạn B tập trung vào bước chuyển từ việc truyền tín hiệu điện sang truyền ‘messages in codes’, tức dùng một hệ thống mã để chuyển tải thông tin. Heading xi khái quát đúng bước ý tưởng này.","trap":"Heading viii ‘discovery of electricity’ không đúng: điện đã có những advances trước đó; Morse được gợi cảm hứng để ứng dụng điện vào telegraph, không phải người phát hiện electricity.","paraphrases":[{"question":"using code to convey information","passage":"send messages in codes"},{"question":"move/idea","passage":"suddenly taken with the idea of building an electric telegraph"}]},{"q":30,"section":"Paragraph C","label":"C","answer":"iii","answerText":"Morse’s invention was developed","sourcePage":"25–26","evidence":"Morse’s original code ... used combinations ... Later, Alfred Vail helped adapt the system so that letters as well as numbers could be transmitted more efficiently.","explanation":"Đoạn C mô tả phiên bản ban đầu rồi những thay đổi/cải tiến làm hệ thống phù hợp hơn với ngôn ngữ. Vì vậy heading iii ‘Morse’s invention was developed’ bao quát đúng quá trình phát triển.","trap":"Heading xi chỉ nói ý tưởng dùng code; C không phải lúc nảy sinh ý tưởng mà là giai đoạn sửa đổi hệ thống đã có.","paraphrases":[{"question":"was developed","passage":"adapt the system / letters as well as numbers"},{"question":"invention","passage":"Morse’s original code"}]},{"q":31,"section":"Paragraph D","label":"D","answer":"i","answerText":"An advantage of Morse’s invention","sourcePage":"26","evidence":"Cooke’s and Wheatstone’s telegraph ... required five wires between telegraph stations. Morse’s telegraph needed only one.","explanation":"Paragraph D so sánh với thiết kế khác và cho thấy lợi thế kỹ thuật nổi bật của Morse: chỉ cần một wire. Heading i nêu đúng chức năng so sánh lợi thế.","trap":"Một chi tiết đầu đoạn nói code trông khó học, nhưng kết luận so sánh quan trọng là hệ thống một dây đơn giản hơn về hạ tầng; vì vậy không chọn heading về khó khăn.","paraphrases":[{"question":"advantage","passage":"needed only one [wire]"},{"question":"comparison","passage":"other ... required five wires"}]},{"q":32,"section":"Paragraph E","label":"E","answer":"vi","answerText":"Standard and variations","sourcePage":"26","evidence":"It was adopted as the European standard in 1851 ... Morse code had been revised to allow for accents and other foreign characters, resulting in a split between American and International Morse that continues to this day.","explanation":"Đoạn E gồm hai ý liên kết: trở thành standard ở châu Âu và xuất hiện các variations (American/International) sau khi sửa code cho ký tự khác. Heading vi bao quát cả hai.","trap":"Heading ix chỉ nói expansion; mặc dù có European adoption, phần sau về revisions/variants là thành phần lớn của đoạn, nên ‘Standard and variations’ chính xác hơn.","paraphrases":[{"question":"standard","passage":"adopted as the European standard"},{"question":"variations","passage":"split between American and International Morse"}]},{"q":33,"section":"Paragraph F","label":"F","answer":"v","answerText":"The emergence of many job opportunities","sourcePage":"26","evidence":"A distinct telegraphic subculture was emerging ... a hierarchy based on the speed at which operators could send and receive Morse code ... First-class operators ... secured the best-paid jobs in big cities ... rural operators ... found that their new-found skill was a passport to better pay in a city job.","explanation":"Đoạn F tập trung vào nghề telegraph operator, hệ thống thứ bậc nghề nghiệp, lương và khả năng thăng tiến. Heading v ‘emergence of many job opportunities’ bao quát phần lớn đoạn hơn heading ii.","trap":"Heading ii chỉ dựa vào chi tiết cuối rằng telegraphy was suitable work for women. Đây là một nhóm người trong bức tranh nghề nghiệp rộng hơn, không phải main idea toàn đoạn.","paraphrases":[{"question":"job opportunities","passage":"best-paid jobs / passport to better pay"},{"question":"emergence","passage":"telegraphic subculture was emerging"}]},{"q":34,"section":"Paragraph G","label":"G","answer":"ix","answerText":"International expansion of Morse Code","sourcePage":"26–27","evidence":"By the time of his death in 1872, the world was well and truly wired: more than 650,000 miles of telegraph line and 30,000 miles of submarine cable ... and 20,000 towns and villages were connected to the global network.","explanation":"Đoạn G dùng số liệu quy mô mạng lưới và ‘global network’ để cho thấy Morse/telegraph đã lan rộng quốc tế. Heading ix là khái quát phù hợp.","trap":"Heading v nói jobs, nhưng Paragraph G trọng tâm là scale/geographical reach của network, không phải employment.","paraphrases":[{"question":"international expansion","passage":"global network / 650,000 miles ... 20,000 towns and villages"},{"question":"expansion","passage":"world was well and truly wired"}]},{"q":35,"section":"Paragraph H","label":"H","answer":"vii","answerText":"Application of Morse code in a new technology","sourcePage":"27","evidence":"Morse code ... was about to be given a new lease of life thanks to another new technology: wireless. Following the invention of radiotelegraphy by Guglielmo Marconi in 1896, its potential for use at sea quickly became apparent.","explanation":"Paragraph H cho thấy Morse code được ứng dụng vào wireless/radiotelegraphy, một công nghệ mới giúp nó có ‘new lease of life’. Heading vii diễn đạt chính xác.","trap":"Heading x có chi tiết telephone/automatic telegraphs làm Morse telegraph mất vị thế, nhưng đoạn chuyển hướng ngay sang sự hồi sinh của Morse code trong wireless; ý kết luận của đoạn là ứng dụng mới.","paraphrases":[{"question":"new technology","passage":"wireless / radiotelegraphy"},{"question":"application of Morse code","passage":"new lease of life ... use at sea"}]}],"note":"","example":null},{"id":6,"title":"The evolutionary mystery: Crocodile survives","sourcePages":"PDF pages 31–35","instruction":"Reading Passage 2 has seven paragraphs, A–G. Choose the correct heading for paragraphs A–G from the list below.","intro":"","sections":[{"label":"A","text":"Crocodiles have been around for 200 million years, but they’re certainly not primitive. The early forms of crocodiles are known as Crocodilia. Since they spent most of their life beneath water, accordingly their body adapted to aquatic lifestyle. Due to the changes formed within their body shape and tendency to adapt according to the climate they were able to survive when most of the reptiles of their period are just a part of history. In their tenure on Earth, they’ve endured the impacts of meteors, planetary refrigeration, extreme upheavals of the Earth’s tectonic surface and profound climate change. They were around for the rise and fall of the dinosaurs, and even 65 million years of supposed mammalian dominance has failed to loosen their grip on the environments they inhabit. Today's crocodiles and alligators are little changed from their prehistoric ancestors, a telling clue that these reptiles were (and remain) extremely well adapted to their environment."},{"label":"B","text":"The first crocodile-like ancestors appeared about 230 million years ago, with many of the features that make crocs such successful stealth hunters already in place: streamlined body, long tail, protective armour and long jaws. They have long head and a long tail that helps them to change their direction in water while moving. They have four legs which are short and are webbed. Never underestimate their ability to move on ground. When they move they can move at such a speed that won't give you a second chance to make a mistake by going close to them especially when hungry. They can lift their whole body within seconds from ground. The fastest way by which most species can move is a sort of \"belly run\", where the body moves like a snake, members huddled to the side paddling away frenetically while the tail whips back and forth. When \"belly tunning\" Crocodiles can reach speeds up to 10 or 11 km/h (about 7 mph), and often faster if they are sliding down muddy banks. Other form of movement is their “high walk\", where the body is elevated above the ground."},{"label":"C","text":"Crocodilians have no lips. When submerged in their classic ‘sit and wait’ position, their mouths fill with water. The nostrils on the tip of the elongated snout lead into canals that run through bone to open behind the valve — allowing the crocodilian to breathe through its nostrils even though its mouth is under water. When the animal is totally submerged, another valve seals the nostrils, so the crocodilian can open its mouth to catch prey with no fear of drowning. The thin skin on the crocodilian head and face is covered with tiny, pigmented domes, forming a network of neural pressure receptors that can detect barely perceptible vibrations in the water. This enables a crocodile lying in silent darkness to suddenly throw its head sideways and grasp with deadly accuracy small prey moving close by."},{"label":"D","text":"Like other reptiles, crocodiles are endothermic animals (cold-blooded, or whose body temperature varies with the temperature of the surrounding environment) and, therefore, need to sunbathe, to raise the temperature of the body. On the contrary, if it is too hot, they prefer being in water or in the shade. Being a cold-blooded species, the crocodilian heart is unique in having an actively controlled valve that can redirect, at will, blood flow away from the lungs and recirculate it around the body, taking oxygen to where it’s needed most. In addition, their metabolism is a very slow one, so they can survive for long periods without feeding. Crocodiles are capable of slowing their metabolism even further allowing them to survive for a full year without feeding. Compared to mammals and birds, crocodilians have slow metabolisms that burn much less fuel, and are ideally suited to relatively unstable environments that would defeat mammals with their high food demands."},{"label":"E","text":"Crocodiles use a very effective technique to catch the prey. The prey remains almost unaware of the fact that there can be any crocodile beneath water. It is due to the fact that when the crocodile sees its prey it moves under water without making any noise and significant movement. It keeps only its eyes above water surface. When it feels it has reached sufficiently close to the target it whistles out of water with wide open jaws. 80 percent of their attempts are successful. They have very powerful jaws. Once the prey trapped in its jaws they swallow it. Their power can be judged from the fact they can kill the wild zebras which come to watery areas in search of water. They do not chew their food. They normally feed on small animals, big fish, birds and even human flesh. As like some water creatures that interact by making sounds crocodiles also use many sounds to communicate with other crocodiles. They exist where conditions have remained the same and they are free of human in
